<script>
const cards=[{"n": 1, "title": "FPが守るべき3つ", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、FPが守るべき3つですね。ここはまず名前を押さえましょう。」\n\nFP（ファイナンシャル・プランナー）の職業倫理として特に重要なのは、\n\n**① 顧客利益の優先**  \n**② 守秘義務の遵守**  \n**③ 説明義務の遵守**\n\nです。\n\n「……3つだけです。まずはここ、混ぜないでくださいね。」\n\n一言でまとめるなら、\n\n**『お客さんを優先する・秘密を守る・きちんと説明する』**\n\nです。\n\n---\n\n## B【詳しい解説｜それぞれ何を守るの？】\n\n「じゃあ、一個ずついきますよ。」\n\n### ① 顧客利益の優先\n\n「先輩、FPがお客さんに金融商品を紹介するとします。」\n\n「自分にたくさん報酬が入る商品と、お客さんに合っている商品が違ったら、どちらを優先するべきだと思います？」\n\n……\n\n「はい。**お客さんです。**」\n\nFP自身や会社の利益ではなく、**顧客の利益を優先して考える**ということですね。\n\n**FPの利益より顧客の利益**\n↓\n顧客に適した助言をする\n\n「まず①は**誰の利益を優先する？ → 顧客**です。」\n\n### ② 守秘義務の遵守\n\n「次です。FPって、お客さんのかなり深い情報まで知りますよね。」\n\n年収、資産、家族構成、保険、住宅ローン……。\n\n「それを『この前のお客さん、貯金3000万円あってさ』なんて他人に話したら？」\n\n「……ダメに決まってます。」\n\nつまり、**業務上知った顧客の秘密を、正当な理由なく第三者に漏らさない**ということです。\n\n「②は簡単ですね。」\n\n**知った秘密 → 勝手に漏らさない**\n\n### ③ 説明義務の遵守\n\n「最後です。」\n\n「FPが『これがおすすめです。とにかく契約してください』だけだったら困りますよね？」\n\nメリットだけではなく、商品や提案について**顧客が適切に判断できるよう必要な説明をする**ことが大切です。\n\n「たとえば投資商品なら、利益が期待できることだけ話して、損失の可能性を黙っていたら適切とはいえませんよね。」\n\nだから、\n\n**提案する**\n↓\n必要な情報を説明する\n↓\n顧客が理解・判断できるようにする\n\nということです。\n\n---\n\n## C【イメージ理解｜一回、想像してください】\n\n「先輩がFPに相談に行ったとしましょう。」\n\nFPが、\n\n「私の儲けより、先輩に合うものを考えます」\n→ **顧客利益の優先**\n\n「先輩の年収や資産の話は勝手に他人へ話しません」\n→ **守秘義務**\n\n「この商品のメリットだけじゃなく、注意点もきちんと説明します」\n→ **説明義務**\n\n「ほら。全部、**安心してFPに相談するためのルール**だと思えばつながるでしょう？」\n\n---\n\n## D【具体例｜実際に見てみましょう】\n\n「たとえば先輩の年収が500万円で、将来の資産形成について相談したとします。」\n\nFPが自分の手数料目当てで商品を勧める。\n→ **顧客利益の優先に反する**\n\n相談で知った年収を友人に話す。\n→ **守秘義務に反する**\n\n商品のリスクを十分説明せず勧める。\n→ **説明義務の問題**\n\n「はい。こうやって問題文を見たら、どの義務の話なのか分類してください。」\n\n### 30秒復習\n\n① 誰を優先する？  \n→ **顧客**\n\n② 顧客の秘密は？  \n→ **守る**\n\n③ 提案するときは？  \n→ **必要な説明をする**\n\n### 一文で覚える\n\n**「顧客を優先し、秘密を守り、きちんと説明する。」**\n\n「先輩、まずこの一文を覚えてください。そこから**顧客利益・守秘・説明**の3つが出てくれば大丈夫です。」\n"}, {"n": 2, "title": "キャッシュフロー表", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**キャッシュフロー表**ですね。」\n\n「名前だけ見ると難しそうですけど……やっていることはかなり単純です。」\n\n一言でいうと、\n\n**将来の家計の収入・支出・貯蓄残高を、年ごとに予測した表**\n\nです。\n\n「たとえば先輩が『5年後に車を買いたい』『10年後に家を買いたい』と思っても、そのときお金が足りるのか、今の状態だけ見ても分かりませんよね？」\n\n「そこで、未来のお金の流れを表にするんです。」\n\n**現在**\n↓\n1年後\n↓\n2年後\n↓\n3年後……\n\nと、家計がどう変化するかを見ていくわけですね。\n\n---\n\n## B【詳しい解説｜何が書かれているの？】\n\n「先輩、キャッシュフロー表を見るときは、まずこの流れを頭に入れてください。」\n\n**収入が入る**\n↓\n**支出が出ていく**\n↓\n**年間収支が決まる**\n↓\n**貯蓄残高が変わる**\n\n「ほら、そんなに複雑じゃないでしょう？」\n\nたとえば、\n\n収入500万円  \n↓  \n支出400万円  \n↓  \n年間収支＋100万円  \n↓  \n貯蓄が増える\n\nという感じです。\n\n「で、先輩。ここで一つ重要です。」\n\nキャッシュフロー表には、結婚・住宅購入・子どもの進学・退職などの**ライフイベント**も入れて考えます。\n\n「住宅を買う年だけ支出がドンと増える、とかですね。」\n\nだからキャッシュフロー表を見ることで、\n\n**「この計画のまま将来のお金は足りるのか？」**\n\nを確認できるわけです。\n\n---\n\n### 特にFP試験で重要な計算\n\n「ここ、試験で狙われやすいのでちゃんと見てくださいね。」\n\n#### ① 将来の収入・支出\n\n現在の金額 × **（1＋変動率）ⁿ**\n\nです。\n\n「え？ なんで毎年掛けるのか、ですか？」\n\n「たとえば給料が毎年2％ずつ上がるなら、翌年だけじゃなく、その次の年もさらに2％増えるからです。」\n\n現在400万円、毎年2％上昇なら、\n\n1年後  \n400 × 1.02 ＝ **408万円**\n\n2年後  \n400 × 1.02² ＝ **416.16万円**\n\nとなります。\n\n---\n\n#### ② 年間収支\n\nこれは簡単です。\n\n**年間収入 − 年間支出 ＝ 年間収支**\n\n「収入500万円、支出450万円なら？」\n\n……\n\n「そうです。」\n\n**＋50万円**ですね。\n\n---\n\n#### ③ 貯蓄残高\n\n「ここは少し注意してください。」\n\n基本的には、\n\n**前年の貯蓄残高 ×（1＋運用利率）＋その年の年間収支**\n\nで考えます。\n\nたとえば前年の貯蓄が500万円、運用利率2％、今年の年間収支が＋50万円なら、\n\n500 × 1.02 ＋ 50  \n＝ **560万円**\n\nです。\n\n「つまり、貯金そのものが運用で増えて、さらに今年余ったお金も加わるわけですね。」\n\n---\n\n## C【イメージ理解｜未来の家計簿です】\n\n「先輩、一回難しい名前を忘れてください。」\n\nキャッシュフロー表は、\n\n**『未来の家計簿』**\n\nだと思ってください。\n\nたとえば先輩が、\n\n「35歳で車を買う」  \n「40歳で住宅を買う」  \n「65歳で退職する」\n\nと計画しているとします。\n\n「その予定を未来のカレンダーに置いて、その横に毎年の収入・支出・貯金を書いていく感じです。」\n\nすると、\n\n> 「あれ？ 40歳で家を買ったら貯蓄がほとんどなくなる……」\n\nみたいなことが事前に見えてきます。\n\n「だからFPは、未来のお金を**見える化**するためにキャッシュフロー表を使うんです。」\n\n---\n\n## D【具体例｜数字で見ましょう】\n\n「じゃあ先輩、かなり簡単な例です。」\n\n現在の貯蓄が**300万円**。\n\n今年の収入が**500万円**、支出が**400万円**だったとします。\n\n「年間収支はいくらです？」\n\n……\n\n**500 − 400 ＝ ＋100万円**\n\nですね。\n\n運用を考えなければ、\n\n**300＋100＝400万円**\n\nなので、年末の貯蓄残高は**400万円**。\n\nでも翌年に車を200万円で買ったら？\n\n「そうです。支出が一気に増れますよね。」\n\nこうやって、\n\n**収入**\n↓\n**通常の支出**\n↓\n**ライフイベントによる支出**\n↓\n**年間収支**\n↓\n**貯蓄残高**\n\nを将来にわたって追跡するわけです。\n\n---\n\n## 【理解確認】\n\n「はい、先輩。本当に分かったか3問です。」\n\n**Q1. キャッシュフロー表は何を見る表？**\n\n→ 将来の**収入・支出・貯蓄残高**などを見る表。\n\n**Q2. 年間収支は？**\n\n→ **年間収入 − 年間支出**\n\n**Q3. 収入が毎年2％増える場合、2年後はどう計算する？**\n\n→ **現在の収入 × 1.02²**\n\n「はい。ここまで出てくればかなり大丈夫です。」\n\n## 【30秒復習】\n\n① 何の話？  \n→ **将来の家計を予測する表**\n\n② 何を見る？  \n→ **収入・支出・年間収支・貯蓄残高**\n\n③ 何のため？  \n→ **将来のお金が足りるか確認するため**\n\n④ 年間収支は？  \n→ **収入 − 支出**\n\n⑤ 将来の金額は？  \n→ **現在額 ×（1＋変動率）ⁿ**\n\n⑥ ライフイベントは？  \n→ **結婚・住宅・教育・退職なども反映する**\n\n### 【一文で覚える】\n\n**キャッシュフロー表＝「将来の収入・支出・貯蓄を年ごとに予測する、未来の家計簿」。**\n\n「先輩、まずは**『未来の家計簿』**で覚えてください。そこから収入→支出→年間収支→貯蓄残高まで思い出せれば、ちゃんとつながります。」\n"}, {"n": 3, "title": "終価係数", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**終価係数**ですね。」\n\n「6つの係数がありますけど、いきなり公式を全部覚えようとしないでください。……絶対ごちゃごちゃになりますから。」\n\n終価係数を一言でいうと、\n\n**「今あるお金を、複利で運用したら将来いくらになる？」を求める係数**\n\nです。\n\nたとえば、\n\n> 「今100万円あります。年利2％で5年間運用したら、5年後はいくら？」\n\nこういう問題で使います。\n\n**今のお金 → 将来のお金**\n\n「まず、この矢印だけ覚えてください。」\n\n---\n\n## B【詳しい解説｜なぜ増えるの？】\n\n「先輩、100万円を年利2％で運用するとしましょう。」\n\n1年後は？\n\n**100万円 × 1.02 ＝ 102万円**\n\n「はい。ここまでは大丈夫ですよね。」\n\n「じゃあ2年目。元の100万円にまた2％を掛ける……ではありませんよ？」\n\n1年目で102万円になっています。\n\nだから、\n\n**102万円 × 1.02 ＝ 104.04万円**\n\nです。\n\n「つまり、増えた利息にもさらに利息がつく。これが**複利**です。」\n\nなので5年間なら、\n\n**100万円 × 1.02⁵**\n\nとなります。\n\nこの、\n\n**（1＋利率）ⁿ**\n\nの部分が**終価係数**です。\n\n### 流れで見ると\n\n現在の元本  \n↓  \n利息がつく  \n↓  \nその利息にも利息がつく  \n↓  \n複利で増えていく  \n↓  \n将来の金額になる\n\n「だから『終価』なんです。」\n\n**終わり＝将来時点の価値**を求める、と考えると分かりやすいですよ。\n\n---\n\n## C【イメージ理解｜一回、想像してください】\n\n「先輩、100万円を箱に入れて銀行に預けたと思ってください。」\n\n今、\n\n💰 **100万円**\n\nあります。\n\n「これを5年間育てるんです。」\n\n100万円  \n→ 102万円  \n→ 104.04万円  \n→ ……  \n→ 5年後の金額\n\n「つまり終価係数って、**今のお金を未来まで成長させる係数**なんですよ。」\n\n「え？ 現価係数と何が違うのか、ですか？」\n\n「はい、そこです。ここはFPでかなり大事です。」\n\n**終価係数**  \n現在 → 未来\n\n**現価係数**  \n未来 → 現在\n\n「完全に矢印が逆です。」\n\n### 終価\n**100万円 → 5年後はいくら？**\n\n### 現価\n**5年後の100万円 → 今いくら用意すればいい？**\n\n「この矢印で区別してください。」\n\n---\n\n## D【具体例｜実際に数字で見ましょう】\n\n「では先輩、問題です。」\n\n現在**100万円**あります。\n\n年利**2％**で5年間、複利運用します。\n\n5年後はいくらでしょう？\n\n終価係数は、\n\n**1.02⁵ ≒ 1.1041**\n\nです。\n\nだから、\n\n**100万円 × 1.1041  \n＝ 110万4,100円**\n\n「つまり約110万円ですね。」\n\n---\n\n「じゃあ先輩、ここで問題文の見分け方です。」\n\n> 現在100万円を年利2％で運用した場合、5年後はいくらになるか。\n\n「どっち向きです？」\n\n**現在 → 未来**\n\n「そうです。」\n\nだから**終価係数**です。\n\n---\n\n## 【理解確認】\n\n「はい、3問だけです。」\n\n**Q1. 終価係数は何を求める？**\n\n→ **現在のお金が将来いくらになるか**\n\n**Q2. お金の時間の向きは？**\n\n→ **現在 → 未来**\n\n**Q3. 100万円を運用して将来120万円になる、という問題なら？**\n\n→ **終価係数**\n\n「はい。ここまで分かれば大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 何の話？  \n→ **今のお金の将来価値**\n\n② 何を求める？  \n→ **将来いくらになるか**\n\n③ なぜ増える？  \n→ **複利で運用するから**\n\n④ 向きは？  \n→ **現在 → 未来**\n\n⑤ 計算は？  \n→ **現在の金額 × 終価係数**\n\n⑥ 間違えやすいものは？  \n→ **現価係数**\n\n---\n\n### 【一文で覚える】\n\n**終価係数＝「今あるお金を運用したら、将来いくらになる？」**\n\n「先輩、**『終価＝今→未来』**です。」\n\n**現在 ──終価係数──→ 未来**\n\n「6係数は名前だけ暗記するより、この矢印で覚えたほうが混乱しません。次に**現価係数**を見ると、違いがかなりはっきりしますよ。」\n"}, {"n": 4, "title": "現価係数", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**現価係数（げんかけいすう）**ですね。」\n\n「さっきの終価係数とセットで覚えると、かなり楽です。」\n\n一言でいうと、\n\n**「将来ほしい金額を用意するには、今いくらあればいい？」を求める係数**\n\nです。\n\nたとえば、\n\n> 「5年後に100万円ほしい。年利2％で運用できるなら、今いくら預ければいい？」\n\nこういう問題です。\n\n**未来のお金 → 現在のお金**\n\n「はい。さっきと逆ですよ。」\n\n- 終価係数：**現在 → 未来**\n- 現価係数：**未来 → 現在**\n\n---\n\n## B【詳しい解説｜なぜ金額が小さくなるの？】\n\n「先輩、ここでたぶん疑問が出ますよね。」\n\n「5年後に100万円ほしいのに、なんで今100万円用意しなくていいの？」\n\n「そこです。」\n\n今から運用すれば、**利息でお金が増える**からです。\n\nたとえば、ものすごく単純に、\n\n今90万円  \n↓  \n運用する  \n↓  \n利息がつく  \n↓  \n将来100万円\n\nとなるなら、\n\n「最初から100万円はいりませんよね？」\n\n必要なのは**90万円**です。\n\nつまり、\n\n**将来必要な金額**\n↓\n**運用で増える分を逆算する**\n↓\n**今必要な金額を求める**\n\nこれが現価係数です。\n\n---\n\n### 「現価」って何？\n\n「名前も分解しましょう。」\n\n**現価＝現在の価値**\n\nです。\n\n「将来の100万円を、現在の価値に戻して考えるんですね。」\n\nだから公式は、\n\n**現価係数 ＝ 1 ÷（1＋利率）ⁿ**\n\nになります。\n\n「……公式だけ見ると嫌になりますよね。」\n\n「でも意味は単純です。」\n\n終価係数が、\n\n**今のお金を未来へ送る**\n\nのに対して、\n\n現価係数は、\n\n**未来のお金を現在へ戻す**\n\nんです。\n\n---\n\n## C【イメージ理解｜時間を巻き戻します】\n\n「先輩、一回想像してください。」\n\n5年後の先輩が、\n\n💰「100万円必要！」\n\nと言っています。\n\n「じゃあ今の先輩はいくら用意すればいいでしょう？」\n\n100万円全部？\n\n「いえ。5年間運用できますよね。」\n\nそこで、\n\n**5年後：100万円**\n\nから時間を巻き戻します。\n\n未来100万円  \n⬅︎ 運用分を逆算  \n⬅︎ 運用分を逆算  \n⬅︎ ……  \n**現在：約90万円**\n\n「こんなイメージです。」\n\n### 終価係数と並べると\n\n**終価係数**\n\n今100万円  \n→→→→→  \n未来110万円\n\n**現価係数**\n\n今？万円  \n←←←←←  \n未来100万円\n\n「先輩、この**矢印の向き**を覚えてください。」\n\n---\n\n## D【具体例｜実際に数字で見ましょう】\n\n「では実際にやりますよ。」\n\n5年後に**100万円**必要です。\n\n年利2％で複利運用できるとします。\n\n現価係数は、\n\n**1 ÷ 1.02⁵ ≒ 0.9057**\n\nです。\n\nなので、\n\n**100万円 × 0.9057  \n＝ 90万5,700円**\n\n「つまり今、約90万6千円を用意して運用すれば、5年後に約100万円になるということです。」\n\n---\n\n「じゃあ問題文を見てください。」\n\n> 年利2％で運用して、5年後に100万円を用意するためには、現在いくら必要か。\n\n「どっち向きです？」\n\n5年後100万円  \n↓  \n現在はいくら？\n\n「そうです。」\n\n**未来 → 現在**\n\nだから**現価係数**です。\n\n---\n\n## 【理解確認】\n\n「先輩、3問です。」\n\n**Q1. 現価係数は何を求める？**\n\n→ 将来必要な金額に対して、**今いくら必要か**\n\n**Q2. 時間の向きは？**\n\n→ **未来 → 現在**\n\n**Q3.『10年後に500万円ほしい。今いくら用意する？』なら？**\n\n→ **現価係数**\n\n「はい。ここまでなら大丈夫ですね。」\n\n---\n\n## 【30秒復習】\n\n① 何の話？  \n→ **将来のお金の現在価値**\n\n② 何を求める？  \n→ **今いくら必要か**\n\n③ なぜ将来の金額より少なくていい？  \n→ **運用で増えるから**\n\n④ 向きは？  \n→ **未来 → 現在**\n\n⑤ 計算は？  \n→ **将来の金額 × 現価係数**\n\n⑥ 間違えやすいのは？  \n→ **終価係数**\n\n---\n\n# 【一文で覚える】\n\n**現価係数＝「将来この金額がほしい。じゃあ今いくら必要？」**\n\n「先輩、終価係数との違いはこれだけです。」\n\n**終価係数：今ある100万円 → 将来いくら？**\n\n**現価係数：将来100万円ほしい → 今いくら？**\n\n「**今→未来なら終価、未来→今なら現価。**」\n\n「まずこの2つを完全に区別してから、残りの4係数に進みましょう。ここを曖昧にすると……あとで6人全員同じ顔に見えてきますから。」\n"}, {"n": 5, "title": "年金終価係数", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**年金終価係数（ねんきんしゅうかけいすう）**ですね。」\n\n「ここから名前が長くなりますけど、身構えなくて大丈夫です。」\n\n一言でいうと、\n\n**「毎年同じ金額を積み立てたら、将来いくら貯まる？」**\n\nを求める係数です。\n\nたとえば、\n\n> 毎年100万円ずつ、5年間積み立てる。  \n> 年利2％で運用したら、5年後にいくらになる？\n\nこういうときに使います。\n\n「さっきの**終価係数**との違い、分かります？」\n\n**終価係数**  \n→ 今あるお金を運用する\n\n**年金終価係数**  \n→ 毎年お金を積み立てて運用する\n\n「はい。ここが一番大事です。」\n\n---\n\n## B【詳しい解説｜なぜ「年金」が付くの？】\n\n「先輩、『年金』って書いてあるから、老後にもらう年金専用だと思ってません？」\n\n「……違いますよ。」\n\nここでいう**年金**は、\n\n**一定期間、毎年一定額のお金を受け取ったり支払ったりするもの**\n\nという意味です。\n\nだから年金終価係数は、積立貯金の計算にも使えます。\n\n「じゃあ、毎年100万円を積み立てるとしましょう。」\n\n1年目の100万円は、長く運用できます。\n\nでも最後の年に入れた100万円は？\n\n「そうです。運用できる期間が短いですよね。」\n\nつまり、それぞれの100万円で**利息がつく期間が違う**んです。\n\nそれを一つずつ計算するのは面倒ですよね。\n\n「そこで年金終価係数の出番です。」\n\n**毎年の積立額 × 年金終価係数**\n\nこれだけで、最終的な積立額を計算できます。\n\n### 流れにすると\n\n毎年一定額を積み立てる  \n↓  \nそれぞれのお金に利息がつく  \n↓  \n複利で増える  \n↓  \n全部合計する  \n↓  \n**将来の積立総額**\n\n「だから名前も、**年金＋終価**なんですよ。」\n\n**年金＝毎年一定額**\n\n**終価＝将来の金額**\n\n「名前にちゃんと意味が入ってます。」\n\n---\n\n## C【イメージ理解｜貯金箱に毎年入れていく】\n\n「先輩、貯金箱を想像してください。」\n\n毎年100万円ずつ入れます。\n\n1年目  \n💰100万円\n\n2年目  \n💰100万円追加\n\n3年目  \n💰100万円追加\n\n4年目  \n💰100万円追加\n\n5年目  \n💰100万円追加\n\n「普通なら合計500万円ですよね。」\n\n「でも、この貯金箱の中のお金には**利息がつく**としたら？」\n\n……\n\n「そうです。500万円より多くなります。」\n\nその、\n\n**毎年100万円積立  \n→ 運用  \n→ 5年後いくら？**\n\nを一発で計算するのが**年金終価係数**です。\n\n---\n\n### 終価係数と混ぜないでください\n\n「先輩、ここ重要ですよ。」\n\n#### 終価係数\n\n最初に100万円を**1回だけ**入れる。\n\n**100万円**\n→→→→→\n**将来いくら？**\n\n#### 年金終価係数\n\n100万円を**毎年入れる**。\n\n**100万円＋100万円＋100万円＋……**\n→→→\n**将来合計いくら？**\n\n「『一括で運用』なのか『積み立て』なのかを見てください。」\n\n---\n\n## D【具体例｜実際に数字で見ましょう】\n\n「じゃあ先輩、問題です。」\n\n毎年**100万円**を、年利2％で**5年間**積み立てます。\n\n5年間の年金終価係数を仮に**5.2040**とすると、\n\n**100万円 × 5.2040  \n＝ 520万4,000円**\n\nです。\n\n「元本だけなら？」\n\n100万円 × 5年  \n＝ **500万円**\n\nですよね。\n\nでも運用しているので、\n\n**約520万円**\n\nになりました。\n\n「この『毎年積み立てたお金が、最後にいくらになった？』を求めているわけです。」\n\n---\n\n## 【3つを並べて整理】\n\n「先輩、今までの3つを一度並べましょう。ここで整理すると後が楽です。」\n\n| 係数 | 聞かれていること | イメージ |\n|---|---|---|\n| **終価係数** | 今あるお金→将来いくら？ | 一括運用 |\n| **現価係数** | 将来ほしいお金→今いくら必要？ | 逆算 |\n| **年金終価係数** | 毎年積立→将来いくら？ | 積立 |\n\n「特に**終価係数と年金終価係数**の違いですよ。」\n\n**1回だけ入れる → 終価係数**\n\n**毎年入れる → 年金終価係数**\n\n---\n\n## 【理解確認】\n\n「はい、先輩。3問です。」\n\n**Q1. 毎年50万円を10年間積み立てたら、最後にいくらになる？**\n\n→ **年金終価係数**\n\n**Q2. 今ある50万円を10年間運用したらいくら？**\n\n→ **終価係数**\n\n**Q3. 年金終価係数の計算は？**\n\n→ **毎年の積立額 × 年金終価係数**\n\n「はい。この区別ができれば大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 何を求める？  \n→ **積立後の将来金額**\n\n② お金はいつ入れる？  \n→ **毎年一定額**\n\n③ 計算は？  \n→ **毎年の積立額 × 年金終価係数**\n\n④ 「年金」のイメージは？  \n→ **毎年一定額**\n\n⑤ 「終価」は？  \n→ **将来の価値**\n\n⑥ 終価係数との違いは？  \n→ **一括か積立か**\n\n# 【一文で覚える】\n\n**年金終価係数＝「毎年コツコツ積み立てたら、最後にいくら貯まる？」**\n\n「先輩、名前を分解してください。」\n\n**年金（毎年）＋終価（将来）**\n\n「つまり――」\n\n**毎年 → 毎年 → 毎年 → 💰将来いくら？**\n\n「これが年金終価係数です。『終価係数は一括、年金終価係数は積立』。ここは絶対に分けておきましょう。」\n"}, {"n": 6, "title": "減債基金係数", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**減債基金係数（げんさいききんけいすう）**ですね。」\n\n「……名前、急に怖くなりましたよね。でもやっていることは単純です。」\n\n一言でいうと、\n\n**「将来○万円を貯めるためには、毎年いくら積み立てればいい？」**\n\nを求める係数です。\n\nたとえば、\n\n> 5年後に500万円ほしい。  \n> 年利2％で運用しながら貯めるなら、毎年いくら積み立てればいい？\n\nこういう問題です。\n\n「先輩、さっきの**年金終価係数**を思い出してください。」\n\n**年金終価係数**  \n毎年100万円積立 → 将来いくら？\n\n**減債基金係数**  \n毎年？万円積立 ← 将来500万円\n\n「はい。**逆なんです。**」\n\n---\n\n## B【詳しい解説｜何を逆算しているの？】\n\n「5年後に500万円必要だとします。」\n\n「じゃあ毎年100万円ずつ貯めればいい？」\n\n……ちょっと待ってください。\n\n運用するなら、積み立てたお金には**利息**がつきますよね。\n\nだったら、\n\n100万円 × 5年＝500万円\n\nと単純に積み立てなくても、500万円に到達できます。\n\n「じゃあ毎年いくら積み立てればいいの？」\n\n「それを逆算するのが**減債基金係数**です。」\n\n**将来必要な金額**\n↓\n**運用利率・期間を考える**\n↓\n**毎年必要な積立額を逆算する**\n\n計算は、\n\n**将来必要な金額 × 減債基金係数  \n＝ 毎年の積立額**\n\nです。\n\n---\n\n## 「減債基金」って何？\n\n「先輩、名前の意味も一応押さえておきましょう。」\n\nもともとのイメージは、**将来の債務返済に備えて、毎年少しずつ資金を積み立てる**ことです。\n\n「将来いきなり大金を用意するんじゃなくて、今からコツコツ準備するわけですね。」\n\nだからFPでは、\n\n**目標額を決める**\n→ **毎年いくら積み立てる必要があるか逆算する**\n\nという計算に使います。\n\n---\n\n## C【イメージ理解｜旅行貯金で考えましょう】\n\n「先輩、一回FPの言葉から離れますよ。」\n\n「5年後に**100万円の旅行**に行くとします。」\n\n現在、\n\n🧍「5年後に100万円ほしい！」\n\nでも、\n\n🧍「毎年いくら貯金すればいいんだ……？」\n\nとなりますよね。\n\nそこで減債基金係数です。\n\n**5年後100万円**\n↓\n「毎年いくら？」\n↓\n毎年○万円\n↓\n毎年○万円\n↓\n毎年○万円\n↓\n……\n↓\n**5年後100万円達成**\n\n「これだけです。」\n\n---\n\n## D【具体例｜数字で見ましょう】\n\n「じゃあ実際にやります。」\n\n5年後に**500万円**を用意したい。\n\n年利2％で運用するとします。\n\n仮に減債基金係数が**0.1922**なら、\n\n**500万円 × 0.1922  \n＝ 96万1,000円**\n\nつまり、\n\n**毎年約96.1万円**\n\n積み立てればいいことになります。\n\n「え？ 500万円÷5年なら100万円なのに、なんで96万円くらいでいいの？」\n\n「はい。そこに気づいてほしかったんです。」\n\n**運用益が加わるから**ですね。\n\n毎年約96.1万円  \n↓\n積み立てながら運用  \n↓\n利息もつく  \n↓\n5年後約500万円\n\nとなるわけです。\n\n---\n\n## 【年金終価係数との違い】\n\n「先輩、ここはセットで覚えてください。」\n\n### 年金終価係数\n\n**毎年100万円積み立てる**\n\n↓\n\n「5年後、いくらになる？」\n\n**毎年の積立額 → 将来の金額**\n\n### 減債基金係数\n\n**5年後に500万円ほしい**\n\n↓\n\n「毎年いくら積み立てる？」\n\n**将来の金額 → 毎年の積立額**\n\n「ほら。完全に逆でしょう？」\n\n### ここまでの4係数\n\n| 係数 | 一言でいうと |\n|---|---|\n| **終価係数** | 今のお金 → 将来いくら？ |\n| **現価係数** | 将来の金額 → 今いくら？ |\n| **年金終価係数** | 毎年積立 → 将来いくら？ |\n| **減債基金係数** | 将来の目標額 → 毎年いくら積立？ |\n\n「先輩、6係数を丸暗記するより、この**矢印**を覚えた方がずっと楽です。」\n\n---\n\n## 【理解確認】\n\n「はい、3問です。」\n\n**Q1. 10年後に1,000万円作るため、毎年いくら積み立てる？**\n\n→ **減債基金係数**\n\n**Q2. 毎年50万円積み立てて、10年後にいくらになる？**\n\n→ **年金終価係数**\n\n**Q3. 減債基金係数の計算は？**\n\n→ **将来の目標額 × 減債基金係数**\n\n「あ、ここで年金終価係数と逆になっていれば大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 何を求める？  \n→ **毎年の積立額**\n\n② 何が分かっている？  \n→ **将来の目標額**\n\n③ 計算は？  \n→ **目標額 × 減債基金係数**\n\n④ なぜ単純な割り算より少なくなる？  \n→ **運用益があるから**\n\n⑤ 何とセット？  \n→ **年金終価係数**\n\n⑥ 両者の関係は？  \n→ **逆**\n\n# 【一文で覚える】\n\n**減債基金係数＝「将来○万円ほしい。じゃあ毎年いくら積み立てる？」**\n\n「先輩、これで覚えてください。」\n\n**年金終価：毎年いくら → 最後いくら？**\n\n**減債基金：最後いくら → 毎年いくら？**\n\n「……名前は難しいですけど、中身はこれだけです。**『ゴールから毎年の積立額を逆算』**。ここが出てくれば大丈夫ですよ。」\n"}, {"n": 7, "title": "資本回収係数", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**資本回収係数（しほんかいしゅうけいすう）**ですね。」\n\n「名前を見ると『資本を回収……？』ってなりますけど、6係数の中ではパターンを掴めば簡単です。」\n\n一言でいうと、\n\n**「今あるお金を運用しながら、一定期間で取り崩すと、毎年いくら受け取れる？」**\n\nを求める係数です。\n\nたとえば、\n\n> 1,000万円を年利2％で運用しながら10年間取り崩す。  \n> 毎年いくら受け取れる？\n\nこういう問題です。\n\n**今ある1,000万円 → 毎年いくら受け取れる？**\n\n「まず、この矢印を覚えてください。」\n\n---\n\n## B【詳しい解説｜どういうこと？】\n\n「先輩、定年退職して、手元に1,000万円あるとしましょう。」\n\n「これを10年間で使うなら、単純に考えると？」\n\n……\n\nそうですね。\n\n**1,000万円 ÷ 10年 ＝ 毎年100万円**\n\nです。\n\n「でも、ちょっと待ってください。」\n\nその1,000万円、ただ置いておく必要はありませんよね。\n\n**残っているお金を運用しながら取り崩す**ことができます。\n\nたとえば、\n\n1,000万円  \n↓  \n一部を受け取る  \n↓  \n残ったお金は運用  \n↓  \n利息がつく  \n↓  \n翌年また一部を受け取る  \n↓  \n……\n\n「ということは、単純に10で割るのとは違ってきますよね。」\n\nそこで使うのが、\n\n**資本回収係数**\n\nなんです。\n\n計算は、\n\n**現在の金額 × 資本回収係数  \n＝ 毎年受け取れる金額**\n\nです。\n\n---\n\n## 「資本回収」ってどういう意味？\n\n「ここ、名前から理解しましょう。」\n\n**資本**\n＝ 最初に持っているお金\n\nそれを毎年少しずつ、\n\n**回収**\n＝ 受け取っていく\n\nというイメージです。\n\nだから、\n\n**現在まとまったお金がある**\n↓\n**運用しながら取り崩す**\n↓\n**毎年一定額を受け取る**\n\nこれが資本回収係数です。\n\n---\n\n## C【イメージ理解｜退職金で考えましょう】\n\n「先輩、60歳になって退職金として**2,000万円**を受け取ったとしましょう。」\n\n「これを20年間の生活費として使いたい。」\n\nでも、\n\n> 「毎年いくらずつ使えば20年間もつんだろう？」\n\nってなりますよね。\n\nそこで、\n\n💰2,000万円  \n↓  \n毎年○万円  \n↓  \n毎年○万円  \n↓  \n毎年○万円  \n↓  \n……  \n↓  \n20年後に使い切る\n\n「この**○万円**を求めるのが資本回収係数です。」\n\nしかも残っているお金には運用益がつく。\n\n「だから単純に『2,000万円÷20』するだけじゃないんですね。」\n\n---\n\n## D【具体例｜数字で確認しましょう】\n\n「では先輩、1,000万円を持っているとします。」\n\nこれを年利2％で運用しながら、10年間で取り崩します。\n\n仮に資本回収係数が**0.1113**なら、\n\n**1,000万円 × 0.1113  \n＝ 111万3,000円**\n\nつまり、\n\n**毎年約111万円**\n\n受け取れる計算です。\n\n「先輩、単純に10で割ったら？」\n\n**100万円**ですよね。\n\nでも今回は残った資金を運用しています。\n\nだから、\n\n**元本＋運用益**\n\nを10年間で取り崩せるので、毎年約111万円受け取れるわけです。\n\n「はい。ここまでつながれば、丸暗記しなくても大丈夫です。」\n\n---\n\n# 【現価係数と混ぜないでください】\n\n「先輩、たぶんここで『現価係数と何が違うんだ？』ってなってきますよね。」\n\n違いは**一括か毎年か**です。\n\n### 現価係数\n\n将来**100万円を1回**受け取りたい。\n\n**将来100万円 → 今いくら必要？**\n\n### 資本回収係数\n\n今**1,000万円**持っている。\n\n**今1,000万円 → 毎年いくら受け取れる？**\n\n「資本回収は、まとまった現在のお金を**毎年のお金に変換する**イメージです。」\n\n---\n\n## 【ここまでの5係数を整理】\n\n「先輩、もう5個まで来ましたよ。一回整理します。」\n\n| 係数 | 問題を一言にすると |\n|---|---|\n| **終価係数** | 今あるお金 → 将来いくら？ |\n| **現価係数** | 将来ほしい金額 → 今いくら？ |\n| **年金終価係数** | 毎年積立 → 将来いくら？ |\n| **減債基金係数** | 将来の目標額 → 毎年いくら積立？ |\n| **資本回収係数** | 今あるお金 → 毎年いくら受取？ |\n\n「ここ、気づきました？」\n\n**年金終価 ↔ 減債基金**\n\nは逆の関係でした。\n\nそして最後に出てくる**年金現価係数**と、\n\n**年金現価 ↔ 資本回収**\n\nも逆の関係になります。\n\n「6個バラバラに覚える必要はないんです。」\n\n---\n\n## 【理解確認】\n\n「はい、3問ですよ。」\n\n**Q1. 退職金2,000万円を20年間で取り崩す。毎年いくら受け取れる？**\n\n→ **資本回収係数**\n\n**Q2. 資本回収係数では何が分かっている？**\n\n→ **現在のまとまった金額**\n\n**Q3. 何を求める？**\n\n→ **毎年受け取れる金額**\n\n「はい。それが出れば大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 何を求める？  \n→ **毎年の受取額**\n\n② 最初に何がある？  \n→ **現在のまとまったお金**\n\n③ どうする？  \n→ **運用しながら取り崩す**\n\n④ 計算は？  \n→ **現在の金額 × 資本回収係数**\n\n⑤ 代表的なイメージは？  \n→ **退職金の取り崩し**\n\n⑥ 何と逆の関係？  \n→ **年金現価係数**\n\n# 【一文で覚える】\n\n**資本回収係数＝「今このお金がある。運用しながら取り崩したら、毎年いくら受け取れる？」**\n\n「先輩、これだけ残してください。」\n\n**💰今まとまったお金  \n↓  \n毎年いくら？  \n↓  \n💵 💵 💵 💵 💵**\n\n「**一括のお金を、毎年のお金に変える。**」\n\n「これが資本回収係数です。あと**年金現価係数**まで行けば、6係数が全部つながりますよ。」\n"}, {"n": 8, "title": "年金現価係数", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、これで6つ目。**年金現価係数（ねんきんげんかけいすう）**です。」\n\n「名前はややこしいですけど、さっきの**資本回収係数の逆**だと思えばかなり楽ですよ。」\n\n一言でいうと、\n\n**「毎年○万円を受け取りたい。そのためには今いくら必要？」**\n\nを求める係数です。\n\nたとえば、\n\n> 今後10年間、毎年100万円ずつ受け取りたい。  \n> 年利2％で運用するとしたら、今いくら用意すればいい？\n\nという問題ですね。\n\n**毎年100万円を受け取りたい → 今いくら必要？**\n\n「はい。この向きです。」\n\n---\n\n## B【詳しい解説｜なぜ単純な掛け算じゃないの？】\n\n「先輩、10年間、毎年100万円必要だとしましょう。」\n\n単純に考えたら、\n\n**100万円 × 10年＝1,000万円**\n\nですよね。\n\n「じゃあ今1,000万円必要……と思いました？」\n\n「ちょっと待ってください。」\n\nそのお金、10年間ずっと現金で置いておくわけではありません。\n\n**残っているお金を運用できる**んです。\n\nつまり、\n\n今まとまったお金を用意  \n↓  \n運用する  \n↓  \n毎年100万円受け取る  \n↓  \n残ったお金は引き続き運用  \n↓  \n翌年また100万円受け取る  \n↓  \n……\n\nとなります。\n\n「だったら、最初から1,000万円全部なくてもよさそうですよね？」\n\nそうなんです。\n\nそこで、\n\n**毎年受け取りたい金額 × 年金現価係数  \n＝ 現在必要な金額**\n\nとして計算します。\n\n---\n\n## 「年金現価」を分解しましょう\n\n「先輩、名前だけでかなり判断できますよ。」\n\n### 年金\n→ **毎年一定額**\n\n### 現価\n→ **現在の価値**\n\nだから、\n\n**年金現価**\n\n＝\n\n**毎年のお金を、現在のまとまった金額に直す**\n\nということです。\n\n「ほら。名前の意味が分かると、そんなに怖くないでしょう？」\n\n---\n\n## C【イメージ理解｜老後の生活費で考えます】\n\n「先輩、退職後の生活を想像してください。」\n\nこれから10年間、\n\n💵 1年目：100万円  \n💵 2年目：100万円  \n💵 3年目：100万円  \n💵 4年目：100万円  \n……  \n💵 10年目：100万円\n\nを受け取りたい。\n\n「じゃあ退職時点で、いくら用意しておけばいいんでしょう？」\n\nここで年金現価係数です。\n\n**💵 💵 💵 💵 💵……**\n  \n↓ 現在にまとめる\n\n**💰今いくら必要？**\n\n「これが年金現価係数です。」\n\n---\n\n## D【具体例｜実際に数字で見ましょう】\n\n「では数字で確認しますよ。」\n\n今後10年間、毎年**100万円**を受け取りたい。\n\n年利2％で運用するとします。\n\n仮に年金現価係数が**8.9826**なら、\n\n**100万円 × 8.9826  \n＝ 898万2,600円**\n\nです。\n\n「先輩、10年間で受け取る総額はいくらでした？」\n\n**100万円 × 10年＝1,000万円**\n\nですよね。\n\nでも今必要なのは約**898万円**。\n\n「なんで少なくていいんでした？」\n\n……\n\n「はい。**残っている資金を運用できるから**です。」\n\n約898万円  \n↓\n運用しながら  \n↓\n毎年100万円  \n↓\n毎年100万円  \n↓\n……  \n↓\n10年間受け取る\n\nということですね。\n\n---\n\n# 【資本回収係数との違い】\n\n「ここが今回一番大事ですよ。」\n\n### 資本回収係数\n\n**今1,000万円あります。**\n\n「毎年いくら受け取れる？」\n\n**今の一括金額 → 毎年の受取額**\n\n---\n\n### 年金現価係数\n\n**毎年100万円受け取りたいです。**\n\n「今いくら必要？」\n\n**毎年の受取額 → 今の一括金額**\n\n「……見えました？」\n\n**完全に逆です。**\n\n---\n\n# 【これで6係数全部です】\n\n「先輩、ここまで来たので全部並べますよ。」\n\n| 係数 | 一言でいうと |\n|---|---|\n| **終価係数** | 今100万円 → 将来いくら？ |\n| **現価係数** | 将来100万円 → 今いくら？ |\n| **年金終価係数** | 毎年積立 → 将来いくら？ |\n| **減債基金係数** | 将来○万円 → 毎年いくら積立？ |\n| **資本回収係数** | 今○万円 → 毎年いくら受取？ |\n| **年金現価係数** | 毎年○万円受取 → 今いくら必要？ |\n\n「先輩、6個をバラバラに暗記しないでください。」\n\n実は**3組のペア**です。\n\n**終価 ↔ 現価**\n\n今 → 未来  \n未来 → 今\n\n**年金終価 ↔ 減債基金**\n\n毎年 → 未来  \n未来 → 毎年\n\n**資本回収 ↔ 年金現価**\n\n今 → 毎年  \n毎年 → 今\n\n「これならかなり整理できますよね。」\n\n---\n\n## 【理解確認】\n\n「はい。最後に3問です。」\n\n**Q1. 退職後20年間、毎年200万円を受け取りたい。退職時にいくら必要？**\n\n→ **年金現価係数**\n\n**Q2. 退職時に2,000万円ある。20年間なら毎年いくら受け取れる？**\n\n→ **資本回収係数**\n\n**Q3. 年金現価係数は何を何に変換する？**\n\n→ **毎年の一定額 → 現在の一括金額**\n\n「はい。Q1とQ2を区別できたら十分です。」\n\n---\n\n## 【30秒復習】\n\n① 何を求める？  \n→ **現在必要な金額**\n\n② 何が分かっている？  \n→ **毎年受け取りたい金額**\n\n③ 計算は？  \n→ **毎年の受取額 × 年金現価係数**\n\n④ 「年金」は？  \n→ **毎年一定額**\n\n⑤ 「現価」は？  \n→ **現在の価値**\n\n⑥ 何と逆？  \n→ **資本回収係数**\n\n# 【一文で覚える】\n\n**年金現価係数＝「毎年○万円ほしい。じゃあ今いくら用意する？」**\n\n「先輩、6係数は最終的にこれだけ頭に置いてください。」\n\n**今 ↔ 未来**  \n→ 終価・現価\n\n**毎年 ↔ 未来**  \n→ 年金終価・減債基金\n\n**今 ↔ 毎年**  \n→ 資本回収・年金現価\n\n「……ほら。6個じゃなくて**3組の往復**だと思えば、一気に覚えやすくなるでしょう？」\n"}, {"n": 9, "title": "こども保険（学資保険）", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**こども保険（学資保険）**ですね。」\n\n「名前から『子どもに何かあったときの保険？』と思いそうですけど、まずそこを整理しましょう。」\n\n一言でいうと、\n\n**子どもの進学などに必要な教育資金を準備するための保険**\n\nです。\n\nたとえば、\n\n**子どもが小さいうち**\n↓\n保険料を積み立てる\n↓\n子どもが15歳・18歳などになる\n↓\n**祝い金・満期保険金などを教育資金として受け取る**\n\n「つまり、大学入学みたいな**将来まとまったお金が必要になる時期に備える**わけです。」\n\n---\n\n## B【詳しい解説｜普通の貯金と何が違うの？】\n\n「先輩、たぶんここで思いますよね。」\n\n「教育費を貯めるだけなら、銀行で貯金すればよくない？」\n\n「はい。そこで**保険**である意味が出てきます。」\n\nこども保険では一般に、契約者である親などに万一のことがあった場合、一定の条件のもとで**その後の保険料の払込みが免除されても、祝い金や満期保険金などの保障が継続する仕組み**があります。\n\n「たとえば、お父さんが契約者だったとします。」\n\nお父さんが保険料を払う  \n↓\n子どもの教育資金を準備する  \n↓\n途中で契約者に万一のことが起きる  \n↓\n以後の保険料の払込みが免除される  \n↓\nそれでも契約上の祝い金などを受け取れる\n\n「ここが単なる貯金との大きな違いですね。」\n\n※実際の保障内容や払込免除の条件は商品・契約によって異なります。\n\n---\n\n## 「誰が誰なの？」を整理します\n\n「先輩、保険ではここをごちゃごちゃにしやすいので止めますよ。」\n\n典型的には、\n\n**契約者**\n→ 親など  \n→ 保険料を支払う人\n\n**被保険者**\n→ 子ども\n\nという形です。\n\n「そして教育資金が必要になる時期に合わせて、祝い金や満期保険金を受け取るわけですね。」\n\n---\n\n## C【イメージ理解｜大学入学までの貯金箱】\n\n「先輩、お子さんが0歳だと想像してください。」\n\n18歳で大学進学。\n\n「18年後、入学金や授業料でまとまったお金が必要になりそうですよね。」\n\nそこで、\n\n👶 0歳  \n↓  \n💰 保険料を積み立てる  \n↓  \n💰  \n↓  \n💰  \n↓  \n🎓 18歳  \n↓  \n**教育資金を受け取る**\n\n「普通の積立に見えますよね。」\n\n「でも途中で契約者に万一のことがあったら？」\n\nそこで**保険料払込免除**などの保障が機能するわけです。\n\nだから、\n\n**貯蓄機能＋保障機能**\n\nというイメージで捉えると分かりやすいです。\n\n---\n\n## D【具体例｜実際の場面で見ましょう】\n\n「たとえば、父親が契約者、0歳の子どもが被保険者のこども保険に加入したとします。」\n\n18歳の大学進学に向けて保険料を支払います。\n\nそして契約内容に応じて、\n\n**18歳**\n→ 満期保険金などを受け取る\n\n「これを入学金や授業料に使えるわけですね。」\n\n一方、子どもが10歳のときに契約者である父親が死亡したとします。\n\n所定の条件を満たせば、\n\n**契約者死亡**\n↓\n**以後の保険料払込みが免除**\n↓\n契約は継続\n↓\n**予定していた教育資金を受け取る**\n\nという仕組みがあります。\n\n「先輩、ここがFP試験では特に押さえたいところです。」\n\n---\n\n## 【注意｜必ず元本が増えるとは限りません】\n\n「あと、ここ勘違いしないでください。」\n\nこども保険だからといって、\n\n**払った保険料より必ず多く返ってくる**\n\nとは限りません。\n\n商品や保障内容によっては、\n\n**払込保険料総額 ＞ 受取総額**\n\nになる場合もあります。\n\n「保障を充実させれば、その分の保険料も必要になりますからね。」\n\n---\n\n## 【理解確認】\n\n「はい、先輩。3問だけです。」\n\n**Q1. こども保険の主な目的は？**\n\n→ **教育資金の準備**\n\n**Q2. 一般的に契約者になるのは？**\n\n→ **親など**\n\n**Q3. 契約者に万一のことがあった場合は？**\n\n→ **所定の条件を満たせば、その後の保険料払込みが免除される仕組みがある**\n\n「はい。特に③を覚えておいてください。」\n\n---\n\n## 【30秒復習】\n\n① 何のため？  \n→ **教育資金**\n\n② いつ使う？  \n→ **進学時など**\n\n③ 誰が保険料を払う？  \n→ **契約者（親など）**\n\n④ 被保険者は？  \n→ **子ども**\n\n⑤ 契約者に万一のことがあったら？  \n→ **所定の条件で保険料払込免除など**\n\n⑥ 必ず元本以上になる？  \n→ **そうとは限らない**\n\n# 【一文で覚える】\n\n**こども保険＝「教育資金を準備しながら、契約者である親などの万一にも備える保険」。**\n\n「先輩、試験ではまず、\n\n**教育資金＋契約者の万一→保険料払込免除**\n\nこのセットを思い出してください。」\n\n「単なる『子どものための貯金』で終わらせない。それがポイントですよ。」\n"}, {"n": 10, "title": "教育一般貸付", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**教育一般貸付**ですね。」\n\n「これ、FPでは別名とセットで覚えてください。」\n\n**教育一般貸付 ＝ 日本政策金融公庫の「国の教育ローン」**\n\nです。[日本フードサービス協会](https://www.jfc.go.jp/n/finance/search/ippan.html?code=090644\\&utm_source=chatgpt.com)\n\n一言でいうと、\n\n**「子どもの入学・在学に必要なお金を、保護者などが国の制度を利用して借りるもの」**\n\nです。\n\n「先輩、ここでまず**奨学金とは別物**ですよ。」\n\n**国の教育ローン**\n→ 主に**保護者が借りる**\n\n**奨学金**\n→ 基本的に**学生本人が借りる**\n\n「この違い、試験ではかなり大事です。」\n\n---\n\n## B【詳しい解説｜誰が、いくら借りられる？】\n\n「じゃあ制度を分解していきますよ。」\n\n### ① 誰が借りる？\n\n「大学に行く子ども本人が借りる……と思いました？」\n\n「そこ、注意です。」\n\n基本的には、対象となる学校に入学・在学する人の**保護者**で、一定の世帯年収（所得）要件を満たす人が利用します。[日本フードサービス協会](https://www.jfc.go.jp/n/finance/search/pdf/yuushi_guide.pdf?referral=aw_launch\\&utm_source=chatgpt.com)\n\nつまり、\n\n👨‍👩‍👧 **保護者**\n↓\n教育一般貸付で借りる\n↓\n🎓 **子どもの教育費に使う**\n\nという形ですね。\n\n---\n\n### ② いくら借りられる？\n\n「ここは数字を覚えましょう。」\n\n現在の通常の融資限度額は、\n\n**子ども1人につき350万円**\n\nです。\n\nただし、\n\n- 自宅外通学\n- 修業年限5年以上の大学（昼間部）\n- 大学院\n- 3か月以上の海外留学\n\nなど一定の要件に該当する場合は、\n\n**450万円まで**\n\n借りられます。[日本フードサービス協会](https://www.jfc.go.jp/n/finance/search/ippan.html?code=090644\\&utm_source=chatgpt.com)\n\n「なので基本は、」\n\n**350万円 → 条件を満たせば450万円**\n\n「このセットですね。」\n\n---\n\n### ③ 何に使える？\n\n「授業料だけだと思ってません？」\n\n「実はもっと広いです。」\n\n入学金・授業料など学校に支払う費用だけでなく、受験料や受験時の交通費・宿泊費などにも利用できます。受験前でも申し込み可能です。[日本フードサービス協会](https://www.jfc.go.jp/n/finance/search/ippan.html?code=090644\\&utm_source=chatgpt.com)\n\nつまり、\n\n**受験**\n↓\n**入学**\n↓\n**在学**\n\nと、教育に必要となる幅広い費用をカバーする制度なんですね。\n\n---\n\n## C【イメージ理解｜大学進学で考えましょう】\n\n「先輩に高校3年生の子どもがいるとします。」\n\n「大学に合格しました。」\n\n「よかったですね……で終わりじゃありません。」\n\nすぐに、\n\n入学金  \n＋  \n授業料  \n＋  \n一人暮らしの費用など\n\n「まとまったお金が必要になりますよね。」\n\nそこで保護者が、\n\n🏦 **日本政策金融公庫**\n↓\n「教育費を借りたいです」\n↓\n💰 **教育一般貸付**\n↓\n👨‍👩‍👧 保護者が借りる\n↓\n🎓 子どもの教育費へ\n\nというイメージです。\n\n---\n\n## D【具体例｜奨学金と比較しましょう】\n\n「先輩、ここは比較した方が覚えやすいです。」\n\n子どもの大学進学に300万円必要だとします。\n\n### 教育一般貸付\n\n**保護者**\n→ 日本政策金融公庫から借りる\n→ 子どもの教育費に使う\n\n### 奨学金\n\n**学生本人**\n→ 奨学金を利用する\n→ 学生本人が返済義務を負うタイプもある\n\n「しかも、この2つは必ずどちらか一方ではありません。」\n\n日本政策金融公庫の国の教育ローンは、**日本学生支援機構などの奨学金と併用可能**です。[日本フードサービス協会](https://www.jfc.go.jp/n/finance/search/ippan.html?code=090644\\&utm_source=chatgpt.com)\n\n---\n\n## 【FPで押さえるポイント】\n\n「はい、先輩。試験用に一度まとめます。」\n\n**教育一般貸付**\n＝ **国の教育ローン**\n\n**実施**\n＝ **日本政策金融公庫**\n\n**借りる人**\n＝ **主に保護者**\n\n**融資限度額**\n＝ **子ども1人350万円**\n→ 一定要件なら**450万円**\n\n**奨学金との併用**\n＝ **可能** [日本フードサービス協会](https://www.jfc.go.jp/n/finance/search/ippan.html?code=090644\\&utm_source=chatgpt.com)\n\n「数字は制度改正されることがあるので、試験では受験年度の教材も確認してくださいね。」\n\n---\n\n## 【理解確認】\n\n「では3問です。」\n\n**Q1. 教育一般貸付の別名は？**\n\n→ **国の教育ローン**\n\n**Q2. 基本的に誰が借りる？**\n\n→ **保護者**\n\n**Q3. 通常の融資限度額は？**\n\n→ **子ども1人につき350万円**\n\n「はい。まずこの3つが出れば大丈夫です。」\n\n## 【一文で覚える】\n\n**教育一般貸付＝「日本政策金融公庫から保護者が借りる、国の教育ローン。基本は子ども1人350万円まで」。**\n\n「先輩、特に覚えてほしいのは、**『奨学金＝学生』『教育一般貸付＝保護者』**という違いです。ここを軸にすると混乱しにくいですよ。」\n\n[日本政策金融公庫「国の教育ローン」](https://www.jfc.go.jp/n/finance/search/ippan.html?code=090644&utm_source=chatgpt.com)\n"}, {"n": 11, "title": "奨学金制度", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**奨学金制度**ですね。」\n\n「さっきの教育一般貸付とセットで整理しましょう。ここ、FPでは混ざりやすいですから。」\n\n代表的なのが、[日本学生支援機構（JASSO）の奨学金](https://www.jasso.go.jp/shogakukin/?utm_source=chatgpt.com)です。\n\n一言でいうと、\n\n**「学生本人の修学を支援するために、お金を給付したり貸したりする制度」**\n\nです。\n\n「そして最初に絶対押さえてほしいのが、奨学金には**返さなくていいもの**と**返すもの**があることです。」\n\n**給付奨学金**\n→ 原則、**返還不要**\n\n**貸与奨学金**\n→ **返還必要**\n\n「まず、この2本に分けましょう。」\n\n---\n\n## B【詳しい解説｜貸与型はさらに2種類】\n\n「じゃあ先輩、貸与奨学金をもう一段掘ります。」\n\n貸与奨学金には、\n\n**第一種奨学金**\n→ **無利子**\n\n**第二種奨学金**\n→ **有利子**\n\nがあります。\n\n「……第一種、第二種って名前だけだと覚えにくいですよね。」\n\nだったら、\n\n**第一種＝利息なし**\n\n**第二種＝利息あり**\n\nで覚えてください。\n\n### じゃあ誰が借りる？\n\n「ここ、教育一般貸付との最大の違いです。」\n\n奨学金は基本的に、\n\n**学生本人が借りる**\n↓\n学生本人が学費などに使う\n↓\n卒業後などに\n↓\n**学生本人が返還する**\n\nという仕組みです。\n\n「つまり親の借金ではなく、**学生本人の返還義務**になるわけですね。」\n\n---\n\n## C【イメージ理解｜親と子を分けてください】\n\n「先輩、大学進学にお金が必要な家庭を想像してください。」\n\nお父さんが、\n\n👨「教育費が足りないから、私がお金を借ります」\n\nなら、\n\n→ **教育一般貸付（国の教育ローン）**\n\n一方、子どもが、\n\n🧑‍🎓「自分が奨学金を借りて大学に通います」\n\nなら、\n\n→ **貸与奨学金**\n\nです。\n\n「ほら。誰がお金を借りるのかを見ると分かりやすいでしょう？」\n\n**親が借りる**\n→ 教育一般貸付\n\n**学生本人が借りる**\n→ 奨学金\n\n「ただし、給付奨学金ならそもそも『借りる』ではありません。**もらうタイプ**なので、そこも分けてください。」\n\n---\n\n## D【具体例｜第一種・第二種を見分けましょう】\n\n「では、大学生のAさんがお金を借りるとします。」\n\n### ケース①\n\nAさんが**第一種奨学金**を利用。\n\n卒業後、借りたお金を返還します。\n\n「利息は？」\n\n→ **ありません。**\n\nだから、\n\n**第一種＝無利子**\n\n---\n\n### ケース②\n\nAさんが**第二種奨学金**を利用。\n\nこちらも返還が必要ですが、\n\n→ **利子が付きます。**\n\nだから、\n\n**第二種＝有利子**\n\n「はい。ここはシンプルですね。」\n\n---\n\n# 【教育一般貸付との違い】\n\n「先輩、前回の内容とくっつけますよ。」\n\n|  | 教育一般貸付 | 貸与奨学金 |\n|---|---|---|\n| 代表的な実施主体 | 日本政策金融公庫 | 日本学生支援機構（JASSO） |\n| 主に誰が借りる？ | **保護者** | **学生本人** |\n| 返す人 | 原則、借りた保護者 | 原則、借りた学生本人 |\n| 利息 | 原則あり | 第一種＝無利子、第二種＝有利子 |\n\n「試験問題で迷ったら、まず**誰が借りる？**を見てください。」\n\n---\n\n## 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n**Q1. 第一種奨学金は？**\n\n→ **無利子**\n\n**Q2. 第二種奨学金は？**\n\n→ **有利子**\n\n**Q3. 教育一般貸付と貸与奨学金の大きな違いは？**\n\n→ **教育一般貸付は主に保護者、奨学金は学生本人が借りる**\n\n「はい。ここまで言えればかなり整理できています。」\n\n---\n\n## 【30秒復習】\n\n① 奨学金は大きく？  \n→ **給付型・貸与型**\n\n② 給付型は？  \n→ **原則返還不要**\n\n③ 貸与型は？  \n→ **返還必要**\n\n④ 第一種は？  \n→ **無利子**\n\n⑤ 第二種は？  \n→ **有利子**\n\n⑥ 誰が借りる？  \n→ **学生本人**\n\n# 【一文で覚える】\n\n**奨学金＝「学生本人の修学を支援する制度。給付型は返還不要、貸与型は第一種＝無利子・第二種＝有利子」。**\n\n「先輩、まず頭の中に、\n\n**給付 → 返さない**\n\n**第一種 → 返す・利息なし**\n\n**第二種 → 返す・利息あり**\n\nこの3段を作ってください。」\n\n「……第一種と第二種を逆にしないでくださいね。ここは点を落とすの、もったいないですから。」\n"}, {"n": 12, "title": "固定金利期間選択型", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**固定金利期間選択型**ですね。住宅ローンの金利タイプの一つです。」\n\n「名前が長いですけど、そのまま分解すれば大丈夫ですよ。」\n\n**固定金利 ＋ 期間 ＋ 選択**\n\nつまり、\n\n**「最初の一定期間だけ、金利を固定する住宅ローン」**\n\nです。\n\nたとえば**10年固定**なら、\n\n**借入開始**\n→ 1年目\n→ 5年目\n→ 10年目まで **固定金利**\n→ 固定期間終了\n→ **その時点で金利タイプを選択**\n\nというイメージです。\n\n「先輩、ここ大事ですよ。**30年ローンで10年固定を選んだからといって、30年間ずっと同じ金利ではありません。**」\n\n---\n\n## B【詳しい解説｜何が「固定」なの？】\n\n「たとえば先輩が、35年の住宅ローンを組むとします。」\n\nそこで、\n\n**固定金利期間10年**\n\nを選びました。\n\n「すると最初の10年間は、市場金利が上がったり下がったりしても、契約上の固定期間中の適用金利は変わりません。」\n\nだから、\n\n**最初の10年間**\n→ 金利固定\n→ 金利が変わらない\n→ 返済額も原則として安定\n\nとなります。\n\n「じゃあ11年目は？」\n\n「はい。そこがこのタイプのポイントです。」\n\n固定期間が終了すると、一般にその時点の条件に基づいて、**再び固定金利期間を選択したり、変動金利型に移行したり**します。具体的な選択肢や手続きは金融機関・商品によって異なります。\n\n---\n\n### 「全期間固定」と何が違うの？\n\n「先輩、たぶんここが一番混ざります。」\n\nたとえば35年ローンなら、\n\n**全期間固定金利型**\n\n35年間  \n━━━━━━━━━━━━  \nずっと固定\n\n一方、\n\n**固定金利期間選択型（10年固定）**\n\n最初の10年間  \n━━━━━━━━  \n固定\n\nその後  \n━━━━━━  \n**その時点の金利などをもとに再設定**\n\nです。\n\n「つまり、**固定する期間を限定している**から『固定金利期間選択型』なんですね。」\n\n---\n\n## C【イメージ理解｜ホテルの料金で考えましょう】\n\n「先輩、住宅ローンから一回離れますよ。」\n\n「30日間ホテルに泊まるとして、最初の10日間だけ、\n\n『この10日間は1泊1万円で固定します』\n\nという契約をしたとします。」\n\n1〜10日目  \n→ **1万円で固定**\n\n11日目以降  \n→ **そのときの料金で改めて決める**\n\n「これなら分かりますよね？」\n\n住宅ローンも同じように、\n\n**一定期間だけ金利をロックする**\n\nと考えてください。\n\n「だから、固定期間が終わったときに市場金利が上がっていたら？」\n\n……\n\n「そうです。その後の適用金利や返済額が上がる可能性があります。」\n\n---\n\n## D【具体例｜10年固定で考えます】\n\n「では先輩、3,000万円を35年間で借りたとしましょう。」\n\n最初に、\n\n**10年間・固定金利**\n\nを選択します。\n\n### 1〜10年目\n\n市場金利が、\n\n1％ → 2％ → 3％\n\nと動いたとしても、\n\n「固定期間中ですから、契約した固定金利そのものは変わりません。」\n\nそして10年経過。\n\n「ここからです。」\n\nその時点で利用できる条件に応じて、\n\n**もう一度固定期間を設定する**\n\nあるいは\n\n**変動金利型にする**\n\nといった選択をすることになります。\n\nもしその時点の金利水準が契約当初より高ければ、**その後の返済負担が増える可能性がある**わけですね。\n\n---\n\n# 【3種類の金利を整理】\n\n「先輩、ここはFP試験用に3つ並べましょう。」\n\n| タイプ | イメージ |\n|---|---|\n| **全期間固定金利型** | 最初から最後まで固定 |\n| **固定金利期間選択型** | 3年・5年・10年など一定期間固定 |\n| **変動金利型** | 市場金利などに応じて適用金利が見直される |\n\n「固定金利期間選択型は、ちょうど真ん中みたいな存在ですね。」\n\n**ずっと固定ではない。  \nでも、固定期間中は固定。**\n\nこの2点を押さえてください。\n\n---\n\n## 【理解確認】\n\n「はい、先輩。3問です。」\n\n**Q1. 10年固定の35年ローン。固定されるのは？**\n\n→ **最初の10年間**\n\n**Q2. 10年経過後も最初の金利が自動的に続く？**\n\n→ **いいえ。固定期間終了後は、その時点の条件で金利が再設定されます。**\n\n**Q3. 全期間固定との違いは？**\n\n→ **全期間固定は返済期間を通じて固定、固定金利期間選択型は一定期間だけ固定**\n\n「はい。ここが言えれば大丈夫です。」\n\n## 【30秒復習】\n\n① 何の話？  \n→ **住宅ローンの金利タイプ**\n\n② 何を固定する？  \n→ **一定期間の金利**\n\n③ 代表的な期間は？  \n→ **3年・5年・10年など**\n\n④ 固定期間中は？  \n→ **適用金利は固定**\n\n⑤ 固定期間終了後は？  \n→ **その時点の条件で再設定**\n\n⑥ 全期間固定との違いは？  \n→ **固定する期間が限定されている**\n\n# 【一文で覚える】\n\n**固定金利期間選択型＝「最初の○年間だけ金利を固定して、その期間が終わったら金利タイプを改めて選ぶ住宅ローン」。**\n\n「先輩、名前をそのまま覚えればいいんです。」\n\n**固定金利・期間・選択型**\n\n→ **『固定する期間を選ぶ』**\n\n「……『固定金利』だけ見て、最後まで固定だと思わないでくださいね。そこ、試験で狙われたらもったいないですから。」\n"}, {"n": 13, "title": "元利均等返済と元金均等返済", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**元利均等返済と元金均等返済**ですね。」\n\n「名前がそっくりなので混乱しますけど、見る場所は一つです。」\n\n**何が『均等』なのか？**\n\nここを見てください。\n\n**元利均等返済**\n→ **毎回の返済額（元金＋利息）が一定**\n\n**元金均等返済**\n→ **毎回返す元金が一定**\n\n「はい。まずこれです。」\n\n### 一言で覚えるなら\n\n**元利均等＝毎月の支払いが同じ**\n\n**元金均等＝毎月返す元金が同じ**\n\n「……『元利』と『元金』を適当に読み飛ばさないでくださいね。名前に答えが書いてありますから。」\n\n---\n\n# B【詳しい解説｜なぜ返済額に違いが出るの？】\n\n「まず、ローンの返済額って何でできていると思います？」\n\n……\n\n「そうです。」\n\n**返済額 ＝ 元金 ＋ 利息**\n\nです。\n\nたとえば銀行から1,000万円借りたなら、\n\n**元金**\n→ 借りた1,000万円そのもの\n\n**利息**\n→ お金を借りたことに対して支払うお金\n\nです。\n\n「ここまでは大丈夫ですね。」\n\nでは、この**元金と利息をどう返していくか**で2種類に分かれます。\n\n---\n\n# ① 元利均等返済\n\n「先輩、まず**元利**という言葉を見てください。」\n\n**元＝元金**\n\n**利＝利息**\n\nですよね。\n\nつまり、\n\n**元金＋利息を合わせた返済額を均等にする**\n\nということです。\n\nたとえば毎月10万円返済するとします。\n\n最初は、\n\n**元金3万円＋利息7万円＝10万円**\n\nしばらくすると、\n\n**元金5万円＋利息5万円＝10万円**\n\nさらに進むと、\n\n**元金8万円＋利息2万円＝10万円**\n\nみたいに、中身は変わっていきます。\n\n「先輩、ここ気づきました？」\n\n**元金と利息の割合は変わっている。**\n\nでも、\n\n**毎月払う合計額は10万円で一定**\n\nなんです。\n\n### なぜ最初は利息が多いの？\n\n「ここ、たぶん気になりますよね。」\n\n利息は基本的に**残っている元金**をもとに計算します。\n\n最初  \n→ 借金がたくさん残っている  \n→ 利息が大きい\n\n返済が進む  \n→ 元金が減る  \n→ 利息も減る\n\nだから元利均等では、\n\n**最初：利息多め・元金少なめ**\n\n↓\n\n**後半：利息少なめ・元金多め**\n\nとなります。\n\n---\n\n# ② 元金均等返済\n\n「次は**元金均等**です。」\n\n今度は、\n\n**返す元金そのものを一定にする**\n\n方式です。\n\nたとえば毎月、\n\n**元金5万円**\n\nを返すとします。\n\nでも先輩、利息も払わないといけませんよね？\n\nだから最初は、\n\n**元金5万円＋利息7万円  \n＝12万円**\n\n次は、\n\n**元金5万円＋利息6万円  \n＝11万円**\n\nさらに、\n\n**元金5万円＋利息5万円  \n＝10万円**\n\nという感じです。\n\n「元金はずっと5万円なのに、支払額が減ってますよね。」\n\nなぜでしょう？\n\n……\n\n「そうです。元金をどんどん返しているので、**残っている借金が減って、そこにかかる利息も減るから**です。」\n\nつまり、\n\n**元金均等返済は、最初の返済額が大きく、だんだん返済額が小さくなる**\n\nという特徴があります。\n\n---\n\n# C【イメージ理解｜2人の返し方を比べましょう】\n\n「先輩、友達からお金を借りたとします。」\n\n### 🧑 Aさん「毎月払う総額を同じにしたい」\n\n毎月、\n\n💴10万円  \n💴10万円  \n💴10万円  \n💴10万円  \n💴10万円\n\n「これが**元利均等**のイメージです。」\n\n**家計管理がしやすい**ですよね。\n\n---\n\n### 🧑 Bさん「借金の元金を毎月同じだけ減らしたい」\n\n元金を毎月5万円ずつ返します。\n\nでも利息を加えるので、\n\n💴12万円  \n↓  \n💴11万円  \n↓  \n💴10万円  \n↓  \n💴9万円……\n\n「これが**元金均等**です。」\n\n最初は大変。\n\nでも元金が早く減るので、利息も早く減っていきます。\n\n---\n\n# D【具体例｜どっちの利息が少ない？】\n\n「先輩、ここがFP試験で重要ですよ。」\n\n**同じ借入額・金利・返済期間などの条件なら、総返済額が少なくなるのはどちらでしょう？**\n\n……\n\n「元金均等返済です。」\n\nなぜなら、\n\n**元金均等**\n↓\n最初から元金を多めに返す\n↓\n借入残高が早く減る\n↓\nその後にかかる利息が少なくなる\n↓\n**総返済額が少なくなる**\n\nからです。\n\n「ただし、その代わりがあります。」\n\n**元金均等返済は、返済開始当初の返済額が大きい。**\n\nここまでセットです。\n\n---\n\n# 【2つを完全比較】\n\n「先輩、ここは試験直前にも見返せるように整理します。」\n\n|  | 元利均等返済 | 元金均等返済 |\n|---|---|---|\n| 一定なのは？ | **返済額** | **元金部分** |\n| 毎回の返済額 | 原則一定 | 徐々に減少 |\n| 最初の負担 | 比較的小さい | **大きい** |\n| 元金の減り | 比較的遅い | **早い** |\n| 総利息 | 比較的多い | **少ない** |\n| 総返済額 | 比較的多い | **少ない** |\n\n※同じ借入額・金利・返済期間などで比較した場合です。\n\n「これ、全部バラバラに暗記しなくていいですよ。」\n\n### 元金均等は元金を早く減らす\n\n↓\n\n残高が早く減る\n\n↓\n\n利息が少なくなる\n\n↓\n\n総返済額も少なくなる\n\n「この因果関係を理解しておけば、忘れても自分で答えを出せます。」\n\n---\n\n# 【理解確認】\n\n「先輩、本当に分かりました？」\n\n「……じゃあ3問だけ。」\n\n### Q1\n\n**毎月の返済額を一定にしたい。**\n\nどっち？\n\n→ **元利均等返済**\n\n### Q2\n\n**最初の返済額は大きくてもいいから、元金を早く減らしたい。**\n\nどっち？\n\n→ **元金均等返済**\n\n### Q3\n\n同じ条件なら、総返済額が少ないのは？\n\n→ **元金均等返済**\n\n「はい。ここまで出れば大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 元利均等で一定なのは？  \n→ **元金＋利息の返済額**\n\n② 元金均等で一定なのは？  \n→ **元金部分**\n\n③ 元利均等のメリットは？  \n→ **返済額が一定で計画を立てやすい**\n\n④ 元金均等の最初の返済額は？  \n→ **大きい**\n\n⑤ 元金が早く減るのは？  \n→ **元金均等**\n\n⑥ 総返済額が少ないのは？  \n→ **元金均等**\n\n# 【一文で覚える】\n\n**元利均等＝「毎月払う金額をそろえる」  \n元金均等＝「毎月返す元金をそろえる」**\n\n「先輩、さらに短くしますよ。」\n\n**元利 → 支払い一定 → 家計が安定**\n\n**元金 → 元金を早く減らす → 利息が減る**\n\n「この2本の流れが頭に残っていれば、試験で細かい特徴を聞かれても自分で導けます。」\n\n"}, {"n": 14, "title": "期間短縮型と返済額軽減型", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**期間短縮型と返済額軽減型**ですね。」\n\n「これは住宅ローンの**繰上げ返済**の2種類です。」\n\nまず一言で分けます。\n\n**期間短縮型**\n→ 毎回の返済額は基本そのままで、**返済期間を短くする**\n\n**返済額軽減型**\n→ 返済期間は基本そのままで、**毎回の返済額を減らす**\n\n「先輩、名前そのままですよ。」\n\n**期間を短くする → 期間短縮型**\n\n**返済額を軽くする → 返済額軽減型**\n\n---\n\n# B【詳しい解説｜そもそも繰上げ返済って？】\n\n「まず、ここから確認しましょう。」\n\nたとえば住宅ローンが、\n\n**残り2,000万円・残り20年**\n\nあるとします。\n\nそこに貯金ができて、\n\n「先輩、100万円を予定より早く返しました。」\n\nこれが**繰上げ返済**です。\n\n「で、その100万円は基本的に元金の返済に充てられます。」\n\n元金が減る  \n↓\n将来その元金にかかるはずだった利息が減る  \n↓\n**総返済額を減らせる**\n\n「ここまでは両方同じです。」\n\n問題は、\n\n**繰上げ返済した結果をどう使うか**\n\nなんです。\n\n---\n\n# ① 期間短縮型\n\n「まず**期間短縮型**。」\n\nたとえば、\n\n毎月10万円  \n×  \nあと20年間\n\n返済する予定だったとします。\n\nそこで100万円を繰上げ返済。\n\n「でも毎月の10万円は基本変えません。」\n\nその代わり、\n\n**20年間 → 18年間**\n\nみたいに、返済が早く終わるわけです。\n\n### 流れで見ると\n\n100万円を繰上げ返済  \n↓\n元金が減る  \n↓\n毎月の返済額は基本そのまま  \n↓\n予定より早く完済  \n↓\n**返済期間が短くなる**\n\n「だから**期間短縮型**ですね。」\n\n---\n\n## ② 返済額軽減型\n\n「じゃあ今度は**返済額軽減型**。」\n\n同じように、\n\n毎月10万円  \n×  \nあと20年間\n\nだったとします。\n\n100万円を繰上げ返済します。\n\n「今度は20年という返済期間を基本的に変えません。」\n\nその代わり、\n\n**毎月10万円 → 毎月9万円**\n\nというように、その後の返済額を軽くします。\n\n### 流れで見ると\n\n100万円を繰上げ返済  \n↓\n元金が減る  \n↓\n返済期間は基本そのまま  \n↓\n毎月の返済額が減る  \n↓\n**毎月の家計負担が軽くなる**\n\n「だから**返済額軽減型**です。」\n\n---\n\n# C【イメージ理解｜マラソンで考えましょう】\n\n「先輩、住宅ローンから一回離れますよ。」\n\n「20km走らないといけないとします。」\n\nでも途中で、\n\n**5km分を一気にワープできる券**\n\nをもらいました。\n\n「これが繰上げ返済だと思ってください。」\n\n### 🏃期間短縮型\n\n「走るペースはそのまま！」\n\nでも5kmワープした。\n\nすると？\n\n「そうです。**早くゴールできます。**」\n\n**ペースそのまま → ゴールが早くなる**\n\n＝ **期間短縮型**\n\n---\n\n### 🏃返済額軽減型\n\n今度は、\n\n「ゴールする時間は予定通りでいいです。」\n\n5kmワープした分、\n\n「じゃあ残りはゆっくり走れますよね？」\n\n**ゴール時期そのまま → 毎回の負担を軽くする**\n\n＝ **返済額軽減型**\n\n「このイメージ、かなり使えますよ。」\n\n---\n\n# D【具体例｜利息はどちらが減る？】\n\n「さて先輩。FP試験で大事なところです。」\n\n同じ金額を同じ時点で繰上げ返済した場合、\n\n**どちらのほうが利息軽減効果が大きいと思います？**\n\n……\n\n「はい。**期間短縮型**です。」\n\n「なぜ？ってところまで理解してください。」\n\n期間短縮型では、\n\n繰上げ返済  \n↓\n元金が減る  \n↓\n**返済期間そのものも短くなる**\n↓\n利息を払う期間が短くなる\n↓\n**利息軽減効果が大きい**\n\nという流れです。\n\n一方、返済額軽減型では、\n\n繰上げ返済  \n↓\n元金が減る  \n↓\n毎月の返済額は軽くなる\n↓\nただし返済期間は基本そのまま\n\nとなります。\n\n「だから、同じ条件なら**利息を減らす効果は期間短縮型のほうが大きい**んですね。」\n\n---\n\n# 【完全比較】\n\n|  | 期間短縮型 | 返済額軽減型 |\n|---|---|---|\n| 毎回の返済額 | 基本変わらない | **減る** |\n| 返済期間 | **短くなる** | 基本変わらない |\n| 利息軽減効果 | **大きい** | 比較的小さい |\n| 向いている目的 | 早く完済したい | 毎月の負担を減らしたい |\n\n「先輩、表を丸暗記しなくていいですよ。」\n\n**期間短縮**\n→ 早く終わる\n→ 利息を払う期間も短くなる\n→ **利息削減効果が大きい**\n\nここから導いてください。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問です。」\n\n### Q1\n\n「毎月10万円の返済はそのままでいいから、住宅ローンを早く終わらせたい。」\n\n→ **期間短縮型**\n\n### Q2\n\n「完済時期はそのままでいいから、毎月10万円を8万円くらいに減らしたい。」\n\n→ **返済額軽減型**\n\n### Q3\n\n同じ条件で繰上げ返済した場合、一般に利息軽減効果が大きいのは？\n\n→ **期間短縮型**\n\n「はい。これが即答できれば大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 何の2種類？  \n→ **繰上げ返済**\n\n② 期間短縮型は？  \n→ **返済期間を短くする**\n\n③ 毎回の返済額は？  \n→ **基本そのまま**\n\n④ 返済額軽減型は？  \n→ **毎回の返済額を減らす**\n\n⑤ 返済期間は？  \n→ **基本そのまま**\n\n⑥ 利息軽減効果が大きいのは？  \n→ **期間短縮型**\n\n# 【一文で覚える】\n\n**期間短縮型＝「月々そのまま、早くゴール」**\n\n**返済額軽減型＝「ゴールはそのまま、月々ラクに」**\n\n「先輩、もっと短くするなら――」\n\n**期間短縮 → 早く終わる**\n\n**返済軽減 → 毎月ラクになる**\n\n「そして試験ではもう一つ。」\n\n**利息をより減らしやすい → 期間短縮型**\n\n「この3本がつながっていれば十分です。」\n"}, {"n": 15, "title": "財形住宅融資", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**財形住宅融資（ざいけいじゅうたくゆうし）**ですね。」\n\n「これ、名前から意味を取れます。」\n\n**財形貯蓄をしている人が、住宅の取得などのために利用できる公的な住宅融資制度**\n\nです。\n\n「つまりイメージは――」\n\n**会社員などとして財形貯蓄**\n↓\nコツコツ貯める\n↓\n🏠「家を買いたい」\n↓\n一定の条件を満たす\n↓\n**財形住宅融資を利用**\n\nですね。\n\n---\n\n# B【詳しい解説｜誰でも借りられるの？】\n\n「先輩、ここで『住宅を買うなら誰でも使えるの？』って思いました？」\n\n「いいえ。そこがポイントです。」\n\n代表的な要件として、**財形貯蓄を1年以上継続し、申込日前2年以内に財形貯蓄への預入れを行い、申込日に50万円以上の残高があること**などがあります。\n\n「つまり――」\n\n財形貯蓄を始める  \n↓\n**1年以上継続**\n↓\n残高などの要件を満たす\n↓\n住宅取得など\n↓\n財形住宅融資\n\nという流れですね。\n\n---\n\n## いくらまで借りられる？\n\n「はい、先輩。ここはFP試験で数字を狙われやすいところです。」\n\n融資額には、\n\n**財形貯蓄残高の10倍以内**\n\nという基準があります。\n\n「たとえば財形貯蓄が100万円なら？」\n\n……\n\n**100万円 × 10＝1,000万円**\n\nですね。\n\n「ただし、『じゃあ1億円貯めてたら10億円借りられる？』なんてことにはなりません。」\n\n上限があって、\n\n**最高4,000万円**\n\nです。\n\nさらに、住宅の建設・購入などに必要な額に対する制限もあります。\n\n### 覚え方\n\n**財形残高 × 10倍**\n  \nただし\n\n**最高4,000万円**\n\n「この数字のセットは覚えておきましょう。」\n\n---\n\n# もう一つ重要｜5年間の固定金利\n\n「先輩、金利についても重要です。」\n\n財形住宅融資は、基本的に**5年間の固定金利**で、5年ごとに適用金利が見直される仕組みです。\n\n「え？ 固定金利なら最後まで同じじゃないの？」\n\n「……さっき固定金利期間選択型をやりましたよね？」\n\nここでも、\n\n**最初の5年間**\n→ 固定\n\n**5年経過**\n→ 金利見直し\n\n**次の5年間**\n→ 固定\n\nというイメージです。\n\n「つまり、**全期間固定ではありません。**」\n\n---\n\n# C【イメージ理解｜会社員の先輩で考えましょう】\n\n「先輩が会社員で、給与から毎月財形貯蓄をしているとします。」\n\n毎月、\n\n給与  \n↓\n💰財形貯蓄\n\nと積み立てている。\n\n数年後――\n\n「先輩、家を買うことになりました。」\n\n🏠「3,000万円必要……」\n\nそのとき、\n\n「自分は財形貯蓄を続けてきたから、条件を満たせば財形住宅融資が使えるかもしれない」\n\nとなるわけです。\n\n「だから、普通の住宅ローンを突然借りるというより、**財形貯蓄をしてきた勤労者向けの住宅融資**というイメージを持ってください。」\n\n---\n\n# D【具体例｜数字で確認しましょう】\n\n「先輩、財形貯蓄残高が**200万円**だったとします。」\n\n融資額の基準は、\n\n**200万円 × 10倍  \n＝ 2,000万円**\n\nです。\n\n「これは4,000万円以下ですね。」\n\nしたがって、この基準だけ見れば**2,000万円**が上限になります。\n\n---\n\n「では財形貯蓄残高が**500万円**なら？」\n\n500万円 × 10  \n＝ **5,000万円**\n\n「じゃあ5,000万円借りられる？」\n\n……\n\n「はい、そこは違います。」\n\n最高限度額があるので、\n\n**上限4,000万円**\n\nです。\n\n「この問題、試験にされたら引っかからないでくださいね。」\n\n---\n\n# 【他の住宅ローンと混ぜない】\n\n「先輩、住宅関連が増えてきたので整理しておきます。」\n\n**財形住宅融資**\n→ 財形貯蓄をしている勤労者などが対象  \n→ **残高の10倍以内**  \n→ **最高4,000万円**  \n→ **5年ごとに金利見直し**\n\n一方、一般的な民間住宅ローンは、\n\n「財形貯蓄をしていないと借りられない」\n\nというものではありません。\n\n「つまり『財形』という名前が出たら、まず**財形貯蓄とのつながり**を思い出してください。」\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問です。」\n\n### Q1\n\n財形住宅融資を利用するため、財形貯蓄は原則何年以上継続？\n\n→ **1年以上**\n\n### Q2\n\n融資額は財形貯蓄残高の何倍以内？\n\n→ **10倍以内**\n\n### Q3\n\n最高融資額は？\n\n→ **4,000万円**\n\n「はい。ここは数字問題として押さえてください。」\n\n---\n\n## 【30秒復習】\n\n① 誰向け？  \n→ **財形貯蓄をしている勤労者など**\n\n② 財形貯蓄期間は？  \n→ **1年以上**\n\n③ 残高は？  \n→ **50万円以上**\n\n④ 融資額は？  \n→ **財形貯蓄残高の10倍以内**\n\n⑤ 上限は？  \n→ **4,000万円**\n\n⑥ 金利は？  \n→ **5年間固定・5年ごとに見直し**\n\n# 【一文で覚える】\n\n**財形住宅融資＝「財形貯蓄を1年以上続けている人などが利用でき、貯蓄残高の10倍以内・最高4,000万円、金利は5年ごとに見直される住宅融資」。**\n\n「先輩、数字だけ圧縮すると――」\n\n**1年・50万円・10倍・4,000万円・5年**\n\n「この並びを見て内容を復元できるようにしておくと、FPの問題ではかなり使いやすいですよ。」\n\n"}, {"n": 16, "title": "フラット35", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**フラット35**ですね。」\n\n「まず名前の『フラット』からイメージしてください。金利が途中でデコボコ変わらず、**ずっとフラット**です。」\n\n一言でいうと、\n\n**最長35年間、全期間固定金利で借りられる住宅ローン**\n\nです。\n\nそして大事なのが運営の仕組み。\n\n**民間金融機関 ＋ 住宅金融支援機構**\n\nが連携して提供しています。\n\n「つまり完全な民間ローンでも、住宅金融支援機構が直接普通に貸すだけのローンでもない、というところですね。」\n\n---\n\n# B【詳しい解説｜何がそんなに「フラット」なの？】\n\n「先輩、3,000万円を35年間借りるとしましょう。」\n\n変動金利型なら、将来の金利変動によって適用金利が変わる可能性があります。\n\n「でもフラット35は？」\n\n**借入時に金利が決まる**\n↓\n**返済終了まで全期間固定**\n↓\n市場金利が上昇しても\n↓\n**借入後の適用金利は変わらない**\n\nという仕組みです。\n\n「だから将来の返済計画を立てやすいんですね。」\n\n---\n\n## 「35」って35年しか選べないの？\n\n「先輩、ここ引っかからないでください。」\n\n**フラット35＝必ず35年間借りる**\n\nではありません。\n\n原則として借入期間は、\n\n**15年以上35年以内**\n\nです。\n\nただし、申込本人または連帯債務者が60歳以上の場合は**10年以上**から利用できます。\n\nまた、借入期間の上限は年齢による制限も受けます。\n\n「なので『35』は**最長35年**と覚えてください。」\n\n---\n\n# いくら借りられる？\n\n「次は数字です。」\n\n融資額は、\n\n**100万円以上8,000万円以下**\n\nで、住宅の建設費または購入価額以内です。\n\n「財形住宅融資の**最高4,000万円**と混ぜないでくださいね。」\n\n**財形住宅融資**\n→ 最高4,000万円\n\n**フラット35**\n→ 最高8,000万円\n\n---\n\n# 保証人・保証料は？\n\n「先輩、住宅ローンって『保証人とか保証料が必要なのかな』って気になりますよね。」\n\nフラット35では、\n\n**保証人 → 不要**\n\n**保証料 → 不要**\n\nです。\n\nさらに、繰上返済手数料も不要です。\n\n「ここも試験では特徴として押さえやすいところですね。」\n\n---\n\n# C【イメージ理解｜35年間の一本道】\n\n「先輩、35年間続く道路を想像してください。」\n\n### 変動金利\n\n金利が、\n\n↗️ 上がったり  \n↘️ 下がったり\n\nする可能性がある。\n\n「先の返済負担が完全には読めません。」\n\n一方フラット35は、\n\n**━━━━━━━━━━━━━━→**\n\n「金利という道が借入時から完済までフラット。」\n\nだから、\n\n🏠 住宅購入  \n↓\n金利決定  \n↓\n10年後  \n↓\n20年後  \n↓\n30年後  \n↓\n完済\n\nまで、**適用金利が固定**されています。\n\n「『フラット＝全期間固定』。名前と意味がちゃんとつながりますね。」\n\n---\n\n# D【具体例｜金利が上がったらどうなる？】\n\n「では先輩。」\n\nフラット35で住宅ローンを借りた後、世の中の住宅ローン金利が大きく上昇したとします。\n\n「先輩のフラット35の金利も上がる？」\n\n……\n\n「上がりません。」\n\n**契約時に全期間の金利が確定している**からです。\n\n逆に、\n\n「世の中の金利が大きく下がったら、自分の金利も自動的に下がる？」\n\n……\n\n「これも違います。」\n\n固定されていますから、\n\n**上がらない代わりに、下がっても自動的には下がらない**\n\nわけです。\n\n「固定金利のメリットとデメリットは表裏一体なんですね。」\n\n---\n\n# 【固定金利期間選択型と混ぜない】\n\n「先輩、さっきやった内容とつなげましょう。」\n\n### 固定金利期間選択型\n\n**最初の10年間など**\n→ 固定\n\nその後\n→ **金利を再設定**\n\n### フラット35\n\n**最初から最後まで**\n→ **固定**\n\n「つまり――」\n\n**10年固定 → 10年だけ固定**\n\n**フラット35 → 全期間固定**\n\nです。\n\n---\n\n# 【財形住宅融資とも比較】\n\n|  | フラット35 | 財形住宅融資 |\n|---|---|---|\n| 金利 | **全期間固定** | **5年間固定→5年ごと見直し** |\n| 融資額 | **最高8,000万円** | **最高4,000万円** |\n| 財形貯蓄 | 不要 | **一定の要件あり** |\n| 最長期間 | **35年** | 原則35年 |\n\n「住宅ローン系の数字が増えてきましたけど、混ぜずに『なぜその数字なのか』と制度ごとに箱を作ってください。」\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問です。」\n\n### Q1\n\nフラット35の金利タイプは？\n\n→ **全期間固定金利**\n\n### Q2\n\n返済期間は必ず35年？\n\n→ **いいえ。35年は最長**\n\n### Q3\n\n融資額の上限は？\n\n→ **8,000万円**\n\n「はい。まずこの3つです。」\n\n---\n\n## 【30秒復習】\n\n① 何のローン？  \n→ **住宅ローン**\n\n② 誰が関わる？  \n→ **民間金融機関＋住宅金融支援機構**\n\n③ 金利は？  \n→ **全期間固定**\n\n④ 最長期間は？  \n→ **35年**\n\n⑤ 融資額は？  \n→ **100万円以上8,000万円以下**\n\n⑥ 保証人・保証料は？  \n→ **不要**\n\n# 【一文で覚える】\n\n**フラット35＝「住宅金融支援機構と民間金融機関が連携して提供する、最長35年・全期間固定金利の住宅ローン」。**\n\n「先輩、最優先で覚えるなら――」\n\n**フラット → 金利がずっとフラット**\n\n**35 → 最長35年**\n\n「この2つです。そこから**全期間固定金利**を即答できれば、まず土台はできています。」\n\n"}, {"n": 17, "title": "財形貯蓄制度", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、今度は**財形貯蓄制度（ざいけいちょちくせいど）**ですね。」\n\n「さっきの**財形住宅融資**につながる制度です。ここで整理しておきましょう。」\n\n一言でいうと、\n\n**勤労者が給与から天引きして、計画的にお金を貯める制度**\n\nです。\n\n「給料が口座に入ってから自分で貯金するんじゃなくて――」\n\n**給料**\n↓\n先に財形貯蓄へ\n↓\n残りを受け取る\n\n「という感じですね。いわゆる**給与天引きによる貯蓄**です。」\n\nそしてFPでは、財形貯蓄を**3種類**に分けて覚えるのが重要です。\n\n**① 一般財形貯蓄  \n② 財形住宅貯蓄  \n③ 財形年金貯蓄**\n\n---\n\n# B【詳しい解説｜3種類は何が違うの？】\n\n「先輩、名前を見るだけでかなり分かります。」\n\n## ① 一般財形貯蓄\n\n「まず**一般**。」\n\nこれは目的を限定せず、幅広く使えるタイプです。\n\n旅行でも、車でも、教育費でも構いません。\n\n**使い道 → 原則自由**\n\n「その代わり、利子等に対する特別な非課税措置はありません。」\n\nつまり、\n\n**自由度が高い代わりに、利子等は原則課税**\n\nです。\n\n---\n\n## ② 財形住宅貯蓄\n\n「次は**住宅**。これはそのままですね。」\n\n🏠 **住宅の取得や増改築など**\n\nを目的とした財形貯蓄です。\n\n「そして先輩、ここから税制上のメリットが出てきます。」\n\n一定の要件を満たせば、**財形年金貯蓄と合わせて元本550万円まで**の利子等が非課税になります。\n\n「住宅だけで550万円、年金も550万円……ではありませんよ？」\n\n**住宅＋年金＝合計550万円**\n\nです。\n\n---\n\n## ③ 財形年金貯蓄\n\n「最後は**年金**。」\n\n老後の生活資金を準備するためのものです。\n\n👴👵 **老後資金を積み立てる**\n↓\n一定の要件を満たす\n↓\n年金として受け取る\n\nこちらも一定の要件のもとで、財形住宅貯蓄と合わせて**元本550万円まで**の利子等が非課税になります。\n\n---\n\n# 「一般だけ仲間外れ」と覚える\n\n「先輩、3つ並ぶと混乱するでしょう？」\n\n「だったら**一般だけ違う**と考えてください。」\n\n### 一般財形\n→ 目的自由  \n→ **非課税措置なし**\n\n### 住宅財形\n→ 🏠住宅目的  \n→ **非課税制度あり**\n\n### 年金財形\n→ 👴老後目的  \n→ **非課税制度あり**\n\n「つまり――」\n\n**一般＝自由だけど課税**\n\n**住宅・年金＝目的限定だけど一定額まで非課税**\n\nです。\n\n---\n\n# C【イメージ理解｜3つの貯金箱です】\n\n「先輩、会社に3つの貯金箱があると思ってください。」\n\n### 📦 箱①「なんでも」\n\n給与から1万円。\n\nチャリン。\n\n「旅行に使おうかな。車でもいいな。」\n\n→ **一般財形**\n\n---\n\n### 🏠 箱②「家専用」\n\n給与から1万円。\n\nチャリン。\n\n「将来、住宅を買うために使います。」\n\n→ **財形住宅**\n\n---\n\n### 👴 箱③「老後専用」\n\n給与から1万円。\n\nチャリン。\n\n「これは老後まで準備しておきます。」\n\n→ **財形年金**\n\n「住宅と年金は用途を制限する代わりに、一定の要件を満たせば**利子等の非課税制度**が用意されているわけですね。」\n\n---\n\n# D【具体例｜550万円を勘違いしない】\n\n「先輩、ここ試験で引っかけやすいですよ。」\n\nたとえば、\n\n**財形住宅貯蓄：300万円**\n\n**財形年金貯蓄：250万円**\n\nなら、\n\n300＋250  \n＝ **550万円**\n\nですね。\n\n一定の要件を満たせば、この範囲について利子等の非課税措置があります。\n\n「じゃあ――」\n\n住宅400万円  \n＋  \n年金400万円  \n＝800万円\n\n「全部非課税？」\n\n……\n\n「違います。」\n\n基本となる非課税限度額は、\n\n**住宅＋年金で元本550万円**\n\nです。\n\n「**それぞれ550万円ではなく、合計550万円。**ここ、線を引いてください。」\n\n※財形年金貯蓄で保険商品等を利用する場合など、非課税限度額の扱いには別途ルールがあります。\n\n---\n\n# 【年齢要件も押さえましょう】\n\n「もう一つ、FPで出やすいところです。」\n\n財形住宅貯蓄と財形年金貯蓄は、原則として契約時に**55歳未満の勤労者**であることなどが要件です。\n\n「55歳**以下**じゃありません。」\n\n**55歳未満**\n\nなので、\n\n**54歳 → ○**\n\n**55歳 → ×**\n\n「『未満』までちゃんと見てくださいね。」\n\n---\n\n# 【財形住宅融資につなげる】\n\n「先輩、さっき勉強した財形住宅融資とつながりますよ。」\n\n**給与**\n↓\n**財形貯蓄**\n↓\nコツコツ貯める\n↓\n一定の条件を満たす\n↓\n🏠 **財形住宅融資を利用できる**\n\n「こうやって制度同士をつなげて覚えると、単語の丸暗記じゃなくなります。」\n\n---\n\n# 【3種類を完全整理】\n\n|  | 一般財形 | 財形住宅 | 財形年金 |\n|---|---|---|---|\n| 主な目的 | **自由** | **住宅** | **老後** |\n| 利子等の非課税措置 | × | ○ | ○ |\n| 住宅＋年金の非課税限度額 | ― | **合計で元本550万円** | |\n| 契約時の年齢要件 | 特になし | **55歳未満** | **55歳未満** |\n\n「先輩、全部覚えるより、まずはこの構造です。」\n\n**一般＝自由**\n\n**住宅＝家**\n\n**年金＝老後**\n\nそして、\n\n**住宅＋年金＝550万円**\n\nです。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問です。」\n\n### Q1\n\n使い道が自由なのは？\n\n→ **一般財形貯蓄**\n\n### Q2\n\n一定の要件で利子等が非課税になるのは？\n\n→ **財形住宅貯蓄・財形年金貯蓄**\n\n### Q3\n\n住宅と年金を合わせた非課税限度額は？\n\n→ **元本550万円**\n\n「はい。ここが即答できればまず大丈夫です。」\n\n---\n\n## 【30秒復習】\n\n① 財形貯蓄とは？  \n→ **給与天引きなどで行う勤労者の貯蓄制度**\n\n② 何種類？  \n→ **3種類**\n\n③ 一般財形は？  \n→ **目的自由・利子等は原則課税**\n\n④ 財形住宅は？  \n→ **住宅目的**\n\n⑤ 財形年金は？  \n→ **老後資金目的**\n\n⑥ 住宅＋年金の非課税限度額は？  \n→ **元本550万円**\n\n# 【一文で覚える】\n\n**財形貯蓄＝「給与からコツコツ貯める制度。一般は自由、住宅は家、年金は老後。住宅＋年金は一定の要件で元本550万円まで利子等が非課税」。**\n\n「先輩、最後はこれで覚えましょう。」\n\n**自由 → 一般**\n\n**🏠 → 住宅**\n\n**👴 → 年金**\n\n**住宅＋年金 → 550万円**\n\n「……さっきの財形住宅融資まで一緒につながったでしょう？こうやって制度を単独じゃなく、関連づけて覚えていきましょう。」\n\n"}, {"n": 18, "title": "団体信用生命保険（団信）", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**団体信用生命保険（だんたいしんようせいめいほけん）**、略して**団信（だんしん）**ですね。」\n\n一言でいうと、\n\n**住宅ローンの返済中に契約者（債務者）が死亡・所定の高度障害状態などになった場合、保険金によって住宅ローン残高を返済するための生命保険**\n\nです。\n\n「つまり――」\n\n住宅ローン3,000万円  \n↓  \n返済途中で万一のことが起きる  \n↓  \n団信から保険金  \n↓  \n**残っている住宅ローンを返済**\n\nという仕組みです。\n\n「先輩本人が受け取って自由に使う保険、というより、**住宅ローンを残さないための保険**と考えると分かりやすいですよ。」\n\n---\n\n# B【詳しい解説｜誰を守っているの？】\n\n「先輩が住宅ローンを組んで、家族と家に住んでいるとしましょう。」\n\n🏠住宅ローン残高  \n**2,500万円**\n\nその状態で先輩が亡くなってしまったら？\n\n「家族は悲しいだけじゃなく、住宅ローンの問題まで残ってしまいますよね。」\n\nそこで団信です。\n\n**住宅ローンを借りる**\n↓\n団信に加入\n↓\n返済途中で死亡など\n↓\n生命保険会社から保険金\n↓\n**住宅ローン残高が返済される**\n\nその結果、遺された家族に住宅ローンの返済負担を残さないようにするわけです。\n\n---\n\n## 普通の生命保険と何が違うの？\n\n「先輩、ここはかなり大事です。」\n\n普通の死亡保険なら、\n\n**本人が死亡**\n↓\n家族などの受取人へ\n↓\n💰死亡保険金\n\nですよね。\n\nでも団信では基本的に、\n\n**住宅ローン債務者が死亡など**\n↓\n保険金\n↓\n🏦**住宅ローン残高の返済**\n\nという目的で使われます。\n\n「だから団信は、住宅ローンとセットで考える生命保険なんですね。」\n\n---\n\n# もう一つ｜何でも保障されるわけではありません\n\n「先輩、『病気になったら全部住宅ローンがなくなるの？』と思ったら、それは違います。」\n\n基本的な団信では、一般に\n\n**死亡**\n**所定の高度障害状態**\n\nなどが保障対象です。\n\n一方で商品によっては、\n\n**がん保障**\n**3大疾病保障**\n**8大疾病保障**\n\nなどを付けた団信もあります。\n\n「ただし、どの状態なら住宅ローン残高が返済されるかは契約内容によって違います。」\n\nだから、\n\n**団信＝病気なら何でもローンがゼロ**\n\nではありません。\n\n---\n\n# C【イメージ理解｜家に「ローン消去装置」を付ける】\n\n「先輩、ちょっと極端なイメージで覚えましょう。」\n\n先輩が3,000万円の住宅ローンで家を買いました。\n\n🏠  \n↑  \n💴3,000万円のローン\n\nそこに団信という、\n\n**🛡️『万一のときのローン返済装置』**\n\nを付けておくイメージです。\n\n普通に生活している間は、\n\n先輩  \n→ 毎月返済  \n→ 🏦\n\nでも保障対象となる万一のことが起きたら、\n\n先輩 → ❌返済継続が困難\n\nそこで、\n\n団信  \n→ 💰保険金  \n→ 🏦金融機関  \n→ **対象となる住宅ローン残高を返済**\n\n「これなら、『生命保険なのになぜ住宅ローンの章に出てくるの？』も分かりますよね。」\n\n**住宅ローンを守るための生命保険だから**です。\n\n---\n\n# D【具体例｜3,000万円借りた場合】\n\n「では数字でいきます。」\n\n先輩が、\n\n**住宅ローン3,000万円**\n\nを借りました。\n\n10年間返済して、\n\n**残高2,000万円**\n\nになったところで、団信の保障対象となる死亡が発生したとします。\n\n「団信で重要なのは、最初に借りた3,000万円ではなく――」\n\nその時点の対象となる\n\n**住宅ローン残高2,000万円**\n\nです。\n\n保険金によってその残高が返済されれば、\n\n**住宅ローン残高  \n2,000万円 → 0円**\n\nとなります。\n\n「つまり団信の保障額は、ローン返済が進むにつれて残高に合わせて小さくなっていくイメージですね。」\n\n---\n\n# 【フラット35ともつなげましょう】\n\n「先輩、さっきフラット35をやりましたよね。」\n\nフラット35にも団体信用生命保険の仕組みがありますが、**団信への加入は利用条件として必須ではありません**。\n\n「ここは民間住宅ローンと一緒くたにしないでくださいね。」\n\n一般的な民間住宅ローンでは団信への加入を借入条件としている商品が多い一方、**フラット35は健康上の理由などで団信に加入しなくても利用できる場合があります。**\n\n---\n\n# 【普通の生命保険との違い】\n\n|  | 団体信用生命保険 | 一般的な死亡保険 |\n|---|---|---|\n| 主な目的 | **住宅ローン返済** | **遺族の生活保障など** |\n| 万一のとき | ローン残高の返済へ | 死亡保険金を受取人へ |\n| 保障額のイメージ | **ローン残高に連動** | 契約した保険金額 |\n| 住宅ローンとの関係 | **強い** | 基本的に別 |\n\n「団信という名前だけ暗記するより、**『住宅ローン専用の生命保険』**とイメージしてください。」\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n### Q1\n団信は何のための保険？\n\n→ **住宅ローン残高の返済に備えるため**\n\n### Q2\n住宅ローン3,000万円を借り、残高2,000万円の時点で保障対象となる死亡が発生した場合、基本的に注目するのは？\n\n→ **その時点のローン残高2,000万円**\n\n### Q3\nフラット35では団信加入が絶対条件？\n\n→ **いいえ**\n\n「はい。この3つがつながれば十分です。」\n\n---\n\n## 【30秒復習】\n\n① 略称は？  \n→ **団信**\n\n② 何とセット？  \n→ **住宅ローン**\n\n③ 誰に万一のことが起きる？  \n→ **住宅ローン債務者**\n\n④ 基本的な保障対象は？  \n→ **死亡・所定の高度障害など**\n\n⑤ 保険金は何に使われる？  \n→ **住宅ローン残高の返済**\n\n⑥ 家族にとっての意味は？  \n→ **住宅ローン返済負担を残さないための備え**\n\n# 【一文で覚える】\n\n**団体信用生命保険＝「住宅ローン返済中に債務者が死亡・所定の高度障害状態などになったとき、保険金で住宅ローン残高を返済する生命保険」。**\n\n「先輩、もっと短くします。」\n\n**団信＝『自分に万一があったとき、家のローンを残さない保険』**\n\n「これを中心に置けば、細かい知識も全部つながりますよ。」\n\n"}, {"n": 19, "title": "住宅ローンの借り換え", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、**住宅ローンの借り換え**ですね。」\n\n一言でいうと、\n\n**今の住宅ローンを、新しく借りた住宅ローンで完済して、より有利な条件のローンに乗り換えること**\n\nです。\n\n「スマホの料金プランを乗り換える感覚にちょっと近いですね。」\n\n**A銀行から3,000万円借りる**  \n↓  \n返済して残り2,500万円  \n↓  \n**B銀行から新しく借りる**  \n↓  \nそのお金でA銀行の残債を完済  \n↓  \n今後は**B銀行に返済**\n\n「つまり、借金が2本になるわけではありません。**古いローンを新しいローンに入れ替える**んです。」\n\n---\n\n# B【詳しい解説｜なぜわざわざ借り換えるの？】\n\n「先輩、一番の目的は何だと思います？」\n\n……\n\n「そうです。代表的なのは**返済負担を減らすため**です。」\n\nたとえば現在、\n\n**金利2.0％の住宅ローン**\n\nを返しているとします。\n\nでも現在利用できる別の住宅ローンが、\n\n**金利1.0％**\n\nだったら？\n\n「残っている元金にかかる利息を減らせる可能性がありますよね。」\n\n流れは、\n\n**高い金利のローン**\n↓\n**低い金利のローンへ借り換え**\n↓\n今後発生する利息が減る\n↓\n**総返済額などを減らせる可能性**\n\nとなります。\n\n---\n\n## でも、金利が低ければ絶対お得？\n\n「……先輩、ここです。」\n\n**いいえ。**\n\n借り換えには新しい住宅ローンを組むための、\n\n- 融資手数料\n- 登記関係の費用\n- 印紙税など\n\nといった**諸費用**が発生することがあります。\n\nたとえば、\n\n**利息が50万円減った！**\n\nとしても、\n\n借り換え諸費用  \n→ **40万円**\n\nだったら、\n\n実質的なメリットはかなり小さくなりますよね。\n\nだから、\n\n**金利だけを見るのではなく、諸費用を含めた総額で比較する**\n\n必要があります。\n\n---\n\n# C【イメージ理解｜電車を乗り換える】\n\n「先輩、電車で考えてみましょう。」\n\n今、\n\n🚃 A線  \n→ 運賃が高い  \n→ 目的地まで時間もかかる\n\nそこに、\n\n🚆 B線  \n→ 運賃が安い\n\nというルートを見つけました。\n\n「じゃあB線に乗り換えよう。」\n\nこれが住宅ローンの**借り換え**です。\n\nただし、\n\n「乗り換えるために100万円かかります」\n\nと言われたら？\n\n「え、それ本当に得なの？」\n\nとなりますよね。\n\n住宅ローンでも同じです。\n\n**借り換えによる利息軽減額**\n\nと\n\n**借り換えに必要な諸費用**\n\nを比べないといけません。\n\n---\n\n# D【具体例｜数字で考えましょう】\n\n「たとえば先輩の住宅ローンが――」\n\n**残高2,000万円**\n\n**残り20年**\n\nだったとします。\n\n現在のローンより低金利のローンに借り換えることで、\n\n将来支払う利息などが  \n→ **100万円減る**\n\nとします。\n\nでも借り換え費用が、\n\n→ **30万円**\n\nかかった。\n\nすると単純化すれば、\n\n**100万円 − 30万円  \n＝ 70万円**\n\n「この70万円分が実質的な負担軽減につながる、という考え方ですね。」\n\n※実際の比較では返済方式、金利タイプ、手数料、保証料、団信、税制なども確認する必要があります。\n\n---\n\n# 【繰上げ返済との違い】\n\n「先輩、さっきの**繰上げ返済**と混ざりやすいので整理しますよ。」\n\n|  | 借り換え | 繰上げ返済 |\n|---|---|---|\n| 何をする？ | **別のローンに乗り換える** | **予定より早く元金を返す** |\n| 新しいローン | 組む | 組まない |\n| 主な狙い | 金利・条件などを改善 | 元金・利息を減らす |\n| 諸費用 | 新規ローンの費用等に注意 | 手数料等を確認 |\n\n「要するに――」\n\n**繰上げ返済＝自分のお金を追加投入して借金を減らす**\n\n**借り換え＝別のローンを使って今のローンを入れ替える**\n\nです。\n\nここ、かなり大事ですよ。\n\n---\n\n# 【借り換えを考えやすい条件】\n\n「FPの勉強としては、どういうときに借り換えのメリットが出やすいかもイメージしておきましょう。」\n\n一般的には、\n\n**ローン残高が大きい**\n＋\n**残りの返済期間が長い**\n＋\n**借り換え後の金利が低い**\n\nほど、利息を減らせる余地が大きくなります。\n\n「逆に残り100万円、あと1年で完済、みたいな状況なら？」\n\n……\n\n「金利が多少低くなっても、諸費用をかけて借り換えるメリットは出にくいですよね。」\n\nこの**理由まで理解しておく**と丸暗記が減ります。\n\n---\n\n# 【理解確認】\n\n「先輩、3問いきます。」\n\n### Q1\n住宅ローンの借り換えとは？\n\n→ **新しい住宅ローンを借りて、現在の住宅ローンを完済し、新しいローンに乗り換えること**\n\n### Q2\n金利が下がれば必ず得？\n\n→ **いいえ。借り換えにかかる諸費用も考える必要がある**\n\n### Q3\n繰上げ返済との大きな違いは？\n\n→ **借り換えでは新しいローンを組む**\n\n「はい。ここまで言えれば十分です。」\n\n---\n\n## 【30秒復習】\n\n① 借り換えとは？  \n→ **住宅ローンの乗り換え**\n\n② 古いローンは？  \n→ **新しいローンで完済**\n\n③ 代表的な目的は？  \n→ **返済負担の軽減**\n\n④ 低金利に借り換えると？  \n→ **利息を減らせる可能性**\n\n⑤ 注意点は？  \n→ **諸費用がかかる**\n\n⑥ 判断するときは？  \n→ **諸費用まで含めて比較**\n\n# 【一文で覚える】\n\n**住宅ローンの借り換え＝「新しく住宅ローンを借りて現在のローンを完済し、より有利な条件への変更を図ること」。**\n\n「先輩、試験用ならもっと短く――」\n\n**借り換え  \n＝ 新ローンで旧ローンを完済  \n＝ ローンのお引っ越し**\n\n「そして、**金利が下がっただけで喜ばず、諸費用まで見る**。ここまでセットで覚えてくださいね。」\n"}, {"n": 20, "title": "社会保険", "raw": "## A【要点｜まず全体を掴みましょう】\n\n「先輩、次は**社会保険**ですね。ここから範囲が一気に広く見えますけど、最初に全体図を作れば大丈夫です。」\n\n社会保険とは、ざっくり言えば、\n\n**病気・けが・老後・失業・介護など、生活上のリスクを社会全体で支える公的な保険制度**\n\nです。\n\n「先輩一人で全部のリスクに備えるのではなく、みんなで保険料を出し合って、必要になった人を制度で支えるわけですね。」\n\nFPでは、まずこの**5つ**を押さえましょう。\n\n| 制度 | 何に備える？ |\n|---|---|\n| **医療保険** | 病気・けが |\n| **介護保険** | 介護 |\n| **年金保険** | 老齢・障害・死亡 |\n| **雇用保険** | 失業・育児休業など |\n| **労災保険** | 仕事・通勤中のけがなど |\n\n「まずは細かい制度名より、**何が起きたときに誰が助けてくれるのか**を掴みますよ。」\n\n---\n\n# B【詳しい解説｜5つはどう違うの？】\n\n## ① 医療保険＝病気・けが\n\n「先輩、病院に行って医療費が1万円かかったとします。」\n\n公的医療保険があるため、一定の自己負担で医療を受けられます。\n\n代表的なのが、\n\n**健康保険**\n→ 主に会社員など\n\n**国民健康保険**\n→ 自営業者など、他の医療保険に加入していない人\n\nです。\n\n「つまり、病院に行ったときに身近に感じる社会保険ですね。」\n\n---\n\n## ② 介護保険＝介護が必要になったとき\n\n「では、高齢になって介護が必要になったら？」\n\nそこで**介護保険**です。\n\n一定の要件を満たして要介護・要支援認定などを受けることで、介護サービスを利用できます。\n\n「医療保険が**治療**を支えるイメージなら、介護保険は**介護生活**を支えるイメージですね。」\n\n---\n\n## ③ 年金保険＝老後だけじゃない\n\n「先輩、『年金＝65歳くらいになったらもらうお金』だけで覚えてません？」\n\n「……それだと足りません。」\n\n公的年金には大きく、\n\n**老齢**\n→ 年を取った\n\n**障害**\n→ 一定の障害状態になった\n\n**遺族**\n→ 家族の生計を支えていた人などが亡くなった\n\nという3つの保障があります。\n\nつまり、\n\n**老齢・障害・死亡**\n\nに備える制度なんですね。\n\n---\n\n## ④ 雇用保険＝働けなくなった・仕事を失った\n\n「会社を辞めて、次の仕事がすぐ見つからなかった。」\n\nそんなときに関係してくるのが**雇用保険**です。\n\n代表的なのが、失業時の**基本手当**ですね。\n\nさらに、育児休業などに関係する給付もあります。\n\n「だから単純に『失業保険』だけで覚えないでください。」\n\n**雇用に関する生活保障**\n\nくらいのイメージを持っておきましょう。\n\n---\n\n## ⑤ 労災保険＝仕事・通勤が原因\n\n「最後、これは区別しやすいですよ。」\n\n先輩が仕事中に、\n\n「痛っ！」\n\nとけがをした。\n\nあるいは通勤途中に一定の事故に遭った。\n\nそこで関係するのが**労災保険（労働者災害補償保険）**です。\n\n**業務上の災害**\n＋\n**通勤災害**\n\nなどを保障します。\n\n「つまり、普通に病気になったのか、それとも**仕事・通勤が原因なのか**で制度が変わってくるわけですね。」\n\n---\n\n# 【ここで一度、全部つなげます】\n\n「先輩が人生を送っているところを想像してください。」\n\n元気に働く  \n↓\n🤒 病気になった  \n→ **医療保険**\n\n👴 介護が必要になった  \n→ **介護保険**\n\n👴 老後を迎えた  \n→ **年金保険**\n\n💼 失業した  \n→ **雇用保険**\n\n🏭 仕事中にけがをした  \n→ **労災保険**\n\n「ほら。制度名を5個暗記するより、**人生で何が起こったか**に結びつけた方が簡単でしょう？」\n\n---\n\n# C【イメージ理解｜5人の守備担当】\n\n「社会保険を、先輩を守る5人の担当者だと思ってください。」\n\n先輩「病院に行きます！」\n\n🏥医療保険  \n「私です。」\n\n先輩「介護が必要になりました！」\n\n👴介護保険  \n「こちらです。」\n\n先輩「老後になりました。」\n\n💰年金保険  \n「私の担当です。」\n\n先輩「仕事を失いました……。」\n\n💼雇用保険  \n「こちらへ。」\n\n先輩「仕事中にけがしました！」\n\n⛑️労災保険  \n「それは私です。」\n\n「……先輩、何でも健康保険のところに持っていかないでくださいね。それぞれ担当が違いますから。」\n\n---\n\n# D【具体例｜これは何保険？】\n\n「では実際に判断してみましょう。」\n\n### ケース①\n休日に自宅で転んで骨折した。\n\n→ **医療保険**\n\n「仕事が原因ではありませんね。」\n\n### ケース②\n工場で作業中、機械で手を負傷した。\n\n→ **労災保険**\n\n「今度は**業務中**です。」\n\n### ケース③\n会社を退職し、一定の要件を満たして求職活動をしている。\n\n→ **雇用保険**\n\n### ケース④\n高齢になり、要介護認定を受けて介護サービスを利用する。\n\n→ **介護保険**\n\n### ケース⑤\n一定の年齢・要件を満たして老齢年金を受け取る。\n\n→ **年金保険**\n\n「こういうふうに、**出来事→制度**で判断できるようにしましょう。」\n\n---\n\n# 【会社員なら、さらにこう整理】\n\n「先輩、FPではこの先もっと細かくなります。」\n\n会社員を中心に見ると、\n\n**医療**\n→ 健康保険\n\n**年金**\n→ 国民年金＋厚生年金保険\n\n**仕事を失うなど**\n→ 雇用保険\n\n**仕事・通勤中の災害**\n→ 労災保険\n\n**介護**\n→ 介護保険\n\nと、それぞれ制度が分かれています。\n\n「今は細かい給付額や加入条件を全部詰め込まなくて大丈夫です。まず**社会保険という大きな箱の中に何が入っているか**を作る段階です。」\n\n---\n\n# 【理解確認】\n\n「先輩、5問……と言いたいところですが、3問で確認します。」\n\n### Q1\n仕事中にけがをした。\n\n→ **労災保険**\n\n### Q2\n失業して求職活動をしている。\n\n→ **雇用保険**\n\n### Q3\n公的年金が備えているのは老後だけ？\n\n→ **いいえ。老齢・障害・死亡などに備える**\n\n「はい。いいですね。」\n\n---\n\n## 【30秒復習】\n\n① 病気・けが  \n→ **医療保険**\n\n② 介護  \n→ **介護保険**\n\n③ 老齢・障害・死亡  \n→ **年金保険**\n\n④ 失業など  \n→ **雇用保険**\n\n⑤ 仕事・通勤中の災害  \n→ **労災保険**\n\n⑥ 全部まとめると？  \n→ **生活上のさまざまなリスクを社会全体で支える仕組み**\n\n# 【一文で覚える】\n\n**社会保険＝「病気・けが・介護・老齢・障害・死亡・失業・労働災害などの生活上のリスクを、社会全体で支える公的な保険制度」。**\n\n「先輩、最初はもっと単純でいいですよ。」\n\n**病気 → 医療  \n介護 → 介護  \n老後など → 年金  \n失業 → 雇用  \n仕事の事故 → 労災**\n\n「この5本の柱を先に立てましょう。ここから健康保険、国民健康保険、公的年金と枝分かれさせれば、社会保険はかなり整理しやすくなります。」\n公的医療保険\n"}, {"n": 21, "title": "公的医療保険", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、次は公的医療保険ですね。さっきの『社会保険』という大きな箱から、医療の部分だけ取り出して詳しく見る段階です。」\n\n一言でいうと、\n\n病気やけがをしたときの医療費負担を、社会全体で支える公的な保険制度\n\nです。\n\n「病院の窓口で、医療費の全額を毎回自分で払わなくていいのは、この仕組みがあるからですね。」\n\nFPでは、まず大きく3つに整理すると分かりやすいです。\n\n主な対象者\t公的医療保険\n会社員など\t健康保険\n自営業者など\t国民健康保険\n原則75歳以上\t後期高齢者医療制度\n「まずは、その人の立場によって入る制度が違う。ここからです。」\n\nB【詳しい解説｜3つはどう違うの？】\n① 健康保険\n「先輩が会社員として会社に勤めているとしましょう。」\n\n基本的には、\n\n会社員\n↓\n健康保険\n\nです。\n\n代表的な保険者には、\n\n全国健康保険協会（協会けんぽ）\n\nや\n\n健康保険組合\n\nなどがあります。\n\n「そして健康保険には、FPで非常に重要な特徴があります。」\n\nそれが、\n\n被扶養者\n\nです。\n\n一定の要件を満たす家族なら、被扶養者として健康保険の対象になれます。\n\n「この『扶養』という考え方、あとで国民健康保険と比較すると重要になりますよ。」\n\n② 国民健康保険\n「じゃあ先輩が会社を辞めて、自営業を始めたとします。」\n\n会社の健康保険などに入っていない。\n\nそこで、\n\n国民健康保険\n\nが出てきます。\n\n代表的には、\n\n自営業者・フリーランスなど\n\nが加入します。\n\n「ただし、ここで健康保険との大きな違い。」\n\n国民健康保険には、原則として健康保険のような**『被扶養者』という仕組みがありません。**\n\n「え、家族は？」\n\n家族も加入要件を満たせば、それぞれ国民健康保険の被保険者になります。\n\nここ、試験で狙いやすいですよ。\n\n③ 後期高齢者医療制度\n「では年齢が上がっていきます。」\n\n原則として75歳以上になると、\n\n後期高齢者医療制度\n\nの対象になります。\n\nまた、一定の障害があり認定を受けた65歳以上75歳未満の人も対象となる場合があります。\n\n「だから試験用の軸としては、まず――」\n\n75歳\n\nを覚えてください。\n\n【全体の流れを作りましょう】\n「先輩、会社員として働いている人生をイメージしてみますよ。」\n\n👨 会社員\n↓\n健康保険\n\nその後、独立して自営業\n↓\n国民健康保険\n\nそして原則75歳になる\n↓\n後期高齢者医療制度\n\n「もちろん実際の加入関係は働き方などによって変わりますが、制度の違いを理解するイメージとしてはこれで十分です。」\n\nC【イメージ理解｜病院の入口は同じでも、持っている会員証が違う】\n「先輩、病院を一つの施設だと思ってください。」\n\n🏥「診察しますよ」\n\nそこへ3人来ました。\n\n👨‍💼 Aさん\n会社員です。\n\n→ 健康保険\n\n👨‍🍳 Bさん\n自営業で、他の医療保険には加入していません。\n\n→ 国民健康保険\n\n👴 Cさん\n78歳です。\n\n→ 後期高齢者医療制度\n\n「3人とも公的医療保険に入っています。でも、所属している制度が違うわけですね。」\n\nだから、\n\n公的医療保険＝健康保険\n\nではありません。\n\n「健康保険は、公的医療保険という大きなグループの一つです。」\n\nD【具体例｜医療費1万円なら？】\n「では先輩、病院で保険診療を受けて、医療費が1万円だったとしましょう。」\n\nたとえば自己負担割合が3割の人なら、\n\n10,000円 × 30％\n＝3,000円\n\nを窓口で負担します。\n\n残りについては、公的医療保険から給付されます。\n\n「だから、病院で『3割負担』という言葉を聞くわけですね。」\n\nただし先輩、\n\n全員が必ず3割\n\nではありません。\n\n年齢や所得などによって自己負担割合は異なります。\n\n「なのでFPでは、『公的医療保険がある＝全員3割』とは覚えないでください。」\n\n【健康保険と国民健康保険の重要な違い】\n「ここ、今後の給付を勉強するときにも効いてきます。」\n\n健康保険\t国民健康保険\n代表的な加入者\t会社員など\t自営業者など\n被扶養者制度\tある\tない\n業務外の病気・けが\t給付対象\t給付対象\n保険料\t事業主と被保険者で負担する仕組み\t世帯等を基礎に算定\n「特に覚えてほしいのが――」\n\n会社員の健康保険 → 扶養あり\n\n国民健康保険 → 扶養なし\n\nです。\n\n【この先につながる重要給付】\n「先輩、公的医療保険は『病院で3割払う制度』だけじゃありません。」\n\nこの後FPでは、\n\n高額療養費\n→ 医療費の自己負担が高額になったとき\n\n傷病手当金\n→ 病気・けがで会社を休んだとき\n\n出産育児一時金\n→ 出産したとき\n\n出産手当金\n→ 出産のため会社を休んだとき\n\nなどを勉強します。\n\n「ここから一気に制度名が増えますけど、大丈夫です。」\n\n全部、\n\n何が起きた？\n↓\nどの制度が助けてくれる？\n\nで整理していきます。\n\n【理解確認】\n「はい、先輩。3問いきます。」\n\nQ1\n会社員などが加入する代表的な公的医療保険は？\n\n→ 健康保険\n\nQ2\n自営業者などが加入する代表的なものは？\n\n→ 国民健康保険\n\nQ3\n原則75歳以上になると？\n\n→ 後期高齢者医療制度\n\n「もう一つだけ。」\n\n国民健康保険に『被扶養者』は？\n\n→ 原則ありません。\n\n「はい。ここ重要です。」\n\n【30秒復習】\n① 公的医療保険は何に備える？\n→ 病気・けがなど\n\n② 会社員など\n→ 健康保険\n\n③ 自営業者など\n→ 国民健康保険\n\n④ 原則75歳以上\n→ 後期高齢者医療制度\n\n⑤ 健康保険の扶養制度\n→ ある\n\n⑥ 国民健康保険の扶養制度\n→ ない\n\n【一文で覚える】\n公的医療保険＝「病気やけがなどの医療費を社会全体で支える制度で、会社員などは健康保険、自営業者などは国民健康保険、原則75歳以上は後期高齢者医療制度」。\n\n「先輩、まず頭に3つの箱を置いてください。」\n\n会社員 → 健康保険\n\n自営業 → 国民健康保険\n\n75歳 → 後期高齢者\n\n「ここを土台にして、次に療養の給付、高額療養費、傷病手当金なんかを乗せていけば、公的医療保険はかなりきれいに整理できますよ。」\n\n健康保険\n"}, {"n": 22, "title": "健康保険", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、今度は公的医療保険の中から健康保険だけを取り出しますよ。」\n\n一言でいうと、\n\n会社員などとその被扶養者が、業務外の病気・けが・出産・死亡などに備える公的医療保険\n\nです。\n\n「ここで、ものすごく大事な言葉があります。」\n\n業務外\n\nです。\n\n「仕事中や通勤中のけがなら？」\n\n……そうです。\n\n→ 労災保険\n\n「仕事とは関係なく風邪をひいた、休日に転んでけがをした、という場合は？」\n\n→ 健康保険\n\nまず、\n\n業務外 → 健康保険\n業務上・通勤 → 労災保険\n\nと分けましょう。\n\nB【詳しい解説｜誰が入るの？】\n「先輩、会社に就職したとします。」\n\n会社員で一定の加入要件を満たす\n↓\n健康保険の被保険者\n\nになります。\n\nさらに、一定の要件を満たした家族なら、\n\n被扶養者\n\nとして健康保険の対象になることがあります。\n\n「さっき国民健康保険との違いでやりましたね。」\n\n健康保険\n→ 被扶養者制度あり\n\n国民健康保険\n→ 被扶養者制度なし\n\n「ここはセットです。」\n\n【誰が運営しているの？】\n「健康保険には代表的に2種類あります。」\n\n① 協会けんぽ\n正式には、\n\n全国健康保険協会管掌健康保険\n\nです。\n\n主に健康保険組合を持たない企業の従業員などが加入します。\n\n「試験では協会けんぽという名前で覚えておけば入りやすいですね。」\n\n② 組合健保\n企業や企業グループなどが設立した、\n\n健康保険組合\n\nが運営します。\n\n「つまり大きくイメージすると――」\n\n会社員\n↓\n健康保険\n↙　　　↘\n協会けんぽ　健康保険組合\n\nです。\n\n【保険料は誰が払う？】\n「先輩、会社員の健康保険の大きな特徴です。」\n\n健康保険料は原則、\n\n会社（事業主）と本人（被保険者）が負担\n\nします。\n\n「会社が全部払ってくれるわけでも、先輩が全部払うわけでもありません。」\n\nいわゆる、\n\n労使折半\n\nが基本です。\n\nたとえば単純化して、\n\n健康保険料が月3万円なら、\n\n👨‍💼本人\n→ 1万5,000円\n\n🏢会社\n→ 1万5,000円\n\nというイメージですね。\n\n※健康保険組合では規約により事業主負担を多くすることもあります。\n\n【何をしてくれるの？】\n「ここからが健康保険の本体です。」\n\n病院代だけじゃありませんよ。\n\n代表的な給付を並べると、\n\n療養の給付\n→ 病気・けがで診療を受ける\n\n高額療養費\n→ 医療費の自己負担が高額になった\n\n傷病手当金\n→ 病気・けがで働けず、給与を十分受けられない\n\n出産育児一時金\n→ 出産した\n\n出産手当金\n→ 出産のため仕事を休み、給与を十分受けられない\n\n「先輩、『健康保険＝病院代3割』だけで止めないでくださいね。」\n\n医療費＋働けないとき＋出産\n\nまでカバーしています。\n\nC【イメージ理解｜会社員の先輩に1年間密着】\n「先輩が会社員だとします。」\n\n4月\n休日に転んで骨折。\n\n「痛っ……。」\n\n🏥 → 健康保険\n\n7月\n大きな病気で医療費の自己負担が高額になった。\n\n💰「さすがに負担が重い……。」\n\n→ 高額療養費\n\n10月\n病気で長期間仕事を休むことになった。\n\n💼「給料が出ない……。」\n\n→ 一定の要件を満たせば傷病手当金\n\n「見えてきました？」\n\n健康保険は単に、\n\n病院代を安くする制度\n\nではなく、\n\n病気・けがなどによって生活が経済的に苦しくなることにも備える制度\n\nなんです。\n\nD【具体例｜健康保険か労災か判断しましょう】\n「先輩、ここは問題形式が一番分かりやすいです。」\n\nケース①\n日曜日、自宅の階段から落ちてけがをした。\n\n「仕事と関係あります？」\n\n→ ありません。\n\n→ 健康保険\n\nケース②\n会社で荷物を運んでいる最中に転倒してけがをした。\n\n「これは？」\n\n→ 業務上\n\n→ 労災保険\n\nケース③\n一定の通勤経路で通勤中に事故に遭った。\n\n→ 通勤災害として労災保険の対象になり得る\n\n「つまり――」\n\n休日・私生活などでの病気やけが\n→ 健康保険\n\n仕事・通勤が原因\n→ 労災保険\n\nという切り分けです。\n\n【本人と家族の違いも重要】\n「先輩、もう一段だけいきますよ。」\n\n会社員本人は、\n\n被保険者\n\n一定の条件を満たして扶養されている家族は、\n\n被扶養者\n\nです。\n\nただし、給付には本人にしかないものもあります。\n\n代表例が、\n\n傷病手当金\n\n出産手当金\n\nです。\n\n「なぜだと思います？」\n\n……\n\n「これらは、本人が働けなくなって収入が減ることを補う性格の給付だからですね。」\n\n一方、\n\n出産育児一時金\n\nなどは、被扶養者に関係する給付もあります。\n\n「ここは後で各給付を一個ずつ勉強するときに詳しくやれば大丈夫です。」\n\n【国民健康保険との比較】\n健康保険\t国民健康保険\n主な対象\t会社員など\t自営業者など\n被扶養者制度\tあり\tなし\n保険料\t原則、事業主と被保険者で負担\t加入者側で負担\n傷病手当金\t制度としてあり\t原則として法定給付ではない\n出産手当金\t制度としてあり\t原則として法定給付ではない\n「先輩、この違いは今後かなり重要になってきます。」\n\n【理解確認】\n「はい、3問いきます。」\n\nQ1\n健康保険が基本的に対象とするのは、業務上・業務外どっち？\n\n→ 業務外\n\nQ2\n仕事中のけがは？\n\n→ 労災保険\n\nQ3\n健康保険に被扶養者制度はある？\n\n→ ある\n\n「はい。まずこの3つを固めましょう。」\n\n【30秒復習】\n① 主な加入者\n→ 会社員など\n\n② 家族\n→ 一定の要件で被扶養者になれる\n\n③ 対象となる病気・けが\n→ 業務外\n\n④ 業務上・通勤災害\n→ 労災保険\n\n⑤ 保険料\n→ 原則、労使折半\n\n⑥ 代表的給付\n→ 療養の給付・高額療養費・傷病手当金・出産関係など\n\n【一文で覚える】\n健康保険＝「会社員などとその被扶養者の、業務外の病気・けが・出産・死亡などに備える公的医療保険」。\n\n「先輩、さらに圧縮します。」\n\n会社員 → 健康保険\n\n仕事外 → 健康保険\n\n仕事中・通勤 → 労災\n\n扶養 → あり\n\n「この4本を土台にしてください。次に療養の給付・高額療養費・傷病手当金を乗せると、健康保険の全体像がきれいにつながります。」\n\n協会けんぽと組合健保\n"}, {"n": 23, "title": "協会けんぽと組合健保", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、協会けんぽと組合健保ですね。」\n\n「これ、別々の種類の保険だと思うとややこしくなります。まず箱を作りますよ。」\n\nどちらも、\n\n会社員などが加入する「健康保険」\n\nです。\n\n違うのは主に、誰が保険者として運営しているかです。\n\n協会けんぽ\n→ 全国健康保険協会が運営\n\n組合健保\n→ 企業などが設立した健康保険組合が運営\n\n「つまり――」\n\n健康保険\n↙　　　　　　↘\n協会けんぽ　　組合健保\n\nという関係です。\n\nB【詳しい解説｜なぜ2種類あるの？】\n「先輩が会社に入社したとします。」\n\nそこで、\n\n「自分は健康保険に入るんだな」\n\nまでは同じです。\n\nでも会社によって、\n\nどこの健康保険に加入するのか\n\nが違います。\n\n① 協会けんぽ\n正式名称は、\n\n全国健康保険協会管掌健康保険\n\nです。\n\n「……長いので、試験でも普段でも協会けんぽで覚えておけば大丈夫です。」\n\n主に、\n\n自社の健康保険組合を持っていない中小企業などの従業員\n\nが加入しています。\n\n運営するのは、\n\n全国健康保険協会\n\nです。\n\nつまり、\n\n🏢会社\n↓\n「うちには独自の健康保険組合がない」\n↓\n協会けんぽに加入\n\nというイメージですね。\n\n② 組合健保\n「一方、ある程度規模の大きな企業などでは、自分たちで健康保険組合を設立していることがあります。」\n\nたとえば、\n\n🏢大企業\n↓\n「自分たちの健康保険組合を作ろう」\n↓\n○○健康保険組合\n\nという感じです。\n\nこれが、\n\n組合管掌健康保険＝組合健保\n\nです。\n\n【一番大事な違い｜付加給付】\n「先輩、ここからが試験でも理解でも重要です。」\n\n組合健保では、法律で定められた給付に加えて、\n\n独自の付加給付\n\nを行っている場合があります。\n\n「え？ どういうこと？」\n\nたとえば法定の健康保険給付に加えて、その健康保険組合独自のルールで、\n\n医療費の自己負担をさらに軽減する\n\nなどの給付を設けることがあります。\n\nだから、\n\n法定給付\n＋\n組合独自の付加給付\n\nという場合があるんですね。\n\n「ただし、先輩。**すべての組合健保で同じ付加給付があるわけではありません。**健康保険組合によって内容は違います。」\n\n【保険料も同じじゃないの？】\n「そこも違いがあります。」\n\n協会けんぽ\n保険料率は都道府県支部ごとに設定されます。\n\n「だから全国どこでも完全に同じ、ではありません。」\n\n組合健保\n各健康保険組合が一定の範囲内で保険料率を設定します。\n\nそのため、\n\n「会社が違えば加入している健康保険組合も違い、保険料率も違う」\n\nということがあります。\n\nC【イメージ理解｜全国チェーンと会社専用店】\n「先輩、ちょっとお店で考えましょう。」\n\n🏪 協会けんぽ\n大きな全国組織があって、\n\n「自前の健康保険組合を持っていない会社はこちらへ」\n\nというイメージ。\n\n→ 全国健康保険協会が運営\n\n🏢 組合健保\n「うちの企業・グループなどで健康保険組合を作ります。」\n\n→ その健康保険組合が運営\n\nさらに、\n\n「うちの組合では、法定給付に加えてこんな付加給付も用意します」\n\nということもできる。\n\n「だから組合健保は、企業などのグループ専用の健康保険くらいのイメージを持つと区別しやすいですね。」\n\nD【具体例｜先輩が転職したら？】\n「先輩がA社で働いているとしましょう。」\n\nA社には健康保険組合がありません。\n\nだから、\n\n👨‍💼先輩\n↓\n🏢A社\n↓\n協会けんぽ\n\nに加入。\n\nその後、大企業B社へ転職しました。\n\nB社には、\n\nB社健康保険組合\n\nがあったとします。\n\nすると、\n\n👨‍💼先輩\n↓\n🏢B社\n↓\nB社健康保険組合\n\nに加入します。\n\n「同じ先輩、同じ『会社員の健康保険』なのに、勤務先によって保険者が変わったわけですね。」\n\n【ここ、混ぜないでください】\n協会けんぽ\t組合健保\nどちらも？\t会社員などの健康保険\t会社員などの健康保険\n保険者\t全国健康保険協会\t健康保険組合\n主なイメージ\t中小企業など\t大企業・企業グループなど\n保険料率\t都道府県支部ごと\t組合ごと\n独自の付加給付\t基本は法定給付\t設けている場合がある\n「先輩、ここで大事なのは、」\n\n協会けんぽ vs 国民健康保険\n\nではないんです。\n\n協会けんぽと組合健保は、\n\nどちらも健康保険の仲間\n\nです。\n\n【理解確認】\n「はい、先輩。3問いきます。」\n\nQ1\n協会けんぽを運営しているのは？\n\n→ 全国健康保険協会\n\nQ2\n組合健保を運営しているのは？\n\n→ 各健康保険組合\n\nQ3\n法定給付に加えて独自の付加給付を行う場合があるのは？\n\n→ 組合健保\n\n「はい。ここまで言えればかなり整理できています。」\n\n【30秒復習】\n① どちらも何？\n→ 健康保険\n\n② 協会けんぽの保険者\n→ 全国健康保険協会\n\n③ 組合健保の保険者\n→ 健康保険組合\n\n④ 協会けんぽの保険料率\n→ 都道府県支部ごと\n\n⑤ 組合健保の保険料率\n→ 組合ごと\n\n⑥ 組合健保の特徴\n→ 独自の付加給付を行う場合がある\n\n【一文で覚える】\n協会けんぽ＝「全国健康保険協会が運営する健康保険」\n組合健保＝「企業などが設立した健康保険組合が運営する健康保険」。\n\n「先輩、さらに短くします。」\n\n協会けんぽ → みんな側の大きな箱\n\n組合健保 → 企業などの専用箱\n\n「ただし、どちらも上にある大きな分類は**『健康保険』**。ここを崩さなければ、この先の健康保険制度も迷子になりにくいですよ。」\n\n療養の給付と家族療養費\n"}, {"n": 24, "title": "療養の給付と家族療養費", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、療養の給付と家族療養費ですね。」\n\n「名前が違うので別物に見えますけど、まず超シンプルに分けます。」\n\n本人が病院に行く\n→ 療養の給付\n\n扶養されている家族が病院に行く\n→ 家族療養費\n\n「はい。まずこれです。」\n\nどちらも健康保険によって、病気やけがの診察・治療などを受けるときの負担を支える仕組みです。\n\nB【詳しい解説｜なぜ名前が違うの？】\n「先輩が会社員で、健康保険の被保険者本人だとします。」\n\n先輩が休日に風邪をひきました。\n\n👨‍💼先輩\n「熱が出た……。」\n\n↓ 病院へ\n\n🏥 診察・治療\n\nこのとき健康保険から受ける基本的な給付が、\n\n療養の給付\n\nです。\n\n「じゃあ、先輩の健康保険の被扶養者になっている家族が病院に行ったら？」\n\n👨‍👩‍👧 家族\n↓\n🏥病院\n↓\n家族療養費\n\nとなります。\n\n「つまり違いは、基本的に誰が医療を受けたのかなんですね。」\n\n「療養」って具体的に何？\n「先輩、『療養』って入院だけみたいに聞こえません？」\n\n「違いますよ。」\n\n対象となる代表的なものには、\n\n診察\n薬剤・治療材料\n処置・手術などの治療\n入院・看護\n\nなどがあります。\n\n「普通に病院で診察を受けたり、薬を処方してもらったりするところから関係しています。」\n\n【ここ重要｜現金をもらうわけじゃない】\n「先輩、『療養の給付だから、お金が振り込まれるの？』って思いませんでした？」\n\n「ここ、かなり大事です。」\n\n通常、病院の窓口では、対象となる保険診療について自己負担分だけを支払いますよね。\n\nたとえば、\n\n医療費\n10,000円\n\n自己負担割合\n3割\n\nなら、\n\n先輩が窓口で払う\n→ 3,000円\n\n残り\n→ 7,000円\n\n「この7,000円をいったん先輩が受け取るわけではありません。」\n\n医療というサービスそのものを給付として受けるので、\n\n現物給付\n\nといいます。\n\n「『お金をもらう』ではなく、医療サービスを受ける。ここを押さえてください。」\n\nC【イメージ理解｜健康保険の家族カード】\n「先輩を健康保険の本人だとしましょう。」\n\n👨‍💼先輩本人\n「風邪ひきました。」\n\n🏥病院へ\n↓\n保険診療を受ける\n↓\n療養の給付\n\n👧被扶養者の子ども\n「私も風邪ひいた。」\n\n🏥病院へ\n↓\n保険診療を受ける\n↓\n家族療養費\n\n「やっていることはかなり似ていますよね。」\n\n違うのは、\n\n本人なのか、扶養家族なのか\n\nです。\n\nだから試験で名前が出てきたら、\n\n療養の給付 → 本人\n\n家族療養費 → 家族\n\nと反応してください。\n\nD【具体例｜1万円の医療費】\n「では先輩本人が病院に行き、保険診療の医療費が1万円だったとします。」\n\n仮に自己負担3割なら、\n\n10,000円 × 30％\n＝3,000円\n\n先輩が支払います。\n\n「これは？」\n\n→ 療養の給付\n\n「今度は、先輩の被扶養者である家族が、同じく1万円の保険診療を受けました。」\n\n仮にその人の自己負担割合が3割なら、\n\n→ 窓口負担 3,000円\n\n「こちらは？」\n\n→ 家族療養費\n\n「はい。同じように病院で医療を受けていても、本人か家族かで給付の名称が変わるわけです。」\n\n※実際の自己負担割合は年齢・所得などによって異なります。\n\n【療養費とは区別してください】\n「先輩、ここで名前が似ている厄介なものがあります。」\n\n療養の給付\nと\n療養費\n\nは同じではありません。\n\n通常の保険診療なら、\n\n病院で自己負担分だけ払う\n→ 療養の給付\n\n一方、一定の事情でいったん医療費を全額自己負担して、あとから申請して保険給付分の払い戻しを受ける場合などが、\n\n療養費\n\nです。\n\n「『療養の給付』と『療養費』、名前が似てますけど仕組みが違います。ここ、あとで出てきたら改めて整理しましょう。」\n\n【整理すると】\n誰が？\t給付\n被保険者本人\t療養の給付\n被扶養者\t家族療養費\n「先輩、これだけなら10秒で覚えられます。」\n\n本人 → 療養\n\n家族 → 家族療養\n\nです。\n\n【理解確認】\n「では3問です。」\n\nQ1\n健康保険の被保険者本人が病院で保険診療を受けた。\n\n→ 療養の給付\n\nQ2\n被扶養者が病院で保険診療を受けた。\n\n→ 家族療養費\n\nQ3\n療養の給付は、通常、医療費全額をいったん払って後からお金を受け取る仕組み？\n\n→ いいえ。原則として自己負担分を支払い、医療サービスそのものを受ける現物給付です。\n\n「はい。ここまで理解できれば十分です。」\n\n【30秒復習】\n① 本人が病院\n→ 療養の給付\n\n② 家族が病院\n→ 家族療養費\n\n③ 対象となる家族\n→ 被扶養者\n\n④ 診察・薬・治療など\n→ 対象になる\n\n⑤ 療養の給付の基本\n→ 現物給付\n\n⑥ 自己負担割合\n→ 年齢・所得などで異なる\n\n【一文で覚える】\n療養の給付＝「被保険者本人の医療」\n家族療養費＝「被扶養者の医療」\n\n「先輩、これは名前からそのまま取ってください。」\n\n本人 → 療養の給付\n\n家族 → 『家族』療養費\n\n「……『家族』ってちゃんと書いてくれてるんですから、試験で入れ替えないでくださいね。」\n\n高額医療費と傷病手当金\n"}, {"n": 25, "title": "高額療養費と傷病手当金", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、今回は 高額療養費 と 傷病手当金 ですね。」\n\n「あ、最初に名前だけ修正です。一般に制度名は**高額医療費ではなく『高額療養費』**です。ここ、FPでは正式名称で覚えてください。」\n\nこの2つ、どちらも健康保険に関係しますが、守っているお金が違います。\n\n高額療養費\n→ 医療費が高すぎるとき、医療費の自己負担を抑える\n\n傷病手当金\n→ 病気・けがで働けないとき、収入減少を補う\n\n「つまり先輩――」\n\n治療費が大変 → 高額療養費\n\n働けなくて給料が大変 → 傷病手当金\n\nまずこの2本です。\n\nB【詳しい解説｜高額療養費からいきましょう】\n「先輩、大きな病気で入院して、医療費の自己負担がものすごく高くなったとします。」\n\nたとえば窓口負担が、\n\n30万円\n\nになった。\n\n「3割負担とはいえ、30万円はかなり大きいですよね。」\n\nそこで、\n\n高額療養費\nです。\n\n1か月の医療費の自己負担額が一定の上限を超えた場合、\n\n超えた部分が高額療養費として支給される\n\n仕組みです。\n\n「先輩、ここ重要です。」\n\n上限額は全員一律ではありません。\n\n年齢や所得などによって異なります。\n\n「医療費が100万円なら、3割の30万円を全部払うの？」\n「そこを助けるのが高額療養費です。」\n\nたとえば70歳未満で標準報酬月額28万～50万円の区分なら、自己負担限度額は、\n\n80,100円 ＋（総医療費－267,000円）×1％\n\nという計算になります。\n\n医療費100万円なら、\n\n80,100円\n＋（1,000,000円－267,000円）×1％\n\n＝ 87,430円\n\nです。\n\n「つまり単純に30万円を最終的に全部負担するわけではなく、制度上の自己負担限度額を超えた部分が高額療養費の対象になるわけですね。」\n\n※保険適用外の費用や入院時の食事代、差額ベッド代などは別に考える必要があります。\n\n次は【傷病手当金】\n「先輩、今度は医療費ではありません。」\n\n病気になって、\n\n🏥「治療費が高い！」\n\nではなく、\n\n💼「働けないから給料が入ってこない！」\n\nという問題です。\n\nそこで、\n\n傷病手当金\n\nが出てきます。\n\n傷病手当金をもらうためのポイント\n「FPでは条件が重要なので、流れで覚えましょう。」\n\n健康保険の被保険者が、\n\n① 業務外の病気・けが\n↓\n② 療養のため働けない\n↓\n③ 連続する3日間を含み4日以上仕事を休む\n↓\n④ 休業期間について給与の支払いがない、または給与額が傷病手当金より少ない\n\nなどの要件を満たすと、傷病手当金の対象になります。\n\n「先輩、ここに見覚えありません？」\n\n業務外\n\nですよ。\n\n「仕事中のけがなら？」\n\n→ 労災保険\n\nでしたね。\n\n【待期3日を理解しましょう】\n「ここ、試験でかなり重要です。」\n\n傷病手当金には、\n\n連続する3日間の待期\n\nがあります。\n\nたとえば、\n\n月曜　休み\n火曜　休み\n水曜　休み\n木曜　休み\n\nなら、\n\n月・火・水\n→ 待期3日\n\n木曜日\n→ 支給対象となり得る\n\nという流れです。\n\n「だから――」\n\n3日休んだら3日分もらえる\n\nではありません。\n\n連続3日待つ → 4日目から\n\nです。\n\n【いくらもらえる？】\n「先輩、次は金額。」\n\nざっくり覚えるなら、\n\n1日あたり、おおむね標準報酬日額の3分の2相当\n\nです。\n\n厳密には、支給開始日前12か月間の各月の標準報酬月額の平均額などを使って計算します。\n\n「FPの最初の段階なら、まず――」\n\n傷病手当金 → 約3分の2\n\nと覚えておきましょう。\n\n【いつまで？】\n「もう一つ数字です。」\n\n傷病手当金の支給期間は、\n\n支給開始日から通算して1年6か月\n\nが基本です。\n\n「昔の制度と混ざらないように、通算して1年6か月と覚えてください。」\n\nC【イメージ理解｜病気になった先輩を2人が助ける】\n「先輩が病気で入院したとします。」\n\nすると2つの問題が発生します。\n\n問題①\n🏥「医療費、高っ！」\n\nそこに――\n\n🛡️ 高額療養費\n\n「医療費の自己負担が一定額を超えた部分を支えます。」\n\n問題②\n💼「会社を休んでるから給料が……。」\n\nそこに――\n\n🛡️ 傷病手当金\n\n「働けない期間の生活を支えます。」\n\n「分かりました？」\n\n同じ病気でも、\n\n出ていくお金を抑える\n→ 高額療養費\n\n入ってこないお金を補う\n→ 傷病手当金\n\nなんです。\n\n「あ、先輩。ここ、かなり覚えやすいですよ。」\n\nD【具体例｜両方同時に考えましょう】\n「先輩が業務外の病気で1か月入院したとします。」\n\nその結果、\n\n医療費の自己負担\n→ 非常に高額になった\n\nさらに、\n\n仕事\n→ 1か月休業\n\n給与\n→ 支給されない\n\nとなりました。\n\n「このとき何が問題です？」\n\n医療費について\n→ 高額療養費\n\n収入について\n→ 傷病手当金\n\n「つまり、この2つはどちらか一方しか使えない、という関係ではありません。」\n\nそれぞれ、\n\n別の経済的リスク\n\nに対応しているんです。\n\n【2つを完全比較】\n高額療養費\t傷病手当金\n何を助ける？\t高額な医療費\t休業による収入減少\nキーワード\t自己負担限度額\t働けない\n重要な期間\t1か月単位\t待期3日→4日目以降\n金額\t年齢・所得等で上限が異なる\tおおむね2/3相当\n支給期間\t―\t通算1年6か月\n「先輩、数字をバラバラに暗記しないでください。」\n\n高額療養費\n→ 「医療費、高すぎ！」\n\n傷病手当金\n→ 「働けなくて給料がない！」\n\nここから始めればいいんです。\n\n【理解確認】\n「では先輩、4問です。」\n\nQ1\n入院して医療費の自己負担が高額になった。\n\n→ 高額療養費\n\nQ2\n病気で会社を長期間休み、給与が支払われない。\n\n→ 傷病手当金\n\nQ3\n傷病手当金は休んだ初日から支給？\n\n→ いいえ。連続3日間の待期があり、4日目以降が支給対象\n\nQ4\n傷病手当金の支給期間は？\n\n→ 支給開始日から通算1年6か月\n\n「はい。この4つはFPでしっかり取ってください。」\n\n【30秒復習】\n① 医療費が高い\n→ 高額療養費\n\n② 高額療養費の上限\n→ 年齢・所得などで異なる\n\n③ 働けない\n→ 傷病手当金\n\n④ 待期\n→ 連続3日\n\n⑤ 支給額\n→ おおむね3分の2\n\n⑥ 支給期間\n→ 通算1年6か月\n\n【一文で覚える】\n高額療養費＝「高くなりすぎた医療費の自己負担を抑える制度」\n\n傷病手当金＝「業務外の病気・けがで働けないときの収入減少を補う制度」\n\n「先輩、最後はこれです。」\n\nお金が出すぎる → 高額療養費\n\nお金が入ってこない → 傷病手当金\n\n「この対比を中心に置けば、かなり忘れにくくなりますよ。」\n出産一時金と家族出産一時金\n"}, {"n": 26, "title": "出産育児一時金と家族出産育児一時金", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、ここは出産育児一時金と家族出産育児一時金ですね。」\n\n「あ、試験では正式名称で覚えましょう。『出産一時金』ではなく、出産育児一時金です。」\n\n違いはものすごくシンプルです。\n\n被保険者本人が出産\n→ 出産育児一時金\n\n被扶養者である家族が出産\n→ 家族出産育児一時金\n\n「……先輩、前にやったものと構造が同じなの、気づきました？」\n\n本人が治療 → 療養の給付\n家族が治療 → 家族療養費\n\nそして今回は、\n\n本人が出産 → 出産育児一時金\n家族が出産 → 家族出産育児一時金\n\nです。\n\nB【詳しい解説｜何のためのお金？】\n「まず、出産にはお金がかかりますよね。」\n\nそこで健康保険から、出産に伴う経済的負担を軽くするために支給されるのが、\n\n出産育児一時金\n\nです。\n\n現在の基本的な支給額は、\n\n1児につき50万円\n\nです。\n\n「先輩、ここ重要ですよ。」\n\n1回の出産につき50万円\n\nというより、\n\n1児につき50万円\n\nと覚えてください。\n\n「ということは双子だったら？」\n\n……\n\n「そうです。」\n\n原則、\n\n50万円 × 2人\n＝100万円\n\nです。\n\n※産科医療補償制度の対象外となる出産などでは支給額が異なる場合があります。\n\n【じゃあ「家族」が付くと何が変わる？】\n「先輩自身が健康保険の被保険者だとしましょう。」\n\nそして、先輩の配偶者が健康保険の被扶養者になっているとします。\n\nその配偶者が出産しました。\n\n「この場合、先輩本人が出産したわけではありませんよね。」\n\nだから、\n\n家族出産育児一時金\n\nです。\n\n「でも基本的な支給額は？」\n\n→ 1児につき50万円\n\n「そうです。本人か被扶養者かによって給付の名前が変わると考えると分かりやすいですね。」\n\n【ここで超重要｜出産手当金とは違う】\n「先輩、このあと一番混乱するところを先に潰しておきます。」\n\n出産育児一時金\n\nと\n\n出産手当金\n\nは別物です。\n\n「名前が似すぎなんですよね……。でも目的を見れば簡単です。」\n\n出産育児一時金\n👶「赤ちゃんが生まれた！」\n\n→ 出産にかかる経済的負担を軽減\n\n出産手当金\n🤰「出産のため会社を休んで、給与が出ない！」\n\n→ 休業中の所得を保障\n\n「つまり――」\n\n産んだ → 一時金\n\n休んだ → 手当金\n\nです。\n\nここ、かなり重要ですよ。\n\nC【イメージ理解｜本人と家族で考えましょう】\n「先輩、健康保険に加入している夫婦をイメージしてください。」\n\nケース①\n👩会社員のAさん\n\nAさん自身が健康保険の被保険者。\n\nそしてAさん本人が出産しました。\n\n👶「生まれました！」\n\n→ 出産育児一時金\n\nケース②\n👨会社員のBさん\n\n妻はBさんの健康保険の被扶養者。\n\n妻が出産しました。\n\n👶「生まれました！」\n\n→ 家族出産育児一時金\n\n「先輩、ポイントは『誰が赤ちゃんのお父さん・お母さんなのか』ではありません。」\n\n健康保険上、出産した人が被保険者本人なのか、被扶養者なのか\n\nを見るんです。\n\nD【具体例｜双子ならどうなる？】\n「先輩が健康保険の被保険者で、被扶養者である配偶者が双子を出産したとします。」\n\n1児につき\n→ 50万円\n\n双子なので、\n\n50万円 × 2\n＝ 100万円\n\n「そして被扶養者の出産ですから、給付の名称は？」\n\n……\n\n→ 家族出産育児一時金\n\n「はい。数字と名称を同時に判断できましたね。」\n\n【これまでの給付とつなげる】\n「先輩、健康保険の給付、かなり増えてきました。ここで一度つなげますよ。」\n\n何が起きた？\t被保険者本人\t被扶養者\n病気・けがで医療\t療養の給付\t家族療養費\n出産\t出産育児一時金\t家族出産育児一時金\n「あ、見えてきましたね。」\n\n本人\n→ 普通の名称\n\n被扶養者\n→ 「家族」が付く\n\nというパターンです。\n\n【理解確認】\n「はい、先輩。4問いきます。」\n\nQ1\n健康保険の被保険者本人が出産。\n\n→ 出産育児一時金\n\nQ2\n被扶養者が出産。\n\n→ 家族出産育児一時金\n\nQ3\n基本的な支給額は？\n\n→ 1児につき50万円\n\nQ4\n双子なら基本的に？\n\n→ 100万円\n\n「はい。ここまでなら大丈夫です。」\n\n【30秒復習】\n① 本人が出産\n→ 出産育児一時金\n\n② 被扶養者が出産\n→ 家族出産育児一時金\n\n③ 基本額\n→ 1児50万円\n\n④ 双子\n→ 基本100万円\n\n⑤ 出産育児一時金の目的\n→ 出産費用などの負担軽減\n\n⑥ 出産手当金との違い\n→ 出産手当金は休業中の所得保障\n\n【一文で覚える】\n出産育児一時金＝「本人が出産」\n家族出産育児一時金＝「被扶養者が出産」\n\n「さらに試験用に圧縮しますよ、先輩。」\n\n産んだ → 一時金\n\n家族が産んだ → 家族一時金\n\n産むため休んだ → 手当金\n\n「この3本を分けておけば、似た名前が並んでもちゃんと判断できます。」\n\n出産手当金\n"}, {"n": 27, "title": "出産手当金", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、今度は出産手当金ですね。さっきの出産育児一時金と名前が似ていますけど、目的が違います。」\n\n一言でいうと、\n\n健康保険の被保険者本人が、出産のため会社を休み、給与を十分受けられないときに生活を支える給付\n\nです。\n\n「まず、この対比を頭に入れてください。」\n\n出産した → 出産育児一時金\n→ 出産に伴う経済的負担を軽くする\n\n出産のため仕事を休んだ → 出産手当金\n→ 休業中の収入を補う\n\n「先輩、傷病手当金をやりましたよね？」\n\n病気で働けない\n→ 傷病手当金\n\n出産で働けない\n→ 出産手当金\n\n「あ、かなり似た構造なんです。」\n\nB【詳しい解説｜いつからいつまでもらえる？】\n「FPでは、ここが最重要です。」\n\n出産手当金の対象期間は原則、\n\n出産の日以前42日\n＋\n出産の日の翌日以後56日\n\nです。\n\n「先輩、数字は――」\n\n42日前・56日後\n\nです。\n\nただし、\n\n多胎妊娠の場合は出産の日以前98日\n\nになります。\n\nつまり、\n\n通常\n→ 42・56\n\n双子などの多胎妊娠\n→ 98・56\n\nと覚えましょう。\n\n「出産当日はどっちに入るの？」\n「お、ここ細かいですけど大事ですよ。」\n\n出産日以前42日には、\n\n出産当日も含まれます。\n\nそのため、\n\n出産日以前42日（出産日を含む）\n\nそして、\n\n出産日の翌日から56日\n\nという区切りです。\n\n【予定日より遅れて出産したら？】\n「先輩、ここで疑問が出ません？」\n\n「出産予定日の42日前から休んだけど、予定日より5日遅れて生まれたら、その5日間はどうなるの？」\n\n「はい。そこも対象になります。」\n\n予定日\n↓\nまだ生まれない\n↓\n5日後に出産\n\nなら、その予定日を過ぎて出産するまでの期間も加わります。\n\nつまり実際の対象期間が、\n\n42日＋遅れた日数＋56日\n\nとなることがあります。\n\n【いくらもらえる？】\n「次は金額です。」\n\nざっくりFP用に覚えるなら、\n\n1日につき、おおむね標準報酬日額の3分の2相当\n\nです。\n\n「あれ？」\n\nと思いましたよね。\n\nそうです。\n\n傷病手当金も、おおむね3分の2でした。\n\nだから、\n\n病気で休業\n→ 傷病手当金\n→ 約2/3\n\n出産で休業\n→ 出産手当金\n→ 約2/3\n\nとつなげると覚えやすいです。\n\n【誰がもらえるの？】\n「ここはかなり重要ですよ、先輩。」\n\n出産手当金は基本的に、\n\n健康保険の被保険者本人\n\nに対する給付です。\n\n「じゃあ、会社員の夫の健康保険に入っている被扶養者の妻が出産したら？」\n\n出産育児一時金については、\n\n→ 家族出産育児一時金\n\nがあります。\n\nでも、\n\n家族出産手当金\n\nという給付はありません。\n\n「なぜだと思います？」\n\n……\n\n出産手当金は、\n\n被保険者本人が出産のため仕事を休み、給与を受けられない期間の所得を保障する\n\nものだからです。\n\nC【イメージ理解｜2つの財布を分けましょう】\n「先輩、出産する会社員Aさんを想像してください。」\n\n👩「赤ちゃんが生まれます。」\n\nここで2種類のお金の問題が出てきます。\n\n👛財布① 出産そのもの\n「出産にお金がかかる……。」\n\n→ 出産育児一時金\n\n👛財布② 給料\n「産前産後で会社を休むから、給料が入ってこない……。」\n\n→ 出産手当金\n\n「だから同じ『出産』でも、守っている財布が違います。」\n\n出産費用側\n→ 出産育児一時金\n\n給与・生活費側\n→ 出産手当金\n\nです。\n\nD【具体例｜数字でつなげましょう】\n「先輩が試験会場で問題を読んでいるとします。」\n\nある会社員が出産のため会社を休みました。\n\n給与\n→ 支給されない\n\n通常の単胎妊娠で、\n\n出産前\n→ 42日\n\n出産後\n→ 56日\n\n休業した。\n\n「何が出てきます？」\n\n→ 出産手当金\n\nそして支給額のイメージは、\n\n→ 1日あたり、おおむね2/3\n\nです。\n\n【傷病手当金と比較すると一気に整理できます】\n傷病手当金\t出産手当金\nなぜ休む？\t病気・けが\t出産\n何を補う？\t休業中の収入\t休業中の収入\n支給額のイメージ\t約2/3\t約2/3\n重要な期間\t待期3日→4日目から\t出産前42日・出産後56日\n被扶養者への同様の手当\tなし\tなし\n「つまり先輩、傷病手当金と出産手当金は、」\n\n働けなくなって収入が減る\n\nという共通の問題を支える制度なんですね。\n\n【さらに一時金と比較】\n「最後に3つ並べます。」\n\n本人が出産した\n→ 出産育児一時金\n\n被扶養者が出産した\n→ 家族出産育児一時金\n\n被保険者本人が出産のため休業した\n→ 出産手当金\n\n「『出産した』と『仕事を休んだ』を分ける。これだけでかなり解けます。」\n\n【理解確認】\n「はい、先輩。4問です。」\n\nQ1\n出産手当金は何を補う？\n\n→ 出産による休業中の収入\n\nQ2\n通常、出産日前は何日？\n\n→ 42日\n\nQ3\n出産日の翌日以後は？\n\n→ 56日\n\nQ4\n支給額のイメージは？\n\n→ おおむね3分の2\n\n「もう一問。」\n\nQ5\n家族出産手当金という制度は？\n\n→ ありません。\n\n「はい。ここまで押さえれば十分強いです。」\n\n【30秒復習】\n① 出産して費用がかかる\n→ 出産育児一時金\n\n② 出産のため仕事を休む\n→ 出産手当金\n\n③ 産前\n→ 42日\n\n④ 多胎妊娠の産前\n→ 98日\n\n⑤ 産後\n→ 56日\n\n⑥ 金額\n→ おおむね2/3\n\n【一文で覚える】\n出産手当金＝「健康保険の被保険者本人が出産のため仕事を休み、給与を十分受けられないとき、原則として産前42日・産後56日について所得を保障する制度」。\n\n「先輩、試験直前ならこれだけです。」\n\n産んだ → 一時金\n\n産むため休んだ → 手当金\n\n手当金 → 42・56・約2/3\n\n「この『42・56・2/3』、セットで頭に置いてください。」\n\n埋葬料と家族埋葬料\n"}, {"n": 28, "title": "埋葬料と家族埋葬料", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、今回は埋葬料と家族埋葬料ですね。これも今までと同じく、本人か家族かで整理すると簡単です。」\n\n一言でいうと、\n\n被保険者本人が死亡\n→ 埋葬料\n\n被扶養者が死亡\n→ 家族埋葬料\n\nです。\n\n「そしてFPで覚えておきたい金額は――」\n\nどちらも5万円\n\nです。\n\nつまり、\n\n本人死亡 → 埋葬料5万円\n家族死亡 → 家族埋葬料5万円\n\nまずここを固定しましょう。\n\nB【詳しい解説｜誰に支給されるの？】\n「先輩、まず本人が亡くなったケースからいきます。」\n\n会社員Aさんが健康保険の被保険者だったとします。\n\nAさんが死亡しました。\n\nこのとき、\n\nAさんによって生計を維持され、埋葬を行う人\n\nに対して、\n\n埋葬料 5万円\n\nが支給されます。\n\n「先輩本人が亡くなっているわけですから、当然、先輩本人が5万円を受け取るわけじゃないですよ。」\n\n被保険者が死亡\n↓\n埋葬を行う一定の人に支給\n\nです。\n\n「じゃあ、その条件に当てはまる人がいなかったら？」\n「あ、そこです。ここで埋葬費という別の言葉が出てきます。」\n\n埋葬料を受け取る人がいない場合に、\n\n実際に埋葬を行った人\n\nへ、\n\n5万円の範囲内で、実際に埋葬にかかった費用\n\nが支給されます。\n\nこれが、\n\n埋葬費\n\nです。\n\n「名前が似ていますから注意ですよ。」\n\n埋葬料\n→ 5万円\n\n埋葬費\n→ 実際にかかった費用を5万円まで\n\nです。\n\n【家族埋葬料は？】\n「今度は逆です。」\n\n先輩が健康保険の被保険者。\n\nその先輩に扶養されている家族、つまり被扶養者が亡くなったとします。\n\nこの場合、\n\n被保険者である先輩に、\n\n家族埋葬料\n\nが支給されます。\n\n金額は、\n\n5万円\n\nです。\n\n「つまり今までのパターンと同じですね。」\n\n本人が死亡\n→ 埋葬料\n\n被扶養者が死亡\n→ 家族埋葬料\n\n「『家族』という文字が付いていたら、被扶養者側で何か起きたと考えると整理しやすいですよ。」\n\nC【イメージ理解｜健康保険一家で考えましょう】\n「先輩が会社員で、健康保険に加入しているとします。」\n\n👨‍💼先輩\n→ 被保険者\n\n👩配偶者\n→ 被扶養者\n\nとしましょう。\n\nケース① 先輩が死亡\n👨‍💼 → 死亡\n\n「健康保険の本人が亡くなりました。」\n\n→ 埋葬料\n\n→ 5万円\n\nケース② 被扶養者の配偶者が死亡\n👩 → 死亡\n\n「今度は健康保険の家族ですね。」\n\n→ 家族埋葬料\n\n→ 5万円\n\n「ほら、先輩。名前そのままです。」\n\n本人 → 埋葬料\n\n家族 → 家族埋葬料\n\nです。\n\nD【具体例｜埋葬料と埋葬費を区別しましょう】\n「ここは試験問題っぽくいきますよ。」\n\n健康保険の被保険者Aさんが死亡しました。\n\nAさんによって生計を維持されていた配偶者が埋葬を行いました。\n\n「何が支給される？」\n\n→ 埋葬料5万円\n\n「では、埋葬料を受け取れる人がいなくて、知人Bさんが実際に埋葬を行い、埋葬に3万円かかったとしましょう。」\n\nこの場合は、\n\n→ 埋葬費\n\n実際の費用が3万円なので、\n\n→ 3万円\n\nです。\n\n「5万円もらえるわけじゃありませんよ。」\n\n埋葬費は、\n\n実費の範囲\nかつ\n上限5万円\n\nです。\n\n【これまでの「本人・家族」をつなげる】\n「先輩、健康保険の給付がかなり増えてきたので、ここで一本につなげます。」\n\n何が起きた？\t被保険者本人\t被扶養者\n病気・けが\t療養の給付\t家族療養費\n出産\t出産育児一時金\t家族出産育児一時金\n死亡\t埋葬料\t家族埋葬料\n「見えてきましたね。」\n\n家族側で起きると『家族○○』\n\nというパターンが多いんです。\n\n【理解確認】\n「では先輩、4問いきます。」\n\nQ1\n健康保険の被保険者本人が死亡。\n\n→ 埋葬料\n\nQ2\n被扶養者が死亡。\n\n→ 家族埋葬料\n\nQ3\n埋葬料・家族埋葬料の金額は？\n\n→ 5万円\n\nQ4\n埋葬料を受け取れる人がおらず、別の人が実際に埋葬した場合は？\n\n→ 埋葬費\n\n「はい。さらに埋葬費は――」\n\n実際にかかった費用の範囲内で、上限5万円\n\nです。\n\n【30秒復習】\n① 本人死亡\n→ 埋葬料\n\n② 被扶養者死亡\n→ 家族埋葬料\n\n③ 埋葬料\n→ 5万円\n\n④ 家族埋葬料\n→ 5万円\n\n⑤ 埋葬料を受け取る人がいない\n→ 埋葬費\n\n⑥ 埋葬費\n→ 実費・上限5万円\n\n【一文で覚える】\n本人が死亡 → 埋葬料5万円、被扶養者が死亡 → 家族埋葬料5万円。\n\n「先輩、最後はこれだけでいいです。」\n\n本人死去 → 埋葬料\n\n家族死去 → 家族埋葬料\n\nどっちも5万円\n\n「そして『埋葬費』が出てきたら、実費・上限5万円。ここだけ混ぜないでくださいね。」\n\n任意継続被保険者\n"}, {"n": 29, "title": "任意継続被保険者", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、任意継続被保険者ですね。名前が硬いですけど、仕組みはかなり単純です。」\n\n一言でいうと、\n\n会社を退職したあとも、それまで入っていた健康保険に一定期間、自分の希望で継続加入する制度\n\nです。\n\n「会社を辞めた瞬間に、今までの健康保険が完全に選択肢から消えるわけではないんですね。」\n\n重要な数字はまず3つ。\n\n2か月・20日・2年\n\nです。\n\n退職日までに健康保険の被保険者期間が継続して2か月以上\n退職日の翌日から20日以内に手続き\n任意継続できる期間は最長2年間\n「先輩、まずは 2・20・2 で覚えましょう。」\n\nB【詳しい解説｜なぜこんな制度があるの？】\n「先輩が会社員だったとします。」\n\n会社員\n↓\n会社の健康保険\n\nに加入しています。\n\nところが、\n\n👨‍💼「会社を退職します。」\n\nとなると、原則として会社員としての健康保険の資格を失います。\n\n「じゃあ次の日からどうするの？」\n\n主な選択肢としては、\n\n国民健康保険に加入する\n\n家族の健康保険の被扶養者になる\n\nそして条件を満たせば、\n\n今までの健康保険を任意継続する\n\nという方法があります。\n\n「この3つを比較して選ぶわけですね。」\n\n【条件①｜2か月】\n「まず最初の条件。」\n\n退職日までに、\n\n継続して2か月以上の被保険者期間\n\nが必要です。\n\nたとえば、\n\n会社の健康保険に3年間加入\n→ OK\n\n1か月しか加入していない\n→ 原則NG\n\n「2か月以上。ここが最初の『2』です。」\n\n【条件②｜20日】\n「次。会社を辞めたあと、いつまでも悩んでいていいわけではありません。」\n\n原則として、\n\n退職日の翌日から20日以内\n\nに任意継続の資格取得の申出をします。\n\n「ここは期限問題で出しやすいところです。」\n\n20日以内\n\nですよ。\n\n【条件③｜最長2年間】\n任意継続できる期間は、\n\n最長2年間\n\nです。\n\n「つまり、ずーっと元の会社の健康保険に残れる制度ではありません。」\n\n退職\n↓\n
