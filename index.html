る可能性があるのは？\n\n……\n\n### **傷害特約**\n\nです。\n\n---\n\n### Q3\n\n病気によって所定の身体障害状態になれば、必ず傷害特約から給付される？\n\n……\n\n### **いいえ。**\n\n傷害特約では、基本的に**不慮の事故を原因とする傷害**かどうかが重要です。\n\n「“障害になった＝何でも傷害特約”ではありませんよ。」\n\n---\n\n# 【30秒復習】\n\n① **共通点は？**  \n→ 不慮の事故などに備える\n\n② **災害割増特約は？**  \n→ **事故による死亡・高度障害**\n\n③ **何をする？**  \n→ 保険金を**上乗せ**\n\n④ **傷害特約は？**  \n→ **死亡＋所定の身体障害**\n\n⑤ **身体障害の場合は？**  \n→ 障害の程度に応じて給付\n\n⑥ **覚え方は？**  \n→ **災害割増＝重大時に上乗せ／傷害＝障害まで見る**\n\n# 【一文で覚える】\n\n> **「災害割増特約は不慮の事故などによる死亡・高度障害の保障を上乗せし、傷害特約はさらに事故による所定の身体障害についても障害給付金を支払う。」**\n\n「はい、先輩。“どっちも事故だから同じ”で終わらせないでくださいね。」\n\n**災害割増**\n→ 死亡・高度障害を上乗せ\n\n**傷害**\n→ 死亡＋身体障害まで\n\nこの差です。\n\n次は **㊴「災害入院特約・疾病入院特約・生活習慣病入院特約」** です。\n\n---", "chapter": 2}, {"n": 39, "title": "災害入院特約・疾病入院特約・生活習慣病入院特約", "raw": "# 第2章 リスク管理㊴\n\n## 災害入院特約・疾病入院特約・生活習慣病入院特約\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は3つありますけど、難しくありません。**“何が原因で入院したか”**だけ見れば整理できます。」\n\n> **災害入院特約**  \n> → 不慮の事故によるケガで入院\n\n> **疾病入院特約**  \n> → 病気で入院\n\n> **生活習慣病入院特約**  \n> → 所定の生活習慣病で入院\n\nつまり、\n\n**事故 → 災害**  \n**病気 → 疾病**  \n**特定の生活習慣病 → 生活習慣病**\n\n「まずこの3本を頭に置いてください。」\n\n---\n\n# B【詳しい解説｜① 災害入院特約】\n\n「まず“災害”です。」\n\nこれは、\n\n> **不慮の事故によるケガで所定の入院をした場合に、入院給付金を受け取る特約**\n\nです。\n\nたとえば、\n\n🚗 交通事故で骨折  \n↓  \n🏥 入院\n\nなら、\n\n### 災害入院特約\n\nの対象になり得ます。\n\n---\n\n## 「病気で入院したら？」\n\n「ここは名前を見てください。」\n\nインフルエンザや肺炎など、\n\n病気\n↓\n入院\n\nなら、\n\n### 災害入院特約ではありません。\n\n「事故と病気を混ぜない。これが第一段階です。」\n\n---\n\n# ② 疾病入院特約\n\n「次は“疾病”。つまり病気です。」\n\n> **病気によって所定の入院をした場合に、入院給付金を受け取る特約**\n\nです。\n\nたとえば、\n\n肺炎\n↓\n入院\n\n胃潰瘍\n↓\n入院\n\nなどですね。\n\nつまり、\n\n### ケガ → 災害入院特約\n\n### 病気 → 疾病入院特約\n\n「この2つは対にしてください。」\n\n---\n\n# 「じゃあ、がんで入院したら？」\n\n「いい質問です。がんは**疾病**ですよね。」\n\nですから、契約上の支払条件を満たせば、\n\n### 疾病入院特約\n\nの対象になり得ます。\n\n「でも先輩、ここからさらに保障を厚くしたい人がいます。」\n\nそこで3つ目。\n\n---\n\n# ③ 生活習慣病入院特約\n\n> **所定の生活習慣病によって入院した場合に、保障を上乗せするための特約**\n\nです。\n\n代表的には商品によって、\n\n**がん\n心疾患\n脳血管疾患\n糖尿病\n高血圧性疾患**\n\nなど、所定の疾病が対象になります。\n\n「ただし、対象となる疾病の範囲は商品・契約によって違うので、“必ずこの5つ”と決めつけないでくださいね。」\n\n---\n\n# 「疾病入院特約と生活習慣病入院特約、両方出るの？」\n\n「そこ、いいところに気づきましたね。」\n\n契約内容や支払条件によりますが、両方の特約を付けていて所定の生活習慣病で入院し、それぞれの条件を満たせば、\n\n### 疾病入院給付金\n\n＋\n\n### 生活習慣病についての上乗せ給付\n\nという形になる商品があります。\n\nたとえば、\n\n疾病入院給付金\n→ 1日5,000円\n\n生活習慣病について追加\n→ 1日5,000円\n\nなら、\n\n### 合計1日1万円\n\nというイメージですね。\n\n「生活習慣病入院特約は、病気の中でも特定の病気について**保障を厚くする**イメージです。」\n\n---\n\n# 「事故で入院したあと病気になったら？」\n\n「先輩、原因を一個ずつ見ましょう。」\n\n交通事故\n↓\n骨折\n↓\n入院\n\nこれは、\n\n### 災害入院特約\n\nの領域。\n\n一方、\n\n肺炎\n↓\n入院\n\nなら、\n\n### 疾病入院特約\n\nです。\n\n「“入院した”という結果だけを見るのではなく、**なぜ入院したのか**を見るんです。」\n\n---\n\n# C【イメージ理解｜病院の入口に3つのゲート】\n\n「先輩、病院の入口に3つのゲートがあると思ってください。」\n\n🏥\n\n### 🚑 ゲート①「事故」\n\n交通事故・転倒など  \n↓  \nケガ  \n↓  \n入院\n\n→ **災害入院特約**\n\n---\n\n### 🤒 ゲート②「病気」\n\n肺炎・胃潰瘍など  \n↓  \n入院\n\n→ **疾病入院特約**\n\n---\n\n### ❤️ ゲート③「所定の生活習慣病」\n\nがん・心疾患など  \n↓  \n入院\n\n→ **生活習慣病入院特約**\n\n「先輩が問題を解くときも同じです。」\n\n**“何で入院した？”**\n\nと最初に聞く。\n\n事故？\n→ 災害\n\n病気？\n→ 疾病\n\nその病気が所定の生活習慣病？\n→ 生活習慣病の保障も確認\n\nこの順番です。\n\n---\n\n# D【具体例｜3人が入院しました】\n\n「3人の患者さんを見てみましょう。」\n\n### Aさん\n\n🚗交通事故  \n↓  \n骨折  \n↓  \n10日間入院\n\n「原因は？」\n\n……\n\n事故ですね。\n\n→ **災害入院特約**\n\n---\n\n### Bさん\n\n🤒肺炎  \n↓  \n10日間入院\n\n「原因は？」\n\n……\n\n病気。\n\n→ **疾病入院特約**\n\n---\n\n### Cさん\n\n❤️所定の心疾患  \n↓  \n10日間入院\n\nこれは病気なので、\n\n→ **疾病入院特約**\n\nさらに契約上、その心疾患が生活習慣病入院特約の対象なら、\n\n→ **生活習慣病についての保障**\n\nも関係してきます。\n\n「ここ大事ですよ。」\n\n### 生活習慣病は「病気とは別物」ではありません。\n\n**病気という大きな箱**\nの中に、\n**所定の生活習慣病という小さな箱**\n\nがあるイメージです。\n\n---\n\n# 【3つを比較】\n\n|特約|主な原因|イメージ|\n|-|-|-|\n|**災害入院特約**|不慮の事故によるケガ|🚗事故|\n|**疾病入院特約**|病気|🤒病気|\n|**生活習慣病入院特約**|所定の生活習慣病|❤️特定の病気を手厚く|\n\n「名前を丸暗記するより、**原因を見る**。これでかなり簡単になります。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n交通事故で骨折して入院しました。まず考える特約は？\n\n……\n\n### **災害入院特約。**\n\n事故によるケガだからですね。\n\n---\n\n### Q2\n\n肺炎で入院しました。考える特約は？\n\n……\n\n### **疾病入院特約。**\n\n病気が原因です。\n\n---\n\n### Q3\n\n所定の生活習慣病で入院した場合、「疾病ではないから疾病入院特約は関係ない」。\n\n○か×か？\n\n……\n\n### **×です。**\n\n「ここ、引っかからないでください。」\n\n生活習慣病も**疾病**です。\n\n疾病入院特約の支払条件を満たし、さらに生活習慣病入院特約の対象にも該当すれば、契約内容に応じて保障が厚くなることがあります。\n\n---\n\n# 【30秒復習】\n\n① **事故によるケガで入院**  \n→ 災害入院特約\n\n② **病気で入院**  \n→ 疾病入院特約\n\n③ **所定の生活習慣病で入院**  \n→ 生活習慣病入院特約\n\n④ **生活習慣病は疾病？**  \n→ **そうです**\n\n⑤ **生活習慣病特約のイメージ**  \n→ 特定の病気を**手厚く保障**\n\n⑥ **問題を見たら最初に何を見る？**  \n→ **入院の原因**\n\n# 【一文で覚える】\n\n> **「入院の原因が事故なら災害、病気なら疾病、その病気が所定の生活習慣病なら生活習慣病入院特約でさらに手厚くする。」**\n\n「はい、先輩。ここは一本道です。」\n\n**事故 → 災害**  \n**病気 → 疾病**  \n**特定の病気 → 生活習慣病で手厚く**\n\nこれだけ頭に残しておけば、名前が似ていても迷いません。\n\n次は **㊵「退院特約」** です。\n\n---", "chapter": 2}, {"n": 40, "title": "退院特約（たいいんとくやく）", "raw": "# 第2章 リスク管理㊵\n\n## 退院特約（たいいんとくやく）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。前回は**入院中の保障**でしたね。今回はその次、**退院した後**です。」\n\n退院特約とは、\n\n> **病気やケガで一定期間以上入院し、生存して退院した場合などに、退院給付金を受け取れる特約。**\n\n流れで見ると、\n\n**病気・ケガ**\n↓\n🏥 入院\n↓\n入院給付金\n↓\n🚪 **退院**\n↓\n💰 **退院給付金**\n\nです。\n\n「つまり、**入院中だけじゃなく、退院時にもお金が必要でしょ？**というところを補う特約なんです。」\n\n---\n\n# B【詳しい解説｜退院したのに、なぜお金が必要なの？】\n\n「先輩、“退院＝治療終了＝もうお金はいらない”と思っていませんか？」\n\n……実際はそうとは限りません。\n\n退院しても、\n\n**通院\n薬\nリハビリ\n自宅療養\n仕事に完全復帰するまでの生活費**\n\nなどが必要になることがあります。\n\nたとえば、\n\n入院\n↓\n手術\n↓\n退院\n↓\n「はい、翌日から完全復活！」\n\n……とは限りませんよね。\n\nそこで、\n\n> **退院後の療養などに備えるため、退院時にまとまった給付金を受け取る**\n\nというのが退院特約の基本的な考え方です。\n\n---\n\n# 「1日でも入院して退院すればもらえる？」\n\n「ちょっと待ってください。そこは契約条件を確認します。」\n\n退院特約では商品によって、\n\n> **所定の日数以上継続して入院した後、生存して退院すること**\n\nなどが支払条件になっています。\n\nたとえば、\n\n「20日以上入院した場合」\n\nなど、一定の入院期間が条件になるタイプがあります。\n\n「ですから、**退院した＝必ず支給**ではありません。」\n\n---\n\n# 「死亡退院でももらえる？」\n\n「“退院”という言葉だけで判断しないでくださいね。」\n\n一般に退院給付金は、\n\n### **生存して退院した場合**\n\nを対象とするものです。\n\n死亡した場合には、死亡保険金など別の保障の問題になります。\n\nつまり、\n\n> **退院特約＝生きて病院を出た後の生活を支える**\n\nというイメージを持つと分かりやすいです。\n\n---\n\n# 前回とのつながり\n\n「ここ、一本につなげますよ。」\n\n交通事故\n↓\n🏥入院\n↓\n\n### 災害入院特約\n\n病気\n↓\n🏥入院\n↓\n\n### 疾病入院特約\n\nそして、\n\n🏥\n↓\n🚪退院\n↓\n\n### **退院特約**\n\nです。\n\n「入院特約と退院特約は、“いつお金が出るのか”が違うんですね。」\n\n---\n\n# C【イメージ理解｜病院の出口に置いてある封筒】\n\n「先輩、病院を想像してください。」\n\n入院中は毎日、\n\n🏥  \n💴  \n💴  \n💴\n\n入院給付金が出る。\n\nそして治療が進んで、\n\n🚪「退院です」\n\nとなった。\n\n病院の出口に、\n\n### ✉️「退院後の生活用」\n\nという封筒が置いてある。\n\nそれを受け取る。\n\nこれが、\n\n### **退院給付金**\n\nのイメージです。\n\n「入院中の費用だけ見ない。**病院を出た後にもお金がかかる**。そこまで考えた保障なんですね。」\n\n---\n\n# D【具体例｜30日間入院したAさん】\n\n「Aさんが病気になったとします。」\n\n病気\n↓\n30日間入院\n↓\n治療\n↓\n生存して退院\n\n契約上の条件を満たしていれば、\n\n### 入院中\n\n→ 疾病入院給付金\n\nそして、\n\n### 退院時\n\n→ **退院給付金**\n\nという形で受け取れます。\n\n---\n\n「では先輩、Aさんが3日だけ入院して退院したら？」\n\n……\n\nこれは、\n\n> **退院特約の所定の入院日数を満たしているか**\n\nを確認する必要があります。\n\n「“退院したから必ず○万円”ではないですよ。」\n\n---\n\n# 【入院特約との違い】\n\n||入院特約|退院特約|\n|-|-|-|\n|注目する時点|**入院**|**退院**|\n|主な給付|入院給付金|**退院給付金**|\n|目的|入院中の負担|**退院後の療養など**|\n|条件|所定の入院|**所定期間以上の入院＋生存退院など**|\n\n「**病院の中＝入院特約、病院の出口＝退院特約**。これで覚えましょう。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n退院特約は、主にいつ給付される？\n\n……\n\n### **所定の条件を満たして生存退院したとき。**\n\n---\n\n### Q2\n\n1日入院して退院すれば、どんな契約でも必ず退院給付金が出る？\n\n……\n\n### **いいえ。**\n\n所定の入院日数など、契約上の支払条件があります。\n\n---\n\n### Q3\n\n退院特約は何のためにある？\n\n……\n\n### **退院後の療養・通院などに伴う経済的負担に備えるため。**\n\n「はい。入院中だけじゃなく、その後まで見るんですね。」\n\n---\n\n# 【30秒復習】\n\n① **何を保障？**  \n→ 退院時の経済的負担\n\n② **受け取るものは？**  \n→ **退院給付金**\n\n③ **退院すれば必ず出る？**  \n→ **出ない**\n\n④ **何を確認する？**  \n→ 所定の入院日数など\n\n⑤ **基本的なイメージは？**  \n→ **生存して退院**\n\n⑥ **入院特約との違いは？**  \n→ **入院中 vs 退院時**\n\n# 【一文で覚える】\n\n> **「退院特約は、病気やケガで所定期間以上入院した後、生存して退院した場合などに退院給付金を支払う特約。」**\n\n「先輩、前回からこうつなげてください。」\n\n**事故・病気**\n↓\n🏥 **入院**\n→ 入院特約\n↓\n🚪 **退院**\n→ 退院特約\n\nこれで大丈夫です。\n\n次は一気に4つまとめて、**㊶「特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険」**です。\n\n---", "chapter": 2}, {"n": 41, "title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "raw": "# 第2章 リスク管理㊶\n\n## 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険\n\n### A【要点｜まず4つを混ぜないようにします】\n\n「はい、先輩。今回は4つあります。でも名前を丸暗記しないで、**“何に困ったときのお金なのか”**で分ければ大丈夫です。」\n\n|制度|何に備える？|核になるイメージ|\n|-|-|-|\n|**特定疾病保障**|がん・急性心筋梗塞・脳卒中など|**三大疾病など**|\n|**リビングニーズ特約**|余命が短いと判断されたとき|**死亡保険金を生前に**|\n|**先進医療特約**|先進医療の技術料|**公的医療保険外の技術料**|\n|**就業不能保険**|長期間働けない|**収入減少**|\n\n「つまり、**病気・余命・高額な治療・働けない**。この4方向です。」\n\n---\n\n# B【詳しい解説①｜特定疾病保障】\n\n「まず**特定疾病保障保険・特約**です。」\n\n代表的には、\n\n### がん\n\n### 急性心筋梗塞\n\n### 脳卒中\n\nなど、所定の疾病に備えるものです。\n\nこれらはまとめて、\n\n### **三大疾病**\n\nと呼ばれることがあります。\n\n---\n\n## 何がもらえるの？\n\n所定の状態などの支払条件を満たすと、\n\n### **特定疾病保険金**\n\nを受け取れます。\n\n「たとえば、がんと診断された瞬間にどんな場合でも必ず出る、と覚えるのは危険ですよ。」\n\n疾病ごとに、\n\n**診断\n所定の状態\n所定の治療**\n\nなど、契約で支払条件が決められています。\n\n---\n\n## 保険金を受け取ったらどうなる？\n\n「ここも商品によりますが、典型的な特定疾病保障保険では重要です。」\n\n特定疾病保険金を受け取ると、\n\n### **契約が消滅**\n\nするタイプがあります。\n\nたとえば、\n\n特定疾病保険金1,000万円\n↓\nがんで所定の条件を満たす\n↓\n1,000万円受取\n↓\nその契約は終了\n\n「その後死亡したから、さらに死亡保険金1,000万円――とはならないタイプがある、ということです。」\n\n---\n\n# ② リビングニーズ特約\n\n「これは名前より仕組みが重要です。」\n\n### Living Needs\n\n＝生きている間の必要資金\n\nつまり、\n\n> **被保険者の余命が6か月以内と判断された場合などに、死亡保険金の全部または一部を生前に受け取れる特約**\n\nです。\n\n---\n\n「先輩、普通の死亡保険金っていつ受け取ります？」\n\n……\n\n### 死亡した後\n\nですよね。\n\nでも、\n\n「余命6か月と診断されました。治療費や家族との時間のために、今お金が必要です」\n\nという場合があります。\n\nそこで、\n\n死亡保険金\n↓\n死亡後ではなく\n↓\n\n### **生前に前払い**\n\nしてもらう。\n\nこれがリビングニーズ特約です。\n\n---\n\n## イメージ\n\n本来：\n\n生存 → 死亡 → 💰\n\nリビングニーズ：\n\n余命6か月以内など\n↓\n\n### 💰を生前に受け取る\n\n「**死亡保険金の前倒し**と覚えるとかなり強いです。」\n\n---\n\n# ③ 先進医療特約\n\n「次は医療費です。」\n\n先進医療とは、\n\n> **厚生労働大臣が定める高度な医療技術のうち、一定の要件を満たす医療**\n\nです。\n\nそして重要なのが費用。\n\n先進医療を受けた場合、\n\n通常の診察・検査など\n→ 公的医療保険が適用される部分もある\n\n一方、\n\n### **先進医療にかかる技術料**\n\n→ **全額自己負担**\n\nです。\n\n「ここですよ。」\n\n---\n\n## 「じゃあ高額療養費制度で戻ってくる？」\n\n「……先輩、引っかかりましたね。」\n\n先進医療の**技術料そのもの**は公的医療保険の対象外なので、\n\n### **高額療養費制度の対象にもなりません。**\n\nそこで、\n\n### 先進医療特約\n\nを付けて、\n\n> **先進医療の技術料などの経済的負担に備える**\n\nわけです。\n\n---\n\n# ④ 就業不能保険\n\n「最後です。これは“治療費”ではなく、**収入**を見ます。」\n\nたとえば先輩が、\n\n病気\n↓\n長期間仕事ができない\n↓\n給与が減る\n↓\nでも家賃・食費・ローンは続く\n\nとなったら？\n\n「医療費だけ払えても、生活が回りませんよね。」\n\nそこで、\n\n> **病気やケガによって所定の就業不能状態が一定期間続いた場合などに給付金を受け取る**\n\nのが、\n\n### **就業不能保険**\n\nです。\n\n---\n\n# 「医療保険と何が違う？」\n\n「あ、ここ重要です。」\n\n### 医療保険\n\n注目するもの\n→ **入院・手術など**\n\n目的\n→ 医療費負担への備え\n\n---\n\n### 就業不能保険\n\n注目するもの\n→ **働けるかどうか**\n\n目的\n→ **収入減少・生活費への備え**\n\n「だから、入院しているかどうかだけで判断する保険ではありません。」\n\n---\n\n# C【イメージ理解｜4つの財布】\n\n「先輩、4つの財布を置きます。」\n\n### 🟥財布① 特定疾病保障\n\n「三大疾病などになった」\n\n→ 💰まとまったお金\n\n---\n\n### 🟦財布② リビングニーズ\n\n「余命6か月以内と判断された」\n\n→ 💰**死亡保険金を生前に**\n\n---\n\n### 🟩財布③ 先進医療\n\n「先進医療を受けた」\n\n→ 💰**技術料の負担に備える**\n\n---\n\n### 🟨財布④ 就業不能\n\n「病気・ケガで働けない」\n\n→ 💰**収入減少を補う**\n\n「全部“病気に関係する保険”とまとめたらダメですよ。」\n\n**何のお金を補うのか**が違います。\n\n---\n\n# D【具体例｜Aさんが病気になった】\n\nAさんが、所定のがんに罹患して支払条件を満たした。\n\n→ **特定疾病保障**\n\n---\n\n医師から余命6か月以内と判断され、契約上の条件を満たした。\n\n→ **リビングニーズ特約**\n\n---\n\n対象となる先進医療を受け、技術料が自己負担になった。\n\n→ **先進医療特約**\n\n---\n\n病気のため長期間働けず、所定の就業不能状態になった。\n\n→ **就業不能保険**\n\n「同じAさんでも、**何による経済的ダメージなのか**で使う保障が変わるんですね。」\n\n---\n\n# 【特に間違えやすいところ】\n\n「先輩、3つだけ止まって確認しますよ。」\n\n### ① リビングニーズ＝医療費専用？\n\n→ **違います。**\n\n死亡保険金の一部または全部を**生前に受け取る仕組み**です。\n\n---\n\n### ② 先進医療の技術料＝高額療養費の対象？\n\n→ **対象外。**\n\n公的医療保険の対象外だからです。\n\n---\n\n### ③ 就業不能保険＝入院していれば必ず出る？\n\n→ **違います。**\n\n契約で定められた**就業不能状態**や期間などの条件を満たす必要があります。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n余命6か月以内と判断された場合などに、死亡保険金を生前に受け取れるのは？\n\n……\n\n### **リビングニーズ特約。**\n\n---\n\n### Q2\n\n先進医療の技術料は、高額療養費制度の対象になる？\n\n……\n\n### **なりません。**\n\n先進医療の技術料は全額自己負担です。\n\n---\n\n### Q3\n\n病気で治療費はそれほどかからないけれど、半年間働けず収入が減った。\n\nどの保険が最も直接的に対応する？\n\n……\n\n### **就業不能保険。**\n\n「“病気だから医療保険”ではなく、**困っているのが収入だから就業不能**。この考え方です。」\n\n---\n\n# 【30秒復習】\n\n① **三大疾病など**  \n→ 特定疾病保障\n\n② **余命6か月以内など**  \n→ リビングニーズ特約\n\n③ **死亡保険金をいつ受け取る？**  \n→ **生前**\n\n④ **先進医療の何に備える？**  \n→ **技術料**\n\n⑤ **技術料は高額療養費の対象？**  \n→ **対象外**\n\n⑥ **働けず収入減少**  \n→ **就業不能保険**\n\n# 【一文で覚える】\n\n> **「三大疾病などなら特定疾病、余命ならリビングニーズ、先進医療の技術料なら先進医療特約、働けないことによる収入減なら就業不能保険。」**\n\n「はい、先輩。4つを名前で覚えようとしなくていいんです。」\n\n**何が起きた？**\n↓\n**何のお金に困った？**\n↓\n**どの保障？**\n\nこの順番で考えれば整理できます。\n\n次は **㊷「払済保険」** です。\n\n---", "chapter": 2}, {"n": 42, "title": "払済保険（はらいずみほけん）", "raw": "# 第2章 リスク管理㊷\n\n## 払済保険（はらいずみほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**払済保険**です。ここからは“保険料を払い続けるのが厳しくなったとき、契約をどうするか”という話に入ります。」\n\n払済保険とは、\n\n> **保険料の支払いをやめ、その時点の解約返戻金を使って、元の保険と同じ種類の保険を一時払いで買い直す仕組み。**\n\nその結果、\n\n### 保険期間\n\n→ **原則そのまま**\n\n### 保険金額\n\n→ **小さくなる**\n\n### 今後の保険料\n\n→ **払わなくてよい**\n\n「まずはこれです。」\n\n> **払済＝期間そのまま・保障額ダウン**\n\nこれを固定してください。\n\n---\n\n# B【詳しい解説｜なぜこんな制度があるの？】\n\n「たとえば先輩が終身保険に入っていたとします。」\n\n死亡保険金\n→ 1,000万円\n\n毎月保険料\n→ 2万円\n\nところが途中で、\n\n「収入が減って、毎月2万円はちょっと厳しい……」\n\nとなった。\n\n---\n\n普通なら、\n\n「じゃあ解約しよう」\n\nとなりそうですよね。\n\n「でも待ってください。解約したら保障そのものがなくなります。」\n\nそこで、\n\n### 払済保険\n\nという選択肢があります。\n\n---\n\n今まで積み上がっている、\n\n### **解約返戻金**\n\nを使います。\n\nそのお金を、\n\n> **一時払保険料**\n\nとして使って、\n\n保障額を小さくした保険に変更するんです。\n\n---\n\n# 「どういうこと？」\n\n「数字で見ましょう。」\n\nもともと、\n\n### 終身保険1,000万円\n\nだった。\n\nでも今後の保険料を払わない。\n\n当然、\n\n「1,000万円保障をそのまま維持して、しかも保険料ゼロ！」\n\n……なんて都合のいいことにはなりません。\n\nだから、\n\n1,000万円\n↓\n↓\n\n### 600万円\n\nのように、\n\n### **保険金額を減らす**\n\nわけです。\n\nその代わり、\n\n> **以後の保険料の払込みは不要**\n\nになります。\n\n---\n\n# 「保障期間も短くなるの？」\n\n「先輩、ここが超重要です。」\n\n### **払済保険では、保険期間は原則変わりません。**\n\nたとえば終身保険なら、\n\n変更前\n→ 一生涯\n\n変更後\n→ **一生涯**\n\nです。\n\nただし、\n\n### 保障額が小さくなる。\n\nだから、\n\n> **期間を残して、金額を削る**\n\nのが払済保険です。\n\n---\n\n# 「解約とは何が違う？」\n\n「ここも整理します。」\n\n### 解約\n\n保険料\n→ 払わなくなる\n\n保障\n→ **終了**\n\n解約返戻金\n→ 契約者が受け取る\n\n---\n\n### 払済保険\n\n保険料\n→ 払わなくなる\n\n保障\n→ **残る**\n\n解約返戻金\n→ **新しい保険の一時払保険料に充てる**\n\n保障額\n→ 小さくなる\n\n「つまり払済では、解約返戻金を手元に受け取らず、**保障を残すために使う**んです。」\n\n---\n\n# 「特約はどうなる？」\n\n「ここもFPでは注意ですよ。」\n\n払済保険へ変更すると、\n\n> **元の契約についていた各種特約は原則として消滅**\n\nします。\n\n「主契約を小さくして残せたから、医療特約なども全部そのまま――とは限りません。」\n\nここは問題文をよく見ましょう。\n\n---\n\n# C【イメージ理解｜大きな傘を小さな傘に交換する】\n\n「先輩、毎月レンタル料を払って、大きな傘を使っていると思ってください。」\n\n☂️☂️☂️\n\n### 大きな傘＝1,000万円保障\n\nでも、\n\n「もう毎月のお金を払えない……」\n\nとなった。\n\nそこで傘を捨てるのではなく、\n\n今まで貯まった価値を使って、\n\n### ☂️\n\n### 小さな傘\n\nに交換します。\n\nこれなら、\n\n### 今後の支払いなし\n\nでも、\n\n### 傘そのものは残る。\n\n「これが払済です。」\n\n---\n\n# そして次の「延長保険」と比較します\n\n「先輩、実は払済保険は、次の**延長保険**とセットで出ます。」\n\n今のうちに違いだけ見てください。\n\n### 払済保険\n\n**保障額**\n→ ⬇️小さくする\n\n**保障期間**\n→ ➡️そのまま\n\n---\n\n### 延長保険\n\n**保障額**\n→ ➡️原則そのまま\n\n**保障期間**\n→ ⬇️短くする\n\n「きれいに逆なんです。」\n\n---\n\n# D【具体例｜1,000万円の終身保険】\n\nAさんが、\n\n### 死亡保障1,000万円の終身保険\n\nに加入しています。\n\nところが収入が減り、\n\n「もう保険料を払い続けられません」\n\nとなりました。\n\n現在の解約返戻金を使って、\n\n### 払済保険\n\nに変更。\n\nすると、たとえば、\n\n死亡保障\n\n**1,000万円**\n↓\n\n### **600万円**\n\nに減少。\n\nでも、\n\n保険期間\n\n**終身**\n↓\n\n### **終身のまま**\n\nそして、\n\n今後の保険料\n\n### **0円**\n\nになります。\n\n---\n\n「先輩、この3点を同時に言えますか？」\n\n**保険料**\n→ 払わない\n\n**保険金額**\n→ 減る\n\n**保険期間**\n→ 原則そのまま\n\n「はい。それが払済です。」\n\n---\n\n# 【解約・払済を比較】\n\n||解約|払済保険|\n|-|-|-|\n|今後の保険料|なし|**なし**|\n|保障|**なくなる**|**残る**|\n|解約返戻金|受け取る|**保険料に充当**|\n|保険金額|―|**減少**|\n|保険期間|終了|**原則そのまま**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n払済保険に変更すると、今後の保険料は？\n\n……\n\n### **払わなくてよくなります。**\n\n---\n\n### Q2\n\nでは、元の死亡保険金額はそのまま？\n\n……\n\n### **いいえ。**\n\n一般に、\n\n### **保険金額は小さくなります。**\n\n---\n\n### Q3\n\n保険期間はどうなる？\n\n……\n\n### **原則として元の保険期間のままです。**\n\n「はい。ここまで言えれば完璧です。」\n\n---\n\n# 【30秒復習】\n\n① **保険料の支払い**  \n→ ストップ\n\n② **何を使う？**  \n→ 解約返戻金\n\n③ **何に使う？**  \n→ 一時払保険料\n\n④ **保険金額**  \n→ **小さくなる**\n\n⑤ **保険期間**  \n→ **原則そのまま**\n\n⑥ **特約**  \n→ **原則消滅**\n\n# 【一文で覚える】\n\n> **「払済保険は、解約返戻金を一時払保険料に充て、以後の保険料を払わず、保険期間を原則そのままにして保険金額を小さくする。」**\n\n「先輩、最後はこれだけ頭に刻んでください。」\n\n### 払済\n\n**金額 ↓\n期間 →**\n\nそして次の㊸は逆です。\n\n### 延長\n\n**金額 →\n期間 ↓**\n\n次は **㊸「延長保険」** です。\n\n---", "chapter": 2}, {"n": 43, "title": "延長保険（えんちょうほけん）", "raw": "# 第2章 リスク管理㊸\n\n## 延長保険（えんちょうほけん）\n\n### A【要点｜まず払済保険との違いを掴みます】\n\n「はい、先輩。今回は**延長保険**です。前回の払済保険とセットで覚えれば、かなり簡単ですよ。」\n\n延長保険とは、\n\n> **保険料の支払いをやめ、その時点の解約返戻金を使って、元の死亡保険金額を原則そのままにした定期保険へ変更する仕組み。**\n\nその結果、\n\n### 保険金額\n\n→ **原則そのまま**\n\n### 保険期間\n\n→ **短くなることがある**\n\n### 今後の保険料\n\n→ **払わなくてよい**\n\nです。\n\n前回の払済と並べると、\n\n> **払済＝金額↓・期間→**  \n> **延長＝金額→・期間↓**\n\n「先輩、この2本は試験で非常に使いやすい覚え方です。」\n\n---\n\n# B【詳しい解説｜なぜ「延長」というの？】\n\n「たとえば先輩が、死亡保障1,000万円の終身保険に入っているとします。」\n\nところが、\n\n「これ以上、保険料を払うのが厳しい……」\n\nとなった。\n\nでも、\n\n「1,000万円の死亡保障はできるだけ残したい」\n\nとも思っている。\n\nそこで、\n\n### **延長保険**\n\nです。\n\n---\n\n今まで積み上がっている、\n\n### 解約返戻金\n\nを使って、\n\n> **元の死亡保険金額と同額の定期保険を一時払いで買う**\n\nという考え方です。\n\n---\n\n## たとえば\n\n元の終身保険\n\n**死亡保障1,000万円**\n↓\n**一生涯**\n\nだったとします。\n\n延長保険にすると、\n\n**死亡保障1,000万円**\n↓\n**10年間**\n\nのようになるイメージです。\n\n「つまり、保障の“大きさ”を守る代わりに、“長さ”を犠牲にするんですね。」\n\n---\n\n# 「終身保険のままじゃないの？」\n\n「はい。ここは重要です。」\n\n延長保険は、\n\n> **元の契約の解約返戻金を使って定期保険に変更する**\n\n仕組みです。\n\nしたがって、\n\n元が終身保険だったとしても、\n\n### 延長後は定期保険\n\nになります。\n\n「“終身保障を無料でそのまま維持”ではありませんよ。」\n\n---\n\n# なぜ期間が短くなるの？\n\n「先輩、考えてみましょう。」\n\n今後の保険料は、\n\n### 0円。\n\nでも死亡保障1,000万円は、\n\n### そのまま残したい。\n\nだったら、\n\n「1,000万円を一生涯保障してください」\n\nは難しいですよね。\n\nそこで、\n\n### **保障する期間を短くする**\n\nわけです。\n\nつまり、\n\nお金を払わない\n↓\nでも保障額は落としたくない\n↓\nなら\n↓\n\n### 保障期間を削る\n\nということです。\n\n---\n\n# 「払済保険と完全に逆だ」\n\n「そうです。そこです。」\n\n同じ状況からスタートします。\n\n### 共通\n\n保険料を払い続けるのが難しい\n↓\n解約返戻金を利用\n↓\n今後の保険料を払わない\n\nここまでは同じ。\n\n---\n\nそこから、\n\n### 払済保険\n\n「長く保障してほしい」\n\n↓\n\nなら金額を小さくする。\n\n**金額 ↓\n期間 →**\n\n---\n\n### 延長保険\n\n「大きな保障を残したい」\n\n↓\n\nなら期間を短くする。\n\n**金額 →\n期間 ↓**\n\n「先輩、“何を守るか”が違うんです。」\n\n---\n\n# 「必ず保険期間は短くなるの？」\n\n「ここは少し丁寧にいきます。」\n\n基本的なFP学習では、\n\n> **延長保険＝保険金額は変えず、保険期間を短縮**\n\nと覚えて大丈夫です。\n\nただし、解約返戻金が十分に大きい場合など、計算上の延長期間が元の保険期間を超えるケースでは、元の保険期間を超えて保障するわけではありません。\n\n「試験対策としては、まず**金額そのまま・期間短縮**を芯にしてください。」\n\n---\n\n# 「特約は？」\n\n「払済保険と同じところですね。」\n\n延長保険へ変更すると、\n\n> **元の契約に付加されていた特約は原則として消滅**\n\nします。\n\nたとえば、\n\n医療特約\n災害特約\n\nなどが、\n\n「死亡保障が残っているから全部そのまま！」\n\nとは限りません。\n\n---\n\n# C【イメージ理解｜同じ大きさの傘を短期間だけ使う】\n\n「前回の傘を使いましょう。」\n\n元の保険は、\n\n### ☂️大きな傘を一生使える\n\nイメージ。\n\nでも、\n\n「もう毎月のお金を払えません」\n\nとなった。\n\n---\n\n### 払済なら\n\n☂️\n↓\n🌂\n\n傘を**小さくする**。\n\nでも、\n\n### 長く持ち続ける。\n\n---\n\n### 延長なら\n\n☂️\n\n傘の大きさは、\n\n### **そのまま。**\n\nただし、\n\n⏳10年間だけ\n\nのように、\n\n### **使える期間を短くする。**\n\n「これなら違いが見えますよね。」\n\n---\n\n# D【具体例｜1,000万円の終身保険】\n\n「Aさんが死亡保障1,000万円の終身保険に加入していたとします。」\n\n途中で保険料を払えなくなった。\n\n現在の解約返戻金を使って、\n\n### 延長保険\n\nへ変更。\n\nすると、たとえば、\n\n死亡保障\n\n### 1,000万円\n\n→ **1,000万円のまま**\n\nしかし、\n\n保険期間\n\n### 一生涯\n\n↓\n\n### 10年間\n\nとなる。\n\nそして、\n\n今後の保険料\n→ **0円**\n\nです。\n\n---\n\n# 【払済 vs 延長】\n\n「先輩、ここは絶対セットです。」\n\n||払済保険|延長保険|\n|-|-|-|\n|今後の保険料|なし|なし|\n|解約返戻金|利用する|利用する|\n|保険金額|**減少**|**原則そのまま**|\n|保険期間|**原則そのまま**|**短くなる**|\n|変更後|元と同種の保険が基本|**定期保険**|\n|特約|原則消滅|原則消滅|\n\n---\n\n「もっと短くしますよ。」\n\n## 払済\n\n### 金額 ↓\n\n### 期間 →\n\n---\n\n## 延長\n\n### 金額 →\n\n### 期間 ↓\n\n「はい。これで十分強いです。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n延長保険にすると、今後の保険料は？\n\n……\n\n### **払わなくてよくなります。**\n\n---\n\n### Q2\n\n元の死亡保険金額は？\n\n……\n\n### **原則としてそのまま。**\n\n「ここが払済との違いです。」\n\n---\n\n### Q3\n\nでは何が短くなる？\n\n……\n\n### **保険期間です。**\n\nだから、\n\n> **延長＝金額→・期間↓**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **何を使う？**  \n→ 解約返戻金\n\n② **今後の保険料は？**  \n→ なし\n\n③ **保険金額は？**  \n→ **原則そのまま**\n\n④ **保険期間は？**  \n→ **短くなる**\n\n⑤ **変更後は？**  \n→ **定期保険**\n\n⑥ **払済との違いは？**  \n→ **払済＝金額↓・期間→／延長＝金額→・期間↓**\n\n# 【一文で覚える】\n\n> **「延長保険は、解約返戻金を使って以後の保険料を払わず、元の死亡保険金額を原則維持する代わりに、保障期間を短くした定期保険へ変更する仕組み。」**\n\n「先輩、払済と延長で迷ったら、“どっちを守りたい？”と考えてください。」\n\n**長さを守る**\n→ 払済  \n→ 金額を削る\n\n**大きさを守る**\n→ 延長  \n→ 期間を削る\n\nこれで区別できます。\n\n次は **㊹「契約転換制度」** です。\n\n---", "chapter": 2}, {"n": 44, "title": "契約転換制度（けいやくてんかんせいど）", "raw": "# 第2章 リスク管理㊹\n\n## 契約転換制度（けいやくてんかんせいど）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**契約転換制度**です。名前は難しそうですが、“古い保険を下取りに出して、新しい保険に乗り換える”と思えばかなり分かりやすいですよ。」\n\n契約転換制度とは、\n\n> **現在の保険契約の積立部分など（転換価格）を、新しい保険契約の一部に充当して、新しい保険へ切り替える制度。**\n\nイメージは車の買い替えです。\n\n🚗 今までの車  \n↓ 下取り  \n💰 下取り価格  \n↓  \n🚙 新しい車\n\n保険なら、\n\n📄 現在の保険  \n↓ **転換価格を利用**  \n💰  \n↓  \n📄 新しい保険\n\nです。\n\nそして重要なのが、\n\n> **転換すると元の契約は消滅し、新しい契約になります。**\n\n「単なる“内容変更”ではありませんよ。」\n\n---\n\n# B【詳しい解説｜なぜ転換するの？】\n\n「たとえば先輩が30歳のときに生命保険へ入ったとします。」\n\n30歳\n→ 死亡保障中心の保険\n\nでも45歳になって、\n\n「子どもの保障も必要だし、医療保障も見直したいな」\n\nとなった。\n\nそこで保険会社から、\n\n> 「現在の契約を利用して、新しい保険に切り替えませんか？」\n\nという選択肢が出る。\n\nこれが、\n\n### **契約転換制度**\n\nです。\n\n---\n\n# 「今まで払った保険料は全部捨てるの？」\n\n「いいえ。そこが転換制度のポイントです。」\n\n現在の契約には、\n\n### **転換価格**\n\nがあります。\n\nこの転換価格を、\n\n> **新しい保険契約の一部に充当する**\n\nわけです。\n\nつまり、\n\n旧契約\n↓\n積み上がった価値\n↓\n**転換価格**\n↓\n新契約へ投入\n\nという流れです。\n\n---\n\n# 「じゃあ新しい保険料は30歳のときの年齢で計算？」\n\n「先輩、そこは違います。ここ、試験で重要ですよ。」\n\n新しい契約ですから、\n\n> **転換時の年齢・保険料率などを基準に、新しい保険料が計算されます。**\n\nたとえば、\n\n30歳で旧契約に加入\n↓\n45歳で転換\n\nなら、\n\n### **45歳時点**\n\nを基準として新契約の保険料を計算するのが基本です。\n\n「30歳の若いときの保険料率が、そのまま新契約に引き継がれるわけではありません。」\n\n---\n\n# 「じゃあ健康状態は昔のままでいい？」\n\n「これも重要です。」\n\n転換は、\n\n### **新しい保険契約**\n\nです。\n\nそのため原則として、\n\n> **告知や診査が必要**\n\nになります。\n\n「昔の契約で一度告知したから、今回は何も確認されない――ではありません。」\n\n---\n\n# 転換すると元の契約は？\n\n「ここは絶対に押さえてください。」\n\n### **旧契約は消滅します。**\n\n旧契約\n↓\n転換\n↓\n❌旧契約\n↓\n⭕新契約\n\nです。\n\n---\n\n「先輩、ということはですよ。」\n\n新しい契約に転換してから、\n\n「やっぱり昔の保険のほうが良かったから、そのまま戻して」\n\nと簡単にはいきません。\n\nだから、\n\n> **旧契約と新契約の保障内容・保険料などを十分比較する**\n\nことが重要なんです。\n\n---\n\n# 「転換＝必ず得なの？」\n\n「いいえ。ここはかなり大事です。」\n\n転換価格を新契約に使えるから、\n\n「じゃあ絶対お得じゃん」\n\nと思うかもしれません。\n\nでも、新契約は転換時の年齢などで保険料が計算されます。\n\n年齢が上がっていれば、\n\n### 保険料が高くなる\n\n可能性があります。\n\nさらに、\n\n**保障内容\n予定利率など\n解約返戻金\n保険期間**\n\nなどの条件も変わる可能性があります。\n\n「なので、**転換＝得**でも**転換＝損**でもありません。新旧の契約を比較して判断するものです。」\n\n---\n\n# C【イメージ理解｜スマホの下取り】\n\n「先輩、スマホを買い替えるときで考えましょう。」\n\n📱古いスマホ\n\nお店に持っていく。\n\n↓\n\n「このスマホは2万円で下取りできます」\n\n↓\n\n📱→💰2万円\n\n↓\n\nその2万円を使って、\n\n📱✨新しいスマホ\n\nを購入する。\n\n---\n\n保険も同じイメージです。\n\n📄旧契約\n↓\n💰 **転換価格**\n↓\n📄新契約\n\nただし、\n\n「古いスマホの設定が全部そのまま新しいスマホになる」\n\nわけではありませんよね。\n\n保険も、\n\n### **新しい契約**\n\nとして条件が設定されます。\n\n「これが転換の感覚です。」\n\n---\n\n# D【具体例｜30歳の保険を45歳で転換】\n\nAさんは30歳で生命保険に加入しました。\n\nその後45歳になり、\n\n「保障内容を今の生活に合わせたい」\n\nと考えました。\n\n現在の契約には、\n\n### 転換価格100万円\n\nがあるとします。\n\nその100万円を、\n\n新しい保険契約の一部に充当。\n\n↓\n\n### 新しい生命保険へ転換\n\nします。\n\n---\n\nこのとき、\n\n旧契約\n→ **消滅**\n\n新契約\n→ **45歳時点の年齢などを基準に設定**\n\nさらに、\n\n→ **告知・診査が原則必要**\n\nとなります。\n\n「“旧契約を少し修正しただけ”ではないんですね。」\n\n---\n\n# 【払済・延長・転換の違い】\n\n「先輩、せっかくなので直前の2つとつなげます。」\n\n||払済|延長|転換|\n|-|-|-|-|\n|今後の保険料|なし|なし|**新契約で払う**|\n|目的|支払い停止＋保障維持|支払い停止＋保障額維持|**新しい保険へ切替**|\n|保障額|↓|原則→|新契約による|\n|期間|原則→|↓|新契約による|\n|旧契約|形を変えて継続|形を変えて継続|**消滅**|\n|告知・診査|通常不要|通常不要|**原則必要**|\n\n「特に転換だけは、**新契約になる**という感覚を強く持ってください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n契約転換制度では、旧契約の何を新契約に利用する？\n\n……\n\n### **転換価格です。**\n\n旧契約の積立部分などを新しい契約に充当します。\n\n---\n\n### Q2\n\n30歳で加入し、45歳で転換した場合、新契約の保険料は基本的に何歳を基準にする？\n\n……\n\n### **45歳、つまり転換時の年齢です。**\n\n「30歳ではありませんよ。」\n\n---\n\n### Q3\n\n転換後、旧契約はどうなる？\n\n……\n\n### **消滅します。**\n\nそして新しい保険契約になります。\n\n---\n\n# 【30秒復習】\n\n① **転換とは？**  \n→ 古い保険を利用して新しい保険へ切り替える\n\n② **何を利用？**  \n→ **転換価格**\n\n③ **旧契約は？**  \n→ **消滅**\n\n④ **新契約の年齢は？**  \n→ **転換時の年齢**\n\n⑤ **告知・診査は？**  \n→ **原則必要**\n\n⑥ **必ず得？**  \n→ **違う。新旧契約を比較する**\n\n# 【一文で覚える】\n\n> **「契約転換制度は、旧契約の転換価格を新契約に充当して保険を切り替える制度で、旧契約は消滅し、新契約は転換時の年齢などを基準に契約する。」**\n\n「先輩、最後にこれだけ。」\n\n### 払済\n\n→ **金額を小さくして保険料ストップ**\n\n### 延長\n\n→ **期間を短くして保険料ストップ**\n\n### 転換\n\n→ **旧契約を下取りして新契約へ**\n\nこの3つを並べれば、かなり整理できます。\n\n次は **㊺「付加・追加・減額」** です。\n\n---", "chapter": 2}, {"n": 45, "title": "付加・追加・減額（ふか・ついか・げんがく）", "raw": "# 第2章 リスク管理㊺\n\n## 付加・追加・減額（ふか・ついか・げんがく）\n\n### A【要点｜まず3つを一気に掴みましょう】\n\n「はい、先輩。前回は**契約そのものを新しい保険へ転換する方法**でした。今回はもっと軽い見直しです。」\n\n今の保険を全部やめるのではなく、\n\n> **必要な保障を足したり、保障額を増減させたりして、今の生活に合わせる**\n\n方法です。\n\nまず3つを一言で。\n\n> **付加＝特約を付ける**  \n> **追加＝保障を増やす**  \n> **減額＝保障を減らす**\n\n「“付加”と“追加”が似ていますけど、ここを分けますよ。」\n\n---\n\n# B【詳しい解説①｜付加】\n\n「まず**付加**です。」\n\n付加とは、\n\n> **現在の保険契約に、新しい特約などを付け加えること。**\n\nたとえば先輩が、\n\n死亡保障\n→ 1,000万円\n\nの生命保険に入っている。\n\nでも、\n\n「医療保障も手厚くしたいな」\n\nとなった。\n\nそこで契約上可能なら、\n\n### 医療関係の特約を付加\n\nする。\n\n---\n\n「つまり、主契約そのものを別物にするというより、**オプションを付ける**イメージですね。」\n\n🚗車  \n＋  \nカーナビ\n\nみたいな感じです。\n\n---\n\n# 「付加するときは何も審査されない？」\n\n「先輩、そこは注意です。」\n\n保障を新しく増やすわけですから、\n\n> **告知や診査が必要になる場合があります。**\n\n「健康状態が悪くなってから好きなだけ保障を後付けできる、というわけではありません。」\n\n---\n\n# ② 追加\n\n「次は**追加**。」\n\nこれは、\n\n> **保障をさらに増やすため、新たな契約などを追加する方法**\n\nです。\n\nたとえば、\n\n死亡保障1,000万円\n↓\n「子どもが生まれたから保障が足りない」\n↓\nさらに500万円の保障を追加\n↓\n\n### 合計1,500万円\n\nというイメージですね。\n\n---\n\n# 「付加と追加って何が違うの？」\n\n「はい。ここが一番ややこしいですよね。」\n\nざっくり分けるなら、\n\n### 付加\n\n→ **今の契約に特約などを付ける**\n\n### 追加\n\n→ **新しい保障・契約を追加する**\n\nと考えてください。\n\nイメージなら、\n\n### 付加\n\n📱＋オプション\n\n### 追加\n\n📱＋📱もう1台\n\nです。\n\n「どちらも保障を増やす方向ですが、増やし方が違います。」\n\n---\n\n# ③ 減額\n\n「そして一番分かりやすいのが**減額**です。」\n\n減額とは、\n\n> **現在の保険金額などを減らすこと。**\n\nたとえば、\n\n死亡保障\n\n### 3,000万円\n\nだった。\n\n子どもが独立した。\n\n住宅ローンも減った。\n\n貯蓄も増えた。\n\n「もう3,000万円も必要ないかもしれない」\n\nとなったら、\n\n3,000万円\n↓\n\n### 1,500万円\n\nのように減らします。\n\n---\n\n# 「減額すると保険料は？」\n\n「保障を小さくするわけですから、一般に――」\n\n### **保険料負担も軽くなります。**\n\nつまり、\n\n必要保障額が減った\n↓\n保障額を減額\n↓\n保険料も軽減\n\nという流れですね。\n\n---\n\n# 「減額した部分はどうなるの？」\n\n「ここ、FPでは大事ですよ。」\n\n減額した部分については、\n\n> **一部解約したものとして扱われる**\n\nのが基本です。\n\nそのため、減額部分について解約返戻金があれば、\n\n### **解約返戻金を受け取る**\n\nことがあります。\n\n---\n\n## たとえば\n\n終身保険\n\n死亡保障\n→ 1,000万円\n\nこれを、\n\n→ 600万円\n\nに減額。\n\n差額の、\n\n### 400万円部分\n\nについては、\n\n**一部解約**\n\nしたイメージです。\n\n「全部解約ではありませんよ。」\n\n600万円分の契約は残ります。\n\n---\n\n# 「なんで減額する必要があるの？」\n\n「先輩、必要保障額を思い出してください。」\n\n子どもが小さい\n↓\n教育費が必要\n↓\n必要保障額が大きい\n\nでも、\n\n20年後\n\n子ども独立\n↓\n教育費不要\n\n住宅ローン減少\n↓\n貯蓄増加\n\nとなれば、\n\n### **必要保障額は小さくなる**\n\nことがあります。\n\nそれなのに、\n\n「昔決めた3,000万円を一生そのまま！」\n\nとすると、不要な保障のために保険料を払い続ける可能性があります。\n\nだから、\n\n### **ライフステージに合わせて減額**\n\nするわけです。\n\n「㉓の逓減定期保険や㉔以降で話した必要保障額の考え方ともつながっていますね。」\n\n---\n\n# C【イメージ理解｜家のリフォーム】\n\n「先輩、生命保険を家だと思ってください。」\n\n🏠\n\n今の家に、\n\n### ① 付加\n\n「部屋にエアコンを付けよう」\n\n🏠＋❄️\n\n→ **オプションを付ける**\n\n---\n\n### ② 追加\n\n「家族が増えたから、もう一部屋必要」\n\n🏠＋🏠\n\n→ **保障を追加する**\n\n---\n\n### ③ 減額\n\n「子どもが独立したから、こんな大きな家はいらない」\n\n🏠\n↓\n🏡\n\n→ **保障を小さくする**\n\n「つまり全部、ライフステージに合わせた**保険のリフォーム**なんです。」\n\n---\n\n# D【具体例｜子どもの誕生から独立まで】\n\n「Aさんの人生で見てみましょう。」\n\n### 30歳\n\n生命保険に加入。\n\n死亡保障\n→ 1,000万円\n\n---\n\n### 32歳\n\n子ども誕生。\n\n「死亡保障が足りない」\n\n↓\n\n保障を**追加**\n\n↓\n\n1,000万円\n＋\n2,000万円\n\n↓\n\n### 合計3,000万円\n\n---\n\nさらに、\n\n「医療保障も欲しい」\n\n↓\n\n契約上可能な医療特約を、\n\n### **付加**\n\n---\n\nそして55歳。\n\n子ども独立。\n\n住宅ローンもかなり減った。\n\n↓\n\n3,000万円の死亡保障は多すぎる。\n\n↓\n\n### **減額**\n\n↓\n\n1,500万円へ。\n\n「こうやって保険を人生に合わせて調整していくんです。」\n\n---\n\n# 【前回の転換との違い】\n\n「ここも整理しましょう。」\n\n### 契約転換\n\n旧契約\n↓\n**消滅**\n↓\n新契約\n\n「車そのものを買い替える。」\n\n---\n\n### 付加・追加・減額\n\n現在の保障をベースに、\n\n**足す**\nまたは\n**減らす**\n\n「今の車にオプションを付けたり、保障を調整したりするイメージですね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n現在の契約に新しい特約を付けることは？\n\n……\n\n### **付加。**\n\n---\n\n### Q2\n\n子どもが生まれ、死亡保障が足りなくなったので新たな保障を増やした。\n\n……\n\n### **追加。**\n\n---\n\n### Q3\n\n子どもが独立したため死亡保障3,000万円を1,500万円にした。この変更は？\n\n……\n\n### **減額。**\n\nそして減額部分は基本的に、\n\n### **一部解約**\n\nとして扱われます。\n\n「ここまでセットです。」\n\n---\n\n# 【30秒復習】\n\n① **付加**  \n→ 特約などを付ける\n\n② **追加**  \n→ 新たな保障を増やす\n\n③ **減額**  \n→ 保障額を減らす\n\n④ **減額部分は？**  \n→ **一部解約扱い**\n\n⑤ **減額すると保険料は？**  \n→ 一般に軽くなる\n\n⑥ **何に合わせて変更する？**  \n→ **ライフステージ・必要保障額**\n\n# 【一文で覚える】\n\n> **「付加は特約を付け、追加は保障を増やし、減額は保障を小さくして減額部分を一部解約する、ライフステージに応じた保障見直しの方法。」**\n\n「はい、先輩。」\n\n**付加＝オプションを足す**  \n**追加＝保障を足す**  \n**減額＝保障を削る**\n\nこの3つで整理してください。\n\nここまでで保険契約の見直しは一区切りです。\n\n次は税金に入って、**㊻「生命保険料控除」**です。\n\n---", "chapter": 2}, {"n": 46, "title": "生命保険料控除（せいめいほけんりょうこうじょ）", "raw": "# 第2章 リスク管理㊻\n\n## 生命保険料控除（せいめいほけんりょうこうじょ）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。ここから**保険と税金**に入ります。生命保険料控除は、“払った保険料がそのまま税金から引かれる”制度ではありません。ここ、最初に絶対間違えないでください。」\n\n生命保険料控除とは、\n\n> **一定の生命保険料を支払った場合、その金額に応じて所得から一定額を差し引ける所得控除。**\n\nつまり、\n\n**生命保険料を払う**\n↓\n**生命保険料控除**\n↓\n課税対象となる所得が小さくなる\n↓\n\n### **所得税・住民税の負担が軽くなる**\n\nという仕組みです。\n\n---\n\n# 「10万円控除されたら税金が10万円安くなる？」\n\n「……先輩、それは違います。」\n\nたとえば、\n\n所得500万円\n↓\n生命保険料控除10万円\n↓\n\n### 課税対象を490万円にする\n\nというイメージです。\n\n**税額から10万円を直接引くわけではありません。**\n\nこれを、\n\n### **所得控除**\n\nといいます。\n\n---\n\n# B【詳しい解説｜3つの控除に分かれる】\n\n「現在の新契約では、生命保険料控除を大きく3つに分けます。」\n\n### ① 一般生命保険料控除\n\n死亡保障などに関する一定の生命保険。\n\n---\n\n### ② 介護医療保険料控除\n\n医療保険・介護保険など。\n\n---\n\n### ③ 個人年金保険料控除\n\n一定の条件を満たした個人年金保険。\n\n「先輩、つまり――」\n\n> **一般・介護医療・個人年金**\n\nこの3箱です。\n\n---\n\n# 新契約の所得税はいくら控除できる？\n\n「ここはFP試験で数字が出やすいので押さえます。」\n\n2012年1月1日以後に締結した新契約では、所得税について、\n\n### 一般生命保険料控除\n\n→ 最大 **4万円**\n\n### 介護医療保険料控除\n\n→ 最大 **4万円**\n\n### 個人年金保険料控除\n\n→ 最大 **4万円**\n\nです。\n\nしたがって、\n\n**4万円＋4万円＋4万円**\n\n＝\n\n# 最大12万円\n\nの所得控除です。\n\n---\n\n# 「12万円税金が減るんだ！」\n\n「先輩？ さっきやりましたよ。」\n\n### ❌ 税金が12万円減る\n\nではありません。\n\n### ⭕ 所得から最大12万円を控除\n\nです。\n\n仮に課税される所得が300万円だったとして、\n\n300万円\n↓\n控除12万円\n↓\n\n### 288万円\n\nのように課税対象を小さくするイメージです。\n\n「だから実際に減る税金は12万円そのものではありません。」\n\n---\n\n# 住民税は？\n\n「所得税だけではありません。」\n\n住民税にも生命保険料控除があります。\n\n新契約の場合、それぞれの控除限度額は基本的に、\n\n### 2万8,000円\n\nです。\n\nただし、\n\n2.8万円 × 3\n＝8.4万円\n\n「じゃあ住民税は最大8万4,000円？」\n\n……\n\n### **違います。**\n\n住民税については、3区分を合計した生命保険料控除の限度額が、\n\n# **7万円**\n\nです。\n\n「ここ、数字問題で狙われやすいですよ。」\n\n---\n\n# 所得税と住民税を並べます\n\n|新契約|所得税|住民税|\n|-|-:|-:|\n|一般生命|4万円|2.8万円|\n|介護医療|4万円|2.8万円|\n|個人年金|4万円|2.8万円|\n|**合計上限**|**12万円**|**7万円**|\n\n「所得税は**4・4・4＝12**。住民税は**2.8ずつだけど合計7**です。」\n\n---\n\n# 「払った保険料全部が控除される？」\n\n「いいえ。これも違います。」\n\nたとえば年間10万円の保険料を払ったから、\n\n### 10万円全部控除\n\nとは限りません。\n\n支払った保険料に応じて一定の計算式を使い、\n\n### **控除額**\n\nを求めます。\n\nそして上限があります。\n\n「つまり、保険料をいくら増やしても控除額が無限に増えるわけではありません。」\n\n---\n\n# 新契約・旧契約って何？\n\n「先輩、ここも少しだけ。」\n\n生命保険料控除では、\n\n### 2012年1月1日以後\n\n→ **新契約**\n\n### 2011年12月31日以前\n\n→ **旧契約**\n\nとして制度が分かれています。\n\n旧契約では控除区分や限度額が新契約と異なります。\n\n「FPで“新制度”と書いてあったら、さっきの**4万円×3＝12万円**を思い出してください。」\n\n---\n\n# C【イメージ理解｜所得というケーキを小さくする】\n\n「先輩、税金を計算する前に、大きなケーキがあると思ってください。」\n\n🎂 **所得500万円**\n\nこの500万円全部を基準に税金を計算するのではなく、\n\n生命保険料控除で、\n\n🔪🎂\n\n一部分を切り取る。\n\nたとえば10万円控除。\n\n↓\n\n🎂 **490万円**\n\nここに税率をかける。\n\n「だから生命保険料控除は、**税金そのものを切る制度ではなく、税金を計算する土台を小さくする制度**なんです。」\n\n---\n\n# D【具体例｜3種類の保険に加入】\n\n「Aさんが新制度の対象となる契約で、」\n\n生命保険\n↓\n一般生命保険料控除\n\n医療保険\n↓\n介護医療保険料控除\n\n個人年金保険\n↓\n個人年金保険料控除\n\nの3種類について、それぞれ十分な保険料を支払い、各区分の上限に達したとします。\n\n所得税では、\n\n4万円\n＋\n4万円\n＋\n4万円\n\n＝\n\n### **12万円**\n\nを所得から控除できます。\n\n---\n\n一方、住民税では、\n\n各区分\n→ 最大2.8万円\n\nでも合計限度額は、\n\n### **7万円**\n\nです。\n\n「2.8×3＝8.4だから8.4万円、と答えないでくださいね。」\n\n---\n\n# 【ここは絶対区別｜所得控除 vs 税額控除】\n\n「先輩、FP全体で重要なので確認します。」\n\n### 所得控除\n\n所得\n↓\n控除\n↓\n税率\n\n生命保険料控除はこちら。\n\n---\n\n### 税額控除\n\n所得\n↓\n税率\n↓\n税額\n↓\n控除\n\nこちらは税金そのものから引きます。\n\n「生命保険料控除は名前に“控除”とありますが、**所得控除**です。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n生命保険料控除は「所得控除」と「税額控除」のどちら？\n\n……\n\n### **所得控除。**\n\n税金そのものを直接減らす制度ではありません。\n\n---\n\n### Q2\n\n新契約について、所得税の3区分それぞれの控除上限は？\n\n……\n\n### **各4万円。**\n\nしたがって合計、\n\n### **最大12万円**\n\nです。\n\n---\n\n### Q3\n\n新契約について、住民税は各区分2.8万円だから合計最大8.4万円？\n\n……\n\n### **違います。**\n\n3区分を合計した上限は、\n\n# **7万円**\n\nです。\n\n「はい。ここは試験で数字を入れ替えられても大丈夫ですね。」\n\n---\n\n# 【30秒復習】\n\n① **何控除？**  \n→ **所得控除**\n\n② **3区分は？**  \n→ 一般・介護医療・個人年金\n\n③ **新契約・所得税の各上限**  \n→ **4万円**\n\n④ **所得税の合計上限**  \n→ **12万円**\n\n⑤ **住民税の各上限**  \n→ **2.8万円**\n\n⑥ **住民税の合計上限**  \n→ **7万円**\n\n# 【一文で覚える】\n\n> **「生命保険料控除は所得控除で、新契約では一般・介護医療・個人年金の3区分について、所得税は各4万円・合計12万円、住民税は各2.8万円・合計7万円が控除限度額。」**\n\n「先輩、数字はこれでいきます。」\n\n### 所得税\n\n**4・4・4 → 12**\n\n### 住民税\n\n**2.8・2.8・2.8 → でも合計7**\n\nそして次は、今出てきた3つ目をもっと詳しくやります。\n\n次は **㊼「個人年金保険料控除」** です。\n\n---", "chapter": 2}, {"n": 47, "title": "個人年金保険料控除（こじんねんきんほけんりょうこうじょ）", "raw": "# 第2章 リスク管理㊼\n\n## 個人年金保険料控除（こじんねんきんほけんりょうこうじょ）\n\n### A【要点｜個人年金なら全部対象……ではありません】\n\n「はい、先輩。前回の生命保険料控除で出てきた3つの箱のうち、今回は**個人年金の箱**を詳しく見ます。」\n\nまず最重要です。\n\n> **個人年金保険に入っていれば、何でも個人年金保険料控除になるわけではありません。**\n\n一定の要件を満たして、\n\n### **個人年金保険料税制適格特約**\n\nが付加された契約などが対象になります。\n\n「名前は長いですけど、“税制優遇を受ける条件を満たした個人年金ですよ”という印だと思ってください。」\n\n---\n\n# B【詳しい解説｜何のための制度？】\n\n「個人年金保険は、老後資金を自分で準備するものでしたね。」\n\n現役時代\n↓\n保険料を積み立てる\n↓\n老後\n↓\n年金を受け取る\n\n国としても、\n\n「一定の条件を満たして自分で老後資金を準備するなら、税負担を少し軽くしましょう」\n\nという仕組みを設けています。\n\nそれが、\n\n### **個人年金保険料控除**\n\nです。\n\n---\n\n# どんな条件が必要？\n\n「先輩、ここはFP試験でかなり狙いやすいです。」\n\n代表的な要件を整理します。\n\n### ① 年金受取人\n\n原則として、\n\n> **契約者本人またはその配偶者**\n\nです。\n\n---\n\n### ② 被保険者\n\n> **年金受取人と同一人**\n\nであること。\n\n「つまり、年金を受け取る人自身を被保険者にしている、ということですね。」\n\n---\n\n### ③ 保険料払込期間\n\n> **10年以上**\n\nにわたって定期的に保険料を支払う契約であること。\n\n「1〜2年だけ払って“老後用だから税制優遇してください”ではダメなんですね。」\n\n---\n\n### ④ 年金の受取条件\n\n確定年金や有期年金の場合は、\n\n> **年金受取開始時に60歳以上で、受取期間が10年以上**\n\nであることが基本です。\n\n「ここ、数字をセットで。」\n\n### **60歳以上 ＋ 10年以上**\n\nです。\n\n---\n\n# 「終身年金は？」\n\n「あ、そこ気になりますよね。」\n\n終身年金なら、\n\n> **一生涯受け取る**\n\nわけです。\n\nそのため、確定年金・有期年金のような「10年以上」という期間条件とは考え方が異なります。\n\n「試験では、**確定・有期なら60歳以上から10年以上**、と結びつけると整理しやすいですよ。」\n\n---\n\n# 「途中で受取人を変えればいいんじゃない？」\n\n「先輩、税制適格特約には条件がありますから、好き勝手に変更できるものではありません。」\n\n個人年金保険料控除の対象になるためには、\n\n### **税制適格特約の要件を維持する**\n\n必要があります。\n\n「税制優遇を受ける代わりに、契約内容にも一定の縛りがあるわけですね。」\n\n---\n\n# 控除額はいくら？\n\n「これは前回やりましたね。新契約の場合です。」\n\n### 所得税\n\n個人年金保険料控除\n\n→ 最大 **4万円**\n\n---\n\n### 住民税\n\n→ 最大 **2万8,000円**\n\nです。\n\nただし住民税では、\n\n一般生命\n＋\n介護医療\n＋\n個人年金\n\nの3区分を合計した生命保険料控除全体の上限が、\n\n### **7万円**\n\nでした。\n\n---\n\n# 「年間4万円保険料を払ったら4万円税金が減る？」\n\n「先輩？ またそこです。」\n\n違います。\n\n### 4万円は税金から直接引く金額ではありません。\n\n**所得から控除する金額**です。\n\n個人年金保険料控除も、\n\n### **所得控除**\n\nです。\n\n---\n\n# 一般生命保険料控除との関係\n\n「ここも重要です。」\n\n税制適格要件を満たした個人年金保険なら、\n\n### **個人年金保険料控除**\n\nという独立した枠を使えます。\n\nつまり、\n\n一般生命保険\n→ 一般生命保険料控除\n\n医療・介護\n→ 介護医療保険料控除\n\n税制適格の個人年金\n→ **個人年金保険料控除**\n\nと分けられます。\n\n「だから前回の“3つの箱”なんです。」\n\n---\n\n# C【イメージ理解｜税務署の「個人年金専用ゲート」】\n\n「先輩、税務署の前に専用ゲートがあると思ってください。」\n\n🚪 **個人年金保険料控除**\n\n個人年金保険を持ってきたら、\n\n「はい、通してください！」\n\n……とはなりません。\n\n係員が確認します。\n\n---\n\n👮「年金受取人は？」\n\n→ 本人または配偶者。\n\n👮「被保険者は？」\n\n→ 年金受取人と同じ。\n\n👮「保険料は？」\n\n→ 10年以上定期的に払います。\n\n👮「確定・有期年金なら？」\n\n→ 60歳以上から10年以上受け取ります。\n\n👮「税制適格特約は？」\n\n→ 付いています。\n\n「はい、条件を満たしていますね。」\n\n↓\n\n🚪✨\n\n### 個人年金保険料控除\n\n「こういうイメージです。」\n\n---\n\n# D【具体例｜Aさんの個人年金】\n\n「Aさんが個人年金保険に加入しました。」\n\n契約者\n→ Aさん\n\n年金受取人\n→ Aさん\n\n被保険者\n→ Aさん\n\n保険料払込期間\n→ 30年間\n\n年金開始\n→ 65歳\n\n確定年金\n→ 10年間\n\nさらに、\n\n### 個人年金保険料税制適格特約\n\nが付加され、その他の要件も満たしている。\n\n「どうです？」\n\n……\n\n### 個人年金保険料控除の対象\n\nになり得ます。\n\n---\n\nでは、\n\n年金開始\n→ 55歳\n\nの10年確定年金だったら？\n\n「確定年金についての**60歳以上から受取開始**という要件を満たしません。」\n\nしたがって、税制適格の個人年金保険料控除の要件から外れます。\n\n「数字にはちゃんと意味があるんですよ。」\n\n---\n\n# 【生命保険料控除の3つの箱を再確認】\n\n|区分|代表的な対象|所得税の新契約上限|\n|-|-|-:|\n|一般生命保険料控除|死亡保障など|4万円|\n|介護医療保険料控除|医療・介護など|4万円|\n|**個人年金保険料控除**|**税制適格の個人年金**|**4万円**|\n\n「個人年金という名前だけ見ず、**税制適格かどうか**を確認してください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n個人年金保険に加入していれば、すべて個人年金保険料控除の対象になる？\n\n……\n\n### **なりません。**\n\n一定の要件を満たし、個人年金保険料税制適格特約が付加されていることなどが必要です。\n\n---\n\n### Q2\n\n保険料の払込期間は原則何年以上？\n\n……\n\n### **10年以上。**\n\n---\n\n### Q3\n\n確定年金・有期年金の場合、年金受取開始年齢と受取期間は？\n\n……\n\n### **60歳以上から、10年以上。**\n\n「はい。ここはセットで覚えてください。」\n\n---\n\n# 【30秒復習】\n\n① **個人年金なら全部対象？**  \n→ ×\n\n② **重要な特約は？**  \n→ 個人年金保険料税制適格特約\n\n③ **年金受取人は？**  \n→ 契約者本人または配偶者\n\n④ **被保険者は？**  \n→ 年金受取人と同一\n\n⑤ **保険料払込期間は？**  \n→ **10年以上**\n\n⑥ **確定・有期年金は？**  \n→ **60歳以上から10年以上**\n\n# 【一文で覚える】\n\n> **「個人年金保険料控除は、税制適格特約が付いた一定の個人年金が対象で、保険料は10年以上、確定・有期年金なら原則60歳以上から10年以上受け取ることなどが要件。」**\n\n「先輩、数字だけ最後に。」\n\n### **払う → 10年以上**\n\n### **受け取る → 60歳以上から10年以上**\n\nここを軸にしてください。\n\n次はいよいよ、**誰が保険料を払い、誰が保険金を受け取るかで税金が変わる**重要分野です。\n\n次は **㊽「死亡保険金・満期保険金にかかる相続税・所得税・贈与税」** です。\n\n---", "chapter": 2}, {"n": 48, "title": "死亡保険金・満期保険金の税金", "raw": "# 第2章 リスク管理㊽\n\n## 死亡保険金・満期保険金の税金\n\n### ― 相続税・所得税・贈与税 ―\n\n### A【要点｜税金は「誰が払って、誰が受け取ったか」で決まります】\n\n「はい、先輩。ここはFPでかなり重要です。でも、表を丸暗記する前に**判定ルール**を理解しましょう。」\n\n生命保険の税金を見るときは、\n\n**① 被保険者は誰？**  \n→ 誰が死亡した？\n\n**② 保険料負担者は誰？**  \n→ 誰がお金を出した？\n\n**③ 保険金受取人は誰？**  \n→ 誰がお金を受け取った？\n\nこの3人を確認します。\n\n特に重要なのは、\n\n> **保険料負担者と保険金受取人の関係**\n\nです。\n\n---\n\n## 死亡保険金なら、まずこの3パターン\n\n|保険料負担者|被保険者|受取人|税金|\n|-|-|-|-|\n|夫|**夫**|妻|**相続税**|\n|夫|妻|**夫**|**所得税・住民税**|\n|夫|妻|子|**贈与税**|\n\n「先輩、これを丸暗記する前に、“なぜそうなるのか”をやりますよ。」\n\n---\n\n# B【詳しい解説①｜相続税になるパターン】\n\n夫が、\n\n自分に生命保険をかけています。\n\n保険料負担者\n→ 夫\n\n被保険者\n→ 夫\n\n受取人\n→ 妻\n\nそして夫が死亡。\n\n妻が死亡保険金を受け取ります。\n\n---\n\n「何が起きています？」\n\n夫がお金を負担\n↓\n夫が死亡\n↓\n妻がお金を受け取る\n\nつまり、\n\n### **亡くなった人が負担していた財産が、死亡をきっかけに妻へ移る**\n\nという構造です。\n\nそのため、\n\n# **相続税**\n\nの対象です。\n\n---\n\n## 死亡保険金には非課税枠がある\n\n「しかも、ここは超重要です。」\n\n相続人が受け取る死亡保険金には、\n\n> **500万円 × 法定相続人の数**\n\nという非課税限度額があります。\n\nたとえば法定相続人が、\n\n妻＋子2人\n\nなら3人。\n\n500万円\n×\n3人\n\n＝\n\n### **1,500万円**\n\nまでが死亡保険金の非課税限度額です。\n\n「ただし、この非課税制度は**相続人が受け取る死亡保険金**についてのものです。誰が受け取っても500万円×人数、ではありませんよ。」\n\n---\n\n# ② 所得税になるパターン\n\n「次です。」\n\n保険料負担者\n→ **夫**\n\n被保険者\n→ 妻\n\n死亡保険金受取人\n→ **夫**\n\n妻が死亡して、夫が死亡保険金を受け取った。\n\n---\n\n「先輩、誰がお金を払いました？」\n\n### 夫。\n\n「誰がお金を受け取りました？」\n\n### 夫。\n\nつまり、\n\n> **自分で保険料を負担して、自分で保険金を受け取った**\n\nということ。\n\nだから、\n\n# **所得税・住民税**\n\nの対象になります。\n\n---\n\n## 一括で受け取ったら？\n\n死亡保険金を一時金として受け取った場合は、原則として、\n\n### **一時所得**\n\nです。\n\n基本的な計算は、\n\n> **一時所得 ＝ 受取保険金 − 払込保険料 − 特別控除額（最高50万円）**\n\nそして課税対象になるときは、\n\n### **その1/2**\n\nを他の所得と合算します。\n\n「“保険金を受け取った金額全部にそのまま所得税”ではないんですね。」\n\n---\n\n# ③ 贈与税になるパターン\n\n「最後は少し注意してください。」\n\n保険料負担者\n→ **夫**\n\n被保険者\n→ 妻\n\n受取人\n→ **子**\n\n妻が死亡。\n\n子が死亡保険金を受け取った。\n\n---\n\n夫がお金を出した\n↓\n妻の死亡をきっかけに\n↓\n子がお金を受け取った\n\n「お金を負担した人と、受け取った人が別人ですよね。」\n\nこれは、\n\n> **夫から子へ財産を与えた**\n\nような関係になるため、\n\n# **贈与税**\n\nの対象です。\n\n---\n\n# ここで判定法を作ります\n\n「先輩、死亡保険金ならこれでかなり解けます。」\n\n### STEP 1\n\n保険料負担者と被保険者が同じ？\n\n→ YES\n\n### **相続税**\n\n---\n\n違うならSTEP 2。\n\n### STEP 2\n\n保険料負担者と受取人が同じ？\n\n→ YES\n\n### **所得税**\n\n---\n\nそれも違う？\n\n### **贈与税**\n\n「この順番です。」\n\n---\n\n# 満期保険金はどうなる？\n\n「え？死亡しないで満期になったら？――そこですよね。」\n\n満期保険金では死亡がありませんから、\n\n### 相続税は基本的に出てきません。\n\n重要なのは、\n\n### 誰が保険料を負担したか\n\n### 誰が満期保険金を受け取ったか\n\nです。\n\n---\n\n## 自分で払って、自分で受け取る\n\n保険料負担者\n→ 夫\n\n満期保険金受取人\n→ 夫\n\nなら、\n\n# **所得税・住民税**\n\nです。\n\n一時金なら原則、\n\n### **一時所得**\n\nになります。\n\n---\n\n## 自分が払って、他人が受け取る\n\n保険料負担者\n→ 夫\n\n満期保険金受取人\n→ 妻\n\nなら、\n\n# **贈与税**\n\nです。\n\n「死亡保険金よりシンプルですね。」\n\n---\n\n# C【イメージ理解｜お金にGPSを付ける】\n\n「先輩、保険料のお金にGPSを付けましょう。」\n\n### パターン①\n\n👨夫のお金\n↓\n夫が死亡\n↓\n👩妻へ\n\n### 相続税\n\n---\n\n### パターン②\n\n👨夫のお金\n↓\n妻が死亡\n↓\n👨夫へ戻る\n\n### 所得税\n\n---\n\n### パターン③\n\n👨夫のお金\n↓\n妻が死亡\n↓\n👦子へ\n\n### 贈与税\n\n「つまり、“保険”という名前だけ見て税金を決めるんじゃありません。」\n\n### **誰のお金が、誰に移ったのか**\n\nを見るんです。\n\n---\n\n# D【具体例｜3問連続で判定】\n\n## ケース①\n\n契約者・保険料負担者：父  \n被保険者：父  \n死亡保険金受取人：母\n\n父が死亡。\n\n「さて？」\n\n……\n\n父のお金\n→ 父の死亡\n→ 母\n\n### **相続税**\n\nです。\n\n---\n\n## ケース②\n\n保険料負担者：父  \n被保険者：母  \n死亡保険金受取人：父\n\n母が死亡。\n\n……\n\n父がお金を負担\n↓\n父が受け取る\n\n### **所得税・住民税**\n\nです。\n\n一時金なら原則、\n\n### **一時所得**\n\nですね。\n\n---\n\n## ケース③\n\n保険料負担者：父  \n被保険者：母  \n死亡保険金受取人：子\n\n母が死亡。\n\n……\n\n父がお金を負担\n↓\n子が受け取る\n\n### **贈与税**\n\nです。\n\n「はい。名前じゃなく、お金の流れを追えてます。」\n\n---\n\n# 【死亡保険金の最重要表】\n\n|保険料負担者|被保険者|受取人|課税|\n|-|-|-|-|\n|A|**A**|B|**相続税**|\n|A|B|**A**|**所得税・住民税**|\n|A|B|C|**贈与税**|\n\nこれを言葉にすると、\n\n> **死亡した本人が払った → 相続**  \n> **払った本人が受け取った → 所得**  \n> **払った人から別の人へ → 贈与**\n\nです。\n\n---\n\n# 【満期保険金の最重要表】\n\n|保険料負担者|受取人|課税|\n|-|-|-|\n|A|**A**|**所得税・住民税**|\n|A|B|**贈与税**|\n\n「満期では死亡していないので、まず**自分で受け取るか、他人が受け取るか**を見ればいいですね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n夫が保険料を負担し、夫を被保険者として、妻が死亡保険金を受け取った。\n\n……\n\n### **相続税。**\n\n---\n\n### Q2\n\n夫が保険料を負担し、妻を被保険者として、夫自身が死亡保険金を受け取った。\n\n……\n\n### **所得税・住民税。**\n\n一時金なら原則一時所得です。\n\n---\n\n### Q3\n\n夫が保険料を負担し、妻を被保険者として、子が死亡保険金を受け取った。\n\n……\n\n### **贈与税。**\n\n「この3パターン、絶対に人物関係を図にしてください。」\n\n---\n\n# 【30秒復習】\n\n① **保険料負担者＝死亡した人**  \n→ **相続税**\n\n② **保険料負担者＝受取人**  \n→ **所得税**\n\n③ **3者が別**  \n→ **贈与税**\n\n④ **相続人の死亡保険金の非課税枠**  \n→ **500万円 × 法定相続人の数**\n\n⑤ **自分で払って満期金を自分で受取**  \n→ **所得税**\n\n⑥ **自分で払って満期金を他人が受取**  \n→ **贈与税**\n\n# 【一文で覚える】\n\n> **「死亡保険金は、死亡した本人が保険料を負担していれば相続税、負担者自身が受け取れば所得税、負担者と被保険者と受取人が異なれば贈与税。」**\n\n「先輩、ここは表を覚えるより、**お金にGPSを付ける**です。」\n\n**誰が払った？**\n↓\n**誰が死んだ？**\n↓\n**誰が受け取った？**\n\nこの3つを問題文に書き込めば、かなり強くなります。\n\n次は **㊾「金融類似商品の税金」** です。\n\n---", "chapter": 2}, {"n": 49, "title": "金融類似商品の税金（きんゆうるいじしょうひん）", "raw": "# 第2章 リスク管理㊾\n\n## 金融類似商品の税金（きんゆうるいじしょうひん）\n\n### A【要点｜「保険なのに預金みたい」がポイントです】\n\n「はい、先輩。前回は死亡保険金や満期保険金の税金でした。今回はちょっと特殊な**金融類似商品**です。」\n\n金融類似商品とは、ざっくり言えば、\n\n> **保険の形をしているけれど、貯蓄・運用商品に近い性質が強いもの**\n\nです。\n\n一定の要件を満たす保険の満期保険金などについては、通常の一時所得ではなく、\n\n# **20.315％の源泉分離課税**\n\nとなります。\n\n「まず試験対策では、ここを強く固定してください。」\n\n> **金融類似商品 → 20.315％の源泉分離課税**\n\n---\n\n# B【詳しい解説｜普通の満期保険金と何が違うの？】\n\n「前回、こう勉強しましたね。」\n\n自分で保険料を払う\n↓\n自分で満期保険金を受け取る\n\n通常なら、\n\n### **一時所得**\n\nです。\n\n「じゃあ全部、一時所得？」\n\n……\n\n### **違います。**\n\n一定の条件を満たす保険は、実質的に預貯金などの金融商品に近い性質があります。\n\nそこで税制上、\n\n> 「これは通常の長期的な生命保険と同じ扱いではなく、金融商品に近い課税にしましょう」\n\nとなるわけです。\n\n---\n\n# どんなものが金融類似商品になるの？\n\n「ここは代表的な要件を押さえましょう。」\n\nたとえば一時払養老保険などで、次のような条件を満たすものです。\n\n### ① 保険期間などが5年以下\n\n「短期間ですね。」\n\n---\n\n### ② 一時払またはそれに近い方法で保険料を支払う\n\n毎月長期間積み立てるというより、\n\n### 💰ドンッ\n\nとまとまった保険料を払うイメージです。\n\n---\n\n### ③ 普通死亡保険金が満期保険金に比べて一定水準以下\n\n「つまり、死亡保障を手厚くすることよりも、**貯蓄・運用としての性格が強い**わけです。」\n\n※細かな判定要件がありますが、FPの基本ではまず「短期・一時払・貯蓄性が強い」と掴んでください。\n\n---\n\n# 「だから金融“類似”なんだ」\n\n「そうです。」\n\n保険という服を着ているけれど、\n\n中身を見ると、\n\n🏦定期預金などの金融商品\n\nに近い。\n\nだから、\n\n### **金融類似商品**\n\nなんですね。\n\n---\n\n# 税率20.315％って何？\n\n「先輩、数字が細かいですよね。」\n\n内訳は、\n\n### 所得税等 15.315％\n\n＋\n\n### 住民税 5％\n\n＝\n\n# **20.315％**\n\nです。\n\n「FPではこの**20.315％**をそのまま覚えてしまうのが早いです。」\n\n---\n\n# 「源泉分離課税って何？」\n\n「はい。ここが言葉として難しいですよね。」\n\nまず、\n\n### 源泉\n\nとは、\n\n> **お金を受け取る段階で税金を差し引く**\n\nイメージです。\n\nそして、\n\n### 分離課税\n\nとは、\n\n> **給与所得などの他の所得とは分けて課税する**\n\nということ。\n\nつまり、\n\n利益が出た\n↓\n税金を計算\n↓\n\n### 受取時に税金を差し引く\n\n↓\n他の所得とは分離して課税\n\nこれが、\n\n### **源泉分離課税**\n\nです。\n\n---\n\n# 何に20.315％をかけるの？\n\n「ここ、かなり大事です。」\n\nたとえば、\n\n保険料\n→ 900万円\n\n満期保険金\n→ 1,000万円\n\nだったとします。\n\n「1,000万円全部に20.315％？」\n\n……\n\n### 違います。\n\n基本的には、\n\n1,000万円\n−\n900万円\n\n＝\n\n### **100万円の差益**\n\nに対して課税されます。\n\nつまり、\n\n> **差益 × 20.315％**\n\nです。\n\nこの例なら、\n\n100万円 × 20.315％\n\n＝\n\n### 20万3,150円\n\nですね。\n\n---\n\n# 「一時所得なら50万円控除があったよね？」\n\n「あ、そこに気づいたのは大事です。」\n\n通常の一時所得なら、\n\n受取保険金\n−\n払込保険料\n−\n\n### 特別控除50万円\n\nという計算がありました。\n\nさらに課税対象は原則、\n\n### 1/2\n\nでしたね。\n\n---\n\nでも金融類似商品として源泉分離課税になる場合は、\n\n### ❌ 一時所得として50万円控除\n\nではなく、\n\n### ⭕ 差益に20.315％\n\nです。\n\n「ここを混ぜないでください。」\n\n---\n\n# C【イメージ理解｜保険の制服を着た定期預金】\n\n「先輩、こんな人が歩いてきたと思ってください。」\n\n👔胸には、\n\n### 『生命保険』\n\nと書いてある。\n\n「生命保険さんですね？」\n\nでも制服を脱がせてみると……\n\n🏦💰\n\n### 「あれ？かなり金融商品っぽい」\n\n短期間\n＋\n一時払\n＋\n貯蓄性が強い\n\nだから税務上、\n\n> 「君は普通の保険と同じ一時所得扱いじゃなくて、金融商品に近い課税ね」\n\nとなる。\n\n↓\n\n### **20.315％源泉分離課税**\n\n「“保険の制服を着た金融商品”というイメージです。」\n\n---\n\n# D【具体例｜普通の養老保険と比べる】\n\n### ケース① 長期間の一般的な養老保険\n\nAさん自身が保険料を負担。\n\nAさん自身が満期保険金を一時金で受け取った。\n\n通常なら、\n\n### **一時所得**\n\nとして扱います。\n\n---\n\n### ケース② 金融類似商品に該当\n\n短期間\n＋\n一時払\n＋\n一定の要件を満たす保険\n\nAさんが、\n\n900万円\n↓\n保険料として支払い\n\n満期に、\n\n1,000万円\n\n受け取った。\n\n差益は、\n\n### 100万円\n\nこれに、\n\n### 20.315％\n\n↓\n\n税額\n\n### 20万3,150円\n\n「普通の一時所得の計算に持っていかないことがポイントですね。」\n\n---\n\n# 【普通の満期保険金との比較】\n\n||通常|金融類似商品|\n|-|-|-|\n|保険料負担者|本人|本人|\n|受取人|本人|本人|\n|基本的な課税|**一時所得**|**源泉分離課税**|\n|50万円特別控除|あり|**なし**|\n|1/2課税|あり|**なし**|\n|税率|所得に応じる|**20.315％**|\n\n「先輩、試験で『一時払』『5年以下』みたいな言葉が見えたら、金融類似商品を疑ってください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n金融類似商品の差益に対する基本的な税率は？\n\n……\n\n# **20.315％**\n\nです。\n\n---\n\n### Q2\n\n課税方式は？\n\n……\n\n### **源泉分離課税。**\n\n---\n\n### Q3\n\n900万円を払い、満期保険金1,000万円を受け取った場合、1,000万円全額に20.315％をかける？\n\n……\n\n### **かけません。**\n\n差益、\n\n1,000万円 − 900万円\n\n＝\n\n### **100万円**\n\nが課税対象となる基本イメージです。\n\n---\n\n# 【30秒復習】\n\n① **金融類似商品とは？**  \n→ 保険だが金融商品に近い性質\n\n② **キーワード**  \n→ **短期・一時払・貯蓄性**\n\n③ **課税方式**  \n→ **源泉分離課税**\n\n④ **税率**  \n→ **20.315％**\n\n⑤ **何に課税？**  \n→ **差益**\n\n⑥ **一時所得の50万円控除・1/2課税は？**  \n→ **使わない**\n\n# 【一文で覚える】\n\n> **「一定の短期・一時払の養老保険など金融類似商品に該当するものは、満期保険金等の差益に20.315％の源泉分離課税。」**\n\n「はい、先輩。ここはシンプルです。」\n\n### 普通の満期保険金\n\n→ **一時所得**\n\nでも、\n\n### 短期＋一時払＋金融商品っぽい\n\n→ **金融類似商品**\n→ **差益 × 20.315％**\n\nこの例外を覚えておきましょう。\n\n次は **㊿「非課税となる保険金や給付金」** です。\n\n---", "chapter": 2}, {"n": 50, "title": "非課税となる保険金・給付金", "raw": "# 第2章 リスク管理㊿\n\n## 非課税となる保険金・給付金\n\n### A【要点｜「病気やケガを補うお金」は原則非課税】\n\n「はい、先輩。前回は保険金に税金がかかる話でした。でも、保険会社からお金を受け取ったら何でも課税されるわけではありません。」\n\nまず中心ルールです。\n\n> **身体の傷害・病気などを原因として受け取る給付金のうち、一定のものは原則として非課税です。**\n\n代表例は、\n\n**入院給付金\n手術給付金\n通院給付金\n特定疾病保険金\n高度障害保険金\nリビング・ニーズ特約による保険金**\n\nなどです。\n\n「つまり、病気やケガで困っている人を支えるためのお金に、さらに所得税をかけない、という考え方ですね。」\n\n---\n\n# B【詳しい解説①｜入院給付金】\n\n「まず一番分かりやすいところから。」\n\n先輩が病気で入院して、\n\n### 入院給付金50万円\n\nを受け取ったとします。\n\n「50万円も受け取ったから所得？」\n\n……\n\n### **原則、非課税です。**\n\n入院によって発生する経済的負担を補う性質のお金だからですね。\n\n---\n\n# ② 手術給付金\n\n病気になった\n↓\n手術を受けた\n↓\n保険会社から手術給付金\n\nこれも、\n\n### **原則非課税**\n\nです。\n\n「入院と同じく、治療に関係する給付ですね。」\n\n---\n\n# ③ 通院給付金\n\n「退院後に通院した場合など、契約条件を満たして通院給付金を受け取ることもあります。」\n\nこれも、\n\n### **原則非課税**\n\nです。\n\n---\n\n# ④ 特定疾病保険金\n\n「㊶でやりましたね。」\n\nがん\n急性心筋梗塞\n脳卒中\n\nなど、所定の疾病・状態になったことで受け取る、\n\n### 特定疾病保険金\n\nも、身体の傷害・疾病に基因して支払われるものとして、\n\n### **原則非課税**\n\nです。\n\n「まとまった金額だから課税、というわけではありませんよ。」\n\n---\n\n# ⑤ 高度障害保険金\n\n「ここも死亡保険金と混ぜないでください。」\n\n被保険者が死亡した\n→ **死亡保険金**\n\nではなく、\n\n生きているけれど\n↓\n所定の高度障害状態になった\n↓\n\n### 高度障害保険金\n\nというケースがあります。\n\n一定の要件を満たす高度障害保険金についても、\n\n### **非課税**\n\nとなります。\n\n---\n\n# ⑥ リビング・ニーズ特約\n\n「これはちょっと面白いですよ。」\n\nリビング・ニーズ特約は、\n\n### 余命6か月以内と判断された場合など\n\n死亡保険金の一部または全部を、\n\n### **生前に受け取る**\n\n仕組みでした。\n\n「死亡保険金を前倒しするなら、相続税？」\n\n……\n\n### **違います。**\n\n本人が生前に受け取るリビング・ニーズ特約の保険金は、一定の要件のもと、\n\n### **非課税**\n\nです。\n\n---\n\n# 「じゃあ、そのお金を使い切らずに亡くなったら？」\n\n「はい、先輩。ここ、かなり良いところです。」\n\nたとえば、\n\nリビング・ニーズ特約\n↓\n1,000万円受取\n↓\n300万円使う\n↓\n700万円残したまま死亡\n\nとします。\n\n受け取った時点では非課税でも、\n\n残っている700万円は、\n\n### **本人の財産**\n\nになっています。\n\n本人が死亡すると、\n\n預貯金など他の財産と同じように、\n\n### **相続財産**\n\nとして相続税の課税対象になり得ます。\n\n「“一度非課税で受け取ったから、残ったお金も永遠に非課税”ではないんですね。」\n\n---\n\n# 「死亡保険金も非課税だったよね？」\n\n「ちょっと待ってください。そこは言葉を分けましょう。」\n\n前にやった死亡保険金には、\n\n### 500万円 × 法定相続人の数\n\nという**相続税の非課税限度額**がありました。\n\n一方、今回の、\n\n入院給付金\n手術給付金\n特定疾病保険金など\n\nは、\n\n### **身体の傷害・疾病などに基づく給付として非課税**\n\nという話です。\n\n「同じ“非課税”でも仕組みが違います。」\n\n---\n\n# C【イメージ理解｜「治療・身体」ゲート】\n\n「保険会社から100万円が飛んできたと思ってください。」\n\n💰100万円\n↓\n🚪税金チェック\n\n係員が聞きます。\n\n👮「何のためのお金ですか？」\n\n---\n\n「満期になったから受け取りました」\n\n→ 💰課税関係を確認\n\n「死亡保険金です」\n\n→ 💰相続税・所得税・贈与税を判定\n\nところが、\n\n「病気で入院したので入院給付金です」\n\n→ 🏥\n\n### **原則非課税**\n\n「病気やケガによる経済的負担を補うお金なんですね。では非課税です」\n\nというイメージです。\n\n---\n\n# D【具体例｜100万円を受け取った3人】\n\n### Aさん\n\n満期保険金100万円を受け取った。\n\n→ 「満期だから非課税！」\n\n### ❌違います。\n\n契約関係に応じて所得税や贈与税などを考えます。\n\n---\n\n### Bさん\n\n病気で入院し、\n\n入院給付金100万円を受け取った。\n\n→\n\n### ⭕原則非課税\n\n---\n\n### Cさん\n\n手術を受け、\n\n手術給付金100万円を受け取った。\n\n→\n\n### ⭕原則非課税\n\n「同じ100万円でも、**何を原因として支払われたお金なのか**で税金が変わるわけです。」\n\n---\n\n# 【課税・非課税を整理】\n\n|受け取ったもの|基本的な税務上の扱い|\n|-|-|\n|入院給付金|**非課税**|\n|手術給付金|**非課税**|\n|通院給付金|**非課税**|\n|特定疾病保険金|**原則非課税**|\n|高度障害保険金|**一定の場合、非課税**|\n|リビング・ニーズ特約の保険金|**一定の場合、非課税**|\n|死亡保険金|**契約関係により相続税・所得税・贈与税**|\n|満期保険金|**契約関係により所得税・贈与税など**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n病気で入院し、本人が入院給付金を受け取った。所得税は？\n\n……\n\n### **原則非課税です。**\n\n---\n\n### Q2\n\n本人がリビング・ニーズ特約で保険金を受け取った場合は？\n\n……\n\n### **一定の要件のもと非課税です。**\n\n---\n\n### Q3\n\nリビング・ニーズ特約で1,000万円を受け取り、700万円を残して死亡した。残った700万円も「リビングニーズだったから相続税の対象外」？\n\n……\n\n### **違います。**\n\n死亡時に残っているお金は本人の財産ですから、\n\n### **相続財産として相続税の課税対象になり得ます。**\n\n「受け取った瞬間の税金と、死亡時に残っている財産の扱いを分けるんですよ。」\n\n---\n\n# 【30秒復習】\n\n① **入院給付金**  \n→ 非課税\n\n② **手術給付金**  \n→ 非課税\n\n③ **通院給付金**  \n→ 非課税\n\n④ **特定疾病保険金**  \n→ 原則非課税\n\n⑤ **リビング・ニーズ特約**  \n→ 一定の場合、非課税\n\n⑥ **死亡・満期保険金**  \n→ 「全部非課税」ではなく、契約関係から税金を判定\n\n# 【一文で覚える】\n\n> **「病気やケガなど身体の傷害に基づいて受け取る入院・手術・通院・特定疾病などの給付金は原則非課税。ただし死亡保険金や満期保険金は別に課税関係を判定する。」**\n\n「先輩、㊽〜㊿を一本につなげると綺麗ですよ。」\n\n**死亡保険金**\n→ 誰が払った・死んだ・受け取った？\n→ 相続・所得・贈与\n\n**金融類似商品**\n→ 差益に20.315％源泉分離課税\n\n**病気・ケガの給付金**\n→ **原則非課税**\n\nここまで整理できれば、個人の生命保険と税金はかなり見えてきました。\n\n次は法人側に移って、**51「事業保障資金の準備」**です。\n\n---", "chapter": 2}, {"n": 51, "title": "事業保障資金の準備（じぎょうほしょうしきんのじゅんび）", "raw": "# 第2章 リスク管理 51\n\n## 事業保障資金の準備（じぎょうほしょうしきんのじゅんび）\n\n### A【要点｜社長に万一があったら「会社」にいくら必要？】\n\n「はい、先輩。ここからは**個人のための生命保険**ではなく、会社が生命保険をどう使うかに入ります。」\n\n事業保障資金とは、\n\n> **経営者などに万一のことがあったとき、会社が事業を継続するために必要となる資金**\n\nです。\n\nたとえば社長が突然亡くなったら、\n\n**売上が落ちる**\n↓\n**取引先が不安になる**\n↓\n**借入金の返済は続く**\n↓\n**従業員の給与も必要**\n↓\n**死亡退職金なども必要**\n\n「会社って、社長が亡くなったからといって支払いまで止まってくれませんよね。」\n\nだから会社が生命保険に入り、\n\n### 経営者死亡\n\n↓\n\n### 会社が死亡保険金を受け取る\n\n↓\n\n### 事業継続の資金にする\n\nというわけです。\n\n---\n\n# B【詳しい解説｜個人の「必要保障額」の会社版】\n\n「先輩、20番で**必要保障額**をやったのを覚えていますか？」\n\n家族の場合、\n\n夫が死亡\n↓\n家族の収入が減る\n↓\n生活費・教育費などは必要\n↓\n\n### 足りない分を生命保険で補う\n\nでした。\n\n事業保障資金もほぼ同じ発想です。\n\nただし、守る対象が、\n\n👨‍👩‍👧‍👦 家族\n\nではなく、\n\n### 🏢会社\n\nになっただけです。\n\n---\n\n# 会社にはどんなお金が必要になる？\n\n「経営者が死亡した場面を具体的に分解しましょう。」\n\n## ① 借入金の返済\n\n会社が銀行から、\n\n### 5,000万円\n\n借りていたとします。\n\n社長が死亡しても、\n\n「社長が亡くなったので借金も消しますね」\n\n……\n\nなんてことにはなりません。\n\n### 借入金は残ります。\n\nしかも経営者の信用力に大きく依存していた会社なら、資金繰りに影響する可能性もあります。\n\nだから、\n\n> **借入金返済のための資金**\n\nを考える必要があります。\n\n---\n\n# ② 運転資金\n\n「借金だけじゃありませんよ。」\n\n会社は毎月、\n\n従業員の給与\n＋\n家賃\n＋\n仕入代金\n＋\n水道光熱費\n＋\nその他固定費\n\nなどを支払います。\n\n社長が亡くなって売上が一時的に落ちても、\n\n### 支払いは続く。\n\nそこで、\n\n### **当面の運転資金**\n\nが必要になります。\n\n---\n\n# ③ 死亡退職金・弔慰金\n\n経営者が死亡した場合、\n\n会社から遺族へ、\n\n### 死亡退職金\n\n### 弔慰金\n\nなどを支給することがあります。\n\n「これも会社から見れば、大きな資金流出ですよね。」\n\nそこで生命保険金を、\n\n### 死亡退職金などの財源\n\nとして準備する方法があります。\n\n---\n\n# ④ 事業承継などに必要な資金\n\n「さらに経営者が亡くなれば、“次の社長をどうする？”という問題も起こります。」\n\n経営体制の変更\n↓\n後継者への引継ぎ\n↓\n取引先への対応\n↓\n事業承継\n\nなどにも資金が必要になることがあります。\n\nだから生命保険は、\n\n> **会社を止めないための資金源**\n\nとして利用されるんです。\n\n---\n\n# 「誰を保険に入れるの？」\n\n「ここ、契約関係を見ましょう。」\n\n典型的には、\n\n### 契約者\n\n→ **法人**\n\n### 被保険者\n\n→ **経営者・役員など**\n\n### 死亡保険金受取人\n\n→ **法人**\n\nという形です。\n\nつまり、\n\n🏢会社がお金を払う\n↓\n👨経営者に保険をかける\n↓\n経営者死亡\n↓\n💰会社が保険金を受け取る\n\nという流れですね。\n\n---\n\n# 「社員全員じゃなくて、なんで経営者？」\n\n「先輩、ここは経営上の影響を考えてください。」\n\nたとえば小さな会社で、\n\n社長本人が、\n\n営業\n＋\n銀行交渉\n＋\n主要顧客との関係\n＋\n経営判断\n\nを全部担っていたとします。\n\nその社長が突然いなくなったら、\n\n売上\n↓\n信用力\n↓\n意思決定\n↓\n資金繰り\n\nと、複数の問題が同時に起こる可能性があります。\n\nだから、\n\n> **その人がいなくなったとき会社にどれだけ経済的損失が生じるか**\n\nを考えて保障を準備します。\n\n---\n\n# ここで「必要保障額」とつながります\n\n「会社だからといって、とにかく10億円の生命保険に入ればいい、ではありません。」\n\n必要なのは、\n\n### 会社にとっての必要保障額\n\nです。\n\nたとえば、\n\n借入金返済\n＋\n当面の運転資金\n＋\n死亡退職金・弔慰金\n＋\nその他必要資金\n\nなどを考え、\n\nそこから会社の預貯金など、\n\n### すでに準備できている資金\n\nを考慮します。\n\nイメージとしては、\n\n> **必要となる資金 − すでに準備できている資金 ＝ 保険などで準備したい不足額**\n\nです。\n\n「個人の必要保障額と同じ発想ですよね。」\n\n---\n\n# C【イメージ理解｜会社の船長が突然いなくなる】\n\n「先輩、会社を船だと思ってください。」\n\n🚢\n\n社長は船長です。\n\n航海中に突然、\n\n船長がいなくなった。\n\nすると、\n\n「次の船長は？」\n「取引先への連絡は？」\n「燃料代は？」\n「船員の給料は？」\n「借金の返済は？」\n\nと問題が一気に出ます。\n\nそこで、\n\n### 🛟生命保険\n\nを準備しておく。\n\n経営者死亡\n↓\n💰保険金\n↓\n会社に資金を投入\n↓\n🚢事業継続\n\n「生命保険が“会社の緊急用資金タンク”になるイメージです。」\n\n---\n\n# D【具体例｜社長に5,000万円の保険】\n\n「株式会社Aを考えます。」\n\n社長\n→ 山田さん\n\n会社には、\n\n銀行借入金\n→ 3,000万円\n\n当面の運転資金\n→ 1,000万円\n\n死亡退職金など\n→ 1,000万円\n\nが必要になるとします。\n\n合計、\n\n### 5,000万円\n\nです。\n\nそこで、\n\n契約者\n→ 株式会社A\n\n被保険者\n→ 山田社長\n\n死亡保険金受取人\n→ 株式会社A\n\n死亡保険金\n→ 5,000万円\n\nという生命保険を利用する。\n\n---\n\n山田社長が死亡。\n\n↓\n\n会社が、\n\n### 5,000万円\n\nを受け取る。\n\n↓\n\n借入金返済\n＋\n運転資金\n＋\n死亡退職金など\n\nに充てる。\n\n「つまり“社長のための5,000万円”というより、**社長がいなくなった後も会社を守る5,000万円**なんですね。」\n\n---\n\n# 【個人保険との違い】\n\n||個人の必要保障|事業保障|\n|-|-|-|\n|守るもの|家族の生活|**会社・事業**|\n|主なリスク|世帯主死亡|**経営者等の死亡**|\n|必要資金|生活費・教育費など|**借入返済・運転資金・死亡退職金など**|\n|受取人の例|遺族|**法人**|\n|基本発想|家族のお金の穴を埋める|**会社のお金の穴を埋める**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n会社が経営者に生命保険をかける主な目的は？\n\n……\n\n### **経営者に万一のことがあった場合の事業継続資金を準備するため。**\n\n---\n\n### Q2\n\n事業保障資金には、どんなものが考えられる？\n\n……\n\nたとえば、\n\n### **借入金返済**\n\n### **運転資金**\n\n### **死亡退職金・弔慰金**\n\nなどです。\n\n---\n\n### Q3\n\n典型的な法人契約で、\n\n契約者＝法人  \n被保険者＝社長\n\nなら、事業保障目的の死亡保険金受取人は？\n\n……\n\n### **法人。**\n\n会社が保険金を受け取り、事業継続などに使います。\n\n---\n\n# 【30秒復習】\n\n① **事業保障とは？**  \n→ 経営者等の万一に備える会社の資金\n\n② **借金は？**  \n→ 経営者が死亡しても残る\n\n③ **毎月必要なお金は？**  \n→ **運転資金**\n\n④ **遺族への支払い**  \n→ **死亡退職金・弔慰金など**\n\n⑤ **典型的な被保険者**  \n→ **経営者・役員など**\n\n⑥ **典型的な受取人**  \n→ **法人**\n\n# 【一文で覚える】\n\n> **「事業保障資金は、経営者等の死亡による会社の経済的損失に備え、借入金返済・運転資金・死亡退職金などを生命保険で準備するもの。」**\n\n「先輩、個人の必要保障額と同じですよ。」\n\n👨‍👩‍👧‍👦 **家族の穴を埋める**\n→ 個人の生命保険\n\n🏢 **会社の穴を埋める**\n→ 事業保障\n\nこのつながりで覚えてください。\n\n次は **52「生命保険料の経理処理」**。ここから、法人が払った保険料を**損金にするのか、資産にするのか**という会計処理に入ります。\n\n---", "chapter": 2}, {"n": 52, "title": "生命保険料の経理処理", "raw": "# 第2章 リスク管理 52\n\n## 生命保険料の経理処理\n\n### A【要点｜「払った保険料＝全部経費」ではありません】\n\n「はい、先輩。ここから法人保険の**経理処理**です。最初に一番危ない勘違いを潰しますよ。」\n\n会社が生命保険料を100万円払ったとしても、\n\n> **100万円を全部その年の経費＝損金にできるとは限りません。**\n\n保険の種類や契約形態などによって、大きく、\n\n### ① 損金算入\n\n### ② 資産計上\n\n### ③ 一部損金＋一部資産\n\nに分かれます。\n\n「まず、この3つの箱を作ってください。」\n\n---\n\n# B【詳しい解説①｜そもそも損金って何？】\n\n「先輩、簿記でいう費用に近いイメージです。」\n\n法人税は大まかに、\n\n> **益金 − 損金 ＝ 所得**\n\nを基礎として計算します。\n\nたとえば、\n\n益金1,000万円\n−\n損金600万円\n\n＝\n\n所得400万円\n\nという感じですね。\n\n---\n\n会社が払った生命保険料を、\n\n### 損金\n\nにできれば、\n\n課税所得を小さくする方向に働きます。\n\n「じゃあ全部損金にしたい！」\n\n……と思いますよね。\n\nでも、そう簡単ではありません。\n\n---\n\n# ② なぜ「資産計上」があるの？\n\n「たとえば、会社が100万円払った結果、その保険に将来受け取れる価値が積み上がっているとします。」\n\n会社から現金100万円が出た。\n\nでも、\n\n将来解約したらお金が戻ってくるなど、\n\n### **会社に経済的価値が残っている**\n\nなら、\n\n「100万円全部なくなりました」\n\nとして費用扱いするのは不自然な場合があります。\n\nそこで、\n\n### **保険料積立金などとして資産計上**\n\nすることがあります。\n\n---\n\n## イメージ\n\n会社\n🏢\n\n現金100万円\n↓\n保険会社へ\n\nでも、\n\n❌100万円消滅\n\nではなく、\n\n💰→📦\n\n### 将来価値のある保険契約\n\nに姿を変えた。\n\n「だから資産として扱う部分が出てくるんですね。」\n\n---\n\n# ③ 一部損金・一部資産\n\n「さらに保険によっては、両方の性格を持っています。」\n\n100万円支払う\n↓\n一部は保障のためのコスト\n↓\n\n### 損金\n\n一部は将来の価値として残る\n↓\n\n### 資産\n\nという処理です。\n\nつまり、\n\n> **保険料＝全部損金 or 全部資産**\n\nの二択とは限りません。\n\n---\n\n# 「じゃあ何を見て判断するの？」\n\n「はい。ここから先の項目で具体的にやります。」\n\n法人契約では、\n\n**保険の種類\n保険期間\n最高解約返戻率\n契約者\n被保険者\n保険金受取人**\n\nなどによって税務上の取扱いが変わります。\n\n「特にこれから出てくる、」\n\n### 養老保険\n\n### ハーフタックスプラン\n\n### 定期保険・第三分野保険\n\n### 長期平準定期保険\n\nなどで具体的な処理を見ていきます。\n\n---\n\n# 「経理処理って、何のために勉強するの？」\n\n「先輩、ここは税金だけの暗記にしないでください。」\n\n会社が、\n\n年間保険料100万円\n\nを支払った。\n\n---\n\n### パターンA：全額損金\n\n損金\n→ 100万円\n\nその期の所得を小さくする方向。\n\n---\n\n### パターンB：全額資産\n\n資産\n→ 100万円\n\nその期に100万円を全部損金にするわけではない。\n\n---\n\n### パターンC：半分ずつ\n\n損金\n→ 50万円\n\n資産\n→ 50万円\n\n「同じ100万円を払っていても、税務上の所得への影響が全然違いますよね。」\n\n---\n\n# C【イメージ理解｜100万円がどこへ行った？】\n\n「先輩、会社から100万円が出ていったところを想像してください。」\n\n🏢\n↓\n💴100万円\n↓\n保険会社\n\nここで会計担当者が追いかけます。\n\n---\n\n### ケース①\n\n「これは今年の保障を得るために使ったコストですね」\n\n↓\n\n🗑️今年の費用\n\n### **損金**\n\n---\n\n### ケース②\n\n「いや、このお金には将来の価値が残っていますね」\n\n↓\n\n📦会社の財産\n\n### **資産計上**\n\n---\n\n### ケース③\n\n「半分はコスト、半分は将来価値ですね」\n\n↓\n\n🗑️50万円\n＋\n📦50万円\n\n### **一部損金＋一部資産**\n\n「“現金が出ていった＝全部費用”ではない。ここが会計の感覚として大事です。」\n\n---\n\n# D【具体例｜同じ100万円でも違う】\n\n「細かい保険種類のルールは次からやるので、今回は考え方だけですよ。」\n\n会社が年間保険料、\n\n### 100万円\n\nを支払ったとします。\n\n---\n\n## ケースA\n\n税務上、全額損金になる契約。\n\n仕訳イメージは、\n\n**保険料 100万円 ／ 現金・預金 100万円**\n\n→ 損金100万円\n\n---\n\n## ケースB\n\n全額資産計上する契約。\n\n**保険料積立金など 100万円 ／ 現金・預金 100万円**\n\n→ 資産100万円\n\n「同じ“100万円を保険会社に払った”という事実でも、処理が違います。」\n\n---\n\n# 「資産計上なら税金対策にならない？」\n\n「そこも大事です。」\n\n資産計上した金額は、\n\n### その時点では損金にならない\n\nのが基本です。\n\nだから、\n\n「生命保険に入れば保険料を全部経費にして法人税を減らせる」\n\nという理解は、\n\n### ❌間違い。\n\n保険商品や契約内容によって税務処理が決まります。\n\n「ここから先、まさにそのルールを勉強するわけです。」\n\n---\n\n# 【簿記とつなげる】\n\n「先輩は簿記もやっていますから、ここはつなげましょう。」\n\n### 損金算入\n\n税務上\n→ 費用として所得を減らす方向\n\n### 資産計上\n\n貸借対照表側に\n→ **資産として残す**\n\nです。\n\nただし、\n\n> **会計上の「費用」と税務上の「損金」は厳密には同じ概念ではありません。**\n\n「FPではまず、損金＝税務上の経費に近いもの、と理解しておけば進みやすいです。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n法人が生命保険料100万円を払ったら、必ず100万円全額を損金にできる？\n\n……\n\n### **できません。**\n\n契約内容などによって、\n\n**損金\n資産\n一部ずつ**\n\nなどに分かれます。\n\n---\n\n### Q2\n\nなぜ資産計上する場合がある？\n\n……\n\n### **支払った保険料に、将来の経済的価値が残っている場合があるから。**\n\n「現金が別の価値に姿を変えた、と考えるんでしたね。」\n\n---\n\n### Q3\n\n100万円のうち50万円を損金、50万円を資産計上するような処理はあり得る？\n\n……\n\n### **あります。**\n\n保険によっては、\n\n### 一部損金＋一部資産\n\nとなります。\n\n---\n\n# 【30秒復習】\n\n① **保険料＝全部経費？**  \n→ **違う**\n\n② **基本の3パターン**  \n→ 損金・資産・両方\n\n③ **損金とは？**  \n→ 課税所得を減らす方向\n\n④ **資産計上とは？**  \n→ 将来価値などを資産として残す\n\n⑤ **現金が出た＝費用？**  \n→ **必ずしもそうではない**\n\n⑥ **何によって処理が変わる？**  \n→ **保険種類・契約内容など**\n\n# 【一文で覚える】\n\n> **「法人が支払う生命保険料は必ず全額損金になるわけではなく、保険種類や契約内容などに応じて、損金算入・資産計上・その両方に分かれる。」**\n\n「はい、先輩。今回は具体的な割合を覚える回ではなく、**経理処理の土台**です。」\n\n💸払った\n＝\n🗑️全部費用\n\nではありません。\n\n💸払った\n↓\n**今年のコスト？**\nそれとも\n**将来価値が残る？**\n\nと考える癖をつけてください。\n\n次は、この考え方を具体的な保険に当てはめる **53「養老保険の経理処理」** です。\n\n---", "chapter": 2}, {"n": 53, "title": "養老保険の経理処理", "raw": "# 第2章 リスク管理 53\n\n## 養老保険の経理処理\n\n### A【要点｜「誰が保険金を受け取るか」を見ます】\n\n「はい、先輩。前回は、法人が払った生命保険料は**全部損金とは限らない**とやりましたね。今回はそれを養老保険に当てはめます。」\n\n法人契約の養老保険では、まず、\n\n> **死亡保険金と満期保険金を誰が受け取るのか**\n\nを確認します。\n\n基本形はこの3つです。\n\n|死亡保険金受取人|満期保険金受取人|保険料の基本的な税務処理|\n|-|-|-|\n|法人|法人|**資産計上**|\n|被保険者・遺族|被保険者|**給与**|\n|被保険者の遺族|法人|**1/2資産・1/2損金**|\n\n「3つ目が有名な**ハーフタックスプラン**ですね。次の54で詳しくやります。」\n\n---\n\n# B【詳しい解説①｜法人が両方受け取る】\n\nまず、\n\n契約者\n→ 法人\n\n被保険者\n→ 役員・従業員\n\n死亡保険金受取人\n→ **法人**\n\n満期保険金受取人\n→ **法人**\n\nとします。\n\n---\n\n「先輩、養老保険ってどんな保険でした？」\n\n……\n\n保険期間中に死亡\n→ **死亡保険金**\n\n満期まで生存\n→ **満期保険金**\n\nでしたね。\n\nつまり法人は、\n\n死亡しても\n→ 法人が受取\n\n生存して満期でも\n→ 法人が受取\n\nとなっています。\n\n「どちらに転んでも、基本的に会社にお金が戻ってくる構造ですね。」\n\nだから支払保険料は、\n\n### **保険料積立金などとして資産計上**\n\nするのが基本です。\n\n---\n\n# 「なんで損金じゃないの？」\n\n「前回の話につながりますよ。」\n\n会社が100万円払った\n↓\n将来、死亡・満期などで会社が保険金を受け取る\n↓\n会社に経済的価値が残っている\n\nだから、\n\n### 「100万円全部を今年使い切りました」\n\nとは考えにくい。\n\nそこで、\n\n> **資産として積み立てておく**\n\nわけです。\n\n---\n\n# ② 被保険者側が受け取る場合\n\n「次は反対です。」\n\n契約者\n→ 法人\n\n被保険者\n→ 従業員Aさん\n\n満期保険金受取人\n→ **Aさん**\n\n死亡保険金受取人\n→ **Aさんの遺族**\n\nとします。\n\n会社がお金を払っているのに、\n\n最終的な経済的利益を受けるのは、\n\n### 従業員やその遺族\n\nですよね。\n\nすると、\n\n> **会社が従業員のために保険料を負担している**\n\nと考えられます。\n\nそのため保険料は原則、\n\n### **給与**\n\nとして扱われます。\n\n---\n\n# 「給与なら会社は損金？」\n\n「そこ、いいところに気づきましたね。」\n\n給与として適切に扱われる場合には、法人側では原則として損金になります。\n\nただし、\n\n### 役員に対する給与\n\nとなる場合は、法人税法上の役員給与の損金算入ルールがあります。\n\n「だから“給与＝何でも必ず損金”と雑に覚えるのは危険ですよ。」\n\nFPではまず、\n\n> **従業員・遺族が受取人 → 給与扱い**\n\nという基本を押さえましょう。\n\n---\n\n# ③ 死亡は遺族、満期は法人\n\n「はい。ここが一番重要です。」\n\n契約者\n→ 法人\n\n被保険者\n→ 役員・従業員\n\n死亡保険金受取人\n→ **被保険者の遺族**\n\n満期保険金受取人\n→ **法人**\n\nという契約です。\n\n---\n\n「先輩、会社が払っている保険料には、2つの顔があります。」\n\n### 満期保険金のための部分\n\n満期になれば会社が受け取る。\n\n→ **会社に価値が残る**\n\n→ **資産**\n\n---\n\n### 死亡保障のための部分\n\n死亡したら遺族が受け取る。\n\n→ **福利厚生的な保障**\n\n→ **損金**\n\nそこで一定の要件を満たす場合、\n\n> **保険料の1/2を資産計上、1/2を損金算入**\n\nします。\n\nこれが、\n\n# **ハーフタックスプラン**\n\nです。\n\n---\n\n# 「なんで半分なの？」\n\n「先輩、“満期と死亡の2つの顔”で考えてください。」\n\n養老保険料100万円\n\n↓\n\n📦 **50万円**\n→ 資産計上\n\n＋\n\n🧾 **50万円**\n→ 損金算入\n\nという形です。\n\n「もちろん税務上の要件がありますから、死亡＝遺族、満期＝法人なら無条件で何でもハーフタックス、とは考えないでくださいね。次で詳しくやります。」\n\n---\n\n# C【イメージ理解｜お金の帰り先を見る】\n\n「養老保険の問題を見たら、難しい税法を思い出す前に、**保険金の矢印**を書いてください。」\n\n### パターン①\n\n🏢法人が払う\n↓\n死亡 💰→🏢\n満期 💰→🏢\n\n「全部会社に戻りますね。」\n\n→ **資産**\n\n---\n\n### パターン②\n\n🏢法人が払う\n↓\n死亡 💰→👨‍👩‍👧遺族\n満期 💰→👨従業員\n\n「会社ではなく従業員側のためですね。」\n\n→ **給与**\n\n---\n\n### パターン③\n\n🏢法人が払う\n↓\n死亡 💰→👨‍👩‍👧遺族\n満期 💰→🏢法人\n\n「半分は従業員側、半分は会社側という性格ですね。」\n\n→ **1/2損金＋1/2資産**\n\n---\n\n# D【具体例｜年間保険料100万円】\n\n## ケース① 法人→法人\n\n会社が年間100万円の保険料を支払った。\n\n死亡保険金\n→ 法人\n\n満期保険金\n→ 法人\n\nなら、\n\n### 100万円 → 資産計上\n\nという基本形です。\n\n---\n\n## ケース② 従業員側が受取\n\n死亡\n→ 遺族\n\n満期\n→ 従業員本人\n\nなら、\n\n### 100万円 → 給与扱い\n\nが基本です。\n\n---\n\n## ケース③ ハーフタックス型\n\n死亡\n→ 遺族\n\n満期\n→ 法人\n\n年間保険料\n→ 100万円\n\nなら一定の要件のもと、\n\n### 50万円 → 資産計上\n\n### 50万円 → 損金算入\n\nとなります。\n\n「100万円払ったという事実は全部同じ。でも、**保険金の受取人が違うだけで経理処理が変わる**んですね。」\n\n---\n\n# 【3パターンを固定】\n\n|死亡|満期|覚え方|\n|-|-|-|\n|法人|法人|**全部資産**|\n|遺族|本人|**給与**|\n|遺族|法人|**半分資産・半分損金**|\n\n「先輩、養老保険の問題ではまずこの表を頭の中に出してください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n法人が契約者で、死亡保険金・満期保険金ともに法人が受け取る養老保険。\n\n保険料は？\n\n……\n\n### **原則、資産計上。**\n\n会社に将来の経済的価値が残っているからですね。\n\n---\n\n### Q2\n\n法人が保険料を払い、満期保険金を従業員、死亡保険金をその遺族が受け取る場合は？\n\n……\n\n### **原則、給与扱い。**\n\n---\n\n### Q3\n\n死亡保険金\n→ 遺族\n\n満期保険金\n→ 法人\n\nなら？\n\n……\n\n### **一定の要件のもと、1/2損金・1/2資産。**\n\n「はい。これが次の主役です。」\n\n---\n\n# 【30秒復習】\n\n① **死亡＝法人、満期＝法人**  \n→ **資産**\n\n② **死亡＝遺族、満期＝本人**  \n→ **給与**\n\n③ **死亡＝遺族、満期＝法人**  \n→ **1/2損金＋1/2資産**\n\n④ **判断するとき何を見る？**  \n→ **保険金受取人**\n\n⑤ **なぜ法人受取なら資産？**  \n→ 将来会社に経済的価値が戻るから\n\n⑥ **半分ずつの代表**  \n→ **ハーフタックスプラン**\n\n# 【一文で覚える】\n\n> **「法人契約の養老保険は受取人で処理を判断し、死亡・満期とも法人なら資産、従業員側なら給与、死亡は遺族・満期は法人なら一定の要件で1/2損金・1/2資産。」**\n\n「先輩、今回は**誰が受け取る？**だけ先に確認してください。」\n\n法人 → 法人  \n→ **資産**\n\n従業員側 → 従業員側  \n→ **給与**\n\n死亡 → 遺族・満期 → 法人  \n→ **半分ずつ**\n\n次は、この3つ目だけを掘り下げる **54「ハーフタックスプランの経理処理」** です。\n\n---", "chapter": 2}, {"n": 54, "title": "ハーフタックスプランの経理処理", "raw": "# 第2章 リスク管理 54\n\n## ハーフタックスプランの経理処理\n\n### A【要点｜「半分資産・半分損金」です】\n\n「はい、先輩。前回出てきた3つ目を、今回は単独で固めます。」\n\nハーフタックスプランとは、法人が養老保険に加入し、一定の要件を満たす場合に、\n\n> **支払保険料の1/2を資産計上し、残り1/2を損金算入する**\n\n経理処理です。\n\n典型的な契約形態は、\n\n**契約者**\n→ 法人\n\n**被保険者**\n→ 役員・従業員\n\n**満期保険金受取人**\n→ **法人**\n\n**死亡保険金受取人**\n→ **被保険者の遺族**\n\nです。\n\n「まずこれを図にすると――」\n\n### 生存・満期\n\n💰 → 🏢会社\n\n### 死亡\n\n💰 → 👨‍👩‍👧遺族\n\nだから、\n\n### 1/2 → 資産\n\n### 1/2 → 損金\n\nという考え方です。\n\n---\n\n# B【詳しい解説｜なぜ半分ずつ？】\n\n「先輩、養老保険には2つの顔がありましたね。」\n\n### ① 貯蓄の顔\n\n満期まで生存\n↓\n満期保険金\n↓\n\n### 法人が受け取る\n\n会社自身にお金が戻ってきます。\n\nだから、この部分には、\n\n### **会社の資産形成**\n\nという性格があります。\n\n↓\n\n### 1/2を資産計上\n\n---\n\n### ② 保障の顔\n\n被保険者が死亡\n↓\n死亡保険金\n↓\n\n### 遺族が受け取る\n\n会社ではなく、従業員側の保障に使われています。\n\n↓\n\n### 福利厚生的な費用\n\nとして、\n\n### 1/2を損金算入\n\nするわけです。\n\n---\n\n# 「じゃあ誰か1人だけ加入させても半分損金？」\n\n「先輩、ここ重要です。」\n\nハーフタックスの損金処理には、\n\n> **原則として役員・従業員を普遍的に加入させるなど、福利厚生目的としての要件**\n\nが重要になります。\n\nたとえば、\n\n「社長だけ特別に入れよう」\n\n「特定の役員だけ高額な保険を付けよう」\n\nという契約だと、\n\n### 福利厚生費ではなく給与扱い\n\nとなる可能性があります。\n\n「つまり、“死亡保険金の受取人を遺族にすれば自動的にハーフタックス！”ではありません。」\n\n---\n\n# 「普遍的加入って何？」\n\n「難しく考えなくて大丈夫です。」\n\nざっくり、\n\n> **特定の人だけをえこひいきせず、一定の合理的な基準に基づいて役員・従業員を広く対象にする**\n\nというイメージです。\n\n会社の福利厚生として、\n\n👨社員A  \n👩社員B  \n👨社員C  \n👩社員D\n\nに一定のルールで加入させる。\n\nだから、\n\n### 福利厚生費\n\nとして認められる部分が出てくるわけですね。\n\n---\n\n# 「実際の仕訳は？」\n\n「はい。年間保険料が100万円だったとしましょう。」\n\nハーフタックスなら、\n\n### 50万円\n\n→ 資産計上\n\n### 50万円\n\n→ 損金算入\n\nです。\n\n仕訳イメージは、\n\n> **保険料積立金　50万円 / 現金預金 100万円**  \n> **福利厚生費　　50万円 /**\n\nとなります。\n\n「先輩、借方に**資産＋費用**が半分ずつ出てくるわけですね。」\n\n---\n\n# ここからが大事｜満期になったら？\n\n「先輩、保険料を払ったときだけ覚えて終わると、経理の流れが見えません。」\n\nたとえば長年の保険料のうち、\n\n### 500万円\n\nを資産計上していたとします。\n\n満期になり、法人が、\n\n### 満期保険金1,000万円\n\nを受け取った。\n\n---\n\n会社の帳簿にはすでに、\n\n📦保険料積立金500万円\n\nがあります。\n\nだから、\n\n受取保険金1,000万円\n−\n資産計上額500万円\n\n＝\n\n### 500万円\n\nという差額が生じます。\n\nこの差額が、\n\n### **益金**\n\nになる方向です。\n\n「受け取った1,000万円全部がそのまま利益、ではないんですね。」\n\n---\n\n# 「死亡した場合は？」\n\n「ここがハーフタックスの特徴です。」\n\n死亡保険金受取人は、\n\n### **遺族**\n\nでした。\n\nつまり、死亡保険金そのものは、\n\n🏢法人ではなく、\n\n### 👨‍👩‍👧遺族\n\nへ支払われます。\n\n一方、法人の帳簿には、\n\n### 資産計上してきた保険料積立金\n\nが残っています。\n\n被保険者の死亡によって契約が終了すれば、その資産を帳簿から取り崩す必要があります。\n\n「つまり、“会社が死亡保険金を受け取る”契約と同じ処理ではないんですね。」\n\n---\n\n# C【イメージ理解｜1枚の100万円札を半分にする】\n\n「先輩、会社が100万円の保険料を持っています。」\n\n💴100万円\n\nこれを真ん中で、\n\n✂️\n\nと分けます。\n\n---\n\n### 左50万円\n\n📦会社の貯金箱へ\n\n満期になったら会社が受け取る部分。\n\n→ **資産**\n\n---\n\n### 右50万円\n\n👨‍👩‍👧従業員・遺族を守るため\n\n→ **福利厚生費**\n\n→ **損金**\n\n---\n\nだから、\n\n# HALF ＆ HALF\n\nなんです。\n\n「ハーフタックスという名前を見たら、まず**50：50**を出してください。」\n\n---\n\n# D【具体例｜会社が社員に養老保険】\n\n株式会社Aが一定の要件のもと、従業員を対象として養老保険に加入します。\n\n契約者\n→ 株式会社A\n\n被保険者\n→ 従業員\n\n死亡保険金受取人\n→ **従業員の遺族**\n\n満期保険金受取人\n→ **株式会社A**\n\n年間保険料\n→ 200万円\n\n---\n\n「さて先輩、どう処理します？」\n\n……\n\n半分は、\n\n200万円 × 1/2\n\n＝\n\n### 100万円\n\n→ **資産計上**\n\n残り、\n\n### 100万円\n\n→ **損金算入**\n\nです。\n\n---\n\n# 「満期が法人だから全部資産じゃないの？」\n\n「そこ、引っかかりやすいです。」\n\n確かに、\n\n満期\n→ 法人\n\nだけ見れば資産っぽい。\n\nでも、\n\n死亡\n→ 遺族\n\nという保障部分もあります。\n\nだから、\n\n### 資産100％\n\nではなく、\n\n### **資産50％＋損金50％**\n\nとなるわけです。\n\n---\n\n# 【普通の養老保険との比較】\n\n|死亡保険金|満期保険金|基本処理|\n|-|-|-|\n|法人|法人|**全額資産**|\n|遺族|本人|**給与**|\n|**遺族**|**法人**|**1/2資産＋1/2損金**|\n\n「この3段階、もうかなり見えてきましたね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\nハーフタックスプランの典型的な死亡保険金受取人は？\n\n……\n\n### **被保険者の遺族。**\n\n---\n\n### Q2\n\n満期保険金受取人は？\n\n……\n\n### **法人。**\n\n---\n\n### Q3\n\n年間保険料300万円なら、一定の要件を満たす場合の基本処理は？\n\n……\n\n### **150万円を資産計上**\n\n### **150万円を損金算入**\n\nです。\n\n「名前どおり半分ですよ。」\n\n---\n\n# 【30秒復習】\n\n① **対象の代表**  \n→ 養老保険\n\n② **契約者**  \n→ 法人\n\n③ **死亡保険金**  \n→ 遺族\n\n④ **満期保険金**  \n→ 法人\n\n⑤ **保険料の1/2**  \n→ **資産計上**\n\n⑥ **残り1/2**  \n→ **損金算入**\n\n# 【一文で覚える】\n\n> **「ハーフタックスプランは、法人契約の養老保険で死亡保険金を遺族、満期保険金を法人が受け取るなど一定の要件を満たす場合、保険料の1/2を資産計上し、1/2を損金算入する。」**\n\n「先輩、ここは図で覚えれば強いです。」\n\n### 死亡 → 👨‍👩‍👧遺族\n\n### 満期 → 🏢法人\n\nだから、\n\n### 📦 1/2 資産\n\n### 🧾 1/2 損金\n\nです。\n\n次は少し難易度が上がります。**55「定期保険および第三分野保険にかかわる保険料の取扱い」**です。\n\n---", "chapter": 2}, {"n": 55, "title": "定期保険・第三分野保険にかかわる保険料の取扱い", "raw": "# 第2章 リスク管理 55\n\n## 定期保険・第三分野保険にかかわる保険料の取扱い\n\n### A【要点｜「最高解約返戻率」を見る】\n\n「はい、先輩。ここは法人保険の中でも数字が多くて少し厄介です。でも、判断の軸は一つです。」\n\n法人が契約する定期保険や第三分野保険のうち、一定の契約では、\n\n> **最高解約返戻率が高いほど、保険料の一部を資産計上する**\n\nというルールがあります。\n\n「つまり、“保険料を払ったから全部損金”ではありません。」\n\n基本イメージは、\n\n**解約返戻金が少ない**\n→ 貯蓄性が低い\n→ 損金になりやすい\n\n**解約返戻金が大きい**\n→ 貯蓄性が高い\n→ 資産計上する部分が大きくなる\n\nです。\n\n---\n\n# B【詳しい解説｜そもそも第三分野って？】\n\n「先輩、第一・第二・第三って何？となりますよね。」\n\nざっくり、\n\n### 第一分野\n\n→ **生命保険**\n\n死亡・生存など。\n\n### 第二分野\n\n→ **損害保険**\n\n火災・自動車など。\n\n### 第三分野\n\n→ その中間的な分野\n\n代表的には、\n\n**医療保険\nがん保険\n介護保険**\n\nなどです。\n\n「今回の税務ルールは、法人が契約する一定の**定期保険・第三分野保険**が対象です。」\n\n---\n\n# なぜ資産計上するの？\n\n「前回までの考え方を使います。」\n\n会社が、\n\n年間保険料100万円\n\nを支払った。\n\nでも、その保険を途中で解約すると、\n\nかなり高い割合でお金が戻ってくる。\n\nたとえば、\n\n100万円払う\n↓\n一定時点で解約\n↓\n90万円相当が戻るような高い返戻率\n\nだったら、\n\n「100万円全部が今年消えた費用です」\n\nとするのは不自然ですよね。\n\nだから、\n\n### 一部を資産計上\n\nします。\n\n---\n\n# 重要｜最高解約返戻率\n\n「そこで登場するのが、」\n\n# **最高解約返戻率**\n\nです。\n\n簡単にいうと、\n\n> **保険期間中に解約返戻率が最も高くなるときの割合**\n\nです。\n\nそしてFPでは、まず次の区分を押さえます。\n\n---\n\n## ① 最高解約返戻率 50％以下\n\n「貯蓄性は比較的低いですね。」\n\n基本的に、\n\n### **保険料を期間の経過に応じて損金算入**\n\nします。\n\n試験ではまず、\n\n> **50％以下 → 資産計上ルールの対象外**\n\nというイメージで押さえましょう。\n\n---\n\n## ② 50％超～70％以下\n\n「ここから資産計上が出てきます。」\n\n原則として一定の資産計上期間について、\n\n### **支払保険料の40％を資産計上**\n\n残り、\n\n### **60％を損金算入**\n\nします。\n\n「50～70を見たら**40％資産**です。」\n\n---\n\n## ③ 70％超～85％以下\n\nさらに返戻率が高くなりました。\n\nこの場合、\n\n### **支払保険料の60％を資産計上**\n\n残り、\n\n### **40％を損金算入**\n\nします。\n\n「70～85なら**60％資産**。さっきと逆っぽくなるので注意ですよ。」\n\n---\n\n## ④ 85％超\n\n「ここからルールが一段変わります。」\n\n最高解約返戻率が、\n\n### **85％超**\n\nの場合、\n\n一定の資産計上期間について、原則、\n\n> **支払保険料 × 最高解約返戻率 × 70％**\n\nを資産計上します。\n\nそして、一定の場合には後半で、\n\n### **90％**\n\nを使う期間があります。\n\n「ここはまず、85％超になったら固定の40％・60％ではなく、**最高解約返戻率そのものを使って計算する**と理解してください。」\n\n---\n\n# まず表で整理します\n\n|最高解約返戻率|資産計上の基本イメージ|\n|-|-:|\n|**50％以下**|原則、通常の損金処理|\n|**50％超～70％以下**|**保険料の40％**|\n|**70％超～85％以下**|**保険料の60％**|\n|**85％超**|**最高解約返戻率を使って計算**|\n\n「先輩、最初から85％超の細かい期間計算まで全部暗記しようとしなくて大丈夫です。まず境界線を固定します。」\n\n# **50 → 70 → 85**\n\nです。\n\n---\n\n# 具体的に計算してみる\n\n## 最高解約返戻率60％\n\n年間保険料\n→ 100万円\n\n60％は、\n\n### 50％超～70％以下\n\nですね。\n\nだから、\n\n資産\n→ 100万円 × 40％\n→ **40万円**\n\n損金\n→ **60万円**\n\nです。\n\n---\n\n## 最高解約返戻率80％\n\n年間保険料\n→ 100万円\n\n80％は、\n\n### 70％超～85％以下\n\nだから、\n\n資産\n→ 100万円 × 60％\n→ **60万円**\n\n損金\n→ **40万円**\n\nです。\n\n「返戻率が高くなるほど、資産として残す部分が増えましたね。」\n\n---\n\n# 「ずっと資産のままなの？」\n\n「いいえ。ここが大事です。」\n\n一定期間は、\n\n保険料の一部\n→ **資産計上**\n\nします。\n\nでも、その資産を契約終了まで永遠に置いておくわけではありません。\n\n一定の期間を過ぎると、\n\n### **資産計上していた金額を取り崩して損金算入**\n\nしていきます。\n\n---\n\n「つまり流れは、」\n\n### 前半\n\n💰保険料\n↓\n一部を📦資産に置いておく\n\n↓\n\n### 後半\n\n📦資産\n↓\n少しずつ取り崩す\n↓\n🧾損金\n\nという感じです。\n\n---\n\n# C【イメージ理解｜返ってくるお金を倉庫に置く】\n\n「先輩、会社が100万円を保険会社に払います。」\n\nでも税務署が、\n\n👮「この保険、あとでかなり返ってきますよね？」\n\nと言っていると思ってください。\n\n---\n\n### 返戻率30％\n\n👮「そんなに戻らないですね。」\n\n→ 基本的に通常の損金処理。\n\n---\n\n### 返戻率60％\n\n👮「結構戻りますね。」\n\n→ **40％を倉庫📦へ**\n\n---\n\n### 返戻率80％\n\n👮「かなり戻りますね。」\n\n→ **60％を倉庫📦へ**\n\n---\n\n### 返戻率90％\n\n👮「ほとんど戻る可能性がありますね。」\n\n→ 「固定割合じゃなくて、返戻率を使ってもっと厳密に計算します」\n\n「これが資産計上の感覚です。」\n\n---\n\n# D【具体例｜会社が年間200万円払う】\n\n「株式会社Aが一定の定期保険に加入し、年間保険料200万円を払ったとします。」\n\n## ケース① 最高解約返戻率65％\n\n50％超～70％以下。\n\n資産計上：\n\n200万円 × 40％\n\n＝\n\n### **80万円**\n\n損金：\n\n200万円 − 80万円\n\n＝\n\n### **120万円**\n\n---\n\n## ケース② 最高解約返戻率80％\n\n70％超～85％以下。\n\n資産計上：\n\n200万円 × 60％\n\n＝\n\n### **120万円**\n\n損金：\n\n200万円 − 120万円\n\n＝\n\n### **80万円**\n\n「65％と80％で処理が逆転しましたね。」\n\n---\n\n# 【試験でまず見る順番】\n\n「問題が出たら、この順番です。」\n\n**① 法人契約の定期・第三分野？**\n↓\n**② 最高解約返戻率を見る**\n↓\n**③ 50・70・85のどこ？**\n↓\n**④ 資産計上割合を決める**\n↓\n**⑤ 残りを損金へ**\n\n---\n\n# 【理解確認】\n\n### Q1\n\n最高解約返戻率65％なら、一定の資産計上期間における資産計上割合は？\n\n……\n\n### **40％。**\n\n---\n\n### Q2\n\n最高解約返戻率80％なら？\n\n……\n\n### **60％。**\n\n---\n\n### Q3\n\n最高解約返戻率が高くなるほど、基本的に資産計上する割合はどうなる？\n\n……\n\n### **大きくなる方向です。**\n\n「将来戻ってくる価値が大きいからですね。」\n\n---\n\n# 【30秒復習】\n\n① **判断の中心**  \n→ 最高解約返戻率\n\n② **境界線**  \n→ **50・70・85**\n\n③ **50％以下**  \n→ 原則通常の損金処理\n\n④ **50％超～70％以下**  \n→ **40％資産**\n\n⑤ **70％超～85％以下**  \n→ **60％資産**\n\n⑥ **85％超**  \n→ **最高解約返戻率を使って資産計上額を計算**\n\n# 【一文で覚える】\n\n> **「法人契約の一定の定期保険・第三分野保険では最高解約返戻率を基準にし、50％超70％以下なら40％、70％超85％以下なら60％を一定期間資産計上し、85％超では最高解約返戻率を用いて計算する。」**\n\n「はい、先輩。まずは数字を一本にします。」\n\n### **50 → 70 → 85**\n\n↓\n\n### **40％ → 60％ → 個別計算**\n\nそして根っこは、\n\n> **戻ってくる価値が大きいほど、全部を今の経費にはしない。**\n\nこれです。\n\n次は **56「長期平準定期保険の経理処理」** です。\n\n---", "chapter": 2}, {"n": 56, "title": "長期平準定期保険の経理処理", "raw": "# 第2章 リスク管理 56\n\n## 長期平準定期保険の経理処理\n\n### A【要点｜長期の定期保険＋高い解約返戻金】\n\n「はい、先輩。今回は**長期平準定期保険**です。まず名前を分解しましょう。」\n\n**長期**\n→ 保険期間が長い\n\n**平準**\n→ 保険金額が基本的に一定\n\n**定期保険**\n→ 一定期間の死亡保障\n\nつまり、\n\n> **長い保険期間にわたって、一定額の死亡保障を確保する定期保険**\n\nです。\n\nそして法人契約では、\n\n### 解約返戻金が高くなる時期がある\n\n商品もあるため、税務上、\n\n> **保険料を全部その年の損金にせず、一部を資産計上する場合がある**\n\nというのがポイントです。\n\n---\n\n# B【詳しい解説｜普通の定期保険と何が違う？】\n\n「先輩、普通の定期保険は覚えていますよね。」\n\nたとえば、\n\n30歳\n↓\n10年間保障\n↓\n40歳で終了\n\nというように一定期間を保障します。\n\n一方、長期平準定期保険は、\n\n40歳\n↓\n50歳\n↓\n60歳\n↓\n70歳\n↓\n80歳……\n\nというように、\n\n### **かなり長い保険期間**\n\nを設定するタイプです。\n\n---\n\n# 「終身保険じゃないの？」\n\n「そこです。名前に“長期”と付くので勘違いしやすいですが――」\n\n### **定期保険です。**\n\nつまり、\n\n### 終身保障ではありません。\n\n契約で決められた保険期間が終了すれば、保障も終了します。\n\n> **長期 ≠ 終身**\n\nですよ。\n\n---\n\n# なぜ法人が使うの？\n\n「たとえば会社の社長に万一があったらどうなるか。51でやりましたね。」\n\n社長死亡\n↓\n売上への影響\n↓\n借入金返済\n↓\n運転資金\n↓\n死亡退職金\n\nなどが必要になる。\n\nだから、\n\n### **事業保障**\n\nとして長期間、大きな死亡保障を準備したい。\n\nそこで長期平準定期保険が使われることがあります。\n\n---\n\n# もう一つ｜解約返戻金\n\n「そして法人契約で重要なのがこちら。」\n\n長期平準定期保険の中には、契約から一定期間が経過すると、\n\n### 解約返戻率が高くなる\n\n商品があります。\n\nたとえばイメージとして、\n\n契約直後\n→ 返戻率低い\n\n↓\n\n年数経過\n\n↓\n\n📈解約返戻率上昇\n\n↓\n\nピーク\n\n↓\n\n📉その後低下\n\nという形です。\n\n---\n\n「え？じゃあピークで解約して退職金に使えばいいの？」\n\n「そういう資金設計に利用されることはあります。ただし、**解約返戻率や税務だけで得になると考えてはいけません。**」\n\n支払った保険料総額、受取額、保障の必要性、税務処理などを全部見る必要があります。\n\n---\n\n# 経理処理はどうする？\n\n「ここで前回55とつながります。」\n\n現在の法人契約の一定の定期保険・第三分野保険では、\n\n### **最高解約返戻率**\n\nを基準に資産計上割合を判断します。\n\nつまり、\n\n「長期平準定期保険だから一律○％」\n\nと覚えるのではなく、\n\n> **現在は最高解約返戻率に応じたルールを適用する**\n\nと理解するのが重要です。\n\n---\n\n## 最高解約返戻率50％以下\n\n基本的には、\n\n### 通常の損金処理\n\n---\n\n## 50％超～70％以下\n\n一定期間、\n\n### **40％資産計上**\n\n### **60％損金算入**\n\n---\n\n## 70％超～85％以下\n\n一定期間、\n\n### **60％資産計上**\n\n### **40％損金算入**\n\n---\n\n## 85％超\n\n「ここは固定割合ではありませんでしたね。」\n\n一定の期間について、\n\n### **最高解約返戻率を使った計算**\n\nによって資産計上します。\n\n「つまり長期平準定期保険でも、前回の**50・70・85**が生きています。」\n\n---\n\n# 「昔の教材と数字が違うことがあるけど？」\n\n「はい。ここはかなり大事です。」\n\n長期平準定期保険の法人税務は過去に取扱いが変更されています。\n\nそのため古い教材では、\n\n> **前半6割期間の1/2を資産計上する**\n\nといった旧ルールが載っていることがあります。\n\n現在の学習では、契約時期などを確認したうえで、\n\n### **現行の最高解約返戻率を基準とするルール**\n\nと区別してください。\n\n「“長期平準＝絶対1/2資産”とだけ覚えるのは危険、ということです。」\n\n---\n\n# 資産計上したものはどうなる？\n\n「これも前回と同じですよ。」\n\n前半など\n↓\n保険料の一部を\n📦 **資産計上**\n\nその後、所定の期間になると、\n\n📦資産\n↓\n取り崩し\n↓\n\n### **損金算入**\n\nしていきます。\n\n---\n\n「先輩、つまり――」\n\n### 資産計上＝永久に損金にならない\n\nではありません。\n\n> **損金になる時期を後ろへずらしている**\n\nという側面があります。\n\nここ、税務を理解するうえでかなり重要です。\n\n---\n\n# C【イメージ理解｜会社の非常用タンク】\n\n「長期平準定期保険を、大きな非常用タンクだと思ってください。」\n\n🏢会社\n↓\n毎年保険料を投入\n↓\n🛢️\n\nまず目的は、\n\n### 社長死亡時の大きな保障\n\nです。\n\nでも途中で、\n\n### 解約返戻金\n\nという形で価値が積み上がる場合があります。\n\n税務署から見ると、\n\n👮「先輩の会社、このタンクに結構お金が残っていますよね？」\n\nとなる。\n\nだから、\n\n### 全部今年の費用！\n\nとはせず、\n\n📦一部資産\n\nとして計上させる。\n\n「これが前回から続いている考え方です。」\n\n---\n\n# D【具体例｜最高解約返戻率80％】\n\n株式会社Aが、社長を被保険者として一定の長期の定期保険に加入。\n\n年間保険料\n\n### 200万円\n\n最高解約返戻率\n\n### 80％\n\nだったとします。\n\n「先輩、まずどの区分？」\n\n……\n\n### 70％超～85％以下。\n\nでは資産計上割合は？\n\n……\n\n### **60％。**\n\nしたがって一定の資産計上期間では、\n\n200万円 × 60％\n\n＝\n\n### **120万円を資産計上**\n\n残り、\n\n200万円 × 40％\n\n＝\n\n### **80万円を損金算入**\n\nという基本的な処理になります。\n\n「“長期平準”という名前から割合を決めるのではなく、**最高解約返戻率80％だから60％資産**と判断しているんですよ。」\n\n---\n\n# 【終身保険との違いも確認】\n\n||長期平準定期保険|終身保険|\n|-|-|-|\n|保険種類|**定期保険**|終身保険|\n|保障期間|長いが有限|**一生涯**|\n|死亡保障|基本一定|基本一定|\n|満期|契約上の保険期間終了あり|基本的に満期なし|\n|法人税務|現行ルールでは最高解約返戻率等が重要|契約形態等による|\n\n「長いから終身、ではありません。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n長期平準定期保険は、終身保険？\n\n……\n\n### **違います。定期保険です。**\n\n保険期間が長いだけで、終身保障ではありません。\n\n---\n\n### Q2\n\n現在の一定の法人契約で経理処理を考えるとき、重要な指標は？\n\n……\n\n### **最高解約返戻率。**\n\n---\n\n### Q3\n\n最高解約返戻率80％、年間保険料100万円なら、一定の資産計上期間の基本的な資産計上額は？\n\n……\n\n70％超～85％以下なので、\n\n100万円 × 60％\n\n＝\n\n### **60万円。**\n\n残り40万円が損金です。\n\n---\n\n# 【30秒復習】\n\n① **長期平準定期保険は？**  \n→ 長期間の**定期保険**\n\n② **終身保険？**  \n→ **違う**\n\n③ **法人での主な利用目的**  \n→ 事業保障など\n\n④ **途中で生じることがある価値**  \n→ 解約返戻金\n\n⑤ **現行税務の重要指標**  \n→ **最高解約返戻率**\n\n⑥ **昔の一律的な旧ルールは？**  \n→ **現行ルールと混同しない**\n\n# 【一文で覚える】\n\n> **「長期平準定期保険は、長期間一定の死亡保障を確保する定期保険で、法人契約の現行税務では一律の割合ではなく、最高解約返戻率などに応じて資産計上額を判断する。」**\n\n「先輩、ここは**長期＝終身ではない**、そして**今は最高解約返戻率を見る**。この2本を軸にしてください。」\n\n次は、保険料を払う側ではなく、いよいよ**保険金を受け取ったときの会社の処理**です。\n\n**57「保険金等の経理処理」** に進みます。\n\n---", "chapter": 2}, {"n": 57, "title": "保険金等の経理処理", "raw": "# 第2章 リスク管理 57\n\n## 保険金等の経理処理\n\n### A【要点｜受取額－帳簿に残っている資産＝利益】\n\n「はい、先輩。今までは**保険料を払ったとき**の処理でした。今回は逆です。」\n\n会社が死亡保険金や満期保険金などを受け取ったときは、\n\n> **受け取った保険金と、それまで資産計上していた保険料との差額**\n\nを考えるのが基本です。\n\nたとえば、\n\n死亡保険金\n→ **1,000万円**\n\n保険料積立金など\n→ **400万円**\n\nなら、\n\n**1,000万円 − 400万円 = 600万円**\n\nこの600万円が、\n\n### **雑収入などとして利益になる**\n\nイメージです。\n\n「先輩、“1,000万円受け取った＝1,000万円全部が利益”ではありませんよ。」\n\n---\n\n# B【詳しい解説①｜なぜ差額なの？】\n\n「これ、簿記とつなげると簡単です。」\n\n会社が過去に保険料を払って、\n\n### 400万円を資産計上\n\nしていたとします。\n\n帳簿上は、\n\n🏢会社\n→「保険契約という400万円の資産を持っています」\n\nという状態です。\n\nその後、社長が死亡。\n\n保険会社から、\n\n### 1,000万円\n\n受け取りました。\n\nすると、\n\n今まで持っていた保険の資産400万円\n↓\n契約終了\n↓\nなくなる\n\n代わりに、\n\n💰1,000万円\n\nが入ってくる。\n\nだから、\n\n### 1,000万円 − 400万円\n\n＝ **600万円**\n\nが新たに増えた利益になるわけです。\n\n---\n\n# ② 仕訳で見ると？\n\n「簿記をやっている先輩なら、ここは仕訳で見た方が速いです。」\n\n死亡保険金1,000万円を普通預金で受け取り、\n\n帳簿上の保険料積立金が400万円だった場合、\n\nイメージとして、\n\n**普通預金　1,000万円 ／ 保険料積立金　400万円**  \n　　　　　　　　　　**雑収入　　　600万円**\n\nです。\n\n「左側に現金1,000万円が入って、右側で古い資産400万円を消し、差額600万円を収益にするんですね。」\n\n---\n\n# 「じゃあ資産計上していなかったら？」\n\n「あ、そこ重要です。」\n\n仮に、それまで支払保険料が適切に損金処理されていて、\n\n### 帳簿上の保険資産が0円\n\nだったとします。\n\nその状態で、\n\n死亡保険金1,000万円\n\nを法人が受け取れば、\n\n基本イメージは、\n\n### **1,000万円が収益**\n\nです。\n\n「差し引く帳簿上の資産がないからですね。」\n\n---\n\n# ③ 満期保険金でも考え方は同じ\n\n「死亡保険金だけではありません。」\n\nたとえば養老保険。\n\n法人が、\n\n### 満期保険金1,000万円\n\nを受け取った。\n\nそれまで、\n\n### 保険料積立金800万円\n\nを資産計上していた。\n\nすると、\n\n1,000万円\n−\n800万円\n\n＝\n\n### **200万円**\n\nが利益になるイメージです。\n\n---\n\n# 「もし受取額の方が少なかったら？」\n\n「はい。逆もあります。」\n\nたとえば、\n\n保険料積立金\n→ 800万円\n\n受取額\n→ 700万円\n\nなら、\n\n700万円 − 800万円\n＝ **▲100万円**\n\nですよね。\n\nつまり、\n\n### **100万円の損失**\n\nが生じる方向になります。\n\n「受取額と帳簿価額を比べる。これだけです。」\n\n---\n\n# ④ 解約返戻金も同じ発想\n\n会社が保険を途中解約して、\n\n### 解約返戻金700万円\n\nを受け取った。\n\n帳簿に、\n\n### 保険料積立金500万円\n\nが残っていた。\n\nなら、\n\n700万円 − 500万円\n\n＝\n\n### **200万円の利益**\n\nという考え方です。\n\n---\n\n「逆に、」\n\n解約返戻金\n→ 400万円\n\n帳簿価額\n→ 500万円\n\nなら、\n\n### **100万円の損失**\n\nです。\n\n---\n\n# 「保険金を退職金に使ったら相殺できるの？」\n\n「先輩、そこは分けて考えましょう。」\n\n会社が、\n\n① 保険会社から死亡保険金を受け取る\n\nことと、\n\n② 遺族に死亡退職金を支払う\n\nことは、\n\n### **別々の取引**\n\nです。\n\nたとえば、\n\n死亡保険金\n→ 5,000万円受取\n\n死亡退職金\n→ 3,000万円支給\n\nだったとしても、\n\n「保険会社から2,000万円だけ受け取った」\n\nことにはなりません。\n\n---\n\nまず、\n\n### 保険金の受取処理\n\nをする。\n\nその後、\n\n### 死亡退職金の支給処理\n\nをする。\n\n「お金の流れを一個ずつ追いかけるんですよ。」\n\n---\n\n# C【イメージ理解｜保険という箱を現金に交換】\n\n「先輩、会社の倉庫にこんな箱があると思ってください。」\n\n📦  \n**保険料積立金400万円**\n\nそこへ保険事故が発生。\n\n保険会社が、\n\n💰1,000万円\n\nを持ってきます。\n\nすると、\n\n📦400万円の箱\n→ 消える\n\n代わりに、\n\n💰1,000万円\n→ 入ってくる。\n\n差額は？\n\n……\n\n### ＋600万円\n\nですよね。\n\nだから、\n\n### **600万円が利益**\n\nです。\n\n「保険金の額だけを見るんじゃなくて、**帳簿に残っている箱を消す**。これを忘れないでください。」\n\n---\n\n# D【具体例｜社長死亡で5,000万円】\n\n株式会社Aが社長を被保険者とする生命保険に加入していました。\n\n社長死亡時、\n\n死亡保険金\n→ **5,000万円**\n\n会社が資産計上していた保険料積立金\n→ **2,000万円**\n\nとします。\n\n会社は、\n\n### 5,000万円\n\nを受け取ります。\n\nでも利益は5,000万円全部ではありません。\n\n5,000万円\n−\n2,000万円\n\n＝\n\n### **3,000万円**\n\nです。\n\n仕訳イメージは、\n\n**現金預金　5,000万円**  \n　／ **保険料積立金　2,000万円**  \n　／ **雑収入　　　　3,000万円**\n\nとなります。\n\n---\n\n# 「前回までの話とつながった？」\n\n「ここ、かなり重要なので一本にします。」\n\n### 保険料支払時\n\n💸会社からお金が出る\n\n↓\n\n一部を\n\n📦**資産計上**\n\n---\n\n### 保険金受取時\n\n💰保険金が入る\n\n↓\n\n📦今までの資産を消す\n\n↓\n\n### 差額を利益・損失として処理\n\n「だから前回まで資産計上を勉強していたんです。受取時の処理につながるんですね。」\n\n---\n\n# 【超重要公式】\n\n> ## **受取保険金等 − 保険料積立金などの帳簿価額 ＝ 利益または損失**\n\nプラス\n→ **利益**\n\nマイナス\n→ **損失**\n\nです。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n死亡保険金1,000万円、保険料積立金300万円。\n\n利益はいくら？\n\n……\n\n### **700万円。**\n\n1,000 − 300\n＝ 700万円です。\n\n---\n\n### Q2\n\n解約返戻金600万円、保険料積立金800万円。\n\nどうなる？\n\n……\n\n600 − 800\n＝ ▲200万円\n\n### **200万円の損失**\n\nです。\n\n---\n\n### Q3\n\n死亡保険金を受け取って、そのお金から死亡退職金を支払った。\n\n保険金受取と退職金支給は同じ取引として処理する？\n\n……\n\n### **いいえ。**\n\n**保険金の受取**\nと\n**死亡退職金の支給**\n\nは別々に処理します。\n\n---\n\n# 【30秒復習】\n\n① **保険金を受け取ったら？**  \n→ 帳簿上の保険資産と比較\n\n② **基本公式**  \n→ **受取額 − 帳簿価額**\n\n③ **プラスなら？**  \n→ 利益\n\n④ **マイナスなら？**  \n→ 損失\n\n⑤ **保険料積立金は？**  \n→ 保険金受取時などに取り崩す\n\n⑥ **死亡退職金の支給は？**  \n→ 保険金受取とは**別取引**\n\n# 【一文で覚える】\n\n> **「法人が保険金・解約返戻金などを受け取ったときは、受取額から保険料積立金などの帳簿価額を差し引き、その差額を利益または損失として処理する。」**\n\n「はい、先輩。52から全部一本につながりましたよ。」\n\n**保険料を払う**\n→ 損金 or 資産\n\n**資産にしたもの**\n→ 帳簿に残る\n\n**保険金を受け取る**\n→ 資産を取り崩す\n\n**受取額との差**\n→ 利益 or 損失\n\nこの流れで理解してください。\n\n次は **58「役員退職時の名義変更」** です。\n\n---", "chapter": 2}, {"n": 58, "title": "役員退職時の名義変更", "raw": "# 第2章 リスク管理 58\n\n## 役員退職時の名義変更\n\n### A【要点｜会社の保険を退職金として役員へ渡す】\n\n「はい、先輩。今回はちょっと特殊です。退職金って現金だけだと思っていませんか？」\n\n……\n\n実は、法人が契約している生命保険について、\n\n> **役員の退職時に、契約者名義を法人からその役員本人へ変更して、退職金の一部として渡す**\n\nことがあります。\n\nイメージは、\n\n🏢会社が保険契約を持っている  \n↓  \n👨役員が退職  \n↓  \n保険契約そのものを役員へ移す  \n↓  \n🎁 **現物で退職金を支給**\n\nです。\n\n「つまり、現金を渡す代わりに**生命保険契約という財産を渡す**わけですね。」\n\n---\n\n# B【詳しい解説①｜そもそも「名義変更」って？】\n\nたとえば会社が、\n\n**契約者**\n→ 株式会社A\n\n**被保険者**\n→ 山田社長\n\nという生命保険に入っているとします。\n\n山田社長が退職するとき、\n\n契約者を、\n\n### 株式会社A → 山田さん個人\n\nへ変更する。\n\nすると、それまで会社が持っていた保険契約を、\n\n### 山田さん本人が持つ\n\nことになります。\n\n「会社の資産を個人へ渡した、と考えるんですね。」\n\n---\n\n# ② なぜそんなことをするの？\n\n「先輩、現金の退職金なら簡単ですよね。」\n\n会社\n↓\n💰2,000万円\n↓\n退職役員\n\nでも会社が保有する生命保険に一定の価値があるなら、\n\n会社\n↓\n📄生命保険契約\n↓\n退職役員\n\nという形で、\n\n### **退職金の一部として現物支給**\n\nする方法も考えられます。\n\n退職した役員は名義変更後、\n\n保険を継続したり、\n将来解約したり、\n\n契約内容に応じた選択ができます。\n\n---\n\n# ③ 会社側ではどう考える？\n\n「ここで前回57がそのまま使えます。」\n\n会社の帳簿に、\n\n### 保険料積立金600万円\n\nが計上されていたとします。\n\nそして退職時点で、その保険契約を、\n\n### 800万円の価値\n\nとして役員へ移したとします。\n\n会社から見ると、\n\n📦800万円相当の財産\n\nを退職金として渡したことになります。\n\n一方、\n\n帳簿上の資産\n→ 600万円\n\nだった。\n\nすると、\n\n800万円 − 600万円\n\n＝\n\n### **200万円の差額**\n\nが生じます。\n\n「つまり、名義だけ書き換えて終わりではなく、**会社が持っていた財産を役員へ移した取引**として考えるんですよ。」\n\n---\n\n# 「その保険はいくらとして評価するの？」\n\n「はい、ここが今回かなり重要です。」\n\n生命保険契約の名義変更時の評価は、契約内容や時期などに応じた税務上の評価ルールで判断する必要があります。\n\nしたがって、\n\n> **いつでも単純に『解約返戻金＝保険契約の評価額』と決めつけてはいけません。**\n\n特に法人から役員への名義変更については、契約の種類や最高解約返戻率などによって取扱いが問題になります。\n\n「FPではまず、**名義変更＝会社の資産を個人へ移転するので、適正な評価が必要**と理解してください。」\n\n---\n\n# ④ 役員側ではどうなる？\n\n「会社からタダで財産をもらったんだから、何も税金がない……とはなりません。」\n\n退職に伴って生命保険契約を受け取るなら、\n\n### **退職金の現物支給**\n\nとして扱われることがあります。\n\nつまり、\n\n現金で、\n\n💰退職金1,000万円\n\nを受け取る代わりに、\n\n📄1,000万円相当の保険契約\n\nを受け取るイメージです。\n\n---\n\n# 「じゃあ、会社は好きなだけ退職金にできる？」\n\n「ちょっと待ってください。そこは違います。」\n\n役員退職金については、\n\n### **不相当に高額な部分**\n\nまで自由に損金にできるわけではありません。\n\n役員の在任期間や功績、会社規模、類似法人の支給状況などを踏まえ、適正額かどうかが問題になります。\n\n「“保険を使えば何でも経費にできる”という話ではないんですよ。」\n\n---\n\n# ⑤ なぜこの方法が使われるの？\n\n「流れで考えてみましょう。」\n\n会社が社長を被保険者として生命保険を保有\n↓\n社長が退職\n↓\n事業保障としての必要性が小さくなる\n↓\nでも保険契約には価値がある\n↓\n解約して現金化する方法もある\n↓\nあるいは\n↓\n\n### 保険契約自体を退職役員へ移す\n\nという選択肢があるわけです。\n\n---\n\n# C【イメージ理解｜会社名義の車を渡す】\n\n「生命保険だと分かりにくければ、会社の車を想像してください。」\n\n🏢会社が車を所有\n↓\n社長が退職\n↓\n🚗「この車を退職金の一部として渡します」\n↓\n車の所有者を\n会社 → 元社長\nへ変更\n\n「これなら、単なる“名前変更”じゃないと分かりますよね？」\n\n会社の財産が、\n\n### 会社 → 個人\n\nへ移っています。\n\n生命保険も同じように、\n\n📄法人所有の保険契約\n↓\n👨退職役員\n\nへ移転する。\n\nだから、\n\n### **財産価値の評価**\n\nが必要になるんです。\n\n---\n\n# D【具体例｜社長の退職】\n\n株式会社Aの山田社長が退職します。\n\n会社は山田社長を被保険者とする生命保険を保有。\n\n帳簿上の保険資産\n→ **700万円**\n\n退職時に税務上適切に評価した保険契約の価額\n→ **1,000万円**\n\nだったとします。\n\n会社は、\n\n### 保険契約を山田さんへ移転\n\nします。\n\nすると、\n\n山田さん側では、\n\n### 1,000万円相当の退職金を現物で受け取った\n\nというイメージ。\n\n一方、会社では、\n\n保険契約1,000万円相当を渡す\n↓\n帳簿にあった700万円を消す\n↓\n差額300万円\n\nという処理も考える必要があります。\n\n「つまり、**会社側と役員側の両方を見る**んですね。」\n\n---\n\n# 【ここまでの法人保険を一本化】\n\n「先輩、52からかなり長かったので整理します。」\n\n### ① 保険料を払う\n\n→ 損金・資産などに分ける\n\n↓\n\n### ② 保険契約を続ける\n\n→ 資産計上部分が帳簿に残る\n\n↓\n\n### ③ 保険金・解約返戻金を受け取る\n\n→ 帳簿価額との差額を処理\n\nまたは、\n\n### ④ 退職時に保険そのものを役員へ渡す\n\n→ **名義変更＋現物退職金**\n\n「これで法人保険の一連の流れが見えます。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n法人契約の生命保険を退職した役員本人へ名義変更することは、単なる名前の書き換え？\n\n……\n\n### **違います。**\n\n会社が持っていた財産を役員個人へ移転する取引として考えます。\n\n---\n\n### Q2\n\n退職に伴って保険契約を役員へ渡す場合、何として扱われることがある？\n\n……\n\n### **退職金の現物支給。**\n\n---\n\n### Q3\n\n役員へ名義変更するとき、いつでも単純に「解約返戻金＝評価額」と考えてよい？\n\n……\n\n### **いいえ。**\n\n契約内容等に応じた税務上の評価ルールを確認する必要があります。\n\n---\n\n# 【30秒復習】\n\n① **誰から誰へ？**  \n→ 法人 → 退職役員\n\n② **何を渡す？**  \n→ 生命保険契約\n\n③ **性質は？**  \n→ **退職金の現物支給**\n\n④ **会社側では？**  \n→ 保険契約という資産がなくなる\n\n⑤ **重要なのは？**  \n→ **名義変更時の適正な評価額**\n\n⑥ **退職金はいくらでも損金？**  \n→ **違う。不相当に高額な部分には注意**\n\n# 【一文で覚える】\n\n> **「役員退職時の名義変更は、法人所有の生命保険契約を退職役員へ移転し、保険契約の価額を基礎として退職金を現物支給する方法である。」**\n\n「はい、先輩。これで生命保険分野の法人経理まで来ました。」\n\nここからテーマが変わります。\n\n次は **59「損害保険」**。  \n生命保険から、火災・自動車・事故などの**実際に生じた損害を補う保険**へ移ります。\n\n---", "chapter": 2}, {"n": 59, "title": "損害保険", "raw": "# 第2章 リスク管理 59\n\n## 損害保険\n\n### A【要点｜「事故で生じた損害」を補う保険】\n\n「はい、先輩。ここから**損害保険**です。生命保険との違いを最初に一本通しておきましょう。」\n\n損害保険とは、基本的に、\n\n> **偶然の事故などによって生じた損害を補償する保険**\n\nです。\n\n代表例は、\n\n**火災保険**\n→ 火事などによる建物・家財の損害\n\n**自動車保険**\n→ 交通事故による損害\n\n**傷害保険**\n→ 急激・偶然・外来の事故によるケガ\n\nなどです。\n\n「生命保険では“人の生死”が大きなテーマでした。損害保険では、**事故によってどれだけ損害が発生したか**を見る場面が増えてきます。」\n\n---\n\n# B【詳しい解説①｜生命保険と何が違う？】\n\n「まず比べましょう。」\n\n### 生命保険\n\nたとえば、\n\n死亡保険金\n→ **3,000万円**\n\nという契約なら、所定の死亡事由が発生した場合、\n\n### 契約で決めた3,000万円\n\nが支払われます。\n\n---\n\n一方、損害保険では、\n\n家に火災が発生\n↓\n建物に500万円の損害\n\nという場合、\n\n### **実際に発生した損害**\n\nが重要になります。\n\n「つまり、“事故に遭ったから契約金額を必ず丸ごともらえる”とは限らないんですね。」\n\n---\n\n# ② 「損害を受ける前より得する」は基本的にダメ\n\n「ここ、損害保険の根っこですよ。」\n\n先輩の家財に、\n\n### 100万円の損害\n\nが発生したとします。\n\nそれなのに保険で、\n\n### 500万円\n\nもらえたら？\n\n……\n\n事故前より400万円得してしまいます。\n\nすると、\n\n> 「事故が起きた方が儲かる」\n\nというおかしな状態になりますよね。\n\nだから損害保険には、\n\n### **損害を補う**\n\nという基本的な考え方があります。\n\n「この考え方が、次に出てくる**給付・反対給付均等の原則**や、その次の**利得禁止の原則**につながっていきます。」\n\n---\n\n# ③ 損害保険にはどんな種類がある？\n\n「これから詳しくやるので、今日は全体地図だけ作ります。」\n\n## 火災保険\n\n🔥火災  \n🌪️風災  \n🌊水災  \nなど、契約で定めた事故による建物・家財などの損害を補償します。\n\n「ただし、地震は注意ですよ。」\n\n### 地震・噴火・津波による損害\n\nは、通常の火災保険だけでは原則として補償されず、\n\n### **地震保険**\n\nを組み合わせて備えます。\n\n---\n\n# ④ 自動車保険\n\n「これはさらに分けます。」\n\n### 自賠責保険\n\n→ 法律で加入が義務づけられている強制保険  \n→ 基本的に**対人賠償**が対象\n\nそれだけでは不足する部分などを、\n\n### 任意の自動車保険\n\nで補います。\n\nこの後、\n\n**対人賠償\n対物賠償\n人身傷害\n搭乗者傷害\n無保険車傷害\n車両保険**\n\nと細かく分けて勉強します。\n\n---\n\n# ⑤ 傷害保険\n\n「名前だけ見ると医療保険と似ていますが、判断ポイントがあります。」\n\n傷害保険で重要なのは、\n\n> **急激・偶然・外来**\n\nです。\n\nたとえば、\n\n階段で突然転んで骨折した。\n\n→ 急激  \n→ 偶然  \n→ 外来\n\nなので、傷害保険の対象になり得ます。\n\n---\n\n「じゃあ、病気で入院したら？」\n\n……\n\n### 原則として傷害保険の対象ではありません。\n\n傷害保険は基本的に、\n\n### **ケガ**\n\nを対象とする保険だからです。\n\n「この“急激・偶然・外来”は73の傷害保険で詳しくやります。」\n\n---\n\n# ⑥ 保険価額と保険金額\n\n「先輩、この後かなり重要になるので、言葉だけ先に分けます。」\n\n### 保険価額\n\n> **保険事故によって被る可能性のある経済的損害の最高限度を評価した額**\n\nたとえば建物の価値が、\n\n### 2,000万円\n\nなら、それが保険価額を考える基礎になります。\n\n---\n\n### 保険金額\n\n> **契約で設定した保険会社が支払う責任の限度額**\n\nたとえば、\n\n建物価値\n→ 2,000万円\n\n保険契約\n→ 1,500万円\n\nなら、\n\n保険価額\n→ **2,000万円**\n\n保険金額\n→ **1,500万円**\n\nという違いが出ます。\n\n「63でここを本格的にやりますから、今は“価額＝価値、金額＝契約額”くらいで大丈夫です。」\n\n---\n\n# C【イメージ理解｜壊れる前に戻す】\n\n「生命保険と損害保険をイメージで分けましょう。」\n\n生命保険なら、\n\n👨\n↓\n死亡\n↓\n💰契約で決めた死亡保険金\n\nという感じ。\n\n一方、損害保険は、\n\n🏠正常な家\n\n↓\n\n🔥火災\n\n↓\n\n🏚️500万円の損害\n\n↓\n\n💰保険\n\n↓\n\n🏠損害を補う\n\nです。\n\n「つまり損害保険は、**マイナスになった分を埋める**イメージなんですよ。」\n\n---\n\n# D【具体例｜台風で屋根が壊れ
