任意継続\n↓\n最長2年\n\nです。\n\n【最大の注意点｜会社が半分払ってくれなくなる】\n「先輩、ここが制度を理解するうえで一番大事です。」\n\n会社員だったころの健康保険料は原則として、\n\n👨‍💼本人\n＋\n🏢会社\n\nで負担していましたね。\n\nいわゆる、\n\n労使折半\n\nです。\n\n「ところが退職したら？」\n\nもう元の会社は、先輩の保険料を負担してくれません。\n\nしたがって任意継続では、\n\n保険料は原則として全額自己負担\n\nになります。\n\n「ここ、かなり重要です。」\n\n在職中\n本人 🤝 会社\n→ 保険料を分担\n\n任意継続\n本人だけ\n→ 全額自己負担\n\n「なので、在職中より本人負担が大きくなることがあります。」\n\nC【イメージ理解｜会社を辞めても“会員資格”だけ延長する】\n「先輩、スポーツジムみたいに考えてみましょう。」\n\n会社員時代は、\n\n🏢会社\n「先輩の会費、半分くらいこっちで負担しますよ。」\n\n👨‍💼先輩\n「助かります。」\n\nところが退職。\n\n🏢「会社負担はここまでです。」\n\nでも健康保険から、\n\n「一定の条件を満たしているなら、最長2年間は自分で保険料を負担して残ることもできますよ」\n\nとなる。\n\nこれが、\n\n任意継続\n\nです。\n\n「名前そのままなんですよ。」\n\n任意\n→ 自分で選んで\n\n継続\n→ 今までの健康保険を続ける\n\n被保険者\n→ その健康保険に加入する本人\n\nです。\n\nD【具体例｜先輩が退職しました】\n「では試験問題っぽくいきます。」\n\n先輩は会社の健康保険に、\n\n5年間\n\n加入していました。\n\n10月31日に退職。\n\n「被保険者期間2か月以上？」\n\n→ 余裕でOK\n\nそして退職日の翌日から20日以内に、\n\n「任意継続します」\n\nと申し出た。\n\n→ 要件を満たせば任意継続可能\n\nそして期間は、\n\n→ 最長2年間\n\nです。\n\n「保険料は会社と半分ずつ？」\n「先輩？ 退職したんですよ。」\n\n会社負担はありません。\n\n→ 原則、全額自己負担\n\nです。\n\n「ここまでセットで答えられたら、任意継続はかなり強いです。」\n\n【退職後の3ルート】\n「先輩、退職後の健康保険はこの形で頭に置いてください。」\n\n退職！\n↓\n「健康保険どうする？」\n\n→ ① 任意継続\n\n→ ② 国民健康保険\n\n→ ③ 家族の健康保険の被扶養者になる\n※被扶養者の要件を満たす場合\n\n「任意継続だけを暗記するより、この3択として理解した方が実生活でも使えます。」\n\n【数字を整理】\n項目\t任意継続\n退職前の被保険者期間\t継続2か月以上\n申請期限\t退職日の翌日から20日以内\n継続期間\t最長2年間\n保険料\t原則、全額自己負担\n「先輩、数字がバラバラに見えるでしょう？」\n\nだから、\n\n2・20・2\nです。\n\n【理解確認】\n「では先輩、4問いきます。」\n\nQ1\n退職前に必要な被保険者期間は？\n\n→ 継続して2か月以上\n\nQ2\n申出はいつまで？\n\n→ 退職日の翌日から20日以内\n\nQ3\n任意継続できる期間は？\n\n→ 最長2年間\n\nQ4\n退職後も会社が保険料を半分負担してくれる？\n\n→ いいえ。原則、全額自己負担です。\n\n「はい。ここは数字まで完璧にしてください。」\n\n【30秒復習】\n① 何の制度？\n→ 退職後も健康保険を継続\n\n② 退職前の加入期間\n→ 継続2か月以上\n\n③ 手続き\n→ 退職日の翌日から20日以内\n\n④ 継続期間\n→ 最長2年\n\n⑤ 保険料\n→ 原則全額自己負担\n\n⑥ 退職後の他の選択肢\n→ 国民健康保険・家族の被扶養者など\n\n【一文で覚える】\n任意継続被保険者＝「退職前に継続2か月以上加入していた人が、退職翌日から20日以内に申し出ることで、最長2年間、それまでの健康保険を継続できる制度」。\n\n「最後はこれです、先輩。」\n\n2か月 → 20日 → 2年\n加入してた期間 → 申し込む期限 → 続けられる期間\n\n「『2・20・2』だけじゃなく、この数字の順番の意味までセットで覚えてくださいね。」\n\n国民健康保険\n"}, {"n": 30, "title": "国民健康保険", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、次は国民健康保険ですね。健康保険との違いを軸にすると、かなり整理しやすいですよ。」\n\n一言でいうと、\n\n会社の健康保険などに加入していない人を主な対象とする公的医療保険\n\nです。\n\n代表的なのは、\n\n自営業者・フリーランス・退職して職場の健康保険を抜けた人など\n\nですね。\n\n「会社員なら？」\n\n→ 健康保険\n\n「自営業者などなら？」\n\n→ 国民健康保険\n\nまずこの対比です。\n\nB【詳しい解説｜健康保険と何が違うの？】\n「先輩が会社を辞めて、自営業になったとしましょう。」\n\n会社員時代\n↓\n健康保険\n\n退職してその資格を喪失\n↓\nほかの健康保険の被扶養者にもならず、任意継続もしない\n↓\n国民健康保険\n\nという流れが考えられます。\n\n「つまり国民健康保険は、日本の公的医療保険制度の中で、ほかの医療保険に加入していない人をカバーする重要な仕組みなんですね。」\n\n【誰が運営するの？】\n「ここも健康保険と比較しましょう。」\n\n健康保険なら、\n\n協会けんぽ\n→ 全国健康保険協会\n\n組合健保\n→ 健康保険組合\n\nでした。\n\nでは国民健康保険は？\n\n主な保険者は、\n\n市町村・特別区\n\nです。\n\nさらに、\n\n国民健康保険組合\n\nが運営する国民健康保険もあります。\n\n「FPではまず、」\n\n国保 → 市区町村など\n\nと押さえておけば全体像をつかみやすいです。\n\n【最大の特徴｜扶養がない】\n「先輩、ここは試験でかなり重要です。」\n\n健康保険には、\n\n👨‍💼被保険者\n＋\n👩被扶養者\n\nという仕組みがありました。\n\nところが国民健康保険には、\n\n健康保険のような被扶養者制度がありません。\n\n「たとえば自営業の夫、妻、子どもが国民健康保険の対象になる場合は？」\n\n夫だけが加入して、\n\n「妻と子どもは夫の扶養ね」\n\nとはなりません。\n\nそれぞれが、\n\n国民健康保険の被保険者\n\nになります。\n\n「ここ、健康保険との大きな違いですよ。」\n\n健康保険 → 扶養あり\n\n国民健康保険 → 扶養なし\n\nです。\n\n【給付はどうなる？】\n「もちろん国民健康保険でも、病気やけがで保険診療を受ければ給付があります。」\n\nたとえば、\n\n🏥病気・けが\n→ 療養の給付\n\n💰自己負担が非常に高額\n→ 高額療養費\n\n👶出産\n→ 出産育児一時金\n\n⚰️死亡\n→ 葬祭費\n\nなどがあります。\n\n「ただ、先輩。ここで会社員の健康保険との重要な違いが出ます。」\n\n【傷病手当金・出産手当金は？】\n「さっき勉強しましたね。」\n\n健康保険では、\n\n病気で仕事を休む\n→ 傷病手当金\n\n出産で仕事を休む\n→ 出産手当金\n\nがありました。\n\n「じゃあ国民健康保険にも当然ある？」\n\n……そこ、引っかからないでくださいね。\n\n国民健康保険では、\n\n傷病手当金・出産手当金は法定給付ではありません。\n\n「なぜ違うのか、イメージできます？」\n\n健康保険の傷病手当金や出産手当金は、\n\n会社員などが仕事を休んで給与を得られなくなったときの所得保障\n\nという性格があります。\n\n一方、国民健康保険では、この2つが健康保険と同じように当然に支給される仕組みにはなっていないんですね。\n\nC【イメージ理解｜会社員から自営業になった先輩】\n「先輩の人生で考えてみましょう。」\n\n👨‍💼会社員時代\n会社に勤務しています。\n\n→ 健康保険\n\n配偶者が一定の条件を満たせば、\n\n→ 被扶養者\n\nにできる場合があります。\n\nさらに、\n\n病気で働けない\n→ 傷病手当金\n\n出産で休業\n→ 出産手当金\n\nといった制度もある。\n\n「ところが先輩が独立します。」\n\n👨‍🍳自営業\n会社の健康保険を抜けました。\n\n任意継続などを選択せず、他の医療保険にも加入しない。\n\n→ 国民健康保険\n\nそして家族も国保の対象なら、\n\n👨先輩 → 被保険者\n👩配偶者 → 被保険者\n👧子ども → 被保険者\n\n「『先輩が本人で、妻と子が扶養』ではないんです。」\n\nこれが、\n\n国保には扶養がない\n\nという意味です。\n\nD【具体例｜退職したらどうする？】\n「先輩、前回の任意継続とつなげますよ。」\n\n会社を退職しました。\n\nすると健康保険について、状況に応じて主に、\n\n① 任意継続する\n\n② 国民健康保険に加入する\n\n③ 家族の健康保険の被扶養者になる\n\nという選択肢が考えられます。\n\nたとえば、\n\n会社の健康保険\n↓\n退職\n↓\n任意継続しない\n↓\n家族の扶養にも入らない\n↓\n国民健康保険\n\nという流れですね。\n\n「だから前回の任意継続被保険者と今回の国民健康保険は、別々に暗記するより、退職後の選択肢としてつなげて覚えた方が強いです。」\n\n【健康保険と国保を完全比較】\n健康保険\t国民健康保険\n主な対象\t会社員など\t自営業者など\n主な保険者\t協会けんぽ・健康保険組合\t市町村・特別区など\n被扶養者制度\tあり\tなし\n療養の給付\t○\t○\n高額療養費\t○\t○\n出産育児一時金\t○\t○\n傷病手当金\t○\t法定給付ではない\n出産手当金\t○\t法定給付ではない\n「先輩、試験対策なら特に下の2つに注目です。」\n\n国保には扶養なし\n\nそして、\n\n傷病手当金・出産手当金は法定給付ではない\n\nです。\n\n【理解確認】\n「はい、先輩。4問いきます。」\n\nQ1\n自営業者などが加入する代表的な公的医療保険は？\n\n→ 国民健康保険\n\nQ2\n国民健康保険に被扶養者制度は？\n\n→ ない\n\nQ3\n国民健康保険にも高額療養費はある？\n\n→ ある\n\nQ4\n傷病手当金と出産手当金は？\n\n→ 国民健康保険では法定給付ではない\n\n「はい。この4つを押さえれば、健康保険との区別がかなりできます。」\n\n【30秒復習】\n① 会社員など\n→ 健康保険\n\n② 自営業者など\n→ 国民健康保険\n\n③ 国保の主な保険者\n→ 市町村・特別区など\n\n④ 国保の扶養\n→ なし\n\n⑤ 高額療養費\n→ あり\n\n⑥ 傷病手当金・出産手当金\n→ 法定給付ではない\n\n【一文で覚える】\n国民健康保険＝「自営業者など、ほかの公的医療保険に加入していない人を主な対象とし、健康保険のような被扶養者制度がない公的医療保険」。\n\n「先輩、試験直前ならもっと削ります。」\n\n会社員 → 健康保険\n\n自営業 → 国保\n\n健康保険 → 扶養あり\n\n国保 → 扶養なし\n\n「特に最後の**『国保に扶養なし』**。ここは健康保険との比較問題で迷わないように、しっかり固定しておきましょう。」\n\n後期高齢者医療制度\n"}, {"n": 31, "title": "後期高齢者医療制度", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、次は後期高齢者医療制度ですね。名前は長いですけど、中心となる数字はまず75歳です。」\n\n一言でいうと、\n\n原則75歳以上の人が加入する公的医療保険制度\n\nです。\n\n対象は大きく、\n\n① 75歳以上の人\n\n② 65歳以上75歳未満で、一定の障害があり認定を受けた人\n\nです。\n\n「まず試験用には――」\n\n75歳になったら → 後期高齢者医療制度\n\nこれを軸にしてください。\n\nB【詳しい解説｜75歳になるとどうなる？】\n「先輩が74歳で、国民健康保険に加入しているとしましょう。」\n\n74歳\n→ 国民健康保険\n\nそして75歳になる。\n\n「そのままずっと国保？」\n\n→ いいえ。\n\n原則として、\n\n後期高齢者医療制度\n\nへ移ります。\n\n「会社員として健康保険に入っていた場合も基本的な考え方は同じです。」\n\n75歳になる\n↓\nそれまで加入していた健康保険・国民健康保険などから\n↓\n後期高齢者医療制度へ\n\nという流れです。\n\n【65～74歳でも入ることがある】\n「じゃあ先輩、74歳なら絶対に後期高齢者医療制度には入れない？」\n\n「いえ、例外があります。」\n\n65歳以上75歳未満\n\nでも、\n\n一定の障害があり、後期高齢者医療広域連合の認定を受けた人\n\nは対象になることがあります。\n\nだから、\n\n原則 → 75歳以上\n\n例外 → 65～74歳＋一定の障害＋認定\n\nと整理しましょう。\n\n【誰が運営しているの？】\n「国民健康保険は市町村・特別区などでしたね。」\n\n後期高齢者医療制度では、\n\n都道府県ごとに設置された後期高齢者医療広域連合\n\nが運営主体です。\n\n「長いですね……。」\n\nFPでは、\n\n都道府県単位の広域連合\n\nと覚えると整理しやすいです。\n\n市区町村も保険料徴収や各種手続きなどを担当します。\n\n【医療費の自己負担は？】\n「先輩、ここは『高齢者なら全員1割』と思わないでください。」\n\n現在は所得などによって、\n\n1割・2割・3割\n\nがあります。\n\n基本的なイメージとして、\n\n一般的な所得\n→ 1割\n\n一定以上の所得\n→ 2割\n\n現役並み所得\n→ 3割\n\nです。\n\n「つまり年齢だけではなく、所得によって負担割合が変わるんですね。」\n\nC【イメージ理解｜年齢で保険のレーンが変わる】\n「先輩の人生を一本道にしてみましょう。」\n\n👨‍💼 40歳・会社員\n→ 健康保険\n\n↓\n\n👨‍🍳 60歳・自営業\n→ 国民健康保険\n\n↓\n\n👴 75歳\n\nここで、\n\n「はい、医療保険のレーンを移動します。」\n\n↓\n\n後期高齢者医療制度\n\n「こう考えると、後期高齢者医療制度はまったく別世界の制度ではなく、高齢期を担当する公的医療保険なんですね。」\n\nD【具体例｜74歳と75歳】\n「では先輩、Aさんは現在74歳で国民健康保険に加入しています。」\n\n74歳\n👴Aさん\n→ 国民健康保険\n\nそして75歳になりました。\n\n75歳\n👴Aさん\n→ 後期高齢者医療制度\n\n「ここで試験問題。」\n\n75歳になっても引き続き国民健康保険の被保険者である。\n\n→ ×\n\n原則として後期高齢者医療制度へ移ります。\n\n【もう一つ重要｜扶養されていた人は？】\n「先輩、ここ少し考えてみてください。」\n\n会社員の健康保険には、\n\n被扶養者制度\n\nがありましたよね。\n\nでは、\n\n「後期高齢者医療制度でも家族の扶養に入れば保険料を払わなくていい？」\n\n→ そうではありません。\n\n後期高齢者医療制度では、\n\n対象者一人ひとりが被保険者\n\nになります。\n\n「だから、健康保険の『本人＋扶養家族』という構造とは違うんですね。」\n\n【これまでの3制度を一本につなげる】\n制度\t主な対象\n健康保険\t会社員など\n国民健康保険\t自営業者など\n後期高齢者医療制度\t原則75歳以上\n「そして扶養について見ると――」\n\n健康保険\n→ 被扶養者制度 あり\n\n国民健康保険\n→ 被扶養者制度 なし\n\n後期高齢者医療制度\n→ 対象者が一人ひとり被保険者\n\nです。\n\n【理解確認】\n「はい、先輩。4問いきます。」\n\nQ1\n後期高齢者医療制度の原則的な対象年齢は？\n\n→ 75歳以上\n\nQ2\n65～74歳は絶対に対象外？\n\n→ いいえ。一定の障害があり認定を受けた場合は対象になり得ます。\n\nQ3\n運営主体は？\n\n→ 都道府県ごとの後期高齢者医療広域連合\n\nQ4\n窓口負担は全員1割？\n\n→ いいえ。所得などに応じて1割・2割・3割があります。\n\n「はい。特に75・65・1/2/3の数字を整理しておきましょう。」\n\n【30秒復習】\n① 原則何歳から？\n→ 75歳\n\n② 例外\n→ 65～74歳＋一定の障害＋認定\n\n③ 運営主体\n→ 後期高齢者医療広域連合\n\n④ 窓口負担\n→ 所得などに応じ1・2・3割\n\n⑤ 75歳になったら\n→ 原則、従来の健康保険・国保などから移る\n\n⑥ 扶養という扱いは？\n→ 対象者一人ひとりが被保険者\n\n【一文で覚える】\n後期高齢者医療制度＝「原則75歳以上の人を対象とし、都道府県単位の広域連合が運営する公的医療保険制度」。\n\n「先輩、最後はこれです。」\n\n75歳 → 後期高齢者\n\n65～74歳 → 一定の障害＋認定なら対象になり得る\n\n負担割合 → 1・2・3割\n\n「まず75歳を中心に置いて、そこへ『65～74歳の例外』『所得による負担割合』をくっつければ、きれいに覚えられます。」\n\n公的介護保険\n"}, {"n": 32, "title": "公的介護保険", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、ここから公的介護保険ですね。医療保険から介護の分野に移ります。」\n\n一言でいうと、\n\n介護が必要になった人を社会全体で支える公的な保険制度\n\nです。\n\nそしてFPで最初に絶対押さえるのが、加入者を年齢で2つに分けること。\n\n第1号被保険者\n→ 65歳以上\n\n第2号被保険者\n→ 40歳以上65歳未満の医療保険加入者\n\n「先輩、まずは――」\n\n1号＝65歳以上\n\n2号＝40～64歳\n\nこれを固定しましょう。\n\nB【詳しい解説｜なぜ1号と2号に分けるの？】\n「先輩、介護保険は40歳から関係してきます。」\n\n39歳\n→ 原則として介護保険の被保険者ではない\n\nそして、\n\n40歳\n→ 第2号被保険者\n\nさらに、\n\n65歳\n→ 第1号被保険者\n\nです。\n\n「つまり年齢の流れなら――」\n\n40歳\n→ 第2号スタート\n\n65歳\n→ 第1号へ\n\nですね。\n\n【第1号被保険者｜65歳以上】\n「まず65歳以上の人。」\n\n→ 第1号被保険者\n\nでは、どんな場合に介護保険のサービスを利用できるのでしょう？\n\n基本的には、\n\n要介護状態・要支援状態になった場合\n\nです。\n\n「先輩、ここで第2号との大きな違いがあります。」\n\n第1号被保険者の場合、\n\n介護が必要になった原因を原則として問いません。\n\nたとえば、\n\n高齢によって身体機能が低下した\n↓\n要介護認定\n↓\n介護サービス\n\nということが可能です。\n\n【第2号被保険者｜40～64歳】\n「次がちょっと厄介です。」\n\n40歳以上65歳未満の医療保険加入者\n\n→ 第2号被保険者\n\n「この人たちも介護が必要になれば何でも介護保険を使える？」\n\n→ 違います。\n\n第2号被保険者の場合は、\n\n老化に起因する一定の疾病（特定疾病）が原因で、要介護・要支援状態になった場合\n\nに限られます。\n\n「ここが第1号と第2号の最大の違いです。」\n\n第1号\n65歳以上\n→ 原因を原則問わない\n\n第2号\n40～64歳\n→ 特定疾病が原因であることが必要\n\nです。\n\n【特定疾病って何？】\n「先輩、全部をいきなり暗記する必要はありません。まず代表例を知っておきましょう。」\n\nたとえば、\n\n初老期における認知症\n\n脳血管疾患\n\n末期がん\n\nなど、老化との関連が認められる一定の疾病です。\n\n「つまり第2号は単に『介護が必要』だけでは足りないんです。」\n\n介護が必要\n＋\n原因が特定疾病\n\nこの2つがポイントです。\n\nC【イメージ理解｜60歳と70歳の2人】\n「先輩、2人の人を想像してください。」\n\n👨 Aさん・60歳\n→ 第2号被保険者\n\nAさんが事故で大けがをして介護が必要になりました。\n\n「介護が必要だから、介護保険を使える？」\n\n→ 原則、それだけでは対象になりません。\n\n第2号被保険者は、\n\n特定疾病が原因か？\n\nを見るからです。\n\n👴 Bさん・70歳\n→ 第1号被保険者\n\nBさんが介護を必要とする状態になり、要介護認定を受けました。\n\n「原因は？」\n\n第1号なら、\n\n原則として原因を問いません。\n\n「ここですよ、先輩。」\n\n若い方の第2号には『原因の条件』がある。\n\n65歳以上の第1号には、その原因制限が原則ない。\n\nこれで区別できます。\n\nD【具体例｜試験問題で判断しましょう】\n「では先輩、問題形式でいきます。」\n\nケース①\n72歳\n\n要介護状態になった。\n\n→ 第1号被保険者\n\n→ 原則、原因を問わず対象になり得る。\n\nケース②\n55歳\n\n脳血管疾患によって要介護状態になった。\n\n→ 第2号被保険者\n\n→ 特定疾病が原因なので対象になり得る。\n\nケース③\n55歳\n\n交通事故によって介護が必要になった。\n\n「第2号ですよね。」\n\nでも原因は交通事故。\n\n→ 特定疾病が原因ではない\n\n→ 原則として介護保険の給付対象にはなりません。\n\n「『介護が必要＝必ず介護保険』ではないんです。第2号では原因を見る。ここ、かなり大事ですよ。」\n\n【誰が運営しているの？】\n「では介護保険の保険者は誰でしょう？」\n\n→ 市町村・特別区\n\nです。\n\n「国じゃないですよ。」\n\n市町村・特別区\n↓\n介護保険を運営\n↓\n被保険者\n↓\n要介護・要支援認定\n↓\n介護サービス\n\nというイメージです。\n\n【自己負担は？】\n「介護サービスを使ったら全部無料？」\n\n→ いいえ。\n\n利用者負担は原則、\n\n1割\n\nです。\n\nただし、一定以上の所得がある人は、\n\n2割または3割\n\nとなります。\n\n「後期高齢者医療でも1・2・3割が出てきましたけど、制度は別ですから混ぜないでくださいね。」\n\n【第1号と第2号を完全比較】\n第1号被保険者\t第2号被保険者\n年齢\t65歳以上\t40歳以上65歳未満\n条件\t65歳以上\t医療保険加入者\n給付の原因\t原則問わない\t特定疾病に限る\n認定\t要介護・要支援\t要介護・要支援\n自己負担\t原則1割※\t原則1割※\n※一定以上の所得者は2割または3割。\n\n「先輩、この表で一番大事なのは年齢だけじゃありません。」\n\n第2号＝特定疾病\n\nまでセットです。\n\n【医療保険とのつながり】\n「ここで今まで勉強してきた公的医療保険とつながります。」\n\n先輩が会社員で45歳なら、\n\n健康保険\n＋\n介護保険の第2号被保険者\n\nです。\n\n「だから40歳になると、給与明細を見て『介護保険料』が出てくるわけですね。」\n\n医療保険と介護保険は別制度ですが、第2号被保険者の保険料は医療保険料と一体的に徴収されます。\n\n一方、65歳以上の第1号被保険者になると、介護保険料は市町村・特別区が徴収します。\n\n【理解確認】\n「はい、先輩。ここは数字が重要なので5問いきます。」\n\nQ1\n第1号被保険者は何歳以上？\n\n→ 65歳以上\n\nQ2\n第2号被保険者は？\n\n→ 40歳以上65歳未満の医療保険加入者\n\nQ3\n第1号は介護が必要になった原因を問われる？\n\n→ 原則として問われない\n\nQ4\n第2号は？\n\n→ 特定疾病が原因である必要がある\n\nQ5\n介護保険の保険者は？\n\n→ 市町村・特別区\n\n「はい。この5つが骨格です。」\n\n【30秒復習】\n① 介護保険は何歳から？\n→ 40歳\n\n② 40～64歳\n→ 第2号\n\n③ 65歳以上\n→ 第1号\n\n④ 第1号の原因\n→ 原則問わない\n\n⑤ 第2号の原因\n→ 特定疾病\n\n⑥ 保険者\n→ 市町村・特別区\n\n【一文で覚える】\n公的介護保険＝「40～64歳の医療保険加入者を第2号、65歳以上を第1号とし、第2号は特定疾病が原因の場合に限って介護給付を受けられる制度」。\n\n「先輩、試験直前ならこれです。」\n\n40歳 → 2号スタート\n\n65歳 → 1号へ\n\n1号 → 原因を原則問わない\n\n2号 → 特定疾病が必要\n\n「特に『2号＝40～64歳＝特定疾病』。ここを一本のセットにして覚えてください。」\n\n労災保険\n"}, {"n": 33, "title": "労災保険", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、次は労災保険ですね。健康保険との境界を意識すると、一気に分かりやすくなります。」\n\n正式には、\n\n労働者災害補償保険\n\nです。\n\n一言でいうと、\n\n労働者が仕事中や通勤中の事故・病気などで被災したときに補償する制度\n\nです。\n\nまずはこの対比。\n\n仕事とは関係ない病気・けが\n→ 健康保険\n\n仕事が原因\n→ 労災保険（業務災害）\n\n通勤が原因\n→ 労災保険（通勤災害）\n\n「そして、もう一つ超重要です。」\n\n労災保険料は、原則として事業主が全額負担します。\n\n「健康保険みたいに労使折半じゃありませんよ。」\n\nB【詳しい解説｜何を補償するの？】\n「先輩が会社員として働いているとしましょう。」\n\n仕事中に荷物を運んでいて、\n\n📦「うわっ！」\n\n転倒して骨折しました。\n\nこれは、\n\n業務災害\n\nとして労災保険の対象になり得ます。\n\n① 業務災害\n「文字どおりですね。」\n\n仕事が原因となった負傷・疾病・障害・死亡など\n\nです。\n\nたとえば、\n\n工場で機械を操作中にけが\n↓\n業務災害\n\n仕事が原因で病気になった\n↓\n一定の要件を満たせば業務災害\n\nとなります。\n\n② 通勤災害\n「でも先輩、会社に着く前に事故に遭ったら？」\n\n一定の要件を満たす通勤途中の事故などについても、\n\n通勤災害\n\nとして労災保険の対象になります。\n\nつまり、\n\n会社の中だけが労災\n\nではありません。\n\n仕事＋通勤\n\nまでセットで覚えましょう。\n\n【健康保険との違い】\n「ここ、以前やった健康保険とつなげますよ。」\n\n日曜日、自宅で転倒\n仕事とは関係ない。\n\n→ 健康保険\n\n仕事中、会社で転倒\n→ 労災保険\n\n通勤途中、一定の要件を満たす事故\n→ 労災保険\n\n「だから問題を見たら、まず――」\n\n仕事・通勤と関係ある？\n\nと考えるんです。\n\n【誰が加入する？】\n「先輩、ここも大事です。」\n\n労災保険は原則として、\n\n労働者を1人でも使用する事業\n\nに適用されます。\n\nそして正社員だけではありません。\n\nパート・アルバイトなどの労働者も対象\n\nになり得ます。\n\n「『アルバイトだから労災なし』ではありませんよ。」\n\n【保険料は誰が払う？】\n「ここはFP試験で非常に覚えやすい得点ポイントです。」\n\n健康保険\n→ 原則、労使折半\n\n雇用保険\n→ 労働者と事業主が負担\n\n労災保険\n→ 事業主が全額負担\n\nです。\n\n「なぜ労災だけ会社側なの？と考えると――」\n\n仕事によって発生する災害に対して、事業主が負う災害補償責任を保険制度で支える、という性格があるんですね。\n\nだから、\n\n労災＝会社が全額\n\nと覚えると強いです。\n\nC【イメージ理解｜先輩の一日を追いかけます】\n「先輩、朝から会社に行きましょう。」\n\n🚃 8:00 通勤中\n一定の通勤経路で事故に遭った。\n\n→ 通勤災害\n\n→ 労災保険\n\n🏢 10:00 仕事中\n機械で手をけがした。\n\n→ 業務災害\n\n→ 労災保険\n\n🏠 20:00 帰宅後\n自宅で料理していて指を切った。\n\n「これは仕事でも通勤でもないですよね。」\n\n→ 健康保険\n\n「先輩、これなら区別できますね。」\n\n会社にいるかどうかだけを見るのではなく、\n\n仕事・通勤との関係\n\nを見るんです。\n\nD【具体例｜治療費はどうなる？】\n「先輩が仕事中にけがをして、労災として認められ、指定医療機関で必要な治療を受けたとしましょう。」\n\n健康保険なら、\n\n「原則3割負担だったな」\n\nと思いますよね。\n\nでも労災の療養（補償）等給付では、原則として必要な療養が給付されるため、\n\n本人の自己負担はありません。\n\n「え、3割じゃないの？」\n\n→ はい。労災として扱われる治療については原則自己負担なしです。\n\nだから、\n\n仕事中のけがなのに健康保険を使えばいい\n\nという話ではありません。\n\n「仕事が原因なら、まず労災を考える。ここですよ。」\n\n【治療だけじゃない】\n「先輩、労災保険も病院代だけの制度ではありません。」\n\n仕事・通勤による災害によって、\n\n治療が必要\n→ 療養関係の給付\n\n働けない\n→ 休業関係の給付\n\n障害が残った\n→ 障害関係の給付\n\n死亡した\n→ 遺族関係の給付\n\nなどがあります。\n\n「つまり労災事故が起きてから、その後の生活まで支える仕組みなんですね。」\n\n【健康保険・労災保険を比較】\n健康保険\t労災保険\n主な対象\t業務外の病気・けが\t業務・通勤による災害\n代表例\t休日に風邪\t仕事中にけが\n保険料\t原則労使折半\t事業主が全額負担\n労働者の保険料負担\tあり\tなし\n労災治療の自己負担\t―\t原則なし\n「先輩、試験ではこの比較が強いです。」\n\n【理解確認】\n「はい、5問いきます。」\n\nQ1\n仕事中の事故によるけがは？\n\n→ 業務災害\n\nQ2\n一定の通勤中の事故は？\n\n→ 通勤災害\n\nQ3\n業務外の病気・けがは基本的に？\n\n→ 健康保険\n\nQ4\n労災保険料は誰が負担する？\n\n→ 事業主が全額負担\n\nQ5\nアルバイトなら労災保険の対象にならない？\n\n→ いいえ。アルバイトなども労働者として対象になり得ます。\n\n「はい。特にQ4は即答できるようにしておきましょう。」\n\n【30秒復習】\n① 正式名称\n→ 労働者災害補償保険\n\n② 仕事中\n→ 業務災害\n\n③ 通勤中\n→ 通勤災害\n\n④ 仕事と無関係\n→ 健康保険\n\n⑤ 保険料\n→ 事業主が全額負担\n\n⑥ 労災による療養\n→ 原則自己負担なし\n\n【一文で覚える】\n労災保険＝「労働者の業務上・通勤上の災害を補償し、保険料は事業主が全額負担する制度」。\n\n「先輩、もっと削ります。」\n\n仕事 → 労災\n\n通勤 → 労災\n\nプライベート → 健康保険\n\n保険料 → 会社が全額\n\n「この4本を土台にしておけば、次に休業補償給付や遺族補償給付が出てきても、ちゃんと同じ地図の上で理解できますよ。」\n\n\n"}, {"n": 34, "title": "雇用保険", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、次は雇用保険ですね。労災保険とセットで出てきますけど、守っているものが違います。」\n一言でいうと、\n失業したときや、育児・介護などで働き続けることが難しくなったときに、労働者の生活や雇用を支える保険\nです。\n「『雇用保険＝失業したときだけ』と思いやすいんですが、それだけじゃありません。」\nまずイメージは、\n失業した\n→ 基本手当\n育児で休む\n→ 育児休業関係の給付\n介護で休む\n→ 介護休業給付\nなどです。\n「労災との違いも簡単ですよ。」\n仕事・通勤でけが → 労災保険\n失業・雇用継続など → 雇用保険\nです。\nB【詳しい解説｜誰が加入するの？】\n「まず、雇用保険の被保険者になる基本条件です。」\n原則として、\n① 1週間の所定労働時間が20時間以上\nそして、\n② 31日以上引き続き雇用されることが見込まれる\n労働者が対象になります。\n「先輩、数字は――」\n週20時間・31日以上\nです。\n正社員だけでなく、条件を満たせば、\nパート・アルバイト\nも対象になります。\n「『非正規だから雇用保険なし』ではありません。」\n【失業したら何がもらえる？】\n「先輩が会社を辞めて、次の仕事を探しているとしましょう。」\nそこで代表的なのが、\n基本手当\nです。\n一般に「失業手当」「失業保険」と呼ばれることがありますが、制度上は基本手当ですね。\n「でも会社を辞めたら誰でも自動的にもらえる？」\n→ いいえ。\n失業状態にあり、\n働く意思と能力があり、求職活動をしている\nことなどが必要です。\n「じゃあ、仕事する気がなくて家で休んでいたら？」\n「先輩、それだと基本手当の『失業』の考え方から外れてしまいます。」\nたとえば、\n「働けるし、働きたい」\n↓\n「仕事を探している」\n↓\n「でも就職できていない」\nという状態を支えるのが基本です。\nつまり、\n無職＝必ず失業給付\nではありません。\nここ大事ですよ。\n【どれくらい加入していればいい？】\n「ここもFPで数字が出てきます。」\n基本手当を受けるためには原則として、\n離職日以前2年間に、被保険者期間が通算12か月以上\n必要です。\n「先輩、まず通常パターンは――」\n2年間に12か月\nです。\nただし、倒産・解雇など一定の場合には、\n離職日以前1年間に被保険者期間が通算6か月以上\nなど、別の要件があります。\n「なので最初は、」\n原則 → 2年の中に12か月\nと覚えてください。\n【保険料は誰が払う？】\n「ここ、労災保険との比較問題が狙いやすいですよ。」\n労災保険\n→ 事業主が全額負担\n雇用保険\n→ 労働者と事業主の双方が負担\nです。\n「先輩、雇用保険を『会社が全部払う』にしないでくださいね。」\n【失業だけじゃない】\n「さっき言いましたね。雇用保険は失業だけではありません。」\n代表的には、\n求職者給付\n→ 失業中の生活・再就職を支える\n就職促進給付\n→ 早期の再就職などを支援\n教育訓練給付\n→ 一定の教育訓練を受ける費用を支援\n雇用継続給付\n→ 雇用の継続を支援\n育児休業等給付\n→ 育児休業などを支援\nといった仕組みがあります。\n「だから『失業保険』という呼び方だけで覚えると、制度を狭く理解してしまうんですね。」\nC【イメージ理解｜会社員人生のピンチを支える】\n「先輩の会社員生活を追ってみましょう。」\n👨‍💼 普通に働いている\n→ 雇用保険に加入\n↓\n💼 会社を退職\n「次の仕事を探しているけど、まだ決まらない……。」\n→ 基本手当\n↓\n📚 再就職のために勉強\n「資格を取ってスキルアップしたい。」\n→ 条件を満たせば教育訓練給付\n↓\n👶 育児のため休業\n「仕事は辞めたくない。でも育児のため休みたい。」\n→ 育児休業等給付\n「見えてきました？」\n雇用保険は、\n失業した人にお金を渡して終わり\nではなく、\n仕事を失ったとき＋仕事を続けるため＋再び働くため\nを支える制度なんです。\nD【具体例｜基本手当を判断しましょう】\n「先輩が会社を退職したとします。」\n離職前2年間を確認すると、\n雇用保険の被保険者期間\n→ 18か月\nありました。\nそして現在、\n👨「働きたいです」\n👨「働けます」\n👨「実際に仕事を探しています」\nでも、\n👨「まだ就職先が決まっていません」\n「この場合は？」\n→ 基本手当の対象になる可能性があります。\n「では同じ退職でも――」\n👨「しばらく働くつもりはありません。求職活動もしません。」\nだったら？\n→ 単に無職というだけでは、基本手当の対象となる「失業」の要件を満たしません。\n「ここです、先輩。」\n仕事がない\nだけじゃなく、\n働く意思＋働く能力＋求職活動\nというイメージを持ってください。\n【労災保険と比較】\n\t労災保険\t雇用保険\n主に何に備える？\t仕事・通勤中の災害\t失業・雇用継続など\n代表的給付\t療養・休業など\t基本手当など\n保険料\t事業主が全額\t労働者＋事業主\nパート等\t対象になり得る\t条件を満たせば対象\n\n\n「労働保険という大きなくくりでは、労災保険＋雇用保険の2つがあります。」\n【数字を整理しましょう】\n「先輩、今回の数字はごちゃごちゃさせないで、2セットです。」\n加入の基本\n20時間・31日\n→ 週20時間以上\n→ 31日以上の雇用見込み\n基本手当の受給資格の原則\n2年・12か月\n→ 離職前2年間\n→ 被保険者期間12か月以上\n「数字だけじゃなく、何の数字なのかまでセットですよ。」\n【理解確認】\n「はい、先輩。5問いきます。」\nQ1\n雇用保険の代表的な失業等給付は？\n→ 基本手当\nQ2\n基本的な加入要件の労働時間は？\n→ 週20時間以上\nQ3\n雇用見込みは？\n→ 31日以上\nQ4\n基本手当の被保険者期間は原則？\n→ 離職前2年間に通算12か月以上\nQ5\n保険料は会社が全額負担？\n→ いいえ。労働者と事業主の双方が負担します。\n「最後のところ、労災と混ぜないでくださいね。」\n【30秒復習】\n① 失業\n→ 基本手当\n② 加入の時間\n→ 週20時間以上\n③ 雇用見込み\n→ 31日以上\n④ 基本手当の原則\n→ 2年間に12か月\n⑤ 保険料\n→ 労働者＋事業主\n⑥ 労災保険料\n→ 事業主が全額\n【一文で覚える】\n雇用保険＝「失業したときの生活や再就職、育児・介護などによる雇用継続を支える保険」。\n「試験直前ならこうです、先輩。」\n失業 → 雇用保険\n基本手当 → 2年に12か月が原則\n加入 → 20時間・31日\n保険料 → 労働者＋会社\n「そして労災は会社が全額。この対比まで一緒に固定しておきましょう。」\n\n\n\n\n\n\n\n\n\n\n\n\n\n就職促進給付と教育訓練給付\n\n\n\n\n\n\n\n\n\n\n\n\n"}, {"n": 35, "title": "就職促進給付と教育訓練給付", "raw": "A【要点｜まず2つを分けましょう】\n「先輩、今回は就職促進給付と教育訓練給付ですね。どちらも雇用保険ですが、目的が違います。」\n一言で分けると、\n就職促進給付\n→ 早く再就職することを後押しする\n教育訓練給付\n→ 勉強・資格取得などの能力開発を支援する\n「つまり――」\n仕事が決まった！ → 就職促進給付\n仕事のために学ぶ！ → 教育訓練給付\nこのイメージから始めましょう。\nB【詳しい解説｜就職促進給付とは？】\n「まず先輩が失業して、基本手当を受けているとします。」\n基本手当を最後まで受け取るまで、\n👨「まだ就職しない方がお得かな……」\nとなったら、早期再就職の邪魔になってしまいますよね。\nそこで、\n👨「早く再就職しました！」\nという人を支援する仕組みがあります。\n代表的なのが、\n再就職手当\nです。\n一定の要件を満たして早期に安定した職業に就いた場合などに支給されます。\n「ポイントは、基本手当の支給残日数を残して再就職することです。」\n【再就職手当はいくら？】\n「ここ、FPでは数字も押さえましょう。」\n基本手当の支給残日数が、\n所定給付日数の3分の2以上残っている\n→ 支給残日数 × 70％ × 基本手当日額\n所定給付日数の3分の1以上残っている\n→ 支給残日数 × 60％ × 基本手当日額\nです。\n「つまり先輩、基本的には早く再就職して残りの日数が多いほど、70％側になりやすいわけですね。」\n覚え方は、\n2/3残す → 70％\n1/3残す → 60％\nです。\n【教育訓練給付とは？】\n「次は就職そのものではなく、学びです。」\nたとえば先輩が、\n「仕事のために資格を取りたい」\n「専門的なスキルを身につけたい」\nと思ったとします。\nでも、\n📚「講座代、高いな……。」\nそこで一定の要件を満たした人が、厚生労働大臣の指定する教育訓練を受講・修了した場合などに、\n受講費用の一部を支給する\nのが、\n教育訓練給付\nです。\n「つまり、雇用保険は失業した後だけじゃないんですよ。」\n働くための能力アップ\nにも使われるんです。\n【教育訓練給付には種類がある】\n「先輩、ここから少し名前が増えます。でも役割で分ければ大丈夫です。」\n代表的には、\n一般教育訓練給付\n特定一般教育訓練給付\n専門実践教育訓練給付\nがあります。\n「ざっくりイメージすると――」\n一般教育訓練\n📚「仕事に役立つ資格・スキルを学ぶ」\n→ 比較的広い教育訓練\n特定一般教育訓練\n📈「早期のキャリア形成につながる訓練」\n→ 一般より再就職・キャリアアップ色が強い\n専門実践教育訓練\n🎓「より専門的・中長期的なキャリア形成につながる訓練」\n→ 専門性の高い教育訓練\n「まずFPでは、教育訓練給付＝指定講座などの受講費用を支援する制度という芯を持っておけば、細かい数字も乗せやすくなります。」\nC【イメージ理解｜失業した先輩に2本の道】\n「先輩が会社を退職しました。」\n雇用保険から、\n💰 基本手当\nを受けながら求職活動をしています。\nここから2つのストーリーを考えます。\n🚪ルート①\n👨「次の会社が早く決まりました！」\n→ 就職促進給付\n「早く仕事に戻れたんですね。じゃあ再就職を後押ししましょう。」\n代表例\n→ 再就職手当\n📚ルート②\n👨「転職のためにスキルを身につけたい。」\n→ 指定された教育訓練を受講\n→ 教育訓練給付\n「勉強にかかる費用の一部を支援しましょう。」\n「ほら先輩、名前だけ見るより簡単でしょう？」\n就職する → 就職促進\n勉強する → 教育訓練\nです。\nD【具体例｜再就職手当を計算してみましょう】\n「先輩の基本手当の所定給付日数が仮に90日だったとします。」\nそして早めに再就職して、\n60日\n残っていました。\n「90日のうち60日ですから？」\n60 ÷ 90\n＝ 3分の2\nつまり、\n支給残日数が所定給付日数の3分の2以上\nです。\n一定の要件を満たせば、\n60日 × 基本手当日額 × 70％\nという形で再就職手当を計算します。\n「だから『失業給付を全部もらい切らないと損』とは単純には言えないんですね。早期再就職を促す仕組みも用意されています。」\n【基本手当との関係を一本につなげる】\n「先輩、雇用保険をストーリーにしますよ。」\n失業した\n↓\n基本手当\nそこから――\n早く再就職できた\n↓\n就職促進給付（代表：再就職手当）\nまたは、\n仕事のために学ぶ\n↓\n教育訓練給付\n「こうやって一本につなげると、雇用保険が何をしたい制度なのか見えてきます。」\n単に、\n失業者にお金を渡す\nのではなく、\n再就職や能力開発を通じて、再び・継続して働けるよう支える\nわけですね。\n【2つを完全比較】\n\t就職促進給付\t教育訓練給付\n目的\t早期再就職などを促進\t能力開発・キャリア形成\nキーワード\t就職\t勉強・講座\n代表例\t再就職手当\t一般・特定一般・専門実践\n何を支援？\t再就職など\t教育訓練費用など\n\n\n「先輩、ここは名称から意味を取れば大丈夫です。」\n【理解確認】\n「はい、4問いきます。」\nQ1\n早期に再就職した人などを支援するのは？\n→ 就職促進給付\nQ2\n就職促進給付の代表的なものは？\n→ 再就職手当\nQ3\n資格・スキルなどのため指定された教育訓練を受ける人を支援するのは？\n→ 教育訓練給付\nQ4\n再就職手当で、基本手当の支給残日数が所定給付日数の3分の2以上なら、基本的な給付率は？\n→ 70％\n「そして3分の1以上なら？」\n→ 60％\n「はい、2/3→70、1/3→60です。」\n【30秒復習】\n① 失業中の中心\n→ 基本手当\n② 早く再就職\n→ 就職促進給付\n③ 代表例\n→ 再就職手当\n④ 2/3以上残す\n→ 70％\n⑤ 1/3以上残す\n→ 60％\n⑥ 学び・資格・能力開発\n→ 教育訓練給付\n【一文で覚える】\n就職促進給付＝「早期の再就職などを後押しする給付」\n教育訓練給付＝「仕事に必要な能力を身につけるための教育訓練費用などを支援する給付」\n「先輩、最後はこれだけです。」\n仕事が決まる → 就職促進\n仕事のために学ぶ → 教育訓練\n「基本手当を真ん中に置いて、失業中・再就職・勉強という流れで雇用保険を整理すると、制度名を丸暗記しなくても思い出せますよ。」\n\n\n\n\n\n\n\n\n\n\n\n\n\n育児休業給付と雇用継続給付\n\n\n\n\n\n\n\n\n\n\n\n\n"}, {"n": 36, "title": "育児休業給付と雇用継続給付", "raw": "A【要点｜まず2つの目的を分けましょう】\n「先輩、今回は育児休業給付と雇用継続給付ですね。どちらも雇用保険から出る給付ですが、まず目的を分けますよ。」\n育児休業等給付\n→ 子どもの育児のために仕事を休む人などを支える\n雇用継続給付\n→ 働き続けることを支える\n「前回までとつなげると――」\n失業した → 基本手当\n早く再就職 → 就職促進給付\n勉強する → 教育訓練給付\n育児で休む → 育児休業等給付\n一定の場合に雇用を継続する → 雇用継続給付\nこういう地図になります。\nB【詳しい解説①｜育児休業給付】\n「先輩、子どもが生まれたとします。」\n👶「育児のためしばらく仕事を休みたい。」\nでも休業すると、\n💰「給料が減る……。」\nそこで、一定の要件を満たす場合に雇用保険から生活を支える給付が行われます。\n代表的なのが、\n育児休業給付金\nです。\n【どれくらいもらえる？】\n「ここは数字が重要ですよ。」\n基本的には育児休業開始から、\n最初の180日まで\n休業開始時賃金日額 × 支給日数 × 67％\n181日目以降\n休業開始時賃金日額 × 支給日数 × 50％\nです。\n「つまり覚え方は――」\n最初の180日 → 67％\nその後 → 50％\nです。\n「先輩、数字だけなら180・67・50ですよ。」\n【いつまで？】\n「原則として、育児休業給付金は子が1歳になるまでの育児休業が中心です。」\nただし、保育所に入れないなど一定の事情がある場合には、\n1歳6か月\nさらに一定の場合には、\n2歳\nまで延長される仕組みがあります。\n「ですから試験用の基本形は、」\n原則1歳 → 条件により1歳6か月 → さらに条件により2歳\nです。\n【出生時育児休業給付金もある】\n「それから先輩、今はもう一つ押さえておきたいものがあります。」\n子どもの出生直後に一定の育児休業を取得した場合の、\n出生時育児休業給付金\nです。\nいわゆる産後パパ育休に対応する給付ですね。\n「つまり現在の育児関係の雇用保険給付は、単純に『育児休業給付金1個だけ』と思わない方がいいです。」\nB【詳しい解説②｜雇用継続給付】\n「では次、雇用継続給付です。」\n名前を分解してください。\n雇用\n＋\n継続\n＋\n給付\nつまり、\n仕事を辞めず、雇用を続けることを支援する\nという発想です。\n代表的なものとして学ぶのが、\n高年齢雇用継続給付\nです。\n【高年齢雇用継続給付とは？】\n「先輩が60歳になったとしましょう。」\n59歳まで\n→ 月給40万円\n60歳以降、再雇用などで\n→ 月給24万円\n「えっ、働き続けているけど給料がかなり下がった……。」\nこうした一定のケースで、\n60歳以降も働き続ける人を支える\nのが高年齢雇用継続給付です。\n【誰でも60歳になればもらえる？】\n「もちろん違います。」\n代表的な要件として、\n雇用保険の被保険者期間が5年以上\nなどがあります。\nさらに60歳以降の賃金が、\n60歳到達時点などの賃金の75％未満\nに低下した場合が基本的な対象です。\n「ここは数字をセットにしますよ。」\n60歳・5年・75％未満\nです。\n【昔の15％で覚えないよう注意】\n「ここ、先輩の教材によって数字が違う可能性があるので注意してください。」\n高年齢雇用継続給付は制度改正があり、2025年4月1日以降に60歳に達する人について、最大給付率が10％に縮小されています。\n以前は最大15％だったため、古い教材では**15％**と載っていることがあります。\n「FPの勉強では、こういう改正部分だけは教材の基準日を確認してくださいね。」\nC【イメージ理解｜「休む」と「働き続ける」】\n「先輩、2人の会社員を並べます。」\n👨Aさん\n子どもが生まれた。\n👨「育児のため仕事を休みます。」\n給与が減る。\n↓\n育児休業等給付\n「Aさんは休業を支えるイメージですね。」\n👴Bさん\n60歳になった。\n👴「給料は下がったけど、会社で働き続けます。」\n↓\n一定の要件を満たす\n↓\n高年齢雇用継続給付\n「Bさんは働き続けることを支える。」\nこの違いです。\nD【具体例｜育児休業給付を数字で】\n「たとえば先輩の休業開始時賃金日額を、分かりやすく1万円とします。」\n30日分なら、\n1万円 × 30日\n＝30万円\n最初の180日以内なら、\n30万円 × 67％\n＝ 20万1,000円\nというイメージです。\n「そして181日目以降なら？」\n30万円 × 50％\n＝ 15万円\nですね。\n※実際の支給には上限・賃金支払い状況などの条件があります。\n【雇用保険の全体像をつなげます】\n「先輩、ここまで来たので一回全部つなぎますよ。」\n状況\t主な給付\n失業した\t基本手当\n早く再就職した\t就職促進給付\nスキルを身につける\t教育訓練給付\n育児で休業する\t育児休業等給付\n高齢期に一定の条件で働き続ける\t雇用継続給付\n\n\n「あ、これなら雇用保険の正体が見えてきません？」\n雇用保険は、\n『失業した人だけを助ける保険』ではない。\n失業 → 再就職 → 学び → 育児 → 雇用継続\nまで、かなり広く働くことを支えているんです。\n【理解確認】\n「はい先輩、5問いきます。」\nQ1\n育児休業開始から180日までの給付率は基本的に？\n→ 67％\nQ2\n181日目以降は？\n→ 50％\nQ3\n育児休業給付金は原則、子が何歳になるまで？\n→ 1歳\nQ4\n高年齢雇用継続給付で覚える被保険者期間は？\n→ 5年以上\nQ5\n60歳以降の賃金が、基準となる賃金の何％未満になることがポイント？\n→ 75％未満\n「はい。数字が多いので意味とセットですよ。」\n【30秒復習】\n① 育児で休む\n→ 育児休業等給付\n② 最初の180日\n→ 67％\n③ 181日目以降\n→ 50％\n④ 育児休業給付金\n→ 原則1歳まで\n⑤ 高年齢雇用継続給付\n→ 60歳以降の雇用継続を支援\n⑥ キーワード\n→ 5年以上・75％未満\n【一文で覚える】\n育児休業等給付＝「育児のために休業する人などの生活と雇用継続を支える給付」。\n雇用継続給付＝「一定の状況でも仕事を続けられるよう支える給付で、代表例が高年齢雇用継続給付」。\n「先輩、最後は場面で覚えましょう。」\n👶『子どもが生まれたから休む』\n→ 育児休業\n👴『60歳を過ぎて給料が下がったけど働く』\n→ 高年齢雇用継続\n「休む育児・続ける高齢者。この対比を頭に置いておけば、かなり思い出しやすくなりますよ。」\n高年齢雇用継続給付と介護休業給付\n"}, {"n": 37, "title": "高年齢雇用継続給付と介護休業給付", "raw": "A【要点｜まず2つを分けましょう】\n「先輩、今回は高年齢雇用継続給付と介護休業給付ですね。どちらも雇用保険ですが、場面がまったく違います。」\n\n高年齢雇用継続給付\n→ 60歳以降、賃金が下がっても働き続ける人を支える\n\n介護休業給付\n→ 家族を介護するため仕事を休む人を支える\n\n「まずはこれだけです。」\n\n👴 60歳以降も働く → 高年齢雇用継続給付\n\n👪 家族の介護で休む → 介護休業給付\n\nB【詳しい解説①｜高年齢雇用継続給付】\n「先輩、60歳になった会社員を想像してください。」\n\n59歳まで\n→ 月給40万円\n\n60歳以降\n→ 再雇用されて月給が28万円に低下\n\nでも、\n\n👴「給料は下がったけど、まだ働きます。」\n\nこういう人の雇用継続を支えるのが、\n\n高年齢雇用継続給付\n\nです。\n\n【どんな人が対象？】\n「重要な条件を数字で整理しますよ。」\n\n代表的なポイントは、\n\n① 60歳以上65歳未満\n\n② 雇用保険の被保険者期間が5年以上\n\n③ 60歳時点などと比べて賃金が75％未満に低下\n\nです。\n\n「先輩、数字だけなら――」\n\n60～64・5年・75％未満\n\nです。\n\n【なぜ75％を見るの？】\n「例えば60歳になる前の賃金が40万円だったとします。」\n\n40万円 × 75％\n＝ 30万円\n\n60歳以降の賃金が、\n\n28万円\n\nなら、\n\n28 ÷ 40\n＝ 70％\n\n「75％未満ですね。」\n\n→ 一定の要件を満たせば、給付対象になり得ます。\n\n【給付率は？】\n「ここは制度改正に注意です、先輩。」\n\n2025年4月1日以降に60歳に達した人については、高年齢雇用継続給付の給付率は、\n\n最大で賃金の10％\n\nとなっています。\n\n「昔は最大15％でした。なので古い教材の**15％**をそのまま覚えないようにしてください。」\n\nB【詳しい解説②｜介護休業給付】\n「今度は年齢ではなく家族の介護です。」\n\nたとえば先輩のお父さんが要介護状態になった。\n\n👨「介護のために仕事を休まないといけない。」\n\nでも、\n\n「休んだら収入が減る……。」\n\nそこで一定の要件を満たした人を雇用保険から支えるのが、\n\n介護休業給付\nです。\n\n【誰の介護でもいいの？】\n「そこ、気になりますよね。」\n\n対象となる家族には、\n\n配偶者・父母・子・配偶者の父母・祖父母・兄弟姉妹・孫\n\nなどが含まれます。\n\nそして、その家族を介護するために一定の介護休業を取得した場合に給付の対象となります。\n\n【何日まで？】\n「先輩、介護休業でかなり重要なのが――」\n\n93日\nです。\n\n対象家族1人につき、\n\n通算93日まで\n\nが基本です。\n\nしかも、\n\n3回まで分割\n\nできます。\n\n「つまり――」\n\n1人の家族につき\n\n→ 通算93日\n\n→ 最大3回に分けられる\n\nです。\n\n【いくらもらえる？】\n介護休業給付の支給額は基本的に、\n\n休業開始時賃金日額 × 支給日数 × 67％\n\nです。\n\n「また67％が出てきましたね。」\n\n育児休業給付でも、\n\n最初の180日 → 67％\n\nでした。\n\n介護休業給付も、\n\n67％\n\nが重要です。\n\n※実際には休業中に支払われた賃金や上限額などによって調整される場合があります。\n\nC【イメージ理解｜「働き続ける」と「介護で一時休む」】\n「先輩、2人並べますよ。」\n\n👴 Aさん・62歳\n60歳前\n→ 月給40万円\n\n現在\n→ 月給28万円\n\n👴「給料は下がった。でも働き続けます。」\n\n→ 高年齢雇用継続給付\n\n「こちらは働き続ける。」\n\n👨 Bさん・45歳\n父親の介護が必要になった。\n\n👨「会社は辞めたくない。でも一時的に休まないと……。」\n\n→ 介護休業\n\n→ 介護休業給付\n\n「こちらは仕事を続けるために一時的に休む。」\n\n「つまり、どちらも最終的には――」\n\n仕事を辞めず、雇用を維持する\n\nための支援なんですね。\n\nただし方法が違います。\n\n高齢者 → 働きながら支援\n\n介護 → 休みながら支援\n\nです。\n\nD【具体例｜数字で覚えましょう】\nケース① 高年齢雇用継続給付\n60歳前の賃金\n→ 40万円\n\n60歳以降\n→ 28万円\n\n28 ÷ 40\n＝ 70％\n\n「75％未満ですね。」\n\nさらに、\n\n雇用保険の被保険者期間\n→ 5年以上\n\nなどの要件を満たせば、\n\n→ 高年齢雇用継続給付の対象になり得る\n\nという流れです。\n\nケース② 介護休業給付\n「先輩が家族の介護のため30日休んだとします。」\n\n仮に、\n\n休業開始時賃金日額\n→ 1万円\n\nとすると、\n\n1万円 × 30日 × 67％\n\n＝ 20万1,000円\n\nというイメージです。\n\n「そして同じ対象家族について利用できる介護休業は、原則として通算93日・3回までの分割です。」\n\n【2つを比較】\n高年齢雇用継続給付\t介護休業給付\n目的\t高齢期の雇用継続\t家族介護と仕事の両立\nイメージ\t働き続ける\t一時的に休む\n重要な年齢\t60歳以上65歳未満\t年齢ではなく要件で判断\n重要数字\t5年以上・75％未満\t93日・3回\n給付率の重要数字\t最大10％※\t67％\n※高年齢雇用継続給付の10％は、2025年4月1日以降に60歳に達した人に適用される現行制度上の数字です。\n\n【ここで雇用保険を整理】\n「先輩、かなり増えてきたので地図に戻りましょう。」\n\n仕事を失った\n→ 基本手当\n\n早く再就職した\n→ 就職促進給付\n\n仕事のために勉強\n→ 教育訓練給付\n\n育児で休む\n→ 育児休業等給付\n\n60歳以降、賃金が下がっても働く\n→ 高年齢雇用継続給付\n\n家族の介護で休む\n→ 介護休業給付\n\n「こうです。全部『雇用保険』の仲間ですが、どんな場面で困っているのかが違うんです。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n60歳以降に賃金が大きく下がっても働き続ける人を支えるのは？\n\n→ 高年齢雇用継続給付\n\nQ2\n高年齢雇用継続給付で重要な被保険者期間は？\n\n→ 5年以上\n\nQ3\n賃金が何％未満に低下することがポイント？\n\n→ 75％未満\n\nQ4\n介護休業は対象家族1人につき通算何日？\n\n→ 93日\n\nQ5\n介護休業給付の基本的な給付率は？\n\n→ 67％\n\n「さらに、93日は？」\n\n→ 3回まで分割可能\n\nです。\n\n【30秒復習】\n① 高年齢雇用継続\n→ 60歳以上65歳未満\n\n② 被保険者期間\n→ 5年以上\n\n③ 賃金低下\n→ 75％未満\n\n④ 現行の最大給付率\n→ 10％※\n\n⑤ 介護休業\n→ 93日・3回まで\n\n⑥ 介護休業給付\n→ 67％\n\n【一文で覚える】\n高年齢雇用継続給付＝「60歳以降、賃金が低下しても働き続ける人を支える給付」。\n\n介護休業給付＝「家族の介護のために休業する人の収入を支える給付」。\n\n「先輩、最後は数字で固定しますよ。」\n\n👴 高年齢 → 60～64・5年・75％\n\n👪 介護 → 93日・3回・67％\n\n「数字を単独で覚えず、誰が・何のためにもらう数字なのかまで一緒に置いておけば、試験中にも引き出しやすくなります。」\n\n公的年金\n"}, {"n": 38, "title": "公的年金", "raw": "A【要点｜まず全体を掴みましょう】\n「先輩、ここから公的年金ですね。最初にここをきれいに理解すると、この後の国民年金・厚生年金がかなり楽になります。」\n\n公的年金を一言でいうと、\n\n老後だけでなく、障害や死亡にも備える社会保険制度\n\nです。\n\n「先輩、『年金＝65歳になったらもらうお金』だけで覚えていません？」\n\n実はそれだと足りません。\n\n公的年金には大きく、\n\n① 老齢 → 老齢年金\n② 障害 → 障害年金\n③ 死亡 → 遺族年金\n\nがあります。\n\nまず、\n\n老・障・遺（ろう・しょう・い）\n\nこの3つを頭に置いてください。\n\nB【詳しい解説｜公的年金は「2階建て」】\n「先輩、公的年金で一番重要なイメージが2階建てです。」\n\n日本の公的年金制度は基本的に、\n\n🏠 2階\n厚生年金\n\n🏠 1階\n国民年金（基礎年金）\n\nという構造です。\n\n「ここで重要なのが、会社員は厚生年金だけに入っているわけではない、ということです。」\n\n会社員などは、\n\n国民年金＋厚生年金\n\nの2階建てになります。\n\n【自営業者は？】\n「先輩が自営業なら？」\n\n基本は、\n\n国民年金\n\nです。\n\n🏠2階　――\n🏠1階　国民年金\n\n【会社員は？】\n「では会社員なら？」\n\n🏠2階　厚生年金\n🏠1階　国民年金\n\nです。\n\nつまり、\n\n自営業者など → 国民年金\n\n会社員など → 国民年金＋厚生年金\n\nというイメージですね。\n\n【国民年金はみんなの土台】\n「ここ、かなり大事ですよ先輩。」\n\n国民年金は原則として、\n\n日本国内に住所がある20歳以上60歳未満の人\n\nが加入する制度です。\n\nそして被保険者は、\n\n第1号\n\n第2号\n\n第3号\n\nの3種類に分かれます。\n\n「介護保険にも第1号・第2号がありましたけど、別物です。混ぜないでくださいね。」\n\n【第1号被保険者】\n主に、\n\n自営業者・学生など\n\nです。\n\n「会社員でも、その扶養配偶者でもない人というイメージですね。」\n\n基本的に、\n\n自分で国民年金保険料を納付します。\n\n【第2号被保険者】\n主に、\n\n厚生年金保険の被保険者\n\nです。\n\nつまり会社員などですね。\n\n「先輩、ここで重要です。」\n\n第2号被保険者は、\n\n国民年金＋厚生年金\n\nという2階建て。\n\nだから、\n\n「会社員だから国民年金には入っていない」\n\n→ ×\n\nです。\n\n【第3号被保険者】\n「そして少し特殊なのが第3号です。」\n\n第2号被保険者に扶養されている一定の配偶者\n\nで、\n\n原則として、\n\n20歳以上60歳未満\n\nです。\n\nたとえば、\n\n👨夫＝会社員・第2号\n👩妻＝一定の要件を満たす扶養配偶者\n\nなら、\n\n👩妻 → 第3号被保険者\n\nとなる場合があります。\n\n【第3号は自分で保険料を払う？】\n「ここ、試験で狙われますよ。」\n\n→ 個別に国民年金保険料を納める必要はありません。\n\n「え、じゃあ無料？」\n\nというより、\n\n第2号被保険者が加入する厚生年金制度全体で負担する仕組み\n\nと理解してください。\n\nC【イメージ理解｜3人並べます】\n「先輩、同級生3人を想像しましょう。」\n\n👨 Aさん・30歳・自営業\n→ 国民年金 第1号\n\n🏠1階\n国民年金\n\n👨‍💼 Bさん・30歳・会社員\n→ 国民年金 第2号\n\n🏠2階\n厚生年金\n\n🏠1階\n国民年金\n\n👩 Cさん・30歳\nBさんに扶養されている配偶者で、要件を満たす。\n\n→ 国民年金 第3号\n\n🏠1階\n国民年金\n\n「これでかなり見えてきましたよね。」\n\n1号 → 自営業・学生など\n\n2号 → 会社員など\n\n3号 → 2号に扶養される一定の配偶者\n\nです。\n\nD【具体例｜年金は老後だけじゃない】\n「では先輩、30歳の会社員がいるとします。」\n\n👨‍💼「まだ30歳だから年金なんて40年近く先だな。」\n\n……と思いますよね。\n\nでも事故などによって一定の障害状態になった場合、\n\n→ 障害年金\n\nの対象になる可能性があります。\n\nまた、その人が亡くなり一定の遺族が残された場合、\n\n→ 遺族年金\n\nの対象になる可能性があります。\n\nそして老後になれば、\n\n→ 老齢年金\n\nです。\n\n「つまり公的年金は――」\n\n若いうちから関係する保険\n\nなんです。\n\n【3つの給付を整理】\n👴 年を取った\n→ 老齢年金\n\n♿ 一定の障害状態になった\n→ 障害年金\n\n👪 被保険者などが死亡した\n→ 遺族年金\n\n「年金＝老後だけ、ではありません。」\n\n老齢・障害・死亡\n\nの3リスクを支えます。\n\n【公的年金の全体図】\n人\t国民年金\t厚生年金\n自営業者など\t第1号\t―\n会社員など\t第2号\t加入\n第2号に扶養される一定の配偶者\t第3号\t―\n「先輩、ここで縦に見るんです。」\n\n自営業\n→ 1階\n\n会社員\n→ 1階＋2階\n\nだから、\n\n公的年金＝2階建て\nなんですね。\n\n【介護保険の1号・2号と混ぜない】\n「先輩、ちょうどさっき介護保険をやったので、ここは要注意です。」\n\n介護保険\n第1号\n→ 65歳以上\n\n第2号\n→ 40～64歳の医療保険加入者\n\n国民年金\n第1号\n→ 自営業者・学生など\n\n第2号\n→ 厚生年金の被保険者\n\n第3号\n→ 第2号に扶養される一定の配偶者\n\n「同じ『第1号・第2号』でも、中身はまったく違います。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n公的年金の3つの大きな給付は？\n\n→ 老齢・障害・遺族\n\nQ2\n公的年金の1階部分は？\n\n→ 国民年金\n\nQ3\n2階部分は？\n\n→ 厚生年金\n\nQ4\n自営業者・学生などは国民年金の何号？\n\n→ 第1号被保険者\n\nQ5\n厚生年金の被保険者は？\n\n→ 国民年金の第2号被保険者\n\n「そして第2号に扶養される一定の配偶者は？」\n\n→ 第3号\n\nです。\n\n【30秒復習】\n① 公的年金の3本柱\n→ 老齢・障害・遺族\n\n② 1階\n→ 国民年金\n\n③ 2階\n→ 厚生年金\n\n④ 自営業者・学生など\n→ 第1号\n\n⑤ 会社員など\n→ 第2号\n\n⑥ 第2号に扶養される一定の配偶者\n→ 第3号\n\n【一文で覚える】\n公的年金＝「国民年金を1階、厚生年金を2階とする仕組みで、老齢・障害・死亡の3つのリスクを支える制度」。\n\n「先輩、最後に頭の中で家を建ててください。」\n\n🏠2階＝厚生年金\n🏠1階＝国民年金\n\nそして玄関に、\n\n1号＝自営業など\n2号＝会社員など\n3号＝2号の扶養配偶者\n\nと書いておく。\n\n「ここから老齢基礎年金、老齢厚生年金、障害年金、遺族年金へ進んでも、全部この家の中の話です。まずこの2階建ての地図を崩さないでくださいね。」\n\n任意加入被保険者\n"}, {"n": 39, "title": "任意加入被保険者", "raw": "A【要点｜まず「強制加入との違い」です】\n「先輩、今回は任意加入被保険者ですね。名前のとおり、ポイントは『本来は国民年金への強制加入の対象ではないけれど、一定の条件で自分から加入する人』です。」\n\n一言でいうと、\n\n国民年金の強制加入対象ではない人が、年金額を増やしたり受給資格を確保したりするため、一定の要件を満たして任意で加入する制度\n\nです。\n\nたとえば代表的なのが、\n\n60歳になったけれど、国民年金を満額もらえるだけの納付期間がない人\n\nですね。\n\n「先輩、まずは――」\n\n60歳で終わった。でも足りない。→ 任意加入\n\nこのイメージを持ちましょう。\n\nB【詳しい解説｜そもそもなぜ必要なの？】\n「前回やりましたね。国民年金の強制加入は原則として――」\n\n日本国内に住所がある20歳以上60歳未満\n\nです。\n\nでは、先輩が60歳になりました。\n\n20歳から60歳まで40年間、きっちり保険料を納めていれば、\n\n「はい、満額に必要な期間を満たしていますね。」\n\nとなります。\n\nでも途中で未納期間などがあって、\n\n👨「60歳になったけど、納付済期間が40年に足りない……。」\n\nという人もいます。\n\n「もう60歳だから終わり？」\n\n→ 一定の条件を満たせば、終わりではありません。\n\n自分から国民年金に加入して保険料を納めることで、\n\n老齢基礎年金の額を増やす\n\nことができます。\n\nこれが任意加入です。\n\n【代表① 日本国内の60歳以上65歳未満】\n「まずFPで一番イメージしやすい人です。」\n\n日本国内に住所がある60歳以上65歳未満の人\n\nで、老齢基礎年金を満額受給できないなど一定の要件を満たす場合、\n\n→ 任意加入できる\n\nという仕組みがあります。\n\nたとえば、\n\n20～60歳\n→ 納付済期間が38年\n\n60歳になった\n↓\n満額に必要な40年まで\n↓\nあと2年足りない\n\n「だったら任意加入して、60～62歳まで保険料を納める。」\n\n→ 40年に近づける\n\nという使い方ができます。\n\n【代表② 海外に住む日本人】\n「先輩、もう一つ重要なのが海外です。」\n\n国民年金の強制加入は原則、\n\n日本国内に住所がある20歳以上60歳未満\n\nでした。\n\nでは30歳の日本人が海外へ移住したら？\n\n「日本国内に住所がないですよね。」\n\nそこで一定の場合、\n\n海外に住む20歳以上65歳未満の日本国籍の人\n\nは国民年金に任意加入できます。\n\n「つまり――」\n\n🇯🇵日本国内\n→ 原則、20～59歳は強制加入\n\n🌎海外在住の日本人\n→ 一定の条件で任意加入\n\nという違いです。\n\n【代表③ 65歳を超えても加入できる場合】\n「先輩、じゃあ65歳になったら絶対終了？」\n\n→ 例外があります。\n\n老齢基礎年金を受給するためには、原則として10年以上の受給資格期間が必要です。\n\nそこで、65歳になっても受給資格期間を満たしていない一定の人については、\n\n70歳になるまで任意加入できる特例\n\nがあります。\n\n「ここ、目的が違うことに注目してください。」\n\n60～64歳の任意加入\n主に\n→ 年金額を満額に近づける\n\n65～69歳の特例的な任意加入\n→ 受給資格期間を確保する\n\n「同じ任意加入でも、目的を分けると覚えやすいですよ。」\n\nC【イメージ理解｜年金スタンプカード】\n「先輩、国民年金を40個のマスがあるスタンプカードだと思ってください。」\n\n20歳\n⬜⬜⬜⬜⬜……\n\n毎年保険料を納めて、\n\n🟩🟩🟩🟩……\n\n60歳になりました。\n\nでも、\n\n38年分しか埋まっていない。\n\n👨「先輩、あと2個空いてます。」\n\n普通なら強制加入期間は60歳まで。\n\nでも任意加入を使って、\n\n60歳\n→ 🟩\n\n61歳\n→ 🟩\n\nとして、\n\n40年分に近づける。\n\n「これが任意加入の一番分かりやすいイメージです。」\n\nD【具体例｜38年しか納めていなかったら？】\n「では先輩、具体的に考えましょう。」\n\nAさんは60歳。\n\n国民年金の保険料納付済期間などを確認すると、\n\n38年間\n\nでした。\n\n満額の老齢基礎年金に必要な納付期間は原則、\n\n40年間（480月）\n\nです。\n\n不足は、\n\n40年 − 38年\n＝ 2年\n\nですね。\n\nAさんが一定の要件を満たして任意加入し、\n\n60～62歳までの2年間について保険料を納めれば、\n\n→ 老齢基礎年金を満額に近づける\n\nことができます。\n\n「つまり任意加入は、60歳から新しく別の年金を作る制度じゃありません。」\n\n国民年金の加入期間を補う\n\nというイメージです。\n\n【ただし、480月を超えて増やせるわけではない】\n「ここも大事ですよ。」\n\n👨「じゃあ40年間払った人も、60歳からさらに5年間払えばもっと老齢基礎年金が増える？」\n\n→ そういう制度ではありません。\n\n任意加入によって、老齢基礎年金の計算上の納付済期間を480月を超えて増やしていくことはできません。\n\nだから、\n\n満額に足りない部分を埋める\n\nというイメージが大切です。\n\n【第1・第2・第3号との関係】\n「先輩、前回の地図に追加しましょう。」\n\n第1号\n→ 自営業者・学生など\n\n第2号\n→ 厚生年金の被保険者\n\n第3号\n→ 第2号に扶養される一定の配偶者\n\nそして、\n\n任意加入被保険者\n→ 強制加入の対象外だけど、一定の条件で自分から国民年金に加入する人\n\nです。\n\n「『第4号被保険者』ではありませんからね。」\n\n【重要数字を整理】\n数字\t意味\n20歳\t国民年金の強制加入開始の原則\n60歳\t強制加入終了の原則\n60～64歳\t国内での代表的な任意加入\n40年＝480月\t老齢基礎年金の満額計算の基本\n10年\t老齢基礎年金の原則的な受給資格期間\n70歳\t受給資格不足の場合の特例的な任意加入の上限\n「先輩、数字だけ覚えようとすると混ざります。」\n\n20→60＝原則\n\n60→65＝不足分を補う\n\n65→70＝10年不足への特例\n\nという時間軸で覚えましょう。\n\n【理解確認】\n「はい、先輩。5問いきます。」\n\nQ1\n国民年金の強制加入年齢は原則？\n\n→ 20歳以上60歳未満\n\nQ2\n60歳になったけれど満額に足りない場合は？\n\n→ 一定の条件で任意加入できる\n\nQ3\n老齢基礎年金の満額計算の基本となる期間は？\n\n→ 40年＝480月\n\nQ4\n海外在住の日本人は絶対に国民年金に加入できない？\n\n→ いいえ。一定の条件で任意加入できます。\n\nQ5\n受給資格期間が不足している一定の人は何歳まで特例的に任意加入できる？\n\n→ 70歳まで\n\n「はい。ここまで分かれば十分戦えます。」\n\n【30秒復習】\n① 強制加入\n→ 原則20～59歳\n\n② 60歳になった\n→ 強制加入は原則終了\n\n③ 満額に足りない\n→ 任意加入\n\n④ 満額の基本\n→ 40年＝480月\n\n⑤ 海外在住の日本人\n→ 一定条件で任意加入可\n\n⑥ 受給資格不足の特例\n→ 70歳まで\n\n【一文で覚える】\n任意加入被保険者＝「国民年金の強制加入対象ではない人が、年金額を増やしたり受給資格期間を満たしたりするため、一定の条件で自ら加入する人」。\n\n「先輩、最後は時間軸です。」\n\n20歳 ───── 60歳\n→ 原則、強制加入\n\n60歳 ─ 65歳\n→ 「満額まで足りない」なら任意加入を検討\n\n65歳 ─ 70歳\n→ 「そもそも受給資格の10年に足りない」場合の特例\n\n「60歳で足りなければ任意で補う。まずこの芯を固定しておけば大丈夫ですよ。」\n\n免除と猶予制度\n"}, {"n": 40, "title": "保険料免除制度と納付猶予制度", "raw": "A【要点｜「払わなくていい」だけで覚えないでください】\n「先輩、今回は国民年金の保険料免除制度と納付猶予制度ですね。ここ、どちらも『今は保険料を払わなくていい』ので混ざりやすいんです。」\n\nでも一番大事な違いはこれです。\n\n免除\n→ 払わなくてよい＋老齢基礎年金額にも一定割合が反映される\n\n納付猶予\n→ 今は払わなくてよい＋追納しない限り老齢基礎年金額には反映されない\n\n「つまり――」\n\n免除＝支払いも軽くするし、年金額にも一部残る\n\n猶予＝支払いを後回しにする\n\nです。\n\nB【詳しい解説｜そもそも何のため？】\n「先輩が国民年金の第1号被保険者だとします。」\n\n毎月、国民年金保険料を払う必要があります。\n\nでも、\n\n👨「収入が減って、今月から保険料を払うのが厳しい……。」\n\nこんなときに何もせず放置すると、\n\n→ 未納\n\nになってしまいます。\n\n「そこで、ちゃんと申請して一定の要件を満たせば――」\n\n→ 保険料免除\n\nまたは\n\n→ 納付猶予\n\nを利用できるわけです。\n\n【免除制度とは？】\n「まず免除です。」\n\n所得が一定以下などの要件を満たす場合に、申請して承認されると、\n\n国民年金保険料の全部または一部が免除\n\nされます。\n\n免除には、\n\n全額免除\n\n4分の3免除\n\n半額免除\n\n4分の1免除\n\nがあります。\n\n「0か100かじゃないんですね。」\n\n【免除すると将来の年金はゼロ？】\n「ここが超重要です、先輩。」\n\n→ ゼロではありません。\n\n全額免除の期間でも、老齢基礎年金額の計算上、\n\n2分の1\n\nが反映されます。\n\n「え？保険料を払ってないのに、なぜ半分？」\n\n国民年金の基礎年金には国庫負担が入っているからです。\n\nだから、\n\n全額免除＝年金額も0\n\nではありません。\n\n【免除の年金額への反映】\n「先輩、ここは表にすると強いです。」\n\n保険料\t老齢基礎年金額への反映\n全額納付\t8/8\n1/4免除\t7/8\n半額免除\t6/8\n3/4免除\t5/8\n全額免除\t4/8＝1/2\n「これ、規則があります。」\n\n免除される割合が大きくなるほど、\n\n→ 将来の年金への反映も小さくなる。\n\nでも、\n\n全額免除でも1/2残る\n\nんです。\n\n【納付猶予とは？】\n「次は納付猶予です。」\n\nこちらは、\n\n👨「今はお金がない。でも将来払えるかもしれない。」\n\nという人について、一定の要件を満たせば、\n\n今の保険料納付を猶予する\n\n制度です。\n\n「ただし免除とは決定的に違います。」\n\n納付猶予期間は、\n\n受給資格期間には算入されます。\n\nでも、\n\n追納しなければ、老齢基礎年金額の計算には反映されません。\n\n【ここが最重要｜未納との違い】\n「先輩、『猶予しても年金額に反映されないなら、未納と同じじゃない？』って思いません？」\n\n「あ、そこです。全然違います。」\n\n未納\n❌ 老齢基礎年金の受給資格期間\n→ 原則入らない\n\n❌ 老齢基礎年金額\n→ 反映されない\n\nさらに、障害年金・遺族年金の納付要件にも影響する可能性があります。\n\n納付猶予\n⭕ 受給資格期間\n→ 入る\n\n❌ 年金額\n→ 追納しない限り反映されない\n\n「だから、お金が厳しいときに何も手続きせず未納にするのと、きちんと猶予の承認を受けるのでは意味が大きく違うんです。」\n\nC【イメージ理解｜先輩のスタンプカード】\n「前回の任意加入で使った年金スタンプカードをもう一度出しましょう。」\n\n🟩 全額納付\n「ちゃんと払いました。」\n\n→ 資格期間にも入る\n\n→ 年金額にも全部反映\n\n🟨 全額免除\n「払えないので、正式に免除してもらいました。」\n\n→ 資格期間に入る\n\n→ 年金額にも1/2反映\n\n🟦 納付猶予\n「今は払えないので待ってもらいました。」\n\n→ 資格期間に入る\n\n→ 年金額にはまだ反映されない\n\n→ 後から追納すれば反映できる\n\n⬜ 未納\n「払わず、手続きもしませんでした。」\n\n→ 資格期間に原則入らない\n\n→ 年金額にも反映されない\n\n「先輩、だから一番避けたいのが何もせず未納なんです。」\n\nD【具体例｜1年間払えなかったら？】\n「先輩が国民年金保険料を1年間払えないとします。」\n\nケース① 全額免除が認められた\n1年間\n→ 受給資格期間には1年間として入る\n\nそして老齢基礎年金額では、\n\n→ その期間の1/2が反映\n\nされます。\n\nケース② 納付猶予が認められた\n1年間\n→ 受給資格期間には1年間として入る\n\nでも追納しなければ、\n\n→ 年金額には反映されない\n\nケース③ 何もしないで未納\n1年間\n→ 受給資格期間に原則入らない\n\n→ 年金額にも反映されない\n\n「同じ『そのとき保険料を払っていない』でも、結果が全然違いますよね。」\n\n【後から払える？｜追納】\n「先輩、免除や猶予を受けたあと、収入が増えたとしましょう。」\n\n👨「あのとき払えなかった分、今なら払えます。」\n\n→ 追納\n\nができます。\n\n原則として、\n\n10年以内\n\nなら追納できます。\n\n追納すれば、\n\n→ 将来の老齢基礎年金額を増やせる\n\nわけですね。\n\n「ただし、免除・猶予を受けた期間の翌年度から数えて3年度目以降に追納する場合は、当時の保険料に一定の加算額が上乗せされます。」\n\n【免除・猶予・未納を完全比較】\n受給資格期間\t年金額への反映\t追納\n全額納付\t⭕\t全部\t―\n全額免除\t⭕\t1/2\t⭕\n納付猶予\t⭕\tなし※\t⭕\n未納\t❌原則\tなし\t免除等の追納とは別\n※追納すれば年金額に反映されます。\n\n「先輩、この表はかなり重要です。」\n\n【学生には別制度もある】\n「ちなみに先輩、学生の場合は？」\n\n学生には、\n\n学生納付特例制度\n\nがあります。\n\nこれも基本的な考え方は、\n\n今の納付を猶予する\n\nものです。\n\n承認された期間は、\n\n→ 受給資格期間には算入\n\nでも、\n\n→ 追納しないと老齢基礎年金額には反映されない\n\nという点が重要です。\n\n「なので、学生納付特例は『学生だから保険料が完全に免除され、そのまま年金額にも反映される』ではありませんよ。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n全額免除期間は受給資格期間に入る？\n\n→ 入る\n\nQ2\n全額免除期間は老齢基礎年金額にどれくらい反映？\n\n→ 1/2\n\nQ3\n納付猶予期間は受給資格期間に入る？\n\n→ 入る\n\nQ4\n納付猶予期間は、追納しなくても年金額に反映される？\n\n→ されない\n\nQ5\n免除・猶予された保険料は原則何年以内なら追納できる？\n\n→ 10年以内\n\n「はい。これが言えればかなり整理できています。」\n\n【30秒復習】\n① 全額免除\n→ 資格○・金額1/2\n\n② 納付猶予\n→ 資格○・金額×\n\n③ 未納\n→ 資格×・金額×\n\n④ 追納\n→ 原則10年以内\n\n⑤ 一部免除\n→ 3/4・半額・1/4免除\n\n⑥ 学生\n→ 学生納付特例\n\n【一文で覚える】\n免除＝「今は払わなくてよく、受給資格期間に入り、年金額にも一定割合が反映される」。\n\n猶予＝「今は払わなくてよく、受給資格期間には入るが、追納しない限り年金額には反映されない」。\n\n「先輩、最後はこれで固定です。」\n\n免除 → 資格○・金額△\n\n猶予 → 資格○・金額×\n\n未納 → 資格×・金額×\n\n「全部『払っていない』ように見えますけど、中身はまったく違います。特に猶予と未納は同じではない。ここ、試験で引っかからないでくださいね。」\n\n老齢基礎年金\n"}, {"n": 41, "title": "老齢基礎年金", "raw": "A【要点｜老齢基礎年金って何？】\n「先輩、いよいよ老齢基礎年金ですね。ここは今まで勉強した『国民年金』が、老後にどうやってお金として返ってくるのか、という話です。」\n\n一言でいうと、\n\n国民年金から、原則65歳から受け取る老後の年金\n\nです。\n\nまず3つ。\n\n① 原則65歳から\n\n② 受給資格期間は原則10年以上\n\n③ 40年＝480月きちんと納付すると満額\n\n「先輩、まずは――」\n\n65・10・40（480）\n\nこの数字を柱にしましょう。\n\nB【詳しい解説｜まず「10年」と「40年」を分ける】\n「ここ、ものすごく混ざりやすいです。」\n\n老齢基礎年金には、\n\n年金をもらえるか？\n\nと\n\nいくらもらえるか？\n\nという2つの話があります。\n\n① もらえるか？ → 10年\n老齢基礎年金を受け取るには、原則として、\n\n受給資格期間が10年以上\n\n必要です。\n\n「じゃあ10年間あれば満額？」\n\n→ 違います。\n\n10年は、\n\n受け取るための最低ライン\n\nです。\n\n② 満額もらえるか？ → 40年\n20歳から60歳まで、\n\n40年間＝480月\n\nすべて保険料納付済期間などとして満額の条件を満たせば、\n\n→ 老齢基礎年金は満額\n\nとなります。\n\n「だから――」\n\n10年 → もらう権利\n\n40年 → 満額\n\nです。\n\n「先輩、この2つを絶対に混ぜないでください。」\n\n【受給資格期間には何が入る？】\n「じゃあ『10年以上』って、保険料を実際に払った期間だけ？」\n\n→ それだけではありません。\n\n代表的には、\n\n保険料納付済期間\n\n＋\n\n保険料免除期間\n\nなどを合わせて受給資格期間を判定します。\n\nさらに一定の**合算対象期間（カラ期間）**も、受給資格期間の判定には含まれます。\n\n「ただし、先輩。」\n\n受給資格期間に入ること\n\nと\n\n年金額に反映されること\n\nは別問題です。\n\nここ、前回の免除・猶予制度とつながっています。\n\n【前回の免除・猶予と接続】\n「思い出してください。」\n\n全額納付\n→ 受給資格期間 ○\n→ 年金額 全部反映\n\n全額免除\n→ 受給資格期間 ○\n→ 年金額 一定割合反映\n\n納付猶予\n→ 受給資格期間 ○\n→ 追納しなければ年金額 反映なし\n\n学生納付特例\n→ 受給資格期間 ○\n→ 追納しなければ年金額 反映なし\n\n未納\n→ 原則、受給資格期間 ×\n→ 年金額 ×\n\n「ほら先輩。前回やった話が、そのまま老齢基礎年金につながりましたね。」\n\n【何歳から受け取る？】\n基本は、\n\n65歳\nです。\n\n「でも先輩、65歳以外では絶対にもらえない？」\n\n→ いえ。\n\n受給開始時期を動かす制度があります。\n\n早く受け取る\n→ 繰上げ受給\n\n遅く受け取る\n→ 繰下げ受給\n\nです。\n\n【繰上げ受給】\n「先輩がこう考えました。」\n\n👨「65歳まで待たずに、60歳から欲しい。」\n\n一定の条件で、\n\n60歳から65歳になるまでの間に繰上げ\n\nできます。\n\nただし、\n\n早く受け取る代わりに年金額が減額\n\nされます。\n\n現在の基本的な減額率は、対象者によって、\n\n1か月繰り上げるごとに0.4％\n\nです。\n\n「たとえば5年＝60か月早めたら？」\n\n60 × 0.4％\n＝ 24％減\n\nです。\n\n※生年月日によって旧ルールの0.5％が適用される場合があります。\n\n【繰下げ受給】\n「反対です。」\n\n👴「65歳ではまだ受け取らず、もっと後から受け取ります。」\n\n→ 繰下げ受給\n\n現在は一定の要件のもと、\n\n原則75歳まで\n\n繰り下げることができます。\n\nそして、\n\n1か月遅らせるごとに0.7％増額\n\nです。\n\n65歳→75歳なら、\n\n10年＝120か月\n\n120 × 0.7％\n＝ 84％増\n\n「かなり増えますよね。ただし、その分受給開始が遅くなるので、単純に増額率だけで有利不利を決める話ではありません。」\n\nC【イメージ理解｜年金の蛇口】\n「先輩、老齢基礎年金を65歳にある蛇口だと思ってください。」\n\n普通なら、\n\n65歳\n🚰「開けます」\n\n→ 通常額\n\nでも、\n\n60歳\n👨「早く開けたい！」\n\n→ 繰上げ\n\n🚰早く水が出る\nでも\n→ 毎回出る量が少なくなる\n\n反対に、\n\n70歳・75歳など\n👴「まだ開けません。」\n\n→ 繰下げ\n\n🚰受け取り開始は遅い\nでも\n→ その後の年金額が増える\n\n「これなら繰上げ・繰下げの方向を間違えません。」\n\n早い → 減る\n\n遅い → 増える\n\nです。\n\nD【具体例｜10年と40年の違い】\n「AさんとBさんを比べましょう。」\n\n👴Aさん\n受給資格期間\n→ 10年\n\n「10年以上あるから？」\n\n→ 老齢基礎年金を受け取るための資格を満たし得ます。\n\nでも、\n\n→ 40年ではない\n\nので、満額という意味ではありません。\n\n👴Bさん\n20歳～60歳まで、\n\n40年＝480月\n\n満額の条件を満たす形で納付。\n\n→ 満額の老齢基礎年金\n\n「ここですよ、先輩。」\n\n10年＝入口\n\n40年＝満額\n\nです。\n\n【さらにCさん｜38年だった】\n「前に任意加入でやりましたね。」\n\n60歳時点で、\n\n→ 38年\n\nしかない。\n\n満額まで、\n\n→ あと2年\n\n一定の要件を満たして、\n\n任意加入\n\n↓\n\n2年間納付\n\n↓\n\n40年＝480月に近づける\n\n↓\n\n老齢基礎年金を満額に近づける\n\n「任意加入を勉強した理由が、ここで完全につながりましたね。」\n\n【これまでの知識を一本につなげる】\n「先輩、ここかなり大事なので流れで見てください。」\n\n20歳\n↓\n国民年金に原則加入\n↓\n保険料を納付\n↓\n払えないとき\n→ 免除・猶予\n↓\n60歳\n↓\n満額に足りない\n→ 条件を満たせば任意加入\n↓\n65歳\n↓\n老齢基礎年金\n\n「今までバラバラに見えていた制度、全部この一本の道の上にあるんです。」\n\n【重要数字を整理】\n数字\t意味\n10年\t受給資格期間の原則的な最低ライン\n40年＝480月\t満額の基本\n65歳\t原則的な受給開始\n60歳～\t繰上げ可能\n0.4％/月\t現行の基本的な繰上げ減額率※\n～75歳\t現行制度の繰下げ上限の基本\n0.7％/月\t繰下げ増額率\n※生年月日により0.5％の旧ルールが適用される場合があります。\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n老齢基礎年金は原則何歳から？\n\n→ 65歳\n\nQ2\n受給資格期間は原則何年以上？\n\n→ 10年以上\n\nQ3\n満額の基本となる納付期間は？\n\n→ 40年＝480月\n\nQ4\n繰上げると年金額は？\n\n→ 減る\n\nQ5\n繰下げると？\n\n→ 増える\n\n「はい。そして数字は――」\n\n早める → 原則0.4％/月減\n\n遅らせる → 0.7％/月増\n\nです。\n\n【30秒復習】\n① 老齢基礎年金\n→ 国民年金の老後給付\n\n② 原則開始\n→ 65歳\n\n③ 受給資格\n→ 10年以上\n\n④ 満額\n→ 40年＝480月\n\n⑤ 繰上げ\n→ 早くもらう・減額\n\n⑥ 繰下げ\n→ 遅くもらう・増額\n\n【一文で覚える】\n老齢基礎年金＝「受給資格期間が原則10年以上ある人が65歳から受け取る国民年金の老齢給付で、40年＝480月が満額の基本」。\n\n「先輩、最後は数字を一本にします。」\n\n10年 → もらう権利\n\n40年 → 満額\n\n65歳 → 原則スタート\n\n早める → 減る\n\n遅らせる → 増える\n\n「特に10年と40年の意味の違い。ここを理解しておけば、老齢基礎年金の問題はかなり整理しやすくなりますよ。」\n\n繰上げ支給と繰下げ支給\n"}, {"n": 42, "title": "繰上げ支給と繰下げ支給", "raw": "A【要点｜「早くもらうか、遅くもらうか」です】\n「先輩、今回は老齢基礎年金の繰上げ支給と繰下げ支給ですね。これは数字より先に、交換条件を理解してください。」\n\n老齢基礎年金は原則、\n\n65歳から受給\n\nでした。\n\nでも、\n\n繰上げ支給\n→ 65歳より早くもらう代わりに、年金額が減る\n\n繰下げ支給\n→ 65歳より遅くもらう代わりに、年金額が増える\n\nです。\n\n「つまり――」\n\n早く → 少なく\n\n遅く → 多く\n\nこれが全部の土台です。\n\nB【詳しい解説①｜繰上げ支給】\n「先輩が62歳になったとしましょう。」\n\n👨「65歳まで待たずに、もう年金を受け取りたい。」\n\n一定の条件を満たせば、\n\n60歳以上65歳未満\n\nで老齢基礎年金を繰り上げて受給できます。\n\nただし、\n\n「先輩、早く受け取れるならノーペナルティ……なんて都合よくはいきません。」\n\n年金額が減額されます。\n\n【どれくらい減る？】\n現在の基本ルールでは、\n\n1か月繰り上げるごとに0.4％減額\n\nです。\n\n「じゃあ65歳ではなく64歳からなら？」\n\n12か月早いので、\n\n0.4％ × 12か月 = 4.8％減\n\nです。\n\n60歳まで繰り上げたら？\n65歳より、\n\n60か月早い\n\nですね。\n\n0.4％ × 60\n＝ 24％\n\nしたがって、\n\n24％減額\n\nです。\n\n「そして先輩、ここがものすごく重要。」\n\n減額された年金額は、その後も原則として続きます。\n\n「65歳になったら元の金額に戻る」\n\nではありません。\n\n【繰上げの重要な注意点】\n「もう一つ。繰上げは『とりあえず早くもらって、後からやっぱりやめる』という軽い選択ではありません。」\n\n老齢基礎年金の繰上げ請求をすると、\n\n原則として取り消すことができません。\n\n「だから――」\n\n👨「60歳で繰上げ！」\n\n↓\n\n👨「やっぱり65歳から普通にもらう形に戻したい！」\n\n→ 原則できない\n\nということです。\n\nB【詳しい解説②｜繰下げ支給】\n「では反対です。」\n\n65歳になった先輩が、\n\n👴「まだ年金を受け取らなくても生活できるから、後ろにずらそう。」\n\n→ 繰下げ\n\nです。\n\n一定の条件のもと、\n\n66歳以後75歳まで\n\n繰り下げることができます。\n\n【どれくらい増える？】\n「こちらは――」\n\n1か月繰り下げるごとに0.7％増額\n\nです。\n\nたとえば、\n\n65歳 → 70歳\n5年＝60か月\n\n60 × 0.7％\n＝ 42％増\n\nです。\n\n65歳 → 75歳\n10年＝120か月\n\n120 × 0.7％\n＝ 84％増\n\nです。\n\n「だから数字としては――」\n\n70歳 → ＋42％\n\n75歳 → ＋84％\n\nですね。\n\n【繰下げも増額された状態が続く】\n「じゃあ75歳から受け取って、80歳になったら元の額に戻る？」\n\n→ 戻りません。\n\n繰下げによる増額率は、その後の年金額に反映され続けます。\n\nつまり、\n\n繰上げ → 減額された年金\n\n繰下げ → 増額された年金\n\nを基本的にその後も受け取る、ということです。\n\nC【イメージ理解｜蛇口をいつ開ける？】\n「先輩、前回の年金の蛇口をもう少し具体的にしますよ。」\n\n🚰65歳に蛇口がある\n普通なら、\n\n65歳\n→ 🚰開ける\n→ 100％\n\nです。\n\n🏃60歳で開ける\n👨「早く欲しい！」\n\n→ 60か月早い\n\n→ 24％減\n\n→ 76％\n\n「早くから水を飲める代わりに、蛇口から出る量が少なくなる。」\n\nこれが繰上げ。\n\n🧘75歳まで待つ\n👴「まだ開けません。」\n\n10年間待つ。\n\n→ 120か月 × 0.7％\n\n→ 84％増\n\n→ 184％\n\n「水を飲み始めるのは遅いけど、その後は蛇口から出る量が多くなる。」\n\nこれが繰下げです。\n\nD【具体例｜年額80万円なら？】\n「計算してみましょう。」\n\n本来65歳から受け取る老齢基礎年金が、仮に\n\n年80万円\n\nだったとします。\n\n① 60歳まで繰上げ\n60か月 × 0.4％\n＝ 24％減\n\n80万円 × 76％\n\n＝ 60万8,000円\n\n「60歳から早く受け取れますが、年額はこのイメージまで下がります。」\n\n② 65歳から普通に受給\n→ 80万円\n\n③ 70歳まで繰下げ\n60か月 × 0.7％\n＝ 42％増\n\n80万円 × 142％\n\n＝ 113万6,000円\n\n④ 75歳まで繰下げ\n120か月 × 0.7％\n＝ 84％増\n\n80万円 × 184％\n\n＝ 147万2,000円\n\n「並べると分かりやすいですよ。」\n\n開始年齢\t増減率\t仮に65歳時80万円なら\n60歳\t－24％\t約60.8万円\n65歳\t基準\t80万円\n70歳\t＋42％\t約113.6万円\n75歳\t＋84％\t約147.2万円\n【じゃあ繰下げた方が絶対得？】\n「先輩、ここで『84％も増えるなら75歳まで待てば絶対得じゃない？』と思いますよね。」\n\n……そこは注意です。\n\n繰下げれば、\n\n毎年受け取る額は増える\n\n一方で、\n\n65歳から受け取れたはずの年金を、その期間は受け取らない\n\nことになります。\n\n逆に繰上げは、\n\n毎年の金額は減る\n\nけれど、\n\n早い時期から受け取れる\n\nわけです。\n\nだから、\n\n増減率だけで単純に得・損を決めるものではありません。\n\n受給期間、生活資金、働き方などによって意味が変わります。\n\n【繰上げ・繰下げを完全比較】\n繰上げ\t繰下げ\n基準\t65歳より前\t65歳より後\n年齢\t60～64歳\t66～75歳が基本\n1か月あたり\t－0.4％※\t＋0.7％\n最大の基本\t－24％※\t＋84％\nイメージ\t早く・少なく\t遅く・多く\n※繰上げの0.4％は1962年4月2日以後生まれの場合。以前生まれの人には0.5％のルールがあります。\n\n【数字の覚え方】\n「先輩、数字をバラバラに覚えないでください。」\n\n繰上げ\n60 → 65\n\n1か月\n→ －0.4％\n\n5年＝60か月\n→ －24％\n\n繰下げ\n65 → 75\n\n1か月\n→ ＋0.7％\n\n10年＝120か月\n→ ＋84％\n\n「だから――」\n\n上げ＝0.4減\n\n下げ＝0.7増\n\nです。\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n老齢基礎年金の原則的な受給開始年齢は？\n\n→ 65歳\n\nQ2\n60歳から受け取るのは？\n\n→ 繰上げ支給\n\nQ3\n現在の基本的な繰上げ減額率は1か月あたり？\n\n→ 0.4％\n\nQ4\n繰下げ増額率は1か月あたり？\n\n→ 0.7％\n\nQ5\n75歳まで繰り下げると最大何％増？\n\n→ 84％\n\n「はい。そして60歳まで繰り上げると？」\n\n→ 24％減\n\nです。\n\n【30秒復習】\n① 基準\n→ 65歳\n\n② 繰上げ\n→ 早くもらう\n\n③ 繰上げ\n→ 0.4％/月減\n\n④ 60歳なら\n→ 24％減\n\n⑤ 繰下げ\n→ 0.7％/月増\n\n⑥ 75歳なら\n→ 84％増\n\n【一文で覚える】\n繰上げ＝「65歳より早く受け取る代わりに、年金額を減らす」。\n\n繰下げ＝「65歳より遅く受け取る代わりに、年金額を増やす」。\n\n「先輩、最後はこれだけ頭に残してください。」\n\n🏃早く → 0.4％ずつ減る\n\n🧘遅く → 0.7％ずつ増える\n\n60歳 → －24％\n\n65歳 → 基準\n\n75歳 → ＋84％\n\n「この一本の数直線を頭に置けば、繰上げと繰下げを逆にすることはまずなくなりますよ。」\n付加年金\n"}, {"n": 43, "title": "付加年金", "raw": "A【要点｜付加年金って何？】\n「先輩、今回は付加年金ですね。これは数字がものすごく覚えやすい制度です。」\n\n一言でいうと、\n\n国民年金の保険料に月400円を上乗せして払うことで、将来の老齢基礎年金を増やす制度\n\nです。\n\n基本は、\n\n毎月＋400円払う\n\n↓\n\n将来の年金が\n\n200円 × 付加保険料を納めた月数\n\nだけ毎年増える。\n\n「先輩、まずは――」\n\n払う400円 → もらう200円×月数\n\nこれを固定しましょう。\n\nB【詳しい解説｜誰でも入れるの？】\n「先輩、ここが最初の注意点です。」\n\n付加年金は誰でも自由に利用できるわけではありません。\n\n代表的な対象は、\n\n国民年金の第1号被保険者\n\nと、\n\n一定の任意加入被保険者\n\nです。\n\nつまりイメージとしては、\n\n👨‍🍳自営業者など\n→ 利用できる\n\n一方、\n\n👨‍💼会社員＝第2号被保険者\n→ 利用できない\n\nという整理です。\n\n【いくら払う？】\n「これは簡単です。」\n\n通常の国民年金保険料に、\n\n月額400円\n\nを上乗せします。\n\nたとえば1年間なら、\n\n400円 × 12か月\n＝ 4,800円\n\n追加で払うことになります。\n\n【将来いくら増える？】\n「ここが付加年金の面白いところですよ、先輩。」\n\n年金の増加額は、\n\n200円 × 付加保険料納付月数\nです。\n\nたとえば1年間＝12か月払ったなら、\n\n200円 × 12\n\n＝ 年2,400円\n\n老齢基礎年金に上乗せされます。\n\n「待ってください。払ったのは？」\n\n→ 4,800円\n\n「1年間にもらえる増額は？」\n\n→ 2,400円\n\nということは――？\n\n2年間受け取れば4,800円\n\nですね。\n\n【つまり2年で元が取れる？】\n「はい。単純計算ならそういうことです。」\n\n1か月分で考えても、\n\n払う\n→ 400円\n\n将来、毎年増える\n→ 200円\n\n1年目\n→ 200円\n\n2年目\n→ 200円\n\n合計\n→ 400円\n\n「だから付加年金は、受給開始後2年以上受け取ると、単純な名目額では支払った付加保険料を上回る構造になっています。」\n\nここ、FPでは非常に覚えやすいポイントです。\n\nC【イメージ理解｜年金に小さなオプションを付ける】\n「先輩、スマホのオプションみたいに考えてください。」\n\n通常の国民年金が、\n\n📱基本プラン\n\nだとします。\n\nそこに、\n\n👨「老後の年金をちょっと増やしたい。」\n\n↓\n\n月400円の\n\n『年金増額オプション』\n\nを追加する。\n\nそれが付加保険料です。\n\nそして老後になると、\n\n老齢基礎年金\n＋\n付加年金\n\nとして受け取る。\n\n「つまり別の巨大な年金制度に入るというより、老齢基礎年金に小さく上乗せする制度というイメージですね。」\n\nD【具体例｜10年間払ったら？】\n「先輩が40歳から50歳まで、10年間付加保険料を払ったとしましょう。」\n\n10年\n＝ 120か月\n\nまず支払った金額は、\n\n400円 × 120\n\n＝ 48,000円\n\nです。\n\nでは将来の付加年金額は？\n\n200円 × 120\n\n＝ 24,000円\n\n「ここで注意。」\n\n24,000円を一回だけもらう\n\nではありません。\n\n基本的に、\n\n年額24,000円が老齢基礎年金に上乗せ\n\nされます。\n\n受給1年目\n＋24,000円\n\n受給2年目\n＋24,000円\n\n合計\n＝ 48,000円\n\n「あ、支払った48,000円と同じになりましたね。」\n\n3年目以降\nさらに＋24,000円ずつ。\n\n「だから2年という数字が出てくるわけです。」\n\n【国民年金基金との関係】\n「先輩、ここも試験で注意です。」\n\n自営業者などが老後の年金を上乗せする仕組みには、\n\n国民年金基金\n\nもあります。\n\nでも、\n\n付加保険料と国民年金基金は原則として併用できません。\n\n「両方乗せてさらに増やそう！」\n\n→ 原則できません。\n\nここはセットで覚えてください。\n\n【免除中は？】\n「じゃあ国民年金保険料そのものを免除されている人が、付加保険料だけ400円払うことはできる？」\n\n→ 原則できません。\n\n付加保険料は、通常の国民年金保険料に上乗せして納付する仕組みだからです。\n\n【数字をまとめます】\n項目\t数字\n付加保険料\t月400円\n付加年金額\t200円 × 納付月数／年\n1年間納付\t4,800円\n1年間納付した分の年金増額\t年2,400円\n単純な回収期間\t2年\n「先輩、これはもう――」\n\n400 → 200 → 2年\nです。\n\n【老齢基礎年金とのつながり】\n「ここまで勉強した流れにつなげますよ。」\n\n国民年金保険料を納める\n↓\n老齢基礎年金\n\nさらに対象者が、\n\n月400円\n↓\n付加保険料\n\nを納める\n\n↓\n\n65歳以降などに、\n\n老齢基礎年金\n＋\n付加年金\n\nを受け取る。\n\n「つまり付加年金は、老齢基礎年金のちょい足しですね。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n付加保険料はいくら？\n\n→ 月400円\n\nQ2\n付加年金額の計算式は？\n\n→ 200円 × 付加保険料納付月数\n\nQ3\n主な対象者は？\n\n→ 国民年金第1号被保険者など\n\nQ4\n10年間＝120か月払った場合の付加年金額は？\n\n200円 × 120\n\n→ 年24,000円\n\nQ5\n国民年金基金と併用できる？\n\n→ 原則できない\n\n「はい。かなり整理しやすい制度でしょう？」\n\n【30秒復習】\n① 何に上乗せ？\n→ 国民年金\n\n② 誰が中心？\n→ 第1号被保険者など\n\n③ 月いくら？\n→ 400円\n\n④ 年金額\n→ 200円×納付月数\n\n⑤ 単純計算で何年？\n→ 2年\n\n⑥ 国民年金基金との併用\n→ 原則不可\n\n【一文で覚える】\n付加年金＝「第1号被保険者などが月400円を上乗せして納め、将来『200円×納付月数』の年額を老齢基礎年金に上乗せする制度」。\n\n「先輩、これは最後に数字だけでも思い出せます。」\n\n400・200・2\n400円払う\n↓\n200円×月数が毎年増える\n↓\n2年で支払額相当\n\n「この400→200→2、付加年金を見た瞬間に出せるようにしておきましょう。」\n\n老齢厚生年金\n"}, {"n": 44, "title": "老齢厚生年金", "raw": "A【要点｜「2階部分の老後の年金」です】\n「先輩、今回は老齢厚生年金ですね。前にやった『公的年金は2階建て』を思い出してください。」\n\n🏠 2階 → 厚生年金\n🏠 1階 → 国民年金（基礎年金）\n\nつまり老齢厚生年金とは、\n\n厚生年金に加入していた会社員などが、原則65歳から老齢基礎年金に上乗せして受け取る年金\n\nです。\n\n会社員だった人ならイメージは、\n\n老齢基礎年金 ＋ 老齢厚生年金\n\nですね。\n\n「先輩、まずは――」\n\n基礎＝1階\n\n厚生＝2階\n\nこれを崩さないでください。\n\nB【詳しい解説｜老齢基礎年金との違いは？】\n「先輩が会社員として働いているとしましょう。」\n\n会社員は、\n\n国民年金の第2号被保険者\n\nであると同時に、\n\n厚生年金保険の被保険者\n\nでした。\n\nだから老後になると、\n\n1階部分\n→ 老齢基礎年金\n\nさらに、\n\n2階部分\n→ 老齢厚生年金\n\nという形になるわけです。\n\n【老齢厚生年金をもらう条件は？】\n「基本となる条件を押さえましょう。」\n\n原則として、\n\n① 65歳以上\n\n② 老齢基礎年金の受給資格期間を満たしている\n\n③ 厚生年金の被保険者期間がある\n\nことが基本です。\n\n「老齢基礎年金では受給資格期間が原則10年以上でしたね。」\n\nですから、\n\n受給資格10年以上\n＋\n厚生年金加入歴あり\n↓\n原則65歳から老齢厚生年金\n\nというイメージです。\n\n【金額はみんな同じ？】\n「ここが老齢基礎年金との大きな違いです。」\n\n老齢厚生年金は、\n\n会社員時代の報酬額\n\nと\n\n厚生年金への加入期間\n\nなどによって金額が変わります。\n\nつまり、\n\n長く加入する\n＋\n報酬が高い\n\nほど、基本的には老齢厚生年金も大きくなります。\n\n「先輩、2人比べますよ。」\n\nAさん\n厚生年金\n→ 10年間加入\n\nBさん\n厚生年金\n→ 40年間加入\n\n同じ条件なら、\n\n→ Bさんの方が厚生年金部分は大きくなりやすい\n\nですよね。\n\nさらに同じ加入期間でも、\n\n報酬が高い人\n↓\n納める厚生年金保険料も大きくなる\n↓\n将来の報酬比例部分も大きくなる\n\nという仕組みです。\n\nだから、\n\n報酬比例\nという言葉が重要になります。\n\n【報酬比例部分】\n「名前のまま読んでください。」\n\n報酬\nに\n比例\n\nする部分です。\n\nつまり、\n\n働いていたときの報酬などに応じて年金額が変わる\n\nということ。\n\n「老齢厚生年金を見たら――」\n\n報酬＋加入期間\n\nこの2つを思い浮かべましょう。\n\nC【イメージ理解｜年金マンションの2階】\n「先輩、公的年金マンションに戻ります。」\n\n👨‍🍳自営業者\n🏠2階　なし\n🏠1階　老齢基礎年金\n\n👨‍💼会社員\n🏠2階　老齢厚生年金\n🏠1階　老齢基礎年金\n\n「会社員は働いている間、厚生年金に加入しているから、老後に2階部分が乗ってくるんです。」\n\nだから、\n\n会社員だから老齢厚生年金だけ\n\nではありません。\n\n正しくは、\n\n老齢基礎年金＋老齢厚生年金\nです。\n\nD【具体例｜会社員として30年間働いたら？】\n「先輩が会社員として30年間働いたとします。」\n\nその間、\n\n→ 厚生年金に加入\n\nそして老齢基礎年金の受給資格も満たして65歳になりました。\n\nすると、\n\n1階\nこれまでの国民年金の加入記録などに基づく\n\n→ 老齢基礎年金\n\nそして、\n\n2階\n会社員として厚生年金に加入していた30年間の報酬・加入期間などに基づく\n\n→ 老齢厚生年金\n\nが加わります。\n\n「だから会社員期間は、老後の年金に2階部分を積み上げている期間だと思えばいいんです。」\n\n【繰上げ・繰下げとの関係】\n「先輩、直前にやった話ともつながります。」\n\n老齢厚生年金も原則、\n\n65歳\n\nからです。\n\nそして一定の条件のもと、\n\n繰上げ・繰下げ\n\nがあります。\n\n「なので基本イメージは同じ。」\n\n早く受け取る\n→ 繰上げ・減額\n\n遅く受け取る\n→ 繰下げ・増額\n\nです。\n\n【在職老齢年金｜働きながらもらったら？】\n「先輩、ここから老齢厚生年金特有の重要ポイントです。」\n\n65歳を過ぎても、\n\n👴「まだ会社で働きます。」\n\nという人はいますよね。\n\nそして、\n\n給与を受け取りながら老齢厚生年金も受け取る\n\nことがあります。\n\nこのとき一定以上の収入がある場合に、老齢厚生年金の一部または全部が支給停止される仕組みが、\n\n在職老齢年金\nです。\n\n【老齢基礎年金まで止まるの？】\n「ここ、試験で引っかけやすいですよ。」\n\n在職老齢年金による調整の対象となるのは、\n\n老齢厚生年金\n\nです。\n\n老齢基礎年金は在職老齢年金による支給停止の対象ではありません。\n\n「つまり――」\n\n🏠2階の厚生年金\n→ 調整されることがある\n\n🏠1階の基礎年金\n→ この仕組みでは止めない\n\nです。\n\n【加給年金｜年金版の家族手当】\n「もう一つ、老齢厚生年金で出てくるのが加給年金です。」\n\n先輩、会社の、\n\n家族手当\n\nみたいなイメージを持ってください。\n\n厚生年金の被保険者期間など一定の要件を満たす人に、\n\n一定の配偶者や子がいる場合\n\n老齢厚生年金に加算されることがあります。\n\nこれが、\n\n加給年金額\nです。\n\n「細かい条件は後で加給年金を単独でやるときに整理すれば大丈夫です。今は――」\n\n老齢厚生年金＋一定の家族 → 加給年金\n\nとだけ置いておきましょう。\n\n【老齢基礎年金との違いを整理】\n老齢基礎年金\t老齢厚生年金\n年金の階\t1階\t2階\n制度\t国民年金\t厚生年金\n主な対象\t国民年金加入者\t会社員などの厚生年金加入者\n原則開始\t65歳\t65歳\n金額\t納付済期間などで計算\t報酬・加入期間などで計算\nキーワード\t40年＝480月\t報酬比例\n「先輩、老齢基礎年金と厚生年金をごちゃ混ぜにしないためには、1階・2階で考えるのが一番です。」\n\n【ここまで全部つなげます】\n「公的年金を最初から一本にしますよ。」\n\n自営業者など\n国民年金\n↓\n第1号被保険者\n↓\n65歳\n↓\n老齢基礎年金\n\n会社員など\n国民年金\n＋\n厚生年金\n↓\n第2号被保険者\n↓\n65歳\n↓\n老齢基礎年金＋老齢厚生年金\n\n「はい。これで全体の位置が見えましたね。」\n\n【理解確認】\n「先輩、5問いきます。」\n\nQ1\n老齢厚生年金は公的年金の何階部分？\n\n→ 2階\n\nQ2\n原則何歳から？\n\n→ 65歳\n\nQ3\n会社員は老齢厚生年金だけ受け取る？\n\n→ いいえ。要件を満たせば老齢基礎年金＋老齢厚生年金\n\nQ4\n老齢厚生年金の金額に大きく関係するものは？\n\n→ 報酬額と厚生年金の加入期間など\n\nQ5\n在職老齢年金で老齢基礎年金も支給停止される？\n\n→ されません。\n\n「はい。この5つが骨格です。」\n\n【30秒復習】\n① 1階\n→ 老齢基礎年金\n\n② 2階\n→ 老齢厚生年金\n\n③ 原則開始\n→ 65歳\n\n④ 厚生年金の金額\n→ 報酬＋加入期間\n\n⑤ 働きながら年金\n→ 在職老齢年金\n\n⑥ 一定の家族がいる\n→ 加給年金が加算される場合あり\n\n【一文で覚える】\n老齢厚生年金＝「厚生年金に加入していた会社員などが、原則65歳から老齢基礎年金に上乗せして受け取る、報酬や加入期間などに応じた2階部分の年金」。\n\n「先輩、最後はこの家だけ覚えてください。」\n\n🏠2階：老齢厚生年金\n\n🏠1階：老齢基礎年金\n\n「会社員として働いている期間は、1階だけじゃなく2階にも積み上げている。老齢厚生年金の話が複雑になっても、この家に戻れば位置を見失いませんよ。」\n\n経過的加算\n"}, {"n": 45, "title": "経過的加算", "raw": "A【要点｜経過的加算って何？】\n「先輩、経過的加算ですね。名前だけ見ると、ものすごく分かりにくいです。でも役割を知れば意外と単純ですよ。」\n\n一言でいうと、\n\n老齢厚生年金に加算される、“老齢基礎年金だけでは拾いきれない部分を補うためのお金”\n\nです。\n\n特に重要なのが、\n\n20歳未満や60歳以後の厚生年金加入期間\n\nです。\n\n「え？ 厚生年金には入っていたのに、基礎年金には十分反映されない期間があるの？」\n\nはい。そこが今回の核心です。\n\nB【詳しい解説｜なぜそんな加算が必要なの？】\n「先輩、まず老齢基礎年金の基本を思い出してください。」\n\n満額の基本は、\n\n20歳～60歳の40年間＝480月\n\nでしたね。\n\nつまり老齢基礎年金では、\n\n20歳から60歳まで\n\nという年齢の枠が非常に重要です。\n\nでは、こんな人はどうでしょう。\n\n👨「18歳から会社員として厚生年金に入っていました。」\n\n18歳\n↓\n19歳\n↓\n20歳\n↓\n……\n↓\n60歳\n\n「18歳・19歳も厚生年金保険料を払っているのに、その期間は老齢基礎年金の20～60歳という基本的な計算枠から外れますよね。」\n\nここで、\n\n厚生年金に入っていた期間なのに、基礎年金側では十分拾われない部分\n\nが出てきます。\n\n「そのズレを調整する役割の一つが――」\n\n経過的加算\nなんです。\n\n【60歳以後も同じ】\n「反対側も考えてみましょう。」\n\n👴「60歳を過ぎても会社員として働いて、厚生年金に加入しています。」\n\nたとえば、\n\n60歳\n↓\n61歳\n↓\n62歳\n\nまで厚生年金に加入した。\n\nでも老齢基礎年金の基本となる40年間は、\n\n20歳～60歳\n\nでした。\n\nそこで60歳以後についても、\n\n厚生年金には加入しているけれど、老齢基礎年金の通常の計算ではそのまま対応しない期間\n\nが生じます。\n\n「だから――」\n\n20歳より前\n\nまたは\n\n60歳より後\n\nの厚生年金加入期間がある場合、\n\n経過的加算が関係してくることがある。\n\nまずこのイメージを持ってください。\n\n【そもそも何を調整しているの？】\n「ここから一段深くいきますよ、先輩。」\n\n老齢厚生年金には、現在の制度になる前の仕組みとのつながりがあります。\n\n昔の厚生年金には、\n\n定額部分\n\nという仕組みがありました。\n\n一方、現在は基礎年金制度があるので、\n\n老齢基礎年金\n\nが1階部分を担っています。\n\nそこで65歳以降、\n\n厚生年金の定額部分に相当する額\n\nと\n\n老齢基礎年金に相当する額\n\nの間に差が生じることがあります。\n\nその差を調整するのが、\n\n経過的加算\n\nです。\n\n「だから正式な計算のイメージは――」\n\n定額部分相当額 − 老齢基礎年金相当額\n\n→ 経過的加算\n\nとなります。\n\nC【イメージ理解｜20～60歳という箱】\n「先輩、大きな箱を想像してください。」\n\n老齢基礎年金の箱です。\n\n       老齢基礎年金の基本範囲\n      ┌─────────────┐\n18 19 │20 21 22 …… 58 59│ 60 61 62\n      └─────────────┘\n          40年間\n「20～59歳の部分は箱の中に入っています。」\n\nでも先輩が、\n\n18歳から会社員\n\nだったら？\n\n18・19歳\n→ 箱の左にはみ出す\n\nさらに、\n\n62歳まで会社員\n\nだったら？\n\n60・61歳\n→ 箱の右にはみ出す\n\nでもその期間も、\n\n厚生年金には加入している。\n\n「この“はみ出した部分”をイメージすると、経過的加算の役割がかなり分かりやすくなります。」\n\n老齢基礎年金\n20～60歳が中心\n\n厚生年金\n20歳未満や60歳以後でも、適用事業所で働くなど要件を満たせば加入することがある。\n\n↓\n\nズレが発生\n\n↓\n\nその調整として\n\n経過的加算\nが出てくる。\n\nD【具体例｜18歳から62歳まで会社員】\n「先輩、Aさんを登場させます。」\n\nAさんは、\n\n18歳から62歳まで会社員\n\nとして厚生年金に加入していたとしましょう。\n\n期間を並べると、\n\n18～19歳\n→ 厚生年金 ○\n→ 老齢基礎年金の20～60歳という基本枠の外\n\n20～59歳\n→ 厚生年金 ○\n→ 基礎年金の基本枠にも入る\n\n60～61歳\n→ 厚生年金 ○\n→ 基礎年金の基本枠の外\n\nですね。\n\n「つまり――」\n\n18──20────────────────60──62\n ↑       基礎年金の基本範囲       ↑\n厚生年金                         厚生年金\nこのような制度上のズレを調整するため、\n\n老齢厚生年金に経過的加算が加わる場合がある\n\nということです。\n\n【報酬比例部分とは別ですよ】\n「先輩、ここも整理しておきましょう。」\n\n老齢厚生年金には中心となる、\n\n報酬比例部分\n\nがあります。\n\nこれは、\n\n給与・賞与などの報酬\n＋\n加入期間\n\nなどに応じて計算される部分。\n\n一方、\n\n経過的加算\n\nは、\n\n→ 基礎年金との制度上のズレを調整する部分\n\nです。\n\nつまり、\n\n報酬比例部分＝働いて得た報酬などに応じた本体部分\n\n経過的加算＝基礎年金とのズレの調整役\n\nと分けましょう。\n\n【名前の意味を分解】\n「そもそも、なぜ『経過的』なんて変な名前なのか。」\n\nこれは、\n\n旧制度から現在の基礎年金制度へ移っていく過程（経過）で生じる差を調整する\n\nという背景があるからです。\n\nだから、\n\n経過的\n→ 制度移行に伴う調整\n\n加算\n→ 老齢厚生年金にプラス\n\nと分解すると覚えやすいですよ。\n\n【試験での重要ポイント】\n「先輩、FPならまずここを押さえましょう。」\n\nポイント\t経過的加算\nどこにつく？\t老齢厚生年金\n何のため？\t基礎年金との制度上の差を調整\n特にイメージしやすい期間\t20歳未満・60歳以後の厚生年金加入期間\n老齢基礎年金の基本期間\t20歳～60歳の40年間\n性格\t調整のための加算\n【理解確認】\n「はい先輩、4問いきます。」\n\nQ1\n経過的加算は、老齢基礎年金と老齢厚生年金のどちらに加算される？\n\n→ 老齢厚生年金\n\nQ2\n老齢基礎年金の満額計算の基本となる年齢範囲は？\n\n→ 20歳から60歳まで\n\nQ3\n18歳から厚生年金に加入していた場合、18～19歳の期間は？\n\n→ 厚生年金には加入している一方、老齢基礎年金の20～60歳という基本枠の外\n\nQ4\nそのような制度上のズレを調整するものは？\n\n→ 経過的加算\n\n「はい。これで芯は取れています。」\n\n【30秒復習】\n① どこ？\n→ 老齢厚生年金\n\n② 役割は？\n→ 調整\n\n③ 何との調整？\n→ 老齢基礎年金\n\n④ 基礎年金の基本範囲\n→ 20～60歳\n\n⑤ イメージする期間\n→ 20歳未満・60歳以後\n\n⑥ 名前\n→ 経過的加算\n\n【一文で覚える】\n経過的加算＝「老齢厚生年金に加算される、厚生年金の定額部分相当額と老齢基礎年金相当額との差を調整する仕組み」。\n\n「先輩、試験中に細かい理屈を忘れても、これを思い出してください。」\n\n20歳｜━━━━ 基礎年金 ━━━━｜60歳\n←厚生年金　　　　　　　　　厚生年金→\n**　　はみ出した期間に注目**\n\n「厚生年金には入っているのに、基礎年金の20～60歳の箱からはみ出す期間がある。そのズレを調整する。――まずこの絵で経過的加算を掴んでおけば大丈夫です。」\n\n配偶者加給年金と振替加算\n"}, {"n": 46, "title": "配偶者加給年金額と振替加算", "raw": "A【要点｜この2つは「バトンタッチ」で覚えます】\n「先輩、配偶者加給年金と振替加算ですね。ここ、別々に暗記するとかなり混乱します。最初から1本の流れとして覚えましょう。」\n\nまずイメージはこれです。\n\n夫（年上）65歳\n→ 老齢厚生年金に配偶者加給年金額が加算\n\n↓ 配偶者が65歳になる\n\n配偶者加給年金額が終了\n\n↓\n\n一定の要件を満たせば、\n\n配偶者自身の老齢基礎年金に振替加算\n\nです。\n\n「つまり先輩――」\n\n加給年金 → 65歳 → 振替加算\nです。\n\nただし、誰にでも付くわけではなく、年齢・加入期間・生年月日などの要件があります。\n\nB【詳しい解説①｜配偶者加給年金額】\n「まず加給年金からです。」\n\n会社員として長く厚生年金に加入していたAさんが65歳になりました。\n\n👨Aさん 65歳\n👩配偶者 60歳\n\nAさんは老齢厚生年金を受け取ります。\n\nでも配偶者はまだ65歳ではありません。\n\n「先輩、この年齢差に注目です。」\n\n一定の要件を満たしていれば、\n\nAさんの老齢厚生年金\n\nに、\n\n配偶者加給年金額\n\nが上乗せされます。\n\nイメージとしては、\n\n年金版の家族手当\nですね。\n\n【重要｜誰の年金に付く？】\n「ここ、間違えないでください。」\n\n配偶者が60歳だからといって、\n\n👩配偶者の年金に加給年金が付く\n\nではありません。\n\n→ ×\n\n加算されるのは、\n\n👨 厚生年金を受け取る側の老齢厚生年金\n\nです。\n\nつまり、\n\nAさんの老齢厚生年金＋配偶者加給年金額\n\nとなります。\n\n【代表的な条件】\n「FPでまず重要なのは、厚生年金の加入期間です。」\n\n老齢厚生年金を受ける人について原則、\n\n厚生年金保険の被保険者期間が20年以上\n\nなどの要件があります。\n\nさらに配偶者についても、\n\n65歳未満\n\nであることなどの要件があります。\n\n「先輩、まずは――」\n\n厚生年金20年＋65歳未満の配偶者\n\nという骨格を覚えておきましょう。\n\nB【詳しい解説②｜配偶者が65歳になった！】\n「では5年後です。」\n\n👨Aさん 70歳\n👩配偶者 65歳\n\n配偶者も、\n\n老齢基礎年金\n\nを受け取る年齢になりました。\n\nすると、\n\n👨Aさんについていた\n配偶者加給年金額\n\nは原則として終了します。\n\n「え、じゃあ完全になくなるだけ？」\n\nここで登場するのが、\n\n振替加算\nです。\n\n一定の要件を満たせば、\n\nこれまで厚生年金側についていた加算が終わった後、\n\n配偶者自身の老齢基礎年金に振替加算が加算\n\nされます。\n\n【「振替」という名前の意味】\n「先輩、名前がそのままヒントになっています。」\n\n65歳前\n\n👨夫側の老齢厚生年金\n＋\n配偶者加給年金額\n\n↓\n\n👩配偶者65歳\n\n↓\n\n👨側の加給年金額\n→ 終了\n\n↓\n\n👩配偶者自身の老齢基礎年金\n＋\n振替加算\n\n「だから振替なんです。」\n\nC【イメージ理解｜手当のバトン】\n「先輩、一本のバトンを想像してください。」\n\n👨65歳\n「まだ妻は60歳か。」\n\n🏃【加給年金のバトン】\n\nこの時点では、\n\n夫側の老齢厚生年金\n\nにバトンがあります。\n\nそして5年後。\n\n👩「私も65歳になりました。」\n\nすると、\n\n👨「じゃあ、この加給年金は終了。」\n\n↓\n\n一定の条件を満たせば、\n\n👩の老齢基礎年金に\n\n振替加算\n\nが付く。\n\n「はい、バトンが夫側から妻側へ移ったように見えますよね。」\n\nこれが一番覚えやすいです。\n\nただし制度上、加給年金額がそのまま同額で移動するわけではありません。\n\n加給年金額と振替加算額は別の計算\n\nです。\n\n「“振替”という名前だから同額がそのまま移る、と思わないでくださいね。」\n\nD【具体例｜夫65歳・妻60歳】\n「時系列で完全に固めますよ。」\n\n【時点①】\n👨夫：65歳\n👩妻：60歳\n\n夫は厚生年金に長期間加入しており、その他の要件も満たしている。\n\n↓\n\n夫が、\n\n老齢基礎年金\n＋\n老齢厚生年金\n＋\n配偶者加給年金額\n\nを受け取る。\n\n「加給は誰についています？」\n\n→ 夫側の老齢厚生年金\n\nですね。\n\n【5年後】\n👨夫：70歳\n👩妻：65歳\n\n妻が65歳になった。\n\n↓\n\n夫についていた\n\n配偶者加給年金額\n\n→ 原則終了\n\nそして妻が一定の要件を満たせば、\n\n妻の\n\n老齢基礎年金\n＋\n振替加算\n\nとなります。\n\n【図にすると一発です】\n夫65歳・妻60歳\n\n👨 老齢厚生年金\n　└→ 配偶者加給年金額\n\n👩 まだ65歳未満\n\n　　　　↓\n\n　　5年経過\n\n　　　　↓\n\n夫70歳・妻65歳\n\n👨 配偶者加給年金額\n→ 終了\n\n👩 老齢基礎年金\n　└→ 振替加算（要件を満たす場合）\n\n「先輩、文章よりこの流れを覚えてください。」\n\n【振替加算には生年月日の条件がある】\n「ここ、試験対策ではかなり重要です。」\n\n振替加算はすべての世代につく制度ではありません。\n\n原則として対象となる配偶者は、\n\n1926年（大正15年）4月2日～1966年（昭和41年）4月1日生まれ\n\nです。\n\nそして若い世代になるにつれて振替加算額は小さくなり、\n\n1966年4月2日以後生まれの人には、原則として振替加算はありません。\n\n「なぜ？」\n\n昔の制度から現在の制度への移行に伴う、世代間の差を調整する性格があるからです。\n\nだから若い世代には基本的に必要なくなっていくんですね。\n\n【経過的加算との違い】\n「先輩、直前に経過的加算をやったので、ここも整理しましょう。」\n\n経過的加算\n→ 本人の老齢厚生年金\n\n→ 基礎年金との制度上の差を調整\n\n配偶者加給年金額\n→ 老齢厚生年金\n\n→ 一定の配偶者などがいる場合の加算\n\n振替加算\n→ 配偶者自身の老齢基礎年金\n\n→ 配偶者が65歳になった後などに一定要件で加算\n\n「同じ『加算』でも、付く場所が違います。」\n\n【3つを整理】\n制度\tどこに付く？\tイメージ\n経過的加算\t老齢厚生年金\t制度のズレを調整\n配偶者加給年金額\t老齢厚生年金\t年金版の家族手当\n振替加算\t配偶者の老齢基礎年金\t65歳でバトンタッチ\n「先輩、この表はかなり重要ですよ。」\n\n【理解確認】\n「はい、5問いきます。」\n\nQ1\n配偶者加給年金額は誰の年金に加算される？\n\n→ 厚生年金を受給する側の老齢厚生年金\n\nQ2\n厚生年金の加入期間は原則何年以上がポイント？\n\n→ 20年以上\n\nQ3\n配偶者が原則何歳になると配偶者加給年金額が終了？\n\n→ 65歳\n\nQ4\nその後、一定要件を満たす配偶者自身の何に加算される？\n\n→ 老齢基礎年金\n\nQ5\nその加算の名前は？\n\n→ 振替加算\n\n「はい。これで流れは完成です。」\n\n【30秒復習】\n① 加給年金\n→ 年金版の家族手当\n\n② どこにつく？\n→ 老齢厚生年金\n\n③ 厚生年金期間\n→ 原則20年以上\n\n④ 配偶者\n→ 65歳未満がポイント\n\n⑤ 配偶者65歳\n→ 加給年金終了\n\n⑥ 一定要件なら\n→ 配偶者の老齢基礎年金に振替加算\n\n【一文で覚える】\n配偶者加給年金額＝「一定の要件を満たす65歳未満の配偶者などがいる場合に、老齢厚生年金に加算される年金版の家族手当」。\n\n振替加算＝「配偶者が65歳になって加給年金額が終了した後、一定の要件を満たす場合に、その配偶者自身の老齢基礎年金に加算されるもの」。\n\n「先輩、最後はこれだけです。」\n\n👨65歳・👩60歳\n→ 👨の厚生年金に加給\n\n　　　　⬇️\n\n👩65歳\n\n　　　　⬇️\n\n👨 加給終了\n→ 👩の基礎年金に振替加算\n\n「加給 → 65歳 → 振替」\n「このバトンタッチの絵を頭に置いておけば、加給年金と振替加算を別々に丸暗記しなくて済みますよ。」\n\n在職老齢年金\n"}, {"n": 47, "title": "在職老齢年金", "raw": "A【要点｜働きながら年金をもらう人の調整制度】\n「先輩、今回は在職老齢年金ですね。これは2026年4月に基準額が変わったので、今の数字で覚えましょう。」\n\n一言でいうと、\n\n厚生年金に加入しながら働いて老齢厚生年金を受け取る人について、賃金と老齢厚生年金が一定額を超えると、老齢厚生年金の一部または全部を支給停止する仕組み\n\nです。\n\n2026年度の重要数字は、\n\n65万円\nです。2026年4月から、支給停止を判定する基準額は月65万円になっています。\n\n「先輩、まずは――」\n\n給料＋老齢厚生年金 → 65万円を超えるか？\n\nここから考えます。\n\nB【詳しい解説｜なぜ年金が止まるの？】\n「たとえば65歳になった先輩が、会社を辞めずに働き続けたとします。」\n\n👴「給料をもらっています。」\n\nさらに、\n\n👴「老齢厚生年金も受給しています。」\n\nつまり、\n\n給与などの報酬\n＋\n老齢厚生年金\n\nの両方がある状態ですね。\n\nこの合計が一定の基準を超える場合、\n\n→ 老齢厚生年金の一部または全部が支給停止\n\nされます。\n\nこれが在職老齢年金です。\n\n【65万円を超えたらどうなる？】\n「ここ、先輩。65万円を1円でも超えたら年金全部没収……ではありません。」\n\n基本的な支給停止月額は、\n\n（基本月額＋総報酬月額相当額－65万円）÷2\n\nです。\n\nつまり、\n\n65万円を超えた部分の1/2\n\nが老齢厚生年金から支給停止される、と考えると分かりやすいです。\n\nC【イメージ理解｜65万円の線】\n「先輩、一本の線を引きます。」\n\n給料等＋老齢厚生年金\n\n　　　　　↓\n\n──────── 65万円\n\nここまで\n→ 年金カットなし\n\n超えた部分\n→ その1/2を支給停止\n\n「だから65万円は“崖”じゃありません。」\n\n超えた瞬間に全部なくなるのではなく、\n\n超過部分の半分ずつ調整する坂道\n\nだと思ってください。\n\nD【具体例｜給与60万円＋年金10万円】\n「計算してみましょう。」\n\n仮に、\n\n給与・賞与を月額換算したもの\n→ 60万円\n\n老齢厚生年金の基本月額\n→ 10万円\n\nとします。\n\n合計は、\n\n60万円＋10万円＝70万円\n\nですね。\n\n基準は65万円なので、\n\n70万円－65万円\n＝ 5万円超過\n\nその半分、\n\n5万円÷2\n＝ 2万5,000円\n\nが支給停止。\n\nしたがって単純化すると、\n\n本来の老齢厚生年金10万円\n－2万5,000円\n\n＝ 7万5,000円支給\n\nというイメージです。\n\n「先輩、ここは――」\n\n超過額÷2\n\nですよ。\n\n【老齢基礎年金はどうなる？】\n「ここ、かなり重要です。」\n\n👴「じゃあ老齢基礎年金も減らされる？」\n\n→ 減らされません。\n\n在職老齢年金で支給停止の対象になるのは、\n\n老齢厚生年金\n\nです。\n\n老齢基礎年金は支給停止の対象外\n\nです。\n\nだから2階建てで考えると、\n\n🏠2階\n老齢厚生年金\n→ 調整対象\n\n🏠1階\n老齢基礎年金\n→ 調整対象外\n\nです。\n\n「あ、ここでまた2階建てが役に立ちましたね。」\n\n【賞与は無視していい？】\n「先輩、『月給だけ65万円と比べればいい？』と思いましたよね。」\n\n→ 違います。\n\n判定に使う総報酬月額相当額には、標準報酬月額に加えて、直近1年間の標準賞与額を12で割ったものも含まれます。\n\nつまりイメージは、\n\n月給相当\n＋\nボーナスの1年分÷12\n\nです。\n\n「なので、月給だけ見て『65万円以下だから大丈夫』とは限りません。」\n\n【2026年4月に変わった】\n「FPの教材が少し古いと数字が違う可能性があります。」\n\n2025年度\n→ 51万円\n\n2026年度\n→ 65万円\n\nへ基準額が引き上げられました。\n\n「先輩が今覚えるなら、2026年度＝65万円です。」\n\n【完全整理】\nポイント\t在職老齢年金\nどんな人？\t厚生年金に加入しながら働く老齢厚生年金受給者など\n何と何を見る？\t賃金等＋老齢厚生年金\n2026年度基準\t月65万円\n基準以下\t原則支給停止なし\n基準超過\t超過額の1/2を基本に支給停止\n調整される\t老齢厚生年金\n調整されない\t老齢基礎年金\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n在職老齢年金は何を調整する制度？\n\n→ 働きながら受け取る老齢厚生年金\n\nQ2\n2026年度の支給停止調整額は？\n\n→ 65万円\n\nQ3\n合計が65万円を超えた場合、基本的に超過額の何分のいくつを停止？\n\n→ 1/2\n\nQ4\n老齢基礎年金も支給停止される？\n\n→ されない\n\nQ5\n賞与は判定に関係する？\n\n→ する\n\n「はい。この5つで骨格は完成です。」\n\n【30秒復習】\n① 働きながら年金\n→ 在職老齢年金\n\n② 対象\n→ 老齢厚生年金\n\n③ 2026年度基準\n→ 65万円\n\n④ 基準を超える\n→ 超過部分の1/2を基本に停止\n\n⑤ 老齢基礎年金\n→ 停止されない\n\n⑥ 賞与\n→ 月額換算して考慮\n\n【一文で覚える】\n在職老齢年金＝「働きながら老齢厚生年金を受け取る場合、2026年度は賃金等と老齢厚生年金の合計が月65万円を超えると、超過額の1/2を基本に老齢厚生年金が支給停止される制度」。 \n\n「先輩、最後はこれです。」\n\n給料等＋厚生年金\n↓\n65万円の線\n↓\n超えた部分\n↓\n÷2\n↓\n厚生年金をストップ\n\nでも、\n\n基礎年金には触らない。\n\n「65・超えた分・半分・基礎年金は無傷。この4点で覚えておけば、在職老齢年金はかなり解きやすくなりますよ。」\n\n障害基礎年金\n"}, {"n": 48, "title": "障害基礎年金", "raw": "A【要点｜障害基礎年金って何？】\n「先輩、ここから障害年金ですね。まず『障害＝仕事中の事故でもらうもの』とは考えないでください。それは労災と混ざっています。」\n\n障害基礎年金とは、\n\n病気やけがによって一定の障害状態になった場合に、国民年金から支給される年金\n\nです。\n\nそして試験で最初に押さえるのは、\n\n① 初診日\n② 障害認定日\n③ 保険料納付要件\n\nの3つ。\n\nさらに障害基礎年金の障害等級は、\n\n1級・2級\nです。\n\n「先輩、**3級は障害基礎年金にはありません。**ここは後の障害厚生年金との重要な違いですよ。」\n\nB【詳しい解説｜まず「初診日」って何？】\n「先輩がある病気になったとします。」\n\n症状が出た\n↓\n病院へ行った\n↓\nその後、障害が残った\n\nこのとき重要になるのが、\n\n初診日\nです。\n\n初診日とは基本的に、\n\nその障害の原因となった病気やけがについて、初めて医師・歯科医師の診療を受けた日\n\nです。\n\n「障害状態になった日ではありませんよ。」\n\nたとえば、\n\n25歳 → 病院を初受診\n27歳 → 症状が重くなる\n28歳 → 一定の障害状態\n\nなら、\n\n初診日＝25歳のとき\n\nです。\n\n【なぜ初診日がそんなに重要？】\n「ここが障害年金の芯です。」\n\n初診日に、\n\n国民年金の被保険者だったのか\n\n厚生年金の被保険者だったのか\n\nなどによって、どの障害年金が関係するかが変わります。\n\nイメージすると、\n\n自営業者などとして国民年金加入中に初診\n→ 障害基礎年金\n\n会社員として厚生年金加入中に初診\n→ 要件を満たせば障害基礎年金＋障害厚生年金など\n\n「つまり先輩、現在どんな仕事をしているかではなく、初診日の加入制度を見るのが重要なんです。」\n\n【障害認定日】\n「じゃあ病院に初めて行った瞬間、すぐ障害年金が決まる？」\n\n→ そうとは限りません。\n\n次に、\n\n障害認定日\nがあります。\n\n原則として、\n\n初診日から1年6か月を経過した日\n\nです。\n\nただし、それより前に症状が固定した場合などには例外があります。\n\n時間軸で見ると\n初診日\n\n↓\n\n1年6か月\n\n↓\n\n障害認定日\n\n↓\n\nその時点で一定の障害状態に該当するか？\n\nを見るわけです。\n\n「先輩、数字は――」\n\n初診 → 1年6か月 → 障害認定\nです。\n\n【障害等級｜1級と2級】\n「次です。」\n\n障害基礎年金には、\n\n1級\n\n2級\n\nがあります。\n\n「3級は？」\n\n→ ありません。\n\nざっくりしたイメージとしては、\n\n1級\n→ より重い障害状態\n\n2級\n→ 1級より軽いが、法律上定められた一定の重い障害状態\n\nです。\n\n「先輩、『障害者手帳の1級・2級と同じ？』と思ったかもしれません。」\n\n→ 別の制度です。\n\n障害年金の障害等級と、障害者手帳の等級は、そのまま一致するものではありません。\n\n【保険料納付要件】\n「そして試験で重要なのがこれです。」\n\n障害年金ですから、\n\n👨「国民年金に加入だけして、ずっと保険料を払っていませんでした。」\n\nでは問題になるわけです。\n\n原則的な納付要件は、\n\n初診日の前日において、初診日のある月の前々月までの被保険者期間のうち、保険料納付済期間＋免除期間が3分の2以上\n\nです。\n\n「……先輩、顔が止まりましたね。」\n\n大丈夫です。分解します。\n\n【イメージ】\nこれまでの加入期間が、\n\n■■■■■■■■■■■■\n\n12か月だったとします。\n\nこのうち、\n\n納付済み＋免除\n\nが、\n\n■■■■■■■■□□□……\n\nという感じで、\n\n3分の2以上\n必要だと考えてください。\n\n【特例もある】\n一定の要件のもとでは、\n\n初診日のある月の前々月までの直近1年間に保険料の未納がない\n\nという特例もあります。\n\n「FPではまず――」\n\n原則＝3分の2\n\n特例＝直近1年間に未納なし\n\nと整理しましょう。\n\nC【イメージ理解｜3つの関門】\n「先輩、障害基礎年金をゲームの3つの関門だと思ってください。」\n\n🚪第1関門\n初診日\n\n「いつ最初に病院へ行った？」\n\n↓\n\nそのときの年金制度を確認。\n\n🚪第2関門\n保険料\n\n「ちゃんと納付要件を満たしている？」\n\n↓\n\n原則\n3分の2以上\n\n🚪第3関門\n障害状態\n\n障害認定日に、\n\n1級または2級\n\nに該当する？\n\n↓\n\n要件を満たせば、\n\n障害基礎年金\nです。\n\n「つまり単に『病気になった＝もらえる』ではありません。」\n\nいつ？\n\n保険料は？\n\nどの程度？\n\nこの3方向から確認するんです。\n\nD【具体例｜30歳の自営業者】\n「先輩、具体例で一本につなぎます。」\n\nAさんは30歳の自営業者。\n\n国民年金の、\n\n第1号被保険者\n\nです。\n\n30歳のとき病気になり、\n\n2026年4月1日\n\nに初めて医師の診療を受けたとします。\n\nこれが、\n\n→ 初診日\n\nです。\n\nその後治療を続け、\n\n原則として初診日から、\n\n1年6か月\n\n↓\n\n障害認定日\n\nを迎えます。\n\nそこで障害等級2級に該当。\n\nさらに、\n\n保険料納付要件も満たしている。\n\nすると、\n\n→ 障害基礎年金2級\n\nの対象になり得る、という流れです。\n\n【20歳前に障害になったら？】\n「先輩、ここも重要です。」\n\nたとえば子どもの頃から病気があり、\n\n20歳になる前に初診日\n\nがあったとします。\n\n「でも20歳前ですよね。まだ国民年金保険料を払っていません。」\n\nそうです。\n\nだから20歳前傷病による障害基礎年金には、\n\n保険料納付要件はありません。\n\n一定の障害状態などの要件を満たせば対象になり得ます。\n\nただし、本人の所得による支給制限などがあります。\n\n「ここは理屈で覚えられます。」\n\n20歳前\n↓\nそもそも国民年金保険料を納める義務がなかった\n↓\n保険料納付要件を要求できない\n\nということですね。\n\n【障害厚生年金との違いを先取り】\n「次に障害厚生年金をやると思うので、先に地図だけ置いておきます。」\n\n障害基礎年金\t障害厚生年金\n制度\t国民年金\t厚生年金\n障害等級\t1・2級\t1・2・3級\n初診日\t国民年金側の要件\t厚生年金加入中が基本\n3級\tなし\tあり\n「先輩、試験では――」\n\n基礎＝1・2\n厚生＝1・2・3\nこれはかなり重要です。\n\n【ここまでの公的年金とつなげる】\n「公的年金には3種類の給付がある、と最初にやりましたね。」\n\n👴 老後\n→ 老齢\n\n♿ 障害\n→ 障害\n\n👪 死亡\n→ 遺族\n\nそして障害についても2階建てがあります。\n\n🏠2階\n→ 障害厚生年金\n\n🏠1階\n→ 障害基礎年金\n\n「会社員なら条件を満たせば2階部分まで関係してくる。公的年金の家は、老齢でも障害でも使えるんです。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n障害基礎年金の障害等級は？\n\n→ 1級・2級\n\nQ2\n3級はある？\n\n→ ありません。\n\nQ3\n障害認定日は原則、初診日からどれくらい？\n\n→ 1年6か月\n\nQ4\n保険料納付要件の原則は？\n\n→ 納付済期間＋免除期間が被保険者期間の3分の2以上\n\nQ5\n20歳前傷病では保険料納付要件は？\n\n→ ありません。\n\n「はい。この5つ、かなり重要ですよ。」\n\n【30秒復習】\n① 最初に病院\n→ 初診日\n\n② 原則1年6か月\n→ 障害認定日\n\n③ 障害基礎年金\n→ 1級・2級\n\n④ 3級\n→ なし\n\n⑤ 納付要件\n→ 原則3分の2\n\n⑥ 20歳前傷病\n→ 納付要件なし\n\n【一文で覚える】\n障害基礎年金＝「国民年金の加入者などが病気やけがで一定の障害状態になり、初診日・障害等級・保険料納付などの要件を満たした場合に支給される年金」。\n\n「先輩、最後はこの順番です。」\n\n初診 → 1年6か月 → 1・2級 → 納付3分の2\nそして、\n\n基礎には3級なし。\n\n「この一本の流れを作っておけば、次に障害厚生年金が出てきても『どこが違うのか』で整理できますよ。」\n\n\n\n障害厚生年金\n"}, {"n": 49, "title": "障害厚生年金", "raw": "A【要点｜障害基礎年金の「2階部分」です】\n「先輩、前回の障害基礎年金が分かっていれば、障害厚生年金は比較するとかなり楽です。」\n\n一言でいうと、\n\n厚生年金に加入している間に初診日がある病気・けがによって、一定の障害状態になった場合に支給される年金\n\nです。\n\n最大のポイントは、\n\n障害基礎年金 → 1級・2級\n\nに対して、\n\n障害厚生年金 → 1級・2級・3級\nということ。\n\nさらに3級より軽い一定の障害について、\n\n障害手当金（一時金）\n\nという制度もあります。\n\n「まずは――」\n\n基礎＝1・2\n\n厚生＝1・2・3＋手当金\n\nで覚えましょう。\n\nB【詳しい解説｜最重要なのは「初診日に会社員だったか」】\n「先輩、30歳の会社員Aさんを考えましょう。」\n\n👨‍💼Aさん\n→ 厚生年金加入中\n\nある日、病気になって初めて病院を受診しました。\n\nこの、\n\n初めて医師・歯科医師の診療を受けた日\n\nが、\n\n→ 初診日\n\nでしたね。\n\nそして、この初診日にAさんが、\n\n厚生年金の被保険者\n\nだった。\n\n↓\n\n障害厚生年金を考える。\n\n「ここなんです。」\n\n【今の職業じゃない】\n「先輩、たとえばこうだったら？」\n\n30歳・会社員\n↓\n病院を初診\n↓\n35歳・退職\n↓\nその後、障害状態\n\n👨「今は会社員じゃないから障害厚生年金は関係ない？」\n\n→ そうとは限りません。\n\n重要なのは、\n\n初診日に厚生年金に加入していたか\nです。\n\n「今どこで働いているか」ではなく、\n\n最初に診療を受けたとき、どの年金制度に入っていたか\n\nを見る。\n\nこれは障害年金の超重要ポイントです。\n\n【障害認定日は？】\n「ここは障害基礎年金と同じ流れです。」\n\n初診日\n\n↓\n\n原則\n1年6か月\n\n↓\n\n障害認定日\nです。\n\nその障害認定日に、\n\n1級・2級・3級\n\nのどこに該当するかを判断します。\n\n【1級だったら？】\n「ここから2階建てが威力を発揮しますよ。」\n\n会社員が障害等級1級に該当。\n\nすると要件を満たせば、\n\n🏠2階\n障害厚生年金1級\n\n＋\n\n🏠1階\n障害基礎年金1級\n\nです。\n\nつまり、\n\n1級 → 基礎＋厚生\n【2級だったら？】\n同じです。\n\n🏠2階\n障害厚生年金2級\n\n＋\n\n🏠1階\n障害基礎年金2級\n\nなので、\n\n2級 → 基礎＋厚生\nです。\n\n【じゃあ3級は？】\n「先輩、ここが一番大事。」\n\n障害基礎年金には、\n\n3級がありません。\n\nでも障害厚生年金には、\n\n3級があります。\n\nだから3級なら、\n\n🏠2階\n障害厚生年金3級\n\n🏠1階\n障害基礎年金\n→ なし\n\nです。\n\nつまり、\n\n3級 → 厚生だけ\n「これ、試験で非常に使いやすい整理ですよ。」\n\nC【イメージ理解｜障害のエレベーター】\n「先輩、2階建ての建物にエレベーターを付けます。」\n\n【1級】\nかなり重い障害状態\n\n🏠2階 → 障害厚生年金\n\n🏠1階 → 障害基礎年金\n\n【2級】\n🏠2階 → 障害厚生年金\n\n🏠1階 → 障害基礎年金\n\n【3級】\n「あれ？1階に3級がない。」\n\nだから、\n\n🏠2階 → 障害厚生年金\n\n🏠1階 → ❌\n\n【3級より軽い一定の障害】\nさらに下へ行くと、\n\n条件を満たせば、\n\n💰 障害手当金\n\nという一時金があります。\n\n「先輩、縦に並べましょう。」\n\n1級 → 基礎＋厚生\n\n2級 → 基礎＋厚生\n\n3級 → 厚生のみ\n\nさらに軽い一定の障害 → 障害手当金の可能性\n\nです。\n\nB【障害手当金って何？】\n「ここ、名前に『年金』が付いていませんよね。」\n\nその通り。\n\n一時金\nです。\n\n厚生年金加入中に初診日がある病気・けがが一定の要件を満たし、一定程度の障害が残った場合などに支給されることがあります。\n\nつまり、\n\n障害厚生年金3級\n↓\nより軽い一定の障害\n↓\n「年金として継続的に支給するほどではないけれど、一定の障害が残った」\n\n↓\n\n障害手当金\n\nというイメージです。\n\n【保険料納付要件】\n「先輩、障害基礎年金でもやりましたね。」\n\n原則として、\n\n初診日の前日において、初診日のある月の前々月までの被保険者期間\n\nについて、\n\n保険料納付済期間＋保険料免除期間\n\nが、\n\n3分の2以上\n必要です。\n\nさらに一定の場合には、\n\n直近1年間に未納がない\n\nという特例があります。\n\n「ですから障害厚生年金でも――」\n\n初診\n\n1年6か月\n\n納付3分の2\n\nという基本線は同じです。\n\nD【具体例｜会社員Aさん】\n「全部つなげましょう。」\n\nAさんは30歳の会社員。\n\n厚生年金に加入しています。\n\n30歳\n病気になり初めて病院へ。\n\n→ 初診日\n\nこのとき、\n\n→ 厚生年金加入中\n\nでした。\n\n↓\n\n原則1年6か月\n\n↓\n\n障害認定日\n障害等級を判定。\n\nAさんが2級だった\n→ 障害基礎年金2級\n\n＋\n\n→ 障害厚生年金2級\n\n「2階建てですね。」\n\nAさんが3級だった\n→ 障害基礎年金 ❌\n\n→ 障害厚生年金3級 ⭕\n\n「なぜ？」\n\n→ 障害基礎年金には3級がないから。\n\nこれです。\n\n【年金額はどう決まる？】\n「障害厚生年金は厚生年金なので、老齢厚生年金と同じように報酬比例という考え方が出てきます。」\n\nつまり、\n\n厚生年金加入中の報酬や加入期間など\n\nを基礎として計算します。\n\nただし、\n\n「若くして障害になった人は加入期間が短いですよね？」\n\nたとえば22歳から働いて25歳で障害状態になったら、\n\n👨「3年しか加入してないから年金がものすごく少なくなる？」\n\nそこで障害厚生年金では、年金額の計算上、厚生年金の被保険者期間が300月未満なら300月として計算する仕組みがあります。\n\n300月＝25年\n「先輩、ここも試験ポイントです。」\n\n障害厚生年金 → 300月\n\nと結びつけましょう。\n\n【1級はさらに増える】\n障害厚生年金では基本的に、\n\n2級\n→ 報酬比例の年金額\n\n1級\n→ 2級相当の報酬比例額 × 1.25\n\nです。\n\nつまり、\n\n1級＝1.25倍\nですね。\n\nさらに一定の要件を満たす配偶者がいる場合、\n\n配偶者の加給年金額\n\nが加算される場合があります。\n\n【障害基礎年金との完全比較】\n障害基礎年金\t障害厚生年金\n位置\t1階\t2階\n1級\t⭕\t⭕\n2級\t⭕\t⭕\n3級\t❌\t⭕\nさらに軽い一定障害\t―\t障害手当金の可能性\n金額の特徴\t定額を基本\t報酬比例\n1級\t2級額より高い\t報酬比例額×1.25\n加入期間が短い場合\t―\t300月みなし\n「先輩、これなら基礎と厚生を横に並べて理解できますね。」\n\n【老齢年金との違いも整理】\n「ここも重要ですよ。」\n\n老齢厚生年金\n→ 老後\n→ 原則65歳\n\n障害厚生年金\n→ 病気・けがによる一定の障害\n→ 年齢65歳だからもらう制度ではない\n\n「公的年金は老後だけじゃない、と最初にやった意味がここにあります。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n障害厚生年金で最重要なのは、いつ厚生年金に加入していたか？\n\n→ 初診日\n\nQ2\n障害認定日は原則？\n\n→ 初診日から1年6か月\n\nQ3\n障害厚生年金の等級は？\n\n→ 1級・2級・3級\n\nQ4\n3級の場合、障害基礎年金は？\n\n→ ありません。\n\nQ5\n被保険者期間が300月未満の場合、年金額の計算では？\n\n→ 300月として計算\n\n「はい。かなりきれいにつながっています。」\n\n【30秒復習】\n① 初診日\n→ 厚生年金加入中\n\n② 障害認定日\n→ 原則1年6か月後\n\n③ 基礎\n→ 1・2級\n\n④ 厚生\n→ 1・2・3級\n\n⑤ 3級より軽い一定障害\n→ 障害手当金\n\n⑥ 短期加入\n→ 300月みなし\n\n【一文で覚える】\n障害厚生年金＝「厚生年金加入中に初診日がある病気・けがで一定の障害状態となり、要件を満たした場合に支給される、1・2・3級のある厚生年金の障害給付」。\n\n「先輩、最後はこの形を頭に焼き付けてください。」\n\n1級 → 基礎＋厚生\n\n2級 → 基礎＋厚生\n\n3級 → 厚生だけ\n\nさらに軽い一定障害 → 手当金\n\nそして、\n\n基礎は1・2、厚生は1・2・3。\n「この一本を固定しておけば、障害基礎年金と障害厚生年金の問題はかなり見分けやすくなりますよ。」\n\n遺族基礎年金\n"}, {"n": 50, "title": "遺族基礎年金", "raw": "A【要点｜「亡くなった人」ではなく「残された家族」に支給】\n「先輩、今回は遺族基礎年金ですね。公的年金の3本柱を思い出してください。」\n\n老齢 → 老齢年金\n障害 → 障害年金\n死亡 → 遺族年金\n\n遺族基礎年金を一言でいうと、\n\n国民年金の被保険者などが亡くなったとき、一定の要件を満たす「子のある配偶者」または「子」に支給される年金\n\nです。\n\n「先輩、ここでいきなり最重要ポイントです。」\n\n子のない配偶者には、遺族基礎年金は原則支給されません。\n覚え方は、\n\n遺族「基礎」は子どもがカギ\nです。\n\nB【詳しい解説｜誰がもらえるの？】\n「たとえば、夫・妻・10歳の子どもの3人家族を考えます。」\n\n👨夫\n👩妻\n👦子10歳\n\n夫が亡くなりました。\n\n夫によって生計を維持されていた妻と子が一定の要件を満たしていれば、\n\n→ 子のある配偶者\n\nとして妻が遺族基礎年金を受け取ることができます。\n\n「では先輩、子どもがいない夫婦だったら？」\n\n👨夫\n👩妻\n子どもなし\n\n夫が死亡。\n\n→ 妻だから当然に遺族基礎年金を受け取れる？\n\nいいえ。\n\n遺族基礎年金では、\n\n「子のある配偶者」または「子」\n\nが基本なんです。\n\n【「子」って何歳まで？】\n「じゃあ30歳の子どもがいても『子のある配偶者』？」\n\n→ 違います。\n\n遺族基礎年金でいう「子」は原則として、\n\n18歳になった年度の3月31日まで\n\nです。\n\nつまり、ざっくり言えば、\n\n高校卒業相当まで\n\nと考えると覚えやすいですね。\n\nまた、\n\n20歳未満で障害等級1級または2級の状態にある子\n\nも対象になり得ます。\n\nそして原則として婚姻していないことが必要です。\n\n【なぜ「18歳」ではなく「18歳年度末」？】\n「ここ、先輩が引っかかりそうなので先に潰します。」\n\nたとえば子どもが、\n\n18歳の誕生日を迎えた瞬間\n\nに終了するわけではありません。\n\nその子が18歳になった年度の、\n\n3月31日まで\nが基本です。\n\nだから、\n\n「18歳まで」\n\nだけで覚えるより、\n\n18歳年度末\n\nと覚えましょう。\n\n【亡くなった人にも条件がある】\n「残された家族だけ条件を満たせばいいわけではありません。」\n\n亡くなった人についても、国民年金の被保険者であったことなどの要件に加えて、原則として保険料納付要件があります。\n\nここ、障害基礎年金でやりましたね。\n\n基本的には、\n\n保険料納付済期間＋保険料免除期間\n\nが、\n\n被保険者期間の3分の2以上\n\n必要です。\n\n「はい先輩、また出ました。」\n\n3分の2\n障害年金でも遺族年金でも重要です。\n\n一定の場合には、直近1年間に未納がないことによる特例もあります。\n\nC【イメージ理解｜「子どものいる家庭」を守る1階部分】\n「先輩、公的年金の家をもう一度出しましょう。」\n\n亡くなった人が会社員だった場合をイメージします。\n\n🏠 2階：遺族厚生年金\n\n🏠 1階：遺族基礎年金\n\nただし1階の遺族基礎年金には、\n\n🚪入口に\n\n「子どもがいる？」\nというチェックがあると思ってください。\n\n👩妻＋👦10歳\n「子どもいます。」\n\n→ 要件を満たせば遺族基礎年金○\n\n👩妻だけ\n「子どもはいません。」\n\n→ 遺族基礎年金×\n\n「つまり遺族基礎年金は、残された配偶者そのものを広く保障するというより、一定年齢までの子がいる遺族を支える性格が強いんですね。」\n\nD【具体例｜夫が亡くなった場合】\n「3ケース比べますよ。」\n\nケース① 妻40歳＋子10歳\n夫が死亡。\n\n妻と子が夫によって生計を維持されており、その他の要件も満たす。\n\n↓\n\n👩妻\n\n→ 子のある配偶者\n\n↓\n\n遺族基礎年金の対象になり得る\n\nケース② 妻40歳・子どもなし\n夫が死亡。\n\n「妻がいるから遺族基礎年金？」\n\n→ 原則×\n\n子のある配偶者ではないからです。\n\n「ここ、かなり大事ですよ。」\n\nケース③ 両親が亡くなり、15歳の子が残った\n👦15歳\n\n↓\n\n一定の要件を満たせば、\n\n「子」自身が遺族基礎年金の対象\n\nになり得ます。\n\nつまり受給対象者は、\n\n子のある配偶者 OR 子\nです。\n\n【子どもが大きくなったら？】\n「ケース①に戻りましょう。」\n\n👩妻＋👦10歳\n\n↓\n\n年月が経つ\n\n↓\n\n👦子が18歳になった年度の3月31日を迎える\n\nすると、他に対象となる子がいなければ、\n\n妻は「子のある配偶者」ではなくなります。\n\nそのため、\n\n→ 遺族基礎年金の権利も終了\n\nするのが基本です。\n\n「つまり妻自身が何歳になったかではなく、対象となる子がいるかが重要なんですね。」\n\n【遺族厚生年金との違いを先取り】\n「次に遺族厚生年金をやると、この違いが重要になります。」\n\n遺族基礎年金\t遺族厚生年金\n位置\t1階\t2階\n制度\t国民年金\t厚生年金\n特に重要\t子の存在\t厚生年金加入歴など\n子のない配偶者\t原則対象外\t条件により対象になり得る\n「だから先輩――」\n\n遺族基礎年金を見たら、まず『子どもは？』\n\nこれです。\n\n【寡婦年金・死亡一時金との違い】\n「先輩、『じゃあ自営業者の夫が亡くなって、子どものいない妻には何もないの？』と思いましたよね。」\n\nそこで国民年金には、\n\n寡婦年金\n\nや\n\n死亡一時金\n\nという別の死亡給付があります。\n\nただし、それぞれ条件があります。\n\n「これは別項目でやった方が整理しやすいので、今は――」\n\n遺族基礎年金だけが国民年金の死亡給付のすべてではない\n\nと覚えておいてください。\n\n【全体の流れ】\n「先輩、死亡したらこの順番で考えます。」\n\n国民年金の被保険者などが死亡\n\n↓\n\n保険料納付要件などを確認\n\n↓\n\n残された人は？\n\n↓\n\n子のある配偶者\n→ ⭕\n\nまたは\n\n子\n→ ⭕\n\nただの配偶者\n\n→ 遺族基礎年金は原則×\n\n「だから、遺族基礎年金では**『配偶者』だけで覚えたらダメ**なんです。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n遺族基礎年金を受け取れる遺族の基本は？\n\n→ 子のある配偶者または子\n\nQ2\n子のいない妻は遺族基礎年金を原則受け取れる？\n\n→ 受け取れない\n\nQ3\n「子」の年齢要件の基本は？\n\n→ 18歳になった年度の3月31日まで\n\nQ4\n障害のある子については？\n\n→ 20歳未満で障害等級1級・2級なら対象になり得る\n\nQ5\n保険料納付要件の原則は？\n\n→ 納付済＋免除期間が3分の2以上\n\n【30秒復習】\n① 死亡に対する年金\n→ 遺族年金\n\n② 基礎年金の受給者\n→ 子のある配偶者・子\n\n③ 子なし配偶者\n→ 原則×\n\n④ 子の基本\n→ 18歳年度末まで\n\n⑤ 障害のある子\n→ 20歳未満・1級または2級\n\n⑥ 納付要件\n→ 原則3分の2\n\n【一文で覚える】\n遺族基礎年金＝「国民年金の被保険者などが死亡したとき、一定の要件を満たす『子のある配偶者』または『子』に支給される年金」。\n\n「先輩、最後に一個だけ残すなら――」\n\n遺族「基礎」＝子どもがカギ。\n👩＋👦 → ○\n\n👦 → ○\n\n👩だけ → 原則×\n\n「次に遺族厚生年金が出てきたら、ここが一気に面白くなります。**『基礎は子が重要、厚生は対象遺族がもっと広い』**という違いが見えてきますからね。」\n\n寡婦年金と死亡一時金\n"}, {"n": 51, "title": "寡婦年金と死亡一時金", "raw": "A【要点｜どちらも「第1号被保険者の死亡」に関係する給付】\n「先輩、前回『子どものいない妻だと遺族基礎年金は原則もらえない』とやりましたよね。そこで出てくるのが、今回の寡婦年金と死亡一時金です。」\n\nどちらも国民年金の第1号被保険者に関係する独自の死亡給付ですが、中身は全然違います。\n\n寡婦年金\n→ 一定の夫が亡くなったとき、要件を満たす妻に60～65歳まで支給\n\n死亡一時金\n→ 一定期間保険料を納めた人が、老齢基礎年金・障害基礎年金を受けずに亡くなり、遺族基礎年金も受けられない場合などに、一定の遺族へ一度だけ支給\n\n「まず数字で――」\n\n寡婦年金＝10年・10年・60～65\n死亡一時金＝36月・一時金\nと置いておきましょう。\n\nB【詳しい解説①｜寡婦年金】\n「先輩、まず名前を見ましょう。」\n\n寡婦（かふ）\n\nとは、この制度では簡単にいうと、\n\n夫を亡くした妻\n\nですね。\n\nでは、どんな場合に寡婦年金が出るのか。\n\n夫が国民年金の第1号被保険者としての保険料納付済期間＋免除期間を原則10年以上持っていて、老齢基礎年金や障害基礎年金を受け取らないまま死亡した、とします。\n\nさらに夫によって生計を維持され、\n\n夫との婚姻関係が10年以上継続していた妻\n\nなど、一定の要件を満たす。\n\nすると妻に、\n\n60歳から65歳になるまで\n寡婦年金が支給されます。\n\n「はい先輩。10が2回出ましたね。」\n\n夫の期間 → 10年以上\n\n婚姻期間 → 10年以上\n\nです。\n\n【いくらもらえる？】\n「ここもFPで重要です。」\n\n寡婦年金の年額は、\n\n夫の第1号被保険者期間について計算した老齢基礎年金額 × 3/4\n\nです。\n\nつまり、\n\n4分の3\nですね。\n\n「夫が将来受け取るはずだった年金を、そのまま100％妻がもらうわけではありません。」\n\n【なぜ60～65歳なの？】\n「先輩、ここは数字だけ覚えるより意味を考えましょう。」\n\n妻自身の老齢基礎年金は原則、\n\n65歳から\n\nですよね。\n\nそこで、\n\n👩「夫が亡くなった。でも私はまだ自分の老齢基礎年金を受け取る年齢ではない。」\n\nという期間について、\n\n60歳 → 寡婦年金 → 65歳\n\nという橋を架けるイメージです。\n\n65歳になると、\n\n→ 寡婦年金は終了\n\nします。\n\nC【イメージ理解①｜60～65歳の橋】\n「先輩、川を想像してください。」\n\n60歳　　　　　　　　　65歳\n\n👩━━━━🌉━━━━→👩\n　　寡婦年金　　　　　老齢基礎年金へ\n\n「だから寡婦年金を見たら、私は先輩にこの橋を思い出してほしいんです。」\n\n60→65の5年間をつなぐ橋\nです。\n\nB【詳しい解説②｜死亡一時金】\n「次は死亡一時金です。こっちは年金ではありません。」\n\n一度だけもらうお金\nです。\n\n国民年金の第1号被保険者として保険料を納めた一定の期間が、\n\n36月以上\n\nある人が亡くなった。\n\nでも、その人は、\n\n老齢基礎年金も障害基礎年金も受け取っていない。\n\nそして遺族も、\n\n遺族基礎年金を受け取れない。\n\nこうした場合に、一定の遺族に死亡一時金が支給されます。\n\n【なぜこんな制度があるの？】\n「先輩、自営業者Aさんを考えてください。」\n\nAさんは国民年金保険料を何年も払いました。\n\nところが、\n\n👨「老齢基礎年金を受け取る前に亡くなった。」\n\nしかも、\n\n👩妻「遺族基礎年金の対象になる子もいません。」\n\nすると、\n\n「今まで第1号として保険料を払ってきたのに、死亡に対する国民年金の給付が何もないの？」\n\nというケースが出ます。\n\nそこで一定の条件を満たした遺族に、\n\n💰一時金\n\nとして支給する。\n\nこれが死亡一時金です。\n\n【36月を覚える】\n「ここは試験で狙いやすい数字ですよ。」\n\n死亡一時金は、\n\n36月以上\nが重要です。\n\n36月は、\n\n→ 3年\n\nですね。\n\nだから、\n\n死亡一時金＝3年＝36月\n\nとセットにしましょう。\n\nD【具体例｜2つを比べる】\n「先輩、Aさんが亡くなったとします。」\n\nAさんは長年、自営業者として国民年金の第1号被保険者でした。\n\nケース① 寡婦年金\n👨夫\n→ 第1号として必要な期間が原則10年以上\n\n👩妻\n→ 夫によって生計維持\n→ 婚姻期間10年以上\n→ その他の要件もクリア\n\n夫が年金を受け取らず死亡。\n\n妻が60歳になった。\n\n↓\n\n60～65歳\n\n↓\n\n寡婦年金\n\nそして金額は、\n\n夫の第1号期間に基づく老齢基礎年金額の3/4\n\nです。\n\nケース② 死亡一時金\n👨夫\n→ 第1号として保険料納付に関する一定の期間が36月以上\n\n↓\n\n老齢基礎年金・障害基礎年金を受け取らず死亡\n\n↓\n\n遺族基礎年金も支給されない\n\n↓\n\n一定の遺族へ\n\n💰 死亡一時金\n\n「こちらは毎年もらうのではなく、一回だけですよ。」\n\n【両方もらえるの？】\n「先輩、ここ超重要です。」\n\n👩「寡婦年金も死亡一時金も条件を満たしました。両方ください。」\n\n→ できません。\n\n同じ人が、\n\n寡婦年金と死亡一時金の両方を受けられる場合\n\nは、\n\nどちらか一方を選択\nします。\n\n「ここは試験問題で非常に使いやすいポイントです。」\n\n【遺族基礎年金との関係】\n「3つ並べると一気に整理できますよ。」\n\n遺族基礎年金\n👩＋👦\n\n→ 子のある配偶者\n\nまたは\n\n👦 子\n\nがポイント。\n\n寡婦年金\n👩 妻\n\n→ 60～65歳\n\n→ 10年・10年\n\n→ 3/4\n\n死亡一時金\n👪 一定の遺族\n\n→ 36月以上\n\n→ 一回だけ\n\n「ほら、役割が全然違いますよね。」\n\n【3制度を整理】\n制度\t誰がポイント？\t重要数字\t支給方法\n遺族基礎年金\t子のある配偶者・子\t18歳年度末など\t年金\n寡婦年金\t一定の妻\t10年・10年・60～65・3/4\t年金\n死亡一時金\t一定の遺族\t36月以上\t一時金\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n寡婦年金は原則何歳から何歳まで？\n\n→ 60歳から65歳まで\n\nQ2\n寡婦年金で重要な婚姻期間は？\n\n→ 10年以上\n\nQ3\n寡婦年金の額は夫の第1号期間に基づく老齢基礎年金額の何割？\n\n→ 4分の3\n\nQ4\n死亡一時金で重要な納付期間は？\n\n→ 36月以上\n\nQ5\n寡婦年金と死亡一時金の両方に該当したら？\n\n→ どちらか一方を選択\n\n「はい。ここまで言えればかなり強いです。」\n\n【30秒復習】\n① 寡婦年金\n→ 妻\n\n② 夫の期間\n→ 原則10年以上\n\n③ 婚姻期間\n→ 10年以上\n\n④ 支給\n→ 60～65歳・3/4\n\n⑤ 死亡一時金\n→ 36月以上\n\n⑥ 両方該当\n→ どちらか選択\n\n【一文で覚える】\n寡婦年金＝「第1号被保険者だった夫が年金を受けずに死亡した場合などに、一定の要件を満たす妻へ60～65歳まで支給される年金」。\n\n死亡一時金＝「第1号被保険者として一定期間保険料を納めた人が年金を受けずに死亡し、遺族基礎年金も受けられない場合などに、一定の遺族へ一度だけ支給される給付」。\n\n「先輩、最後は数字で分離しましょう。」\n\n寡婦年金\n10・10・60→65・3/4\n\n死亡一時金\n36月・一回\n\n「そして両方の条件を満たしたら、両取りではなく選択。ここまでセットで覚えてくださいね。」\n\n\n遺族厚生年金\n"}, {"n": 52, "title": "遺族厚生年金", "raw": "A【要点｜厚生年金に入っていた人が亡くなったときの「2階部分」】\n「先輩、今回は遺族厚生年金ですね。遺族基礎年金との違いを意識すると、一気に整理できます。」\n\n一言でいうと、\n\n厚生年金の被保険者などが死亡したとき、一定の要件を満たす遺族に支給される年金\n\nです。\n\nまず最大の違い。\n\n遺族基礎年金\n→ 子のある配偶者・子が中心\n\n遺族厚生年金\n→ 子がいなくても対象になる遺族がいる\n\nそして年金額の基本は、\n\n亡くなった人の老齢厚生年金の報酬比例部分 × 3/4\n「先輩、まずは――」\n\n基礎＝子がカギ\n\n厚生＝対象遺族が広い＋3/4\n\nです。\n\nB【詳しい解説｜会社員が亡くなったら？】\n「先輩、会社員Aさんを考えます。」\n\n👨‍💼Aさん\n→ 厚生年金加入中\n\n👩妻\n👦10歳の子\n\nAさんが亡くなりました。\n\n一定の要件を満たせば、\n\n🏠2階\n→ 遺族厚生年金\n\nさらに子がいるため、\n\n🏠1階\n→ 遺族基礎年金\n\nも対象になり得ます。\n\nつまり、\n\n遺族基礎年金＋遺族厚生年金\nという2階建てです。\n\n「老齢でも障害でも遺族でも、あの家が使えるんですよ。」\n\n【子どもがいなかったら？】\n「ここが遺族基礎年金との決定的な違いです。」\n\n👨夫\n👩妻\n子どもなし\n\n夫が死亡。\n\n遺族基礎年金は？\n\n→ 原則×\n\n「子のある配偶者ではありませんからね。」\n\nでも、\n\n遺族厚生年金は？\n\n→ 妻が一定の要件を満たせば対象になり得ます。\n\nだから、\n\n子なし＝遺族年金が全部ゼロ\n\nではありません。\n\n「基礎と厚生を分けて考える必要があるんです。」\n\n【誰が遺族になれる？】\n「ここ、少し人数が増えますよ。」\n\n遺族厚生年金を受けられる遺族には、一定の要件のもと、\n\n配偶者・子\n\n父母\n\n孫\n\n祖父母\n\nなどがあります。\n\nただし、\n\n「全員で仲良く分けるんですか？」\n\n→ 違います。\n\n受給には優先順位があります。\n\n基本的な順番は、\n\n①配偶者・子 → ②父母 → ③孫 → ④祖父母\nです。\n\n「先輩、まずは近い家族から遠い家族へ、とイメージしてください。」\n\n【夫にも遺族厚生年金はある？】\n「あります。ただし年齢要件に注意です。」\n\n妻が亡くなって夫が遺族になる場合、\n\n夫については原則として、\n\n妻の死亡時に55歳以上\n\nであることが必要です。\n\nそして原則、\n\n60歳から支給\n\nされます。\n\n「なので――」\n\n夫・父母・祖父母 → 55・60\nという数字を覚えておくと便利です。\n\nただし夫については、遺族基礎年金を受けられる場合などに例外があります。\n\n【妻ならずっともらえる？】\n「先輩、ここも要注意です。」\n\n妻だから必ず生涯受給、ではありません。\n\n特に、\n\n夫の死亡時に30歳未満で、子のない妻\n\nの場合、\n\n遺族厚生年金は原則として、\n\n5年間\nの有期給付です。\n\n「若くて子どものいない妻には5年、という重要ルールですね。」\n\nC【イメージ理解｜2階建ての家をもう一度】\n「先輩、家族構成によって家がどう変わるか見ましょう。」\n\n👩妻＋👦10歳\n夫死亡\n\n🏠2階\n遺族厚生年金\n\n🏠1階\n遺族基礎年金\n\n「子がいるので、1階も2階も成立しやすい。」\n\n👩妻のみ・子なし\n夫死亡\n\n🏠2階\n遺族厚生年金 → ○になり得る\n\n🏠1階\n遺族基礎年金 → ×\n\n「あ、家の1階がないのに2階だけ？」\n\n制度上のイメージなので、それで大丈夫です。\n\nつまり、\n\n遺族基礎年金と遺族厚生年金は受給条件が違う\nということです。\n\nD【具体例｜年金額はどうなる？】\n「先輩、遺族厚生年金には非常に重要な3/4があります。」\n\n亡くなった人の老齢厚生年金の、\n\n報酬比例部分\n\nを基礎にして、\n\n原則、\n\n3/4\nを使って計算します。\n\nたとえば単純化して、\n\n亡くなった夫の報酬比例部分\n→ 年120万円\n\nだったとしましょう。\n\n120万円 × 3/4\n\n＝ 90万円\n\n「このようなイメージで遺族厚生年金額を考えます。」\n\n【加入期間が短かったら？】\n「先輩、障害厚生年金で出てきた数字、覚えています？」\n\n300月\nです。\n\n厚生年金加入中の人が若くして亡くなったような一定の場合には、年金額計算上の被保険者期間が300月未満なら、\n\n300月として計算\n\nします。\n\n300月\n＝ 25年\n\nですね。\n\n「若く亡くなったから加入期間3年分しか計算しません、では遺族への保障が小さくなりすぎる。そのための仕組みだと考えると分かりやすいです。」\n\n【中高齢寡婦加算】\n「そして先輩、遺族厚生年金でかなり重要なのが――」\n\n中高齢寡婦加算\nです。\n\n名前を分解してください。\n\n中高齢\n＋\n寡婦＝夫を亡くした妻\n＋\n加算\n\nですね。\n\n代表的には、夫が亡くなったときに一定の要件を満たす、\n\n40歳以上65歳未満の妻\n\nについて、遺族厚生年金に加算される制度です。\n\n【なぜ40～65歳？】\n「ここ、前にやった寡婦年金と少し似た発想です。」\n\nたとえば、\n\n👩妻45歳\n\n子どもが成長して、\n\n→ 遺族基礎年金がなくなった。\n\nでも妻自身の、\n\n→ 老齢基礎年金は原則65歳から。\n\n「つまり間に空白ができますよね。」\n\nそこで一定の要件を満たす妻について、\n\n遺族厚生年金＋中高齢寡婦加算\n\nという形で保障を厚くするわけです。\n\n「だから――」\n\n中高齢寡婦加算＝40～65歳\nをまず覚えてください。\n\n【寡婦年金と中高齢寡婦加算は別物！】\n「先輩、ここ絶対に混ぜないでください。」\n\n寡婦年金\n→ 国民年金\n\n→ 主に第1号被保険者だった夫に関係\n\n→ 60～65歳\n\n中高齢寡婦加算\n→ 厚生年金\n\n→ 遺族厚生年金に加算\n\n→ 40～65歳が重要\n\n「名前が似ていますが――」\n\n寡婦年金＝国民年金\n\n中高齢寡婦加算＝厚生年金\n\nです。\n\n【保険料納付要件】\n「ここも障害年金・遺族基礎年金で見ましたね。」\n\n死亡した人について、一定の場合には、\n\n保険料納付済期間＋免除期間が被保険者期間の3分の2以上\n\nという原則的な納付要件があります。\n\nさらに一定の場合、\n\n直近1年間に未納がない\n\nという特例があります。\n\n「また出ましたね。」\n\n障害・遺族 → 3分の2\n\nというつながりを持っておきましょう。\n\n【これまでの死亡給付を全部整理】\n制度\t最大のポイント\n遺族基礎年金\t子のある配偶者・子\n寡婦年金\t妻・60～65歳・3/4\n死亡一時金\t36月以上・一時金\n遺族厚生年金\t対象遺族が広い・報酬比例部分の3/4\n中高齢寡婦加算\t遺族厚生年金＋40～65歳が重要\n「先輩、ここまで来ると死亡給付の地図がかなり完成してきました。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n遺族厚生年金は公的年金の何階部分？\n\n→ 2階部分\n\nQ2\n子のない妻でも対象になり得る？\n\n→ なります。\n\nQ3\n年金額の基本は、亡くなった人の報酬比例部分の何分のいくつ？\n\n→ 4分の3\n\nQ4\n夫死亡時に30歳未満で子のない妻は原則何年間？\n\n→ 5年間\n\nQ5\n中高齢寡婦加算で重要な年齢は？\n\n→ 40歳以上65歳未満\n\n【30秒復習】\n① 基礎\n→ 子がカギ\n\n② 厚生\n→ 対象遺族が広い\n\n③ 年金額\n→ 報酬比例×3/4\n\n④ 若い子なし妻\n→ 30歳未満・5年\n\n⑤ 夫・父母・祖父母\n→ 55歳・原則60歳支給\n\n⑥ 中高齢寡婦加算\n→ 40～65歳\n\n【一文で覚える】\n遺族厚生年金＝「厚生年金の被保険者などが死亡したとき、一定の遺族に支給され、年金額は原則として亡くなった人の老齢厚生年金の報酬比例部分の4分の3を基礎とする年金」。\n\n「先輩、最後はこの対比です。」\n\n遺族基礎＝子どもを見る\n遺族厚生＝誰が遺族か＋3/4を見る\nそして妻について、\n\n30歳未満・子なし → 5年\n\n40～65歳 → 中高齢寡婦加算が関係\n\n「この年齢の流れまで一本につなげれば、遺族年金の問題がかなり整理しやすくなりますよ。」\n\n中高齢寡婦加算\n"}, {"n": 53, "title": "中高齢寡婦加算", "raw": "A【要点｜「遺族基礎年金がない時期」を支える加算】\n「先輩、今回は中高齢寡婦加算ですね。名前が長いですが、仕組みから理解するとかなり覚えやすいです。」\n\n一言でいうと、\n\n一定の要件を満たす40歳以上65歳未満の妻に、遺族厚生年金へ上乗せされる加算\n\nです。\n\nまず試験用の中心数字は、\n\n40歳 → 65歳\nそして、これまでの内容とつなげると、\n\n子どもが小さい\n→ 遺族基礎年金＋遺族厚生年金\n\n子どもが成長\n→ 遺族基礎年金が終了することがある\n\n妻はまだ65歳未満\n→ 自分の老齢基礎年金もまだ\n\n「この間を支える役割を持つのが、中高齢寡婦加算だとイメージしてください。」\n\nB【詳しい解説｜なぜこんな加算が必要なの？】\n「先輩、45歳の妻を考えます。」\n\n👩妻45歳\n👨夫が死亡\n\n夫は会社員として厚生年金に加入していました。\n\n一定の要件を満たせば、\n\n👩妻\n→ 遺族厚生年金\n\nを受け取ります。\n\nでも、ここで問題です。\n\n「妻自身の老齢基礎年金は何歳からでした？」\n\n→ 原則65歳\n\nですよね。\n\nつまり45歳ではまだ20年あります。\n\nそこで一定の要件を満たす妻について、\n\n遺族厚生年金\n＋\n中高齢寡婦加算\n\nとして保障を厚くするわけです。\n\n【どんな妻が対象？】\n「ここは2パターンで整理すると覚えやすいですよ。」\n\nパターン① 夫が亡くなったとき、妻が40歳以上65歳未満で、一定の子がいない\n↓\n\n遺族基礎年金がありません。\n\n↓\n\n一定の要件を満たせば、\n\n遺族厚生年金＋中高齢寡婦加算\n\nパターン② 夫が亡くなったときは40歳未満で子どもがいた\n「先輩、たとえば妻38歳、子15歳なら？」\n\n👩38歳＋👦15歳\n\n↓\n\n子がいるので、要件を満たせば\n\n遺族基礎年金＋遺族厚生年金\n\n↓\n\nやがて子どもが対象年齢を超える\n\n↓\n\n遺族基礎年金が終了\n\nその時点で妻が、\n\n40歳以上\nなら、\n\n一定の要件を満たすことで、\n\n中高齢寡婦加算\n\nが加算される場合があります。\n\n「あ、ここが大事です。夫が亡くなった瞬間だけを見る制度ではないんですね。」\n\nC【イメージ理解｜40歳から65歳への橋】\n「先輩、時間軸を一本引きます。」\n\n子どもが小さい時期\n👩＋👦\n\n遺族厚生年金\n＋\n遺族基礎年金\n\n　　　　↓\n\n👦成長\n\n遺族基礎年金\n→ 終了\n\n　　　　↓\n\n👩40歳以上\n\n遺族厚生年金\n＋\n中高齢寡婦加算\n\n　　　　↓\n\n👩65歳\n\n中高齢寡婦加算終了\n\n「つまり――」\n\n遺族基礎年金 → 中高齢寡婦加算 → 65歳\nという橋をイメージするといいです。\n\n【なぜ65歳で終わるの？】\n「先輩、これはもう分かりますよね。」\n\n65歳になると、\n\n👩自身の\n\n老齢基礎年金\n\nを受給する年齢になります。\n\nだから中高齢寡婦加算は、\n\n65歳で終了\nするわけです。\n\n「40～65という数字だけではなく、65＝自分の老齢基礎年金が始まる年齢とつなげれば忘れにくいですよ。」\n\nD【具体例①｜子どものいない妻】\n👨夫死亡\n👩妻50歳\n👦子なし\n\n夫について厚生年金の加入期間などの要件を満たしているとします。\n\n↓\n\n妻は遺族厚生年金を受給。\n\nしかし、\n\n子どもがいない\n\n↓\n\n遺族基礎年金は原則なし\n\nそこで一定の要件を満たせば、\n\n遺族厚生年金\n＋\n中高齢寡婦加算\n\n↓\n\n65歳まで\n\nという流れです。\n\nD【具体例②｜子どもがいる妻】\n「今度はこっち。」\n\n夫死亡時、\n\n👩妻38歳\n👦子15歳\n\n↓\n\n要件を満たして、\n\n遺族基礎年金＋遺族厚生年金\n\nを受給。\n\n数年後、\n\n子どもが18歳になった年度の3月31日を経過。\n\n↓\n\n遺族基礎年金\n→ 終了\n\nこのとき妻は、\n\n👩41歳\n\n「40歳を超えていますね。」\n\n↓\n\n一定の要件を満たせば、\n\n中高齢寡婦加算\n\nが遺族厚生年金に加算される。\n\n↓\n\n妻65歳\n\n↓\n\n中高齢寡婦加算終了\n\nです。\n\n【寡婦年金と混ぜない！】\n「先輩、名前が似すぎているので、ここは絶対に分離します。」\n\n寡婦年金\n→ 国民年金\n\n→ 主に第1号被保険者だった夫の死亡\n\n→ 60～65歳\n\n→ 夫の第1号期間に基づく老齢基礎年金額の3/4\n\n中高齢寡婦加算\n→ 厚生年金\n\n→ 遺族厚生年金に上乗せ\n\n→ 40～65歳が重要\n\n「なので名前ではなく数字で――」\n\n寡婦年金＝国民・60～65\n中高齢寡婦加算＝厚生・40～65\nと分けてください。\n\n【振替加算とも混ぜない】\n「さらに『加算』つながりで振替加算とも混ざりやすいです。」\n\n制度\tどこに付く？\t年齢のイメージ\n配偶者加給年金額\t老齢厚生年金\t配偶者65歳未満\n振替加算\t配偶者自身
