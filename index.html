の老齢基礎年金\t65歳以後\n中高齢寡婦加算\t遺族厚生年金\t40～65歳\n「先輩、特に振替加算と中高齢寡婦加算は目的が全然違います。」\n\n振替加算\n→ 老齢年金の話\n\n中高齢寡婦加算\n→ 夫が亡くなったあとの遺族年金の話\n\nです。\n\n【金額はどう考える？】\n中高齢寡婦加算の額は、基本的に\n\n老齢基礎年金の満額の4分の3相当\n\nという考え方です。\n\n「ここでも3/4が出てきます。」\n\nただし年金額そのものは年度によって改定されるので、FPではまず、\n\n中高齢寡婦加算＝老齢基礎年金満額の3/4相当\n\nと仕組みを押さえるのがおすすめです。\n\n【超重要な全体図】\n「先輩、ここまでの遺族関係を時間軸にします。」\n\n夫死亡\n\n↓\n\n👩＋👦\n遺族基礎＋遺族厚生\n\n↓\n\n👦成長\n遺族基礎終了\n\n↓\n\n👩40～64歳\n遺族厚生＋中高齢寡婦加算\n\n↓\n\n👩65歳\n中高齢寡婦加算終了\n\n↓\n\n👩自身の老齢基礎年金などへ\n\n「これが中高齢寡婦加算の位置です。」\n\n【理解確認】\n「はい先輩、5問です。」\n\nQ1\n中高齢寡婦加算は何に加算される？\n\n→ 遺族厚生年金\n\nQ2\n重要な年齢は？\n\n→ 40歳以上65歳未満\n\nQ3\n65歳になると？\n\n→ 中高齢寡婦加算は終了\n\nQ4\n子が成長して遺族基礎年金がなくなった妻にも関係する？\n\n→ 一定の要件を満たせば関係する\n\nQ5\n寡婦年金との最大の違いは？\n\n→ 寡婦年金は国民年金、中高齢寡婦加算は厚生年金\n\n【30秒復習】\n① 何に付く？\n→ 遺族厚生年金\n\n② 誰？\n→ 一定の妻\n\n③ 開始年齢の重要ライン\n→ 40歳\n\n④ 終了\n→ 65歳\n\n⑤ 金額の基本\n→ 老齢基礎年金満額の3/4相当\n\n⑥ 寡婦年金との区別\n→ 国民60～65／厚生40～65\n\n【一文で覚える】\n中高齢寡婦加算＝「夫の死亡後、一定の要件を満たす40歳以上65歳未満の妻について、遺族厚生年金に上乗せされる加算」。\n\n「先輩、最後はこの絵です。」\n\n子が小さい\n→ 遺族基礎＋遺族厚生\n\n　　　　↓\n\n子が成長\n\n　　　　↓\n\n40～65歳\n→ 遺族厚生＋中高齢寡婦加算\n\n　　　　↓\n\n65歳\n→ 加算終了\n\n『中高齢＝40、老齢年金＝65。その間を埋める加算』\nこれで覚えると、寡婦年金や振替加算とも区別しやすくなります。\n\n公的年金控除\n"}, {"n": 54, "title": "公的年金等控除", "raw": "A【要点｜年金収入の全部に税金がかかるわけではありません】\n「先輩、正式には公的年金等控除ですね。ここから少し税金の話に入ります。」\n\n老齢基礎年金や老齢厚生年金などの公的年金を受け取ると、税法上は原則として雑所得になります。ただし、受け取った年金全額をそのまま所得として課税するわけではありません。\n\n基本は、\n\n公的年金等の収入 − 公的年金等控除額 ＝ 公的年金等に係る雑所得\nです。\n\n「先輩、給与所得控除の年金版だと思うと分かりやすいですよ。」\n\nB【詳しい解説｜「収入」と「所得」を分ける】\n「たとえば先輩が65歳以上で、年間200万円の公的年金を受け取ったとします。」\n\nこの、\n\n200万円＝収入\n\nです。\n\nでも、\n\n「200万円全部に所得税がかかる？」\n\n→ 違います。\n\n一定の公的年金等控除額を差し引いて、\n\n200万円 − 控除額\n\nと計算します。\n\n2026年分について、公的年金等以外の所得が1,000万円以下の場合、65歳以上で公的年金等収入330万円以下なら最低控除額は110万円です。したがって200万円なら、\n\n200万円 − 110万円 ＝ 90万円\n\nこの90万円が公的年金等に係る雑所得になります。国税庁も同じ200万円→90万円の計算例を示しています。\n\n「ここ、大事ですよ。」\n\n200万円＝年金収入\n\n90万円＝年金の所得\n\nです。\n\n【65歳が境目】\n「公的年金等控除で特に重要なのが年齢です。」\n\n公的年金等以外の所得が1,000万円以下の場合の最低控除額は、\n\n65歳未満\n→ 60万円\n\n65歳以上\n→ 110万円\n\nです。\n\n65歳未満＝60万円\n65歳以上＝110万円\n「FPではまずこの65・60・110を固定しましょう。」\n\nC【イメージ理解｜税金の計算に入る前の「削る機械」】\n「先輩、年金200万円をそのまま税金計算の箱に入れないでください。」\n\n年金収入\n💰💰💰 200万円\n\n　　　↓\n\n⚙️ 公的年金等控除\n\n　　　↓\n\n💰 90万円\n\n　　　↓\n\n雑所得として税金計算へ\n\nというイメージです。\n\n「つまり公的年金等控除そのものが現金でもらえるわけではありません。」\n\n税金を計算するときの所得を小さくする仕組み\n\nなんです。\n\nD【具体例①｜65歳以上・年金200万円】\n👴68歳\n公的年金収入＝200万円\nその他の所得は少ないとします。\n\n65歳以上で、この収入水準なら、\n\n控除額110万円\n\nなので、\n\n200万円\n－110万円\n＝ 90万円\n\n→ 公的年金等に係る雑所得は90万円\n\nです。\n\n【具体例②｜65歳未満・年金100万円】\n「今度は62歳としましょう。」\n\n👨62歳\n公的年金収入＝100万円\n\n65歳未満で、この収入水準なら、\n\n控除額60万円\n\nなので、\n\n100万円\n－60万円\n＝ 40万円\n\n→ 雑所得は40万円\n\nです。\n\n【じゃあ65歳以上で年金100万円なら？】\n「先輩、ここは自分で計算してみてください。」\n\n👴70歳\n年金収入100万円\n\n65歳以上の最低控除額は？\n\n→ 110万円\n\nでも収入は100万円しかありません。\n\n「100－110＝マイナス10万円？」\n\n→ 所得をマイナス10万円にはしません。\n\nこの場合、公的年金等に係る雑所得は、\n\n0円\nです。\n\n国税庁の速算表でも、65歳以上で年金収入110万円以下なら雑所得0円となっています。\n\n【障害年金・遺族年金は？】\n「先輩、直前まで障害年金・遺族年金を勉強していましたよね。ここ、つながります。」\n\n障害年金・遺族年金は原則として非課税です。\n\nですから、\n\n「障害基礎年金を受け取ったから、公的年金等控除を引いて所得計算しよう」\n\nという話ではありません。\n\n公的年金等控除の中心になるのは、\n\n老齢基礎年金・老齢厚生年金などの課税対象となる公的年金\n\nです。\n\n【基礎控除とは別物】\n「もう一個、先輩が混ぜそうなので先回りします。」\n\n公的年金等控除\n年金収入から引く。\n\n年金収入 → 雑所得\n\nを計算する段階。\n\n↓\n\n基礎控除などの所得控除\nその後、所得税を計算する段階で所得から差し引く。\n\n「つまり、同じ『控除』でも場所が違います。」\n\n年金収入\n↓\n公的年金等控除\n↓\n雑所得\n↓\n他の所得と合算\n↓\n基礎控除などの所得控除\n↓\n課税所得\n↓\n税率\n\nという順番です。\n\n【試験用に整理】\nポイント\t内容\n公的年金の所得区分\t雑所得\n計算\t年金収入－公的年金等控除\n65歳未満の最低控除\t60万円\n65歳以上の最低控除\t110万円\n障害年金\t原則非課税\n遺族年金\t原則非課税\n※60万円・110万円は、公的年金等以外の所得が1,000万円以下の場合の最低控除額です。所得が高い場合などは控除額が変わります。\n\n【理解確認】\n「はい先輩、5問です。」\n\nQ1\n公的年金は原則何所得？\n\n→ 雑所得\n\nQ2\n年金の所得はどう計算する？\n\n→ 公的年金等収入－公的年金等控除額\n\nQ3\n65歳未満の最低控除額は？\n\n→ 60万円\n\nQ4\n65歳以上は？\n\n→ 110万円\n\nQ5\n障害年金・遺族年金は？\n\n→ 原則非課税\n\n【30秒復習】\n① 老齢年金\n→ 雑所得\n\n② 年金収入\n→ そのまま全部課税ではない\n\n③ 引くもの\n→ 公的年金等控除\n\n④ 65歳未満\n→ 60万円\n\n⑤ 65歳以上\n→ 110万円\n\n⑥ 障害・遺族年金\n→ 原則非課税\n\n【一文で覚える】\n公的年金等控除＝「課税対象となる公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除」。\n\n「先輩、最後はこれです。」\n\n年金収入 − 年金控除 ＝ 雑所得\nそして数字は、\n\n65歳未満 → 60万円\n65歳以上 → 110万円\n「65・60・110。まずこの3つを軸にしておけば、FPの基本問題はかなり整理しやすくなりますよ。」\n確定拠出年金\n"}, {"n": 55, "title": "確定拠出年金", "raw": "A【要点｜「もらえる額」ではなく「出す額」が決まっている年金】\n「先輩、確定拠出年金ですね。ここは名前を分解すればかなり簡単です。」\n\n確定・拠出・年金\n拠出＝お金を出すことです。\n\nつまり、\n\n出す掛金（拠出額）は決まっているけれど、将来受け取れる年金額は運用結果によって変わる年金制度\n\nです。\n\n「先輩、ここを逆にしないでくださいね。」\n\n確定拠出年金\n→ 掛金が決まる\n→ 自分で運用\n→ 受取額は変わる\n\nこれに対して、\n\n確定給付企業年金\n→ 将来の給付額があらかじめ決められている\n\nという違いがあります。\n\nB【詳しい解説｜なぜ受取額が変わるの？】\n「先輩、毎月2万円積み立てるとしましょう。」\n\n毎月、\n\n💰2万円\n💰2万円\n💰2万円……\n\nと拠出します。\n\nこのお金をただ箱に入れておくのではなく、\n\n定期預金\n保険商品\n投資信託\n\nなどの中から商品を選んで運用します。\n\nすると当然、\n\n運用がうまくいく\n→ 資産が増える\n\n運用が悪い\n→ 思ったほど増えない・商品によっては元本割れもあり得る\n\nとなります。\n\nだから、\n\n将来いくらになるかは運用次第\nなんです。\n\n【誰が運用するの？】\n「会社が全部やってくれるんですか？」\n\n→ 基本的には加入者自身が運用商品を選択します。\n\nここが確定拠出年金の重要ポイントです。\n\n会社などが掛金を出したとしても、\n\nその資金をどう運用するかを決めるのは加入者\n\nというのが基本です。\n\n「つまり先輩、自分の老後資金について、自分で運用の判断をする制度なんですね。」\n\n【2種類あります】\n「確定拠出年金を見たら、まず2つに分けます。」\n\n① 企業型DC\n② iDeCo\nです。\n\nDCは、\n\nDefined Contribution\n\n＝ 確定拠出\n\nという意味です。\n\n① 企業型DC\n「まず会社版です。」\n\n企業が制度を導入して、\n\n基本的には、\n\n事業主が掛金を拠出\n\nします。\n\n↓\n\n従業員が、\n\n「どの商品で運用しよう？」\n\nと運用商品を選択。\n\n↓\n\n将来、\n\n掛金＋運用成果\n\nを基礎として給付を受けます。\n\nつまり、\n\n会社がお金を出す → 従業員が運用\nというイメージです。\n\n制度によっては加入者本人が掛金を上乗せする仕組みもあります。\n\n② iDeCo\n「先輩、こっちは聞いたことがありますよね。」\n\n個人型確定拠出年金＝iDeCo\nです。\n\n基本的には、\n\n自分で掛金を出す\n\n↓\n\n自分で運用商品を選ぶ\n\n↓\n\n自分の老後資金として受け取る\n\nという仕組みです。\n\nなので、\n\n企業型DC\n→ 会社の制度\n\niDeCo\n→ 個人で加入する制度\n\nというイメージで最初は十分です。\n\nC【イメージ理解｜老後用の「自分専用の箱」】\n「先輩、自分専用の老後資金BOXを想像してください。」\n\n📦 先輩のDC口座\n\n毎月、\n\n💰掛金\n↓\n📦\n\nそこから、\n\n「定期預金にしよう」\n\n「投資信託にしよう」\n\nと自分で運用します。\n\n30年後――\n\n📦💰💰💰💰💰\n\nどれだけ入っているかは、\n\n掛金\n＋\n運用結果\n\nで決まる。\n\nだから、\n\n「30年後に絶対2,000万円もらえます！」\n\nとは約束されていません。\n\n拠出額は確定・給付額は変動\nなんです。\n\n「はい、これで『確定拠出』という名前がそのまま意味になりましたね。」\n\nD【具体例｜毎月2万円を積み立てる】\n「単純化して考えます。」\n\n毎月2万円を30年間拠出。\n\n年間なら、\n\n2万円 × 12\n＝ 24万円\n\n30年間なら、\n\n24万円 × 30\n＝ 720万円\n\nこれが掛金の合計だとします。\n\nでも実際の受取額は、\n\n運用が好調\n720万円\n＋運用益\n\n→ 900万円になった\n\nかもしれません。\n\n逆に、\n\n運用が不調\n→ 720万円を下回る\n\n可能性もあります。\n\n※実際には選択商品・手数料などによって異なります。\n\n「つまり720万円拠出したから、将来必ず720万円以上もらえる制度、ではないんです。」\n\n【確定給付との違い】\n「ここはセットで出されたら絶対取ってください。」\n\n確定拠出年金（DC）\n出す金額が決まる\n\n↓\n\n運用\n\n↓\n\nもらう金額が変わる\n\n確定給付企業年金（DB）\n将来の、\n\nもらう金額（給付）が決まっている\n\nという考え方。\n\n「名前をそのまま読めばいいんですよ。」\n\n確定拠出＝出す方が確定\n確定給付＝もらう方が確定\nこれです。\n\n【税制上のメリット】\n「先輩、確定拠出年金が普通の貯金と違う大きな理由がここです。」\n\n特にiDeCoでは、税制上、\n\n① 拠出時\n\n→ 掛金が小規模企業共済等掛金控除の対象\n\n② 運用時\n\n→ 運用益が基本的に非課税\n\n③ 受取時\n\n→ 一時金なら退職所得控除、年金なら公的年金等控除などの対象\n\nという税制優遇があります。\n\n「つまり――」\n\n入れる・増やす・受け取る\nそれぞれの段階に税制上の仕組みがあるんですね。\n\n【ただし自由に引き出せない】\n「じゃあ先輩、税制優遇があるなら普通の貯金を全部iDeCoに……」\n\n「ちょっと待ってください。」\n\n確定拠出年金は、\n\n老後資金のための制度\nです。\n\nそのためiDeCoは原則として、\n\n60歳まで資産を引き出せません。\n\nまた、60歳から受給するには通算加入者等期間の要件があり、加入期間が短い場合には受給開始可能年齢が後ろにずれます。\n\n「なので、来年使う車代や旅行代を入れる場所ではありません。」\n\n【受け取り方】\n老後になったら、基本的に、\n\n年金として受け取る\n→ 分割して受給\n\nまたは、\n\n一時金として受け取る\n→ まとめて受給\n\nなどの方法があります。\n\nそして先ほど言ったように、\n\n年金\n→ 公的年金等控除など\n\n一時金\n→ 退職所得控除\n\nが関係してきます。\n\n「あ、先輩。さっき勉強した公的年金等控除がここにつながりましたね。」\n\n【公的年金との違い】\n「確定拠出年金を国民年金や厚生年金と混ぜないでください。」\n\n公的年金\n国民年金・厚生年金\n\n→ 社会保障制度\n\n確定拠出年金\n→ 公的年金に上乗せして老後資金を準備する私的年金制度\n\nという位置づけです。\n\nイメージなら、\n\n国民年金・厚生年金\n↓\n老後生活の土台\n\n＋\n\n企業型DC・iDeCo\n↓\n自分で老後資金を上乗せ\n\nですね。\n\n【完全比較】\n企業型DC\tiDeCo\n正式な位置づけ\t企業型確定拠出年金\t個人型確定拠出年金\n基本イメージ\t会社の制度\t個人で加入\n掛金\t基本は事業主\t基本は本人\n運用\t加入者本人\t加入者本人\n将来の給付\t運用結果で変動\t運用結果で変動\n老後資金\t○\t○\n※掛金上限や加入可能年齢などは勤務先の企業年金制度や加入区分、法改正によって変わるため、具体的な数字を扱うときはその時点の制度確認が必要です。\n\n【理解確認】\n「はい先輩、5問です。」\n\nQ1\n確定拠出年金で「確定」しているのは？\n\n→ 拠出する掛金\n\nQ2\n将来の受取額は？\n\n→ 運用結果によって変わる\n\nQ3\n確定拠出年金の2種類は？\n\n→ 企業型DC・iDeCo\n\nQ4\n運用商品を選ぶのは基本的に誰？\n\n→ 加入者本人\n\nQ5\niDeCoは原則何歳まで引き出せない？\n\n→ 60歳\n\n【30秒復習】\n① 確定拠出\n→ 出す額が決まる\n\n② 受取額\n→ 運用次第\n\n③ 会社版\n→ 企業型DC\n\n④ 個人版\n→ iDeCo\n\n⑤ 運用する人\n→ 自分\n\n⑥ iDeCoの引出し\n→ 原則60歳まで不可\n\n【一文で覚える】\n確定拠出年金＝「あらかじめ拠出する掛金が決まり、加入者自身が運用し、その運用結果によって将来の給付額が変わる私的年金制度」。\n\n「先輩、最後は名前だけで思い出してください。」\n\n確定拠出\n→ 出す額が確定\n→ 自分で運用\n→ もらう額は変動\n\n対して、\n\n確定給付\n→ もらう額が確定\n\n「拠出＝出す、給付＝もらう。ここさえ日本語として理解してしまえば、DCとDBを逆にすることはかなり減りますよ。」\n\n小規模企業共済等掛金控除\n"}, {"n": 56, "title": "小規模企業共済等掛金控除", "raw": "A【要点｜払った掛金を「所得から引ける」】\n「先輩、さっきiDeCoで出てきた言葉ですね。ここでちゃんと正体を掴みましょう。」\n\n小規模企業共済等掛金控除とは、\n\niDeCoや小規模企業共済などの対象となる掛金を支払った場合、その年に支払った掛金の全額を所得から控除できる所得控除\n\nです。\n\nまず最重要ポイントは、\n\n掛金の全額が所得控除\nです。\n\n「先輩、『払った掛金と同じ額だけ税金が安くなる』ではありませんよ。ここ、かなり大事です。」\n\n掛金を所得から引く\n→ 課税対象が小さくなる\n→ 所得税・住民税の負担が軽くなる\n\nという順番です。\n\nB【詳しい解説｜iDeCoとつなげましょう】\n「先輩がiDeCoに毎月2万円を拠出するとします。」\n\n毎月\n2万円\n\n↓\n\n1年間なら、\n\n2万円 × 12か月\n＝ 24万円\n\nですね。\n\nこの24万円について、\n\n24万円全額が小規模企業共済等掛金控除\nの対象になります。\n\nつまり、\n\n所得 − 24万円\n\nとして税金を計算できるわけです。\n\n【24万円税金が戻るわけじゃない】\n「先輩、ここで一回止めます。」\n\n👨「24万円控除なら、税金が24万円安くなる？」\n\n→ 違います。\n\n控除されるのは、\n\n税額ではなく所得\n\nです。\n\nたとえば単純化して、\n\n課税対象となる所得\n300万円\n\nだったところから、\n\niDeCo掛金24万円\n\n↓\n\n300万円 − 24万円\n\n＝ 276万円\n\nというように、税率を掛ける対象を小さくするイメージです。\n\nだから、\n\n控除額＝節税額ではない\nですよ。\n\nC【イメージ理解｜税金を計算する前に荷物を軽くする】\n「先輩、300kgの荷物に税金をかけると想像してください。」\n\n最初は、\n\n📦 300万円\n\nあります。\n\nでも、\n\n「iDeCoに24万円払いました。」\n\n↓\n\n小規模企業共済等掛金控除\n\n✂️ 24万円\n\n↓\n\n📦 276万円\n\nここから税金を計算する。\n\n「つまり、税金そのものを24万円切るのではなく、税金を計算する土台を24万円小さくするんです。」\n\nD【具体例｜節税額まで計算してみる】\n「ものすごく単純化して、所得税率10％だとしましょう。」\n\n年間iDeCo掛金\n\n24万円\n\n↓\n\n全額所得控除\n\n↓\n\n所得税だけを見ると、\n\n24万円 × 10％\n\n＝ 2万4,000円\n\n税負担が軽くなる計算です。\n\nさらに住民税についても所得控除が反映されるため、実際の税負担軽減効果は所得税だけではありません。\n\n「だから――」\n\n24万円払う\n→ 24万円そのものが戻る\n\nではなく、\n\n24万円所得が減る\n→ その人に適用される税率などに応じて税負担が減る\n\nです。\n\n【何が対象になるの？】\n「名前が『iDeCo控除』じゃないですよね。」\n\n小規模企業共済等掛金控除には、代表的に、\n\n① 小規模企業共済の掛金\n\n② iDeCo（個人型確定拠出年金）の掛金\n\nなどが対象になります。\n\n「FPでは特に、\n\niDeCo掛金 → 小規模企業共済等掛金控除\nこの線を強く結んでおいてください。」\n\n【確定拠出年金の3段階とつなげる】\n「前回の話がここで完成します。」\n\n① 掛金を出すとき\niDeCo掛金\n\n↓\n\n小規模企業共済等掛金控除\n↓\n\n全額所得控除\n\n② 運用しているとき\n運用益\n\n↓\n\n基本的に非課税\n\n③ 受け取るとき\n年金形式\n→ 公的年金等控除\n\n一時金形式\n→ 退職所得控除\n\n「先輩、これ、かなりきれいですよ。」\n\n入口 → 小規模企業共済等掛金控除\n途中 → 運用益非課税\n出口 → 公的年金等控除／退職所得控除\nです。\n\n【公的年金等控除との違い】\n「直前にやったものと混ぜないようにします。」\n\n控除\tいつ？\t何に関係？\n小規模企業共済等掛金控除\tお金を出すとき\tiDeCoなどの掛金\n公的年金等控除\t年金を受け取るとき\t公的年金等の収入\n退職所得控除\t一時金として受け取るとき\t退職所得\n「つまりiDeCoなら――」\n\n入れるとき\n→ 小規模企業共済等掛金控除\n\n年金でもらう\n→ 公的年金等控除\n\n一時金でもらう\n→ 退職所得控除\n\nです。\n\n【生命保険料控除との違い】\n「先輩、もう一つ似たものがあります。」\n\n生命保険料を払ったら、\n\n→ 生命保険料控除\n\niDeCo掛金を払ったら、\n\n→ 小規模企業共済等掛金控除\n\nです。\n\nそして大きな特徴として、小規模企業共済等掛金控除は、\n\nその年に支払った対象掛金の全額\nが所得控除になります。\n\n「ここは生命保険料控除と同じ感覚で上限額を覚えようとすると混乱します。」\n\n【会社員ならどうやって控除する？】\n「先輩、会社員でもiDeCoをやりますよね。」\n\n対象となる掛金については、状況に応じて、\n\n年末調整\n\nまたは\n\n確定申告\n\nで控除を反映させます。\n\n給与天引きなど拠出方法によって手続きが異なる場合があります。\n\nなので、\n\n「iDeCoに入っただけで、どんな場合でも何もしなくても自動的に全部処理される」\n\nと覚えるのは避けましょう。\n\n【重要｜所得がない場合は？】\n「先輩、ここは仕組みを理解しているか確認できます。」\n\n所得がほとんどなく、そもそも所得税などの負担がない人が、\n\niDeCoに掛金を出した。\n\n「全額所得控除だから、大きな節税になる？」\n\n→ 必ずしもそうではありません。\n\nなぜなら、\n\n所得から差し引く制度\n\nだからです。\n\nもともと課税される所得がなければ、\n\n差し引くことで減らせる税金も基本的にはありません。\n\n「ここまで分かれば、『所得控除』という言葉を本当に理解できています。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\niDeCoの掛金に使われる所得控除は？\n\n→ 小規模企業共済等掛金控除\n\nQ2\n対象となる掛金はいくら控除？\n\n→ その年に支払った対象掛金の全額\n\nQ3\n年間24万円掛けたら、税金が24万円安くなる？\n\n→ 違う。所得から24万円を控除する。\n\nQ4\niDeCoを年金形式で受け取ると関係する控除は？\n\n→ 公的年金等控除\n\nQ5\n一時金形式なら？\n\n→ 退職所得控除\n\n【30秒復習】\n① iDeCo掛金\n→ 小規模企業共済等掛金控除\n\n② 控除額\n→ 対象掛金の全額\n\n③ 何から引く？\n→ 所得\n\n④ 税金から直接引く？\n→ ×\n\n⑤ iDeCoを年金で受取\n→ 公的年金等控除\n\n⑥ 一時金で受取\n→ 退職所得控除\n\n【一文で覚える】\n小規模企業共済等掛金控除＝「iDeCoや小規模企業共済などの対象掛金について、その年に支払った全額を所得から差し引ける所得控除」。\n\n「先輩、最後はiDeCoを一本の道にしてください。」\n\n入れる\n→ 小規模企業共済等掛金控除\n\n運用する\n→ 運用益は基本的に非課税\n\n受け取る\n→ 年金なら公的年金等控除\n→ 一時金なら退職所得控除\n\n「特に試験では、iDeCo → 全額 → 小規模企業共済等掛金控除。この3点を反射で出せるようにしておきましょう。」\n\n中退共\n"}, {"n": 57, "title": "中退共", "raw": "A【要点｜中小企業向けの「社外積立型の退職金制度」】\n「先輩、**中退共（ちゅうたいきょう）**ですね。正式名称から見れば正体がかなり分かります。」\n\n中小企業退職金共済制度\n一言でいうと、\n\n単独で退職金制度を整えるのが難しい中小企業が、中退共を利用して従業員の退職金を準備する制度\n\nです。\n\n流れは、\n\n会社が掛金を払う\n↓\n中退共に積み立てる\n↓\n従業員が退職\n↓\n中退共から従業員本人へ退職金\n\nです。\n\n「先輩、まずここです。」\n\n会社 → 中退共 → 退職した従業員\n会社が退職金を直接渡す仕組みではありません。\n\nB【詳しい解説｜なぜ中退共があるの？】\n「大企業なら、自社で大規模な退職金制度を作れるかもしれません。」\n\nでも小さな会社だと、\n\n👨‍💼「退職金制度を自社だけで設計・管理するのは大変だな……」\n\nとなります。\n\nそこで、\n\n「だったら中小企業みんなで使える退職金の仕組みを作りましょう」\n\nというのが中退共です。\n\n制度を運営しているのは、独立行政法人の勤労者退職金共済機構です。\n\nつまり、\n\n会社の中で退職金を積み立てる\n\nというより、\n\n会社の外にある制度を使って退職金を準備する\n\nイメージですね。\n\n中退共＝社外積立\nここ、かなり重要です。\n\n【誰が掛金を払う？】\n「先輩、iDeCoをやった直後なので比較しましょう。」\n\n中退共の掛金は、\n\n事業主が全額負担\nします。\n\n従業員が、\n\n「毎月5,000円、自分の給料から出します」\n\nという制度ではありません。\n\n会社が掛金を負担\n↓\n従業員の退職金を準備\n\nです。\n\n【じゃあ退職金は会社に振り込まれる？】\n「ここ、引っかけられやすいですよ。」\n\n従業員が退職した。\n\n↓\n\n中退共\n\n↓\n\n会社にお金を渡す\n\n↓\n\n会社から従業員へ……\n\nではありません。\n\n原則として、\n\n中退共 → 退職した従業員本人\nへ直接支払われます。\n\n「会社がお金を途中で受け取って渡すわけではないんですね。」\n\nC【イメージ理解｜会社の外に「退職金貯金箱」を置く】\n「先輩、会社の外に巨大な貯金箱があると思ってください。」\n\n🏢中小企業\n\n毎月、\n\n💰「従業員Aさん分」\n💰「従業員Bさん分」\n\n↓\n\n📦 中退共\n\n会社が掛金を積み立てていきます。\n\nそしてAさんが退職。\n\n👨‍💼「退職します。」\n\n↓\n\n📦中退共\n\n↓\n\n💰💰💰\n\n↓\n\n👨‍💼Aさん\n\n退職金を直接受け取る。\n\n「だから会社が倒産した場合などでも、会社内部だけで退職金を積み立てている場合とは性質が違います。」\n\nD【具体例｜小さな会社が加入】\n「例えば従業員20人の会社を考えます。」\n\n社長が、\n\n👨‍💼「うちでも従業員のために退職金制度を作りたい。」\n\nでも、\n\n「自社だけで全部管理するのは大変だ。」\n\n↓\n\n中退共に加入\n\n↓\n\n会社が従業員ごとに掛金を拠出\n\n↓\n\n10年後、Aさんが退職\n\n↓\n\n中退共からAさんへ、\n\n加入期間や掛金月額などに応じた退職金\n\nが直接支給される。\n\n「これが基本形です。」\n\n【国から助成もある】\n「先輩、中小企業が退職金制度を導入しやすくするための制度なので、一定の場合には国による掛金の助成があります。」\n\nたとえば新しく中退共制度に加入する事業主に対する掛金助成などがあります。\n\nただし、助成内容や対象要件は制度改正の可能性があるので、具体的な金額・期間を問われる場合にはその年度の情報確認が必要です。\n\nFPではまず、\n\n中退共には国の掛金助成制度がある\nと押さえておけば骨格になります。\n\n【掛金は会社側でどうなる？】\n「会社が掛金を出すなら、税金上どう扱うの？」\n\nここも重要です。\n\n事業主が負担する掛金は、一定の要件のもと、\n\n法人企業\n→ 損金\n\n個人企業\n→ 必要経費\n\nとして扱われます。\n\n「先輩、従業員個人が小規模企業共済等掛金控除を使う、という話ではありません。」\n\n会社が負担しているからです。\n\n【小規模企業共済との違い】\n「名前が似ているので、ここ絶対に整理しましょう。」\n\n中退共\n→ 中小企業の従業員\n\n→ 会社が掛金を負担\n\n→ 従業員の退職金\n\n小規模企業共済\n→ 主に小規模企業の経営者・個人事業主など\n\n→ 自分で掛金を出す\n\n→ 経営者自身の退職金のような役割\n\n「つまり――」\n\n中退共＝従業員\n小規模企業共済＝経営者など\nです。\n\n名前だけで混ぜないでくださいね。\n\n【iDeCoとも比較】\n「さらに今までの知識をつなげます。」\n\n制度\t誰のため？\t誰が基本的に掛金を出す？\t特徴\n中退共\t中小企業の従業員\t事業主\t退職金\n小規模企業共済\t経営者・個人事業主など\t本人\t経営者の退職金的制度\niDeCo\t加入者本人\t本人\t自分で運用する私的年金\n企業型DC\t従業員\t基本は事業主\t従業員自身が運用\n「中退共と企業型DCも、会社が掛金を出す点では似ています。」\n\nでも、\n\n企業型DC\n→ 従業員自身が運用商品を選ぶ\n\n中退共\n→ 中退共の仕組みに基づいて退職金が支給される\n\nという違いがあります。\n\n【転職したら全部終わり？】\n「先輩、『会社を辞めたらそこで全部リセット？』と思いますよね。」\n\n一定の条件を満たす場合には、転職先も中退共に加入していれば、過去の掛金納付月数を通算できる仕組みがあります。\n\nまた、他の退職金共済制度との間でも一定の通算制度があります。\n\n「つまり、転職＝必ずゼロから、というわけではありません。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n中退共の正式名称は？\n\n→ 中小企業退職金共済制度\n\nQ2\n誰の退職金を準備する？\n\n→ 中小企業の従業員\n\nQ3\n掛金を負担するのは？\n\n→ 事業主\n\nQ4\n退職金は基本的に誰から従業員へ支払われる？\n\n→ 中退共から直接\n\nQ5\n小規模企業共済との違いは？\n\n→ 中退共は従業員、小規模企業共済は主に経営者・個人事業主など\n\n【30秒復習】\n① 中退共\n→ 中小企業退職金共済\n\n② 対象\n→ 中小企業の従業員\n\n③ 掛金\n→ 事業主負担\n\n④ 積立場所\n→ 会社の外\n\n⑤ 退職金\n→ 中退共から本人へ直接\n\n⑥ 小規模企業共済\n→ 主に経営者側\n\n【一文で覚える】\n中退共＝「中小企業の事業主が従業員のために掛金を拠出し、中退共から退職した従業員本人へ退職金が直接支払われる社外積立型の退職金制度」。\n\n「先輩、最後はこの一本です。」\n\n🏢会社\n掛金を出す\n\n↓\n\n📦中退共\n会社の外で準備\n\n↓\n\n👨‍💼従業員\n退職時に直接受け取る\n\nそして、\n\n中退共＝従業員\n\n小規模企業共済＝経営者など\n\n「この対比まで一緒に覚えておけば、似た名前が出ても迷いにくくなりますよ。」\n\n分割払いとリボ払い\n"}, {"n": 58, "title": "分割払いとリボ払い", "raw": "A【要点｜「回数を決める」のか「毎月の支払額を決める」のか】\n「先輩、分割払いとリボ払いですね。似ていますけど、見る場所が違います。」\n\n一番大事なのはこれです。\n\n分割払い＝何回で払うかを決める\nリボ払い＝毎月いくら払うかを決める\nたとえば12万円の買い物なら、\n\n分割払い\n→「6回で払います」\n\nリボ払い\n→「毎月1万円程度ずつ払います」\n\n「先輩、回数か、毎月の金額か。まずこれで分けましょう。」\n\nB【詳しい解説｜12万円の買い物をしたら？】\n「実際に比べましょう。」\n\n① 分割払い\n💻12万円の商品を購入。\n\n「一括ではちょっと重いな。6回にしよう。」\n\n↓\n\n6回払い\n\nと最初に支払回数を決めます。\n\n手数料をいったん無視すると、\n\n12万円 ÷ 6回\n\n＝ 毎月2万円\n\nですね。\n\nそして、\n\n1回目 → 2万円\n2回目 → 2万円\n3回目 → 2万円\n……\n6回目 → 完済\n\n「ゴールが最初から見えています。」\n\n6回で終わる\nこれが分割払いのイメージです。\n\n【② リボ払い】\n「今度は同じ12万円ですが、考え方を変えます。」\n\n💻12万円の商品\n\n↓\n\n「毎月の支払いを1万円程度にしよう。」\n\n↓\n\n毎月一定額などのルールに従って返済していく。\n\nここで先輩、\n\n「じゃあ12回で終わる？」\n\n……とは限りません。\n\nなぜなら、\n\n手数料がかかる\nからです。\n\nさらに途中で、\n\n📱5万円の買い物\n\nを追加すると？\n\nリボ払いの残高が増える。\n\n↓\n\nそれでも設定された毎月の支払額が大きく変わらなければ、\n\n完済までの期間がさらに延びる\n可能性があります。\n\n「ここがリボ払いで特に注意したいところです。」\n\nC【イメージ理解｜ゴールを決めるか、歩幅を決めるか】\n「先輩、山道を歩くと考えてください。」\n\n分割払い\n👨「この山道を6回の行程でゴールする。」\n\n→ ゴールまでの回数を先に決める。\n\n回数固定型のイメージ\nリボ払い\n👨「毎月、このくらいのペースで進もう。」\n\n→ 毎月の負担を一定程度に抑える。\n\nところが途中で、\n\n🛍️追加利用\n🛍️追加利用\n\nすると……\n\n「先輩？ ゴール、遠ざかってますよ。」\n\n→ 支払い期間が延びる\n→ 手数料が積み重なる\n\nということが起こり得ます。\n\n分割＝ゴール回数を決める\nリボ＝毎月の歩幅を決める\nこの絵で覚えてください。\n\nD【具体例｜途中で追加購入すると違いがよく分かる】\n「ここが一番分かりやすいですよ。」\n\n最初に、\n\n💰12万円\n\n使ったとします。\n\n分割払い\n12万円を6回払い。\n\n→ その12万円について6回で支払う\n\nその後、新しく6万円の商品を買えば、\n\n→ 新しい6万円について別途支払方法を決める\n\nという考え方です。\n\nリボ払い\n残高12万円。\n\n↓\n\n毎月一定額などを返済。\n\nところが途中で、\n\n＋6万円利用\n\n↓\n\nリボ残高が増える\n毎月の支払額が同程度なら、\n\n支払い期間が後ろへ延びる\n\n可能性があります。\n\n「だからリボ払いは、毎月の請求額だけ見ていると、残高がなかなか減っていないことに気づきにくい場合があるんです。」\n\n【手数料は？】\n「分割もリボも、一般的には手数料が重要になります。」\n\nただし、\n\n分割払い\n→ 回数やカード会社などによって手数料が異なる。2回払いなどで手数料無料の商品・会社もあります。\n\nリボ払い\n→ 残高や期間などに応じて手数料が発生するのが一般的。\n\nしたがって、\n\n支払い期間が長くなる\n↓\n手数料負担も大きくなりやすい\n\nという関係を押さえましょう。\n\n【「毎月1万円」の中身に注意】\n「先輩、もう一段だけ深くいきます。」\n\nリボ払いで、\n\n毎月1万円\n\nと書いてあっても、\n\n「1万円全部が元金返済！」\n\nとは限りません。\n\n契約方式によって、\n\n元金\n＋\n手数料\n\nの扱いが異なります。\n\nリボ払いには複数の返済方式があるため、\n\n毎月の支払額だけではなく、利用残高・手数料率・支払方式を見る\n\nことが大切です。\n\n【一括払いも入れて3つ比較】\n一括払い\t分割払い\tリボ払い\n基本\t一度に払う\t回数を決める\t毎月の支払額などを決める\n例\t来月12万円\t6回払い\t毎月1万円程度\n完済時期\t明確\t明確になりやすい\t長期化しやすい\n追加利用\t次の請求へ\t別の利用として扱う\t残高が増える\n手数料\t通常なし\t条件により発生\t通常発生\n注意点\t一度の負担が大きい\t回数が多いほど負担増に注意\t残高・手数料を把握しにくくなりやすい\n【先輩、ここを間違えないでください】\n「リボ払い＝毎月同じ金額」\n\nとだけ覚えると少し危険です。\n\n実際にはカード会社や契約方式によって、\n\n毎月の支払額が完全に一定とは限りません。\n\n残高によって支払額が段階的に変わる方式などもあります。\n\nなのでFPとして正確に捉えるなら、\n\n分割払い\n利用代金を指定した回数に分けて支払う\n\nリボ払い\n利用残高に対して、あらかじめ設定された一定の支払方式で返済する\n\nです。\n\n「そのうえで覚え方として、回数 vs 毎月の負担を使いましょう。」\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\n6回、12回など支払回数を決めるのは？\n\n→ 分割払い\n\nQ2\n毎月一定額などの方式で利用残高を返済するのは？\n\n→ リボ払い\n\nQ3\n追加で買い物するとリボ払いでは？\n\n→ 利用残高が増える\n\nQ4\n毎月の支払額が小さければ、総支払額も必ず小さい？\n\n→ ×\n\nQ5\nリボ払いで特に確認したい3つは？\n\n→ 残高・手数料率・支払方式\n\n【30秒復習】\n① 分割\n→ 回数\n\n② リボ\n→ 毎月の支払方式\n\n③ 分割のゴール\n→ 見えやすい\n\n④ リボで追加利用\n→ 残高が増える\n\n⑤ 長期化\n→ 手数料負担増につながる\n\n⑥ リボで見るもの\n→ 毎月の請求額だけでなく残高\n\n【一文で覚える】\n分割払い＝「利用代金を決めた回数に分けて払う」、リボ払い＝「利用残高を毎月一定額など、あらかじめ決めた方式で払っていく」。\n\n「先輩、最後はこれだけ頭に置いてください。」\n\n分割＝回数を固定してゴールを見る\nリボ＝毎月の負担を抑える代わりにゴールが延びやすい\n特にリボは、『今月いくら払うか』だけではなく『あといくら残っているか』を見る。ここまでセットで理解しておけば大丈夫です。\n\nキャッシングと総量規制\n"}, {"n": 59, "title": "キャッシングと総量規制", "raw": "A【要点｜キャッシングは「現金を借りる」、総量規制は「借りすぎを防ぐ」】\n「先輩、キャッシングと総量規制ですね。この2つはセットで理解すると簡単です。」\n\nまず、\n\nキャッシング＝お金を借りること\nクレジットカードなどを使って、ATM等から現金を借りる仕組みです。\n\nそして、\n\n総量規制＝原則として年収の3分の1を超える貸付けを禁止するルール\nです。\n\nただし先輩、ここで重要です。\n\nすべての借金を合計して年収の1/3まで\n\nという意味ではありません。\n\n総量規制は貸金業法上の貸金業者からの借入れが中心です。\n\n「まずは――」\n\nキャッシング → 借金\n貸金業者 → 原則 年収の1/3\nで押さえましょう。\n\nB【詳しい解説｜ショッピングとキャッシングは別物です】\n「先輩、クレジットカードには大きく2つの機能があります。」\n\n🛒ショッピング\n10万円のパソコンをカードで購入。\n\nカード会社が店に代金を払い、\n\n↓\n\n後から先輩がカード会社に支払う。\n\n💴キャッシング\nATMでカードを使って、\n\n5万円の現金を借りる。\n\n↓\n\n後から、\n\n元金＋利息\n\nを返す。\n\n「つまり、カードを使っている点は同じでも――」\n\nショッピング＝商品・サービスの代金を後払い\n\nキャッシング＝現金を借りる\n\nなんです。\n\n【なぜ総量規制があるの？】\n「先輩、年収300万円の人に、貸金業者が500万円、600万円とどんどん貸したらどうなります？」\n\n👨「返済できなくなるかも……」\n\n「そうです。」\n\n過度な借入れを防止するため、\n\n貸金業者による一定の貸付けについて、\n\n借入残高が原則として年収の3分の1を超えない\nよう規制されています。\n\nこれが総量規制です。\n\nC【イメージ理解｜年収を3つの箱に分ける】\n「先輩、年収300万円をイメージしてください。」\n\n💰100万円\n💰100万円\n💰100万円\n\n3つに分けました。\n\nこのうち、\n\n📦1個分＝100万円\nこれが年収300万円に対する、\n\n1/3\n\nですね。\n\nしたがって総量規制の対象となる貸金業者からの借入れなら、\n\n原則100万円まで\nというイメージです。\n\nD【具体例｜複数社から借りたら？】\n「先輩、ここが試験で大事ですよ。」\n\n年収300万円。\n\n総量規制の基準は、\n\n300万円 × 1/3\n\n＝ 100万円\n\nとします。\n\nすでに、\n\nA社から\n→ 60万円\n\n借りている。\n\nそこでB社から、\n\n→ 60万円\n\n追加で借りたい。\n\n「60万円なら100万円以下だから大丈夫？」\n\n→ 違います。\n\n対象となる借入れを合計すると、\n\n60万円＋60万円\n\n＝ 120万円\n\nですよね。\n\n年収300万円の1/3である100万円を超えてしまいます。\n\n複数の貸金業者からの対象借入れを合算する\nここがポイントです。\n\n【クレジットカードのキャッシングは？】\n「ここで最初の話につながります。」\n\nクレジットカードの、\n\n💴 キャッシング\n\n→ 貸金業法の対象となる貸付け\n\n→ 総量規制の対象\n\nとなります。\n\n一方、\n\n🛒 ショッピング\n\n→ 商品・サービスを購入するための信用取引\n\n→ 貸金業法の総量規制とは別です。\n\nつまり、\n\nカードで現金を借りる → 総量規制○\nカードで商品を買う → 総量規制×\nと区別します。\n\n【銀行からの借入れは？】\n「先輩、ここ、かなり大事です。」\n\n👨「銀行のカードローンも借金だから1/3ですよね？」\n\n→ 貸金業法の総量規制の直接の対象ではありません。\n\nなぜなら、\n\n銀行は貸金業法上の貸金業者ではない\nからです。\n\n銀行は銀行法などに基づいて業務を行っています。\n\nしたがって、\n\n消費者金融\n→ 貸金業者\n→ 総量規制○\n\nクレジットカードのキャッシング\n→ 総量規制○\n\n銀行からの借入れ\n→ 貸金業法上の総量規制×\n\nという整理になります。\n\n「ただし、銀行なら無制限に貸してくれるという意味ではありませんよ。銀行側も審査や自主的な融資管理を行います。」\n\n【住宅ローンは？】\n「じゃあ先輩、年収600万円の人なら1/3で200万円。住宅ローン2,000万円は借りられない？」\n\n……それだと家を買うのが大変ですよね。\n\n住宅ローンなどは、総量規制の除外貸付けとして扱われるものがあります。\n\nつまり、\n\n年収1/3ルールに単純に入れない借入れもある\nんです。\n\n住宅ローンのほか、不動産購入のための一定の貸付けなど、法律上の除外・例外があります。\n\n【「除外」と「例外」の違い】\n「先輩、FPならここを一段深くいきましょう。」\n\n総量規制には、\n\n除外\n→ 総量規制の計算そのものから外す\n\n代表例として一定の住宅ローンなど。\n\n一方、\n\n例外\n→ 総量規制の対象となる貸付けではあるものの、一定の条件なら年収の1/3を超えて貸付けできる\n\nものがあります。\n\n代表的なのが、\n\n顧客に一方的に有利となる借換え\n\nなどです。\n\n「なので、何でもかんでも『1/3を超えたら絶対借りられない』ではありません。」\n\n【キャッシングとカードローンはどう違う？】\n「先輩、ここも混ざりやすいですね。」\n\nどちらも基本的には、\n\n現金を借りる\n\nという点では似ています。\n\nクレジットカードのキャッシング\n→ クレジットカードに付帯した借入機能\n\nカードローン\n→ 借入れを主目的とするローンサービス\n\nという違いがあります。\n\nそして消費者金融など貸金業者のカードローンなら、\n\n→ 総量規制の対象\n\n銀行カードローンなら、\n\n→ 貸金業法上の総量規制の直接対象外\n\nです。\n\n「『カードローンだから○』ではなく、誰から借りているかを見るんですよ。」\n\n【超重要な比較】\n取引\t総量規制\n消費者金融からの借入れ\t○\nクレジットカードのキャッシング\t○\nクレジットカードのショッピング\t×\n銀行カードローン\t×※\n一定の住宅ローン\t除外\n※銀行は貸金業法上の総量規制の直接対象ではありません。ただし銀行独自の審査等があります。\n\n【理解確認】\n「はい先輩、5問いきます。」\n\nQ1\nキャッシングとは？\n\n→ 現金を借りること\n\nQ2\n総量規制は原則、年収のいくら？\n\n→ 3分の1\n\nQ3\n年収600万円なら原則いくら？\n\n→ 200万円\n\nQ4\nクレジットカードのショッピングは総量規制の対象？\n\n→ 対象外\n\nQ5\n銀行カードローンは貸金業法上の総量規制の対象？\n\n→ 対象外\n\n【30秒復習】\n① キャッシング\n→ 現金を借りる\n\n② 総量規制\n→ 借りすぎ防止\n\n③ 上限の基本\n→ 年収の1/3\n\n④ 複数業者\n→ 対象借入れを合算\n\n⑤ カードショッピング\n→ 対象外\n\n⑥ 銀行\n→ 貸金業法上の総量規制の対象外\n\n【一文で覚える】\n総量規制＝「貸金業者からの借入残高を原則として年収の3分の1までとする、過度な借入れを防ぐための貸金業法上の規制」。\n\n「先輩、最後はこの図で固定しましょう。」\n\n💴現金を借りる\n↓\nキャッシング\n↓\n貸金業者からの対象借入れ\n↓\n\n原則 年収の1/3\nただし、\n\n銀行＝貸金業法の総量規制の直接対象外\n\n住宅ローンなど＝除外されるものがある\n\n「なので問題文を見たら、『いくら借りた？』より先に『誰から、何のために借りた？』を見る。これが総量規制を間違えないコツです。」\n\n"},{"n": 1, "title": "公的保険と私的保険", "raw": "はい。では、この順番を固定して**1項目ずつ**進めます。「次」と言われたら、次の項目へ進みます。\n\nまず第1項目、**「公的保険と私的保険」**からです。\n\n# 第2章 リスク管理①\n\n## 公的保険と私的保険\n\n### A【要点｜まず全体を掴みましょう】\n\n「先輩、最初から細かい保険商品を覚えようとしてませんよね？」\n\n「……だめですよ。まず保険の世界を大きく二つに分けます。」\n\n一言でいうと、\n\n**公的保険＝国などが運営する、社会全体で支えるための保険**  \n**私的保険＝民間の保険会社などが提供し、自分で必要に応じて備える保険**\n\nです。\n\n「もっと簡単にしますね。」\n\n**公的保険 → みんなで支える“土台”**  \n**私的保険 → 足りない部分を自分で補う“上乗せ”**\n\n「はい。まずこのイメージを持ってください。」\n\nたとえば病気になったとき、日本では公的医療保険がありますよね。\n\nでも、\n\n「入院中の収入減少まで全部補ってくれるの？」\n\n……全部とは限りません。\n\nそこで、民間の医療保険などを利用して不足部分に備えるわけです。\n\n「つまり先輩、基本的な考え方は――」\n\n**公的保険で基本部分を支え、必要なら私的保険で補う。**\n\nこれです。\n\n---\n\n### B【詳しい解説｜なぜ2種類あるの？】\n\n「じゃあ、少し掘りますよ。」\n\n先輩が病気になったとします。\n\n治療費が100万円かかるとして、それを全部自分で払わなければならなかったら？\n\n……\n\n「かなり困りますよね。」\n\nだから社会全体で、\n\n**病気・老齢・失業・介護・労働災害などの生活上のリスクをみんなで支えよう**\n\nという仕組みがあります。\n\nこれが**社会保険を中心とした公的保険**です。\n\n代表的には、\n\n**医療保険・介護保険・年金保険・雇用保険・労災保険**\n\nなどがあります。\n\n「ここで先輩、『じゃあ公的保険があるなら民間保険はいらないんじゃない？』って思いません？」\n\nはい。そこがリスク管理では大事なんです。\n\n公的保険ですべての損失を完全に補償してくれるわけではありません。\n\nそこで、\n\n公的保険でカバーされない部分\n↓\n自分にとって必要な保障を考える\n↓\n必要なら生命保険・医療保険・損害保険などに加入する\n\nという流れになります。\n\n「だから、いきなり民間保険を考えるんじゃないんです。」\n\n**まず公的保障を確認する。  \nそのうえで不足額を私的保険で補う。**\n\nこの順番です。\n\n---\n\n「では、違いも整理しておきましょう。」\n\n**公的保険**は、法律に基づいて国などが制度を整え、一定の要件に該当すれば原則として加入するものが中心です。\n\n一方の**私的保険**は、民間の保険会社などと契約して利用するものが中心です。\n\n「先輩、ここで“公的＝無料”と覚えたらダメですよ？」\n\n公的保険でも、原則として**保険料を負担します**。\n\n公的だから無料、ではありません。\n\n流れで覚えるなら、\n\n**生活上のリスクがある**\n↓\n**まず公的保険で社会全体として備える**\n↓\n**それだけでは不足する場合がある**\n↓\n**必要に応じて私的保険で補完する**\n\nです。\n\n「ほら。こうすると生命保険を勉強する理由までつながるでしょう？」\n\n---\n\n### C【イメージ理解｜一回、想像してみてください】\n\n「先輩、家を想像してください。」\n\n「え？ 保険の話なのに家？」\n\n「いいから聞いてください。」\n\n家にはまず**基礎**があります。\n\nこれが公的保険です。\n\nその上に、自分の生活に合わせて設備を追加します。\n\nこれが私的保険です。\n\nたとえば、\n\n「自分は入院したときの収入減少が心配だな」\n\nと思えば、そのリスクに対応した民間保険を検討する。\n\n逆に、\n\n「公的保障と貯蓄で十分対応できる」\n\nなら、必ずしも同じ保険を追加する必要はありません。\n\n「つまり先輩。」\n\n**公的保険という土台を知らないまま私的保険を考えると、必要保障額を正しく判断しにくいんです。**\n\nこれ、後で出てくる**「必要保障額」**にもつながりますからね。\n\n---\n\n### D【具体例｜実際の数字で見ましょう】\n\n「では簡単な数字で考えます。」\n\n仮に、あるリスクによって**300万円の経済的損失**が生じるとします。\n\nそのうち公的保障などによって200万円相当をカバーできると仮定します。\n\nすると残りは？\n\n……\n\n**100万円**ですね。\n\n300万円  \n− 200万円  \n＝ **100万円**\n\n「じゃあ300万円全部を民間保険で用意しなきゃいけませんか？」\n\n……そうとは限りません。\n\n不足する100万円について、\n\n**貯蓄で対応するのか**\nそれとも\n**私的保険で備えるのか**\n\nを考えればいいわけです。\n\nだから、\n\n**必要な保障**\n− **公的保障など**\n− **自分で準備できる資金**\n＝ **民間保険などで備える必要がある部分**\n\nという考え方になります。\n\n「はい。これがリスク管理の基本ですよ。」\n\n---\n\n## 【理解確認】\n\n「先輩、本当に分かりました？」\n\n「……そのまま次に行こうとしてません？」\n\n「3問だけです。」\n\n**Q1. 公的保険と私的保険の大きな違いは？**\n\n……\n\n公的保険は**社会全体で生活上のリスクに備える制度**、私的保険は**個人などが必要に応じて民間の保険などで備えるもの**です。\n\n**Q2. 民間保険を考える前に、なぜ公的保険を確認するの？**\n\n……\n\n「そうです。」\n\nすでに公的保険でカバーされる部分があるため、**本当に不足する保障を把握するため**ですね。\n\n**Q3. 基本的な順番は？**\n\n……\n\n**リスクを把握**\n↓\n**公的保障を確認**\n↓\n**不足部分を確認**\n↓\n**貯蓄や私的保険で補う**\n\n「あ、そこです。この順番を覚えてください。」\n\n---\n\n## 【30秒復習】\n\n「はい、あと30秒です。そんな顔しないでください。」\n\n① **何の話？**  \n→ 公的保険と私的保険の違い\n\n② **公的保険は？**  \n→ 社会全体で生活上のリスクに備える土台\n\n③ **私的保険は？**  \n→ 必要に応じて自分で不足部分に備えるもの\n\n④ **どういう流れ？**  \n→ 公的保障を確認 → 不足額を把握 → 私的保険などで補完\n\n⑤ **イメージは？**  \n→ 公的保険＝家の基礎、私的保険＝必要に応じた上乗せ\n\n⑥ **間違えやすいところは？**  \n→ **公的保険＝無料ではない。**\n\n---\n\n## 【一文で覚える】\n\n**「公的保険を土台として、不足する保障を私的保険で補う。」**\n\n「はい。これで十分です。」\n\n「これから生命保険や損害保険を大量にやりますけど、全部この考え方の上に乗っています。」\n\n「……なので先輩、ここを飛ばして商品名だけ暗記するのは禁止ですからね？」\n\n次は **②「大数の法則」** です。\n\n---", "chapter": 2}, {"n": 2, "title": "大数の法則", "raw": "# 第2章 リスク管理②\n\n## 大数の法則\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**大数の法則**です。」\n\n「名前だけ見ると数学っぽくて嫌になってません？」\n\n「……まだ逃げないでください。保険ではかなり単純です。」\n\n一言でいうと、\n\n**少ない人数では偶然に左右されるけれど、大人数を集めると事故などが起こる割合が一定の確率に近づいていく。**\n\nこれが大数の法則です。\n\nもっと簡単にすると――\n\n**1人がどうなるかは分からない。でも1万人集めれば、全体で何人くらいに事故が起こるかは予測しやすくなる。**\n\n「はい。ここが核心です。」\n\n保険会社はこの性質を利用して、\n\n**事故や死亡などがどれくらい発生するかを統計的に見積もり、保険料を計算する**\n\nわけです。\n\n---\n\n### 【重要ポイント】\n\n「まず一つ目。」\n\n**個人については予測しにくい。**\n\n先輩が来年病気になるかどうか。\n\n「私に分かると思います？」\n\n……分かりませんよね。\n\n保険会社だって、特定の一人について完全に予測することはできません。\n\n「でも二つ目。」\n\n**人数が多くなると、集団全体では発生率が安定しやすくなります。**\n\nたとえば、\n\n100万人のうち、ある事故が毎年おおむね一定の割合で起きている。\n\nこうした大量のデータがあれば、\n\n「来年も全体としてはこのくらいだろう」\n\nと予測しやすくなります。\n\nそして三つ目。\n\n**この予測可能性が、保険制度を成り立たせる重要な基礎になります。**\n\n「つまり先輩、保険会社は未来を当てているわけじゃありません。」\n\n**大量のデータを使って、集団としての発生率を予測している。**\n\nここを間違えないでください。\n\n---\n\n## B【詳しい解説｜なぜ人数が増えると予測しやすいの？】\n\n「では、ここからが『なぜ？』です。」\n\nコインを1回投げるとします。\n\n表が出る確率は理論上50％ですよね。\n\nでは1回投げて、\n\n**表**\n\nが出ました。\n\n実際の結果は、\n\n表100％  \n裏0％\n\nです。\n\n「え？ 50％じゃないじゃん、ってなりますよね。」\n\nそうなんです。\n\n**試行回数が少ないと、偶然によるブレが大きい**んです。\n\nでは、何千回、何万回と投げたら？\n\n……\n\n「そうです。」\n\n表と裏の割合は、だんだん理論上の確率である50％付近に安定しやすくなります。\n\nこれと似た考え方を保険に持ってきます。\n\n---\n\n「先輩1人だけを見ます。」\n\n来年、事故に遭うか？\n\n**遭う／遭わない**\n\nどちらになるかは予測が難しいですよね。\n\nでは、同じような条件の人を**100万人**集めたら？\n\n過去の統計などから、\n\n「この集団なら、おおむねこれくらい事故が発生する」\n\nと予測しやすくなります。\n\nつまり、\n\n**対象が少ない**\n↓\n偶然によるブレが大きい\n↓\n予測しにくい\n\nところから、\n\n**対象を大量に集める**\n↓\n個々の偶然によるブレが相対的に小さくなる\n↓\n発生率が安定してくる\n↓\n集団全体の事故などを予測しやすくなる\n↓\n**保険料や保険金支払いの見積もりがしやすくなる**\n\nという流れです。\n\n「ほら。こうして見ると、大数の法則が保険と関係する理由が見えてきましたよね。」\n\n---\n\n### 「でも、大人数なら絶対に予測どおりになるの？」\n\n「先輩、今ちょっと危ないこと考えませんでした？」\n\n**『じゃあ100万人集めれば、事故件数をピッタリ当てられるんだ』**\n\n……違います。\n\n大数の法則は、\n\n**必ず予測値と完全一致する**\n\nという意味ではありません。\n\n人数や試行回数が増えるほど、**実際の割合が理論上・統計上の確率に近づきやすくなる**という考え方です。\n\n「“絶対に当たる”じゃなくて、“割合が安定して予測しやすくなる”。」\n\nここ、大事ですよ。\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「では先輩、文化祭でくじ引き屋さんをやることにしましょう。」\n\n当たりが10％入ったくじを作ります。\n\n最初のお客さんが1人来ました。\n\n引いたら……\n\n**当たり。**\n\n「さて先輩。」\n\nこの時点では、\n\n1人中1人当たりなので、\n\n**当選率100％**\n\nですよね。\n\n「10％のはずなのに100％じゃん、って？」\n\n「もう……1人しか引いてないでしょう。」\n\n次に10人。\n\nさらに100人。\n\n1,000人。\n\n10,000人。\n\nと引く人が増えていけば、全体の当選割合は**設定された10％付近に安定しやすくなります。**\n\n「これを保険に置き換えてください。」\n\n1人を見る  \n→ 病気になるか分からない。\n\n10人を見る  \n→ まだブレやすい。\n\n100万人を見る  \n→ 統計的な発生率がかなり見えやすくなる。\n\nだから保険会社は、たくさんの契約者を集めてリスクを扱うわけです。\n\n**くじを大量に引くほど割合が安定する**\n\nのと、\n\n**多くの人を対象にするほど事故などの発生率を予測しやすくなる**\n\nのが同じイメージです。\n\n---\n\n# D【具体例｜実際の数字で見ましょう】\n\n「数字でやりましょう。」\n\n仮に、ある条件の人について、統計上、\n\n**1年間に死亡する割合が0.1％**\n\nだったとします。\n\n「先輩、100人だったら何人です？」\n\n100 × 0.1％  \n＝ **0.1人**\n\n……0.1人なんて実際には存在しませんよね。\n\n実際には、\n\n0人だったり、  \n1人だったり、  \n場合によってはもっと多かったり。\n\n小さな集団ではブレが目立ちます。\n\nでは、\n\n**100万人**\n\nなら？\n\n1,000,000 × 0.1％  \n＝ **1,000人**\n\nです。\n\nもちろん実際に必ず1,000人になるわけではありません。\n\nただ、大きな集団を扱うことで、**集団全体としてどれくらい保険事故が発生するかを統計的に見積もりやすくなります。**\n\nすると保険会社は、\n\n「これくらいの保険金支払いが発生しそうだ」\n\n↓\n\n「それなら全体でこれくらいの保険料が必要だ」\n\nと考えられます。\n\n「はい。ここで保険料につながりました。」\n\n---\n\n# 【理解確認】\n\n「では先輩、本当に分かりました？」\n\n「大数の法則＝人数が多い、だけで終わらせたらダメですよ。」\n\n### Q1\n\n**大数の法則とは、一言でいうと？**\n\n……\n\n「はい。」\n\n**試行回数や対象人数が増えるほど、実際の発生割合が理論上・統計上の確率に近づきやすくなること。**\n\n---\n\n### Q2\n\n**なぜ大数の法則が保険に必要なの？**\n\n……\n\nそうです。\n\n**多数の契約者を集めることで、事故や死亡などの発生率を予測しやすくなり、保険料などを計算する基礎になるから。**\n\n---\n\n### Q3\n\n**1人の死亡を予測できるようになる法則？**\n\n……\n\n「違います。そこ、引っかからないでください。」\n\n**個人の未来を当てる法則ではありません。**\n\n**大きな集団全体の発生割合を安定して捉えやすくする考え方**です。\n\n---\n\n# 【30秒復習】\n\n「はい、あと30秒ですよ。」\n\n① **何の話？**  \n→ 大数の法則\n\n② **一番重要なのは？**  \n→ 人数・試行回数が増えるほど発生割合が安定する\n\n③ **なぜ？**  \n→ 偶然によるブレの影響が相対的に小さくなるから\n\n④ **保険との関係は？**  \n→ 事故・死亡などの発生率を予測しやすくする\n\n⑤ **イメージは？**  \n→ くじを大量に引くと当選割合が設定確率に近づく\n\n⑥ **間違えやすいところは？**  \n→ **個人の事故や死亡を予言できるわけではない**\n\n# 【一文で覚える】\n\n**「一人の未来は読めなくても、大勢集めれば全体の発生割合は予測しやすくなる。」**\n\n「はい。これです。」\n\n「大数の法則って名前は難しそうですけど、結局は**『少ないとブレる、大勢なら割合が安定する』**なんですよ。」\n\n「これが保険会社がリスクを扱える土台の一つです。」\n\n次は **③「収支相等の原則」** です。\n\n---", "chapter": 2}, {"n": 3, "title": "収支相等の原則", "raw": "# 第2章 リスク管理③\n\n## 収支相等の原則\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今度は**収支相等の原則**です。」\n\n「漢字が6文字並んだだけで難しそうに見えますけど……ちゃんと分解すれば簡単です。」\n\n**収支**＝入ってくるお金と出ていくお金  \n**相等**＝つり合う\n\nです。\n\nなので、一言でいうと――\n\n> **保険会社が受け取る保険料の総額と、支払う保険金などの総額が全体としてつり合うようにする考え方**\n\nです。\n\n「もっと雑に言えば？」\n\n**みんなから集めるお金と、みんなに払うお金をつり合わせる。**\n\n「はい。まずこれで大丈夫です。」\n\nそして先ほどやった**大数の法則**とつながっています。\n\n**大数の法則**\n→ 大勢集めれば事故などの発生率を予測しやすい\n\n**収支相等の原則**\n→ その予測をもとに、必要な保険料を考える\n\n「ほら。前の単語と別々じゃないんですよ。」\n\n---\n\n## 【重要ポイント】\n\n「三つだけ押さえます。」\n\n一つ目。\n\n**保険は大勢の契約者から保険料を集めます。**\n\n二つ目。\n\nそこから、保険事故が発生した人に**保険金・給付金などを支払います。**\n\nそして三つ目。\n\n保険制度を維持するには、**集める保険料と支払う保険金などが全体として対応するように保険料を設定する必要があります。**\n\n「じゃあ先輩、この文章の一番大事なところは？」\n\n……\n\nそうです。\n\n**収入と支出のバランスを取ること。**\n\nこれが収支相等の原則です。\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n「では、『なぜそんな原則が必要なの？』を考えますよ。」\n\n保険会社が100人から、\n\n**1人1万円**\n\nの保険料を集めたとします。\n\n全部でいくらです？\n\n……\n\n「100万円ですね。」\n\nところが保険会社が支払わなければならない保険金が、\n\n**毎年1,000万円**\n\nだったら？\n\n「どうなります？」\n\n……\n\nはい。\n\n**保険制度を維持できません。**\n\n逆に必要以上に保険料を集めるような設計でも、適正な保険制度とは言いにくいですよね。\n\nだから、\n\n**将来どれくらい保険金等を支払うことになるのかを予測する**\n↓\n**それに対応する保険料を設定する**\n↓\n**保険料収入と保険金等の支出が全体としてつり合うようにする**\n\nという考え方が必要になります。\n\nこれが**収支相等の原則**です。\n\n---\n\n### 大数の法則との関係\n\n「ここ、先輩にはセットで覚えてほしいです。」\n\nさっきの大数の法則では、\n\n**大勢集める**\n↓\n**事故などの発生率が安定する**\n↓\n**全体で何件くらい事故が起きるか予測しやすくなる**\n\nでした。\n\nでは、その予測ができると？\n\n……\n\n「そう。必要なお金も計算しやすくなります。」\n\nたとえば、\n\n1万人のうち100人くらいに事故が起こりそう。\n\n1人につき100万円払う。\n\nなら、\n\n100人 × 100万円  \n＝ **1億円**\n\nくらいの保険金支払いが想定されます。\n\n「だったら、その支払いに対応できるように保険料を集めないといけませんよね。」\n\nつまり、\n\n**大数の法則**\n↓\n事故発生率を予測\n↓\n必要な保険金総額を予測\n↓\nそれに対応する保険料を集める\n↓\n**収支相等の原則**\n\nというつながりです。\n\n「はい。ここまでつながれば、ただの用語暗記じゃなくなります。」\n\n---\n\n### 「保険料＝保険金だけなの？」\n\n「あ、先輩。たぶん今ちょっと気になりましたよね。」\n\n**『保険会社には人件費とか事務費もあるでしょう？』**\n\nそうです。\n\n実際の保険料には、保険金などの支払いに充てる部分だけでなく、**保険会社が事業を運営するための費用なども考慮されます。**\n\nこのあと出てくる、\n\n**純保険料**\nと\n**付加保険料**\n\nにつながります。\n\n「なので今は、収支相等の原則についてはまず、**保険制度全体で収入と支出をつり合わせる考え方**と押さえてください。」\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、10人で旅行するとします。」\n\n旅行中に何かあったときのために、みんなでお金を出して**共通のお財布**を作ることにしました。\n\n予想される出費が全部で、\n\n**10万円**\n\nだったとします。\n\n「じゃあ、10人で合計1万円しか集めなかったら？」\n\n……\n\n「足りませんよね。」\n\n逆に、\n\n10万円必要なのに100万円集める必要があるのか？\n\nという話にもなります。\n\nだから、\n\n**必要になるお金を予測する**\n↓\n**それに対応するお金をみんなから集める**\n\nという設計にします。\n\n「これが保険でも基本的には同じなんです。」\n\nたくさんの契約者から保険料を集め、\n\n事故・死亡・病気などが発生した人に保険金や給付金を支払う。\n\nその**全体の収支がつり合うようにする。**\n\n「はい。難しい漢字を外すと、ただの“みんなのお財布の収支管理”でしょう？」\n\n---\n\n# D【具体例｜実際の数字で見ましょう】\n\n「では、FP試験でもイメージしやすいように単純化しますよ。」\n\n1,000人が加入している保険があるとします。\n\n過去の統計などから、\n\n**1年間に10人が保険事故に遭う**\n\nと予測できたとしましょう。\n\nそして1人に、\n\n**100万円**\n\n支払います。\n\nでは、年間の保険金はいくら必要でしょう？\n\n……\n\n10人 × 100万円  \n＝ **1,000万円**\n\nですね。\n\nでは、この1,000万円を1,000人で負担すると単純化すると？\n\n1,000万円 ÷ 1,000人  \n＝ **1万円**\n\n「つまり、1人1万円ずつ集めれば――」\n\n1万円 × 1,000人  \n＝ **1,000万円**\n\nになります。\n\n### 入ってくるお金\n\n保険料総額  \n＝ **1,000万円**\n\n### 出ていくお金\n\n保険金総額  \n＝ **1,000万円**\n\n**収入 ≒ 支出**\n\n「はい。これが収支相等の原則のイメージです。」\n\nもちろん実際の保険料計算はこんなに単純ではありません。\n\nでも概念を覚えるなら、\n\n**必要な支払額を予測して、それに対応する保険料を集める**\n\nで大丈夫です。\n\n---\n\n# 【理解確認】\n\n「では先輩。」\n\n「“収入と支出が同じ”だけ暗記して次へ行こうとしてません？」\n\n「3問です。」\n\n### Q1\n\n**収支相等の原則とは？**\n\n……\n\n「はい。」\n\n**保険料として集めるお金と、保険金などとして支払うお金が、全体としてつり合うようにする考え方です。**\n\n### Q2\n\n**大数の法則とどうつながる？**\n\n……\n\n「あ、そこです。」\n\n**大数の法則で事故などの発生率を予測しやすくする**\n↓\n**将来必要な保険金等を見積もる**\n↓\n**それに対応した保険料を設定する**\n\nという関係です。\n\n### Q3\n\n**なぜ収支をつり合わせる必要がある？**\n\n……\n\n**支払う保険金等に対して保険料収入が不足すれば、保険制度を安定して維持できないから。**\n\n「はい。それが言えれば十分です。」\n\n---\n\n# 【30秒復習】\n\n「あと30秒ですよ。ここ、大数の法則とセットで取ります。」\n\n① **何の話？**  \n→ 収支相等の原則\n\n② **一番重要なのは？**  \n→ 保険制度全体の収入と支出をつり合わせる\n\n③ **収入は？**  \n→ 契約者から集める保険料\n\n④ **支出は？**  \n→ 保険金・給付金など\n\n⑤ **大数の法則との関係は？**  \n→ 発生率を予測し、必要な保険料を考えられる\n\n⑥ **イメージは？**  \n→ みんなで作った共通のお財布\n\n# 【一文で覚える】\n\n> **「大数の法則で必要額を予測し、みんなから集める保険料と支払う保険金などをつり合わせるのが収支相等の原則。」**\n\n「はい。これなら前の単語まで一緒に復習できます。」\n\n**大数の法則＝どれくらい起こるか予測する。**  \n**収支相等の原則＝それをもとに収入と支出を合わせる。**\n\n「この2つ、バラバラに覚えないでくださいね。」\n\n次は **④「クーリングオフ」** です。\n\n---", "chapter": 2}, {"n": 4, "title": "クーリングオフ", "raw": "# 第2章 リスク管理④\n\n## クーリングオフ\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**クーリングオフ**です。」\n\n「これは聞いたことありますよね。でも保険のクーリングオフは、**期間と例外**まで押さえないと試験では危ないです。」\n\n一言でいうと――\n\n> **保険を申し込んだ後でも、一定期間内なら申込みの撤回・契約の解除ができる制度**\n\nです。\n\n「要するに？」\n\n**『契約したけど、やっぱりやめます』が一定期間なら認められる仕組み**です。\n\n生命保険などでは原則として、\n\n**「クーリングオフについて記載した書面等を受け取った日」と「申込日」の遅い方から、その日を含めて8日以内**\n\nに撤回・解除の意思を伝えます。\n\n「先輩、ここ。“申込日から8日”だけで覚えないでくださいね。後で引っかかりますから。」\n\n---\n\n# B【詳しい解説｜なぜこんな制度があるの？】\n\n「じゃあ、そもそもなぜ必要なのか考えましょう。」\n\n保険って、コンビニでお菓子を買うのとは違いますよね。\n\n保障内容、保険期間、保険料、特約……。\n\n「その場で全部理解して即決できます？」\n\n……\n\n「難しいですよね。」\n\n契約した後になって、\n\n「思っていた保障内容と違った」\n\n「家に帰って考えたら必要なかった」\n\nとなる可能性があります。\n\nそこで一定期間、\n\n**冷静に考え直す時間**\n\nを与える。\n\nだから、\n\n**cooling off＝頭を冷やす**\n\nというイメージなんです。\n\n契約・申込み\n↓\n冷静になって考える\n↓\n「やっぱりやめたい」\n↓\n一定の条件を満たせば\n↓\n**申込みの撤回・契約の解除**\n\n「はい。ここまでは難しくないですね。」\n\n---\n\n## じゃあ「8日」はどこから数える？\n\n「ここから試験っぽくなりますよ。」\n\nたとえば、\n\n**10月1日：保険を申し込んだ**\n\nでも、クーリングオフについて記載した書面等を受け取ったのが、\n\n**10月3日**\n\nだったとします。\n\n「先輩、どっちから数えると思います？」\n\n……\n\n申込日の10月1日？\n\n「惜しいです。」\n\n基本は、\n\n**申込日**\nと\n**クーリングオフについて記載した書面等を受け取った日**\n\nを比べて、\n\n### 遅い方\n\nから数えます。\n\n今回は、\n\n10月1日 → 申込み  \n10月3日 → 書面等を受領\n\nなので、\n\n**10月3日が基準**\n\nです。\n\nしかも、\n\n**その日を含めて8日以内**\n\nです。\n\n「“翌日から8日”じゃないですよ。ここも注意してください。」\n\n---\n\n## 「じゃあ、どんな保険でもクーリングオフできる？」\n\n「……先輩、今そう思いましたね？」\n\n「できません。」\n\nクーリングオフには**適用されないケース**があります。\n\nFPで代表例として押さえておきたいのは、たとえば、\n\n**保険期間が1年以下の契約**\n\nなどです。\n\nまた、契約の状況や申込方法などによってクーリングオフの対象外となる場合があります。\n\n「だから試験では、」\n\n**保険契約＝絶対に8日間クーリングオフできる**\n\nとは覚えないでください。\n\n正しくは、\n\n**原則として一定期間内なら可能。ただし例外がある。**\n\nです。\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、スマホを買いに行ったとしましょう。」\n\n店員さんから、\n\n「こちらもおすすめです」\n\n「これも付けると安心ですよ」\n\nと説明されて、\n\n「じゃあ、それで……」\n\nと契約した。\n\n家に帰ります。\n\n夜、お風呂に入りながら考えます。\n\n「……あれ？」\n\n「これ、本当に必要だった？」\n\n「先輩、ありますよね。勢いで決めて、後から冷静になるやつ。」\n\n翌朝、契約内容をもう一度確認する。\n\n「やっぱり考え直したい。」\n\nこういう**冷静に再検討するための期間**をイメージしてください。\n\n保険も長期間にわたって保険料を支払うことがあります。\n\nだから一定の条件のもとで、\n\n**「一度申し込んだけど、もう一度考え直します」**\n\nという機会が用意されているわけです。\n\n「これなら“クーリング”という名前も覚えやすいでしょう？」\n\n---\n\n# D【具体例｜日付で確認しましょう】\n\n「先輩、今回は金額より日付です。」\n\n### ケース①\n\n申込日：**6月1日**\n\nクーリングオフについて記載した書面等の受領日：**6月1日**\n\nこの場合、基準日は？\n\n……\n\n「はい、6月1日。」\n\nその日を含めて8日間なので、\n\n**6月1日〜6月8日**\n\nというイメージです。\n\n---\n\n### ケース②\n\n申込日：**6月1日**\n\n書面等の受領日：**6月3日**\n\n「今度は？」\n\n……\n\n**遅い方の6月3日**ですね。\n\nそこから、その日を含めて8日間。\n\n6月3日を1日目として数えるので、\n\n**6月10日まで**\n\nということになります。\n\n「ここ、試験で日付をずらされても慌てないでください。」\n\n見るのは、\n\n**①申込日**\nと\n**②書面等を受け取った日**\n\nそして、\n\n**遅い方**\n\nです。\n\n---\n\n# 【理解確認】\n\n「はい、確認しますよ。」\n\n「クーリングオフは知ってるから大丈夫、って顔してますけど……こういう知ってる単語のほうが細かいところで落とすんです。」\n\n### Q1\n\nクーリングオフとは？\n\n……\n\n**一定期間内であれば、保険契約の申込みの撤回や契約の解除ができる制度。**\n\n「はい。」\n\n---\n\n### Q2\n\n原則として何日以内？\n\n……\n\n**8日以内。**\n\n「そうです。ただし、“何を基準に8日？”まで言えたら完璧です。」\n\n---\n\n### Q3\n\n申込日が4月1日、クーリングオフに関する書面等を受け取った日が4月3日。\n\nどちらを基準にする？\n\n……\n\n**4月3日。**\n\n「はい。それです。」\n\n**遅い方から、その日を含めて8日以内**ですね。\n\n---\n\n# 【30秒復習】\n\n「はい、あと30秒。」\n\n① **何の話？**  \n→ クーリングオフ\n\n② **何ができる？**  \n→ 申込みの撤回・契約の解除\n\n③ **原則何日？**  \n→ 8日以内\n\n④ **いつから？**  \n→ 申込日と書面等の受領日の**遅い方**\n\n⑤ **数え方は？**  \n→ その日を含める\n\n⑥ **注意点は？**  \n→ すべての保険契約が対象になるわけではなく、例外がある\n\n# 【一文で覚える】\n\n> **「保険のクーリングオフは、申込日と所定の書面等を受け取った日の遅い方から、その日を含めて原則8日以内。」**\n\n「先輩、ここは**『遅い方・8日・その日を含む』**の3点セットで覚えてください。」\n\n「“8日”だけ覚えて満足したらダメですよ？」\n\n次は **⑤「保険契約者保護機構」** です。\n\n---", "chapter": 2}, {"n": 5, "title": "保険契約者保護機構", "raw": "# 第2章 リスク管理⑤\n\n## 保険契約者保護機構\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**保険契約者保護機構**です。」\n\n「名前が長いですけど、やっていることはかなり分かりやすいですよ。」\n\n一言でいうと――\n\n> **保険会社が破綻したときに、保険契約者を保護するための仕組み**\n\nです。\n\n「もっと簡単に？」\n\n**保険会社が倒れても、契約者がいきなり全部の保障を失わないようにするセーフティネット**\n\nですね。\n\n日本では大きく、\n\n**生命保険契約者保護機構**  \n**損害保険契約者保護機構**\n\nがあります。\n\n「生命保険と損害保険で分かれている。まずここを押さえましょう。」\n\nそして重要なのが、\n\n**破綻しても契約内容が100％そのまま保証されるとは限らない**\n\nという点です。\n\n「先輩、“保護機構がある＝全額安心”じゃありませんからね。」\n\n---\n\n# B【詳しい解説｜なぜ必要なの？】\n\n「では考えてみましょう。」\n\n先輩が30歳で終身保険に加入したとします。\n\nその後、何十年も保険料を払ってきました。\n\nところが途中で、\n\n**保険会社が経営破綻。**\n\n「え？ じゃあ今まで払った保険料は？ 保障は？」\n\nってなりますよね。\n\n保険は長期間にわたる契約も多いため、保険会社が破綻すると契約者への影響が非常に大きくなります。\n\nそこで、\n\n保険会社が破綻\n↓\nそのままだと契約者が大きな損失を受ける\n↓\n保護機構が資金援助などを行う\n↓\n契約の継続などを支援する\n↓\n**契約者を一定範囲で保護する**\n\nという仕組みが設けられています。\n\n---\n\n## 生命保険の場合\n\n「ここ、FPで数字が出やすいところです。」\n\n生命保険会社が破綻した場合、原則として、\n\n> **破綻時点の責任準備金等の90％まで**\n\nが補償対象となります。\n\n「先輩、ちょっと待ってください。」\n\n**死亡保険金の90％**\n\nと覚えないでください。\n\nここ、かなり重要です。\n\n### × 死亡保険金の90％を保証\n\nではなく、\n\n### ○ 責任準備金等の90％までを補償\n\nです。\n\n「責任準備金って何？ってなりますよね。」\n\nものすごく簡単に言えば、\n\n**保険会社が将来の保険金などの支払いに備えて積み立てているお金**\n\nです。\n\n「今はこれくらいの理解で大丈夫です。」\n\n---\n\n## じゃあ保険金も90％になるの？\n\n「先輩、たぶん今そう思いましたよね。」\n\n**『責任準備金が90％なら、死亡保険金も必ず90％？』**\n\n違います。\n\n破綻後に契約条件が変更されることがあり、予定利率などが引き下げられる可能性もあります。\n\nそのため、実際の保険金額などがどの程度変わるかは契約によって異なります。\n\n特に予定利率が高い契約では影響が大きくなることがあります。\n\n「なので試験では、まず」\n\n**生命保険 → 責任準備金等の90％まで**\n\nと押さえましょう。\n\n---\n\n## 損害保険は？\n\n「ここは生命保険と同じ数字で覚えたら危ないです。」\n\n損害保険では、**保険の種類によって補償割合が異なります。**\n\nたとえば自賠責保険や地震保険など、制度上重要な保険については**100％補償されるものがあります**。\n\n一方で、火災保険や自動車保険などは、破綻後の一定期間とそれ以降で取扱いが異なる場合があります。\n\n「ですから、」\n\n**生命保険＝原則、責任準備金等の90％まで**\n\n**損害保険＝保険種類によって補償内容が異なる**\n\nと分けてください。\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、銀行の預金保険制度を思い浮かべると少し近いです。」\n\n銀行が破綻したら、\n\n「預けていたお金、全部なくなるの？」\n\nって心配になりますよね。\n\nそこで預金者を一定範囲で守る仕組みがあります。\n\n保険も同じように、\n\n**保険会社が破綻したら契約者はどうなるの？**\n\nという問題があります。\n\nそこで後ろに、\n\n🛡️ **保険契約者保護機構**\n\nが控えている。\n\n保険会社\n↓\n💥 経営破綻\n↓\n「契約者をそのまま放置したら大変です」\n↓\n🛡️ 保護機構が支援\n↓\n契約者を一定範囲で保護\n\n「こういうイメージです。」\n\nただし――\n\n「先輩、盾があるから無傷、ではありませんよ。」\n\n**守ってはくれるけれど、契約条件などが完全に元のままとは限らない。**\n\nここまでセットです。\n\n---\n\n# D【具体例｜数字で見ましょう】\n\n「では生命保険で、かなり単純化した例です。」\n\nある保険会社が破綻しました。\n\nある契約について、破綻時点の責任準備金等が仮に、\n\n**1,000万円**\n\nだったとします。\n\n補償対象が原則90％だとすると、\n\n1,000万円 × 90％  \n＝ **900万円**\n\n「なのでイメージとしては、900万円までが補償対象ですね。」\n\nでも――\n\n「ここで先輩。」\n\n**『じゃあ死亡保険金1,000万円が900万円になるんだ』**\n\nと考えないでください。\n\n今計算したのは、\n\n**責任準備金等に対する補償**\n\nです。\n\n死亡保険金そのものを単純に90％にする計算ではありません。\n\n「この違い、試験で狙われたらちゃんと止まってくださいね。」\n\n---\n\n# 【理解確認】\n\n「はい、3問いきます。」\n\n### Q1\n\n保険契約者保護機構は何のための仕組み？\n\n……\n\n**保険会社が破綻した場合に、保険契約者を一定範囲で保護するため。**\n\n「はい、それで大丈夫です。」\n\n### Q2\n\n生命保険会社が破綻した場合、原則として何の90％まで？\n\n……\n\n「ここですよ。」\n\n**責任準備金等の90％まで。**\n\n「死亡保険金の90％、ではありません。」\n\n### Q3\n\n生命保険も損害保険も全部一律90％？\n\n……\n\n「違います。」\n\n**損害保険は保険種類などによって補償割合が異なります。**\n\n自賠責保険・地震保険など、100％補償されるものもあります。\n\n「はい。生命と損害をごちゃ混ぜにしなければ大丈夫です。」\n\n---\n\n# 【30秒復習】\n\n「はい、あと30秒です。」\n\n① **何の話？**  \n→ 保険契約者保護機構\n\n② **何のため？**  \n→ 保険会社破綻時の契約者保護\n\n③ **種類は？**  \n→ 生命保険契約者保護機構・損害保険契約者保護機構\n\n④ **生命保険は？**  \n→ 原則、**責任準備金等の90％まで**\n\n⑤ **損害保険は？**  \n→ 保険種類などによって補償割合が異なる\n\n⑥ **最大の引っかけは？**  \n→ **「死亡保険金の90％」ではない**\n\n# 【一文で覚える】\n\n> **「保険会社が破綻したとき契約者を守るのが保険契約者保護機構。生命保険は原則、責任準備金等の90％まで。」**\n\n「はい。今回は特に**『何の90％なのか』**を残してください。」\n\n「“90％だったな”だけだと、先輩、試験問題にきれいに引っかかりますから。」\n\n次は **⑥「少額短期保険」** です。\n\n---", "chapter": 2}, {"n": 6, "title": "少額短期保険", "raw": "# 第2章 リスク管理⑥\n\n## 少額短期保険\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**少額短期保険**です。」\n\n「名前に答えがかなり書いてありますよ。」\n\n**少額**＝保険金額が小さい  \n**短期**＝保険期間が短い\n\nつまり一言でいうと――\n\n> **保険金額が少額で、保険期間も短い保険だけを扱う仕組み**\n\nです。\n\nこれを扱う事業者を**少額短期保険業者**といいます。\n\n「ミニ保険って呼ばれることもありますね。」\n\nたとえば、\n\n**ペット保険・家財保険・葬儀費用保険**\n\nなどで少額短期保険の商品があります。\n\n「ただし先輩、普通の生命保険会社・損害保険会社とまったく同じだと思わないでください。」\n\nここが今回の重要ポイントです。\n\n---\n\n## 【重要ポイント】\n\nまず大きく3つです。\n\n**① 保険金額に上限がある**\n\n好きなだけ大きな保障を設定できるわけではありません。\n\n**② 保険期間が短い**\n\n原則として、\n\n* **生命保険・傷害疾病保険 → 1年以内**\n* **損害保険 → 2年以内**\n\nです。\n\n「ここ、1年と2年を逆にしないでくださいね。」\n\nそして③。\n\n**少額短期保険業者は、保険契約者保護機構の対象外です。**\n\n「はい。前回の内容がもう出てきました。」\n\n---\n\n# B【詳しい解説｜普通の保険会社と何が違うの？】\n\n「先輩、まずこう考えてください。」\n\n普通の保険会社は、長期間の生命保険や大きな保障の商品など、幅広い保険を扱います。\n\n一方で、\n\n「もっと小規模で、特定のリスクだけを対象にした保険を提供したい」\n\nという事業があります。\n\nそこで一定の制限を設けたうえで認められているのが**少額短期保険業**です。\n\nつまり、\n\n**扱える保障を少額にする**\n↓\n**契約期間も短くする**\n↓\n**限定された範囲で保険事業を行う**\n\nというイメージです。\n\n---\n\n## 「少額って具体的にいくら？」\n\n「はい、ここ気になりますよね。」\n\n保険区分ごとに上限があります。\n\nFP学習では代表的なものとして、\n\n**死亡保険 → 300万円以下**\n\nを覚えておくといいです。\n\nほかにも、医療保険や損害保険などについてそれぞれ上限が定められています。\n\nさらに、原則として**1人の被保険者について引き受けられる保険金額の合計にも上限**があります。\n\n「なので、“少額”は単なる商品名じゃなくて、本当に法令上の上限があるんです。」\n\n---\n\n## 「短期」は？\n\nここは覚えやすいです。\n\n### 生命保険・傷害疾病保険\n\n**1年以内**\n\n### 損害保険\n\n**2年以内**\n\n「なぜ損害保険だけ2年？って思いますよね。」\n\nそこを理屈で無理に覚えるより、試験対策としては、\n\n> **生・傷病＝1、損＝2**\n\nと一度固定してしまったほうがいいです。\n\n---\n\n## 保険契約者保護機構との関係\n\n「では先輩。前回やった問題です。」\n\n保険会社が破綻したときに契約者を一定範囲で保護する仕組みは？\n\n……\n\n「そうです。」\n\n**保険契約者保護機構。**\n\nでは少額短期保険業者が破綻した場合も、この仕組みで保護される？\n\n……\n\n**されません。**\n\n少額短期保険業者は、\n\n> **保険契約者保護機構の対象外**\n\nです。\n\n「ここ、かなりセットで覚えやすいですよ。」\n\n普通の保険会社と比べて規模・商品範囲が限定された仕組みですが、その代わり、\n\n**『保護機構があるから破綻しても同じように保護される』とは考えられない**\n\nわけです。\n\n---\n\n## 「じゃあ、無規制なの？」\n\n「先輩、そこまで飛ばないでください。」\n\n対象外だからといって、好き勝手に営業できるわけではありません。\n\n少額短期保険業を行うには、一定の要件を満たして**登録**を受ける必要があります。\n\n「ここも比較問題で狙いやすいです。」\n\n一般の保険会社は**免許制**。\n\n少額短期保険業者は**登録制**。\n\n### 保険会社\n\n→ 免許\n\n### 少額短期保険業者\n\n→ 登録\n\n「はい。ここまで一緒に覚えてしまいましょう。」\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、普通のレストランと小さな専門店を想像してください。」\n\n大きなレストランは、\n\n肉料理  \n魚料理  \nパスタ  \nデザート……\n\n幅広い料理を提供しています。\n\n一方で、小さな専門店は、\n\n**『うちはサンドイッチだけです』**\n\nみたいに扱う範囲を絞っています。\n\n少額短期保険も似ています。\n\n「巨大な保障を何十年も提供します」\n\nではなく、\n\n**『保障はこの範囲まで。期間も短期間ですよ』**\n\nと限定して商品を提供する。\n\nだから、\n\n🧰 **小さなリスクにピンポイントで備える保険**\n\nというイメージを持ってください。\n\n「ただし、小さいから普通の保険会社と同じ保護制度が全部使える……とは限らない。」\n\nそこまで覚えて完成です。\n\n---\n\n# D【具体例｜実際に見てみましょう】\n\n「では、先輩がペットを飼っているとします。」\n\nペットの治療費が心配なので保険を探していたら、\n\n**少額短期保険業者が提供するペット保険**\n\nを見つけました。\n\n契約期間は1年間。\n\n「こういう限定されたリスクに、比較的短期間の保険で備える商品があるわけですね。」\n\nでは別のケース。\n\n少額短期保険業者が、\n\n> 「死亡保障5,000万円、契約期間30年です！」\n\nと言っていたら？\n\n「先輩、何か変ですよね。」\n\n……\n\nそうです。\n\n**少額でも短期でもない。**\n\n少額短期保険には保険金額や期間の制限があるため、このような大きな死亡保障・長期間の商品を少額短期保険として扱うことはできません。\n\n「名前を理解していれば、変な選択肢に気づけるんです。」\n\n---\n\n# 【理解確認】\n\n「はい。3問だけ確認します。」\n\n### Q1\n\n少額短期保険とは？\n\n……\n\n**保険金額が少額で、保険期間も短期間に限定された保険です。**\n\n「はい。」\n\n### Q2\n\n保険期間の上限は？\n\n生命保険・傷害疾病保険は？\n\n……\n\n**1年以内。**\n\n損害保険は？\n\n……\n\n**2年以内。**\n\n「そうです。**生・傷病1、損2**ですよ。」\n\n### Q3\n\n少額短期保険業者は、保険契約者保護機構の対象？\n\n……\n\n**対象外です。**\n\n「はい。前回とちゃんとつながりました。」\n\n---\n\n# 【30秒復習】\n\n「あと30秒ですよ。」\n\n① **何の話？**  \n→ 少額短期保険\n\n② **特徴は？**  \n→ 少額・短期に限定された保険\n\n③ **生命保険・傷害疾病保険の期間は？**  \n→ **1年以内**\n\n④ **損害保険は？**  \n→ **2年以内**\n\n⑤ **少額短期保険業者は？**  \n→ **登録制**\n\n⑥ **保険契約者保護機構は？**  \n→ **対象外**\n\n---\n\n# 【一文で覚える】\n\n> **「少額短期保険は“小さく短く”。生・傷病は1年、損保は2年、業者は登録制で保護機構の対象外。」**\n\n「はい。今回はこれをそのまま頭に残してください。」\n\n**少額 → 金額に上限**  \n**短期 → 生・傷病1年、損保2年**  \n**業者 → 登録制**  \n**破綻 → 保護機構の対象外**\n\n「……先輩、“ミニ保険”だけ覚えて終わろうとしてました？」\n\n「ダメです。この4点までセットですよ。」\n\n次は **⑦「ソルベンシー・マージン比率」** です。\n\n---", "chapter": 2}, {"n": 7, "title": "ソルベンシー・マージン比率", "raw": "# 第2章 リスク管理⑦\n\n## ソルベンシー・マージン比率\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**ソルベンシー・マージン比率**です。」\n\n「横文字で急に嫌そうな顔しないでください。意味はかなり単純です。」\n\n一言でいうと――\n\n> **保険会社が、通常の予測を超える大きなリスクにどれだけ耐えられるかを見る指標**\n\nです。\n\nたとえば、\n\n* 大規模な自然災害\n* 株価の大幅下落\n* 通常の予測を超える保険金支払い\n\nなどが起きたとき、\n\n**「この保険会社、ちゃんと耐えられますか？」**\n\nを見るわけです。\n\nそしてFPでは、まずこの数字です。\n\n> **200％**\n\n「はい。ここ重要ですよ。」\n\n**200％以上 → 健全性について一つの基準を満たしている**  \n**200％未満 → 原則として金融庁による早期是正措置の対象**\n\nと覚えます。\n\n---\n\n## 【重要ポイント】\n\n「三つに絞ります。」\n\n一つ目。\n\n**保険会社の支払余力を見る指標。**\n\n二つ目。\n\n見るのは普通の支払いではなく、\n\n**通常の予測を超えるリスクへの対応力**\n\nです。\n\n三つ目。\n\n**200％が重要な基準。**\n\n「ただし先輩。」\n\n**200％を超えていれば絶対に安全**\n\nという意味ではありません。\n\n「ここ、後でちゃんとやります。」\n\n---\n\n# B【詳しい解説｜なぜ必要なの？】\n\n「まず、保険会社の仕事を考えてみましょう。」\n\n契約者から保険料を集める。\n\nそして事故・死亡・病気などが起きたら保険金や給付金を支払います。\n\nここまではいいですよね。\n\nしかも前にやった**大数の法則**によって、\n\n「これくらいの事故が起こりそうだ」\n\nと予測できます。\n\n「じゃあ先輩、全部予測どおりにいくと思います？」\n\n……\n\n「ですよね。いかないことがあります。」\n\nたとえば想定以上の巨大災害が発生した。\n\n保有している株式などが大幅に値下がりした。\n\nこうなると、通常想定していた以上の負担が発生します。\n\nそこで、\n\n**通常の予測を超えるリスク**\n↓\nそれに対して\n↓\n**どれくらい余裕を持って支払いに耐えられるか**\n\nを見る。\n\nそれが**ソルベンシー・マージン比率**です。\n\n---\n\n## 言葉を分解しましょう\n\n「先輩、“ソルベンシー・マージン”って暗記しづらいでしょう？」\n\n### Solvency\n\n→ **支払能力**\n\n### Margin\n\n→ **余裕・余力**\n\nです。\n\nなので、\n\n**Solvency Margin**\n\nは、\n\n**支払いに対する余力**\n\nくらいのイメージ。\n\n「ほら。横文字のまま丸暗記するより楽でしょう？」\n\n---\n\n## 200％ってどういう意味？\n\n「ここ、少し注意です。」\n\nソルベンシー・マージン比率は、ざっくり言えば、\n\n**保険会社が持つ支払余力**\n\nを、\n\n**通常の予測を超えるリスク**\n\nと比べた指標です。\n\n一定の計算式で算出され、\n\n**200％**\n\nが監督上の重要な基準になります。\n\n200％以上なら、通常の監督上、健全性について一つの基準を満たしていると判断されます。\n\n一方、\n\n**200％を下回る**\n\nと？\n\n……\n\n「そうです。」\n\n原則として、金融庁による**早期是正措置**の対象になります。\n\nつまり、\n\n**200％未満**\n↓\n「支払余力、大丈夫ですか？」\n↓\n金融庁が改善を求めるなどの措置\n\nという流れです。\n\n---\n\n## 「じゃあ200％以上なら絶対安全？」\n\n「先輩、ここでそう思いますよね。」\n\n「残念ですけど、そこまで単純じゃありません。」\n\nソルベンシー・マージン比率は、保険会社の健全性を見るための**重要な指標の一つ**です。\n\nですが、\n\n**200％以上＝絶対に破綻しない**\n\nという保証ではありません。\n\n逆に、\n\n**200％未満＝その瞬間に破綻**\n\nでもありません。\n\n200％未満になったら、原則として早期是正措置の対象になる、ということです。\n\n「つまり200％は“生死を分ける魔法の数字”じゃなくて、**監督上の重要なライン**なんですね。」\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、今月の生活費が20万円だとします。」\n\n普通に生活するだけなら20万円あれば足ります。\n\nでも突然、\n\n「冷蔵庫が壊れました。15万円です」\n\n「スマホも壊れました」\n\n「さらに急な出費です」\n\nとなったら？\n\n「……嫌な想像ですね。でも続けますよ。」\n\n普通の生活費とは別に、\n\n**緊急用の貯金**\n\nが100万円ある人と、\n\n1万円しかない人。\n\nどちらが予想外の出費に強いでしょう？\n\n……\n\n「100万円ある人ですよね。」\n\n保険会社も似ています。\n\n普段想定している支払いだけでなく、\n\n**予想外の大きな損失に耐える余力がありますか？**\n\nを見る。\n\nこれがソルベンシー・マージン比率のイメージです。\n\n> **非常用の体力ゲージ**\n\nだと思ってください。\n\n「ただし体力ゲージ一つだけ見れば、その会社のすべてが分かるわけじゃない。」\n\nそこも大事です。\n\n---\n\n# D【具体例｜数字で見ましょう】\n\n「じゃあ先輩。かなり単純化して比較してみます。」\n\n### A保険会社\n\nソルベンシー・マージン比率  \n**800％**\n\n### B保険会社\n\n**250％**\n\n### C保険会社\n\n**180％**\n\n「監督上の基準で、まず注目するのはどこでしょう？」\n\n……\n\n「はい。C社ですね。」\n\n**180％ ＜ 200％**\n\nだからです。\n\nC社は原則として**早期是正措置の対象**になります。\n\nではA社の800％は、\n\n「B社より絶対に安全！」\n\nと言い切れる？\n\n……\n\n「そこは言い切れません。」\n\n比率が高いことは支払余力を見るうえで重要ですが、保険会社の健全性はそれだけで決まるわけではないからです。\n\n「FP試験なら、まずは――」\n\n**200％以上か未満か**\n\nをしっかり見てください。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n### Q1\n\nソルベンシー・マージン比率は何を見る？\n\n……\n\n**通常の予測を超えるリスクに対する保険会社の支払余力。**\n\n「そうです。」\n\n### Q2\n\n重要な基準となる数字は？\n\n……\n\n**200％。**\n\n「はい、即答してください。」\n\n### Q3\n\nソルベンシー・マージン比率が200％を超えていれば、絶対に破綻しない？\n\n……\n\n「違います。」\n\n**200％以上でも絶対安全を保証するわけではありません。**\n\n200％は、あくまで保険会社の健全性を見るための重要な監督上の基準です。\n\n「うん。ここまで言えれば大丈夫です。」\n\n---\n\n# 【30秒復習】\n\n「はい、あと30秒です。」\n\n① **何の話？**  \n→ ソルベンシー・マージン比率\n\n② **何を見る？**  \n→ 保険会社の支払余力\n\n③ **何に対する余力？**  \n→ **通常の予測を超えるリスク**\n\n④ **重要な数字は？**  \n→ **200％**\n\n⑤ **200％未満は？**  \n→ 原則、金融庁の**早期是正措置の対象**\n\n⑥ **間違えやすいところは？**  \n→ **200％以上＝絶対安全、ではない**\n\n# 【一文で覚える】\n\n> **「ソルベンシー・マージン比率は“想定外に耐える体力”。200％が監督上の重要ライン。」**\n\n「はい。今回はこれで十分です。」\n\n**大数の法則 → リスクを予測する**  \n**収支相等の原則 → 収支をつり合わせる**  \n**ソルベンシー・マージン比率 → それでも起こる“想定外”への耐久力を見る**\n\n「こうやって前の項目とつなげてください。単語を一個ずつ孤立させたら、また忘れますからね。」\n\n次は **⑧「保険法と保険業法」** です。\n\n---", "chapter": 2}, {"n": 8, "title": "保険法と保険業法", "raw": "# 第2章 リスク管理⑧\n\n## 保険法と保険業法\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**保険法と保険業法**です。」\n\n「名前がそっくりなので、ごちゃごちゃにしやすいところですね。」\n\nでも、最初はこれだけです。\n\n> **保険法＝保険“契約”のルール**  \n> **保険業法＝保険“会社・事業”のルール**\n\n「はい。まず、この2本だけ頭に置いてください。」\n\nもっと身近にすると、\n\n**保険法**\n→ 「契約者と保険会社の間で、どういうルールで契約するの？」\n\n**保険業法**\n→ 「そもそも保険会社は、どういうルールで営業するの？」\n\nです。\n\n「“契約”と“会社”。ここを分ければかなり楽になります。」\n\n---\n\n## 【重要ポイント】\n\n一つ目。\n\n### 保険法\n\n保険契約について定める法律です。\n\nたとえば、\n\n* 告知義務\n* 保険給付\n* 契約解除\n\nなど、**保険契約に関する当事者間のルール**を定めています。\n\n「次に出てくる**告知義務**も、ここにつながりますよ。」\n\n二つ目。\n\n### 保険業法\n\n保険会社などの事業運営や監督、保険募集などについて定める法律です。\n\n「つまり？」\n\n**保険会社がちゃんと健全に運営されているか、適切に保険を販売しているか**\n\nという側ですね。\n\nそして三つ目。\n\n> **保険法は契約者側のルール、保険業法は保険会社側のルール**\n\nとだけ覚えると少し雑です。\n\n「え？ 今そう覚えようとしてましたよね。」\n\nより正確には、\n\n**保険法＝保険契約そのものを規律する**\n\n**保険業法＝保険業を営む者への規制・監督などを定める**\n\nです。\n\n---\n\n# B【詳しい解説｜なぜ法律が2つあるの？】\n\n「では先輩、生命保険に入る場面を想像してください。」\n\n先輩と保険会社が、\n\n**生命保険契約を結びます。**\n\nそこで問題になります。\n\n「契約者は何を伝えなければいけない？」\n\n「どんな場合に保険金が支払われる？」\n\n「どんな場合に契約を解除できる？」\n\nこういう、\n\n**契約の中身のルール**\n\nが必要ですよね。\n\nそれを扱うのが、\n\n### 保険法\n\nです。\n\n---\n\n「でも、問題はそれだけじゃありません。」\n\nそもそも保険会社が、\n\n「経営状態がボロボロなのに保険を売り続けます」\n\nとか、\n\n「お客さんに不適切な方法で勧誘します」\n\nなんてことをしたら困りますよね。\n\nそこで、\n\n**保険会社の業務**\n↓\n**保険募集**\n↓\n**経営の健全性**\n↓\n**行政による監督**\n\nなどについて規制する必要があります。\n\nこちらが、\n\n### 保険業法\n\nです。\n\n---\n\nつまり、\n\n**保険契約を結ぶ**\n↓\n契約内容についてのルール\n↓\n**保険法**\n\n一方で、\n\n**保険事業を行う**\n↓\n会社・募集・監督などについてのルール\n↓\n**保険業法**\n\n「はい。こうやって分けてください。」\n\n---\n\n## 前にやった内容ともつながります\n\n「先輩、ちょっと前を思い出してください。」\n\n少額短期保険のとき、\n\n**一般の保険会社は免許制**\n\n**少額短期保険業者は登録制**\n\nとやりましたよね。\n\nこうした**保険事業に対する規制**は、保険業法の世界です。\n\nまた、\n\n**ソルベンシー・マージン比率**\n\nも保険会社の健全性・監督に関係していました。\n\n「つまり、ここまでバラバラに覚えていた知識が――」\n\n**保険業法＝保険会社を規制・監督する世界**\n\nの中でつながってくるんです。\n\n---\n\n## 「保険法は生命保険だけ？」\n\n「先輩、名前からそう思ってません？」\n\n違います。\n\n保険法は大きく、\n\n**生命保険\n損害保険\n傷害疾病定額保険**\n\nなどの契約について規定しています。\n\n「なので、“生命保険法”ではないですよ。」\n\n---\n\n## 誰を守るため？\n\n「もう一つ大事です。」\n\n保険契約って、\n\n保険会社  \nVS  \n一般の契約者\n\nでは、情報量や専門知識に差が出やすいですよね。\n\nそのため保険法には、**保険契約者等を保護するための規定**も設けられています。\n\n一方、保険業法でも、保険会社の健全性確保や適切な保険募集などを通じて**契約者保護**が図られています。\n\n「つまり、アプローチが違うんです。」\n\n**保険法**\n→ 契約ルールを整える\n\n**保険業法**\n→ 保険会社・保険業を規制・監督する\n\nという違いですね。\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、サッカーで考えてみましょう。」\n\n「え、保険なのにサッカー？」\n\n「いいから付き合ってください。」\n\n試合には、\n\n**選手同士がどうプレーするか**\n\nというルールがありますよね。\n\n手を使ったらダメ。\n\nファウルしたらどうなる。\n\nゴールの条件は何か。\n\nこういう、\n\n**試合そのもののルール**\n\nが、\n\n🟦 **保険法**\n\nのイメージです。\n\n一方、\n\n「このクラブはちゃんと運営されていますか？」\n\n「リーグ参加資格はありますか？」\n\n「運営上のルールを守っていますか？」\n\nといった、\n\n**クラブ・事業者側を管理するルール**\n\nが、\n\n🟥 **保険業法**\n\nのイメージ。\n\n「つまり――」\n\n**試合＝契約 → 保険法**\n\n**クラブ運営＝保険事業 → 保険業法**\n\nです。\n\n「はい。これなら名前が似ていても区別できますよね。」\n\n---\n\n# D【具体例｜どっちの法律？】\n\n「今回は数字より、仕分け問題をやったほうが覚えやすいです。」\n\n### ケース①\n\n保険契約をするとき、\n\n**契約者側の告知についてのルール**\n\nを確認したい。\n\n「どっちでしょう？」\n\n……\n\n### 保険法\n\nです。\n\n契約に関するルールだからですね。\n\n---\n\n### ケース②\n\nある会社が、\n\n**保険会社として事業を行うための規制**\n\nを確認したい。\n\nこれは？\n\n……\n\n### 保険業法\n\nです。\n\n「そうです。事業者側の規制ですね。」\n\n---\n\n### ケース③\n\n保険募集について適切なルールが守られているか。\n\nこれは？\n\n……\n\n「はい。」\n\n### 保険業法\n\nです。\n\n---\n\n### ケース④\n\n保険契約について、\n\n「どういう場合に契約を解除できる？」\n\nこれは？\n\n……\n\n### 保険法\n\nですね。\n\n「ほら。“契約か、保険事業か”を見るだけでかなり判断できるでしょう？」\n\n---\n\n# 【理解確認】\n\n「では先輩、本当に区別できるか3問いきます。」\n\n### Q1\n\n保険法は何についての法律？\n\n……\n\n**保険契約についての基本的なルールを定めた法律。**\n\n「はい。」\n\n### Q2\n\n保険業法は？\n\n……\n\n**保険業を営む者の業務・監督・保険募集などについて定めた法律。**\n\n「そうです。」\n\n### Q3\n\n「告知義務」と「保険会社への監督」。\n\nそれぞれどちらに関係する？\n\n……\n\n**告知義務**\n→ 保険法\n\n**保険会社への監督**\n→ 保険業法\n\n「はい。ちゃんと分けられました。」\n\n---\n\n# 【30秒復習】\n\n「では30秒で固定しますよ。」\n\n① **保険法は？**  \n→ **保険契約のルール**\n\n② **保険業法は？**  \n→ **保険業・保険会社等のルール**\n\n③ **告知義務は？**  \n→ 保険法\n\n④ **保険募集や監督は？**  \n→ 保険業法\n\n⑤ **少額短期保険業者の登録などは？**  \n→ 保険業法の世界\n\n⑥ **共通する目的の一つは？**  \n→ 契約者等の保護\n\n# 【一文で覚える】\n\n> **「契約を見るのが保険法、保険会社・保険業を見るのが保険業法。」**\n\n「はい。今回はこれが言えればまず大丈夫です。」\n\n**保険法＝契約**  \n**保険業法＝業者・事業・監督**\n\n「名前が似ているからって一緒にしないでくださいね。」\n\nそして次から、いよいよ保険商品の中身に少しずつ入っていきます。\n\n次は **⑨「解約返戻金」** です。\n\n---", "chapter": 2}, {"n": 9, "title": "解約返戻金（かいやくへんれいきん）", "raw": "# 第2章 リスク管理⑨\n\n## 解約返戻金（かいやくへんれいきん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**解約返戻金**です。」\n\n「これ、名前をそのまま分解すると分かりやすいですよ。」\n\n**解約**＝保険契約を途中でやめる  \n**返戻金**＝そのとき契約者に戻ってくるお金\n\nつまり一言でいうと――\n\n> **保険契約を途中で解約したとき、契約者に払い戻されるお金。**\n\n「ただし先輩。」\n\nここで一番やってはいけない勘違いがあります。\n\n> **今まで払った保険料が全部返ってくるわけではありません。**\n\nむしろ契約してから短期間で解約すると、**払込保険料の総額より解約返戻金がかなり少なかったり、ほとんどなかったりすることがあります。**\n\n「『積み立ててたんだから全部返して』ではないんですよ。」\n\n---\n\n### 【重要ポイント】\n\n「今回は3つです。」\n\n一つ目。\n\n**解約したときに受け取れるお金。**\n\n二つ目。\n\n**払込保険料総額＝解約返戻金ではない。**\n\n三つ目。\n\n保険商品によって、\n\n**解約返戻金があるもの・少ないもの・ないもの**\n\nがあります。\n\n「つまり、どんな保険でも解約すればお金が返ってくる、ではありません。」\n\n---\n\n# B【詳しい解説｜なぜ払った保険料が全部戻らないの？】\n\n「先輩、ここが一番大事です。」\n\nたとえば毎月1万円の保険料を払っていたとします。\n\n1年間なら、\n\n**1万円 × 12か月＝12万円**\n\nですよね。\n\nそこで解約した。\n\n「じゃあ12万円返してください」\n\n……とはならない場合があります。\n\n「え？ 自分が払った12万円なのに？」\n\n「はい。そこ、そう思いますよね。」\n\nでも保険料は単純な貯金ではありません。\n\n払った保険料は、保険金等の支払いに備える部分や、保険会社の事業運営に必要な費用などにも充てられます。\n\nだから、\n\n**保険料を支払う**\n↓\nその全額が自分専用の貯金箱に入るわけではない\n↓\n途中で解約\n↓\n契約内容・経過期間などに応じて\n↓\n**解約返戻金が支払われる**\n\nという仕組みです。\n\n「なので、」\n\n**保険料＝銀行預金**\n\nという感覚は捨ててください。\n\n---\n\n## なぜ契約直後は少なくなりやすいの？\n\n「じゃあ先輩。」\n\n加入してすぐ解約する場合と、長期間契約してから解約する場合。\n\nどちらのほうが解約返戻金が少なくなりやすいと思います？\n\n……\n\n「そうです。加入してすぐのほうです。」\n\n保険契約では契約の締結・維持などにも費用がかかります。\n\nそのため一般に、契約後の早い段階では解約返戻金が**払込保険料総額を大きく下回る**ことがあります。\n\n商品によっては解約返戻金がない場合もあります。\n\n---\n\n## 定期保険と終身保険では？\n\n「ここ、今後の商品学習につながりますよ。」\n\n### 定期保険\n\n一定期間の死亡保障を中心とする保険で、一般的に**貯蓄性は低く**、解約返戻金が少ない、またはない商品もあります。\n\n### 終身保険\n\n保障が一生涯続き、一般的に**貯蓄性もある**ため、契約期間の経過に伴って解約返戻金が増えていくタイプがあります。\n\n「だから後で終身保険をやったとき、」\n\n**終身保障＋解約返戻金による貯蓄性**\n\nという特徴につながってきます。\n\n---\n\n## 「じゃあ長く持てば必ず得する？」\n\n「先輩？」\n\n「今、危ないところまで行きましたよ。」\n\n解約返戻金が増える商品でも、\n\n> **払込保険料総額を必ず上回るとは限りません。**\n\nいつ解約するのか、どの商品なのか、契約条件はどうなっているのかなどで変わります。\n\n「なので“終身保険＝絶対儲かる貯金”みたいな覚え方は禁止です。」\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、スポーツジムを想像してください。」\n\n毎月1万円払っているとします。\n\n1年間で12万円。\n\n半年後に、\n\n「やっぱり退会します」\n\nと言ったからといって、\n\n「じゃあ今まで払った6万円を全部返してください」\n\nとはなりませんよね。\n\nなぜ？\n\n……\n\n「そうです。」\n\nその期間、**サービスを受けられる状態だった**からです。\n\n保険も、\n\n「事故が起きなかったから保険料が全部余ってる」\n\nではありません。\n\n保険期間中は、契約内容に応じて**保障を受けられる状態**だったわけです。\n\nただし保険には商品によって積立部分などがあり、解約時に一定額が戻ることがあります。\n\nそれが**解約返戻金**です。\n\n「つまり――」\n\n**払った保険料を返してもらう**\n\nというより、\n\n**契約を途中で終了したとき、その契約に応じた金額を受け取る**\n\nと考えたほうが正確です。\n\n---\n\n# D【具体例｜数字で確認しましょう】\n\n「では、かなり単純化した例です。」\n\n先輩が毎年20万円の保険料を10年間支払ったとします。\n\n払込保険料総額は、\n\n20万円 × 10年  \n＝ **200万円**\n\nですね。\n\n10年目に解約したところ、\n\n解約返戻金が仮に、\n\n**170万円**\n\nだったとします。\n\n「先輩、200万円払ったから200万円返ってきますか？」\n\n……\n\n違います。\n\n### 払込保険料総額\n\n200万円\n\n### 解約返戻金\n\n170万円\n\n差額は、\n\n**30万円**\n\nです。\n\nこの場合、\n\n**返戻率**\n\nを計算すると、\n\n170万円 ÷ 200万円 × 100  \n＝ **85％**\n\nとなります。\n\n「返戻率というのは簡単にいえば、払った保険料に対してどれくらい戻ってくるか、という割合ですね。」\n\n---\n\n## もう一つ重要な例\n\n「では、加入して1年しか経っていなかったら？」\n\n払込保険料20万円。\n\nでも解約返戻金が仮に5万円だった。\n\n「え、15万円どこいったの？」\n\nって感じますよね。\n\nだからこそ、\n\n**貯蓄性のある保険でも、短期間で解約すると元本割れすることがある**\n\nという点が重要なんです。\n\n---\n\n# 【理解確認】\n\n「はい。先輩、3問ですよ。」\n\n### Q1\n\n解約返戻金とは？\n\n……\n\n**保険契約を途中で解約したときに、契約者に払い戻されるお金。**\n\n「はい。」\n\n### Q2\n\n今まで100万円の保険料を払っていたら、解約返戻金も必ず100万円？\n\n……\n\n「違います。」\n\n**払込保険料総額と解約返戻金は同じとは限りません。**\n\n特に早期解約では、払込保険料総額を大きく下回る場合があります。\n\n### Q3\n\nすべての保険に解約返戻金がある？\n\n……\n\n**ありません。**\n\n商品によって、解約返戻金があるもの、少ないもの、ないものがあります。\n\n「はい。そこまで分かれば大丈夫です。」\n\n---\n\n# 【30秒復習】\n\n「あと30秒です。もう少しですから。」\n\n① **何の話？**  \n→ 解約返戻金\n\n② **いつ受け取る？**  \n→ 保険契約を途中で解約したとき\n\n③ **払込保険料は全部戻る？**  \n→ **戻るとは限らない**\n\n④ **契約直後の解約は？**  \n→ 解約返戻金が少ない・ない場合がある\n\n⑤ **貯蓄性のある保険は？**  \n→ 契約期間の経過に伴って解約返戻金が増えるタイプがある\n\n⑥ **最大の勘違いは？**  \n→ **保険料＝自分専用の貯金ではない**\n\n# 【一文で覚える】\n\n> **「解約返戻金は、保険を途中でやめたときに戻るお金。ただし、払った保険料がそのまま全部返ってくるわけではない。」**\n\n「はい。これを覚えておけば、後で出てくる**低解約返戻金終身保険**もかなり理解しやすくなります。」\n\n「単語同士、ちゃんとつながってきてますからね。」\n\n次は **⑩「生死混合保険」** です。\n\n---", "chapter": 2}, {"n": 10, "title": "生死混合保険（せいしこんごうほけん）", "raw": "# 第2章 リスク管理⑩\n\n## 生死混合保険（せいしこんごうほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**生死混合保険**です。」\n\n「名前がちょっと物騒ですけど……実は名前を分解すれば、そのまま意味が分かります。」\n\n**生＝生きていた場合**  \n**死＝死亡した場合**  \n**混合＝両方を組み合わせる**\n\nつまり一言でいうと――\n\n> **死亡した場合の保障と、生存していた場合の保障を組み合わせた保険。**\n\n「先輩、ここで具体的な保険を一つ覚えてください。」\n\n代表例は、\n\n## **養老保険**\n\nです。\n\n養老保険では、基本的に、\n\n**保険期間中に死亡**\n→ **死亡保険金**\n\n**満期まで生存**\n→ **満期保険金**\n\nを受け取ります。\n\n「つまり、死亡しても、生きて満期を迎えても、契約に応じた保険金がある。だから“生死混合”なんです。」\n\n---\n\n## 【重要ポイント】\n\n「今回は3つだけです。」\n\n一つ目。\n\n**死亡保険＋生存保険＝生死混合保険**\n\n二つ目。\n\n代表例は、\n\n**養老保険**\n\n三つ目。\n\n養老保険では一般に、\n\n> **死亡保険金と満期保険金が同額**\n\nとなるタイプが基本です。\n\n「ここ、後で養老保険を詳しくやるので、今は構造を理解してください。」\n\n---\n\n# B【詳しい解説｜何を「混合」しているの？】\n\n「先輩、生命保険を大きく考えると、まず3種類に整理できます。」\n\n### ① 死亡保険\n\n一定の条件で**死亡した場合**に保険金が支払われる。\n\n代表的なのは、\n\n**定期保険・終身保険**\n\nです。\n\n---\n\n### ② 生存保険\n\n一定期間まで**生存していた場合**に保険金などが支払われるタイプ。\n\n「つまり、“生きていること”を給付条件にするわけですね。」\n\n---\n\n### ③ 生死混合保険\n\n「では先輩。」\n\n死亡保険と生存保険を組み合わせたら？\n\n……\n\n**生死混合保険**\n\nになります。\n\n構造としては、\n\n**死亡した場合に備える**\n＋\n**満期まで生存した場合にも備える**\n↓\n**生死混合保険**\n\nです。\n\n「はい。“混合”って何を混ぜているのかまで分かりましたね。」\n\n---\n\n## 養老保険で考えると分かりやすいです\n\n「たとえば30年間の養老保険に入ったとします。」\n\n途中で死亡した。\n\n→ **死亡保険金**\n\n30年間生存して満期を迎えた。\n\n→ **満期保険金**\n\n「つまり――」\n\n### 死亡した場合\n\n💀 → 保険金\n\n### 生存して満期\n\n🙋 → 保険金\n\n「どちらのケースにも対応しているんです。」\n\n---\n\n## 「じゃあ終身保険も生死混合保険？」\n\n「先輩、そこ気になりません？」\n\n終身保険には解約返戻金があるものも多いので、\n\n「生きててもお金を受け取れるじゃん」\n\nと思うかもしれません。\n\nでも分類上、終身保険は基本的に**死亡保険**です。\n\nなぜなら、終身保険は基本的に**死亡・高度障害などを保険事故として保険金を支払う保険**だからです。\n\n解約返戻金を受け取ることと、\n\n**満期まで生存したことを理由として満期保険金を受け取ること**\n\nは別です。\n\n「ここ、混ぜないでくださいね。」\n\n---\n\n## 養老保険との違い\n\n養老保険には**満期**があります。\n\nたとえば、\n\n30歳で加入\n↓\n30年間保障\n↓\n60歳で満期\n\n60歳まで生存した。\n\n→ **満期保険金**\n\n一方、終身保険は名前どおり、\n\n**保障が一生涯続く**\n\nため、基本的に養老保険のような満期保険金はありません。\n\n「だから――」\n\n**終身保険＝死亡保険**\n\n**養老保険＝生死混合保険**\n\nです。\n\nここ、比較問題で使えますよ。\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、一本道を歩いているとします。」\n\n30年間歩く道です。\n\nゴールは60歳。\n\n途中で万一のことがあった場合には、\n\n**家族に死亡保険金。**\n\n何事もなくゴールまで到着したら、\n\n**本人に満期保険金。**\n\n「つまり、どちらのルートでも出口に保険金が用意されているイメージですね。」\n\n途中で死亡\n→ 💰死亡保険金\n\n満期まで生存\n→ 💰満期保険金\n\n「これが生死混合です。」\n\n死亡だけを見るのではなく、\n\n**生存したケースも保障設計に組み込んでいる。**\n\nだから、養老保険には死亡保障だけでなく**貯蓄性**もあります。\n\n---\n\n# D【具体例｜数字で確認しましょう】\n\n「では先輩、かなり分かりやすい例です。」\n\n30歳の人が、\n\n**保険期間30年**\n\n**死亡保険金1,000万円**\n\n**満期保険金1,000万円**\n\nの養老保険に加入したとします。\n\n---\n\n### ケース① 50歳で死亡\n\n30年の保険期間中ですね。\n\nどうなる？\n\n……\n\n**死亡保険金1,000万円**\n\nが支払われます。\n\n---\n\n### ケース② 60歳まで生存\n\n「今度は死亡してません。」\n\n30年間の保険期間が終了して満期になりました。\n\nどうなる？\n\n……\n\n**満期保険金1,000万円**\n\nを受け取ります。\n\n「そうです。」\n\nだから、\n\n**死亡**\n→ 1,000万円\n\n**生存して満期**\n→ 1,000万円\n\nという構造です。\n\n「これを見れば“生死混合”という名前、そのままでしょう？」\n\n---\n\n## 定期保険と比べてみましょう\n\n「ここでもう一歩。」\n\n同じ30年間でも、\n\n**定期保険**\n\nだったら？\n\n期間中に死亡\n→ 死亡保険金\n\n満期まで生存\n→ 原則、満期保険金はありません。\n\n一方、\n\n**養老保険**\n\nなら、\n\n期間中に死亡\n→ 死亡保険金\n\n満期まで生存\n→ 満期保険金\n\n「はい。違いが見えましたね。」\n\n---\n\n# 【理解確認】\n\n「では先輩、3問です。」\n\n### Q1\n\n生死混合保険は何と何を組み合わせたもの？\n\n……\n\n**死亡保険＋生存保険**\n\n「はい。」\n\n### Q2\n\n代表的な生死混合保険は？\n\n……\n\n**養老保険。**\n\n「これは即答してください。」\n\n### Q3\n\n終身保険も、解約返戻金があるから生死混合保険？\n\n……\n\n「違います。」\n\n**終身保険は基本的に死亡保険です。**\n\n解約返戻金と、満期まで生存したことで受け取る**満期保険金**は別物です。\n\n「はい。ここまで区別できれば十分です。」\n\n---\n\n# 【30秒復習】\n\n「あと30秒です。」\n\n① **何の話？**  \n→ 生死混合保険\n\n② **何を混ぜる？**  \n→ **死亡保険＋生存保険**\n\n③ **代表例は？**  \n→ **養老保険**\n\n④ **期間中に死亡すると？**  \n→ 死亡保険金\n\n⑤ **満期まで生存すると？**  \n→ 満期保険金\n\n⑥ **間違えやすいところは？**  \n→ **終身保険は基本的に死亡保険。解約返戻金と満期保険金を混同しない。**\n\n# 【一文で覚える】\n\n> **「生死混合保険は、死亡にも生存にも備える保険。代表選手は養老保険。」**\n\n「はい。ここはかなりシンプルですね。」\n\nそして次は、保険料がどう決まるのかという**生命保険の仕組みの中心部分**に入ります。\n\n次は **⑪「予定死亡率・予定利率・予定事業費率」** です。\n\n---", "chapter": 2}, {"n": 11, "title": "予定死亡率・予定利率・予定事業費率", "raw": "# 第2章 リスク管理⑪\n\n## 予定死亡率・予定利率・予定事業費率\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。ここは生命保険でかなり重要です。」\n\n「3つ同時に出てきて嫌そうな顔してますけど……役割を分ければ大丈夫です。」\n\nこの3つは、\n\n> **生命保険の保険料を計算するときに使う基礎的な予定率**\n\nです。\n\nまず一気に覚えようとしないでください。\n\n**予定死亡率**\n→ 「どれくらいの人が死亡すると予想する？」\n\n**予定利率**\n→ 「集めた保険料をどれくらい運用できると見込む？」\n\n**予定事業費率**\n→ 「保険会社の運営にどれくらい費用がかかると見込む？」\n\n「はい。つまり――」\n\n**死亡・運用・経費**\n\nの3つです。\n\nそして試験で特に大切なのが、**それぞれが上がったとき保険料がどう動くか**です。\n\n|予定率|上がると保険料は？|\n|-|-:|\n|予定死亡率|↑ 上がる|\n|予定利率|↓ 下がる|\n|予定事業費率|↑ 上がる|\n\n「先輩、この中で**予定利率だけ逆方向**です。ここ、狙われますよ。」\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n「一つずついきます。」\n\n## ① 予定死亡率\n\n「まず保険会社は、将来何人くらい死亡するか予測しないといけませんよね。」\n\nここで使うのが**予定死亡率**です。\n\n過去の統計などをもとに、\n\n**一定期間にどの程度の人が死亡するか**\n\nを見積もります。\n\n「では先輩。」\n\n死亡する人が多くなると予想したら、保険会社が支払う死亡保険金はどうなる？\n\n……\n\n「増えそうですよね。」\n\nだから、\n\n**予定死亡率↑**\n↓\n予想される死亡保険金の支払い↑\n↓\n必要なお金↑\n↓\n**保険料↑**\n\nとなります。\n\n> **予定死亡率↑ → 保険料↑**\n\nです。\n\n---\n\n## ② 予定利率\n\n「ここが一番間違えやすいです。」\n\n保険会社は受け取った保険料を、そのまま金庫に寝かせているわけではありません。\n\n一定の運用収益を見込みます。\n\nその運用収益をあらかじめ見込んで、**その分だけ保険料を割り引いて計算する**考え方に関係するのが予定利率です。\n\n「では先輩。」\n\nたくさん運用益を得られると見込めるなら、契約者から最初に集める保険料は多く必要ですか？\n\n……\n\n「そう。少なくて済みます。」\n\nだから、\n\n**予定利率↑**\n↓\n運用による収益を多く見込める\n↓\n契約者から集める必要額↓\n↓\n**保険料↓**\n\nです。\n\n> **予定利率↑ → 保険料↓**\n\n「ここだけ逆です。」\n\n---\n\n## ③ 予定事業費率\n\n「最後は一番直感的です。」\n\n保険会社にも、\n\n人件費  \n店舗費用  \nシステム費用  \n契約管理費用\n\nなど、事業を運営するためのお金が必要です。\n\nその事業費をあらかじめ見積もるのが**予定事業費率**です。\n\nでは、経費がたくさんかかると予想したら？\n\n……\n\n「当然、その分のお金が必要になります。」\n\nだから、\n\n**予定事業費率↑**\n↓\n予想される経費↑\n↓\n必要なお金↑\n↓\n**保険料↑**\n\nです。\n\n> **予定事業費率↑ → 保険料↑**\n\n---\n\n## 3つを一気につなげます\n\n「先輩、ここで整理しますよ。」\n\n### 死亡が増える\n\n→ 保険金支払いが増える\n→ **保険料↑**\n\n### 経費が増える\n\n→ お金が余計に必要\n→ **保険料↑**\n\n### 運用利率が上がる\n\n→ 運用で稼げる\n→ 契約者から集めるお金を減らせる\n→ **保険料↓**\n\n「つまり――」\n\n> **死亡↑・経費↑なら保険料↑。利率↑だけ保険料↓。**\n\nこれが一番覚えやすいです。\n\n---\n\n## 前にやった「大数の法則」ともつながります\n\n「先輩、予定死亡率ってどうやって予測するんだと思います？」\n\n一人の人を見て、\n\n「この人は来年死亡する！」\n\nなんて予言するわけではありません。\n\n大勢の人の統計を使う。\n\n「あ、何か思い出しません？」\n\nそうです。\n\n**大数の法則**です。\n\n多数の人を観察する\n↓\n死亡率が安定してくる\n↓\n将来の死亡者数を統計的に予測する\n↓\n予定死亡率などを使って保険料計算につなげる\n\n「ほら。また前の項目につながりました。」\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、100人で旅行するツアーの参加費を決める係になったと思ってください。」\n\n旅行会社が考えるのは、\n\n**① どれくらい費用が発生する？**\n\n**② 預かったお金を運用してどれくらい増やせる？**\n\n**③ スタッフ代など運営費はいくら？**\n\nですよね。\n\n保険会社も似ています。\n\n### 予定死亡率\n\n「保険金をどれくらい払うことになりそう？」\n\n### 予定利率\n\n「預かった保険料を運用して、どれくらい収益を見込めそう？」\n\n### 予定事業費率\n\n「会社を運営するのにどれくらいかかりそう？」\n\nこれを考えて、\n\n**じゃあ保険料はいくら必要？**\n\nと計算するわけです。\n\n「先輩、3つを単語として覚えず、**支払い・運用・経費**という会社のお財布として見てください。」\n\n---\n\n# D【具体例｜数字で見ましょう】\n\n「かなり単純化して考えますよ。」\n\n保険会社が将来、\n\n**1億円**\n\nの保険金支払いを見込んでいるとします。\n\nでも運用によって、\n\n**2,000万円**\n\n増やせると見込める。\n\nなら、単純なイメージでは、\n\n1億円 − 2,000万円  \n＝ **8,000万円**\n\nを保険料などから準備すればいい。\n\n「では予定利率が上がって、運用で3,000万円稼げると見込めたら？」\n\n1億円 − 3,000万円  \n＝ **7,000万円**\n\n「必要額が減りましたよね。」\n\nだから、\n\n**予定利率↑ → 保険料↓**\n\nなんです。\n\n---\n\n「逆に、死亡者が予想より多くなりそうで、必要な保険金が」\n\n1億円 → **1億2,000万円**\n\nになったら？\n\n必要なお金は増えます。\n\nだから、\n\n**予定死亡率↑ → 保険料↑**\n\nです。\n\nさらに会社の運営費まで増えれば？\n\n「はい。」\n\n**予定事業費率↑ → 保険料↑**\n\nです。\n\n---\n\n# 【理解確認】\n\n「先輩、ここは試験で大事なので3問いきます。」\n\n### Q1\n\n予定死亡率が上がると保険料は？\n\n……\n\n**上がる。**\n\n「死亡保険金の支払いが増えると予想するからですね。」\n\n### Q2\n\n予定事業費率が上がると？\n\n……\n\n**保険料も上がる。**\n\n「はい。経費が増えるから。」\n\n### Q3\n\n予定利率が上がると？\n\n……\n\n「ここですよ。」\n\n**保険料は下がります。**\n\n運用収益をより多く見込めるためです。\n\n「はい。予定利率だけ逆方向。ちゃんと止まれましたね。」\n\n---\n\n# 【30秒復習】\n\n「ここは30秒でかなり固まりますよ。」\n\n① **予定死亡率とは？**  \n→ 将来の死亡率を見積もる\n\n② **上がると？**  \n→ **保険料↑**\n\n③ **予定利率とは？**  \n→ 運用収益を見込む率\n\n④ **上がると？**  \n→ **保険料↓**\n\n⑤ **予定事業費率とは？**  \n→ 事業運営に必要な費用を見積もる率\n\n⑥ **上がると？**  \n→ **保険料↑**\n\n### 覚え方\n\n> **死亡↑ → 保険料↑**  \n> **経費↑ → 保険料↑**  \n> **利率↑ → 保険料↓**\n\n「“利率だけ逆”です。」\n\n# 【一文で覚える】\n\n> **「生命保険料は死亡・運用・経費の3つで考える。死亡率と事業費率が上がれば保険料は上がり、予定利率が上がれば保険料は下がる。」**\n\n「はい。今回はこの**↑↑↓の関係**を自分で説明できればかなり強いです。」\n\nそして次は、この保険料をさらに二つに分解します。\n\n**『私たちが払っている保険料って、結局何に使われているの？』**\n\nという話ですね。\n\n次は **⑫「純保険料と付加保険料」** です。\n\n---", "chapter": 2}, {"n": 12, "title": "純保険料と付加保険料", "raw": "# 第2章 リスク管理⑫\n\n## 純保険料と付加保険料\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は前回の**予定死亡率・予定利率・予定事業費率**と直接つながります。」\n\n私たちが保険会社に払う保険料は、大きく分けると――\n\n> **営業保険料 ＝ 純保険料 ＋ 付加保険料**\n\nです。\n\n「まず、この式を固定してください。」\n\nでは違いは？\n\n**純保険料**\n→ **保険金・給付金などの支払いに充てる部分**\n\n**付加保険料**\n→ **保険会社が事業を運営するための経費に充てる部分**\n\n「もっと簡単にしますね。」\n\n> **純＝保障そのもののお金**  \n> **付加＝会社を動かすお金**\n\nです。\n\nそして前回の3つとつなげると、\n\n**純保険料**\n→ 予定死亡率・予定利率などを基礎に計算\n\n**付加保険料**\n→ 予定事業費率を基礎に計算\n\n「ここまでセットにすると一気に覚えられます。」\n\n---\n\n# B【詳しい解説｜なぜ2つに分かれるの？】\n\n「先輩、保険会社に毎月1万円払っているとします。」\n\nその1万円、全部が将来の保険金のために積み立てられていると思います？\n\n……\n\n「違います。」\n\n保険会社にも会社を運営するためのお金が必要ですよね。\n\nたとえば、\n\n契約を管理する  \n↓\n社員に給料を払う  \n↓\nシステムを運営する  \n↓\n保険金の請求を処理する\n\nこうした費用も発生します。\n\nだから保険料を、\n\n**保障のためのお金**\nと\n**事業運営のためのお金**\n\nに分けて考えるわけです。\n\n---\n\n## ① 純保険料\n\n「まず“純”です。」\n\n純保険料は、主として**保険金や給付金などの支払いに充てられる部分**です。\n\nさらに生命保険では、純保険料を、\n\n**死亡保険料**\nと\n**生存保険料**\n\nに分けて考えることがあります。\n\n### 死亡保険料\n\n→ 死亡保険金などの財源\n\n### 生存保険料\n\n→ 満期保険金などの財源\n\n「たとえば養老保険なら、死亡した場合だけでなく満期まで生存した場合にも保険金がありますよね。」\n\n「……さっきやりましたよ？」\n\n**生死混合保険＝養老保険**\n\nでしたね。\n\nこういう知識もここにつながります。\n\n---\n\n## ② 付加保険料\n\n「今度は“付加”です。」\n\nこれは保険会社の**事業運営に必要な経費**に充てる部分です。\n\nたとえば、\n\n人件費  \n店舗・事務費  \n契約管理費  \n募集にかかる費用\n\nなどですね。\n\n「つまり先輩。」\n\n保険料1万円を払ったからといって、\n\n**1万円全部が自分の保障のために積み立てられている**\n\nわけではありません。\n\nこれ、前にやった**解約返戻金**ともつながります。\n\n---\n\n## 前回の予定率と接続しましょう\n\n「ここが今回、一番覚えてほしいところです。」\n\n前回、\n\n### 予定死亡率\n\n→ 死亡の発生を見積もる\n\n### 予定利率\n\n→ 運用収益を見積もる\n\n### 予定事業費率\n\n→ 会社の経費を見積もる\n\nとやりました。\n\nでは、\n\n**予定事業費率**\n\nは純保険料と付加保険料、どちらに関係しそうです？\n\n……\n\n「はい、付加保険料ですね。」\n\n経費だからです。\n\n整理すると、\n\n**予定死亡率・予定利率**\n↓\n**純保険料**\n\n**予定事業費率**\n↓\n**付加保険料**\n\nそして、\n\n**純保険料＋付加保険料**\n↓\n**営業保険料**\n\n「ほら。前回と今回が一本につながりました。」\n\n---\n\n# C【イメージ理解｜一回、想像してみてください】\n\n「先輩、テーマパークの入場料を想像してください。」\n\n入場料を5,000円払ったとします。\n\nその5,000円全部が、\n\n「アトラクションを動かす費用だけ」\n\nに使われるわけじゃありませんよね。\n\nスタッフのお給料。\n\n施設の管理。\n\nチケットシステム。\n\n清掃。\n\nいろいろ必要です。\n\n保険も似ています。\n\n先輩が払う**営業保険料**の中には、\n\n🛡️ **保険金などを支払うためのお金**\n\nと、\n\n🏢 **保険会社を運営するためのお金**\n\nの両方が入っています。\n\n前者が、\n\n**純保険料**\n\n後者が、\n\n**付加保険料**\n\nです。\n\n「“純”は保険そのもの。“付加”は運営費がくっついている。」\n\nそんなイメージで大丈夫です。\n\n---\n\n# D【具体例｜数字で見ましょう】\n\n「では毎月1万円の保険料を払っていると仮定します。」\n\n説明のため単純化して、\n\n**純保険料：8,000円**\n\n**付加保険料：2,000円**\n\nだったとしましょう。\n\nすると、\n\n8,000円 ＋ 2,000円  \n＝ **10,000円**\n\nこれが契約者が実際に支払う**営業保険料**です。\n\n---\n\n「では先輩。」\n\n保険会社の人件費などが上がって、事業運営に必要な費用が増えたとします。\n\nどちらに影響します？\n\n純保険料？\n\n付加保険料？\n\n……\n\n「そうです。」\n\n### 付加保険料\n\nですね。\n\nつまり、\n\n**予定事業費率↑**\n↓\n事業運営費を多く見込む\n↓\n**付加保険料↑**\n↓\n結果として営業保険料も上がる方向\n\nとなります。\n\n---\n\n「逆に、予定利率が上がったら？」\n\n……\n\n運用収益を多く見込める。\n\nだから、\n\n**純保険料が下がる方向**\n\nに働きます。\n\n「はい。前回の話がそのまま使えましたね。」\n\n---\n\n# 【理解確認】\n\n「では先輩、3問です。」\n\n### Q1\n\n私たちが実際に支払う営業保険料は何と何で構成される？\n\n……\n\n> **純保険料＋付加保険料**\n\n「はい。」\n\n### Q2\n\n保険金・給付金などの支払いに充てる部分は？\n\n……\n\n**純保険料。**\n\n「そうです。」\n\nでは会社の事業運営費は？\n\n**付加保険料。**\n\n---\n\n### Q3\n\n予定事業費率はどちらに関係する？\n\n……\n\n**付加保険料。**\n\n「はい。理由も言えます？」\n\n……\n\n事業費＝会社の運営費だから。\n\n「そうです。そこまで言えれば暗記じゃなくて理解になってます。」\n\n---\n\n# 【30秒復習】\n\n「はい、あと30秒です。」\n\n① **営業保険料は？**  \n→ 純保険料＋付加保険料\n\n② **純保険料は？**  \n→ 保険金・給付金などの財源\n\n③ **付加保険料は？**  \n→ 保険会社の事業運営費\n\n④ **純保険料に関係する予定率は？**  \n→ **予定死亡率・予定利率**\n\n⑤ **付加保険料に関係するのは？**  \n→ **予定事業費率**\n\n⑥ **間違えやすいところは？**  \n→ 払った保険料の全額が、自分の保障のために積み立てられるわけではない\n\n# 【一文で覚える】\n\n> **「営業保険料＝純保険料＋付加保険料。純は保障、付加は会社の経費。」**\n\n「はい。これで前回とセットにすると――」\n\n**死亡・利率 → 純**  \n**事業費 → 付加**  \n**純＋付加 → 実際に払う保険料**\n\n「ここまで頭の中で一本につながっていれば大丈夫です。」\n\n次は **⑬「剰余金と配当金」** です。\n\n---", "chapter": 2}, {"n": 13, "title": "剰余金と配当金", "raw": "# 第2章 リスク管理⑬\n\n## 剰余金と配当金\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**剰余金と配当金**です。」\n\n「ここ、前回の**予定死亡率・予定利率・予定事業費率**を理解していれば、かなり簡単ですよ。」\n\nまず一言でいうと、\n\n> **予定より保険会社のお金が余ったもの＝剰余金**  \n> **その剰余金を契約者に還元するもの＝配当金**\n\nです。\n\n「先輩、“余ったお金＝そのまま配当金”ではありませんよ。そこは分けます。」\n\n流れは、\n\n**予定を立てて保険料を計算**\n↓\n**実際に保険事業を行う**\n↓\n予定と実績に差が出る\n↓\n**剰余金が発生**\n↓\nその一部などを契約者へ還元\n↓\n**配当金**\n\nです。\n\n---\n\n# B【詳しい解説｜どうしてお金が余るの？】\n\n「先輩、前々回を思い出してください。」\n\n保険会社は最初から未来を完全に知っているわけではありません。\n\nだから、\n\n**予定死亡率**\n→ どれくらい死亡する？\n\n**予定利率**\n→ どれくらい運用できる？\n\n**予定事業費率**\n→ どれくらい経費がかかる？\n\nという**予定**を使って保険料を計算しました。\n\n「でも、予定と現実が100％同じになると思います？」\n\n……\n\n「ならないですよね。」\n\nここから剰余金が出てきます。\n\n---\n\n## ① 死差益（しさえき）\n\n「まず死亡について。」\n\n保険会社が、\n\n「今年は100人くらい死亡するだろう」\n\nと見込んでいた。\n\nでも実際には、\n\n**80人だった。**\n\nすると、予定していたより死亡保険金の支払いが少なくなりますよね。\n\nこれによって生じる利益が、\n\n> **死差益**\n\nです。\n\nイメージは、\n\n**実際の死亡者数が想定より少ない**\n↓\n保険金支払いが想定より少ない\n↓\n**死差益**\n\nです。\n\n---\n\n## ② 利差益（りさえき）\n\n「次は運用です。」\n\nたとえば、\n\n「これくらい運用収益を得られるだろう」\n\nと見込んでいた。\n\nところが実際には、\n\n**想定以上の運用成果が出た。**\n\nすると？\n\n……\n\n「そうです。予定よりお金が増えます。」\n\nこれによる利益が、\n\n> **利差益**\n\nです。\n\n**実際の運用成果が予定を上回る**\n↓\n**利差益**\n\nですね。\n\n---\n\n## ③ 費差益（ひさえき）\n\n「最後は会社の経費です。」\n\n保険会社が、\n\n「今年は事業運営に100億円くらい必要だろう」\n\nと見積もった。\n\nでも実際には、\n\n**90億円で済んだ。**\n\n10億円少なく済みました。\n\nこれによって生じる利益が、\n\n> **費差益**\n\nです。\n\n**実際の事業費が予定より少ない**\n↓\n**費差益**\n\nです。\n\n---\n\n## 3つを並べましょう\n\n「はい、ここ重要です。」\n\n### 死差益\n\n→ **死亡に関する予定と実績の差**\n\n### 利差益\n\n→ **運用に関する予定と実績の差**\n\n### 費差益\n\n→ **事業費に関する予定と実績の差**\n\n「先輩、何か気づきません？」\n\n前にやった、\n\n**予定死亡率\n予定利率\n予定事業費率**\n\nに対応しています。\n\nつまり、\n\n**予定死亡率**\n↓\n実績との差\n↓\n**死差益**\n\n**予定利率**\n↓\n実績との差\n↓\n**利差益**\n\n**予定事業費率**\n↓\n実績との差\n↓\n**費差益**\n\n「ほら。新しい単語を3つ覚えているように見えて、実際は前回の続きなんです。」\n\n---\n\n# じゃあ「剰余金」と「配当金」の違いは？\n\n「ここで本題です。」\n\nこうした予定と実績との差などから生じる余りが、\n\n## **剰余金**\n\nです。\n\nそして、有配当保険などでは、その剰余金をもとに契約者へ還元されるお金が、\n\n## **配当金**\n\nです。\n\n「つまり――」\n\n> **剰余金＝保険会社側で生じた余り**  \n> **配当金＝その剰余金をもとに契約者へ還元されるお金**\n\nという関係ですね。\n\n---\n\n## 「じゃあ配当金は絶対にもらえる？」\n\n「先輩、それは違います。」\n\n配当金は、**必ず支払われるものではありません。**\n\n実績などによって配当が出ないこともありますし、そもそも**無配当保険**もあります。\n\n「“配当金”という名前を見て、株式の配当とまったく同じものだと思わないでくださいね。」\n\n生命保険の配当金は、保険料計算で用いた予定と実績との差などから生じた剰余を、契約内容に応じて還元するものと考えると分かりやすいです。\n\n---\n\n# C【イメージ理解｜旅行の予算で考えましょう】\n\n「先輩、友達10人で旅行するとします。」\n\n幹事の先輩が、\n\n「交通費・ホテル代・その他で、一人5万円くらい必要かな」\n\nと見積もって、\n\n10人から、\n\n**5万円 × 10人＝50万円**\n\n集めました。\n\nところが実際には、\n\nホテルが安かった。\n\n交通費も予想より安かった。\n\n合計、\n\n**45万円**\n\nで済んだ。\n\n「じゃあ5万円余りますよね。」\n\nこの、\n\n### 余った5万円\n\nが**剰余金**のイメージ。\n\nそして、\n\n「じゃあ余った分をみんなに返そう」\n\nと還元した。\n\nその、\n\n### みんなに返すお金\n\nが**配当金**のイメージです。\n\n「つまり――」\n\n**余った時点＝剰余金**\n\n**契約者へ還元＝配当金**\n\nです。\n\n「はい。ここはこの順番で覚えてください。」\n\n---\n\n# D【具体例｜数字で確認します】\n\n「では生命保険っぽく考えてみましょう。」\n\n保険会社が、\n\n死亡保険金の支払い  \n→ **100億円を想定**\n\nしていたとします。\n\nところが実際は、\n\n→ **90億円**\n\nだった。\n\n「予定より？」\n\n……\n\n**10億円少なく済んだ。**\n\n死亡に関する予定と実績の差から利益が生じました。\n\n→ **死差益**\n\n---\n\nさらに、\n\n予定していた運用収益よりも、\n\n**5億円多く運用益が出た。**\n\n→ **利差益**\n\nさらに、\n\n予定していた事業費より、\n\n**3億円少なく済んだ。**\n\n→ **費差益**\n\n「単純化すると、こうした予定と実績との差などから剰余が生まれてくるわけです。」\n\nそして、その剰余金をもとに、\n\n**有配当保険などの契約者へ還元**\n\nされるものが、\n\n### 配当金\n\nです。\n\n---\n\n# 【理解確認】\n\n「では先輩、3問です。」\n\n### Q1\n\n剰余金とは？\n\n……\n\n**保険料計算で用いた予定と実際の結果との差などから生じる余り。**\n\n「はい。」\n\n### Q2\n\n剰余金をもとに契約者へ還元されるお金は？\n\n……\n\n**配当金。**\n\n「そうです。」\n\n### Q3\n\n「死亡・運用・事業費」に対応する3つの差益は？\n\n……\n\n死亡  \n→ **死差益**\n\n運用  \n→ **利差益**\n\n事業費  \n→ **費差益**\n\n「はい。ここはセットで覚えましょう。」\n\n---\n\n# 【30秒復習】\n\n① **剰余金とは？**  \n→ 予定と実績との差などから生じる余り\n\n② **配当金とは？**  \n→ 剰余金をもとに契約者へ還元されるお金\n\n③ **死亡に関する利益は？**  \n→ **死差益**\n\n④ **運用に関する利益は？**  \n→ **利差益**\n\n⑤ **事業費に関する利益は？**  \n→ **費差益**\n\n⑥ **配当金は必ず出る？**  \n→ **出るとは限らない**\n\n---\n\n# 【ここまでを一本につなげる】\n\n「先輩、⑪〜⑬は別々に暗記しないでください。」\n\n**予定死亡率・予定利率**\n↓\n**純保険料**\n\n**予定事業費率**\n↓\n**付加保険料**\n\n純保険料＋付加保険料\n↓\n**営業保険料**\n\nそして実際に保険事業を行う\n↓\n予定と実績に差が出る\n↓\n**死差益・利差益・費差益**\n↓\n**剰余金**\n↓\n契約者への還元\n↓\n**配当金**\n\n「はい。これで全部、一つの流れになりました。」\n\n# 【一文で覚える】\n\n> **「予定よりうまくいって生まれた余りが剰余金、その剰余金をもとに契約者へ還元するのが配当金。」**\n\n「次はちょうど、この配当金が**ある保険・ない保険・一部だけ反映する保険**を比べます。」\n\n次は **⑭「有配当保険・無配当保険・準有配当保険」** です。\n\n---", "chapter": 2}, {"n": 14, "title": "有配当保険・無配当保険・準有配当保険", "raw": "# 第2章 リスク管理⑭\n\n## 有配当保険・無配当保険・準有配当保険\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は前回の**剰余金・配当金**の続きです。」\n\n名前が3つ並ぶと面倒そうですが、見るポイントは一つ。\n\n> **何による剰余を配当として還元するタイプなのか？**\n\nです。\n\nまず全体を並べます。\n\n|種類|配当|\n|-|-|\n|**有配当保険**|原則、**3つの利源**から生じた剰余をもとに配当|\n|**準有配当保険**|主に**利差**による剰余をもとに配当|\n|**無配当保険**|**配当なし**|\n\n「で、その3つの利源って何でした？」\n\n……\n\nそうです。\n\n**死差\n利差\n費差**\n\nですね。\n\nだからイメージは、\n\n> **有配当＝3つ見る**  \n> **準有配当＝主に利差を見る**  \n> **無配当＝配当なし**\n\nです。\n\n「ただし、“有配当”だから必ず配当金が出る、ではありません。ここは後でちゃんと押さえます。」\n\n---\n\n# B【詳しい解説｜3種類は何が違うの？】\n\n## ① 有配当保険\n\n「まず一番分かりやすいものから。」\n\n前回やった3つを思い出してください。\n\n**予定死亡率と実際の死亡率の差**\n→ 死差\n\n**予定利率と実際の運用成果の差**\n→ 利差\n\n**予定事業費率と実際の事業費の差**\n→ 費差\n\n有配当保険では、一般にこうした**3つの利源から生じる剰余**をもとに配当を行います。\n\nこれを、\n\n> **3利源配当タイプ**\n\nと呼ぶことがあります。\n\n「死亡・運用・経費、全部を見るタイプですね。」\n\n---\n\n## ② 準有配当保険\n\n「問題は“準”ですよね。」\n\n先輩、\n\n「準って何が準なの？」\n\nって思いませんでした？\n\n準有配当保険は一般に、\n\n> **主として利差による剰余を配当するタイプ**\n\nです。\n\nつまり、\n\n**死差\n費差**\n\nまで含めた3利源すべてではなく、\n\n主に、\n\n### **利差**\n\nに着目します。\n\nそのため、\n\n> **利差配当タイプ**\n\nとも呼ばれます。\n\n---\n\n「じゃあ、なんで利差だけ？」\n\n保険会社の運用実績が予定を上回った場合などに、その差を配当に反映する仕組みなんですね。\n\nだから、\n\n**有配当**\n→ 死亡・運用・経費\n\n**準有配当**\n→ 主に運用\n\nと整理すると分かりやすいです。\n\n---\n\n## ③ 無配当保険\n\n「これは名前そのままです。」\n\n> **契約者配当を行わない保険**\n\nです。\n\n「え？ じゃあ絶対に有配当のほうがお得じゃない？」\n\n……先輩、そう単純には決められません。\n\n無配当保険は、契約者配当を行わない前提で設計されるため、一般に**有配当保険より保険料が割安に設定される傾向**があります。\n\nつまり、\n\n**配当がある＝絶対お得**\n\nではありません。\n\n保険料や保障内容などを含めて比較する必要があります。\n\n---\n\n# 「有配当なら絶対に配当金がもらえる？」\n\n「はい、ここ試験でも実生活でも大事です。」\n\n答えは、\n\n## **いいえ。**\n\n有配当保険であっても、剰余の状況などによっては**配当金が支払われないことがあります。**\n\n「“有配当”というのは、配当が保証されているという意味ではないんです。」\n\nつまり、\n\n**有配当保険**\n≠\n**必ず配当金がもらえる保険**\n\nです。\n\n---\n\n# 前回から一本につなげましょう\n\n「先輩、ここまでの流れを切らないでくださいね。」\n\n保険会社が予定を立てる。\n\n**予定死亡率\n予定利率\n予定事業費率**\n\n↓\n\n実際に運営する\n\n↓\n\n予定と実績に差が生じる\n\n↓\n\n**死差\n利差\n費差**\n\n↓\n\n剰余金が生じる\n\n↓\n\nその剰余をどう配当に反映する？\n\n↓\n\n### 有配当\n\n→ **3利源**\n\n### 準有配当\n\n→ **主に利差**\n\n### 無配当\n\n→ **配当なし**\n\n「はい。⑪から⑭まで全部一本ですよ。」\n\n---\n\n# C【イメージ理解｜3つの箱で考えましょう】\n\n「先輩、会社に3つの“節約箱”があると思ってください。」\n\n### 箱①\n\n💀 死亡関係\n\n### 箱②\n\n📈 運用関係\n\n### 箱③\n\n🏢 経費関係\n\n予定より結果が良かったことで、各箱に余裕が生まれることがあります。\n\n---\n\n### 有配当保険\n\n「3つの箱を見ます。」\n\n💀 ＋ 📈 ＋ 🏢\n\n→ **3利源**\n\n---\n\n### 準有配当保険\n\n「主にこの箱です。」\n\n📈\n\n→ **利差**\n\n---\n\n### 無配当保険\n\n「そもそも契約者配当を行いません。」\n\n→ **配当なし**\n\n---\n\n「なので頭の中では、」\n\n> **有＝3箱**  \n> **準＝主に運用箱**  \n> **無＝配当箱なし**\n\nくらいのイメージでいいです。\n\n---\n\n# D【具体例｜実際に仕分けしてみましょう】\n\n「では先輩、問題形式でいきます。」\n\nある保険会社で、\n\n死亡関係の剰余  \n→ 10億円\n\n運用関係の剰余  \n→ 20億円\n\n事業費関係の剰余  \n→ 5億円\n\nが生じたと仮定します。\n\n---\n\n### ケース①\n\n3つの利源をもとに配当を考えるタイプ。\n\nこれは？\n\n……\n\n**有配当保険。**\n\n「はい。」\n\n---\n\n### ケース②\n\n主に運用関係の利差をもとに配当を考えるタイプ。\n\nこれは？\n\n……\n\n**準有配当保険。**\n\n「そうです。」\n\n---\n\n### ケース③\n\nそもそも契約者配当を行わない。\n\nこれは？\n\n……\n\n**無配当保険。**\n\n「はい。ここまでならもう迷いませんね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n有配当保険で見る基本的な3つの利源は？\n\n……\n\n**死差・利差・費差。**\n\n「前回とセットです。」\n\n---\n\n### Q2\n\n準有配当保険は主に何による剰余を配当する？\n\n……\n\n**利差。**\n\n「だから“利差配当タイプ”ですね。」\n\n---\n\n### Q3\n\n有配当保険なら配当金は必ず支払われる？\n\n……\n\n**いいえ。**\n\n剰余の状況などによっては、配当金が支払われないこともあります。\n\n「“有配当＝配当保証”ではありません。」\n\n---\n\n# 【30秒復習】\n\n① **有配当保険は？**  \n→ 3利源をもとに配当\n\n② **3利源とは？**  \n→ **死差・利差・費差**\n\n③ **準有配当保険は？**  \n→ 主に**利差**をもとに配当\n\n④ **無配当保険は？**  \n→ **契約者配当なし**\n\n⑤ **有配当なら必ず配当？**  \n→ **いいえ**\n\n⑥ **無配当保険の特徴は？**  \n→ 一般に有配当保険より保険料が割安な傾向\n\n---\n\n# 【一文で覚える】\n\n> **「有配当は死・利・費の3利源、準有配当は主に利差、無配当は配当なし。」**\n\n「はい。ここはもう、**有＝3、準＝1、無＝0**くらいで頭に置いてください。」\n\n次は、保険契約を結ぶときにかなり重要なルールです。\n\n**『自分の健康状態などを、保険会社にちゃんと伝えないとどうなるの？』**\n\nという話ですね。\n\n次は **⑮「告知義務」** です。\n\n---", "chapter": 2}, {"n": 15, "title": "告知義務（こくちぎむ）", "raw": "# 第2章 リスク管理⑮\n\n## 告知義務（こくちぎむ）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。次は**告知義務**です。」\n\n「これ、単純に『自分のことを全部しゃべらないといけない』ではありません。そこから間違えないでくださいね。」\n\n一言でいうと、\n\n> **保険契約を結ぶ際、保険会社から告知を求められた重要な事項について、事実を正しく告知する義務。**\n\nたとえば生命保険なら、\n\n**現在の健康状態\n過去の傷病歴\n職業**\nなどについて質問されることがあります。\n\nそこで、\n\n「これ言ったら保険に入れないかも……」\n\nと思って事実と違うことを答える。\n\nこれは問題になります。\n\n「そして先輩、ここ重要ですよ。」\n\n現在の保険法では基本的に、\n\n> **保険会社から質問された事項について答える「質問応答義務」**\n\nという考え方です。\n\n「何でも自分から探して申告する、という意味ではありません。」\n\n---\n\n# B【詳しい解説｜なぜ告知義務が必要なの？】\n\n「まず、なぜ健康状態を伝えないといけないのか考えてみましょう。」\n\nAさん  \n→ 健康状態に特に問題なし\n\nBさん  \n→ 重い病気で治療中\n\nこの2人では、保険会社から見たリスクが違う可能性がありますよね。\n\nところがBさんが病気を隠して、\n\n「健康です」\n\nと答えて同じ条件で契約できてしまったら？\n\n……\n\n「そうです。」\n\n保険加入者間の**公平性**が崩れてしまいます。\n\nだから保険会社は契約を引き受ける際、\n\n「この人をどのような条件で引き受けるのか」\n\nを判断するため、重要事項について質問します。\n\n契約者・被保険者側には、それに対して正しく答える義務がある。\n\nそれが、\n\n## **告知義務**\n\nです。\n\n---\n\n## 「聞かれていないことまで全部言うの？」\n\n「先輩、ここは昔の知識と混ざりやすいので注意してください。」\n\n現在の保険法では、告知義務は基本的に**質問応答義務**です。\n\nつまり、\n\n保険会社が重要事項について質問する\n↓\n契約者・被保険者が答える\n↓\n**質問されたことについて事実を正しく告知する**\n\nという形です。\n\nですから、\n\n> **自分が重要だと思ったことを何から何まで自発的に申告する義務**\n\nという理解ではありません。\n\n「“聞かれた重要事項に正しく答える”。まずこれで覚えてください。」\n\n---\n\n# 告知義務違反をするとどうなる？\n\n「ここからが試験で重要です。」\n\nたとえば、\n\n保険会社  \n「過去○年以内に、このような病気で診察・治療を受けましたか？」\n\n本人  \n「受けていません」\n\nでも実際には治療を受けていた。\n\nしかも、それを知っていて隠した。\n\nこのように、重要な事項について、\n\n**故意**\nまたは\n**重大な過失**\n\nによって事実を告げなかったり、事実と違うことを告げたりした場合、\n\n一定の要件のもとで保険会社は、\n\n> **契約を解除できる**\n\nことがあります。\n\n---\n\n## 「じゃあ、うっかり一つ間違えただけで即解除？」\n\n「ちょっと待ってください。そこまで単純じゃありません。」\n\n告知義務違反による解除には要件があります。\n\n特に覚えておきたいのは、\n\n> **故意または重大な過失**\n\nです。\n\n単なる些細な勘違いまで全部同じ扱い、と覚えないでください。\n\n---\n\n# 「解除されたら保険金は絶対にもらえない？」\n\n「ここも危ないところです。」\n\n先輩、\n\n**告知義務違反**\n↓\n**契約解除**\n↓\n**何があっても保険金ゼロ**\n\nだと思いませんでした？\n\n「そうとは限りません。」\n\n告知義務違反となった事実と、実際に起きた保険事故との間に関係がない場合などには、保険金が支払われることがあります。\n\nたとえば単純化すると、\n\nある病気について告知義務違反\n↓\nその病気とは関係のない事故で死亡\n\nというようなケースです。\n\n「ですから、試験では」\n\n> **告知義務違反＝必ず保険金不払い**\n\nと決めつけないこと。\n\nここは大事です。\n\n---\n\n# さらに重要｜保険募集人に告知すればいい？\n\n「先輩、これも引っかけになりやすいです。」\n\n生命保険の営業担当者などの**保険募集人には、一般に告知を受ける権限（告知受領権）がありません。**\n\nですから、\n\n「営業担当者に口頭で言ったから告知したことになる」\n\nとは限りません。\n\n告知書や保険会社が指定した方法などで、適切に告知する必要があります。\n\n「誰に、どう伝えるかまで大事なんです。」\n\n---\n\n# C【イメージ理解｜健康診断の問診票で考えましょう】\n\n「先輩、病院の問診票を想像してください。」\n\n病院から、\n\n「現在服用している薬はありますか？」\n\nと質問された。\n\n実際には薬を飲んでいるのに、\n\n**「なし」**\n\nと書いた。\n\n「これ、病院側は正しい判断ができませんよね。」\n\n保険も似ています。\n\n保険会社：\n\n「この病気について治療を受けましたか？」\n\n↓\n\n契約者：\n\n**正しく答える**\n\n↓\n\n保険会社：\n\n「では、この条件で契約を引き受けます」\n\nとなります。\n\nところが、\n\n質問\n↓\n事実を隠す\n↓\n保険会社が誤った情報で判断\n↓\n契約者間の公平性が崩れる\n\nとなってしまう。\n\n「だから告知義務が必要なんです。」\n\n---\n\n# D【具体例｜ケースで判断しましょう】\n\n「では先輩、Aさんに登場してもらいます。」\n\nAさんは生命保険に申し込みました。\n\n告知書には、\n\n> 「過去○年以内に所定の病気で治療を受けたことがありますか？」\n\nという質問があったとします。\n\n実際には治療歴がある。\n\nでもAさんは、\n\n「書いたら契約できないかもしれない」\n\nと思って、\n\n**「いいえ」**\n\nと記入した。\n\n---\n\n「先輩、これは？」\n\n……\n\n重要事項について、知っていながら事実と違う告知をしています。\n\nしたがって、要件を満たせば、\n\n**告知義務違反を理由として契約を解除される可能性**\n\nがあります。\n\n---\n\n### では別パターン。\n\n保険会社から質問されていない全く別の事項について、\n\nAさんが自分から説明しなかった。\n\n「質問されてないけど、言わなかった！告知義務違反！」\n\n……\n\n「先輩、早いです。」\n\n現在の保険法では基本的に**質問応答義務**です。\n\nですから、\n\n**質問された重要事項に正しく答えたか**\n\nを見るのが基本です。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n### Q1\n\n告知義務とは？\n\n……\n\n**保険会社から告知を求められた重要事項について、事実を正しく告知する義務。**\n\n「はい。」\n\n### Q2\n\n現在の保険法では基本的に何義務？\n\n……\n\n## **質問応答義務**\n\n「ここ、覚えてください。」\n\n### Q3\n\n告知義務違反なら、必ず保険金が一切支払われない？\n\n……\n\n**必ずとは限りません。**\n\n告知義務違反となった事実と保険事故との関係などによって、支払われる場合があります。\n\n「そうです。“違反＝何でもゼロ”で覚えないこと。」\n\n---\n\n# 【30秒復習】\n\n① **何の話？**  \n→ 告知義務\n\n② **何をする？**  \n→ 質問された重要事項に正しく答える\n\n③ **現在の基本的な考え方は？**  \n→ **質問応答義務**\n\n④ **故意・重大な過失による違反は？**  \n→ 一定の要件で契約を解除されることがある\n\n⑤ **違反したら絶対に保険金ゼロ？**  \n→ **そうとは限らない**\n\n⑥ **保険募集人に口頭で伝えれば十分？**  \n→ 一般に募集人には告知受領権がないので注意\n\n# 【一文で覚える】\n\n> **「告知義務＝保険会社から質問された重要事項に、事実を正しく答える義務。」**\n\n「はい。先輩、ここは単なる“正直に申告する制度”ではなく、**保険会社が正しくリスクを判断して契約者間の公平性を保つための仕組み**まで分かっていれば強いですよ。」\n\n次は **⑯「責任開始日」** です。\n\n---", "chapter": 2}, {"n": 16, "title": "責任開始日（せきにんかいしび）", "raw": "# 第2章 リスク管理⑯\n\n## 責任開始日（せきにんかいしび）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**責任開始日**です。」\n\n「“契約書を書いた日から保障開始でしょ？”って思ってません？」\n\n……そこ、注意です。\n\n一言でいうと、\n\n> **責任開始日＝保険会社の保障責任が始まる日。**\n\n生命保険では一般に、\n\n**① 申込み**  \n**② 告知（または診査）**  \n**③ 第1回保険料相当額の払込み**\n\nという3つがポイントになります。\n\n一般的な考え方では、この3つがそろった時点から保障が開始されます。\n\n「つまり、3つをバラバラに覚えるより――」\n\n> **申込み・告知・第1回保険料**\n\nこの3点セットで覚えましょう。\n\n※実際の責任開始時期は、保険商品や払込方法などによって異なる場合があります。\n\n---\n\n# B【詳しい解説｜なぜ申込日＝保障開始日じゃないの？】\n\n「先輩、たとえば今日、生命保険の申込書を出したとします。」\n\nその瞬間に、\n\n「よし！もう1,000万円保障されてる！」\n\n……とは限りません。\n\n保険会社からすると、\n\n**どんな契約を申し込んだのか**\n\nだけでなく、\n\n**健康状態などはどうなのか**\n\n**第1回保険料に関する手続きは済んでいるか**\n\nなども必要ですよね。\n\nそこで一般的な生命保険では、\n\n申込み\n↓\n告知・診査\n↓\n第1回保険料相当額の払込み\n↓\n必要な手続きがそろう\n↓\n**保障責任が開始**\n\nと考えます。\n\n「そして、その保障責任が始まった日が**責任開始日**です。」\n\n---\n\n## 「でも保険会社が承諾するのは後じゃないの？」\n\n「あ、そこです。いいところに気づきましたね。」\n\nたとえば、\n\n10月1日：申込み＋告知  \n10月3日：第1回保険料相当額を払い込む  \n10月10日：保険会社が承諾\n\nだったとしましょう。\n\n「承諾した10月10日から保障開始？」\n\n……\n\n一般的な生命保険では、保険会社が後から契約を承諾した場合、必要な条件を満たした**責任開始時点までさかのぼって保障される仕組み**があります。\n\nこの例なら、条件を満たす前提で、\n\n### 10月3日\n\nが責任開始日となるイメージです。\n\n「なので、**承諾日＝必ず責任開始日**でもないんです。」\n\n---\n\n## じゃあ「契約日」と「責任開始日」は同じ？\n\n「先輩、ここも分けてください。」\n\n### 責任開始日\n\n→ **保障が始まる日**\n\n### 契約日\n\n→ 保険期間や保険料計算などの基準として契約上定められる日\n\n商品によっては同じになることもありますが、**必ず同じとは限りません。**\n\n「試験ではまず、」\n\n> **責任開始＝保障開始**\n\nこれを中心に覚えてください。\n\n---\n\n## 前回の「告知義務」とつなげると？\n\n「ちゃんと前回とつながっていますよ。」\n\n保険に申し込む\n↓\n健康状態などを告知する\n↓\n保険会社が引受判断をする\n↓\n必要な条件がそろう\n↓\n責任開始\n\nです。\n\n「だから告知義務をやった直後に責任開始を覚えると、流れとして理解しやすいんです。」\n\n---\n\n# C【イメージ理解｜スマホの通信契約で考えましょう】\n\n「先輩、新しいスマホの通信契約を申し込んだとします。」\n\n申込書を書いた。\n\nでも、まだ通信できない。\n\n「申込書を書いたんだからYouTube見せて！」\n\nと言っても、\n\n「まだ回線開通してません」\n\nとなりますよね。\n\nそして手続きが完了して、\n\n📶 **回線開通！**\n\nとなった瞬間から通信サービスを使える。\n\n保険でいう、\n\n### 「保障の回線開通」\n\nが、\n\n**責任開始**\n\nのイメージです。\n\n「申込みをした日ではなく、**保障が実際にスタートする時点はいつか**を見るんですよ。」\n\n---\n\n# D【具体例｜日付で確認しましょう】\n\n「先輩、日付問題にします。」\n\nある生命保険について、説明を単純化して、\n\n**10月1日**\n→ 申込み\n\n**10月3日**\n→ 告知\n\n**10月5日**\n→ 第1回保険料相当額の払込み\n\n**10月12日**\n→ 保険会社が承諾\n\nだったとします。\n\nさて、一般的な仕組みを前提にした場合、責任開始はどこでしょう？\n\n……\n\n「10月12日？」\n\n……もう、承諾日に引っ張られましたね。\n\nこの例では、\n\n申込み ✓\n\n告知 ✓\n\n第1回保険料相当額 ✓\n\n3つが最後にそろったのが、\n\n### **10月5日**\n\nです。\n\nしたがって、保険会社が後日承諾した場合、**10月5日の責任開始時点までさかのぼって保障される**というイメージです。\n\n---\n\n## じゃあ10月4日に事故が起きたら？\n\n「ここ、考えてください。」\n\n10月4日時点では、\n\n申込み ✓  \n告知 ✓  \n第1回保険料相当額 ✕\n\nですよね。\n\nこの単純化した例では、まだ必要な条件がそろっていません。\n\nつまり、\n\n**責任開始前**\n\nということになります。\n\n「日付問題では、“何日に申し込んだ？”だけ見ないでください。」\n\n> **必要な手続きがいつ全部そろった？**\n\nを見るんです。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n責任開始日とは？\n\n……\n\n**保険会社の保障責任が始まる日。**\n\n「はい。これが基本です。」\n\n### Q2\n\n一般的な生命保険で覚える3つのポイントは？\n\n……\n\n**申込み・告知（または診査）・第1回保険料相当額の払込み。**\n\n「そうです。」\n\n### Q3\n\n責任開始日と保険会社の承諾日は必ず同じ？\n\n……\n\n**必ずしも同じではありません。**\n\n保険会社が後日承諾した場合、所定の責任開始時点までさかのぼって保障される仕組みがあります。\n\n---\n\n# 【30秒復習】\n\n① **責任開始日とは？**  \n→ 保障が始まる日\n\n② **まず覚える3つは？**  \n→ **申込み・告知・第1回保険料**\n\n③ **申込書を書くだけで保障開始？**  \n→ 原則、それだけではない\n\n④ **承諾日＝責任開始日？**  \n→ 必ずしも同じではない\n\n⑤ **日付問題では何を見る？**  \n→ 必要な手続きがそろった時点\n\n⑥ **注意点は？**  \n→ 商品・払込方法などによって責任開始の取扱いが異なることがある\n\n# 【一文で覚える】\n\n> **「責任開始日＝保険会社の保障がスタートする日。申込み・告知・第1回保険料の3つをまず確認。」**\n\n「はい。ここは**“申し込んだ日”ではなく、“保障が始まった日”**という意味を最優先で覚えてください。」\n\n次は **⑰「保険料の払込猶予」** です。\n\n---", "chapter": 2}, {"n": 17, "title": "保険料の払込猶予（はらいこみゆうよ）", "raw": "# 第2章 リスク管理⑰\n\n## 保険料の払込猶予（はらいこみゆうよ）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**保険料の払込猶予**です。」\n\n「保険料を支払期限までに払えなかった！ 即、保険終了！」\n\n……ではありません。\n\n一言でいうと、\n\n> **保険料の払込期月を過ぎても、一定期間は支払いを待ってもらえる仕組み。**\n\nこの「待ってもらえる期間」が、\n\n## **払込猶予期間**\n\nです。\n\nまず流れを覚えてください。\n\n**払込期月**\n↓\n払えなかった\n↓\n**猶予期間**\n↓\nその間に払えば契約継続\n↓\n払わないまま猶予期間終了\n↓\n**原則として失効**\n\n「ただし、解約返戻金がある契約などで
