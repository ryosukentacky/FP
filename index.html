託者賠償責任保険\n\n### A【要点｜「施設が原因」か「預かった物が原因」か】\n\n「はい、先輩。今回は名前が長いですが、原因を見ればかなり簡単です。」\n\n> 🏢 **施設所有者賠償責任保険**  \n> → 所有・使用・管理する**施設の不備や、施設で行う業務**などによって他人に損害を与え、法律上の賠償責任を負った場合\n\n> 📦 **受託者賠償責任保険**  \n> → 他人から**預かった物（受託物）**を、管理中に壊したり紛失したりして、法律上の賠償責任を負った場合\n\n「つまり、」\n\n### 🏢 施設 → 施設所有者賠償\n\n### 📦 預かり物 → 受託者賠償\n\nまずこれで大丈夫です。\n\n---\n\n# B【詳しい解説①｜施設所有者賠償責任保険】\n\n「たとえば先輩が飲食店を経営しているとします。」\n\n店の床が濡れていた。\n\n💧💧\n\nところが十分な対応をしていなかった。\n\n↓\n\nお客さんが、\n\n🚶💥\n\n滑って転倒。\n\n↓\n\n🦴骨折。\n\n店側に法律上の損害賠償責任が発生しました。\n\nこのような、\n\n> **施設の所有・使用・管理や、その施設で行う業務に起因する事故によって第三者に損害を与えた場合**\n\nに備えるのが、\n\n# **施設所有者賠償責任保険**\n\nです。\n\n---\n\n# ② 「施設」って建物だけ？\n\n「先輩、“ビルそのものが壊れた場合の保険？”と思わないでくださいね。」\n\nこれは、\n\n### 建物そのものを修理する保険\n\nではありません。\n\nポイントは、\n\n> **施設などが原因で第三者に損害を与え、賠償責任を負った**\n\nことです。\n\n---\n\nたとえば、\n\n店舗の看板が落下。\n\n🏪\n↓\n🪧💥\n↓\n🚶\n\n通行人がケガ。\n\n店側に法律上の賠償責任。\n\n→ **施設所有者賠償責任保険**\n\nが対象になり得ます。\n\n---\n\n「つまり、」\n\n### 自分の建物が壊れた\n\n→ 火災保険などの問題\n\n### 自分の施設が原因で他人に損害\n\n→ **施設所有者賠償責任保険**\n\nです。\n\n---\n\n# ③ 施設内なら何でも対象？\n\n「ここは少し注意です。」\n\n事故が、\n\n### 施設の所有・使用・管理\n\n### 施設で行われる業務\n\nなどに起因していることがポイントです。\n\n単に、\n\n「自分の店の中で事故が起きた！」\n\nだけで自動的に施設所有者賠償になるわけではありません。\n\nそして基本となるのは、これまでと同じ、\n\n### **法律上の損害賠償責任**\n\nです。\n\n---\n\n# ④ 受託者賠償責任保険\n\n「次は“受託”です。難しい言葉ですが、意味は単純ですよ。」\n\n### 受託\n\n＝ **他人から預かること**\n\nです。\n\nたとえばクリーニング店。\n\n👤お客さん\n↓\n👔\n↓\n🏪クリーニング店\n\n店は、\n\n### お客さんの服\n\nを預かっています。\n\nこれが、\n\n### **受託物**\n\nです。\n\n---\n\nところが管理中に、\n\n🔥火災\n\nなどが発生し、\n\n預かっていた服を損傷。\n\n↓\n\n店側に法律上の賠償責任。\n\nこのような場合に備えるのが、\n\n# **受託者賠償責任保険**\n\nです。\n\n---\n\n# ⑤ なぜ普通の賠償責任保険ではダメなの？\n\n「先輩、ここが今回かなり大事です。」\n\n普通に考えると、\n\n> 「他人の物を壊したんだから、普通の賠償責任保険でいいのでは？」\n\nと思いますよね。\n\nでも、\n\n### 他人から預かって管理している物\n\nは、一般的な賠償責任保険では補償対象外になることがあります。\n\nなぜか。\n\n……\n\n預かった物は、\n\n### 自分の管理下にある特殊なリスク\n\nだからです。\n\nそこで、そのリスクを専門的にカバーする、\n\n### **受託者賠償責任保険**\n\nがあるわけです。\n\n---\n\n# ⑥ 典型例はクリーニング店\n\n「FPではこれが一番覚えやすいです。」\n\nお客さん\n↓\n👔スーツを預ける\n↓\nクリーニング店\n↓\n管理中に事故\n↓\n👔💥\n↓\nスーツ損傷\n\n店に賠償責任。\n\n### → 受託者賠償責任保険\n\n「“預かった物”を見た瞬間に**受託者**を出してください。」\n\n---\n\n# ⑦ ホテルのクロークなら？\n\n先輩がホテルを経営。\n\nお客さんから、\n\n🧥コート\n\nをクロークで預かった。\n\n↓\n\n管理中に誤って損傷。\n\n↓\n\nホテル側に法律上の賠償責任。\n\nこれも契約内容に応じて、\n\n### **受託者賠償責任保険**\n\nの領域です。\n\n「クリーニング店だけの保険じゃありませんよ。」\n\n---\n\n# ⑧ PL保険との違い\n\n「前回のPL保険と並べると、かなり整理できます。」\n\n### 🏭 PL保険\n\n自分が作った・販売した製品など\n↓\n相手に渡る\n↓\nその製品などが原因で事故\n↓\n他人に損害\n\n---\n\n### 📦 受託者賠償責任保険\n\n他人の物\n↓\n\n### 自分が預かる\n\n↓\n管理中に損傷など\n↓\n持ち主に損害\n\n「矢印が逆なんですよ。」\n\n### PL\n\n**自分 → 相手**\n\n### 受託者\n\n**相手 → 自分**\n\nこれ、かなり覚えやすいです。\n\n---\n\n# ⑨ 施設所有者とPLの違い\n\n「こっちも比較しましょう。」\n\nレストランで、\n\n### 床が濡れていて客が転倒\n\n→ **施設所有者賠償**\n\n一方、\n\n店で提供した食品が原因で食中毒\n→ **PL保険などの領域**\n\nです。\n\n---\n\nつまり原因を見ると、\n\n### 🏢 施設・業務\n\n→ 施設所有者賠償\n\n### 🍱 提供した製品・飲食物など\n\n→ PL\n\n### 📦 預かった物\n\n→ 受託者賠償\n\nです。\n\n---\n\n# C【イメージ理解｜矢印で3つを区別】\n\n「先輩、賠償責任保険は矢印で覚えると強いですよ。」\n\n## 🏢施設所有者賠償\n\n自分の施設\n🏢\n↓\n💥\n↓\n👤他人\n\n**施設 → 他人**\n\n---\n\n## 🏭PL保険\n\n自分の商品\n📦\n↓\n相手へ販売\n↓\n💥\n↓\n👤他人\n\n**商品 → 他人**\n\n---\n\n## 📦受託者賠償\n\n👤他人\n↓\n📦「これ預かって」\n↓\n🏢自分\n↓\n💥\n↓\n預かった物が損傷\n\n**他人の物 → 自分が預かる**\n\n「この3本の矢印を作れば、名前の丸暗記はほとんど要りません。」\n\n---\n\n# D【具体例｜ホテルで3つの事故】\n\n「同じホテルで全部起こしてみましょう。」\n\n### ケース①\n\nホテルの階段の管理に問題\n↓\n宿泊客が転倒\n↓\n骨折\n\n### → **施設所有者賠償責任保険**\n\n施設の管理が原因ですね。\n\n---\n\n### ケース②\n\nホテルのレストランで提供した料理が原因で食中毒\n↓\n宿泊客が入院\n\n### → **PL保険などの領域**\n\n提供した飲食物が原因です。\n\n---\n\n### ケース③\n\nホテルのクロークで客の高価なコートを預かる\n↓\n管理中の事故で損傷\n\n### → **受託者賠償責任保険**\n\n預かった物の損害です。\n\n---\n\n「全部ホテルで起きています。」\n\nでも、\n\n### どこで起きた？\n\nだけを見るのではなく、\n\n### **何が原因だった？**\n\nを見るんですよ。\n\n---\n\n# 【賠償責任保険を4つ整理】\n\n|原因|主な保険|\n|-|-|\n|👤 個人の日常生活|**個人賠償責任保険**|\n|🏭 製造・販売した製品など|**生産物賠償責任保険（PL）**|\n|🏢 施設の所有・使用・管理や業務|**施設所有者賠償責任保険**|\n|📦 預かった他人の物|**受託者賠償責任保険**|\n\n「先輩、この表はそのまま覚える価値があります。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\nスーパーの看板が管理上の問題で落下し、通行人がケガ。\n\n……\n\n### **施設所有者賠償責任保険。**\n\n施設の管理などに起因する事故だからです。\n\n---\n\n### Q2\n\nクリーニング店が預かった客の服を管理中の事故で損傷。\n\n……\n\n### **受託者賠償責任保険。**\n\n---\n\n### Q3\n\nメーカーが販売した製品の欠陥によって消費者がケガ。\n\n……\n\n### **生産物賠償責任保険（PL保険）。**\n\n「施設・製品・預かり物、ちゃんと分けられましたね。」\n\n---\n\n# 【30秒復習】\n\n① **施設が原因**  \n→ 施設所有者賠償\n\n② **施設自体を修理する保険？**  \n→ ❌違う\n\n③ **受託とは？**  \n→ 他人の物を預かる\n\n④ **預かった物を損傷**  \n→ 受託者賠償\n\n⑤ **販売した製品が原因**  \n→ PL保険\n\n⑥ **共通する土台**  \n→ 法律上の損害賠償責任\n\n# 【一文で覚える】\n\n> **「施設所有者賠償責任保険は施設の所有・使用・管理や業務に起因して第三者に損害を与えた場合、受託者賠償責任保険は預かった他人の物を管理中に損傷・紛失するなどして賠償責任を負った場合に備える保険。」**\n\n「はい、先輩。賠償責任保険はもう名前ではなく**原因**で判定してください。」\n\n### 👤 日常生活 → 個人賠償\n\n### 🏭 売った製品 → PL\n\n### 🏢 施設 → 施設所有者\n\n### 📦 預かった物 → 受託者\n\nこの4本に分ければ、かなり見通しがよくなります。\n\n---", "chapter": 2}, {"n": 80, "title": "労働災害総合保険と企業費用・利益保険", "raw": "# 第2章 リスク管理 80\n\n## 労働災害総合保険と企業費用・利益保険\n\n### A【要点｜「従業員の労災」か「会社の利益減少・費用増加」か】\n\n「はい、先輩。今回はどちらも**企業向けの損害保険**ですが、守っているものが全然違います。」\n\n> 👷 **労働災害総合保険**  \n> → 従業員が業務上の事故などで被災したとき、**政府の労災保険だけでは足りない企業側の負担**などに備える。\n\n> 🏭💰 **企業費用・利益保険**  \n> → 火災などで会社が営業できなくなり、**利益が減ったり、営業継続・早期復旧のための費用が増えたりする損失**に備える。\n\nつまり、\n\n### 👷 人・労災\n\n→ **労働災害総合保険**\n\n### 💰 会社の営業・利益\n\n→ **企業費用・利益保険**\n\nです。\n\n---\n\n# B【詳しい解説①｜労働災害総合保険】\n\n「まず、先輩が会社を経営しているとしましょう。」\n\n工場で従業員が作業中、\n\n👷\n↓\n機械事故\n↓\n🏥大ケガ\n\nしました。\n\nまず重要なのは、\n\n### **政府の労災保険**\n\nです。\n\n業務上の災害などについて、国の労災保険から一定の給付が行われます。\n\n---\n\n## では、民間保険は何のため？\n\n「先輩、ここでこう思いますよね。」\n\n> 「国の労災があるなら、会社が民間の保険に入る必要なくない？」\n\n……\n\n「そこです。」\n\n政府の労災保険とは別に、企業には、\n\n### 法定給付を超える補償を従業員に行う\n\nあるいは、\n\n### 事故について企業が法律上の損害賠償責任を負う\n\nといった負担が生じることがあります。\n\nそこで企業が民間の保険で上乗せして備えるのが、\n\n# **労働災害総合保険**\n\nです。\n\n---\n\n# ② 2つに分けて考える\n\n「労働災害総合保険は、FPでは大きく2本立てで理解すると分かりやすいです。」\n\n### ① 法定外補償保険\n\n企業が就業規則などに基づいて、\n\n> **政府労災の給付とは別に従業員へ行う法定外の補償**\n\nに備えます。\n\n---\n\n### ② 使用者賠償責任保険\n\n労災事故について、\n\n> **企業（使用者）が従業員などに対して法律上の損害賠償責任を負う場合**\n\nに備えます。\n\n「つまり、」\n\n**会社独自の上乗せ補償**\n→ 法定外補償\n\n**会社の法律上の賠償責任**\n→ 使用者賠償責任\n\nです。\n\n---\n\n# ③ 労災事故＝会社が必ず賠償責任？\n\n「ちょっと待ってください。ここは分けましょう。」\n\n従業員が業務中にケガした。\n\nだから、\n\n### 労災保険の対象\n\n＝\n\n### 会社が必ず損害賠償責任を負う\n\nではありません。\n\n政府の労災保険による給付と、\n\n### 企業の民事上の損害賠償責任\n\nは別の問題です。\n\nたとえば会社に安全配慮義務違反などがあり、法律上の賠償責任が認められる場合に、\n\n### 使用者賠償責任\n\nが問題になります。\n\n「**労災＝即、会社が悪い**ではない。この区別は大事ですよ。」\n\n---\n\n# ④ 企業費用・利益保険\n\n「次はガラッと変わります。」\n\n先輩の会社の工場で、\n\n🔥火災発生。\n\n建物・機械が損傷しました。\n\n火災保険で、\n\n### 建物\n\n### 機械\n\nなどの物的損害を補償できたとしましょう。\n\n「じゃあ全部解決？」\n\n……\n\n### いいえ。\n\n工場が、\n\n1か月操業停止。\n\nすると、\n\n### 商品を作れない\n\n↓\n\n### 売上が減る\n\n↓\n\n### 利益が減る\n\nでも、\n\n### 人件費\n\n### 家賃などの固定費\n\nは発生し続けることがあります。\n\n「建物を直すだけでは、会社の損失は終わらないんです。」\n\n---\n\n# ⑤ そこで企業費用・利益保険\n\n火災などの対象事故\n↓\n🏭設備損傷\n↓\n操業停止\n↓\n📉利益減少\n\nさらに、\n\n早く営業を再開するため、\n\n### 仮店舗を借りる\n\n### 代替設備を使う\n\n### 外注する\n\nなど、\n\n### 💰追加費用\n\nが発生することがあります。\n\nこのような、\n\n> **営業休止などによる利益損失や、営業継続・早期復旧のための費用**\n\nに備えるのが、\n\n# **企業費用・利益保険**\n\nです。\n\n---\n\n# ⑥ 火災保険との違い\n\n「先輩、ここはかなり試験向きです。」\n\n工場火災で考えます。\n\n### 🏭建物が焼けた\n\n→ **火災保険など**\n\n### ⚙️機械が焼けた\n\n→ **火災保険など**\n\nでも、\n\n### 📉工場停止で利益が減った\n\n→ **企業費用・利益保険**\n\n### 💰代替施設などの追加費用\n\n→ **企業費用・利益保険**\n\nです。\n\n---\n\nつまり、\n\n> **火災保険＝物そのものの損害**\n\nに対し、\n\n> **企業費用・利益保険＝事故の結果として生じた営業上の経済的損失**\n\nを見るイメージです。\n\n---\n\n# C【イメージ理解｜工場火災の「その後」を見る】\n\n「先輩、工場が燃えた場面を止めずに、その後まで映像を進めてください。」\n\n🔥🔥🔥\n↓\n🏭工場が損傷\n\nここで止めれば、\n\n### 火災保険\n\nです。\n\nでも映像を続けると……\n\n🏭操業停止\n↓\n📦商品を作れない\n↓\n💰売上減少\n↓\n📉利益減少\n＋\n🏢仮施設を借りる\n↓\n💸追加費用\n\nここをカバーするのが、\n\n### **企業費用・利益保険**\n\nです。\n\n「つまり、**燃えた物を見るのか、燃えた後の商売を見るのか**。これで分けましょう。」\n\n---\n\n一方、\n\n👷従業員\n↓\n💥業務災害\n↓\n🏥負傷\n↓\n企業の上乗せ補償・賠償責任\n\nなら、\n\n### **労働災害総合保険**\n\nです。\n\n---\n\n# D【具体例｜工場事故で両方登場】\n\n「一つの事故で両方を出してみます。」\n\n先輩の会社で火災。\n\n🔥🏭\n\n火災によって従業員Aさんが負傷しました。\n\nさらに工場が、\n\n### 2か月操業停止。\n\n---\n\n## 従業員Aさんについて\n\n政府労災\n↓\n一定の給付\n\nさらに会社が法定外補償を行う。\n\nまたは会社に法律上の賠償責任が発生。\n\n### → 労働災害総合保険\n\n---\n\n## 会社の営業について\n\n通常なら2か月で、\n\n### 2,000万円\n\nの利益を得られたところ、\n\n操業停止によって利益が大幅に減少。\n\nさらに、\n\n仮工場などに、\n\n### 500万円\n\nの追加費用。\n\n### → 企業費用・利益保険\n\nが問題になります。\n\n「同じ火災でも、**何の損失を見ているか**で保険が変わるんですよ。」\n\n---\n\n# 【ここまでの企業向け保険を整理】\n\n|損害・原因|主な保険|\n|-|-|\n|製品などが原因で第三者に損害|**PL保険**|\n|施設の管理などで第三者に損害|**施設所有者賠償責任保険**|\n|預かった物を損傷|**受託者賠償責任保険**|\n|従業員の労災に伴う企業負担|**労働災害総合保険**|\n|事故による利益減少・追加費用|**企業費用・利益保険**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n工場で従業員が業務中に負傷し、会社が法定外補償を行った。\n\n……\n\n### **労働災害総合保険。**\n\n---\n\n### Q2\n\n火災で工場が1か月停止し、その間の利益が減少した。\n\n……\n\n### **企業費用・利益保険。**\n\n建物そのものではなく、営業停止による経済的損失を見ています。\n\n---\n\n### Q3\n\n工場火災で建物そのものが損傷した。\n\n企業費用・利益保険が建物の修理をするための保険？\n\n……\n\n### **❌基本的な役割が違います。**\n\n建物などの物的損害は火災保険など。\n\n企業費用・利益保険は、\n\n### **事故に伴う利益減少や追加費用**\n\nに備えるものです。\n\n---\n\n# 【30秒復習】\n\n① **労働災害総合保険**  \n→ 従業員の労災に伴う企業負担\n\n② **政府労災との関係**  \n→ 民間保険で上乗せ部分などに備える\n\n③ **法定外補償**  \n→ 会社独自の上乗せ補償\n\n④ **使用者賠償責任**  \n→ 会社の法律上の賠償責任\n\n⑤ **企業費用・利益保険**  \n→ 営業停止による利益減少・追加費用\n\n⑥ **火災保険との違い**  \n→ 物ではなく**事故後の商売上の損失**を見る\n\n# 【一文で覚える】\n\n> **「労働災害総合保険は従業員の労働災害に伴う企業の法定外補償や使用者賠償責任に備え、企業費用・利益保険は火災などによる営業休止で生じる利益減少や営業継続・早期復旧のための追加費用に備える。」**\n\n「先輩、最後はこの2本で十分です。」\n\n### 👷 従業員が被災\n\n→ **労働災害総合保険**\n\n### 🏭💤 会社が止まって利益が減る\n\n→ **企業費用・利益保険**\n\n**人を見るか、止まった商売を見るか。**\n\nここで切れば、名前が長くても迷いません。\n\n---", "chapter": 2}, {"n": 81, "title": "損害保険と税金", "raw": "# 第2章 リスク管理 81\n\n## 損害保険と税金\n\n### A【要点｜「保険料」と「保険金」を分けて考える】\n\n「はい、先輩。今回は範囲が広いので、最初に地図を作ります。損害保険と税金は、全部まとめて覚えようとすると混乱します。」\n\n見る場所は大きく2つです。\n\n> **① 払った保険料は、税金上どうなる？**  \n> **② 受け取った保険金には、税金がかかる？**\n\nそして誰の話かも分けます。\n\n### 👤 個人\n\n→ 所得税など\n\n### 🏢 法人・事業者\n\n→ 必要経費・損金など\n\n「つまり、**払うとき／もらうとき × 個人／事業**。この4マスで整理しましょう。」\n\n---\n\n# B【詳しい解説①｜個人が払った損害保険料】\n\n「まず先輩が自分のために火災保険や自動車保険へ加入したとします。」\n\n保険料を、\n\n### 年間5万円\n\n払った。\n\n「これ、生命保険みたいに所得控除できますか？」\n\n……\n\n### 原則として、現在は一般の「損害保険料控除」はありません。\n\n昔は損害保険料控除がありましたが、現在は廃止されています。\n\n「だから、」\n\n### 火災保険に入った\n\n→ 自動的に所得控除\n\n### 自動車保険に入った\n\n→ 自動的に所得控除\n\nではありません。\n\n---\n\n# ② ただし「地震保険料控除」がある\n\n「ここで終わったら試験で落とされますよ、先輩。」\n\n損害保険料控除は廃止されていますが、\n\n# **地震保険料控除**\n\nがあります。\n\n一定の地震保険契約について支払った保険料は、所得税で、\n\n### **最高5万円**\n\nまで所得控除の対象になります。\n\n「前に地震保険でやりましたね。」\n\n---\n\n### たとえば\n\n年間の対象地震保険料\n\n### 40,000円\n\n→ 所得税の地震保険料控除\n\n### 40,000円\n\n年間\n\n### 60,000円\n\nなら？\n\n……\n\n上限があるので、\n\n### **50,000円**\n\nです。\n\n「“5万円もらえる”じゃありませんよ。」\n\n### 課税所得から控除できる上限\n\nが5万円です。\n\n---\n\n# ③ 火災保険料部分まで控除される？\n\n「ここも勘違いしやすいです。」\n\n火災保険に、\n\n### 地震保険\n\nを付帯していたとします。\n\n支払った保険料が、\n\n火災保険部分\n＋\n地震保険部分\n\nに分かれている。\n\n地震保険料控除の対象になるのは、\n\n### **対象となる地震保険料部分**\n\nです。\n\n「火災保険料全部が地震保険料控除になるわけではありません。」\n\n---\n\n# ④ 個人が損害保険金を受け取った場合\n\n「では今度は“もらう側”です。」\n\n先輩の自宅が火災で損害を受けた。\n\n🔥🏠\n\n火災保険から、\n\n### 1,000万円\n\nの保険金を受け取った。\n\n「1,000万円も受け取ったなら所得税が……」\n\n……\n\n### 原則として、個人が受け取る損害保険金のうち、損害を補填する性質のものは非課税です。\n\nなぜでしょう？\n\nここ、考えてみてください。\n\n……\n\nそうです。\n\n### **儲かったわけではなく、損害を埋めてもらったから。**\n\n---\n\nたとえば、\n\n🔥火災で1,000万円の損害\n↓\n💰保険金1,000万円\n\nこれは、\n\n0\n↓\n＋1,000万円\n\nと財産が増えたのではありません。\n\n実際には、\n\n財産\n▲1,000万円\n↓\n保険金\n＋1,000万円\n\nです。\n\n「損害の穴を埋めただけ。だから原則非課税、というイメージです。」\n\n---\n\n# ⑤ 傷害保険の給付金は？\n\n「では、ケガをして傷害保険から入院給付金などを受け取った場合。」\n\n一般に、\n\n### 身体の傷害に基因して支払われる一定の保険金・給付金\n\nは、\n\n### **非課税**\n\nとなります。\n\n「医療保険の入院給付金などと似た考え方ですね。」\n\n---\n\n# ⑥ ただし「死亡保険金」は別に考える\n\n「ここ、ちょっと待ってください。」\n\n> 損害保険から受け取るお金は全部非課税！\n\nと覚えるのは危険です。\n\nたとえば傷害保険で、\n\n事故\n↓\n死亡\n↓\n遺族が死亡保険金を受け取る\n\n場合。\n\nこれは契約関係などによって、\n\n### 相続税\n\n### 所得税\n\n### 贈与税\n\nなどが問題になることがあります。\n\n「生命保険でやった考え方とつながります。」\n\nつまり、\n\n### ケガの治療・損害補填など\n\n→ 非課税となるものが多い\n\nでも、\n\n### 死亡保険金\n\n→ **誰が保険料を負担し、誰が被保険者で、誰が受け取るか**\n\nを見る必要があります。\n\n---\n\n# ⑦ 事業者が払った損害保険料\n\n「ここから会社側です。」\n\n会社が事業用の建物に、\n\n### 火災保険\n\nをかけた。\n\nあるいは、\n\n🚗社用車\n→ 自動車保険\n\n🏭工場\n→ 火災保険\n\nなど。\n\n事業のために必要な保険料なら、\n\n### 法人では原則として損金\n\n### 個人事業では必要経費\n\nとして扱われるものがあります。\n\n「個人のプライベートな保険料と違いますね。」\n\n---\n\n# ⑧ 事業者が保険金を受け取ったら？\n\n「では会社の工場が火災。」\n\n🔥🏭\n\n会社が、\n\n### 保険金1,000万円\n\nを受け取った。\n\n「個人の火災保険金と同じで非課税？」\n\n……\n\n### そこは違います。\n\n法人が受け取る損害保険金は、原則として、\n\n### **益金**\n\nとして扱われます。\n\n一方で、\n\n火災によって失った資産の損失などは、\n\n### 損金\n\nとなり得ます。\n\n---\n\n「つまり会社の場合は、保険金だけを見るのではなく、」\n\n### 保険金収入\n\n＋\n\n### 災害による損失\n\nを税務上それぞれ処理するわけです。\n\n---\n\n# C【イメージ理解｜個人は「穴を埋める」、会社は「帳簿の両側」】\n\n「個人の火災から考えましょう。」\n\n先輩の家、\n\n🔥\n↓\n▲1,000万円\n\nそこへ、\n\n💰＋1,000万円\n\n保険金。\n\n### 穴が埋まっただけ。\n\nだから、\n\n### 原則非課税。\n\n---\n\n一方、会社なら、\n\n🏭🔥\n\n帳簿上、\n\n### 災害による損失\n\nと\n\n### 保険金による収入\n\nをそれぞれ認識します。\n\n「だから“損害保険金＝全部非課税”と一括りにすると、個人と法人が混ざってしまうんです。」\n\n---\n\n# D【具体例｜個人と会社を比較】\n\n## ケース① 個人宅\n\n自宅に火災。\n\n損害額\n\n### 800万円\n\n火災保険金\n\n### 800万円\n\n受け取り。\n\nこれは損害を補填する性質なので、\n\n### → 原則非課税\n\nです。\n\n---\n\n## ケース② 地震保険料\n\n個人が対象となる地震保険料を年間、\n\n### 60,000円\n\n支払った。\n\n所得税の地震保険料控除は？\n\n……\n\n### **最大50,000円**\n\nです。\n\n---\n\n## ケース③ 会社の工場\n\n会社の工場で火災。\n\n🔥🏭\n\n損害が発生し、\n\n保険会社から、\n\n### 800万円\n\n受け取った。\n\n法人の場合、\n\n### 保険金収入\n\n→ 原則として益金\n\n一方、\n\n### 災害による資産の損失\n\n→ 損金になり得る\n\nという形で処理します。\n\n「同じ“火災保険金800万円”でも、**個人なのか法人なのか**で税務上の考え方が違うんですね。」\n\n---\n\n# 【試験用に整理】\n\n|ケース|基本的な税務|\n|-|-|\n|個人の一般的な火災保険料|原則、所得控除なし|\n|個人の自動車保険料|原則、所得控除なし|\n|**地震保険料**|**地震保険料控除**|\n|個人の損害を補填する火災保険金など|**原則非課税**|\n|身体の傷害に基づく一定の保険金・給付金|**原則非課税**|\n|死亡保険金|契約関係により相続税・所得税・贈与税など|\n|事業用の損害保険料|必要経費・損金になり得る|\n|法人が受け取る損害保険金|**原則益金**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n個人が自宅の火災保険料を払った。\n\n現在の一般的な損害保険料控除を使える？\n\n……\n\n### **❌原則使えません。**\n\n一般の損害保険料控除は廃止されています。\n\nただし、\n\n### **地震保険料控除**\n\nはあります。\n\n---\n\n### Q2\n\n個人宅が火災で損害を受け、損害を補填する火災保険金を受け取った。\n\n……\n\n### **原則非課税。**\n\n損害の穴を埋める性質だからです。\n\n---\n\n### Q3\n\n法人が工場火災による損害保険金を受け取った。\n\n個人と同じように必ず非課税？\n\n……\n\n### **❌違います。**\n\n法人が受け取った保険金は原則として益金となり、災害による損失などは別途損金として処理されます。\n\n---\n\n# 【30秒復習】\n\n① **一般の損害保険料控除**  \n→ 現在は廃止\n\n② **現在残っている代表**  \n→ 地震保険料控除\n\n③ **所得税の地震保険料控除**  \n→ 最高5万円\n\n④ **個人の損害補填保険金**  \n→ 原則非課税\n\n⑤ **死亡保険金**  \n→ 契約関係によって税金を判定\n\n⑥ **法人の損害保険金**  \n→ 原則益金\n\n# 【一文で覚える】\n\n> **「個人が支払う一般の損害保険料には原則として所得控除はないが地震保険料控除があり、個人が損害を補填するために受け取る保険金は原則非課税。一方、事業用保険料は必要経費・損金となり得て、法人が受け取る保険金は原則益金となる。」**\n\n「先輩、税金が出てきたら一気に判断しないでください。」\n\n### ① 払った？ 受け取った？\n\n↓\n\n### ② 個人？ 法人・事業？\n\n↓\n\n### ③ 何の保険料・保険金？\n\nこの順番です。\n\n特に試験では、\n\n**「損害保険料控除は廃止 → でも地震保険料控除はある」**\n\nここ、きっちり分けて覚えておきましょう。\n\n---", "chapter": 2}, {"n": 82, "title": "第2章 項目82", "raw": "# 第2章 リスク管理 82\n\n## 第3分野の保険\n\n### A【要点｜生命保険でも損害保険でもない「人の病気・ケガ・介護」に備える】\n\n「はい、先輩。**第3分野**って、名前だけでは何の保険か全然分かりませんよね。なので最初に“第1・第2・第3”を並べます。」\n\n> **第1分野** → 生命保険  \n> **第2分野** → 損害保険  \n> **第3分野** → 医療・がん・介護・傷害など、人の病気やケガなどに備える保険\n\n代表例は、\n\n**医療保険・がん保険・介護保険・傷害保険**などです。\n\n「つまり第3分野は、**生きている間に起こる病気・ケガ・介護などのリスク**をイメージすると整理しやすいですよ。」\n\n---\n\n# B【詳しい解説①｜なぜ「第3」なの？】\n\n「まず第1分野からです。」\n\n### 第1分野＝生命保険\n\n代表的なのは、\n\n* 終身保険\n* 定期保険\n* 養老保険\n* 個人年金保険\n\nなど。\n\n基本的に、\n\n### 人の生存・死亡\n\nに関係する保険です。\n\n---\n\n## 第2分野＝損害保険\n\nこちらは、\n\n* 火災保険\n* 自動車保険\n* 賠償責任保険\n\nなど。\n\n事故によって発生した、\n\n### 財産上の損害\n\nなどを補償します。\n\n---\n\n「じゃあ先輩、**病気で入院したときの医療保険**はどっちでしょう？」\n\n……\n\n生命保険とも少し違う。\n\n火災保険や自動車保険とも違う。\n\nそこで、\n\n# **第3分野**\n\nと呼ばれる領域があるわけです。\n\n---\n\n# ② 第3分野の代表選手\n\n「FPなら、まずこの4人を並べましょう。」\n\n### 🏥 医療保険\n\n→ 病気・ケガによる入院や手術など\n\n### 🎗️ がん保険\n\n→ がんによる診断・入院・治療など\n\n### 🧑‍🦽 介護保険\n\n→ 所定の介護状態になった場合\n\n### 🤕 傷害保険\n\n→ 急激・偶然・外来の事故によるケガ\n\n「このあたりが代表的な第3分野です。」\n\n---\n\n# ③ 医療保険\n\n先輩が病気になり、\n\n🏥10日間入院。\n\n契約が、\n\n### 入院給付金 1日5,000円\n\nなら、\n\n5,000円\n×\n10日\n\n＝\n\n### 50,000円\n\nというように、契約条件に応じて給付されます。\n\nさらに、\n\n### 手術給付金\n\nなどが設定されている商品もあります。\n\n「実際の治療費をそのまま払うとは限らず、**契約で決めた金額を給付する定額型**も多いですね。」\n\n---\n\n# ④ がん保険\n\n「次はがんに特化します。」\n\nたとえば、\n\nがんと診断\n↓\n🎗️\n↓\n診断給付金100万円\n\nさらに、\n\n入院\n↓\n入院給付金\n\n手術\n↓\n手術給付金\n\n抗がん剤治療など\n↓\n治療給付\n\nといった形です。\n\nもちろん、具体的な保障内容は商品によって異なります。\n\n---\n\n「普通の医療保険と何が違うの？」\n\nそこですよね。\n\n### 医療保険\n\n→ 病気・ケガを**広く**\n\n### がん保険\n\n→ **がんに特化**\n\nです。\n\n---\n\n# ⑤ 介護保険\n\n「これは公的介護保険と混ぜないでくださいね。」\n\nここでいう第3分野の介護保険は、\n\n### **民間の介護保険**\n\nです。\n\n契約で定められた介護状態になった場合に、\n\n### 一時金\n\nまたは\n\n### 年金\n\nなどが支払われます。\n\n---\n\n一方、\n\n### 公的介護保険\n\nは社会保険制度。\n\n「同じ“介護保険”でも、**公的制度と民間保険は別物**です。」\n\n---\n\n# ⑥ 傷害保険\n\n「先輩、これはさっきまでずっとやっていましたね。」\n\n傷害保険は、\n\n### 急激\n\n### 偶然\n\n### 外来\n\nの事故によるケガを補償。\n\nつまり、\n\n階段から転落\n↓\n🦴骨折\n\nなら対象になり得る。\n\nでも、\n\n風邪\n↓\n🤒\n\nは通常の傷害保険では原則対象外。\n\n「**急・偶・外**でしたね。」\n\n---\n\n# ⑦ 第3分野の大きな特徴\n\n「ここで少し制度的な話をします。」\n\n第3分野の商品は、\n\n> **生命保険会社と損害保険会社の双方が取り扱える分野**\n\nです。\n\nこれが名前を理解するうえでも大切です。\n\n### 第1分野\n\n→ 生命保険会社の領域\n\n### 第2分野\n\n→ 損害保険会社の領域\n\nその中間的な、\n\n### 第3分野\n\n→ **生保・損保双方が扱える**\n\nという位置づけです。\n\n---\n\n# ⑧ 「医療保険＝健康保険」ではない\n\n「先輩、ここも用語が似ています。」\n\n### 健康保険\n\n→ 公的医療保険\n\n病院で医療を受けた際の自己負担などに関係します。\n\n一方、\n\n### 民間の医療保険\n\n→ 第3分野\n\n入院や手術など一定の条件を満たした場合、\n\n### 給付金\n\nを受け取るものです。\n\n---\n\nたとえば、\n\n医療費100万円\n↓\n公的医療保険など\n↓\n自己負担を抑える\n\nそれとは別に、\n\n民間医療保険\n↓\n\n### 入院給付金など\n\nという関係です。\n\n「公的保険の代わりではなく、**公的保障を補完する役割**と考えるといいですね。」\n\n---\n\n# C【イメージ理解｜保険を3つの部屋に分ける】\n\n「大きな保険会社の建物を想像してください。」\n\n### 🚪第1の部屋\n\n👤❤️\n\n**生存・死亡**\n\n→ 生命保険\n\n---\n\n### 🚪第2の部屋\n\n🏠🔥  \n🚗💥\n\n**物・賠償などの損害**\n\n→ 損害保険\n\n---\n\n### 🚪第3の部屋\n\n🏥🤒  \n🎗️  \n🧑‍🦽  \n🤕\n\n**病気・ケガ・介護など**\n\n→ 第3分野\n\n「第3の部屋は、**人が生きている間の健康リスク**がたくさん入っている、とイメージするとかなり覚えやすいです。」\n\n---\n\n# D【具体例｜先輩が病気になったら】\n\n先輩が、\n\n🤒病気\n↓\n🏥入院10日\n\nしたとします。\n\n入院給付金が、\n\n### 1日1万円\n\nなら、\n\n1万円 × 10日\n\n＝\n\n### 10万円\n\nの給付。\n\nさらに手術を受け、\n\n契約条件を満たせば、\n\n### 手術給付金10万円\n\nとすると、\n\n合計\n\n### 20万円\n\nとなります。\n\n「こういう**病気・ケガに伴う入院・手術などのリスク**を扱うのが第3分野の代表的な医療保険です。」\n\n---\n\n# 【3分野を比較】\n\n|分野|中心となるリスク|代表例|\n|-|-|-|\n|**第1分野**|生存・死亡|定期・終身・養老・個人年金|\n|**第2分野**|偶然な事故による財産損害など|火災・自動車|\n|**第3分野**|**病気・ケガ・介護など**|**医療・がん・介護・傷害**|\n\n「まずこの表を頭に入れてください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n医療保険・がん保険・介護保険などは何分野？\n\n……\n\n### **第3分野。**\n\n---\n\n### Q2\n\n第3分野の保険は、生命保険会社しか販売できない？\n\n……\n\n### **❌いいえ。**\n\n生命保険会社・損害保険会社の双方が取り扱える分野です。\n\n---\n\n### Q3\n\n火災保険は第3分野？\n\n……\n\n### **❌第2分野です。**\n\n火災による財産損害などに備える損害保険ですね。\n\n---\n\n# 【30秒復習】\n\n① **第1分野**  \n→ 生命保険\n\n② **第2分野**  \n→ 損害保険\n\n③ **第3分野**  \n→ 病気・ケガ・介護など\n\n④ **代表例**  \n→ 医療・がん・介護・傷害\n\n⑤ **誰が扱える？**  \n→ 生保・損保の双方\n\n⑥ **公的健康保険との関係**  \n→ 民間保険として公的保障を補完\n\n# 【一文で覚える】\n\n> **「第3分野の保険は、生命保険と損害保険の中間的な領域として、医療・がん・介護・傷害など病気やケガ等のリスクを保障し、生命保険会社と損害保険会社の双方が取り扱える保険分野。」**\n\n「先輩、名前の『第3』を丸暗記するより、」\n\n**① 生きる・死ぬ → 第1**  \n**② 物・損害 → 第2**  \n**③ 病気・ケガ・介護 → 第3**\n\nこの3部屋で覚えてください。これなら後で医療保険やがん保険が出てきても、ちゃんと置き場所が分かります。\n\n---", "chapter": 2}, {"n": 83, "title": "医療保険・入院特約", "raw": "# 第2章 リスク管理 83\n\n## 医療保険・入院特約\n\n### A【要点｜医療保険＝単独の保険、入院特約＝主契約に付け足す保障】\n\n「はい、先輩。今回は**医療保険と入院特約の違い**を最初に切ります。」\n\n> 🏥 **医療保険**  \n> → 病気やケガによる**入院・手術などに備えることを主目的とした保険**\n\n> ➕ **入院特約**  \n> → 終身保険などの**主契約に追加して、入院などの保障を付ける特約**\n\nつまり、\n\n### 医療保障そのものが主役\n\n→ **医療保険**\n\n### 別の主契約に医療保障を追加\n\n→ **入院特約**\n\nです。\n\n「保障内容が似ていても、**主役なのかオプションなのか**が違うんですよ。」\n\n---\n\n# B【詳しい解説①｜医療保険とは？】\n\n先輩が病気になって、\n\n🤒\n↓\n🏥入院\n↓\n🔪手術\n\nとなったとします。\n\n民間の医療保険では、契約内容に応じて、\n\n### 入院給付金\n\n### 手術給付金\n\nなどが支払われます。\n\n---\n\nたとえば、\n\n### 入院給付金：1日5,000円\n\nで、\n\n10日入院したら、\n\n5,000円 × 10日\n\n＝\n\n### 50,000円\n\nですね。\n\n「実際の医療費が5万円だったから5万円、という仕組みとは限りません。」\n\n多くの医療保険では、\n\n> **契約で定められた金額を支払う定額給付**\n\nが基本です。\n\n---\n\n# ② 公的医療保険とは別物\n\n「“医療保険”という言葉がややこしいところです。」\n\n### 公的医療保険\n\n健康保険など\n↓\n医療費の自己負担を軽減\n\n---\n\n### 民間医療保険\n\n保険会社と契約\n↓\n所定の入院・手術など\n↓\n給付金\n\nです。\n\nつまり、\n\n### 公的医療保険\n\n＋\n\n### 民間医療保険\n\nという形で、公的保障を民間保険が補完するイメージですね。\n\n---\n\n# ③ 入院特約とは？\n\n「次が今回のもう一つです。」\n\n### 特約\n\nとは、\n\n> **主契約に追加するオプションの保障**\n\nです。\n\nたとえば先輩が、\n\n### 終身保険\n\nに加入しているとします。\n\n主な目的は、\n\n👤死亡\n↓\n💰死亡保険金\n\nですね。\n\nそこへ、\n\n### ＋入院特約\n\nを付ける。\n\nすると、\n\n病気・ケガ\n↓\n🏥入院\n↓\n💰入院給付金\n\nという医療保障も追加できます。\n\n---\n\n# ④ 主契約と特約の関係\n\n「先輩、スマホで考えましょう。」\n\n📱本体\n＝ **主契約**\n\nそこに、\n\n➕オプション\n＝ **特約**\n\nを付ける。\n\nつまり、\n\n### 終身保険\n\n＋\n\n### 入院特約\n\nという構造です。\n\n---\n\n「じゃあ入院特約だけ契約できますか？」\n\n……\n\n### 原則として、特約だけを単独で契約するものではありません。\n\nあくまで、\n\n### **主契約に付加する**\n\nものです。\n\nここが「医療保険」との大きな違いですね。\n\n---\n\n# ⑤ 主契約がなくなったら？\n\n「ここ、かなり重要です。」\n\n主契約\n↓\n入院特約\n\nという上下関係があります。\n\nそのため一般に、\n\n### 主契約が消滅\n\n↓\n\n### 付加されている特約も消滅\n\nという関係になります。\n\n---\n\nたとえば、\n\n終身保険を解約。\n\nすると、\n\n「入院特約だけ残してください」\n\n……\n\n### 原則としてできません。\n\n主契約にくっついている保障だからです。\n\n「商品によって取扱いは異なりますが、FPでは**特約は主契約に従属する**という基本を押さえてください。」\n\n---\n\n# ⑥ 医療保険なら？\n\n一方、\n\n### 医療保険そのもの\n\nを主契約として契約していれば、\n\n🏥医療保障\n\nそのものが本体です。\n\nだから、\n\n「死亡保障の主契約を解約したら、医療特約までなくなってしまった」\n\nという構造とは違います。\n\n---\n\n# ⑦ 入院給付金には「支払限度」がある\n\n「先輩、入院した日数だけ永久に給付されると思わないでくださいね。」\n\n医療保険では契約によって、\n\n### 1回の入院について○日まで\n\nさらに、\n\n### 通算○日まで\n\nといった、\n\n### **支払限度日数**\n\nが設定されている場合があります。\n\n---\n\nたとえば、\n\n入院給付金\n\n### 1日1万円\n\n1入院の支払限度\n\n### 60日\n\n実際の入院\n\n### 80日\n\nだったとします。\n\n単純化すると、\n\n80万円ではなく、\n\n### 1万円 × 60日\n\n＝ **60万円**\n\nまで、という契約が考えられます。\n\n「だから“1日いくら”だけではなく、**何日まで出るか**も重要なんです。」\n\n---\n\n# ⑧ 「1入院」の意味にも注意\n\n「じゃあ60日入院して、一度退院して、翌日また同じ病気で入院したら？」\n\n> 「新しい入院だから、また60日！」\n\n……\n\n「そう簡単ではありません。」\n\n同じ病気などによる再入院について、一定期間内なら、\n\n### **1回の入院として通算する**\n\nなどの商品ルールがあります。\n\n具体的な判定は契約によって異なります。\n\n「“退院した＝必ず限度日数がリセット”ではない、と覚えておけば十分です。」\n\n---\n\n# ⑨ 手術給付金\n\n医療保険では、\n\n### 入院給付金\n\nだけではなく、\n\n### 手術給付金\n\nも重要です。\n\n所定の手術を受けた場合、\n\nたとえば、\n\n### 入院給付日額 × 所定倍率\n\nあるいは、\n\n### 一定額\n\nなど、契約で定められた給付金が支払われます。\n\n「今の商品は給付方式がさまざまなので、“手術なら必ず○倍”のように固定して覚えないでくださいね。」\n\n---\n\n# ⑩ 医療保険は「治療費だけ」のため？\n\n「ここも一段深く理解しましょう。」\n\n病気で入院すると、\n\n直接の医療費だけではありません。\n\nたとえば、\n\n### 差額ベッド代\n\n### 食事に関する自己負担\n\n### 交通費\n\n### 日用品\n\n### 休業による収入減\n\nなどが発生することがあります。\n\n民間医療保険の定額給付金は、\n\n> **こうした公的医療保険だけではカバーしきれない経済的負担にも備える**\n\n役割があります。\n\n---\n\n# C【イメージ理解｜医療保険は「専門店」、入院特約は「追加オプション」】\n\n「先輩、店で考えましょう。」\n\n## 🏥 医療保険\n\n最初から、\n\n### 「医療保障専門店」\n\nです。\n\n🏥入院  \n🔪手術  \n→ 💰給付\n\nこれ自体が主役。\n\n---\n\n## ➕ 入院特約\n\nこちらは、\n\n🏠終身保険など\n↓\n「医療保障も付けますか？」\n↓\n➕🏥\n\nという、\n\n### **追加オプション**\n\nです。\n\n---\n\nだから、\n\n> **医療保険＝本体**\n>\n> **入院特約＝オプション**\n\nと覚えればいいんです。\n\n---\n\n# D【具体例｜同じ入院でも契約構造が違う】\n\n## Aさん\n\n### 医療保険\n\nに加入。\n\n入院給付金\n→ 1日5,000円\n\n病気で20日入院。\n\n5,000円 × 20日\n\n＝\n\n### 10万円\n\n契約条件を満たせば給付。\n\n---\n\n## Bさん\n\n### 終身保険\n\n＋\n\n### 入院特約\n\nに加入。\n\n入院特約\n→ 1日5,000円\n\n同じく20日入院。\n\n### 10万円\n\nの給付対象になったとします。\n\n---\n\n「結果だけ見ると同じ10万円ですよね。」\n\nでも契約構造は、\n\n### Aさん\n\n🏥 **医療保険そのものが主契約**\n\n### Bさん\n\n❤️ 終身保険＝主契約  \n└ 🏥 **入院特約＝追加保障**\n\nと違います。\n\n「この**主契約か特約か**を聞かれると、違いが出てくるんですよ。」\n\n---\n\n# 【医療保険と入院特約を比較】\n\n||医療保険|入院特約|\n|-|-|-|\n|目的|医療保障|医療保障を追加|\n|位置づけ|**主契約になれる**|**特約**|\n|単独契約|⭕|原則❌|\n|入院給付|⭕|⭕|\n|手術給付|契約による|契約による|\n|主契約消滅の影響|医療保険自体が主契約|**原則、特約も消滅**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n終身保険に入院保障を追加した。\n\nこれは？\n\n……\n\n### **入院特約。**\n\n終身保険が主契約で、医療保障を追加しています。\n\n---\n\n### Q2\n\n入院特約だけを残して主契約を解約できる？\n\n……\n\n### **原則としてできません。**\n\n特約は主契約に付加されるものだからです。\n\n---\n\n### Q3\n\n入院給付金1日1万円、1入院60日限度。\n\n80日入院したら単純に80万円？\n\n……\n\n### **❌違います。**\n\nこの条件だけで単純化すれば、\n\n1万円 × 60日\n\n＝\n\n### **60万円**\n\nが限度です。\n\n---\n\n# 【30秒復習】\n\n① **医療保険**  \n→ 病気・ケガの入院・手術など\n\n② **入院特約**  \n→ 主契約に医療保障を追加\n\n③ **医療保険**  \n→ 医療保障そのものが本体\n\n④ **特約**  \n→ 原則、単独では契約しない\n\n⑤ **主契約が消滅**  \n→ 原則、特約も消滅\n\n⑥ **入院給付金**  \n→ 1入院・通算などの支払限度に注意\n\n# 【一文で覚える】\n\n> **「医療保険は病気・ケガによる入院・手術などを主契約として保障する保険で、入院特約は終身保険などの主契約に入院保障を追加する特約であり、原則として主契約に従属する。」**\n\n「はい、先輩。今回は最後にこれだけ残してください。」\n\n### 🏥 医療保険\n\n→ **医療が本体**\n\n### ❤️＋🏥 入院特約\n\n→ **本体に医療を追加**\n\n同じ入院給付金が出ても、**契約の骨組みが違う**んです。\n\n---", "chapter": 2}, {"n": 84, "title": "限定告知型・引受基準緩和型医療保険", "raw": "# 第2章 リスク管理 84\n\n## 限定告知型・引受基準緩和型医療保険\n\n### A【要点｜告知項目を少なくして、加入条件を緩やかにした医療保険】\n\n「はい、先輩。名前が長いですけど、分解すれば怖くありません。」\n\n### 限定告知型\n\n→ **告知する項目を限定する**\n\n### 引受基準緩和型\n\n→ **保険会社が加入を認める基準を緩やかにする**\n\nつまり、\n\n> **健康上の理由などで一般的な医療保険に入りにくい人でも加入しやすいよう、告知項目を限定するなど引受基準を緩和した医療保険**\n\nです。\n\nただし当然、\n\n### 加入しやすい\n\n↓\n\n### 保険会社のリスクが高くなる\n\n↓\n\n### **一般的な医療保険より保険料は割高になりやすい**\n\nという関係があります。\n\n「先輩、ここは**“入りやすい代わりに高め”**。まずこれを一本通してください。」\n\n---\n\n# B【詳しい解説①｜そもそも「告知」って何？】\n\n「医療保険に入るとき、保険会社が何も確認せずに全員を同じ条件で入れたらどうなるでしょう？」\n\nたとえば、\n\nAさん\n→ 健康\n\nBさん\n→ 現在治療中\n\nCさん\n→ 最近大きな手術をした\n\nこの3人では、将来保険金・給付金が支払われる可能性が違いますよね。\n\nだから通常の医療保険では、\n\n> **現在の健康状態・過去の病歴などについて告知**\n\nを求めます。\n\n保険会社はそれをもとに、\n\n### 契約できる\n\n### 条件付きで契約できる\n\n### 引き受けられない\n\nなどを判断します。\n\nこれが、\n\n### **引受審査**\n\nです。\n\n---\n\n# ② 一般の医療保険に入れない人もいる\n\n「たとえば先輩に過去の病歴があったとします。」\n\n通常の医療保険に申し込む。\n\n↓\n\n健康状態を詳しく告知。\n\n↓\n\n保険会社が審査。\n\n↓\n\n条件によっては、\n\n### 加入できない\n\n場合があります。\n\n「そこで、“もう少し加入条件を緩やかにした商品を用意しましょう”と出てくるのが今回の保険です。」\n\n---\n\n# ③ 限定告知型とは？\n\n通常の医療保険より、\n\n### **告知する項目を限定**\n\nします。\n\nたとえば商品によって、\n\n「最近○か月以内に入院・手術を勧められましたか？」\n\n「過去○年以内に所定の病気で入院・手術をしましたか？」\n\nなど、限られた質問に答える形式があります。\n\n「質問数や内容、期間は商品によって違いますから、数字を一律に覚えないでくださいね。」\n\n重要なのは、\n\n> **一般の医療保険より告知項目が限定されている**\n\nことです。\n\n---\n\n# ④ 引受基準緩和型とは？\n\n「“引受”という言葉が難しく見えるだけです。」\n\n### 引受\n\n＝ 保険会社が契約を受け入れること\n\nです。\n\nだから、\n\n### 引受基準緩和型\n\nとは、\n\n> **通常の保険より契約を引き受ける基準を緩和したタイプ**\n\nということ。\n\nそのため、健康上の事情がある人でも、\n\n### 一般の医療保険より加入できる可能性が高くなる\n\nわけです。\n\n---\n\n# ⑤ 「限定告知型」と「引受基準緩和型」はどう違う？\n\n「先輩、ここ気になりますよね。」\n\n実際には、この2つは商品説明で近い意味で使われることが多いです。\n\n### 限定告知型\n\n→ **告知方法・告知項目**に注目した呼び方\n\n### 引受基準緩和型\n\n→ **審査基準が緩和されていること**に注目した呼び方\n\nです。\n\nだから、\n\n> **告知項目を限定することで、通常より引受基準を緩和した医療保険**\n\nという一つの流れで理解して構いません。\n\n---\n\n# ⑥ なぜ保険料が高くなる？\n\n「ここは因果関係で理解しましょう。」\n\n通常の医療保険\n\n→ 健康状態などを詳しく審査  \n→ リスクの高い契約を一定程度選別  \n→ 保険会社がリスクを管理\n\n一方、\n\n引受基準緩和型\n\n→ 告知項目が少ない  \n→ 健康上の事情がある人も入りやすい  \n→ 給付金を支払う可能性が相対的に高くなる  \n→ 保険会社の負担リスクが高くなる  \n→\n\n# **保険料を高めに設定**\n\nという流れです。\n\n「ただ“高い”と暗記するんじゃなくて、**入りやすくした分だけ保険会社がリスクを取るから高い**んですよ。」\n\n---\n\n# ⑦ 持病があっても絶対入れる？\n\n「え？じゃあ持病があっても100％加入できますよね？」\n\n……\n\n### ❌そこは違います。\n\n**加入しやすい＝誰でも加入できる**\n\nではありません。\n\n限定された告知項目に該当した場合などは、\n\n### 加入できないこともあります。\n\n「“審査なし”ではなく、**審査を緩和している**んです。」\n\nここ、かなり重要ですよ。\n\n---\n\n# ⑧ 「無選択型」とは違う\n\n「先輩、ここでもう一つ似たものを整理しておきましょう。」\n\n### 引受基準緩和型\n\n→ **告知あり。ただし項目を限定するなど基準が緩やか**\n\n一方、\n\n### 無選択型\n\n→ 健康状態についての告知や医師の診査を原則不要とするタイプ\n\nがあります。\n\nだから、\n\n### 引受基準緩和型\n\n＝告知ゼロ\n\nではありません。\n\n---\n\n「順番でイメージすると、」\n\n**一般的な医療保険**  \n→ 通常の告知・審査\n\n　　↓ 加入しやすくする\n\n**引受基準緩和型**  \n→ 告知項目を限定するなど\n\n　　↓ さらに健康状態の確認を少なく\n\n**無選択型**  \n→ 健康状態の告知・診査を原則不要\n\nというイメージです。\n\n※具体的な商品条件は保険会社・商品によって異なります。\n\n---\n\n# ⑨ 契約直後の保障が削減される商品もある\n\n「もう一つ注意です。」\n\n引受基準緩和型医療保険の中には、契約後一定期間、\n\n### 給付金額を削減する\n\nタイプもあります。\n\nたとえば本来、\n\n入院給付金\n\n### 1日1万円\n\nでも、\n\n契約から一定期間\n→ 50％\n\nなら、\n\n### 1日5,000円\n\nという形ですね。\n\nただし現在は、契約当初から満額保障する商品もあります。\n\n「ですから、**引受基準緩和型なら必ず最初は半額**とは覚えないでください。商品によります。」\n\n---\n\n# C【イメージ理解｜通常の入口と「広めの入口」】\n\n「先輩、遊園地の入口だと思ってください。」\n\n## 🏥一般の医療保険\n\n🚪\n\n入口で、\n\n「健康状態を確認します」\n\n「過去の病歴は？」\n\n「最近の治療は？」\n\nと通常の基準で確認します。\n\n---\n\n## 🏥引受基準緩和型\n\n🚪　　🚪\n　↑少し広い\n\n質問を限定するなど、\n\n### 入り口の条件を緩やかにする。\n\nだから、\n\n一般の医療保険では入りにくかった人も、\n\n### 入れる可能性が高くなる。\n\nでも……\n\n保険会社からすると、\n\n### リスクの高い人も入りやすい。\n\nだから、\n\n💰💰\n\n### 保険料は高め。\n\n「**入口を広げた分、料金を高めにしてバランスを取る**。この絵で覚えてください。」\n\n---\n\n# D【具体例｜通常型と緩和型を比較】\n\nAさんには過去の病歴があります。\n\nまず、\n\n### 一般の医療保険\n\nに申し込み。\n\n健康状態を告知。\n\n↓\n\n審査の結果、\n\n### 加入できなかった。\n\n---\n\nそこで、\n\n### 引受基準緩和型医療保険\n\nを検討。\n\n告知項目が限定されており、\n\nその質問には該当しなかった。\n\n↓\n\n### 加入できた。\n\nただし、\n\n一般型なら月額\n\n### 4,000円\n\n同程度の保障内容の緩和型が仮に、\n\n### 6,000円\n\nだったとします。\n\n---\n\n「なぜ2,000円高い？」\n\n……\n\n### 健康上の事情がある人も加入しやすく、保険会社が負うリスクが相対的に高いから。\n\nそうです。\n\nこれで、\n\n### **入りやすい ↔ 保険料高め**\n\nが一本につながります。\n\n---\n\n# 【3種類を比較】\n\n||一般の医療保険|引受基準緩和型|無選択型|\n|-|-|-|-|\n|健康状態の確認|通常の告知・審査|**告知項目を限定するなど緩和**|原則、健康告知・診査なし|\n|加入しやすさ|通常|**比較的入りやすい**|より入りやすい|\n|保険料|基準|**割高になりやすい**|一般にさらに割高になりやすい|\n|誰でも加入？|❌|**❌**|年齢等の加入条件はある|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n引受基準緩和型医療保険は、健康状態の告知が一切ない？\n\n……\n\n### **❌違います。**\n\n告知項目を限定するなど、通常より基準を緩和しています。\n\n---\n\n### Q2\n\nなぜ一般の医療保険より保険料が高くなりやすい？\n\n……\n\n### **健康上の事情がある人も加入しやすく、保険会社が負うリスクが相対的に高くなるから。**\n\n---\n\n### Q3\n\n持病があれば必ず加入できる？\n\n……\n\n### **❌できるとは限りません。**\n\n告知項目などの加入条件を満たす必要があります。\n\n---\n\n# 【30秒復習】\n\n① **限定告知型**  \n→ 告知項目を限定\n\n② **引受基準緩和型**  \n→ 通常より引受基準が緩やか\n\n③ **対象イメージ**  \n→ 一般の医療保険に入りにくい人\n\n④ **保険料**  \n→ 一般型より割高になりやすい\n\n⑤ **告知なし？**  \n→ ❌告知はある\n\n⑥ **無選択型**  \n→ 健康状態の告知・診査を原則不要とするタイプ\n\n# 【一文で覚える】\n\n> **「限定告知型・引受基準緩和型医療保険は、健康状態に関する告知項目を限定するなど通常より引受基準を緩和して加入しやすくした医療保険で、その分、一般の医療保険より保険料が割高になりやすい。」**\n\n「はい、先輩。名前の長さに負けないでください。」\n\n### 🚪入口を広くする\n\n→ **入りやすい**\n\nでも、\n\n### 🏥保険会社のリスクが上がる\n\n→ **保険料は高め**\n\nそして一番の注意は、\n\n> **緩和型＝無審査ではない。**\n\nここまでセットで覚えれば大丈夫です。\n\n---", "chapter": 2}, {"n": 85, "title": "がん保険・がん入院特約", "raw": "# 第2章 リスク管理 85\n\n## がん保険・がん入院特約\n\n### A【要点｜がん保険＝がん保障が本体、がん入院特約＝主契約にがん保障を追加】\n\n「はい、先輩。これは前回の**医療保険と入院特約**と同じ構造で考えると、一気に分かります。」\n\n> 🎗️ **がん保険**  \n> → がんによる診断・入院・手術・治療などに備えることを主目的とする保険\n\n> ➕🎗️ **がん入院特約**  \n> → 終身保険などの**主契約に付加して、がんによる入院などの保障を追加する特約**\n\nつまり、\n\n### 🎗️がん保障そのものが本体\n\n→ **がん保険**\n\n### ❤️主契約＋🎗️がん保障\n\n→ **がん入院特約**\n\nです。\n\nそしてもう一つ。\n\n> **がん保険では、一般に契約後すぐにがん保障が開始されるとは限らず、90日程度の待ち期間（免責期間）が設けられる商品が多い。**\n\n「ここ、がん保険特有の重要ポイントですよ。」\n\n---\n\n# B【詳しい解説①｜がん保険とは？】\n\n「医療保険は病気やケガを広くカバーしましたよね。」\n\n### 🏥医療保険\n\n病気\n＋\nケガ\n↓\n入院・手術など\n\n---\n\n一方、\n\n### 🎗️がん保険\n\nは、\n\n> **がんに特化して保障を厚くした保険**\n\nです。\n\n代表的な保障には、\n\n### 診断給付金\n\n### 入院給付金\n\n### 手術給付金\n\n### 抗がん剤治療給付\n\n### 放射線治療給付\n\nなどがあります。\n\n「全部の商品に全部付いているわけではありません。保障内容は契約によります。」\n\n---\n\n# ② 診断給付金\n\n「がん保険で特徴的なのがこれです。」\n\n### **診断給付金**\n\n所定のがんと診断された場合に、\n\nたとえば、\n\n### 100万円\n\nなどの一時金を受け取れるタイプがあります。\n\n---\n\n「なぜ入院していないのにお金が出るんでしょう？」\n\n……\n\nがんになると、\n\n治療費だけではなく、\n\n### 通院費\n\n### 収入減少\n\n### 生活費\n\n### 先進医療などへの備え\n\nといった幅広い経済的負担が考えられます。\n\nだから、\n\n> **診断された段階でまとまった資金を受け取れる**\n\n保障が設けられているんですね。\n\n---\n\n# ③ がん入院給付金\n\nがんの治療目的で入院。\n\n🏥\n\n契約が、\n\n### 1日1万円\n\nなら、\n\n20日入院\n↓\n1万円 × 20日\n↓\n\n### 20万円\n\nというように給付されます。\n\n---\n\n「先輩、普通の医療保険にも入院給付金がありましたよね。」\n\nそうです。\n\nだから、\n\n### 医療保険\n\n＋\n\n### がん保険\n\nの両方に加入していて、それぞれの支払条件を満たせば、\n\n### 両方から給付される\n\n場合があります。\n\n「“実際の治療費を超えたら絶対ダメ”という実損補償型とは違い、定額給付型ならそれぞれの契約に基づいて給付されます。」\n\n---\n\n# ④ がん入院特約とは？\n\n「では“特約”の方です。」\n\n先輩が、\n\n### 終身保険\n\nに加入。\n\n主契約では、\n\n死亡\n↓\n💰死亡保険金\n\nを保障。\n\nそこへ、\n\n### ＋ がん入院特約\n\nを付加。\n\nすると、\n\nがん\n↓\n🏥入院\n↓\n💰給付金\n\nという保障を追加できます。\n\n---\n\nつまり、\n\n### 主契約\n\n❤️終身保険など\n\nに、\n\n### オプション\n\n🎗️がん入院特約\n\nをくっつけるイメージです。\n\n---\n\n# ⑤ がん保険との違い\n\n「先輩、ここは医療保険のときと同じですよ。」\n\n### がん保険\n\n🎗️←これ自体が本体\n\n---\n\n### がん入院特約\n\n❤️主契約\n└ 🎗️がん保障\n\nです。\n\nだから一般に、\n\n### 主契約が消滅\n\n↓\n\n### 特約も消滅\n\nします。\n\n「特約は主契約にくっついている、と考えてください。」\n\n---\n\n# ⑥ がん保険の「待ち期間」\n\n「さて、ここからが試験でかなり大事です。」\n\n先輩が、\n\n### 4月1日\n\nにがん保険を契約。\n\nそして、\n\n### 4月10日\n\nにがんと診断された。\n\n「契約してるから当然出ますよね？」\n\n……\n\n### **必ずしもそうではありません。**\n\nがん保険では一般に、\n\n> **契約から90日程度の待ち期間（免責期間）**\n\nが設けられている商品が多くあります。\n\n---\n\nつまりイメージは、\n\n契約\n↓\n\n### 約90日\n\n🚫待ち期間\n↓\n\n### がん保障開始\n\nです。\n\n「商品によって期間や取扱いは異なるので、“すべてのがん保険が必ず90日”とは覚えないでください。」\n\nFPでは、\n\n### **がん保険には一般に90日程度の待ち期間がある**\n\nと押さえるのが基本です。\n\n---\n\n# ⑦ なぜ待ち期間があるの？\n\n「先輩、ここは丸暗記しないで因果でいきます。」\n\nもし、\n\n健康状態に異変\n↓\n「もしかして、がんかも……」\n↓\n急いでがん保険に加入\n↓\n直後に診断\n↓\n高額な給付金\n\nが簡単に成立するとどうでしょう？\n\n……\n\n保険加入者間の公平性が崩れやすくなります。\n\nそこで、\n\n### 契約\n\n↓\n一定期間\n↓\n保障開始\n\nという仕組みを設けている商品が多いんです。\n\n---\n\n# ⑧ 上皮内がんは？\n\n「ここも、がん保険では確認ポイントです。」\n\n### 上皮内がん（上皮内新生物）\n\nは、がん細胞が上皮内にとどまっている段階のものです。\n\n商品によって、\n\n### 悪性新生物と同額保障\n\nの場合もあれば、\n\n### 給付額が異なる\n\n場合などもあります。\n\n「だから、“がんと名前が付けば全部まったく同じ給付”とは限りません。」\n\n---\n\n# ⑨ 入院中心から「治療中心」の保障も\n\n「もう一つ、今のがん保険を理解するうえで大切です。」\n\n昔のイメージでは、\n\nがん\n↓\n長期入院\n↓\n入院給付金\n\nでした。\n\nでも現在は、\n\n### 通院\n\n### 抗がん剤\n\n### 放射線治療\n\nなど、入院だけではない治療もあります。\n\nそのため商品によって、\n\n### 治療給付\n\n### 通院給付\n\n### 抗がん剤治療給付\n\nなどを重視するタイプがあります。\n\n「つまり、**がん保険＝入院だけを見る保険**ではありません。」\n\n---\n\n# C【イメージ理解｜がん専門店とオプション】\n\n「前回と同じ“店”で覚えましょう。」\n\n## 🎗️ がん保険\n\n最初から看板が、\n\n# 「がん専門店」\n\nです。\n\n診断\n↓\n入院\n↓\n手術\n↓\n抗がん剤\n↓\n放射線治療\n\nなど、契約に応じてがんを重点的に保障。\n\n---\n\n## ❤️＋🎗️ がん入院特約\n\nこちらは、\n\n❤️終身保険など\n↓\n「がん保障も付けますか？」\n↓\n➕🎗️\n\nという、\n\n### **追加オプション**\n\nです。\n\n---\n\nそして入口には、\n\n🚧\n\n### 「がん保障は一定の待ち期間後から」\n\nというゲートが設けられていることが多い。\n\n「この絵でかなり整理できますよ。」\n\n---\n\n# D【具体例｜契約10日後にがんと診断】\n\n先輩が、\n\n### 4月1日\n\nにがん保険へ加入。\n\nこの商品には、\n\n### 90日の待ち期間\n\nがあるとします。\n\n---\n\nそして、\n\n### 4月10日\n\nがんと診断。\n\n「診断給付金100万円！」\n\n……\n\n### ❌この契約条件では、がん保障開始前です。\n\n---\n\n一方、\n\n待ち期間を経過して、\n\n### 8月1日\n\nに所定のがんと診断された。\n\n↓\n\n契約条件を満たせば、\n\n### 診断給付金100万円\n\nなどの保障対象になります。\n\n「だから生命保険の**責任開始**を考えるとき、がん保障ではこの待ち期間に特に注意するんです。」\n\n---\n\n# 【医療保険とがん保険を比較】\n\n||医療保険|がん保険|\n|-|-|-|\n|主な対象|病気・ケガ|**がんに特化**|\n|入院|⭕|がん入院⭕|\n|手術|⭕契約による|がん手術⭕契約による|\n|診断一時金|商品による|**代表的な保障**|\n|抗がん剤・放射線|商品による|**商品により重点保障**|\n|待ち期間|一般の医療保障では通常がん保険と同じ仕組みとは限らない|**一般に90日程度の商品が多い**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\nがん保険とがん入院特約の基本的な違いは？\n\n……\n\n### **がん保険はがん保障そのものが主契約。**\n\n### **がん入院特約は別の主契約に付加する保障。**\n\n---\n\n### Q2\n\nがん保険に今日加入すれば、明日がんと診断されても必ず給付される？\n\n……\n\n### **❌いいえ。**\n\n一般に90日程度の待ち期間を設ける商品が多いためです。\n\n---\n\n### Q3\n\nがん保険は入院した場合にしか給付されない？\n\n……\n\n### **❌違います。**\n\n契約によって診断給付金、手術、抗がん剤治療、放射線治療、通院などの保障があります。\n\n---\n\n# 【30秒復習】\n\n① **がん保険**  \n→ がんに特化\n\n② **がん入院特約**  \n→ 主契約にがん入院保障を追加\n\n③ **診断給付金**  \n→ がん診断時の一時金タイプ\n\n④ **待ち期間**  \n→ 一般に90日程度の商品が多い\n\n⑤ **上皮内がん**  \n→ 商品によって保障内容・金額に違い\n\n⑥ **現在のがん治療**  \n→ 入院だけでなく通院・抗がん剤・放射線などにも注目\n\n# 【一文で覚える】\n\n> **「がん保険はがんの診断・入院・手術・治療などを重点的に保障する保険で、がん入院特約は主契約にがん入院保障を追加する特約。がん保障には一般に90日程度の待ち期間が設けられる商品が多い。」**\n\n「はい、先輩。今回は3本だけ残してください。」\n\n### 🎗️ がん保険\n\n→ **がん保障が本体**\n\n### ❤️＋🎗️ がん入院特約\n\n→ **がん保障を追加**\n\nそして、\n\n### 契約 → 🚧約90日 → がん保障\n\n**“加入した瞬間から必ずがん保障”ではない。**\n\nここはFPで狙われやすいので、きっちり押さえておきましょう。\n\n---", "chapter": 2}, {"n": 86, "title": "介護保障保険", "raw": "# 第2章 リスク管理 86\n\n## 介護保障保険\n\n### A【要点｜所定の介護状態になったとき、一時金・年金などで備える民間保険】\n\n「はい、先輩。今回はまず**公的介護保険と混ぜないこと**です。」\n\n**介護保障保険**は、\n\n> **被保険者が契約で定められた所定の介護状態になり、その状態が一定期間継続するなどの支払条件を満たした場合に、一時金や年金などを受け取る民間保険**\n\nです。\n\nポイントは、\n\n### 🧑‍🦽 所定の介護状態\n\n↓\n\n### ⏱️ 契約上の条件を満たす\n\n↓\n\n### 💰 介護一時金・介護年金など\n\nという流れ。\n\n「そして先輩、“要介護になったら絶対出る”ではありません。**何をもって介護状態と判定するか**が大事なんです。」\n\n---\n\n# B【詳しい解説①｜なぜ介護保障保険が必要なの？】\n\n介護状態になると、\n\n単純な医療費だけではなく、\n\n### 🛏️ 介護ベッド\n\n### 🏠 住宅改修\n\n### 🧑‍🦽 介護サービス\n\n### 🚕 移動費\n\n### 👨‍👩‍👧 家族の負担\n\nなど、長期的な経済負担が発生する可能性があります。\n\n---\n\n「でも、公的介護保険がありますよね？」\n\nそうです。\n\n日本には、\n\n### **公的介護保険**\n\nがあります。\n\nただ、公的介護保険ですべての経済的負担がゼロになるわけではありません。\n\nそこで、\n\n### 公的介護保険\n\n＋\n\n### 民間の介護保障保険\n\nとして備える考え方が出てきます。\n\n---\n\n# ② 公的介護保険との違い\n\n「ここはきっちり分けます。」\n\n### 公的介護保険\n\n社会保険制度として、\n\n> **介護サービスを中心に給付**\n\nします。\n\n---\n\n### 民間の介護保障保険\n\n契約条件を満たせば、\n\n> **一時金・年金などの現金給付**\n\nを受け取るタイプがあります。\n\nつまりイメージは、\n\n### 公的\n\n→ 🧑‍🦽 **サービスを利用する仕組み**\n\n### 民間\n\n→ 💰 **お金で補う**\n\nです。\n\n---\n\n# ③ どんな状態なら給付される？\n\n「ここ、今回の本丸です。」\n\n民間の介護保障保険では、商品によって支払条件が異なります。\n\n代表的には、\n\n### 公的介護保険の要介護認定と連動\n\nして、\n\n> 「要介護○以上と認定された場合」\n\nとするタイプ。\n\nまたは、\n\n### 保険会社独自の基準\n\nによって、\n\n> 「所定の介護状態が一定期間継続した場合」\n\nなどとするタイプがあります。\n\n「だから、“介護っぽい生活になったから自動的に給付”ではないんですよ。」\n\n---\n\n# ④ ADLとは？\n\n「介護保険を理解するなら、この言葉も押さえましょう。」\n\n### ADL\n\n＝ Activities of Daily Living\n＝ **日常生活動作**\n\nです。\n\nたとえば、\n\n### 🍚 食事\n\n### 👕 着替え\n\n### 🚽 排泄\n\n### 🛁 入浴\n\n### 🚶 移動\n\nなど、日常生活に必要な基本動作です。\n\n---\n\nこれらについて、\n\n> **自分一人でどこまでできるか**\n\nを見ることで、介護状態を判断する材料になります。\n\n「ADL＝日常生活の基本動作。これは今後も出てきますよ。」\n\n---\n\n# ⑤ 認知症の場合は？\n\n「身体が動くなら介護じゃない、と思ったらダメです。」\n\nたとえば、\n\n身体的には歩ける。\n\nでも認知症によって、\n\n### 🔥 火を消したことを忘れる\n\n### 🚶 外出して帰れなくなる\n\n### 💊 薬を適切に管理できない\n\nなど、日常生活に大きな支障が出ることがあります。\n\nそのため介護保障では、商品によって、\n\n### 認知症による所定の状態\n\nなども給付判定に関係します。\n\n---\n\n# ⑥ 一時金と年金\n\n「では、お金の受け取り方です。」\n\n## 介護一時金\n\n所定の介護状態\n↓\n条件を満たす\n↓\n\n### 💰300万円\n\nなど、まとまった金額を受け取るタイプ。\n\n---\n\n## 介護年金\n\n所定の介護状態\n↓\n条件を満たす\n↓\n\n### 毎年60万円\n\nなど、継続的に受け取るタイプ。\n\n商品によっては、\n\n### 一時金＋年金\n\nという設計もあります。\n\n---\n\n「使い道のイメージも違います。」\n\n### 一時金\n\n→ 住宅改修・介護用品などの初期費用\n\n### 年金\n\n→ 継続的な介護費用\n\nと考えると分かりやすいですね。\n\n---\n\n# ⑦ 医療保険との違い\n\n「先輩、医療保険と混ぜないようにします。」\n\n### 医療保険\n\n🤒病気・ケガ\n↓\n🏥入院・手術\n↓\n💰給付\n\n---\n\n### 介護保障保険\n\n🧑‍🦽所定の介護状態\n↓\n契約条件を満たす\n↓\n💰介護一時金・年金\n\nです。\n\n---\n\nたとえば、\n\n骨折\n↓\n10日入院\n↓\n回復して普通の生活へ\n\nなら、\n\n### 医療保険\n\nが中心。\n\n一方、\n\n病気など\n↓\n日常生活に継続的な介助が必要\n↓\n所定の介護状態\n\nなら、\n\n### 介護保障保険\n\nが重要になります。\n\n「**治療を見るのが医療、生活の介助状態を見るのが介護**。この違いです。」\n\n---\n\n# ⑧ 「介護になったら一生もらえる」とは限らない\n\n「ここも注意です。」\n\n介護年金と聞くと、\n\n> 一度認定されたら死亡するまで毎年絶対もらえる\n\nと思いそうですよね。\n\nでも、\n\n### 支払期間\n\n### 支払回数\n\n### 継続条件\n\nなどは商品によって異なります。\n\n「介護保障は特に商品差が大きいので、FPでは**所定の介護状態＋契約条件**という言い方を大切にしてください。」\n\n---\n\n# C【イメージ理解｜公的介護保険と民間保険は「サービス券＋財布」】\n\n「先輩、介護生活に二つの道具を持っていくイメージです。」\n\n### 🪪 公的介護保険\n\n介護サービスを利用するための、\n\n### **サービス券**\n\nのイメージ。\n\n---\n\nそこに、\n\n### 👛 民間の介護保障保険\n\n所定の条件を満たせば、\n\n### 一時金\n\n### 年金\n\nとして現金を受け取る。\n\nつまり、\n\n# 🪪＋👛\n\n### 公的制度\n\n＋\n\n### 民間保険\n\nで介護生活の経済的負担に備えるんです。\n\n「民間保険が公的介護保険を置き換えるわけではありません。**補完する**んですよ。」\n\n---\n\n# D【具体例｜要介護状態になった場合】\n\n先輩が民間の介護保障保険に加入。\n\n契約内容を単純化して、\n\n> **公的介護保険で所定の要介護状態に認定された場合、介護一時金300万円**\n\nという条件だったとします。\n\nその後、\n\n病気\n↓\n🧑‍🦽介護が必要\n↓\n公的介護保険で契約所定の要介護状態と認定\n\nすると、\n\n契約条件を満たせば、\n\n### 💰介護一時金300万円\n\nが支払われます。\n\n---\n\nその300万円を、\n\n住宅改修\n\n### 100万円\n\n介護ベッドなど\n\n### 30万円\n\nその他の介護費用\n\n### 170万円\n\nなどに充てることができます。\n\n「公的介護保険のサービスとは別に、**現金を受け取って経済的負担を補う**。ここが民間介護保障の役割です。」\n\n---\n\n# 【医療・がん・介護を整理】\n\n|保険|何に備える？|代表的な給付|\n|-|-|-|\n|**医療保険**|病気・ケガ|入院・手術給付|\n|**がん保険**|がん|診断・入院・治療給付など|\n|**介護保障保険**|**所定の介護状態**|**介護一時金・介護年金など**|\n\n「全部第3分野ですが、**何をきっかけに給付されるか**が違うんですね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n民間の介護保障保険は、公的介護保険そのもの？\n\n……\n\n### **❌違います。**\n\n公的介護保険とは別の民間保険です。\n\n---\n\n### Q2\n\n介護保障保険では、何を満たすと給付される？\n\n……\n\n### **契約で定められた所定の介護状態などの支払条件。**\n\n公的介護保険の要介護認定と連動する商品もあります。\n\n---\n\n### Q3\n\nADLとは？\n\n……\n\n### **日常生活動作（Activities of Daily Living）。**\n\n食事・着替え・排泄・入浴・移動など、日常生活の基本動作です。\n\n---\n\n# 【30秒復習】\n\n① **介護保障保険**  \n→ 民間の第3分野保険\n\n② **給付条件**  \n→ 所定の介護状態など\n\n③ **公的介護保険との関係**  \n→ 別制度。民間保険が経済的負担を補完\n\n④ **主な受取方法**  \n→ 一時金・年金など\n\n⑤ **ADL**  \n→ 日常生活動作\n\n⑥ **医療保険との違い**  \n→ 医療は入院・手術、介護は**継続的な介護状態**\n\n# 【一文で覚える】\n\n> **「介護保障保険は、被保険者が契約所定の介護状態となるなど支払条件を満たした場合に、介護一時金や介護年金などを受け取り、公的介護保険だけでは補いにくい経済的負担に備える民間の第3分野保険。」**\n\n「先輩、最後はここです。」\n\n### 🏥 治療が必要\n\n→ **医療保険**\n\n### 🎗️ がん\n\n→ **がん保険**\n\n### 🧑‍🦽 日常生活で継続的な介護が必要\n\n→ **介護保障保険**\n\n第3分野は、**何が給付のスイッチになるのか**で分ければ、きれいに整理できます。\n\n---", "chapter": 2}, {"n": 87, "title": "所得補償保険", "raw": "# 第2章 リスク管理 87\n\n## 所得補償保険\n\n※「所得保障保険」と呼ばれることもありますが、FPでは主に**所得補償保険**として押さえます。\n\n### A【要点｜病気・ケガで働けない間の「収入減少」を補う】\n\n「はい、先輩。医療保険との違いを最初に切りますね。」\n\n**所得補償保険**とは、\n\n> **病気やケガによって働けない状態になり、所得が減少した場合に、その所得の損失を補償する保険**\n\nです。\n\nつまり、\n\n### 🏥 医療保険\n\n→ **入院・手術などに備える**\n\n### 💼 所得補償保険\n\n→ **働けなくなって減った収入に備える**\n\nです。\n\n「治療費を見るんじゃありません。**給料・所得が止まるリスクを見る保険**なんです。」\n\n---\n\n# B【詳しい解説①｜何が怖いのか】\n\n先輩が病気になって、\n\n🤒\n↓\n🏥治療\n↓\n3か月仕事ができない\n\nとします。\n\nこのとき問題になるお金は、医療費だけではありません。\n\n仕事ができないので、\n\n### 📉収入が減る\n\nでも、\n\n### 🏠家賃\n\n### 🍚食費\n\n### 💡光熱費\n\n### 📱通信費\n\n### 💳ローン\n\nなどは続きます。\n\n「治療費を払えても、**生活費を払えない**という問題が残るんですよ。」\n\nそこで、\n\n# 所得補償保険\n\nです。\n\n---\n\n# ② 医療保険との違い\n\n「先輩が骨折して1か月働けないとします。」\n\n医療保険なら、\n\n入院\n↓\n1日5,000円\n\n手術\n↓\n10万円\n\nなど、契約所定の給付を受ける。\n\n一方、所得補償保険では、\n\n病気・ケガ\n↓\n\n### 就業不能\n\n↓\n所得減少\n↓\n💰補償\n\nという流れです。\n\nつまり見る場所が違います。\n\n> **医療保険＝治療側**\n>\n> **所得補償保険＝仕事・収入側**\n\nです。\n\n---\n\n# ③ 「就業不能」が重要\n\n「ここ、試験でも実生活でも大事です。」\n\n病気になっただけで、\n\n### 自動的に保険金が出る\n\nわけではありません。\n\n契約で定める、\n\n### **就業不能状態**\n\nに該当する必要があります。\n\n---\n\nたとえば、\n\n病気にはなった\n↓\nでも普通に仕事できる\n\nなら、\n\n### 所得補償の対象にはならない\n\nことがあります。\n\n一方、\n\n病気・ケガ\n↓\n医師の治療を受ける\n↓\n仕事ができない\n↓\n契約所定の就業不能状態\n\nとなれば、補償対象になり得ます。\n\n「つまり、病名より**働けるかどうか**を見るんですね。」\n\n---\n\n# ④ 入院していないとダメ？\n\n「え？じゃあ入院していないと所得補償は出ませんか？」\n\n……\n\n### 必ずしもそうではありません。\n\n所得補償保険は、\n\n### 入院そのもの\n\nではなく、\n\n### **就業不能**\n\nを見る保険です。\n\n契約条件を満たせば、自宅療養などでも補償対象となる場合があります。\n\n「だから医療保険と同じ感覚で“入院した？”だけを見ると間違えます。」\n\n---\n\n# ⑤ 免責期間\n\n「では先輩、風邪で1日だけ仕事を休んだ。」\n\n💰「所得補償ください」\n\n……\n\n「さすがに何でも即日、というわけではありません。」\n\n所得補償保険には一般に、\n\n### **免責期間**\n\nが設定されます。\n\nたとえば仮に、\n\n### 7日間\n\nの免責期間なら、\n\n就業不能\n↓\n1日目\n↓\n……\n↓\n7日目\n↓\nその後\n\nというように、一定期間を超えた就業不能について契約に基づき補償します。\n\n「具体的な日数は商品によりますから、数字そのものではなく**免責期間がある**ことを押さえてください。」\n\n---\n\n# ⑥ いくらでも設定できる？\n\n「先輩、月収30万円なのに月100万円補償にして……」\n\n……\n\n### そういう“保険で収入アップ”を目的にはできません。\n\n所得補償保険は、\n\n> **実際の所得の損失を補う**\n\nという性質を持ちます。\n\nそのため保険金額には、契約前の所得などを基準とした制限があります。\n\nこれは以前やった、\n\n### **利得禁止の原則**\n\nにつながります。\n\n「働けなくなった方が儲かる仕組みにしてはいけない、ということですね。」\n\n---\n\n# ⑦ 傷病手当金との関係\n\n「ここでFP第1章ともつながります。」\n\n会社員など一定の健康保険の被保険者なら、\n\n病気・ケガ\n↓\n仕事ができない\n↓\n給与を十分受けられない\n\nなどの要件を満たすと、\n\n### **傷病手当金**\n\nを受けられる場合があります。\n\n---\n\nつまり会社員なら、\n\n### 公的保障\n\n→ 傷病手当金など\n\n＋\n\n### 民間保障\n\n→ 所得補償保険\n\nという形で考えられます。\n\n「だから必要な民間保障額を考えるときは、**公的保障を無視して全部民間保険で埋める**のではなく、まず何が公的に出るかを見るんですよ。」\n\n---\n\n# ⑧ 自営業者では意味が大きくなることも\n\n「じゃあ、自営業者は？」\n\n会社員と比べて利用できる公的な所得保障の仕組みが異なります。\n\nたとえば国民健康保険では、会社員の健康保険にある傷病手当金と同じ仕組みが全国一律で当然に支給されるわけではありません。\n\nそのため、\n\n### 自分が働けない\n\n↓\n\n### 売上・所得が落ちる\n\n↓\n\n### 生活費が厳しくなる\n\nというリスクへの備えがより重要になるケースがあります。\n\n「職業によって必要性が変わる、ということですね。」\n\n---\n\n# ⑨ 「収入保障保険」と混同注意\n\n「先輩、ここは名前がものすごく似ています。」\n\n以前やった、\n\n# 収入保障保険\n\n覚えていますか？\n\nこちらは生命保険です。\n\n被保険者が、\n\n### 死亡・高度障害など\n\n↓\n遺族などへ\n↓\n年金形式で保険金\n\nというもの。\n\n---\n\n一方、\n\n# 所得補償保険\n\nは、\n\n### 本人が生きている\n\n↓\n病気・ケガ\n↓\n働けない\n↓\n本人の所得減少を補償\n\nです。\n\n「名前は似ていますが、全然違います。」\n\n---\n\n## ここ、超重要です\n\n### 収入保障保険\n\n👤💀\n→ **死亡など**\n→ 遺族の生活費\n\n### 所得補償保険\n\n👤🤒💼❌\n→ **病気・ケガで働けない**\n→ 本人の所得減少\n\n「**死亡か、就業不能か**。これで切ってください。」\n\n---\n\n# C【イメージ理解｜給料に傘をかける】\n\n「先輩の毎月の生活を川だと思ってください。」\n\n💼仕事\n↓\n💰給料\n↓\n🏠🍚💡生活\n\n普段は、\n\n### 💰→生活\n\nとお金が流れています。\n\nところが、\n\n🤒病気\n↓\n💼❌働けない\n↓\n💰❌収入減少\n\n川が止まる。\n\nでも、\n\n🏠家賃\n🍚食費\n💡光熱費\n\nは止まりません。\n\nそこで、\n\n☂️\n\n### 所得補償保険\n\n↓\n💰\n\nで、止まった収入の一部を補う。\n\n「つまり、病院に傘をかけるというより、**給料・所得に傘をかける保険**なんです。」\n\n---\n\n# D【具体例｜月収30万円の会社員】\n\n先輩の所得が、\n\n### 月30万円\n\nだったとします。\n\n病気で、\n\n### 3か月\n\n契約所定の就業不能状態になりました。\n\nその間、\n\n📉所得が大きく減少。\n\n所得補償保険で、仮に契約上、\n\n### 月15万円\n\nが補償されるとします。\n\n単純化すると、\n\n15万円\n×\n3か月\n\n＝\n\n### 45万円\n\nの補償。\n\n※実際には免責期間、所得額、他の給付、契約条件などによって支払額は異なります。\n\n「この45万円は“病院代専用”ではなく、**働けないことで失った所得を補う**ためのお金なんですね。」\n\n---\n\n# 【似ている3つを整理】\n\n|保険|給付のきっかけ|何を守る？|\n|-|-|-|\n|**医療保険**|入院・手術など|医療に伴う経済負担|\n|**所得補償保険**|**病気・ケガによる就業不能**|**本人の所得**|\n|**収入保障保険**|死亡・高度障害など|**遺族などの生活資金**|\n\n「特に下2つ、名前で判断しないでくださいね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n病気で働けなくなり、収入が減少した。\n\n何の保険？\n\n……\n\n### **所得補償保険。**\n\n---\n\n### Q2\n\n所得補償保険は、必ず入院していなければならない？\n\n……\n\n### **❌必ずしもそうではありません。**\n\n重要なのは契約所定の、\n\n### **就業不能状態**\n\nに該当するかです。\n\n---\n\n### Q3\n\n「収入保障保険」と「所得補償保険」の違いは？\n\n……\n\n### **収入保障保険**\n\n→ 死亡などに備えて遺族などを守る\n\n### **所得補償保険**\n\n→ 病気・ケガで働けない本人の所得減少を補う\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **所得補償保険**  \n→ 病気・ケガで働けない\n\n② **何を補う？**  \n→ 所得の減少\n\n③ **キーワード**  \n→ 就業不能\n\n④ **入院必須？**  \n→ 必ずしも必要ではない\n\n⑤ **免責期間**  \n→ あり得る\n\n⑥ **収入保障保険との違い**  \n→ **死亡ではなく就業不能**\n\n# 【一文で覚える】\n\n> **「所得補償保険は、病気やケガによって契約所定の就業不能状態となり所得が減少した場合に、その所得損失を一定範囲で補償する保険。」**\n\n「先輩、最後に名前の罠だけ潰しますよ。」\n\n### 💀 亡くなって収入がなくなる\n\n→ **収入保障保険**\n\n### 🤒 生きているけど働けず所得が減る\n\n→ **所得補償保険**\n\n**『本人は生きている。でも働けない』**\n\nこれが所得補償保険の一番大事な絵です。\n\n---", "chapter": 2}]; let selectedChapter=1; let current=0, mode='全文', filtered=cards.map((_,i)=>i).filter(i=>(cards[i].chapter||1)===selectedChapter);
const $=id=>document.getElementById(id);
function normalizeHeading(s){return s.replace(/^#+\s*/, '').trim()}
function splitParts(raw){
 const lines=raw.split('\n'); const buckets={'A':[],'B':[],'C':[],'D':[],'復習':[]}; let key='A';
 for(const line of lines){ const h=normalizeHeading(line);
   if(/^B【/.test(h)) key='B'; else if(/^C【/.test(h)) key='C'; else if(/^D【/.test(h)) key='D'; else if(/【理解確認|【30秒復習|【一文で覚える|【最後の一言/.test(h)) key='復習';
   buckets[key].push(line);
 } return buckets;
}
function renderList(){const q=$('search').value.trim().toLowerCase(); filtered=cards.map((c,i)=>[c,i]).filter(([c])=>(c.chapter||1)===selectedChapter&&(!q||(c.title+'\n'+c.raw).toLowerCase().includes(q))).map(x=>x[1]);
 $('list').innerHTML=filtered.length?filtered.map(i=>`<button class="item ${i===current?'active':''}" data-i="${i}">${cards[i].n}. ${escapeHtml(cards[i].title)}</button>`).join(''):'<div class="empty">該当なし</div>';
 document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{current=+b.dataset.i; render();})
}

function render(){const c=cards[current]; $('kicker').textContent=`第${selectedChapter}章　カード ${c.n} / ${cards.filter(x=>(x.chapter||1)===selectedChapter).length}`; $('title').textContent=c.title;
 const parts=splitParts(c.raw); const modes=['全文','A','B','C','D','復習']; $('tabs').innerHTML=modes.map(m=>`<button class="tab ${m===mode?'active':''}" data-m="${m}">${m}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()}); $('content').textContent=mode==='全文'?c.raw:(parts[mode]||[]).join('\n').trim()||'この区分は原本内に独立見出しがありません。全文表示で確認してください。';
 const ci=cards.map((x,i)=>(x.chapter||1)===selectedChapter?i:-1).filter(i=>i>=0); $('prev').disabled=current===ci[0]; $('next').disabled=current===ci[ci.length-1]; renderList(); window.scrollTo({top:0,behavior:'smooth'});
}
$('chapterSelect').onchange=()=>{selectedChapter=Number($('chapterSelect').value);current=selectedChapter===1?0:59;$('search').value='';render()}; $('search').oninput=renderList; $('prev').onclick=()=>{const a=cards.map((x,i)=>(x.chapter||1)===selectedChapter?i:-1).filter(i=>i>=0);const j=a.indexOf(current);if(j>0){current=a[j-1];render()}}; $('next').onclick=()=>{const a=cards.map((x,i)=>(x.chapter||1)===selectedChapter?i:-1).filter(i=>i>=0);const j=a.indexOf(current);if(j<a.length-1){current=a[j+1];render()}}; render();
</script></body></html>
