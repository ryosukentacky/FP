た】\n\n先輩の家に台風が来ました。\n\n🌪️\n↓\n屋根が破損\n↓\n修理費100万円\n\n火災保険の契約上、この風災が補償対象だったとします。\n\nすると、\n\n### 発生した損害に対して保険金が支払われる\n\nというのが基本です。\n\n---\n\n「じゃあ修理費100万円なのに、“保険金額2,000万円だから2,000万円ください”は？」\n\n……\n\n### ❌そういう仕組みではありません。\n\n保険金額2,000万円というのは、\n\n> 「事故が起きたら必ず2,000万円もらえる」\n\nという意味ではなく、\n\n### 保険会社が負担する責任の限度額\n\nという意味だからです。\n\n「ここ、生命保険の死亡保険金額と感覚が違うので注意してください。」\n\n---\n\n# 【生命保険との比較】\n\n||生命保険|損害保険|\n|-|-|-|\n|主な対象|人の生死など|**偶然の事故による損害**|\n|代表例|定期・終身・養老|**火災・自動車・傷害**|\n|支払い|契約で定めた保険金など|**実際の損害が重要**|\n|基本イメージ|約束した保障|**損害を補う**|\n\n---\n\n# 「損害保険なら全部“実損額”だけ？」\n\n「ちょっと待ってください。ここは例外があります。」\n\n損害保険の中でも、\n\n### 傷害保険など\n\n契約で定めた金額を支払う**定額給付型**のものがあります。\n\nですから、\n\n> **損害保険＝すべて必ず実損填補**\n\nと覚えるのも正確ではありません。\n\n「基本原則と例外を分けて覚えましょう。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n損害保険の基本的な目的は？\n\n……\n\n### **偶然の事故などによって生じた損害を補償すること。**\n\n---\n\n### Q2\n\n火災保険に入っていれば、地震による火災も通常の火災保険だけで原則補償される？\n\n……\n\n### **されません。**\n\n地震・噴火・津波による損害には、原則として**地震保険**で備えます。\n\n---\n\n### Q3\n\n保険価額と保険金額の違いは？\n\n……\n\n**保険価額**\n→ 保険事故によって被る可能性のある経済的損害の最高限度を評価した額\n\n**保険金額**\n→ 契約で設定した保険会社の支払責任限度額\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **損害保険とは？**  \n→ 偶然の事故などによる損害を補う\n\n② **火災**  \n→ 火災保険\n\n③ **地震・噴火・津波**  \n→ 地震保険\n\n④ **自動車事故**  \n→ 自賠責＋任意保険など\n\n⑤ **傷害保険のキーワード**  \n→ 急激・偶然・外来\n\n⑥ **基本思想**  \n→ **損害を補填する**\n\n# 【一文で覚える】\n\n> **「損害保険は、火災・交通事故など偶然の事故によって生じた損害を補償する保険で、実際の損害を補うという考え方が基本となる。」**\n\n「はい、先輩。ここから損害保険のルールを一つずつ積み上げます。」\n\n**損害が発生**\n→ **保険で補う**\n→ **でも保険で必要以上に儲けさせない**\n\nこの考え方を持ったまま進んでください。\n\n次は **60「給付・反対給付均等の原則」** です。\n\n---", "chapter": 2}, {"n": 60, "title": "給付・反対給付均等の原則", "raw": "# 第2章 リスク管理 60\n\n## 給付・反対給付均等の原則\n\n### A【要点｜リスクが高い人ほど保険料も高くする】\n\n「はい、先輩。名前がものすごく堅いですが、中身はかなり素直です。」\n\n**給付・反対給付均等の原則**とは、\n\n> **保険会社が支払うと見込まれる保険金の大きさに応じて、契約者が負担する保険料も決める**\n\nという考え方です。\n\n簡単にすると、\n\n### リスクが低い\n\n→ 保険金支払いの可能性・期待額が小さい\n→ **保険料も低くなる方向**\n\n### リスクが高い\n\n→ 保険金支払いの可能性・期待額が大きい\n→ **保険料も高くなる方向**\n\nです。\n\n「つまり、**危険度に見合った保険料を負担する**ということですね。」\n\n---\n\n# B【詳しい解説｜「給付」と「反対給付」って何？】\n\n「まず言葉を分解しましょう。」\n\n### 給付\n\n保険会社\n↓\n契約者・被保険者側へ\n\n💰 **保険金などを支払う**\n\nこれが給付です。\n\n---\n\n### 反対給付\n\n契約者\n↓\n保険会社へ\n\n💰 **保険料を支払う**\n\nこちらが反対給付。\n\n「つまり、お金の矢印が逆なんですね。」\n\n### 契約者 → 保険会社\n\n**保険料**\n\n↕\n\n### 保険会社 → 契約者側\n\n**保険金**\n\nこの2つを、リスクに応じて釣り合わせる。\n\nだから、\n\n# **給付・反対給付均等**\n\nです。\n\n---\n\n# 「全員同じ保険料じゃダメなの？」\n\n「先輩、たとえば自動車保険を考えてください。」\n\nAさん\n→ 事故リスクが低い\n\nBさん\n→ 事故リスクが高い\n\nなのに、\n\nAさんも\n→ 年10万円\n\nBさんも\n→ 年10万円\n\nだったら？\n\n……\n\nAさんからすると、\n\n「え？自分のリスクは低いのに、どうして同じなの？」\n\nとなりますよね。\n\nそこで、\n\n> **それぞれの危険度に応じて保険料を設定する**\n\nという考え方が必要になります。\n\n---\n\n# 数式っぽくすると？\n\n「試験では数式をゴリゴリ計算する必要はありませんが、意味を見ましょう。」\n\nざっくり、\n\n> **保険料 ∝ 事故発生確率 × 損害額**\n\nというイメージです。\n\n---\n\nたとえば、\n\n### Aグループ\n\n事故発生確率\n→ 1％\n\n事故が起きたときの平均損害\n→ 100万円\n\nなら、\n\n期待される損害は、\n\n100万円 × 1％\n\n＝\n\n### 1万円\n\n---\n\n### Bグループ\n\n事故発生確率\n→ 5％\n\n平均損害\n→ 100万円\n\nなら、\n\n100万円 × 5％\n\n＝\n\n### 5万円\n\n「Bの方が保険会社から見た期待支払額が大きいですよね。」\n\nだから、\n\n### Bの方が保険料も高くなる方向\n\nになるわけです。\n\n---\n\n# 「じゃあ実際の保険料＝期待損害額だけ？」\n\n「いいえ。そこは違います。」\n\n実際の保険料には、\n\n保険会社の事業運営に必要な費用なども含まれます。\n\n以前やった、\n\n### 純保険料\n\n＋\n\n### 付加保険料\n\nですね。\n\n「給付・反対給付均等の原則は、**危険度と保険料負担の対応関係を理解する原則**として押さえてください。」\n\n---\n\n# 大数の法則ともつながる\n\n「先輩、かなり前にやった**大数の法則**、覚えていますか？」\n\n1人だけなら、\n\n「この人が今年事故を起こすか」\n\nなんて正確には分かりません。\n\nでも、\n\n1万人\n10万人\n100万人……\n\nと大量のデータを見ると、\n\n### 事故発生率が一定の割合に近づいていく。\n\nそこで保険会社は、\n\n事故発生確率\n↓\n予想損害額\n↓\n必要な保険料\n\nを計算しやすくなります。\n\n---\n\nつまり、\n\n### 大数の法則\n\n→ **事故率を予測する**\n\n↓\n\n### 給付・反対給付均等の原則\n\n→ **そのリスクに応じて保険料を負担させる**\n\nというつながりです。\n\n「別々の暗記事項じゃないんですよ。」\n\n---\n\n# 収支相等の原則とは何が違う？\n\n「これも前にやりましたね。混ざりやすいので整理します。」\n\n### 給付・反対給付均等の原則\n\n見るところは、\n\n> **個々のリスクと保険料のバランス**\n\n危険度が高い\n→ 保険料も高くなる方向。\n\n---\n\n### 収支相等の原則\n\n見るところは、\n\n> **保険制度全体のお金のバランス**\n\n入ってくる保険料等\n≒\n出ていく保険金等\n\nとなるように設計します。\n\n---\n\n「先輩、視点が違うんです。」\n\n### 個人・リスク側を見る\n\n→ **給付・反対給付均等**\n\n### 保険制度全体を見る\n\n→ **収支相等**\n\nです。\n\n---\n\n# C【イメージ理解｜遊園地のロッカー】\n\n「先輩、荷物を預かるサービスを想像してください。」\n\nAさん\n→ 1万円の荷物\n\nBさん\n→ 100万円の高価な荷物\n\nもし紛失時に全額補償するなら、\n\nBさんの方が運営側のリスクは大きいですよね。\n\nなのに、\n\nAさん\n→ 100円\n\nBさん\n→ 100円\n\nと同じ料金では、リスクと料金が釣り合いません。\n\nそこで、\n\n### リスク小\n\n⚖️\n保険料小\n\n### リスク大\n\n⚖️\n保険料大\n\nと釣り合わせる。\n\n「この天秤⚖️が、給付・反対給付均等の原則です。」\n\n---\n\n# D【具体例｜自動車保険】\n\n「たとえば、自動車保険で考えてみましょう。」\n\nAさんとBさんが同じ条件の車に乗っているとします。\n\nAさん\n→ リスクが比較的低い条件\n\nBさん\n→ リスクが比較的高い条件\n\n保険会社から見ると、\n\nBさんの方が、\n\n事故\n↓\n保険金支払い\n\nにつながる期待値が高い。\n\nだから、その他の条件も踏まえて、\n\n### Bさんの保険料が高くなる\n\nことがあります。\n\n「“この人が絶対事故を起こす”と言っているわけではありませんよ。」\n\nあくまで、\n\n### **統計的な危険度**\n\nを使って保険料を設計するわけです。\n\n---\n\n# 【3つの原則をつなげる】\n\nここまでに出てきたものを一本にしましょう。\n\n### ① 大数の法則\n\nたくさん集める\n↓\n事故発生率が予測しやすくなる\n\n### ② 給付・反対給付均等の原則\n\n予測したリスク\n↓\nそれに応じた保険料を設定\n\n### ③ 収支相等の原則\n\n契約者全体から集める保険料等\n↓\n支払う保険金等との収支を釣り合わせる\n\n「ほら、ちゃんと一つの仕組みになっています。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n給付とは、基本的に誰から誰へのお金？\n\n……\n\n### **保険会社 → 契約者・被保険者側**\n\nつまり保険金などです。\n\n---\n\n### Q2\n\n反対給付とは？\n\n……\n\n### **契約者 → 保険会社**\n\nつまり保険料です。\n\n---\n\n### Q3\n\n「保険制度全体で、収入と支出を釣り合わせる」という原則は？\n\n……\n\n### **収支相等の原則。**\n\n給付・反対給付均等の原則とは区別してください。\n\n---\n\n# 【30秒復習】\n\n① **給付**  \n→ 保険会社が支払う保険金など\n\n② **反対給付**  \n→ 契約者が払う保険料\n\n③ **リスク高い**  \n→ 保険料も高くなる方向\n\n④ **リスク低い**  \n→ 保険料も低くなる方向\n\n⑤ **大数の法則**  \n→ リスクを統計的に予測\n\n⑥ **収支相等との違い**  \n→ 個々のリスクと保険料の対応か、制度全体の収支か\n\n# 【一文で覚える】\n\n> **「給付・反対給付均等の原則とは、保険会社が負担する危険の大きさに応じて、契約者が負担する保険料も決めるという考え方。」**\n\n「名前に圧倒されなくて大丈夫ですよ、先輩。」\n\n### ⚖️ リスクと保険料を釣り合わせる\n\n＝ **給付・反対給付均等**\n\n### ⚖️ 保険制度全体の収入と支出を釣り合わせる\n\n＝ **収支相等**\n\nこの違いで覚えてください。\n\n次は **61「利得禁止の原則」** です。\n\n---", "chapter": 2}, {"n": 61, "title": "利得禁止の原則", "raw": "# 第2章 リスク管理 61\n\n## 利得禁止の原則\n\n### A【要点｜保険事故で「儲けてはいけない」】\n\n「はい、先輩。これは損害保険の根っこです。名前よりずっと簡単ですよ。」\n\n**利得禁止の原則**とは、\n\n> **損害保険によって、実際に生じた損害を超える利益を得てはいけない**\n\nという考え方です。\n\nたとえば、\n\n🔥火災による損害\n→ 500万円\n\nなのに、\n\n💰保険金\n→ 1,000万円\n\n受け取って500万円儲かる。\n\n### ❌基本的にこういうことは認めない。\n\n損害保険は、\n\n> **損害を埋めるためのもの**\n\nであって、\n\n> **事故を利用して儲けるためのもの**\n\nではないからです。\n\n---\n\n# B【詳しい解説｜なぜ禁止するの？】\n\n「先輩、もし事故が起きるほど儲かる保険だったらどうなります？」\n\nたとえば、\n\n🏠家の価値\n→ 2,000万円\n\n火災で全焼すると、\n\n💰4,000万円もらえる。\n\n……\n\n「あれ？家が燃えた方が2,000万円得するな」\n\nとなってしまいますよね。\n\nこれでは、\n\n### 保険事故が起こることに経済的メリット\n\nが生まれてしまいます。\n\nそこで、\n\n> **保険で事故前より経済的に有利な状態になることを防ぐ**\n\nというのが利得禁止の原則です。\n\n---\n\n# 「つまり100万円損したら？」\n\n「基本イメージはこうです。」\n\n事故前\n→ 財産1,000万円\n\n事故発生\n→ 100万円損害\n\n財産価値\n→ 900万円\n\n保険金\n→ 100万円\n\n結果、\n\n### 900万円＋100万円＝1,000万円\n\n事故前の状態まで戻った。\n\n「これが損害保険の基本なんです。」\n\n---\n\n# 損害200万円なのに300万円もらったら？\n\n事故前\n→ 1,000万円\n\n損害\n→ ▲200万円\n\n残り\n→ 800万円\n\nそこへ、\n\n保険金\n→ ＋300万円\n\nすると、\n\n### 1,100万円\n\nになってしまいます。\n\n「事故前より100万円増えてますよね。」\n\nだから、\n\n### ❌実際の損害を超えて利得する\n\nのは、損害保険の基本原則に反します。\n\n---\n\n# 「じゃあ2社の保険に入れば儲けられる？」\n\n「先輩、たぶんそこ考えましたよね？」\n\nたとえば建物について、\n\nA保険会社\n→ 1,000万円\n\nB保険会社\n→ 1,000万円\n\nと2つ契約。\n\n火災による実際の損害が、\n\n### 1,000万円\n\nだった。\n\n「Aから1,000万円、Bから1,000万円で合計2,000万円！」\n\n……\n\n### ❌基本的にはそうなりません。\n\n複数の損害保険契約があっても、\n\n> **実際の損害を超えて利益を得ることはできない**\n\nという考え方があります。\n\n「契約を増やせば事故で儲かる、という仕組みにはしないんです。」\n\n---\n\n# 「生命保険は？」\n\n「あ、ここがすごく大事です。」\n\nたとえば死亡保険。\n\nA生命\n→ 2,000万円\n\nB生命\n→ 3,000万円\n\nという契約があり、所定の条件を満たせば、\n\n### 合計5,000万円\n\nが支払われることがあります。\n\n「じゃあ、死亡による実際の損害はいくらだったか計算して、3,287万円まで……なんて普通はやりませんよね。」\n\n生命保険は基本的に、\n\n### **定額保険**\n\nとして契約で定めた金額を支払う仕組みだからです。\n\n一方、典型的な損害保険では、\n\n### **実際の損害**\n\nが重要になります。\n\n---\n\n# 「じゃあ傷害保険は？」\n\n「はい。59でちょっと触れましたね。ここは例外に注意です。」\n\n損害保険会社が扱う商品でも、\n\n### 傷害保険の死亡保険金・入院保険金など\n\n契約で決めた金額を支払う、\n\n### **定額給付**\n\nがあります。\n\nだから、\n\n> **“損害保険会社の商品は全部、実損額までしか出ない”**\n\nという理解は、\n\n### ❌間違いです。\n\n「利得禁止の原則は、特に**実損填補型の損害保険**を理解するときの基本原則、と考えてください。」\n\n---\n\n# 前回との違い\n\n「先輩、60と61が混ざりやすいので、ここで切ります。」\n\n### 給付・反対給付均等の原則\n\n⚖️\n\n**危険の大きさ**\n↕\n**保険料**\n\nを釣り合わせる。\n\n---\n\n### 利得禁止の原則\n\n🚫💰\n\n**実際の損害**\n↓\nそれ以上の利益を得ない。\n\n---\n\nつまり、\n\n> **給付・反対給付均等**\n→ 「保険料はいくら？」\n\n> **利得禁止**\n→ 「保険金をもらって儲けてない？」\n\nという違いです。\n\n---\n\n# C【イメージ理解｜穴を埋める】\n\n「先輩、地面に穴が開いたと思ってください。」\n\n事故前：\n\n────────\n\n事故発生：\n\n──── 🕳️ ────\n\n100万円分の穴です。\n\n保険は、\n\n💰100万円\n\nを持ってきて、\n\n────────\n\n### 穴を埋める。\n\nこれが損害保険。\n\n---\n\nところが、\n\n100万円の穴なのに、\n\n💰💰200万円\n\n入れたら、\n\n──── ⛰️ ────\n\n今度は山になってしまう。\n\n「先輩、**保険は穴を埋めるもの。山を作るものじゃない**んです。」\n\nこれで覚えてください。\n\n---\n\n# D【具体例｜火災で800万円の損害】\n\n先輩の建物に火災が発生。\n\n🔥🏠\n\n実際の損害\n→ **800万円**\n\n十分な保険金額が設定され、その他の条件も満たしているとします。\n\n基本的には、\n\n### 損害800万円を補う\n\nという考え方です。\n\n---\n\n「保険金額が2,000万円だから？」\n\n### 2,000万円もらえる？\n\n……\n\n### ❌違います。\n\n保険金額は、\n\n> **契約上の支払限度額**\n\nです。\n\n実際の損害が800万円なら、原則としてその実損を基礎に保険金を考えます。\n\n---\n\n# 「保険金額」と「損害額」を混ぜない\n\nここは63につながります。\n\n### 保険金額\n\n「最大ここまで保障します」\n\nという、\n\n### **契約上の限度額**\n\n---\n\n### 損害額\n\n事故によって、\n\n### **実際に失った金額**\n\nです。\n\n---\n\nたとえば、\n\n保険金額\n→ 3,000万円\n\n実際の損害\n→ 500万円\n\nだからといって、\n\n### 3,000万円受け取る\n\nわけではありません。\n\n「この感覚を持っておくと、火災保険がかなり分かりやすくなります。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n火災で500万円の実損が発生しました。\n\n保険によって1,000万円の利益を得るのは、何の原則に反する？\n\n……\n\n### **利得禁止の原則。**\n\n---\n\n### Q2\n\n利得禁止の原則が必要なのはなぜ？\n\n……\n\n保険事故によって、\n\n### **事故前より経済的に得することを防ぐため**\n\nです。\n\n---\n\n### Q3\n\n「リスクが高い人ほど、それに応じた保険料を負担する」という考え方は？\n\n……\n\n### **給付・反対給付均等の原則。**\n\n「はい。利得禁止とは別ですよ。」\n\n---\n\n# 【30秒復習】\n\n① **利得とは？**  \n→ 利益を得ること\n\n② **利得禁止とは？**  \n→ 損害を超えて儲けない\n\n③ **損害500万円**  \n→ 原則500万円を超える利得はさせない\n\n④ **複数契約なら倍取り？**  \n→ 原則できない\n\n⑤ **生命保険は？**  \n→ 基本的に定額保険\n\n⑥ **損害保険のイメージ**  \n→ **穴を埋める。山を作らない。**\n\n# 【一文で覚える】\n\n> **「利得禁止の原則とは、損害保険によって実際に生じた損害を超える経済的利益を得てはならないという原則。」**\n\n「先輩、60と61はセットですよ。」\n\n### 60 給付・反対給付均等\n\n→ ⚖️ **リスクと保険料を釣り合わせる**\n\n### 61 利得禁止\n\n→ 🕳️ **損害の穴だけ埋める**\n\nここを区別できれば大丈夫です。\n\n次は **62「損害保険料の構成」** です。\n\n---", "chapter": 2}, {"n": 62, "title": "損害保険料の構成", "raw": "# 第2章 リスク管理 62\n\n## 損害保険料の構成\n\n### A【要点｜保険料＝純保険料＋付加保険料】\n\n「はい、先輩。今回はかなり整理しやすいですよ。生命保険でやった話ともつながっています。」\n\n損害保険の保険料は、大きく、\n\n> **保険料 ＝ 純保険料 ＋ 付加保険料**\n\nで構成されます。\n\n### 純保険料\n\n→ **事故が起きたときの保険金支払いに充てる部分**\n\n### 付加保険料\n\n→ **保険会社を運営するための経費などに充てる部分**\n\n「つまり、保険料を100円払ったからといって、その100円全部が事故の保険金用ではないんですね。」\n\n---\n\n# B【詳しい解説①｜純保険料】\n\n「まず“純”という名前どおり、保険そのものの中心部分です。」\n\nたくさんの契約者から、\n\n💰💰💰💰💰\n\n保険料を集めます。\n\nその中から事故に遭った人へ、\n\n🔥火災\n🚗事故\n🌪️風災\n\nなどに対する、\n\n### **保険金**\n\nを支払います。\n\nその原資となる部分が、\n\n# **純保険料**\n\nです。\n\n---\n\n## 純保険料はどう決める？\n\n「ここで60の**給付・反対給付均等の原則**がつながります。」\n\n保険会社は、\n\n### 事故がどれくらいの頻度で起きるか\n\nと、\n\n### 事故1件あたりどれくらい損害が出るか\n\nを考えます。\n\nつまり大きく、\n\n> **事故の発生頻度 × 損害の大きさ**\n\nをもとに保険金支払いを予測します。\n\n---\n\nたとえば、\n\n1万人の契約者\n↓\n年間100件の事故\n↓\n1件平均50万円\n\nなら、\n\n100件 × 50万円\n\n＝\n\n### 5,000万円\n\n程度の保険金支払いが見込まれる。\n\n「こういう統計を利用して、必要な純保険料を計算するわけですね。」\n\nここには当然、\n\n### **大数の法則**\n\nも関係してきます。\n\n---\n\n# ② 付加保険料\n\n「でも先輩、保険会社って保険金を払うだけじゃ運営できませんよね。」\n\n社員の給与\n＋\n店舗・事務所\n＋\nシステム\n＋\n契約管理\n＋\n広告\n＋\n代理店関係のコスト\n\nなど、いろいろな費用が必要です。\n\nそこで、\n\n> **保険会社の事業運営に必要な経費などに充てる部分**\n\nが、\n\n# **付加保険料**\n\nです。\n\n---\n\n# 「純保険料だけ集めたらダメなの？」\n\n「考えてみてください。」\n\n契約者から、\n\n💰100億円\n\n集める。\n\n事故で、\n\n💸100億円\n\n支払う。\n\n残り、\n\n### 0円。\n\n……\n\n「社員の給料は？」\n\n「システム代は？」\n\n「契約管理は？」\n\n「事故調査は？」\n\nとなりますよね。\n\nだから、\n\n### 保険金支払い用\n\n→ 純保険料\n\nだけでなく、\n\n### 保険会社運営用\n\n→ 付加保険料\n\nも必要になるんです。\n\n---\n\n# 生命保険とのつながり\n\n「先輩、12でやったの覚えていますか？」\n\n生命保険でも、\n\n> **営業保険料 ＝ 純保険料 ＋ 付加保険料**\n\nという基本構造でした。\n\nつまり、\n\n### 生命保険\n\nでも\n\n### 損害保険\n\nでも\n\nこの大枠は同じです。\n\n「ここ、別々に暗記しなくていいですよ。」\n\n---\n\n# ただし純保険料の考え方が違う\n\n生命保険では、\n\n死亡率\n＋\n予定利率\n\nなどを使って純保険料を考えました。\n\n一方、損害保険では、\n\n### **事故発生の頻度**\n\nと\n\n### **損害の大きさ**\n\nなどを基礎に考えます。\n\n「何のリスクを保障しているのかが違うからですね。」\n\n---\n\n# C【イメージ理解｜2つの財布】\n\n「先輩が毎月1万円の損害保険料を払ったと思ってください。」\n\n💴10,000円\n\n保険会社に入ると、イメージとして2つの財布に分かれます。\n\n### 財布① 🧰\n\n**純保険料**\n\n「事故が起きた人のために使います」\n\n🔥🚗🌪️\n↓\n💰保険金\n\n---\n\n### 財布② 🏢\n\n**付加保険料**\n\n「保険会社を動かすために使います」\n\n👨‍💼人件費  \n💻システム  \n📄事務  \n🏢営業・管理\n\n---\n\n「先輩、“事故用の財布”と“会社運営用の財布”です。」\n\n---\n\n# D【具体例｜保険料10万円】\n\n「分かりやすさ優先の仮の数字ですよ。」\n\n年間保険料が、\n\n### 10万円\n\nだったとします。\n\n仮に、\n\n純保険料\n→ 7万円\n\n付加保険料\n→ 3万円\n\nなら、\n\n### 7万円\n\n事故発生時の保険金支払いの原資\n\n＋\n\n### 3万円\n\n保険会社の運営経費など\n\n＝\n\n### 保険料10万円\n\nとなります。\n\n「もちろん、実際の商品が必ず7：3という意味ではありませんよ。」\n\n---\n\n# ここまでの原則を全部つなげます\n\n「先輩、ここまでバラバラに見えていたものを一本にしますよ。」\n\n### 大数の法則\n\nたくさんのデータ\n↓\n事故発生率を予測しやすくする\n\n↓\n\n### 給付・反対給付均等の原則\n\nリスクに応じて\n↓\n適切な保険料を考える\n\n↓\n\n### 純保険料\n\n事故による保険金支払いに備える\n\n＋\n\n### 付加保険料\n\n会社の運営費用などに備える\n\n↓\n\n# 契約者が支払う保険料\n\n「ほら。ちゃんと全部つながっているでしょう？」\n\n---\n\n# 「収支相等の原則は？」\n\n「あ、そこまで思い出せたらかなりいいです。」\n\n契約者全体から集める、\n\n### 保険料等\n\nと、\n\n保険会社が支払う、\n\n### 保険金等\n\nの収支が均衡するように設計する。\n\nこれが、\n\n### **収支相等の原則**\n\nでした。\n\nつまり、\n\n**大数の法則**\n→ 事故を予測\n\n**給付・反対給付均等**\n→ リスクに応じた負担\n\n**純保険料＋付加保険料**\n→ 実際の保険料を構成\n\n**収支相等**\n→ 保険制度全体を成立させる\n\nという関係です。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n損害保険料を大きく2つに分けると？\n\n……\n\n### **純保険料＋付加保険料**\n\nです。\n\n---\n\n### Q2\n\n保険金の支払いに充てる部分は？\n\n……\n\n### **純保険料。**\n\n---\n\n### Q3\n\n保険会社の事業運営に必要な経費などに充てる部分は？\n\n……\n\n### **付加保険料。**\n\n「ここを逆にしないでくださいね。」\n\n---\n\n# 【30秒復習】\n\n① **保険料**  \n→ 純＋付加\n\n② **純保険料**  \n→ 保険金支払いの原資\n\n③ **付加保険料**  \n→ 会社運営の経費など\n\n④ **事故発生率の予測**  \n→ 大数の法則\n\n⑤ **危険度と保険料を対応**  \n→ 給付・反対給付均等\n\n⑥ **制度全体の収支**  \n→ 収支相等\n\n# 【一文で覚える】\n\n> **「損害保険料は、事故発生時の保険金支払いに充てる純保険料と、保険会社の事業運営費などに充てる付加保険料から構成される。」**\n\n「先輩、これはシンプルに、\n\n### 💰保険料\n\n＝\n\n### 🚑事故用の純保険料\n\n＋\n\n### 🏢会社運営用の付加保険料\n\nで固定してください。」\n\n次は、火災保険に入る前に絶対に区別しておきたい **63「保険金額と保険価額」** です。\n\n---", "chapter": 2}, {"n": 63, "title": "保険金額と保険価額", "raw": "# 第2章 リスク管理 63\n\n## 保険金額と保険価額\n\n### A【要点｜「契約した上限」と「モノの価値」を分ける】\n\n「はい、先輩。ここは火災保険に入る前の超重要ポイントです。言葉が似ていますが、別物ですよ。」\n\n> **保険金額＝契約で設定した保険会社の支払責任の限度額**\n\n> **保険価額＝保険事故によって被る可能性のある経済的損害の最高限度額**\n\nたとえば、\n\n🏠建物の保険価額\n→ **3,000万円**\n\n🔥火災保険の保険金額\n→ **2,000万円**\n\nなら、\n\n**建物自体の価値**\n→ 3,000万円\n\n**契約で設定した保障の上限**\n→ 2,000万円\n\nです。\n\n「まず、**価額＝価値、金額＝契約額**で覚えてください。」\n\n---\n\n# B【詳しい解説①｜保険価額とは？】\n\n「先輩が3,000万円の建物を持っているとしましょう。」\n\nその建物が全焼した場合に失う経済的価値が、\n\n### 3,000万円\n\nなら、これが保険価額を考える基礎になります。\n\nつまり、\n\n> **その保険の対象について、保険事故によって失う可能性のある経済的利益の限度**\n\nですね。\n\n---\n\n「じゃあ先輩、“うちの家は思い出があるから1億円の価値です！”と言えば？」\n\n……\n\n「気持ちは分かりますけど、保険価額はそういう話ではありません。」\n\n### **経済的な価値**\n\nを基準に考えます。\n\n---\n\n# ② 保険金額とは？\n\n一方、\n\n### **保険金額**\n\nは契約上の数字です。\n\nたとえば建物の価値が、\n\n3,000万円\n\nだったとして、\n\n火災保険を、\n\n### 3,000万円\n\nで契約することもあれば、\n\n契約内容によっては、\n\n### 2,000万円\n\nなどで設定されている場合もあります。\n\n「つまり、保険価額は**対象物側の数字**、保険金額は**契約側の数字**というイメージです。」\n\n---\n\n# ③ 保険価額＝保険金額なら？\n\n「ここから3パターンに分けます。」\n\n建物の保険価額\n→ 3,000万円\n\n保険金額\n→ 3,000万円\n\nなら、\n\n### **全部保険**\n\nといいます。\n\nつまり、\n\n> **保険価額＝保険金額**\n\nです。\n\n---\n\n# ④ 保険金額＜保険価額なら？\n\n建物価値\n→ 3,000万円\n\n保険金額\n→ 2,000万円\n\nなら、\n\n### **一部保険**\n\nです。\n\nつまり、\n\n> **保険金額＜保険価額**\n\n「建物の価値全部までは保険を設定していない状態ですね。」\n\n---\n\n# ⑤ 保険金額＞保険価額なら？\n\n今度は、\n\n建物価値\n→ 3,000万円\n\n保険金額\n→ 4,000万円\n\nとします。\n\nこれは、\n\n### **超過保険**\n\nです。\n\nつまり、\n\n> **保険金額＞保険価額**\n\nですね。\n\n---\n\n「え？じゃあ3,000万円の家を4,000万円で契約して、全焼したら4,000万円もらって1,000万円儲かる？」\n\n……\n\n### 「先輩、61を思い出してください。」\n\n# **利得禁止の原則**\n\nがありました。\n\n実際の損害を超えて、\n\n### 保険で利益を得る\n\nのが基本的に認められない。\n\nだから、\n\n> **保険金額を大きく設定した＝その金額を必ず受け取れる**\n\nではありません。\n\n---\n\n# ⑥ 「保険金」とも区別してください\n\n「もう一つ似た言葉があります。」\n\n### 保険金額\n\n契約時に決める、\n\n> **支払限度額**\n\nです。\n\n---\n\n### 保険金\n\n事故発生後、契約条件に基づいて、\n\n> **実際に保険会社から支払われるお金**\n\nです。\n\n---\n\nたとえば、\n\n保険金額\n→ 3,000万円\n\n火災による損害\n→ 500万円\n\n支払われる保険金\n→ 契約条件等に基づいて算定\n\nとなります。\n\n「**保険金額3,000万円だから事故のたびに3,000万円もらえる**、ではありませんよ。」\n\n---\n\n# C【イメージ理解｜値札と保障シール】\n\n「先輩、家に2枚の札が貼ってあると思ってください。」\n\n🏠\n\n### 🏷️値札\n\n**3,000万円**\n\nこれが、\n\n### 保険価額\n\n「この家には3,000万円の経済的価値があります」\n\n---\n\nその横に、\n\n### 🛡️保障シール\n\n**2,000万円まで**\n\nこれが、\n\n### 保険金額\n\n「保険契約として設定した金額はこちらです」\n\n---\n\nだから、\n\n### 価額＝モノ側\n\n### 金額＝契約側\n\nです。\n\n「漢字の“価”を見たら**価値**を思い出してください。」\n\n---\n\n# D【具体例｜3つの家】\n\n全部、\n\n### 保険価額3,000万円\n\nの家だとします。\n\n---\n\n## Aさん\n\n保険金額\n→ 3,000万円\n\n3,000＝3,000\n\n### **全部保険**\n\n---\n\n## Bさん\n\n保険金額\n→ 2,000万円\n\n2,000＜3,000\n\n### **一部保険**\n\n---\n\n## Cさん\n\n保険金額\n→ 4,000万円\n\n4,000＞3,000\n\n### **超過保険**\n\n---\n\n「先輩、数式にすれば一瞬ですよ。」\n\n### 金額 ＝ 価額\n\n→ 全部\n\n### 金額 ＜ 価額\n\n→ 一部\n\n### 金額 ＞ 価額\n\n→ 超過\n\n---\n\n# 「一部保険なら、損害額は全部もらえないの？」\n\n「ここ、良いところです。」\n\n一部保険の場合の保険金の計算方法は、契約内容によって異なります。\n\n古典的には、\n\n> **損害額 × 保険金額 ÷ 保険価額**\n\nという比例てん補の考え方があります。\n\nたとえば、\n\n保険価額\n→ 3,000万円\n\n保険金額\n→ 1,500万円\n\n損害\n→ 1,000万円\n\nなら、\n\n1,000万円 ×\n1,500万円 ÷ 3,000万円\n\n＝\n\n### 500万円\n\nという考え方です。\n\nただし、現在の火災保険商品では契約方式によって支払方法が異なるため、\n\n### 「一部保険なら必ずこの式」\n\nと無条件に当てはめないでください。\n\n「FPではまず**全部・一部・超過の区別**を確実にしましょう。」\n\n---\n\n# 【61とのつながり】\n\n「先輩、ここまでちゃんとつながっていますよ。」\n\n### 保険価額3,000万円\n\nなのに、\n\n### 保険金額5,000万円\n\n↓\n\n「5,000万円もらえる！」\n\nではありません。\n\n↓\n\n### 利得禁止の原則\n\n↓\n\n実際の損害を超えて儲けさせない。\n\n「だから保険価額という概念が大事になるんですね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n建物の経済的価値そのものを表すのは？\n\n……\n\n### **保険価額。**\n\n「価＝価値」です。\n\n---\n\n### Q2\n\n保険価額3,000万円、保険金額2,000万円。\n\nこれは？\n\n……\n\n2,000＜3,000なので、\n\n### **一部保険。**\n\n---\n\n### Q3\n\n保険価額3,000万円、保険金額4,000万円。\n\nこれは？\n\n……\n\n4,000＞3,000なので、\n\n### **超過保険。**\n\n「だからといって、事故で4,000万円儲けられるわけではありません。」\n\n---\n\n# 【30秒復習】\n\n① **保険価額**  \n→ モノの経済的価値\n\n② **保険金額**  \n→ 契約上の支払限度額\n\n③ **金額＝価額**  \n→ 全部保険\n\n④ **金額＜価額**  \n→ 一部保険\n\n⑤ **金額＞価額**  \n→ 超過保険\n\n⑥ **超過分で儲ける？**  \n→ ❌ 利得禁止\n\n# 【一文で覚える】\n\n> **「保険価額は保険事故で失う可能性のある経済的価値、保険金額は契約上の支払限度額で、金額＝価額なら全部保険、金額＜価額なら一部保険、金額＞価額なら超過保険。」**\n\n「はい、先輩。ここは漢字で切れば簡単です。」\n\n### **価額 → 価値**\n\n### **金額 → 契約した額**\n\nそして、\n\n### ＝ 全部\n\n### ＜ 一部\n\n### ＞ 超過\n\nです。\n\n次は、この知識をそのまま使う **64「火災保険」** に進みます。\n\n---", "chapter": 2}, {"n": 64, "title": "火災保険", "raw": "# 第2章 リスク管理 64\n\n## 火災保険\n\n### A【要点｜「火事だけ」の保険ではありません】\n\n「はい、先輩。名前が**火災保険**なので、“火事になったときだけ使う保険”と思いやすいんですが……そこ、最初に直しますよ。」\n\n火災保険は契約内容に応じて、\n\n> **火災だけでなく、落雷・破裂・爆発・風災・雹災・雪災・水災など、さまざまな偶然の事故による建物や家財の損害を補償する保険**\n\nです。\n\nただし、非常に重要なのが、\n\n> **地震・噴火・津波を原因とする損害は、通常の火災保険では原則補償されない**\n\nこと。\n\n地震リスクには、基本的に、\n\n### **地震保険**\n\nを火災保険に付帯して備えます。\n\n---\n\n# B【詳しい解説①｜何に保険をかけるの？】\n\n「先輩、まず“家”を一つの塊だと思わないでください。」\n\n火災保険では、\n\n### 🏠 建物\n\nと、\n\n### 🛋️ 家財\n\nを分けて考えます。\n\n---\n\n## 建物\n\nたとえば、\n\n住宅本体\n＋\n門\n＋\n塀\n＋\n物置\n\nなど、契約上建物に含まれるもの。\n\n---\n\n## 家財\n\nたとえば、\n\nテレビ\n冷蔵庫\nソファ\nベッド\n衣類\n\nなどです。\n\n「つまり、建物だけ火災保険に入ったからといって、家財まで当然に全部補償されるとは限りません。」\n\n### 建物\n\nと\n\n### 家財\n\nは保険の対象を確認する必要があります。\n\n---\n\n# ② どんな事故を補償する？\n\n「代表例を原因別に見ましょう。」\n\n### 🔥 火災\n\n料理中に火が燃え広がって建物が焼けた。\n\n→ 補償対象になり得る。\n\n---\n\n### ⚡ 落雷\n\n雷によって建物・家財などに損害。\n\n→ 契約内容に応じて補償。\n\n---\n\n### 💥 破裂・爆発\n\nガス爆発などによって建物が損傷。\n\n→ 補償対象になり得る。\n\n---\n\n### 🌪️ 風災\n\n台風・強風などで屋根が壊れた。\n\n→ 補償対象になり得る。\n\n---\n\n### 🧊 雹災\n\n雹によって屋根などが損傷。\n\n→ 補償対象になり得る。\n\n---\n\n### ❄️ 雪災\n\n大雪の重みで屋根が損傷。\n\n→ 補償対象になり得る。\n\n---\n\n### 🌊 水災\n\n台風や豪雨などによる洪水で家が浸水。\n\n→ **水災補償を付けているなど、契約条件を満たせば補償対象になり得ます。**\n\n「ここは“火災保険なら何でも自動的に全部付いている”ではありません。商品・プランによって補償範囲を確認します。」\n\n---\n\n# ③ 「水災」と「水濡れ」は違う\n\n「先輩、これ、言葉が似ているので要注意です。」\n\n### 水災\n\n大雨\n↓\n洪水\n↓\n浸水\n\nなど。\n\n🌧️🌊🏠\n\n---\n\n### 水濡れ\n\nたとえば、\n\nマンション上階の給排水設備の事故\n↓\n水が漏れる\n↓\n天井や家財が濡れる\n\n💧🏢\n\nなどです。\n\n「どっちも水ですが、**事故原因が違う**んですよ。」\n\n---\n\n# ④ 一番重要｜地震\n\n「では先輩。」\n\n地震が発生\n↓\n家が揺れる\n↓\nストーブが倒れる\n↓\n🔥火災発生\n\nこれは火災ですよね。\n\n「じゃあ火災保険で払われる？」\n\n……\n\n### **原則、払われません。**\n\nなぜなら、\n\n### 火災の原因が地震\n\nだからです。\n\n---\n\nここ、試験でかなり重要です。\n\n### 普通の火災\n\n🔥\n→ 火災保険\n\n### 地震による火災\n\n🌏→🔥\n→ **通常の火災保険では原則対象外**\n\n### 地震による倒壊\n\n🌏→🏚️\n→ **通常の火災保険では原則対象外**\n\n### 津波による損害\n\n🌏→🌊→🏠\n→ **通常の火災保険では原則対象外**\n\n「だから次に勉強する**地震保険**が必要なんです。」\n\n---\n\n# ⑤ 「隣の家から火が燃え移ったら？」\n\n「ここも先輩、気になりますよね。」\n\n隣家\n🔥\n↓\n🔥\n↓\n自宅\n\nという**類焼**です。\n\n自分が悪くなくても、自宅に損害が発生します。\n\nそして日本には、このあと65でやる、\n\n### **失火責任法**\n\nがあります。\n\n一定の場合、軽過失による失火では、失火者が隣家への損害賠償責任を負わないことがあります。\n\n「え？隣の人が火事を出したのに？」\n\nはい。\n\nだから、\n\n> **自分の建物・家財は自分の火災保険で備える**\n\nという考え方が非常に重要になります。\n\n---\n\n# ⑥ 借家の場合は？\n\n「自分の家じゃない場合も見ましょう。」\n\n先輩が賃貸マンションに住んでいて、\n\n自分の不注意で火災\n↓\n借りている部屋に損害\n↓\n大家さんに対して責任を負う\n\nというケースがあります。\n\nそこで、\n\n### **借家人賠償責任保険**\n\nなどによって、大家さんに対する損害賠償責任に備えることがあります。\n\n「自分の家財を守る保険と、大家さんへの賠償責任を守る保険は、目的が違うんですね。」\n\n---\n\n# C【イメージ理解｜家にバリアを張る】\n\n「火災保険を、家の周りに張る防御バリアだと思ってください。」\n\n🏠\n\n周囲から、\n\n🔥 火災  \n⚡ 落雷  \n💥 爆発  \n🌪️ 風災  \n🧊 雹災  \n❄️ 雪災  \n🌊 水災\n\nなどが飛んできます。\n\n契約している補償なら、\n\n🛡️火災保険\n\nで守る。\n\nところが、\n\n🌏 **地震**\n\nが来た。\n\n🛡️「それは私の担当外です」\n\nとなる。\n\nそこで、\n\n### 🌏地震保険\n\nという別の防御を組み合わせる。\n\n「“火災保険＝家に起きる事故全部”ではない。ここが重要です。」\n\n---\n\n# D【具体例｜4つの事故を判定】\n\n### ケース①\n\n料理中に火災。\n\n🔥🏠\n\n→ **火災保険の補償対象になり得る**\n\n---\n\n### ケース②\n\n台風の強風で屋根が破損。\n\n🌪️🏠\n\n→ **風災として補償対象になり得る**\n\n---\n\n### ケース③\n\n豪雨による洪水で床上浸水。\n\n🌧️🌊🏠\n\n→ 水災補償があり、支払条件を満たせば、\n\n### **補償対象になり得る**\n\n---\n\n### ケース④\n\n地震で火災。\n\n🌏\n↓\n🔥🏠\n\n「火事だから火災保険！」\n\n……\n\n### ❌原則違います。\n\n地震を原因とする火災なので、\n\n### **通常の火災保険では原則補償されません。**\n\n地震保険の領域です。\n\n---\n\n# 【火災保険でまず確認する4点】\n\n「問題でも実生活でも、この順番で見れば整理できます。」\n\n### ① 何が被害を受けた？\n\n→ 建物？家財？\n\n### ② 何が原因？\n\n→ 火災？風災？水災？地震？\n\n### ③ その補償を契約している？\n\n→ 水災などは契約内容を確認\n\n### ④ 支払条件を満たす？\n\n→ 免責金額など契約条件を確認\n\n「**原因→補償内容**の順で見るんですよ。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n台風の強風で屋根が壊れました。\n\n火災保険の対象になり得る？\n\n……\n\n### **はい。**\n\n風災として補償対象になり得ます。\n\n---\n\n### Q2\n\n地震が原因で火災が発生しました。\n\n通常の火災保険だけで原則補償される？\n\n……\n\n### **されません。**\n\n地震を原因とする火災だからです。\n\n---\n\n### Q3\n\n建物だけ火災保険を契約していれば、家財も必ず補償される？\n\n……\n\n### **いいえ。**\n\n建物と家財は、保険の対象をそれぞれ確認します。\n\n---\n\n# 【30秒復習】\n\n① **火災保険＝火事だけ？**  \n→ ❌\n\n② **風災**  \n→ 対象になり得る\n\n③ **水災**  \n→ 契約内容・条件による\n\n④ **建物と家財**  \n→ 分けて確認\n\n⑤ **地震による火災**  \n→ 通常の火災保険では原則対象外\n\n⑥ **地震・噴火・津波**  \n→ **地震保険で備える**\n\n# 【一文で覚える】\n\n> **「火災保険は、火災だけでなく契約に応じて落雷・破裂爆発・風災・雹災・雪災・水災などを補償するが、地震・噴火・津波を原因とする損害は通常の火災保険では原則補償されない。」**\n\n「先輩、ここは**何が起きたかより、何が原因だったか**まで見てください。」\n\n🔥火災  \n→ 火災保険\n\n🌏→🔥地震火災  \n→ **通常の火災保険では原則×**\n\nそして隣家から火が来た場合にも関係してくるのが、次の **65「失火責任法」** です。\n\n---", "chapter": 2}, {"n": 65, "title": "失火責任法（しっかせきにんほう）", "raw": "# 第2章 リスク管理 65\n\n## 失火責任法（しっかせきにんほう）\n\n### A【要点｜軽い不注意の火事なら、隣家への賠償責任を原則負わない】\n\n「はい、先輩。前回の火災保険とセットで覚えるところです。」\n\n普通なら、自分の不注意で他人に損害を与えれば、\n\n> **損害賠償責任を負う**\n\nのが基本ですよね。\n\nところが火災には特別ルールがあります。\n\n**失火責任法**では、\n\n> **失火者に重大な過失がない場合、民法709条による不法行為責任について、原則として損害賠償責任を負わない**\n\nとされています。\n\nつまり、\n\n### 軽過失による失火\n\n→ 原則、隣家への損害賠償責任を負わない\n\n### 重過失による失火\n\n→ **失火責任法による免責はされない**\n\nというのが最重要ポイントです。\n\n---\n\n# B【詳しい解説｜なぜ火事だけ特別なの？】\n\n「先輩、ちょっと想像してください。」\n\n昔の日本では木造住宅が密集していました。\n\n一軒で火事\n↓\n🔥\n↓\n隣へ\n↓\n🔥🔥\n↓\nさらに隣へ\n↓\n🔥🔥🔥🔥\n\nというように、火災が広範囲に拡大する可能性がありました。\n\n失火者一人に、\n\n「燃えた家全部を弁償してください」\n\nとすると、とてつもない賠償額になる可能性があります。\n\nそこで失火については、\n\n### **重大な過失がない限り、不法行為による損害賠償責任を原則として負わせない**\n\nという特別な扱いが設けられています。\n\n---\n\n# 「じゃあ隣の家を燃やしてもゼロ責任？」\n\n「先輩、その言い方は危ないです。」\n\nポイントは、\n\n# **重過失があるかどうか**\n\nです。\n\n---\n\n## 軽過失\n\n普通の不注意程度。\n\n→ **失火責任法が適用されれば、不法行為責任は原則負わない**\n\n---\n\n## 重過失\n\n「普通なら絶対にそんな危険なことしないでしょう」というレベルの、著しい注意欠如。\n\n→ **失火責任法による免責なし**\n\n→ 損害賠償責任を負う可能性があります。\n\n---\n\n# 「重過失って具体的に何？」\n\n「これは個別事情によって判断されるので、“これなら絶対重過失”と機械的に決めないでくださいね。」\n\nたとえば、\n\n### 火気について極めて危険な扱いをした\n\nなど、\n\n> **わずかな注意をすれば結果を予見・回避できたのに、それすら怠った**\n\nような場合に重過失が問題になります。\n\n「FPではまず、」\n\n### 軽過失 → 原則免責\n\n### 重過失 → 免責されない\n\nで押さえれば大丈夫です。\n\n---\n\n# ここで超重要｜自分の家は誰が直す？\n\n「さて先輩。」\n\n隣のAさん宅\n🔥\n↓\n火が燃え移る\n↓\n先輩の家\n🏠🔥\n\nAさんには重大な過失がなく、失火責任法が適用された。\n\n先輩が、\n\n「Aさん、家の修理代2,000万円払って！」\n\nと言っても、\n\n### 不法行為による賠償を請求できない場合があります。\n\n「え……じゃあ誰が払うの？」\n\n……\n\n### **だから自分で火災保険に入っておくんです。**\n\nここが64と65のつながりです。\n\n---\n\n# 火災保険が重要な理由\n\n隣家から出火\n↓\n自宅へ延焼\n↓\n失火者が軽過失\n↓\n失火責任法\n↓\n相手に損害賠償請求できないことがある\n↓\n\n### 自分の火災保険で備える\n\n「“自分は火事を出さないから火災保険はいらない”ではないんですよ。」\n\n### **他人の家から火が来る可能性**\n\nもあるからです。\n\n---\n\n# もう一つ重要｜賃貸住宅\n\n「ここから少し難しくなります。先輩、集中してください。」\n\n先輩が、\n\n🏢大家さんから部屋を借りている\n\nとします。\n\n先輩の不注意で、\n\n🔥火災\n\nを起こしてしまった。\n\n---\n\n「軽過失だから失火責任法で全部免責！」\n\n……\n\n### **とは限りません。**\n\nなぜなら、大家さんとの間には、\n\n### **賃貸借契約**\n\nがあるからです。\n\n---\n\n失火責任法が問題にするのは基本的に、\n\n### 不法行為による損害賠償責任\n\nです。\n\nしかし借主には、賃貸借契約に基づく義務があります。\n\n火災によって借りていた部屋を損傷させれば、\n\n### **債務不履行に基づく損害賠償責任**\n\nが問題になることがあります。\n\n---\n\n「ここ、試験でも大事です。」\n\n### 隣家への責任\n\n軽過失による失火\n→ 失火責任法\n→ **不法行為責任は原則免責**\n\n---\n\n### 借りている部屋の大家さんへの責任\n\n賃貸借契約\n→ **債務不履行責任が問題になる**\n\n→ 失火責任法だけで当然に免責されるわけではない\n\nだから賃貸では、\n\n# **借家人賠償責任保険**\n\nが重要になるんです。\n\n---\n\n# C【イメージ理解｜火事だけ特別な盾がある】\n\n「先輩、自分の不注意で他人の物を壊したとします。」\n\n💥\n↓\n他人の物\n↓\n損害賠償\n\n普通はこうですよね。\n\nところが、\n\n🔥失火\n\nの場合には、\n\n### 🛡️失火責任法\n\nという特別な盾が出てきます。\n\n軽過失なら、\n\n🔥 → 🛡️ → 隣家への不法行為責任を原則免責\n\nでも、\n\n### 重過失\n\nなら、\n\n🔥🔥🔥\n↓\n💥🛡️\n\n### 盾が使えない。\n\n「これで覚えてください。」\n\n---\n\n# D【具体例｜3つのケース】\n\n## ケース① 隣家への延焼・軽過失\n\nAさん宅\n🔥\n↓\nBさん宅へ延焼\n\nAさん\n→ 軽過失\n\nこの場合、\n\n### 失火責任法により、AさんはBさんに対する不法行為責任を原則負わない。\n\nだからBさんは、\n\n### 自分の火災保険\n\nで備えることが重要です。\n\n---\n\n## ケース② 隣家への延焼・重過失\n\nAさん\n→ **重過失**\n\n🔥\n↓\nBさん宅\n\nこの場合、\n\n### 失火責任法による免責はありません。\n\nAさんが損害賠償責任を負う可能性があります。\n\n---\n\n## ケース③ 賃貸マンション\n\n先輩\n→ 賃借人\n\n大家さん\n→ 建物所有者\n\n先輩の失火\n↓\n借りている部屋を損傷\n\n「軽過失だから失火責任法！」\n\n……\n\n### それだけでは終わりません。\n\n大家さんとの、\n\n### **賃貸借契約上の債務不履行責任**\n\nが問題になるからです。\n\nそこで、\n\n### **借家人賠償責任保険**\n\nで備えるわけです。\n\n---\n\n# 【失火責任法を3行で整理】\n\n### 軽過失\n\n→ 隣家への不法行為責任は**原則免責**\n\n### 重過失\n\n→ **免責されない**\n\n### 大家への契約上の責任\n\n→ **失火責任法だけでは免責されない**\n\n「この3つ、かなり重要ですよ。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n軽過失で火災を起こし、隣家に延焼した。\n\n失火責任法が適用されれば？\n\n……\n\n### **不法行為による損害賠償責任を原則負いません。**\n\n---\n\n### Q2\n\n重過失なら？\n\n……\n\n### **失火責任法による免責はありません。**\n\n---\n\n### Q3\n\n賃貸住宅で借主が失火し、大家さんの建物を損傷させた。\n\n「軽過失だから絶対に責任なし」でいい？\n\n……\n\n### **ダメです。**\n\n賃貸借契約に基づく、\n\n### **債務不履行責任**\n\nが問題になるためです。\n\n---\n\n# 【30秒復習】\n\n① **失火責任法**  \n→ 失火の責任を制限\n\n② **軽過失**  \n→ 不法行為責任は原則免責\n\n③ **重過失**  \n→ 免責なし\n\n④ **隣家から延焼されたら？**  \n→ 自分の火災保険が重要\n\n⑤ **賃貸で大家への責任**  \n→ 契約上の責任が問題\n\n⑥ **その備え**  \n→ 借家人賠償責任保険\n\n# 【一文で覚える】\n\n> **「失火責任法では、重大な過失がない失火について不法行為による損害賠償責任を原則免責するが、重過失の場合や賃貸借契約上の債務不履行責任は別に考える。」**\n\n「先輩、これで火災保険が必要な理由も一段深くなりましたね。」\n\n### 自分が火を出す\n\nだけではなく、\n\n### 隣から火が来る\n\n↓\n\n### 相手に請求できないことがある\n\n↓\n\n### **自分の火災保険で守る**\n\nということです。\n\n次は、火災保険だけでは守れなかった部分――**66「地震保険」**です。\n\n---", "chapter": 2}, {"n": 66, "title": "地震保険", "raw": "# 第2章 リスク管理 66\n\n## 地震保険\n\n### A【要点｜地震・噴火・津波は「火災保険とは別枠」】\n\n「はい、先輩。前回までの火災保険から、そのままつながります。」\n\n地震保険は、\n\n> **地震・噴火、またはこれらによる津波を原因とする建物・家財の損害を補償する保険**\n\nです。\n\nそして最重要ポイントは、\n\n### ① 地震保険だけでは原則加入できない\n\n→ **火災保険に付帯して契約する**\n\n### ② 保険金額には上限がある\n\n→ 火災保険金額の**30％～50％**\n\nさらに、\n\n**建物：5,000万円まで**  \n**家財：1,000万円まで**\n\nという上限があります。\n\n「この数字、FPではかなり大事ですよ。」\n\n---\n\n# B【詳しい解説①｜なぜ火災保険とは別なの？】\n\n「まず前回の復習です。」\n\n普通の火災。\n\n🔥🏠\n\n→ 火災保険\n\nでは、\n\n地震\n🌏\n↓\n🔥火災\n↓\n🏠全焼\n\nなら？\n\n……\n\n「火災だから火災保険！」\n\n### ❌違いましたね。\n\n### **地震が原因**\n\nなので、通常の火災保険では原則補償されません。\n\n---\n\n同じように、\n\n### 地震による倒壊\n\n🌏→🏚️\n\n### 地震による火災\n\n🌏→🔥\n\n### 津波による流失\n\n🌏→🌊→🏠\n\nなどは、\n\n### **地震保険**\n\nで備えます。\n\n---\n\n# ② 地震保険単独では契約できない\n\n「ここはそのまま暗記してください。」\n\n地震保険は、\n\n### 火災保険\n\n＋\n\n### 地震保険\n\nという形で契約します。\n\nつまり、\n\n> **地震保険だけ単独で加入することはできません。**\n\n---\n\n「じゃあ、もう火災保険に入っていて地震保険を付けていなかったら？」\n\nそこ、いい質問です。\n\n### 火災保険の契約期間の途中から\n\n地震保険を付帯することもできます。\n\n---\n\n# ③ なぜ保険金額が火災保険より小さい？\n\n「先輩、ここは制度の目的を理解すると覚えやすいです。」\n\nたとえば、\n\n火災保険金額\n→ 3,000万円\n\nだったとしても、\n\n地震保険を、\n\n→ 3,000万円\n\nには原則設定できません。\n\n地震保険金額は、\n\n> **火災保険金額の30％～50％の範囲**\n\nで設定します。\n\n---\n\nたとえば、\n\n火災保険\n→ 3,000万円\n\nなら、\n\n30％\n→ 900万円\n\n50％\n→ 1,500万円\n\nなので、\n\n### 地震保険金額\n\n→ 900万～1,500万円\n\nの範囲です。\n\n---\n\n「え？家が3,000万円なのに、最大1,500万円？」\n\nはい。\n\n地震保険は、\n\n> **地震後の生活の安定に寄与する**\n\nことを目的とした制度で、火災保険のように住宅を完全に元通りにする費用をすべて補償することを目的とした制度ではありません。\n\n「だから“地震保険＝家を完全復旧させる保険”と思わないでください。」\n\n---\n\n# ④ さらに絶対額の上限\n\n「30～50％だけ覚えて終わりじゃありませんよ。」\n\n地震保険金額には、\n\n### 🏠 建物\n\n→ **5,000万円**\n\n### 🛋️ 家財\n\n→ **1,000万円**\n\nという上限があります。\n\n---\n\nたとえば、\n\n火災保険金額\n→ 建物2億円\n\n50％なら、\n\n→ 1億円\n\n「じゃあ地震保険1億円？」\n\n……\n\n### ❌できません。\n\n建物については、\n\n### **最大5,000万円**\n\nです。\n\n---\n\n# ⑤ 建物と家財は別\n\n「火災保険と同じく、ここも分けます。」\n\n### 建物\n\n🏠\n\nと、\n\n### 家財\n\n📺🛋️👕📚\n\nは別です。\n\n建物だけ地震保険を付けて、\n\n「テレビも家具も全部大丈夫！」\n\n……\n\nとは限りません。\n\n### 家財にも地震保険を付けているか\n\nを確認します。\n\n---\n\n# ⑥ 何でも家財になるわけではない\n\n「ここは試験で狙われやすいところです。」\n\n地震保険では、家財について、\n\n### 1個または1組の価額が30万円を超える貴金属・宝石・書画・骨董品など\n\nは、\n\n### **保険の対象になりません。**\n\n「“家の中にある物＝全部家財として地震保険対象”ではないんですね。」\n\n---\n\n# ⑦ 損害区分で保険金が決まる\n\n「普通の火災保険との感覚の違いがあります。」\n\n地震保険では、損害の程度を、\n\n### 全損\n\n### 大半損\n\n### 小半損\n\n### 一部損\n\nの4区分に認定します。\n\nそして、契約した地震保険金額に対して、\n\n|損害区分|支払われる割合|\n|-|-:|\n|全損|**100％**|\n|大半損|**60％**|\n|小半損|**30％**|\n|一部損|**5％**|\n\n「この **100・60・30・5** は数字問題で使えるので覚えておきましょう。」\n\nもちろん、それぞれ時価額に基づく支払限度があります。\n\n---\n\n# ⑧ 地震保険は国も関わっている\n\n「なぜ普通の民間保険と少し違う仕組みなんでしょう？」\n\n大地震が起きると、\n\n🏠🏠🏠🏠🏠\n↓\n一斉に巨大な損害\n\nが発生します。\n\n一つの保険会社だけで全部抱えるにはリスクが大きすぎます。\n\nそこで日本の地震保険は、\n\n> **政府と民間の損害保険会社が共同で運営する仕組み**\n\nになっています。\n\n「大災害だからこそ、国も再保険を通じて関わっているわけですね。」\n\n---\n\n# ⑨ 保険料はどこで変わる？\n\n「地震リスクは全国同じではありませんよね。」\n\n地震保険料は、\n\n### 建物の所在地\n\nと、\n\n### 建物の構造\n\nなどによって異なります。\n\nさらに、\n\n### 免震建築物割引\n\n### 耐震等級割引\n\n### 耐震診断割引\n\n### 建築年割引\n\nといった割引制度があります。\n\n「つまり、耐震性能などによって保険料が安くなる仕組みがあるんです。」\n\n---\n\n# ⑩ 地震保険料控除\n\n「あ、税金ともつながりますよ。」\n\n一定の地震保険料を支払った場合、\n\n### **地震保険料控除**\n\nという所得控除を受けられます。\n\n所得税では、\n\n> **最高5万円**\n\nが所得控除の対象です。\n\n「生命保険料控除とは別枠です。」\n\n---\n\n# C【イメージ理解｜火災保険の横に付ける地震専用シールド】\n\n「先輩、家を守るシールドを想像してください。」\n\n🏠\n\n普通の火災などには、\n\n### 🛡️火災保険\n\nところが、\n\n🌏地震！\n\n火災保険\n→「地震原因は原則担当外です」\n\nそこで、\n\n### 🛡️🌏地震保険\n\nを横に追加する。\n\nただし、この地震シールドは、\n\n### 火災保険の30～50％\n\nまで。\n\n「完全復旧用というより、**被災後の生活再建を支えるシールド**というイメージですね。」\n\n---\n\n# D【具体例｜3,000万円の住宅】\n\n先輩が住宅に、\n\n### 火災保険金額3,000万円\n\nを設定しています。\n\n地震保険を付ける場合、\n\n最低：\n\n3,000万円 × 30％\n＝\n\n### 900万円\n\n最大：\n\n3,000万円 × 50％\n＝\n\n### 1,500万円\n\nしたがって、\n\n### 地震保険金額は900万～1,500万円\n\nの範囲で設定します。\n\n---\n\n仮に、\n\n### 地震保険金額1,500万円\n\nに設定していて、\n\n損害が、\n\n### 大半損\n\nと認定されたら、\n\n1,500万円 × 60％\n\n＝\n\n### 900万円\n\nという計算イメージになります。\n\n「もちろん実際には時価額による限度なども確認します。」\n\n---\n\n# 【火災保険との違い】\n\n||火災保険|地震保険|\n|-|-|-|\n|普通の火災|○|―|\n|地震による火災|原則×|**○**|\n|地震による倒壊|原則×|**○**|\n|津波|原則×|**○**|\n|単独加入|○|**×**|\n|保険金額|契約による|**火災保険の30～50％**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n火災保険金額2,000万円。\n\n設定できる地震保険金額の基本範囲は？\n\n……\n\n30％\n→ 600万円\n\n50％\n→ 1,000万円\n\nしたがって、\n\n### **600万～1,000万円**\n\nです。\n\n---\n\n### Q2\n\n地震で火災が起きて住宅が焼失。\n\n通常の火災保険だけで原則補償される？\n\n……\n\n### **されません。**\n\n地震を原因とする火災だからです。\n\n---\n\n### Q3\n\n地震保険の保険金額の上限は？\n\n……\n\n### 建物 → **5,000万円**\n\n### 家財 → **1,000万円**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **対象原因**  \n→ 地震・噴火・津波\n\n② **単独加入**  \n→ ❌できない\n\n③ **何に付ける？**  \n→ 火災保険\n\n④ **保険金額**  \n→ 火災保険の30～50％\n\n⑤ **絶対上限**  \n→ 建物5,000万円・家財1,000万円\n\n⑥ **損害区分**  \n→ 全損100・大半損60・小半損30・一部損5％\n\n# 【一文で覚える】\n\n> **「地震保険は、地震・噴火・津波による建物・家財の損害を補償し、火災保険に付帯して契約し、保険金額は火災保険金額の30～50％で建物5,000万円・家財1,000万円が上限。」**\n\n「先輩、数字はこれだけ先に固定してください。」\n\n### **30～50％**\n\n### **建物5,000万円**\n\n### **家財1,000万円**\n\n### **100・60・30・5**\n\nそして、\n\n🌏→🔥なら  \n**普通の火災保険ではなく地震保険**\n\nです。\n\n次は **67「自動車保険」**。ここから自賠責・対人・対物・人身傷害・車両保険を一本につないでいきます。\n\n---", "chapter": 2}, {"n": 67, "title": "自動車保険", "raw": "# 第2章 リスク管理 67\n\n## 自動車保険\n\n### A【要点｜「強制の自賠責＋任意保険」で考える】\n\n「はい、先輩。ここから自動車保険です。最初に全体地図を作りますよ。」\n\n自動車事故では、\n\n🚗💥🚗\n\n事故によって、\n\n**相手をケガさせる\n相手の車を壊す\n自分や同乗者がケガする\n自分の車が壊れる**\n\nなど、いろいろな損害が発生します。\n\nそこで自動車保険は大きく、\n\n> **① 自賠責保険（強制保険）**  \n> **② 任意の自動車保険**\n\nの2段階で考えます。\n\n「特に重要なのは、自賠責が**何でも補償する保険ではない**ことです。」\n\n---\n\n# B【詳しい解説①｜まず自賠責保険】\n\n「車やバイクを運転するなら、まず土台になるのがこれです。」\n\n### 自賠責保険\n\n＝ **自動車損害賠償責任保険**\n\n法律によって加入が義務づけられているため、\n\n### **強制保険**\n\nとも呼ばれます。\n\n目的は、\n\n> **交通事故の被害者の人身損害を救済すること**\n\nです。\n\n---\n\n## 「人身損害」がポイント\n\n「先輩、ここで問題です。」\n\n自分が運転中に事故を起こして、\n\n### 相手をケガさせた\n\n→ 自賠責の対象になり得る。\n\nでは、\n\n### 相手の車を壊した\n\n→ 自賠責で補償？\n\n……\n\n### ❌されません。\n\n自賠責は、\n\n> **対人賠償のための保険**\n\nだからです。\n\n### 人\n\n→ ○\n\n### モノ\n\n→ ×\n\n「まずここを固定してください。」\n\n---\n\n# ② じゃあ自賠責だけで十分？\n\n「いいえ。ここから任意保険が必要になります。」\n\n事故で相手に重大な後遺障害が残った場合など、\n\n損害賠償額が、\n\n数千万円\n↓\n1億円\n↓\nそれ以上\n\nになる可能性があります。\n\nところが自賠責には、\n\n### 支払限度額\n\nがあります。\n\nそこで、\n\n> **自賠責で足りない部分を任意保険で補う**\n\nという構造になります。\n\n---\n\n# ③ 自動車保険を「誰・何を守るか」で分ける\n\n「名前を一個ずつ丸暗記すると混乱します。守る対象で分けましょう。」\n\n## ① 相手の「人」\n\n👤💥🚗\n\n### 対人賠償保険\n\n事故で他人を死傷させ、法律上の損害賠償責任を負った場合に、\n\n### 自賠責などでカバーされる部分を超える損害\n\nなどを補償します。\n\n---\n\n## ② 相手の「物」\n\n🚗💥🚙\n\n### 対物賠償保険\n\n相手の、\n\n🚙車  \n🏠建物  \n🚧ガードレール\n\nなどを壊し、法律上の損害賠償責任を負った場合に備えます。\n\n「自賠責には対物補償がありませんから、ここは任意保険の重要な役割です。」\n\n---\n\n# ④ 自分・同乗者の「人」\n\n「相手だけ守って、自分たちが無防備では困りますよね。」\n\nそこで、\n\n### 人身傷害保険\n\n### 搭乗者傷害保険\n\nなどがあります。\n\n---\n\n### 人身傷害保険\n\n契約内容に従って、\n\n> **実際の損害額を基準として補償**\n\nするタイプです。\n\n治療費\n＋\n休業損害\n＋\n逸失利益\n\nなどを含めて損害額を算定します。\n\n---\n\n### 搭乗者傷害保険\n\n契約車両に乗っている人が事故で死傷した場合などに、\n\n> **契約で定めた金額**\n\nを支払うタイプです。\n\n「ここは後で詳しくやります。」\n\n---\n\n# ⑤ 自分の「車」\n\n「最後が自分の車です。」\n\n### 車両保険\n\n事故などによって、\n\n🚗💥\n\n自分の車に損害が発生した場合に備えます。\n\n「対物賠償と混ぜないでくださいね。」\n\n### 対物賠償\n\n→ **相手の物**\n\n### 車両保険\n\n→ **自分の車**\n\nです。\n\n---\n\n# ⑥ 4方向で整理すると一気に簡単\n\n「はい、先輩。ここが今回一番覚えてほしいところです。」\n\n事故発生。\n\n## 👤 相手の人\n\n→ **対人賠償**\n\n## 🚙 相手の物\n\n→ **対物賠償**\n\n## 🧑 自分・同乗者\n\n→ **人身傷害・搭乗者傷害など**\n\n## 🚗 自分の車\n\n→ **車両保険**\n\n「これなら名前を忘れても、守る対象から逆算できます。」\n\n---\n\n# ⑦ 自賠責はどこに入る？\n\n「この4方向の中で、自賠責が担当するのは？」\n\n……\n\n### 👤 相手の人\n\nです。\n\nしかも限度額があります。\n\nだから、\n\n### 自賠責\n\n↓\nまず被害者の人身損害を一定範囲で保障\n\n＋\n\n### 任意の対人賠償保険\n\n↓\n自賠責の限度額を超える賠償などに備える\n\nという二段構えになります。\n\n---\n\n# ⑧ 任意保険の「等級」\n\n「もう一つ、自動車保険でよく聞く言葉がありますね。」\n\n### ノンフリート等級制度\n\nです。\n\n個人の一般的な自動車保険では、事故歴などに応じて等級が変わり、\n\n### 保険料の割引・割増\n\nに影響します。\n\n事故がない\n↓\n等級が進む\n↓\n一般に割引が大きくなる\n\n一方、\n\n保険を使う事故\n↓\n事故の種類に応じて等級が下がる\n↓\n翌年度以降の保険料が上がることがある\n\nという仕組みです。\n\n「だから“小さな修理なら保険を使わない方が結果的に安い？”という判断が出てくるわけですね。」\n\n---\n\n# C【イメージ理解｜車の周りに4枚の盾】\n\n「車の周りに盾を置いてください。」\n\n　　　　　👤相手の人  \n　　　　【対人賠償】  \n　　　　　　↑  \n🚙相手の物 ← 🚗 → 🚘自分の車  \n【対物賠償】　　【車両保険】  \n　　　　　　↓  \n　　　　🧑自分・同乗者  \n　【人身傷害・搭乗者傷害】\n\nそして、\n\n### 自賠責\n\nは主に、\n\n### 👤相手の人\n\nを最低限救済する土台です。\n\n「自賠責は車全体を守る万能バリアではありません。」\n\n---\n\n# D【具体例｜先輩が追突事故を起こした】\n\n先輩が運転中、\n\n🚗💥🚙\n\n前の車に追突したとします。\n\n事故によって、\n\n### ① 相手がケガ\n\n→ 自賠責＋**対人賠償保険**\n\n### ② 相手の車が大破\n\n→ **対物賠償保険**\n\n### ③ 先輩自身がケガ\n\n→ **人身傷害保険など**\n\n### ④ 先輩の車も大破\n\n→ **車両保険**\n\n「一つの交通事故でも、損害ごとに担当する保険が違うんです。」\n\n---\n\n# 「対人・対物はなぜ無制限がよくあるの？」\n\n「損害額が非常に大きくなる可能性があるからです。」\n\nたとえば対物でも、\n\n「相手の車100万円くらいでしょう」\n\nだけではありません。\n\n高額な車両\n＋\n店舗\n＋\n積荷\n＋\n営業損失\n\nなどが絡めば、損害額が大きくなる可能性があります。\n\n対人なら、死亡や重い後遺障害によってさらに高額な賠償になる可能性があります。\n\nそのため任意保険では、\n\n### 対人・対物を無制限\n\nとする契約が一般的です。\n\n---\n\n# 【自動車保険の全体地図】\n\n|損害|主な保険|\n|-|-|\n|相手の人|**自賠責＋対人賠償**|\n|相手の物|**対物賠償**|\n|自分・同乗者|**人身傷害・搭乗者傷害など**|\n|自分の車|**車両保険**|\n\n「この表が頭に入れば、68～72は全部この地図の中に入ります。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n自賠責保険で、相手の車の修理費は補償される？\n\n……\n\n### **❌されません。**\n\n自賠責は基本的に**対人賠償**です。\n\n---\n\n### Q2\n\n相手の店舗や車を壊してしまった場合に備える任意保険は？\n\n……\n\n### **対物賠償保険。**\n\n---\n\n### Q3\n\n自分の車が事故で壊れた場合に備えるのは？\n\n……\n\n### **車両保険。**\n\n---\n\n# 【30秒復習】\n\n① **自賠責**  \n→ 強制保険\n\n② **自賠責の中心**  \n→ 対人\n\n③ **相手の人**  \n→ 対人賠償\n\n④ **相手の物**  \n→ 対物賠償\n\n⑤ **自分・同乗者**  \n→ 人身傷害・搭乗者傷害など\n\n⑥ **自分の車**  \n→ 車両保険\n\n# 【一文で覚える】\n\n> **「自動車保険は、自賠責保険を強制保険として土台に置き、任意保険で相手の人・物、自分や同乗者、自分の車などの損害を補う仕組み。」**\n\n「先輩、自動車保険は名前から覚えるんじゃありません。」\n\n### 👤相手の人\n\n### 🚙相手の物\n\n### 🧑自分たち\n\n### 🚗自分の車\n\nこの**4方向**を先に作るんです。\n\n次は、この一番土台にある **68「自賠責保険」** を詳しく見ます。\n\n---", "chapter": 2}, {"n": 68, "title": "自賠責保険（自動車損害賠償責任保険）", "raw": "# 第2章 リスク管理 68\n\n## 自賠責保険（自動車損害賠償責任保険）\n\n### A【要点｜「相手の人」を最低限救済する強制保険】\n\n「はい、先輩。前回の自動車保険の地図から、今日は一番下の土台――**自賠責保険**です。」\n\n自賠責保険は、\n\n> **交通事故の被害者の人身損害を救済するため、自動車・バイクなどに法律上加入が義務づけられている保険**\n\nです。\n\nまず絶対に覚えるのは、この3つ。\n\n### ① 強制保険\n\n→ 原則として加入義務がある\n\n### ② 対象は「他人」の人身損害\n\n→ **対人のみ**\n\n### ③ 支払限度額がある\n\n→ 任意保険で上乗せする\n\n「特に、**対物は自賠責から出ません**。ここ、試験で落とさないでくださいね。」\n\n---\n\n# B【詳しい解説①｜なぜ強制なの？】\n\n「もし自賠責がなかったらどうなるでしょう。」\n\nAさんが事故を起こす。\n\n🚗💥🚶\n\n被害者\n→ 重傷\n\n損害\n→ 数百万円\n\nところが加害者には、\n\n### お金がない。\n\nすると被害者は、\n\n「事故に遭ったうえに、治療費まで受け取れない……」\n\nとなる可能性があります。\n\nそこで、\n\n> **交通事故の被害者に最低限の補償を確保する**\n\nために、自賠責保険への加入を義務づけているわけです。\n\n「つまり自賠責の主役は、車を守ることではなく、**被害者救済**なんです。」\n\n---\n\n# ② 何を補償する？\n\n「先輩、ここは○×で覚えましょう。」\n\n事故で相手が、\n\n### 🤕ケガ\n\n→ ⭕ 対象\n\n### ♿後遺障害\n\n→ ⭕ 対象\n\n### 死亡\n\n→ ⭕ 対象\n\n---\n\nでは、\n\n### 🚙相手の車が壊れた\n\n→ ❌\n\n### 🏠相手の家を壊した\n\n→ ❌\n\n### 🚧ガードレールを壊した\n\n→ ❌\n\nです。\n\nなぜなら、\n\n# **自賠責＝対人賠償**\n\nだから。\n\n「“自動車事故なら全部自賠責”じゃないですよ。」\n\n---\n\n# ③ 自分自身のケガは？\n\n「じゃあ先輩、自分が単独事故を起こして、自分自身がケガしたら？」\n\n🚗💥🧱  \n↓  \n運転者本人🤕\n\n自賠責で補償？\n\n……\n\n### ❌原則として対象になりません。\n\n自賠責は、\n\n> **他人を死傷させたことによる損害賠償責任**\n\nを対象とする保険だからです。\n\n自分自身のケガなら、\n\n### 人身傷害保険\n\nなど別の補償を考えます。\n\n---\n\n# ④ 支払限度額｜ここは数字を覚える\n\n「はい、先輩。FPで重要な数字です。」\n\n被害者**1名につき**、\n\n### 傷害\n\n→ **最高120万円**\n\n### 死亡\n\n→ **最高3,000万円**\n\n### 後遺障害\n\n→ 程度に応じて**最高4,000万円**\n\nです。\n\n---\n\n「順番で覚えるなら、」\n\n### 🤕 120\n\n### ⚰️ 3,000\n\n### ♿ 4,000\n\nです。\n\n---\n\n# ⑤ なぜ後遺障害が死亡より高い場合がある？\n\n「先輩、“死亡3,000万円なのに、後遺障害4,000万円？”って引っかかりませんでした？」\n\nそこ、ちゃんと理由があります。\n\n重い後遺障害では、\n\n生存している\n↓\n介護が長期間必要\n↓\n将来の収入にも影響\n↓\n介護費用なども必要\n\nというケースがあります。\n\nそのため、一定の重度後遺障害では、\n\n### 最高4,000万円\n\nという限度額が設定されています。\n\n---\n\n# ⑥ 3,000万円を超えたらどうする？\n\nたとえば、\n\n交通事故\n↓\n相手が死亡\n\n損害賠償額\n→ **8,000万円**\n\nだったとします。\n\n自賠責の死亡限度額は、\n\n### 3,000万円\n\nです。\n\nすると残り、\n\n8,000万円 − 3,000万円\n\n＝\n\n### 5,000万円\n\n「え？先輩が自腹？」\n\n……\n\n任意の、\n\n### **対人賠償保険**\n\nに加入していれば、その契約に従って自賠責を超える部分などに備えられます。\n\nつまり、\n\n### 自賠責\n\n→ 最低限の土台\n\n＋\n\n### 任意の対人賠償\n\n→ 上乗せ\n\nです。\n\n---\n\n# ⑦ 被害者が直接請求できる\n\n「自賠責は被害者救済が目的でしたよね。」\n\nそのため、被害者は一定の要件のもと、\n\n> **加害者側の自賠責保険会社に直接、損害賠償額の支払いを請求できます。**\n\nこれを、\n\n### **被害者請求**\n\nといいます。\n\n「加害者が動いてくれないから何もできない、という事態を減らす仕組みなんですね。」\n\n---\n\n# ⑧ 自賠責に入っていない車を運転したら？\n\n「“任意じゃない”ということは、当然ペナルティがあります。」\n\n自賠責に未加入の自動車等を運行すると、\n\n### 法律違反\n\nとなり、罰則の対象になります。\n\nさらに、自賠責保険証明書を備え付けずに運行することについてもルールがあります。\n\n「だから**強制保険**なんです。」\n\n---\n\n# ⑨ 任意保険との違い\n\n「ここ、一度まとめますよ。」\n\n||自賠責保険|任意保険|\n|-|-|-|\n|加入|**強制**|任意|\n|主目的|**被害者救済**|幅広いリスクへの備え|\n|相手の人|⭕|⭕|\n|相手の物|❌|対物賠償で対応|\n|自分の車|❌|車両保険で対応|\n|自分のケガ|原則❌|人身傷害など|\n|支払限度|**あり**|契約による|\n\n---\n\n# C【イメージ理解｜自賠責は「一階部分」】\n\n「先輩、二階建ての建物を想像してください。」\n\n### 🏠2階\n\n**任意の対人賠償保険**\n\n↑ 自賠責では足りない部分を補う\n\n---\n\n### 🏠1階\n\n**自賠責保険**\n\n↑ 法律で用意された最低限の土台\n\n---\n\n事故で、\n\n👤相手に8,000万円の損害。\n\nまず、\n\n### 1階：自賠責\n\nそして限度を超える部分を、\n\n### 2階：任意保険\n\nで備える。\n\n「だから任意保険を“自賠責があるから不要”とは考えないんです。」\n\n---\n\n# D【具体例｜事故で相手が死亡】\n\n先輩が交通事故を起こし、\n\n相手が死亡。\n\n損害賠償額\n→ **7,000万円**\n\nだったとします。\n\n自賠責では死亡について、\n\n### 最高3,000万円\n\nまで。\n\n仮に自賠責から3,000万円が支払われる条件を満たすと、\n\n残りは、\n\n7,000万円\n−\n3,000万円\n\n＝\n\n### 4,000万円\n\nです。\n\nここを任意の、\n\n### **対人賠償保険**\n\nで備える。\n\n「つまり、」\n\n### 自賠責3,000万円まで\n\n＋\n\n### 任意保険で上乗せ\n\nというイメージですね。\n\n※実際の支払額は損害内容・過失等に応じて決まるため、必ず上限額まで支払われるという意味ではありません。\n\n---\n\n# 「自賠責3,000万円＝必ず3,000万円？」\n\n「いいえ。そこは注意してください。」\n\n3,000万円は、\n\n### **死亡時の支払限度額**\n\nです。\n\n実際の損害が1,500万円なら、\n\n「上限3,000万円だから3,000万円ください」\n\nとはなりません。\n\n「63でやった**保険金額と実際の支払額は別**という感覚と同じですね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n自賠責で相手の車の修理代は補償される？\n\n……\n\n### **❌されません。**\n\n自賠責は対人です。\n\n---\n\n### Q2\n\n自賠責の支払限度額は、被害者1名につき？\n\n……\n\n### 傷害 → **120万円**\n\n### 死亡 → **3,000万円**\n\n### 後遺障害 → **最高4,000万円**\n\nです。\n\n---\n\n### Q3\n\n自賠責の限度額を超える対人賠償に備える保険は？\n\n……\n\n### **任意の対人賠償保険。**\n\n---\n\n# 【30秒復習】\n\n① **自賠責の別名**  \n→ 強制保険\n\n② **目的**  \n→ 被害者救済\n\n③ **何を補償？**  \n→ 対人\n\n④ **傷害**  \n→ 最高120万円\n\n⑤ **死亡**  \n→ 最高3,000万円\n\n⑥ **後遺障害**  \n→ 最高4,000万円\n\n# 【一文で覚える】\n\n> **「自賠責保険は交通事故の被害者救済を目的とする強制保険で、対人損害を対象とし、被害者1名につき傷害120万円、死亡3,000万円、後遺障害は最高4,000万円が支払限度額。」**\n\n「先輩、数字だけなら――」\n\n### 🤕120\n\n### ⚰️3,000\n\n### ♿4,000\n\nそして、\n\n### **人○・物×・自分×**\n\nです。\n\n次は、自賠責の上に乗せる任意保険の中心、**69「対人賠償保険と対物賠償保険」**です。\n\n---", "chapter": 2}, {"n": 69, "title": "対人賠償保険と対物賠償保険", "raw": "# 第2章 リスク管理 69\n\n## 対人賠償保険と対物賠償保険\n\n### A【要点｜「相手の人」か「相手の物」か】\n\n「はい、先輩。今回は名前どおりなんですが、**自賠責との関係**まで一本につなげますよ。」\n\n自動車事故で、他人に対して法律上の損害賠償責任を負った場合、\n\n> 👤 **相手の人を死傷させた**  \n> → **対人賠償保険**\n\n> 🚙🏠 **相手の物を壊した**  \n> → **対物賠償保険**\n\nで備えます。\n\nそして最大の違いは、\n\n### 対人\n\n→ **自賠責という土台がある**\n\n### 対物\n\n→ **自賠責には対物補償がない**\n\nということです。\n\n---\n\n# B【詳しい解説①｜対人賠償保険】\n\n「先輩が車を運転中に歩行者と事故を起こしたとします。」\n\n🚗💥🚶\n\n相手が重傷を負い、\n\n治療費\n＋\n休業損害\n＋\n逸失利益\n＋\n慰謝料\n\nなどによって、\n\n### 8,000万円\n\nの損害賠償責任を負った。\n\nここでまず登場するのが、\n\n### **自賠責保険**\n\nでした。\n\n---\n\nでも自賠責には限度があります。\n\n前回やった、\n\n### 傷害 → 最高120万円\n\n### 死亡 → 最高3,000万円\n\n### 後遺障害 → 最高4,000万円\n\nですね。\n\n「じゃあ、自賠責で足りない部分は？」\n\n……\n\nそこで、\n\n# **対人賠償保険**\n\nです。\n\n> **自動車事故で他人を死傷させ、法律上の損害賠償責任を負った場合に、自賠責などで支払われる部分を超える損害を補償する**\n\nのが基本です。\n\n---\n\n# ② 対人は「自賠責＋任意保険」\n\n「ここは二階建てでしたね。」\n\n### 2階\n\n🛡️ **対人賠償保険**\n\n↑ 自賠責を超える部分など\n\n### 1階\n\n🛡️ **自賠責保険**\n\n↑ 強制保険\n\n---\n\nたとえば死亡事故で、\n\n損害賠償額\n→ 8,000万円\n\n自賠責から\n→ 3,000万円\n\n支払われると仮定すると、\n\n残り、\n\n### 5,000万円\n\nを任意の対人賠償保険でカバーするイメージです。\n\n---\n\n# ③ 「他人」って誰？\n\n「ここ、地味に大事ですよ。」\n\n対人賠償保険は、\n\n### **他人**\n\nを死傷させた場合の賠償責任を補償する保険です。\n\n「じゃあ、運転している先輩自身がケガしたら？」\n\n……\n\n### ❌対人賠償ではありません。\n\n自分自身のケガなら、\n\n### 人身傷害保険\n\nなどを考えます。\n\n---\n\n# ④ 対物賠償保険\n\n「次は“人”ではなく“物”です。」\n\n先輩が、\n\n🚗💥🚙\n\n相手の車を壊した。\n\nあるいは、\n\n🚗💥🏪\n\n店舗に突っ込んだ。\n\nこのように、\n\n> **他人の財物を壊して法律上の損害賠償責任を負った場合**\n\nに備えるのが、\n\n# **対物賠償保険**\n\nです。\n\n---\n\n# ⑤ 自賠責は対物には使えない\n\n「ここは何回でも確認します。」\n\n相手の車\n→ 修理費300万円\n\n先輩：\n\n「自賠責があります！」\n\n……\n\n### 自賠責「対物は担当外です」\n\nとなります。\n\n自賠責は、\n\n### 👤人\n\n→ ○\n\n### 🚙物\n\n→ ×\n\nでした。\n\nだから、\n\n### **対物賠償保険**\n\nが重要なんです。\n\n---\n\n# ⑥ 「車くらいなら数百万円でしょ？」\n\n「先輩、それで対物の保険金額を小さく考えるのは危ないですよ。」\n\nたとえば車で、\n\n🏪コンビニ\n\nに突っ込んだとします。\n\n壊れるのは、\n\n建物\n＋\n商品\n＋\n設備\n\nだけではありません。\n\n修理中、\n\n### 店を営業できない\n\nとなれば、\n\n### **休業による損害**\n\nなどが問題になる場合もあります。\n\nあるいは、\n\n🚗💥🚃\n\n鉄道関係の設備などを損傷して大きな損害を発生させる可能性もあります。\n\nつまり、\n\n> **対物＝車の修理代だけ**\n\nではありません。\n\n---\n\n# ⑦ 対人・対物は「無制限」が一般的\n\n「事故の損害額には、とんでもなく大きな金額になる可能性があります。」\n\nだから任意の自動車保険では、\n\n### 対人賠償\n\n→ **無制限**\n\n### 対物賠償\n\n→ **無制限**\n\nとする契約が一般的です。\n\n「“自分は高級車にぶつからないから大丈夫”なんて選べませんからね。事故ですから。」\n\n---\n\n# ⑧ 「賠償保険」という言葉がポイント\n\n「先輩、ここは本質です。」\n\n対人・対物賠償保険は、\n\n> **相手が損害を受けたら無条件で何でも払う保険**\n\nではありません。\n\n基本的には、\n\n### **被保険者が法律上の損害賠償責任を負う**\n\nことがポイントです。\n\nつまり、\n\n事故\n↓\n相手に損害\n↓\n自分に法律上の賠償責任\n↓\n対人・対物賠償保険\n\nという順番です。\n\n「“賠償”という名前をちゃんと見てください。」\n\n---\n\n# C【イメージ理解｜左に「人」、右に「物」】\n\n「先輩の車を真ん中に置きます。」\n\n　　　　👤  \n　　　相手の人  \n　　　　 ↑  \n　【対人賠償】  \n　　　　 ↑  \n　　　　🚗  \n　　　　 ↓  \n　【対物賠償】  \n　　　　 ↓  \n　　🚙🏠🏪🚧  \n　　　相手の物\n\n「これだけです。」\n\nそして対人側には、\n\n### 自賠責\n\n＋\n\n### 対人賠償\n\nという二段構えがあります。\n\n一方、対物側には、\n\n### 自賠責はない\n\nので、\n\n### 対物賠償保険\n\nが重要になります。\n\n---\n\n# D【具体例｜1回の事故で両方発生】\n\n先輩が交差点で、\n\n🚗💥🚙\n\n事故を起こしたとします。\n\n相手の運転者が負傷。\n\n### 人身損害\n\n→ 5,000万円\n\nさらに、\n\n相手の車も大破。\n\n### 物的損害\n\n→ 500万円\n\n---\n\nこの場合、\n\n### 相手の人5,000万円\n\n👤\n\n→ 自賠責＋**対人賠償保険**\n\n---\n\n### 相手の車500万円\n\n🚙\n\n→ **対物賠償保険**\n\nです。\n\n「同じ事故でも、**人と物で保険を分ける**んですよ。」\n\n---\n\n# 「自分の車は対物？」\n\n「先輩、ここ引っかからないでくださいね。」\n\n自分の車が、\n\n🚗💥\n\n500万円壊れた。\n\n### 対物賠償？\n\n……\n\n### ❌違います。\n\n対物賠償は、\n\n### **他人の物**\n\nです。\n\n自分の車は、\n\n### **車両保険**\n\nで備えます。\n\n---\n\n# 【4方向をもう一度】\n\n### 👤 相手の人\n\n→ **対人賠償**\n\n### 🚙 相手の物\n\n→ **対物賠償**\n\n### 🧑 自分・同乗者\n\n→ **人身傷害・搭乗者傷害**\n\n### 🚗 自分の車\n\n→ **車両保険**\n\n「先輩、ここまで来たら自動車保険の全体像がかなり見えてきましたね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n相手の車を壊した場合、自賠責保険で補償される？\n\n……\n\n### **❌されません。**\n\n自賠責は対人のみです。\n\n---\n\n### Q2\n\n事故で相手を死傷させ、自賠責を超える損害賠償責任を負った場合に備えるのは？\n\n……\n\n### **対人賠償保険。**\n\n---\n\n### Q3\n\n事故で自分の車が壊れた場合は対物賠償保険？\n\n……\n\n### **❌違います。**\n\n自分の車なら、\n\n### **車両保険**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **相手の人**  \n→ 対人\n\n② **相手の物**  \n→ 対物\n\n③ **対人の土台**  \n→ 自賠責\n\n④ **自賠責の対物補償**  \n→ なし\n\n⑤ **自分の車**  \n→ 車両保険\n\n⑥ **対人・対物のポイント**  \n→ 法律上の損害賠償責任\n\n# 【一文で覚える】\n\n> **「対人賠償保険は他人を死傷させて負う賠償責任を自賠責の上乗せとして補い、対物賠償保険は他人の車・建物などを壊して負う賠償責任を補償する。」**\n\n「はい、先輩。これだけ最後に固定です。」\n\n### 👤 人を傷つけた\n\n→ **対人**\n\n### 🚙 物を壊した\n\n→ **対物**\n\n### 👤対人には自賠責がある\n\n### 🚙対物には自賠責がない\n\n次は“相手”ではなく“乗っている人”を見る、**70「搭乗者傷害保険と人身傷害補償保険」**です。\n\n---", "chapter": 2}, {"n": 70, "title": "搭乗者傷害保険と人身傷害補償保険", "raw": "# 第2章 リスク管理 70\n\n## 搭乗者傷害保険と人身傷害補償保険\n\n### A【要点｜「定額」か「実際の損害額」か】\n\n「はい、先輩。ここは名前だけ見ると似ていますが、区別するポイントはかなり明確です。」\n\nどちらも自動車事故で**自分や同乗者などの死傷**に備える保険ですが、基本的な違いは、\n\n> **搭乗者傷害保険＝契約で決めた金額を支払う「定額型」**\n\n> **人身傷害保険＝実際の損害額を基準に補償する「実損型」**\n\nです。\n\nまず、\n\n### 搭乗者＝定額\n\n### 人身傷害＝実損\n\nこれを固定しましょう。\n\n---\n\n# B【詳しい解説①｜搭乗者傷害保険】\n\n「先輩が車を運転していて事故。」\n\n🚗💥\n\n先輩\n→ ケガ\n\n同乗者\n→ ケガ\n\nこのような場合に、契約内容に応じて補償するのが、\n\n### **搭乗者傷害保険**\n\nです。\n\n特徴は、\n\n> **実際に損害がいくらだったかをそのまま補償するのではなく、契約で定められた金額を支払う**\n\nというところ。\n\n---\n\nたとえば契約上、\n\n事故による所定のケガ\n→ 10万円\n\nと決められていたとします。\n\n実際の損害が、\n\n### 8万円\n\nだったとしても、\n\n契約上の支払条件を満たせば、\n\n### 契約で定めた金額\n\nが支払われる。\n\n「つまり、**定額給付**の考え方ですね。」\n\n---\n\n# ② 人身傷害保険\n\n「一方、人身傷害は考え方が違います。」\n\n交通事故によって自分などが死傷した。\n\nその結果、\n\n治療費\n＋\n休業損害\n＋\n精神的損害\n＋\n逸失利益\n\nなど、\n\n### 実際にどれだけの損害が発生したか\n\nを、契約で定める基準に基づいて算定します。\n\nそして、\n\n> **算定された損害額を保険金額の範囲内で補償する**\n\nのが基本です。\n\n---\n\nだから、\n\n### 搭乗者傷害\n\n→ **決めた額**\n\n### 人身傷害\n\n→ **実際の損害額を基準**\n\nです。\n\n---\n\n# ③ 人身傷害は「自分の過失」があっても重要\n\n「ここが人身傷害の強みです。」\n\nたとえば事故で、\n\n先輩の過失\n→ 70％\n\n相手の過失\n→ 30％\n\nだったとしましょう。\n\n🚗💥🚙\n\n先輩自身にも、\n\n### 1,000万円\n\nの人身損害が発生。\n\n---\n\n「相手が悪いのは30％だから、相手から受け取れる賠償だけでは自分の損害全部を埋められない可能性がありますよね。」\n\nそこで人身傷害保険。\n\n契約内容に従って、\n\n### **自分の過失部分を含めた損害**\n\nについて補償を受けられるのが大きな特徴です。\n\n---\n\n# ④ 相手との示談を待たずに補償を受けられる\n\n「これも重要です。」\n\n普通の賠償なら、\n\n相手の過失は？\n↓\n自分の過失は？\n↓\n損害額は？\n↓\n示談交渉\n↓\n賠償\n\nと時間がかかることがあります。\n\n一方、人身傷害保険では、\n\n### 自分の保険会社\n\nから、契約に基づいて損害額の補償を受けられます。\n\nつまり、\n\n> **相手との示談成立を待たずに保険金を受け取れる**\n\nというメリットがあります。\n\n「事故直後に治療費や生活費が必要なとき、この違いは大きいですよね。」\n\n---\n\n# ⑤ 「人身傷害」と「対人賠償」を混ぜない\n\n「先輩、ここで名前が似てきました。整理します。」\n\n### 対人賠償保険\n\n👤**相手の人**\n\nを死傷させた。\n\n↓\n自分が法律上の賠償責任を負う。\n\n↓\n補償。\n\n---\n\n### 人身傷害保険\n\n🧑**自分など**\n\nが死傷した。\n\n↓\n自分側に人身損害が発生。\n\n↓\n補償。\n\n---\n\n「つまり、」\n\n### 対人＝相手\n\n### 人身＝自分側\n\nと切ってください。\n\n---\n\n# ⑥ 搭乗者傷害と人身傷害は両方もらえるの？\n\n「先輩、ここまで聞くとこう思いません？」\n\n> 「両方入ってたら、どっちか一つしか使えないの？」\n\n……\n\n契約上それぞれの支払条件を満たせば、\n\n### **両方から保険金を受け取れる場合があります。**\n\nなぜなら、\n\n人身傷害\n→ 実損補償型\n\n搭乗者傷害\n→ 定額給付型\n\nと、仕組みが違うからです。\n\n「ここは“どちらも人のケガだから二重取り禁止！”と単純に考えないでくださいね。」\n\n---\n\n# C【イメージ理解｜レシート型とお見舞金型】\n\n「先輩、これが一番覚えやすいと思います。」\n\n## 人身傷害\n\n事故発生\n↓\n🧾\n\n「実際にどれくらい損害が出ました？」\n\n治療費\n＋\n休業損害\n＋\n逸失利益など\n\n↓\n\n### 💰損害額を基準に補償\n\nつまり、\n\n# **レシート型**\n\nのイメージ。\n\n---\n\n## 搭乗者傷害\n\n事故発生\n↓\n🤕\n\n「このケガなら契約上○万円です」\n\n↓\n\n### 💰定額給付\n\nつまり、\n\n# **お見舞金型**\n\nのイメージです。\n\n---\n\n「厳密には単なるレシート計算ではありませんが、区別を覚えるならこれで十分です。」\n\n### 🧾人身傷害＝実損\n\n### 🎁搭乗者傷害＝定額\n\nです。\n\n---\n\n# D【具体例｜事故で300万円の損害】\n\n先輩が交通事故でケガをしました。\n\n治療費\n＋\n休業損害\n＋\nその他の対象損害\n\nを合わせて、\n\n### 300万円\n\nと算定されたとします。\n\n---\n\n## 人身傷害保険\n\n契約条件・保険金額の範囲内で、\n\n### **300万円という実際の損害額を基準**\n\nに補償を考えます。\n\n---\n\n## 搭乗者傷害保険\n\n「損害が300万円だったから300万円」\n\nではありません。\n\n契約上、\n\nこの事故・傷害について、\n\n### 20万円\n\nと定められているなら、\n\n### 20万円\n\nというように**契約で定められた額**が支払われます。\n\n---\n\n「だから同じ事故でも、計算の出発点が違うんです。」\n\n### 人身傷害\n\n→ 「損害はいくら？」\n\n### 搭乗者傷害\n\n→ 「契約上いくら？」\n\n---\n\n# 【自動車保険の地図に戻す】\n\n「ここまで全部入れてみますよ。」\n\n|誰・何を守る？|保険|\n|-|-|\n|👤 相手の人|**自賠責＋対人賠償**|\n|🚙 相手の物|**対物賠償**|\n|🧑 自分などの人身損害|**人身傷害**|\n|🧑 搭乗者の死傷|**搭乗者傷害**|\n|🚗 自分の車|**車両保険**|\n\n「あと残っているのは、自分の車を守る部分などですね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n実際の損害額を基準として補償するのは？\n\n……\n\n### **人身傷害保険。**\n\n---\n\n### Q2\n\n契約で定めた金額を支払う定額型なのは？\n\n……\n\n### **搭乗者傷害保険。**\n\n---\n\n### Q3\n\n相手との示談成立を待たず、自分の保険会社から契約に基づく補償を受けられるのが特徴なのは？\n\n……\n\n### **人身傷害保険。**\n\n---\n\n# 【30秒復習】\n\n① **搭乗者傷害**  \n→ 定額\n\n② **人身傷害**  \n→ 実損を基準\n\n③ **人身傷害と過失**  \n→ 自分の過失部分も含めて補償できる\n\n④ **示談を待つ？**  \n→ 人身傷害は待たずに補償を受けられるのが特徴\n\n⑤ **対人賠償**  \n→ 相手の人\n\n⑥ **人身傷害**  \n→ 自分側の人身損害\n\n# 【一文で覚える】\n\n> **「搭乗者傷害保険は契約で定めた金額を支払う定額型、人身傷害保険は自分などの人身損害を実際の損害額に基づいて保険金額の範囲内で補償する実損型。」**\n\n「先輩、迷ったらこの2語だけ思い出してください。」\n\n### 🎁 搭乗者傷害\n\n→ **定額**\n\n### 🧾 人身傷害\n\n→ **実損**\n\nここを分ければ大丈夫です。\n\n次は **71「無保険車傷害保険」** です。\n\n---", "chapter": 2}, {"n": 71, "title": "無保険車傷害保険", "raw": "# 第2章 リスク管理 71\n\n## 無保険車傷害保険\n\n### A【要点｜相手に十分な対人保険がないとき、自分側を守る】\n\n「はい、先輩。今回は名前を見ると、“保険に入っていない車だけが対象？”と思いますよね。実はもう少し広いです。」\n\n**無保険車傷害保険**とは、簡単にいうと、\n\n> **事故の相手が任意の対人賠償保険に入っていない、または補償が十分でないなどのため十分な賠償を受けられない場合に、自分側の死亡・後遺障害などを補償する保険**\n\nです。\n\n典型的には、\n\n🚗先輩  \n💥  \n🚙相手\n\n先輩\n→ 重い後遺障害\n\n相手\n→ 任意の対人賠償保険なし\n\n相手には十分な資力もない。\n\n「こうなると、“相手が悪いんだから払ってもらえばいい”では済みませんよね。」\n\nそこで、\n\n### **自分の無保険車傷害保険**\n\nが出てくるわけです。\n\n---\n\n# B【詳しい解説①｜「無保険車」って何？】\n\n「まずここです。」\n\n無保険車という名前だから、\n\n### 自賠責にも任意保険にも一切入っていない車\n\nだけだと思いやすい。\n\nでも、そう単純ではありません。\n\nたとえば、\n\n### ① 任意の対人賠償保険がない\n\nこれは分かりやすいですね。\n\n---\n\n### ② 対人賠償保険はあるが、十分な補償が得られない\n\n相手の賠償額に対して、\n\n### 相手側の対人賠償の保険金額が不足\n\nしているケースなどです。\n\n---\n\n### ③ 当て逃げなどで相手が分からない\n\n🚗💥🚙💨\n\n事故\n↓\n相手が逃走\n↓\n誰なのか分からない\n\nといった場合も、契約条件に応じて無保険車傷害の対象になることがあります。\n\n「つまり、“相手から十分な対人賠償を受けられない事故”というイメージの方が近いんです。」\n\n---\n\n# ② 何でも補償されるの？\n\n「ここ、かなり大事ですよ。」\n\n無保険車傷害保険は、一般に、\n\n### 死亡\n\nまたは、\n\n### 後遺障害\n\nといった重大な人身損害が中心です。\n\n---\n\n「じゃあ事故で腕を軽くケガして、通院3回しました。」\n\n### 無保険車傷害！\n\n……\n\n「とは限りません。」\n\n単なる傷害について広く補償する保険というより、\n\n> **無保険車との事故による死亡・後遺障害など、重大な人身損害**\n\nに備えるものと押さえてください。\n\n細かな支払条件・範囲は契約によって確認が必要です。\n\n---\n\n# ③ 自賠責があるのに、なぜ必要？\n\n「先輩、そこ気になりますよね。」\n\n相手が車を運転するなら、\n\n### 自賠責\n\nがあるはず。\n\n「じゃあ、それでいいじゃないですか」\n\n……\n\nでも自賠責には限度額がありました。\n\n### 傷害\n\n→ 最高120万円\n\n### 死亡\n\n→ 最高3,000万円\n\n### 後遺障害\n\n→ 最高4,000万円\n\n---\n\nところが実際の損害が、\n\n### 1億円\n\nだったら？\n\n自賠責だけでは足りません。\n\n本来なら、\n\n### 相手の任意の対人賠償保険\n\nから補ってもらいたい。\n\nところが、\n\n### 相手が任意保険に入っていない。\n\nすると、\n\n自賠責\n↓\nここまでは出る\n\nその上\n↓\n\n### 足りない！\n\nということが起こり得ます。\n\n「この“穴”に備えるのが無保険車傷害なんです。」\n\n---\n\n# ④ 相手がお金持ちなら？\n\n「じゃあ相手が任意保険に入っていなくても、本人が1億円払えるなら？」\n\n……\n\nその場合は、\n\n### 相手本人に損害賠償請求\n\nすることが考えられます。\n\nつまり問題なのは、\n\n> **保険に入っていないことそのものより、結果として十分な損害賠償を受けられないこと**\n\nなんですね。\n\n---\n\n# ⑤ 人身傷害保険と何が違う？\n\n「先輩、前回の**人身傷害**と混ざりそうですよね。」\n\nここは目的を分けます。\n\n### 人身傷害保険\n\n自分などが交通事故で死傷\n↓\n実際の損害額を基準として\n↓\n\n### **自分側の人身損害を幅広く補償**\n\n---\n\n### 無保険車傷害保険\n\n相手に賠償責任がある\n↓\nでも相手側から十分な賠償を受けられない\n↓\n死亡・後遺障害など\n↓\n\n### **その不足に備える**\n\nです。\n\n「人身傷害は“自分の人身損害”。無保険車傷害は“相手から取れない重大損害への備え”とイメージしてください。」\n\n---\n\n# ⑥ 対人賠償とは方向が逆\n\n「これも整理するときれいですよ。」\n\n### 対人賠償保険\n\n先輩\n🚗\n↓\n相手を死傷させた\n↓\n👤\n\n### **相手を守る**\n\n---\n\n### 無保険車傷害保険\n\n無保険車\n🚙\n↓\n先輩が死傷\n↓\n🧑\n\n### **自分側を守る**\n\n---\n\n「同じ“人の損害”でも、矢印が逆なんです。」\n\n---\n\n# C【イメージ理解｜相手の保険に穴が開いている】\n\n「先輩、相手の賠償をバケツだと思ってください。」\n\n先輩の損害\n\n### 8,000万円\n\n必要です。\n\nところが相手側から受け取れるお金が、\n\n🪣💰\n\n### 3,000万円しかない。\n\nすると、\n\n### 5,000万円の穴\n\nが残ります。\n\nそこで、\n\n### 🛡️無保険車傷害\n\nが登場。\n\n「相手側の賠償能力に穴があるとき、自分側から守る保険、と考えると分かりやすいですよ。」\n\n---\n\n# D【具体例｜相手が任意保険未加入】\n\n先輩が信号待ち。\n\n🚗\n\nそこへ相手の車が、\n\n🚙💥🚗\n\n追突。\n\n先輩に重大な後遺障害が残りました。\n\n損害額\n→ **8,000万円**\n\nところが相手は、\n\n### 任意の対人賠償保険に未加入。\n\n自賠責などから受け取れる金額だけでは、\n\n### 損害全体を補えない。\n\n相手本人にも十分な支払能力がない。\n\n「こういうときに、自分が契約している無保険車傷害保険が役に立つ可能性があるわけです。」\n\n---\n\n# 自動車保険の地図に追加\n\n「はい。これでかなり完成してきましたよ。」\n\n### 👤 相手の人を傷つけた\n\n→ **自賠責＋対人賠償**\n\n### 🚙 相手の物を壊した\n\n→ **対物賠償**\n\n### 🧑 自分などがケガ\n\n→ **人身傷害・搭乗者傷害**\n\n### 🧑 相手から十分な賠償を受けられず死亡・後遺障害\n\n→ **無保険車傷害**\n\n### 🚗 自分の車が壊れた\n\n→ **車両保険**\n\n「あと一つ、車両保険をやればこの地図がほぼ完成します。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n無保険車傷害保険は、主に誰を守る？\n\n……\n\n### **自分側です。**\n\n相手から十分な賠償を受けられない場合の重大な人身損害に備えます。\n\n---\n\n### Q2\n\n「無保険車」とは、任意保険に一切入っていない車だけ？\n\n……\n\n### **いいえ。**\n\n対人賠償の補償が不十分な場合なども含めて考えます。\n\n---\n\n### Q3\n\n自分の車が壊れた場合に使うのは無保険車傷害？\n\n……\n\n### **❌違います。**\n\n自分の車の損害なら、\n\n### **車両保険**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **無保険車傷害**  \n→ 自分側を守る\n\n② **どんな相手？**  \n→ 十分な対人賠償を受けられない相手など\n\n③ **中心となる損害**  \n→ 死亡・後遺障害など\n\n④ **相手の物**  \n→ 対物賠償\n\n⑤ **自分の人身損害を幅広く補償**  \n→ 人身傷害\n\n⑥ **自分の車**  \n→ 車両保険\n\n# 【一文で覚える】\n\n> **「無保険車傷害保険は、対人賠償保険がない・不十分な車などとの事故で十分な賠償を受けられない場合に、自分側の死亡・後遺障害などを補償する保険。」**\n\n「先輩、名前だけで“相手が無保険かどうか”を見るんじゃありません。」\n\n### **相手から十分な賠償を受けられる？**\n\nここを見るんです。\n\nそして次は、自動車保険の最後のピース、**72「車両保険」**です。\n\n---", "chapter": 2}, {"n": 72, "title": "車両保険", "raw": "# 第2章 リスク管理 72\n\n## 車両保険\n\n### A【要点｜「自分の車」を守る保険】\n\n「はい、先輩。自動車保険の地図、最後のピースです。」\n\n**車両保険**とは、\n\n> **衝突・接触・盗難・火災・台風など、契約で定められた事故によって自分の車に生じた損害を補償する保険**\n\nです。\n\n自動車保険を4方向で整理すると、\n\n### 👤 相手の人\n\n→ 対人賠償\n\n### 🚙 相手の物\n\n→ 対物賠償\n\n### 🧑 自分・同乗者\n\n→ 人身傷害・搭乗者傷害など\n\n### 🚗 **自分の車**\n\n→ **車両保険**\n\n「車両保険は、最後の“自分の車”担当です。」\n\n---\n\n# B【詳しい解説①｜対物賠償との違い】\n\n「先輩、まずここを間違えないでください。」\n\n先輩が運転中、\n\n🚗💥🚙\n\n事故を起こした。\n\n相手の車\n→ 100万円の損害\n\n自分の車\n→ 80万円の損害\n\n---\n\n### 相手の車100万円\n\n→ **対物賠償保険**\n\n### 自分の車80万円\n\n→ **車両保険**\n\nです。\n\n「“車が壊れた＝対物”じゃありませんよ。」\n\n### 対物＝他人の物\n\n### 車両＝自分の車\n\nです。\n\n---\n\n# ② どんな事故が対象？\n\n「車両保険は交通事故だけとは限りません。」\n\n契約内容に応じて、\n\n### 🚗💥🚙 車同士の衝突\n\n### 🚗💥🧱 物との衝突・接触\n\n### 🔥 火災・爆発\n\n### 🌪️ 台風など\n\n### 🧊 雹\n\n### 🌊 洪水\n\n### 🕵️ 盗難\n\n### 🔑 いたずら\n\nなどによる車の損害が補償対象になることがあります。\n\n「ただし、どこまで補償するかは契約タイプによって違います。」\n\n---\n\n# ③ 補償範囲の広いタイプ・限定タイプ\n\n「車両保険には、補償範囲の違うタイプがあります。」\n\n一般的には、\n\n### 一般型\n\n→ 補償範囲が広い\n\n一方、\n\n### 補償範囲を限定したタイプ\n\n→ 対象となる事故を絞ることで、一般型より保険料を抑えやすい\n\nという違いがあります。\n\n---\n\n「たとえば単独事故。」\n\n🚗\n↓\n運転ミス\n↓\n💥電柱\n\nこうした事故について、\n\n### 広いタイプなら対象になり得る\n\n一方、\n\n### 限定タイプでは対象外になることがある\n\nという違いです。\n\n「“車両保険に入っている＝どんな壊れ方でも絶対補償”ではありません。」\n\n---\n\n# ④ 相手が分からない事故は？\n\n「駐車場に戻ってきたら……」\n\n🚗💥\n\n車に大きな傷。\n\n相手はいない。\n\n「当て逃げですね。」\n\nこうしたケースも、\n\n### 契約している車両保険の補償範囲\n\nによって対象になる場合があります。\n\n「だから商品名だけで判断せず、契約条件を見る必要があります。」\n\n---\n\n# ⑤ 地震はどうなる？\n\n「はい、先輩。ここは火災保険のときと似た罠です。」\n\n地震発生。\n\n🌏\n↓\n建物が崩れる\n↓\n🚗💥\n\n「車両保険があるから大丈夫！」\n\n……\n\n### 原則としてそうではありません。\n\n一般的な車両保険では、\n\n> **地震・噴火・これらによる津波による車両損害**\n\nは原則として補償対象外です。\n\n商品によっては地震等に関する特約が用意される場合があります。\n\n---\n\n「つまり、」\n\n### 台風🌪️\n\n→ 対象になり得る\n\n### 洪水🌊\n\n→ 対象になり得る\n\n### 地震🌏\n\n→ **通常の車両保険では原則対象外**\n\nです。\n\n「“自然災害なら全部同じ”じゃありませんよ。」\n\n---\n\n# ⑥ 車両保険金額\n\n「車両保険も、いくらでも好きな金額を設定できるわけではありません。」\n\n基本的には、\n\n> **契約する車の市場販売価格相当額などを基準として車両保険金額を設定**\n\nします。\n\nたとえば、\n\n現在の車の価値\n→ 200万円程度\n\nなのに、\n\n「思い出が詰まってるから1,000万円で！」\n\n……\n\n### そういう設定は基本的にできません。\n\n「63の**保険価額と保険金額**につながっていますね。」\n\n---\n\n# ⑦ 全損と分損\n\n「ここも言葉を押さえましょう。」\n\n### 全損\n\n修理不能だったり、修理費が車両保険金額以上になるなど、契約上の全損に該当する状態。\n\n---\n\n### 分損\n\n全損には至らない損害。\n\nたとえば、\n\n車両保険金額\n→ 200万円\n\n修理費\n→ 50万円\n\nなら、通常は分損のイメージです。\n\n---\n\n# ⑧ 免責金額\n\n「車両保険ではこれもよく出ます。」\n\n### 免責金額\n\nとは、\n\n> **事故が起きたときに契約者側が自己負担する金額**\n\nです。\n\n---\n\nたとえば、\n\n修理費\n→ 50万円\n\n免責金額\n→ 5万円\n\nとすると、単純化すれば、\n\n50万円 − 5万円\n\n＝\n\n### 保険から45万円\n\n自己負担\n→ **5万円**\n\nというイメージです。\n\n「免責金額を設定すると、その分保険料を抑えられることがあります。」\n\n---\n\n# ⑨ 小さな事故でも保険を使った方が得？\n\n「先輩、ここは実生活でも重要ですよ。」\n\n修理費\n→ 5万円\n\nだったとして、\n\n「車両保険がある！使おう！」\n\n……\n\nちょっと待ってください。\n\n保険を使うと事故内容によって、\n\n### 等級が下がる\n\n↓\n\n翌年度以降、\n\n### 保険料が上がる\n\nことがあります。\n\nそのため、\n\n### 今回受け取れる保険金\n\nと、\n\n### 将来増える保険料\n\nを比較すると、\n\n小さな損害では自己負担で修理した方が総額で有利な場合もあります。\n\n「保険は“使える＝使った方が得”ではないんですね。」\n\n---\n\n# C【イメージ理解｜車の四方向シールド完成】\n\n「先輩、ここまで勉強したものを全部並べますよ。」\n\n　　　　　 👤\n　　　　相手の人\n　【自賠責＋対人賠償】\n　　　　　 ↑\n　　　　　 │\n🚙相手の物 ← 🚗 → 🚗自分の車\n【対物賠償】　　【車両保険】\n　　　　　 │\n　　　　　 ↓\n　　　 🧑自分たち\n【人身傷害・搭乗者傷害】\n\nさらに、\n\n相手側から十分な賠償を受けられない重大事故\n\n→ **無保険車傷害**\n\nです。\n\n「これで自動車保険の地図が完成しました。」\n\n---\n\n# D【具体例｜台風で車が水没】\n\n先輩の車。\n\n車両保険金額\n→ 200万円\n\n台風による洪水で、\n\n🌧️🌊\n↓\n🚗\n↓\n水没\n\n損害\n→ 150万円\n\n契約している車両保険で洪水が補償対象で、その他の条件も満たしているとします。\n\n免責金額\n→ 5万円\n\nなら、単純化すると、\n\n150万円 − 5万円\n\n＝\n\n### 145万円\n\nが保険金として支払われるイメージです。\n\n---\n\n「じゃあ地震による津波で同じように水没したら？」\n\n🌏\n↓\n🌊\n↓\n🚗\n\n### 通常の車両保険では原則対象外。\n\n「原因を見る。火災保険でもやりましたね。」\n\n---\n\n# 【自動車保険・総まとめ】\n\n|損害|主な保険|\n|-|-|\n|相手の人|**自賠責＋対人賠償**|\n|相手の物|**対物賠償**|\n|自分などの人身損害|**人身傷害**|\n|搭乗者の死傷|**搭乗者傷害**|\n|相手から十分な賠償を受けられない死亡・後遺障害など|**無保険車傷害**|\n|自分の車|**車両保険**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n事故で相手の車と自分の車が両方壊れた。\n\nそれぞれ何？\n\n……\n\n### 相手の車\n\n→ **対物賠償**\n\n### 自分の車\n\n→ **車両保険**\n\nです。\n\n---\n\n### Q2\n\n一般的な車両保険で、地震・噴火・津波による損害は原則補償される？\n\n……\n\n### **❌原則対象外です。**\n\n---\n\n### Q3\n\n修理費50万円、免責金額5万円。\n\n単純化した場合、保険会社が負担するのはいくら？\n\n……\n\n### **45万円。**\n\n残り5万円が自己負担です。\n\n---\n\n# 【30秒復習】\n\n① **車両保険**  \n→ 自分の車\n\n② **対物賠償**  \n→ 相手の物\n\n③ **台風・洪水・盗難**  \n→ 契約により対象になり得る\n\n④ **地震・噴火・津波**  \n→ 原則対象外\n\n⑤ **免責金額**  \n→ 自己負担額\n\n⑥ **保険を使えば必ず得？**  \n→ 等級・将来保険料まで考える\n\n# 【一文で覚える】\n\n> **「車両保険は、衝突・接触・盗難・火災・台風など契約で定めた事故による自分の車の損害を補償する保険で、地震・噴火・津波による損害は原則として対象外。」**\n\n「はい、先輩。自動車保険はこれで一本につながりました。」\n\n### 相手の人 → 対人\n\n### 相手の物 → 対物\n\n### 自分の人 → 人身・搭乗者\n\n### 相手から取れない → 無保険車\n\n### 自分の車 → 車両\n\nそして次はいよいよ、この第2章リストの最後、**73「傷害保険」**です。\n\n---", "chapter": 2}, {"n": 73, "title": "傷害保険", "raw": "# 第2章 リスク管理 73\n\n## 傷害保険\n\n### A【要点｜「急激・偶然・外来」の事故によるケガ】\n\n「はい、先輩。第2章の最後です。傷害保険は、まずこの**3語**を絶対に落とさないでください。」\n\n> **急激・偶然・外来**\n\n傷害保険とは、基本的に、\n\n> **急激・偶然・外来の事故によって身体に傷害を負った場合に、死亡・後遺障害・入院・手術・通院などを契約内容に応じて補償する保険**\n\nです。\n\n「つまり、“ケガなら何でも傷害保険”ではありません。」\n\n### 急激\n\n＋\n\n### 偶然\n\n＋\n\n### 外来\n\nこの3条件が核心です。\n\n---\n\n# B【詳しい解説①｜なぜ3条件が必要なの？】\n\n「先輩、まず普通のケガを考えてください。」\n\n階段を歩いていた。\n\n↓\n突然足を滑らせた。\n\n↓\n転倒。\n\n↓\n骨折。\n\nこれは、\n\n### 急激\n\n→ 突発的に起きた\n\n### 偶然\n\n→ わざと転んだわけではない\n\n### 外来\n\n→ 身体の外部から作用した事故\n\nという形になります。\n\nしたがって、契約条件を満たせば、\n\n### 傷害保険の対象\n\nになり得ます。\n\n---\n\n# ② 「急激」とは？\n\n「急激＝ものすごく速い、という意味だけじゃありませんよ。」\n\n保険でいう急激性は、\n\n> **事故から傷害までが突発的で、時間的間隔がほとんどなく発生すること**\n\nというイメージです。\n\nたとえば、\n\n階段から転落\n↓\n💥\n↓\n骨折\n\nなら分かりやすいですね。\n\n---\n\n一方、\n\n毎日少しずつ身体に負担\n↓\n数か月後\n↓\n痛みが発生\n\nとなると、\n\n「突然の事故による傷害」\n\nとは性質が違います。\n\n---\n\n# ③ 「偶然」とは？\n\n「これは文字どおりです。」\n\n> **予知できない、または本人の意思に基づかない事故**\n\nという考え方です。\n\n歩いていたら、\n\n🚲💥🧑\n\n自転車と衝突。\n\n→ 偶然の事故。\n\n一方で、\n\n「保険金が欲しいから、わざとケガしよう」\n\n……\n\n### ❌当然ダメです。\n\n「保険は偶然の事故に備えるものですからね。」\n\n---\n\n# ④ 「外来」とは？\n\n「ここが一番誤解しやすいです。」\n\n外来とは、\n\n### 病院の「外来」\n\nではありません。\n\n「先輩、そこじゃないです。」\n\nここでいう外来性は、\n\n> **傷害の原因が身体の外部から作用したもの**\n\nという意味です。\n\nたとえば、\n\n転倒\n↓\n地面に身体を打つ\n↓\n骨折\n\nなら、\n\n### 外部からの作用\n\nがあります。\n\n---\n\n# ⑤ 病気は原則として傷害保険ではない\n\n「ここで傷害保険と医療保険を分けましょう。」\n\nたとえば、\n\n### インフルエンザになった\n\n### がんになった\n\n### 内因性の病気で入院した\n\nこれは、\n\n### 傷害保険？\n\n……\n\n### 原則として違います。\n\n傷害保険の中心は、\n\n### **事故によるケガ**\n\nです。\n\n病気による入院などは、\n\n### 医療保険\n\nなどの領域になります。\n\n---\n\n# ⑥ 「ケガ」と「病気」を原因から見る\n\n「結果だけ見ないでください。」\n\n先輩が入院した。\n\nこれだけでは、\n\n### 傷害保険か医療保険か\n\n判断できません。\n\n---\n\n### ケースA\n\n階段から転落\n↓\n骨折\n↓\n入院\n\n事故によるケガ。\n\n→ **傷害保険の対象になり得る**\n\n---\n\n### ケースB\n\n病気\n↓\n入院\n\n→ **傷害保険では原則対象外**\n\n---\n\n「同じ“入院”でも、**なぜ入院したのか**を見るんです。」\n\n---\n\n# ⑦ 傷害保険は基本的に定額給付\n\n「ここも損害保険らしくない感じがして、引っかかりやすいところです。」\n\n傷害保険では、契約内容に応じて、\n\n### 死亡保険金\n\n### 後遺障害保険金\n\n### 入院保険金\n\n### 手術保険金\n\n### 通院保険金\n\nなどが支払われます。\n\nたとえば、\n\n### 入院1日につき5,000円\n\nという契約なら、\n\n10日入院\n↓\n5,000円 × 10日\n↓\n\n### 5万円\n\nというような考え方です。\n\n---\n\n「先輩、ここで思い出してください。」\n\n損害保険では、\n\n### 実損填補\n\nが重要でした。\n\nでも、\n\n> **損害保険分野の商品だから全部が実損填補とは限りません。**\n\n傷害保険のように、\n\n### 定額で給付するタイプ\n\nもあります。\n\n「60～61あたりで注意した内容が、ここにつながりましたね。」\n\n---\n\n# ⑧ 主な傷害保険\n\n「FPでは種類も整理しておきましょう。」\n\n代表的なものとして、\n\n### 普通傷害保険\n\n日常生活で起こる幅広い傷害事故に備えます。\n\n---\n\n### 家族傷害保険\n\n本人だけでなく、\n\n### 家族\n\nも補償対象とするタイプです。\n\n---\n\n### 交通事故傷害保険\n\n交通事故や交通乗用具に関係する事故など、契約で定められた範囲の傷害を補償します。\n\n---\n\n### 国内旅行傷害保険\n\n国内旅行中の傷害などを補償。\n\n---\n\n### 海外旅行傷害保険\n\n海外旅行中の傷害などに加え、商品によって疾病治療費用や賠償責任、携行品損害など幅広い補償を組み合わせます。\n\n「“傷害保険”と一口に言っても、どの場面まで対象にするかが違うんですね。」\n\n---\n\n# ⑨ 普通傷害保険のイメージ\n\n「普通傷害保険は、“日常生活の事故”と考えると分かりやすいです。」\n\nたとえば、\n\n### 自宅で階段から転落\n\n→ ⭕\n\n### 道で転んで骨折\n\n→ ⭕\n\n### スポーツ中に転倒してケガ\n\n→ 契約条件を満たせば対象になり得る\n\n### 交通事故でケガ\n\n→ ⭕\n\n---\n\n一方、\n\n### 病気で入院\n\n→ 原則❌\n\nです。\n\n---\n\n# ⑩ 「仕事中のケガは？」\n\n「先輩、ここも気になりますよね。」\n\n普通傷害保険では一般に、\n\n### 日常生活中\n\n### 仕事中\n\n### 旅行中\n\nなど、国内外を問わず幅広い事故を補償するタイプがあります。\n\nただし、\n\n### 職業\n\n### 危険な運動\n\n### 特定の活動\n\nなどについて、契約上の制限・対象外が設定されることがあります。\n\n「だから“ケガなら絶対出る”ではなく、必ず契約条件を見るんです。」\n\n---\n\n# C【イメージ理解｜身体の外から突然「ドン！」】\n\n「傷害保険は、この映像で覚えてください。」\n\n先輩が歩いている。\n\n🚶\n\n突然、\n\n💥\n\n外から何かが起こる。\n\n↓\n\n転倒\n\n↓\n\n🦴骨折\n\nここに、\n\n### 突然起きた\n\n→ **急激**\n\n### 予想外だった\n\n→ **偶然**\n\n### 身体の外から作用した\n\n→ **外来**\n\nがあります。\n\nだから、\n\n# **急・偶・外**\n\nです。\n\n「“きゅう・ぐう・がい”。語呂みたいですが、試験では強いですよ。」\n\n---\n\n# D【具体例｜これは傷害保険？】\n\n「先輩、判定ゲームです。」\n\n### ケース①\n\n駅の階段で足を滑らせ、\n\n転倒して骨折。\n\n……\n\n### ⭕対象になり得る\n\n急激\n＋\n偶然\n＋\n外来\n\nですね。\n\n---\n\n### ケース②\n\n風邪をこじらせて入院。\n\n……\n\n### ❌原則として傷害保険ではない\n\n病気だからです。\n\n---\n\n### ケース③\n\n交通事故で骨折。\n\n🚗💥🚶\n\n……\n\n### ⭕対象になり得る\n\n外部から偶然・急激な事故によってケガしています。\n\n---\n\n### ケース④\n\nわざと自分をケガさせた。\n\n……\n\n### ❌\n\n偶然性がありません。\n\n---\n\n# 【これまでとのつながり】\n\n「第2章の最後なので、ここだけつなげておきます。」\n\n損害保険\n↓\n偶然の事故による経済的損失などに備える\n\nその中で、\n\n### 火災保険\n\n→ 建物・家財など\n\n### 地震保険\n\n→ 地震・噴火・津波\n\n### 自動車保険\n\n→ 自動車事故\n\n### 傷害保険\n\n→ **人のケガ**\n\nという位置づけです。\n\n「“何が損害を受けるのか”で見ると整理できますね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n傷害保険で最重要となる事故の3要件は？\n\n……\n\n### **急激・偶然・外来**\n\nです。\n\n---\n\n### Q2\n\n病気による入院は、普通傷害保険で原則補償される？\n\n……\n\n### **❌されません。**\n\n傷害保険の基本は、\n\n### 事故によるケガ\n\nです。\n\n---\n\n### Q3\n\n「外来」とは、病院に通院すること？\n\n……\n\n### **❌違います。**\n\n傷害の原因が、\n\n### **身体の外部から作用すること**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **傷害保険**  \n→ 事故によるケガ\n\n② **3要件**  \n→ 急激・偶然・外来\n\n③ **急激**  \n→ 突発的\n\n④ **偶然**  \n→ 予測・意図していない\n\n⑤ **外来**  \n→ 身体の外から作用\n\n⑥ **病気**  \n→ 原則として対象外\n\n# 【一文で覚える】\n\n> **「傷害保険は、急激・偶然・外来の事故によって身体に傷害を負った場合に、死亡・後遺障害・入院・手術・通院などを契約内容に応じて補償する保険。」**\n\n「はい、先輩。最後はこれだけ絶対に持って帰ってください。」\n\n# **急・偶・外**\n\n### 急激\n\n### 偶然\n\n### 外来\n\nこの3つを見たら、\n\n### **傷害保険**\n\nです。\n\nこれで、今回の第2章「リスク管理」の登録リスト **1「公的保険と私的保険」〜73「傷害保険」まで完走**です。\n\n---", "chapter": 2}, {"n": 74, "title": "普通傷害保険と家族傷害保険", "raw": "# 第2章 リスク管理 74\n\n## 普通傷害保険と家族傷害保険\n\n### A【要点｜普通傷害＝本人中心、家族傷害＝家族まで広げる】\n\n「はい、先輩。では73『傷害保険』から一段掘り下げて、**74として追加**しましょう。」\n\nまず共通する大前提は、前回やったこれです。\n\n> **急激・偶然・外来の事故によるケガを補償する。**\n\nそのうえで違いは、\n\n### 👤 普通傷害保険\n\n→ 基本的に**被保険者本人**の傷害を補償\n\n### 👨‍👩‍👧‍👦 家族傷害保険\n\n→ 普通傷害保険の補償対象を**家族にも広げたもの**\n\nです。\n\n「つまり、補償する事故の基本的な考え方は同じ。大きな違いは**誰まで守るか**ですよ。」\n\n---\n\n# B【詳しい解説①｜普通傷害保険】\n\n普通傷害保険は、\n\n> **日常生活における急激・偶然・外来の事故によって被保険者がケガをした場合に補償する保険**\n\nです。\n\n「先輩、“普通”って書いてあるから軽いケガ専用、という意味じゃないですからね。」\n\nここでの「普通」は、\n\n### 日常生活のさまざまな事故を幅広く対象とする\n\nというイメージです。\n\n---\n\n## たとえば……\n\n先輩が、\n\n### 🏠 自宅の階段で転倒\n\n→ 骨折\n\n### 🚲 自転車で転倒\n\n→ ケガ\n\n### ⚽ スポーツ中に転倒\n\n→ ケガ\n\n### 🚗 交通事故\n\n→ ケガ\n\nこうした事故は、契約条件を満たせば補償対象になり得ます。\n\n---\n\n# ② 「交通事故だけ」じゃない\n\n「ここ、交通事故傷害保険と混ぜやすいです。」\n\n### 普通傷害保険\n\n→ **日常生活中のさまざまな事故**\n\n一方、\n\n### 交通事故傷害保険\n\n→ **交通事故など契約で定められた交通関連事故**\n\nが中心です。\n\nだから、\n\n自宅の階段で転んだ。\n\n### 普通傷害保険\n\n→ ⭕\n\n### 交通事故傷害保険\n\n→ 原則として交通事故ではないので対象外\n\nという違いが出てきます。\n\n---\n\n# ③ 国内だけ？\n\n「え？海外旅行中に転んだら？」\n\nそこ、いいところに気づきましたね。\n\n普通傷害保険は一般に、\n\n> **国内外を問わず、日常生活中の傷害事故**\n\nを対象とします。\n\nたとえば、\n\n🇯🇵日本で転倒\n→ 対象になり得る\n\n🇺🇸アメリカ旅行中に転倒\n→ 対象になり得る\n\nということです。\n\nただし、海外で発生した**病気の治療費**などまで普通傷害保険が幅広く補償する、という意味ではありません。\n\nそこは海外旅行保険などとは区別しましょう。\n\n---\n\n# ④ 病気は？\n\n「これは前回と同じです。」\n\n風邪\n↓\n入院\n\n### ❌原則対象外\n\nがん\n↓\n入院\n\n### ❌原則対象外\n\n階段から転落\n↓\n骨折\n↓\n入院\n\n### ⭕対象になり得る\n\nなぜ？\n\n……\n\n### **急激・偶然・外来の事故によるケガだから。**\n\n「“入院したか”ではなく、**なぜ入院したか**を見るんでしたね。」\n\n---\n\n# ⑤ 家族傷害保険\n\n「では、今回のもう一つです。」\n\n### 家族傷害保険\n\nは、\n\n> **普通傷害保険の補償対象を、本人だけでなく一定範囲の家族にも広げたもの**\n\nと考えれば分かりやすいです。\n\nつまり、\n\n👨父  \n👩母  \n👦子ども\n\nなどを、一つの契約で補償するイメージですね。\n\n---\n\n# ⑥ 誰が「家族」に入るの？\n\n「ここはFPで押さえておきたいところです。」\n\n一般的な家族傷害保険では、契約上の範囲として、\n\n### ① 本人\n\n### ② 本人の配偶者\n\n### ③ 本人または配偶者と生計を共にする同居の親族\n\n### ④ 本人または配偶者と生計を共にする別居の未婚の子\n\nなどが補償対象となる形が基本です。\n\n「先輩、④がちょっと特徴的ですよね。」\n\n---\n\n## 別居している子でも対象になることがある\n\nたとえば、\n\n父母\n→ 和歌山\n\n大学生の子\n→ 東京で一人暮らし\n\nでも、\n\n### 生計を共にしている\n\n＋\n\n### 未婚\n\nなど契約上の家族の条件を満たせば、\n\n### 補償対象になり得ます。\n\n「“別居＝絶対ダメ”ではないんです。」\n\n---\n\n# ⑦ 「生計を共にする」って同居のこと？\n\n「ここも違います。」\n\n### 生計を共にする\n\n＝必ず同じ家に住んでいる、ではありません。\n\nたとえば大学進学で一人暮らししていても、\n\n親から仕送りを受けて生活している\n\nなど、経済的に一つの生活単位とみられる場合があります。\n\nだから、\n\n> **別居していても生計を共にしている未婚の子**\n\nという考え方が成立するんですね。\n\n---\n\n# ⑧ 普通傷害と家族傷害の本質的な違い\n\n「ここで余計な情報を全部落とします。」\n\n両方とも、\n\n### 急激\n\n### 偶然\n\n### 外来\n\nの事故による傷害。\n\nでは違うのは？\n\n……\n\n# **補償される人の範囲**\n\nです。\n\n||普通傷害保険|家族傷害保険|\n|-|-|-|\n|基本的な事故|急激・偶然・外来|急激・偶然・外来|\n|本人|⭕|⭕|\n|配偶者など|原則その契約の被保険者範囲による|⭕一定範囲で対象|\n|子など|原則その契約の被保険者範囲による|⭕一定範囲で対象|\n|特徴|個人を中心に補償|**家族へ範囲を拡大**|\n\n「事故の種類が変わるんじゃありません。**人の範囲が広がる**んです。」\n\n---\n\n# C【イメージ理解｜傘の大きさが違う】\n\n「先輩、傘を想像してください。」\n\n### ☂️普通傷害保険\n\n　　　　☂️  \n　　　　👤  \n　　　先輩\n\n一人を中心に傘を差す。\n\n---\n\n### ☂️家族傷害保険\n\n　　　☂️☂️☂️  \n　👨　👩　👦　👧\n\n傘を大きくして、\n\n### **家族まで中に入れる。**\n\n「でも雨の種類は同じですよ。」\n\nその雨が、\n\n### 急激\n\n### 偶然\n\n### 外来\n\nの事故です。\n\n---\n\n# D【具体例｜大学生の子が一人暮らし】\n\n父母は和歌山で生活。\n\n大学生の息子は、\n\n### 東京で一人暮らし。\n\n親から仕送りを受けていて、\n\n### 未婚\n\nだとします。\n\nその息子が、\n\n大学へ行く途中、\n\n階段で転倒\n↓\n🦴骨折\n\nしました。\n\n---\n\n「家族と別居していますよね。」\n\nでも、\n\n### 生計を共にする\n\n＋\n\n### 別居の未婚の子\n\nなど契約上の条件を満たしていれば、\n\n### **家族傷害保険の補償対象になり得ます。**\n\n「だから“同じ家に住んでいる人だけ＝家族”と覚えないでください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n普通傷害保険と家族傷害保険に共通する事故の3要件は？\n\n……\n\n### **急激・偶然・外来。**\n\n---\n\n### Q2\n\n普通傷害保険と家族傷害保険の大きな違いは？\n\n……\n\n### **補償対象となる人の範囲。**\n\n家族傷害保険では一定範囲の家族まで広がります。\n\n---\n\n### Q3\n\n親と生計を共にしている、別居中の未婚の大学生の子。\n\n家族傷害保険では絶対に対象外？\n\n……\n\n### **❌いいえ。**\n\n契約上の家族の範囲を満たせば、対象になり得ます。\n\n---\n\n# 【30秒復習】\n\n① **普通傷害保険**  \n→ 本人を中心に日常生活の傷害を補償\n\n② **家族傷害保険**  \n→ 一定範囲の家族まで拡大\n\n③ **共通する3条件**  \n→ 急激・偶然・外来\n\n④ **病気**  \n→ 原則対象外\n\n⑤ **国内外**  \n→ 普通傷害保険は一般に国内外の日常生活中の事故が対象\n\n⑥ **別居の未婚の子**  \n→ 生計を共にするなどの条件を満たせば家族傷害保険の対象になり得る\n\n# 【一文で覚える】\n\n> **「普通傷害保険は急激・偶然・外来の事故による本人の傷害を幅広く補償し、家族傷害保険はその補償対象を配偶者や生計を共にする一定範囲の家族まで広げた保険。」**\n\n「はい、先輩。これは難しく考えなくて大丈夫です。」\n\n### ☂️普通傷害\n\n→ **傘が本人中心**\n\n### ☂️家族傷害\n\n→ **傘を家族まで広げる**\n\nでも傘で防ぐものは、どちらも\n\n### **急・偶・外**\n\nです。\n\n---", "chapter": 2}, {"n": 75, "title": "国内旅行傷害保険と海外旅行傷害保険", "raw": "# 第2章 リスク管理 75\n\n## 国内旅行傷害保険と海外旅行傷害保険\n\n### A【要点｜国内＝旅行中の「傷害」が中心、海外＝病気まで広い】\n\n「はい、先輩。今回は名前だけなら“国内か海外か”の違いに見えますよね。でも、試験で大事なのは**補償範囲の違い**です。」\n\nまず大きく、\n\n> 🇯🇵 **国内旅行傷害保険**  \n> → 国内旅行中の**急激・偶然・外来の事故によるケガ**などを補償\n\n> ✈️🌏 **海外旅行傷害保険**  \n> → 海外旅行中のケガに加え、**病気の治療費用なども補償対象になり得る**\n\nここが最大のポイントです。\n\n### 国内 → 傷害中心\n\n### 海外 → 傷害＋疾病など幅広い\n\n「特に**海外旅行傷害保険では疾病も対象になり得る**。ここを普通傷害保険と混ぜないでくださいね。」\n\n---\n\n# B【詳しい解説①｜国内旅行傷害保険】\n\n国内旅行傷害保険は、\n\n> **国内旅行中に起きた急激・偶然・外来の事故による傷害などを補償する保険**\n\nです。\n\nたとえば先輩が、\n\n和歌山\n↓\n北海道へ旅行\n\nしたとします。\n\n旅行中、\n\nホテルの階段で転倒\n↓\n🦴骨折\n\nこれは、\n\n### 急激\n\n### 偶然\n\n### 外来\n\nの事故ですね。\n\nしたがって契約条件を満たせば、\n\n### 国内旅行傷害保険\n\nの対象になり得ます。\n\n---\n\n# ② 国内旅行中に風邪をひいたら？\n\n「ここで問題です。」\n\n北海道旅行中に、\n\n🤒高熱\n↓\n病院へ\n\nこれは国内旅行傷害保険？\n\n……\n\n### 原則として、疾病そのものは基本補償の対象ではありません。\n\nなぜなら、\n\n> **国内旅行傷害保険の基本は“傷害”だから。**\n\n「旅行中に起きたことなら全部補償、ではありませんよ。」\n\n---\n\n# ③ 海外旅行傷害保険\n\n「では海外です。」\n\n先輩がアメリカへ旅行。\n\n✈️🇺🇸\n\n旅行中に階段から転倒。\n\n🦴骨折。\n\nもちろん、契約条件を満たせば、\n\n### 傷害に関する補償\n\nの対象になり得ます。\n\nでも海外旅行傷害保険は、それだけではありません。\n\n代表的には、\n\n* 傷害による治療費用\n* 疾病による治療費用\n* 死亡・後遺障害\n* 賠償責任\n* 携行品損害\n* 救援者費用\n\nなど、契約によって幅広いリスクを補償します。\n\n---\n\n# ④ 海外では「病気」も重要\n\n「先輩、ここが今回の本丸です。」\n\n海外旅行中、\n\n🤒急に病気\n↓\n🏥現地の病院へ\n↓\n💰高額な治療費\n\nとなった。\n\nこの場合、\n\n### 海外旅行傷害保険の疾病治療費用\n\nなどの補償対象になり得ます。\n\n---\n\n「え？傷害保険なのに病気？」\n\nそう思いますよね。\n\n海外旅行保険は名称に「傷害」と付くことがありますが、\n\n> **海外旅行中に起こり得るさまざまなリスクを組み合わせて補償する商品**\n\nとして理解した方がいいです。\n\nだから、\n\n### 普通傷害保険\n\n→ 病気は原則対象外\n\nなのに対して、\n\n### 海外旅行傷害保険\n\n→ **疾病の治療費用なども補償し得る**\n\nという違いがあります。\n\n---\n\n# ⑤ 携行品損害\n\n「人の身体だけじゃないですよ。」\n\n海外旅行中、\n\n📱スマホを落として破損\n\n🧳持ち物が盗難\n\n📷カメラが事故で破損\n\nなど。\n\n契約内容によって、\n\n### **携行品損害**\n\nとして補償される場合があります。\n\n「ただし、何でも無条件で対象になるわけではなく、対象物・免責・事故原因などの条件があります。」\n\n---\n\n# ⑥ 賠償責任\n\n先輩が海外のホテルで、\n\nうっかり備品を壊してしまった。\n\n💥🏨\n\n法律上の損害賠償責任を負った。\n\nこうした場合、\n\n### **個人賠償責任に関する補償**\n\nが付いていれば対象になり得ます。\n\n「つまり海外旅行保険は、自分がケガするリスクだけ見ていないんです。」\n\n---\n\n# ⑦ 救援者費用\n\n「これも海外旅行保険らしいところです。」\n\n海外で先輩が大ケガして長期入院。\n\n🏥\n\n日本にいる家族が、\n\n✈️\n↓\n現地へ\n\n向かう必要が出てきた。\n\nこのようなケースで、契約条件に応じて、\n\n### 家族が現地へ向かうための交通費\n\n### 宿泊費など\n\nを対象とする、\n\n### **救援者費用**\n\nがあります。\n\n---\n\n# ⑧ 旅行期間はいつから？\n\n「先輩、“飛行機に乗った瞬間から海外旅行保険開始”と思っていません？」\n\n実際には一般的な海外旅行保険では、\n\n> **海外旅行の目的をもって住居を出発してから、旅行を終えて住居に帰着するまで**\n\nという旅行行程を基準に補償期間が設定されます。\n\nつまり、\n\n🏠自宅\n↓\n🚃空港\n↓\n✈️海外\n↓\n✈️帰国\n↓\n🚃\n↓\n🏠自宅\n\nという一連の旅行行程を考えます。\n\n「もちろん具体的な補償期間は契約内容を確認してくださいね。」\n\n---\n\n# C【イメージ理解｜国内は「ケガ用の傘」、海外は「旅行トラブル用の大きな傘」】\n\n「こう覚えましょう。」\n\n## 🇯🇵 国内旅行傷害保険\n\n　　　☂️\n　　　🤕\n　**旅行中の傷害**\n\n傘の中心は、\n\n### 急・偶・外によるケガ\n\n---\n\n## 🌏 海外旅行傷害保険\n\n　　　　　☂️☂️☂️\n\n🤕ケガ　🤒病気　🧳携行品  \n　🏥治療　💥賠償　✈️救援\n\n「海外ではトラブルへの備えを大きな傘にしている、と考えると分かりやすいです。」\n\n---\n\n# D【具体例｜ハワイ旅行で体調を崩した】\n\n先輩が、\n\n🇯🇵日本\n↓\n✈️\n↓\n🌴ハワイ\n\nへ旅行。\n\nところが現地で、\n\n🤒急病\n↓\n🏥受診\n↓\n💰高額な治療費\n\nが発生したとします。\n\n---\n\n「これ、転んだわけでも事故に遭ったわけでもありません。」\n\nつまり、\n\n### 急激・偶然・外来の「傷害」\n\nではなく、\n\n### **疾病**\n\nです。\n\n普通傷害保険の基本的な傷害補償だけでは、\n\n### 原則対象外。\n\n一方、海外旅行保険で、\n\n### 疾病治療費用\n\nを補償する契約なら、\n\n### ⭕対象になり得る。\n\n「だから海外旅行保険は、“ケガだけの保険”として覚えると間違えるんです。」\n\n---\n\n# 【比較するとここ】\n\n||国内旅行傷害保険|海外旅行傷害保険|\n|-|-|-|\n|旅行先|🇯🇵国内|🌏海外|\n|事故によるケガ|⭕|⭕|\n|疾病の治療費用|基本補償では原則対象外|**⭕補償対象になり得る**|\n|賠償責任|契約による|⭕契約により補償|\n|携行品損害|契約による|⭕契約により補償|\n|救援者費用|契約による|⭕代表的な補償|\n\n「FPで比較するなら、まず**疾病**に注目してください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n国内旅行中に階段から転落して骨折。\n\n国内旅行傷害保険の対象になり得る？\n\n……\n\n### **⭕なります。**\n\n急激・偶然・外来の事故による傷害だからです。\n\n---\n\n### Q2\n\n国内旅行中に風邪をひいた。\n\n国内旅行傷害保険の基本的な傷害補償の対象？\n\n……\n\n### **❌原則として対象外です。**\n\n疾病だからですね。\n\n---\n\n### Q3\n\n海外旅行中に病気になり現地で治療を受けた。\n\n海外旅行保険では？\n\n……\n\n### **⭕疾病治療費用などの補償対象になり得ます。**\n\nここが国内旅行傷害保険との重要な違いです。\n\n---\n\n# 【30秒復習】\n\n① **国内旅行傷害保険**  \n→ 国内旅行中の傷害が中心\n\n② **傷害の3要件**  \n→ 急激・偶然・外来\n\n③ **国内旅行中の病気**  \n→ 基本補償では原則対象外\n\n④ **海外旅行保険**  \n→ 傷害だけではない\n\n⑤ **海外旅行中の疾病**  \n→ 治療費用などが補償対象になり得る\n\n⑥ **海外特有の代表的補償**  \n→ 携行品・賠償責任・救援者費用など\n\n# 【一文で覚える】\n\n> **「国内旅行傷害保険は国内旅行中の急激・偶然・外来の事故による傷害を中心に補償し、海外旅行傷害保険は海外旅行中の傷害に加えて疾病治療費用・賠償責任・携行品損害・救援者費用など幅広いリスクを補償する。」**\n\n「先輩、最後はこれです。」\n\n### 🇯🇵 国内\n\n→ **ケガ中心**\n\n### 🌏 海外\n\n→ **ケガ＋病気など幅広い**\n\nこの差を押さえておけば、かなり整理しやすいですよ。\n\n---", "chapter": 2}, {"n": 76, "title": "交通事故傷害保険", "raw": "# 第2章 リスク管理 76\n\n## 交通事故傷害保険\n\n### A【要点｜交通事故・交通乗用具に関係するケガに絞った傷害保険】\n\n「はい、先輩。今回は**普通傷害保険との違い**を軸にすると簡単です。」\n\n**交通事故傷害保険**とは、\n\n> **交通事故や交通乗用具に関係する事故などによって、被保険者がケガをした場合に補償する傷害保険**\n\nです。\n\n傷害保険なので基本はもちろん、\n\n### 急激\n\n### 偶然\n\n### 外来\n\nです。\n\nただし普通傷害保険より、\n\n> **事故の範囲を「交通」に絞っている**\n\nのがポイントです。\n\n### 普通傷害保険\n\n→ 日常生活の事故を幅広く\n\n### 交通事故傷害保険\n\n→ **交通に関係する事故を中心に**\n\n「“自動車事故だけ”ではありませんよ。ここ、先に注意です。」\n\n---\n\n# B【詳しい解説①｜何が「交通事故」なの？】\n\n「先輩、“交通事故”と聞いたら何を思い浮かべます？」\n\n🚗💥🚗\n\nたぶん自動車同士の事故ですよね。\n\nもちろん対象になり得ます。\n\nでも、それだけではありません。\n\nたとえば、\n\n### 🚗 自動車\n\n### 🚌 バス\n\n### 🚃 電車\n\n### 🚲 自転車\n\nなどの交通乗用具に関係する事故が対象になり得ます。\n\nつまり、\n\n> **交通事故傷害保険＝自動車保険**\n\nではありません。\n\n---\n\n# ② 歩行者でも対象になり得る\n\n「え？自分が車に乗ってないとダメ？」\n\n……\n\n### いいえ。\n\n先輩が歩いているとき、\n\n🚶\n↓\n🚗💥\n↓\nケガ\n\nという事故。\n\n先輩は交通乗用具に乗っていません。\n\nそれでも、\n\n### 交通事故による傷害\n\nなので対象になり得ます。\n\n「“乗っている人専用”ではないんですね。」\n\n---\n\n# ③ 電車・バスでも考える\n\nたとえば、\n\n🚌バスに乗車中\n↓\n急ブレーキ\n↓\n転倒して骨折\n\nあるいは、\n\n🚃電車に乗車中\n↓\n事故\n↓\nケガ\n\nこうしたケースも、契約上の交通事故に該当すれば補償対象になり得ます。\n\nだから、\n\n### 「車」ではなく\n\n### **「交通」**\n\nで覚えてください。\n\n---\n\n# ④ 普通傷害保険との違い\n\n「ここが一番重要です。」\n\n## 普通傷害保険\n\n日常生活中の、\n\n🏠階段から転落  \n⚽スポーツ中の転倒  \n🚲自転車事故  \n🚗交通事故\n\nなど、幅広い傷害事故を対象とします。\n\n---\n\n## 交通事故傷害保険\n\nその中から、\n\n### 🚗🚲🚃🚌\n\n**交通に関係する事故**\n\nなどに補償範囲を絞ります。\n\n---\n\n「つまり、円で考えると分かりやすいです。」\n\n### 普通傷害保険\n\n⭕⭕⭕⭕⭕⭕⭕\n→ 広い\n\nその中の、\n\n### 交通事故傷害保険\n\n🚗🚲🚃\n→ **交通分野に限定**\n\nというイメージです。\n\n---\n\n# ⑤ 自宅の階段で転んだら？\n\n「では先輩、問題です。」\n\n自宅で、\n\n階段を踏み外す\n↓\n🦴骨折\n\nこれは、\n\n急激\n＋\n偶然\n＋\n外来\n\nですよね。\n\nでは交通事故傷害保険は？\n\n……\n\n### ❌基本的には対象外です。\n\nなぜ？\n\n### **交通事故ではないから。**\n\n---\n\n一方、\n\n### 普通傷害保険\n\nなら、契約条件を満たせば対象になり得ます。\n\n「同じ“傷害”でも、事故の種類が違うんです。」\n\n---\n\n# ⑥ 病気はどうなる？\n\n「これはもう先輩なら分かりますね。」\n\n電車で通勤中、\n\n急に病気で倒れた。\n\n🚃\n↓\n🤒\n\n「電車の中だから交通事故傷害保険！」\n\n……\n\n### ❌そういうことではありません。\n\n交通事故傷害保険の基本は、\n\n> **交通事故などによる傷害**\n\nです。\n\n単に交通乗用具の中で病気になっただけなら、交通事故による傷害とはいえません。\n\n「場所ではなく、**原因**を見るんですよ。」\n\n---\n\n# ⑦ 自動車保険の「搭乗者傷害」とは違う\n\n「先輩、ここも混ざりそうなので分けます。」\n\n前にやった、\n\n### 搭乗者傷害保険\n\nは、自動車保険の中で、\n\n> **契約車両に搭乗中の人の傷害**\n\nなどを補償するものです。\n\n一方、\n\n### 交通事故傷害保険\n\nは傷害保険として、\n\n> **交通事故・交通乗用具に関係する事故などによる被保険者の傷害**\n\nを補償します。\n\nだから、\n\n### 🚶歩行中に車にはねられた\n\n場合でも、交通事故傷害保険なら対象になり得ます。\n\n「“搭乗者”という名前が付いていない理由が見えてきますね。」\n\n---\n\n# C【イメージ理解｜普通傷害保険から「交通」だけ切り取る】\n\n「大きな箱を想像してください。」\n\n## 📦 普通傷害保険\n\n中には、\n\n🏠自宅で転倒  \n⚽スポーツでケガ  \n🚗自動車事故  \n🚲自転車事故  \n🚌バス事故  \n🚃電車事故\n\nなどがあります。\n\nここから、\n\n### 🚦「交通関係だけください」\n\nと切り取る。\n\nすると、\n\n🚗\n🚲\n🚌\n🚃\n🚶💥🚗\n\nこの箱が、\n\n# **交通事故傷害保険**\n\nというイメージです。\n\n---\n\n# D【具体例｜4つを判定】\n\n「先輩、実際に仕分けしましょう。」\n\n### ケース①\n\n歩行中に車にはねられて骨折\n\n🚶💥🚗\n\n→ **⭕対象になり得る**\n\n---\n\n### ケース②\n\n自転車で走行中に転倒して骨折\n\n🚲💥\n\n→ 契約上の交通事故に該当すれば、**⭕対象になり得る**\n\n---\n\n### ケース③\n\n自宅の階段から転落\n\n🏠💥\n\n→ **❌交通事故傷害保険では基本的に対象外**\n\nただし普通傷害保険なら対象になり得ます。\n\n---\n\n### ケース④\n\nバスの中で、事故とは関係なく病気を発症\n\n🚌🤒\n\n→ **❌交通事故による傷害ではない**\n\n「乗り物の中にいたかではなく、**交通事故が原因か**を見る。ここ、大事ですよ。」\n\n---\n\n# 【3つの傷害保険を整理】\n\n|保険|補償範囲のイメージ|\n|-|-|\n|**普通傷害保険**|日常生活の傷害を幅広く|\n|**交通事故傷害保険**|**交通事故などに限定**|\n|**国内旅行傷害保険**|国内旅行中の傷害|\n|**海外旅行傷害保険**|海外旅行中の傷害＋疾病など幅広い補償|\n\n「全部“傷害”と付いていますが、**いつ・どんな事故を対象にするか**が違うわけです。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n交通事故傷害保険は、自動車に乗っているときだけ？\n\n……\n\n### **❌違います。**\n\n歩行中に車にはねられるなど、交通事故による傷害も対象になり得ます。\n\n---\n\n### Q2\n\n自宅の階段で転倒して骨折した場合は？\n\n……\n\n### 交通事故傷害保険\n\n→ **基本的に対象外**\n\n普通傷害保険\n→ **対象になり得る**\n\nです。\n\n---\n\n### Q3\n\n電車内で、交通事故とは関係なく病気になった。\n\n交通事故傷害保険？\n\n……\n\n### **❌原則違います。**\n\n交通事故などによる**傷害**ではないからです。\n\n---\n\n# 【30秒復習】\n\n① **交通事故傷害保険**  \n→ 交通に関係する傷害事故\n\n② **基本3要件**  \n→ 急激・偶然・外来\n\n③ **自動車だけ？**  \n→ いいえ\n\n④ **歩行中に車にはねられる**  \n→ 対象になり得る\n\n⑤ **自宅の階段で転倒**  \n→ 基本的に対象外\n\n⑥ **普通傷害との違い**  \n→ 普通傷害の方が事故範囲が広い\n\n# 【一文で覚える】\n\n> **「交通事故傷害保険は、急激・偶然・外来の事故のうち、交通事故や交通乗用具に関係する事故などによる傷害を補償する保険。」**\n\n「はい、先輩。最後はこの関係だけです。」\n\n### ☂️普通傷害保険\n\n→ **日常のケガを広く**\n\nその中から、\n\n### 🚗🚲🚌🚃 交通事故傷害保険\n\n→ **交通関係に絞る**\n\n“自動車だけ”ではなく、**交通**です。\n\n---", "chapter": 2}, {"n": 77, "title": "賠償責任保険", "raw": "# 第2章 リスク管理 77\n\n## 賠償責任保険\n\n### A【要点｜「他人に損害を与えて、賠償責任を負った」ときの保険】\n\n「はい、先輩。今回は**自分がケガしたときの保険ではありません**。ここを最初に切り分けます。」\n\n**賠償責任保険**とは、\n\n> **偶然な事故などによって他人の身体や財物に損害を与え、法律上の損害賠償責任を負った場合に、その賠償損害などを補償する保険**\n\nです。\n\n流れは、\n\n### ① 他人に損害を与える\n\n↓\n\n### ② 法律上の損害賠償責任が発生\n\n↓\n\n### ③ 賠償責任保険で補償\n\nです。\n\n「先輩、重要なのは②です。」\n\n> **相手が損害を受けた＝必ず保険金が出る**\n\nではありません。\n\n基本は、\n\n### **自分に法律上の賠償責任があるか**\n\nを見るんです。\n\n---\n\n# B【詳しい解説①｜そもそも「賠償責任」って何？】\n\n「たとえば先輩が自転車に乗っているとします。」\n\n🚲💨\n\n不注意で歩行者に衝突。\n\n🚲💥🚶\n\n相手が骨折。\n\n治療費などが発生しました。\n\nこのとき先輩が法律上、\n\n### 「相手の損害を賠償してください」\n\nという責任を負うことがあります。\n\nこれが、\n\n# **損害賠償責任**\n\nです。\n\nその賠償による経済的負担に備えるのが、\n\n### 賠償責任保険\n\nなんですね。\n\n---\n\n# ② 「人」だけではない\n\n「先輩、賠償というとケガをさせた場合だけだと思ってません？」\n\n違います。\n\n大きく、\n\n### 👤 他人の身体\n\n→ ケガ・死亡など\n\nと、\n\n### 📱🏠 他人の財物\n\n→ 壊す・傷つけるなど\n\nがあります。\n\n---\n\nたとえば、\n\n自転車で人に衝突\n→ 👤身体への損害\n\n店の商品を誤って壊す\n→ 📦財物への損害\n\n他人の物を壊す\n→ 👜財物への損害\n\nなどです。\n\n---\n\n# ③ 自分のケガは？\n\n「じゃあ先輩が自転車で転倒して、先輩自身が骨折。」\n\n🚲💥  \n🧑「痛い……」\n\n### 賠償責任保険！\n\n……\n\n「違います。」\n\n### ❌自分自身の傷害を補償する保険ではありません。\n\n自分のケガなら、\n\n### 傷害保険\n\nなどを考えます。\n\n---\n\n「整理すると、」\n\n### 自分がケガ\n\n→ **傷害保険**\n\n### 他人に損害を与えて賠償責任\n\n→ **賠償責任保険**\n\nです。\n\n---\n\n# ④ 個人賠償責任保険\n\n「日常生活で特に身近なのがこれです。」\n\n### **個人賠償責任保険**\n\n日常生活における偶然な事故などで、\n\n> **他人を死傷させたり、他人の物を壊したりして法律上の損害賠償責任を負った場合**\n\nに備えます。\n\n---\n\nたとえば、\n\n### 🚲 自転車で歩行者に衝突\n\n### 🛍️ 店の商品を誤って破損\n\n### ⚽ 子どもがボールで他人の物を破損\n\nなどです。\n\n「日常生活の“うっかり他人に損害を与えた”に備えるイメージですね。」\n\n---\n\n# ⑤ マンションで水漏れ\n\n「FPでもイメージしやすい例です。」\n\n先輩がマンションに住んでいる。\n\n自分の不注意などによって水漏れ。\n\n💧💧💧\n↓\n下の階へ\n↓\n📺💥\n\n下の住人の家財に損害。\n\n先輩に法律上の損害賠償責任が発生した。\n\nこの場合、\n\n### 個人賠償責任保険\n\nで補償対象になり得ます。\n\n---\n\n「じゃあ先輩自身の家具も水で壊れた。」\n\nそれも個人賠償？\n\n……\n\n### ❌違います。\n\n個人賠償責任保険は、\n\n### **他人に対する賠償責任**\n\nが中心です。\n\n---\n\n# ⑥ 自動車事故も個人賠償責任保険？\n\n「ここ、かなり重要です。」\n\n先輩が自動車を運転して、\n\n🚗💥🚶\n\n相手にケガをさせた。\n\n「他人への賠償だから個人賠償責任保険ですよね？」\n\n……\n\n### ❌通常は違います。\n\n自動車による賠償責任は、一般的な個人賠償責任特約では対象外とされ、\n\n### 自賠責保険\n\n＋\n\n### 自動車保険の対人・対物賠償\n\nで備えます。\n\n「何でも個人賠償でまとめられるわけではないんですよ。」\n\n---\n\n# ⑦ 仕事中の事故は？\n\n「では先輩が仕事として作業中、他人の物を壊したら？」\n\n一般的な個人賠償責任保険は、\n\n### 日常生活上の賠償責任\n\nを対象とするものなので、\n\n> **業務遂行に直接起因する賠償責任などは通常対象外**\n\nです。\n\n事業活動なら、\n\n### 事業者向けの賠償責任保険\n\nなどを検討します。\n\n---\n\n# ⑧ 借りた物を壊したら？\n\n「“他人の物を壊したんだから全部出る”も危険です。」\n\n他人から借りて、自分が管理している物などについては、一般的な個人賠償責任保険では補償対象外となることがあります。\n\nただし現在の商品では、\n\n### 受託品に関する補償\n\nなどが特約として付けられる場合があります。\n\n「だから試験では、まず**他人の身体・財物への法律上の賠償責任**という基本を押さえ、細かい対象範囲は契約次第と考えましょう。」\n\n---\n\n# ⑨ 火災保険や自動車保険の「特約」で付けることも多い\n\n「個人賠償責任保険は単独の商品だけをイメージしなくて大丈夫です。」\n\nたとえば、\n\n### 火災保険\n\n### 自動車保険\n\nなどに、\n\n### **個人賠償責任特約**\n\nとして付帯する形があります。\n\n「だから、自分が加入していることに気づかず、複数の保険に同じような特約を付けているケースもあり得るんですね。」\n\n---\n\n# ⑩ 賠償責任保険は「実損」を埋める\n\n「ここ、傷害保険との違いにもつながります。」\n\n傷害保険では、\n\n### 入院1日5,000円\n\nなどの定額給付がありました。\n\nでも賠償責任保険は、\n\n> **実際に負担する法律上の損害賠償額などを、保険金額の範囲内で補償する**\n\nという実損補償が基本です。\n\nだから、\n\n実際の賠償額\n→ 100万円\n\nなのに、\n\n「保険金額1億円だから1億円ください」\n\n……\n\n### ❌当然できません。\n\n「61でやった**利得禁止の原則**につながっていますね。」\n\n---\n\n# C【イメージ理解｜自分を守る盾ではなく「相手に向いた矢印」】\n\n「傷害保険と並べましょう。」\n\n## 傷害保険\n\n💥\n↓\n🧑先輩がケガ\n\n### 自分の身体を守る\n\n---\n\n## 賠償責任保険\n\n🧑先輩\n↓\n💥\n↓\n👤📱他人\n\n### 他人に損害\n\n↓\n\n### 賠償責任\n\n↓\n💰\n\nここを保険でカバー。\n\n「つまり、矢印の方向を見るんです。」\n\n### 自分が被害を受けた\n\n→ 傷害保険など\n\n### 自分が他人に損害を与えた\n\n→ **賠償責任保険**\n\nです。\n\n---\n\n# D【具体例｜自転車で歩行者に衝突】\n\n先輩が自転車で走行中。\n\n🚲💨\n\n前方確認が不十分で、\n\n🚲💥🚶\n\n歩行者に衝突。\n\n相手に大きなケガが残り、\n\n治療費\n＋\n休業損害\n＋\n逸失利益\n＋\n慰謝料など\n\nによって、\n\n### 5,000万円\n\nの法律上の損害賠償責任を負ったとします。\n\n---\n\n個人賠償責任保険に加入していて、事故が契約上の補償対象なら、\n\n### 保険金額の範囲内で補償\n\nされることになります。\n\n「自転車事故でも賠償額が大きくなる可能性があるから、個人賠償責任補償は重要なんですね。」\n\n---\n\n# 【ここまでの保険を整理】\n\n|状況|主な保険|\n|-|-|\n|自分が事故でケガ|**傷害保険**|\n|国内旅行中にケガ|**国内旅行傷害保険**|\n|交通事故でケガ|**交通事故傷害保険**|\n|他人に損害を与え賠償責任|**賠償責任保険**|\n|自動車で他人に損害|**自動車保険の対人・対物賠償など**|\n\n---\n\n# 【理解確認】\n\n### Q1\n\n先輩自身が転倒して骨折しました。個人賠償責任保険？\n\n……\n\n### **❌違います。**\n\n自分の傷害なので傷害保険などです。\n\n---\n\n### Q2\n\n自転車で歩行者に衝突し、法律上の損害賠償責任を負った。\n\n……\n\n### **⭕個人賠償責任保険の対象になり得ます。**\n\n---\n\n### Q3\n\n相手に損害が発生すれば、法律上の賠償責任がなくても必ず賠償責任保険から支払われる？\n\n……\n\n### **❌いいえ。**\n\n基本となるのは、\n\n### **法律上の損害賠償責任を負うこと**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **賠償責任保険**  \n→ 他人への賠償責任\n\n② **身体だけ？**  \n→ 他人の身体＋財物\n\n③ **自分のケガ**  \n→ 傷害保険など\n\n④ **日常生活の賠償**  \n→ 個人賠償責任保険\n\n⑤ **自動車事故**  \n→ 自賠責＋自動車保険の対人・対物など\n\n⑥ **支払いの基本**  \n→ 実際の法律上の賠償損害を補償\n\n# 【一文で覚える】\n\n> **「賠償責任保険は、偶然な事故などによって他人の身体や財物に損害を与え、法律上の損害賠償責任を負った場合に、その賠償損害などを補償する保険。」**\n\n「先輩、迷ったら一つだけ自分に聞いてください。」\n\n### **『誰が損害を受けた？』**\n\n自分\n→ **傷害保険など**\n\n他人\n＋\n自分に賠償責任\n→ **賠償責任保険**\n\nこの矢印が見えれば、もう混ざりません。\n\n---", "chapter": 2}, {"n": 78, "title": "個人賠償責任保険と生産物賠償責任保険（PL保険）", "raw": "# 第2章 リスク管理 78\n\n## 個人賠償責任保険と生産物賠償責任保険（PL保険）\n\n### A【要点｜「個人の日常生活」か「企業の製品」か】\n\n「はい、先輩。今回は同じ**賠償責任保険**でも、“誰が・何を原因として賠償するのか”が違います。」\n\nまず結論です。\n\n> 👤 **個人賠償責任保険**  \n> → 個人が**日常生活上の事故**で他人に損害を与えた場合\n\n> 🏭 **生産物賠償責任保険（PL保険）**  \n> → 企業などが**製造・販売した製品など**によって他人に損害を与えた場合\n\nです。\n\n「ものすごく簡単にすれば、」\n\n### 👤個人の日常生活\n\n→ **個人賠償**\n\n### 🏭企業の製品\n\n→ **PL保険**\n\nです。\n\n---\n\n# B【詳しい解説①｜個人賠償責任保険】\n\n「まず前回やった個人賠償から確認します。」\n\n先輩が自転車で走行中、\n\n🚲💥🚶\n\n歩行者に衝突。\n\n相手がケガ。\n\n先輩に、\n\n### 法律上の損害賠償責任\n\nが発生しました。\n\nこうした、\n\n> **日常生活における偶然な事故によって、他人を死傷させたり、他人の物を壊したりして法律上の損害賠償責任を負った場合**\n\nに備えるのが、\n\n# **個人賠償責任保険**\n\nです。\n\n---\n\n## たとえば……\n\n### 🚲 自転車で歩行者に衝突\n\n### ⚽ 子どもがボールで他人の物を破損\n\n### 💧 自宅から水漏れして階下の家財に損害\n\nなどですね。\n\n「ポイントは**日常生活**です。」\n\n---\n\n# ② 生産物賠償責任保険とは？\n\n「では今回の新しい方です。」\n\n### 生産物賠償責任保険\n\n英語で、\n\n### Product Liability Insurance\n\nそのため、\n\n# **PL保険**\n\nと呼ばれます。\n\n---\n\n企業が、\n\n🏭製造\n↓\n📦販売\n↓\n👤消費者が使用\n\nした後、その製品などが原因となって、\n\n### 👤人がケガ\n\nまたは、\n\n### 🏠他人の財物が損壊\n\nして企業などが法律上の損害賠償責任を負うことがあります。\n\nその賠償リスクに備えるのが、\n\n### **生産物賠償責任保険**\n\nです。\n\n---\n\n# ③ たとえば食品メーカー\n\n「先輩、食品だと分かりやすいです。」\n\n食品メーカーが、\n\n🍱商品を製造・販売\n\n↓\n\nその食品に問題\n\n↓\n\n消費者が食べる\n\n↓\n\n🤢食中毒\n\n↓\n\nメーカーなどに法律上の損害賠償責任\n\nこのとき、\n\n### **PL保険**\n\nの対象になり得ます。\n\n---\n\n# ④ 電化製品なら？\n\nメーカーが、\n\n🔌電化製品を製造・販売\n\n↓\n\n消費者が購入\n\n↓\n\n製品が原因となって発火🔥\n\n↓\n\n🏠家が損傷\n\n↓\n\nメーカーが法律上の賠償責任\n\nこうした場合にも、\n\n### PL保険\n\nが問題になります。\n\n「つまり製品そのものを直す保険ではなく、**製品によって他人に生じた損害についての賠償責任**をカバーするのがポイントです。」\n\n---\n\n# ⑤ 「壊れた製品そのもの」は？\n\n「先輩、ここで罠です。」\n\nメーカーが作った炊飯器。\n\n🍚\n\n欠陥があって、\n\n### 炊飯器そのものが壊れた。\n\n「PL保険！」\n\n……\n\n### 基本的には、製品そのものの損害を補償する保険ではありません。\n\nPL保険で重要なのは、\n\n> **その製品などによって第三者の身体・財物に損害が生じ、法律上の賠償責任を負う**\n\nことです。\n\n---\n\nたとえば、\n\n### 炊飯器だけ壊れた\n\n→ 製品自体の問題\n\n一方、\n\n### 炊飯器から出火\n\n↓\n\n### 消費者がやけど\n\n＋\n\n### 家財も焼けた\n\n→ **対人・対物の賠償責任**\n\nここでPL保険が出てきます。\n\n「“製品を保証する保険”ではないんですよ。」\n\n---\n\n# ⑥ 「製造した会社」だけ？\n\n「PL保険って“生産物”だからメーカーだけ？」\n\nそう思いますよね。\n\nでも、製品事故に関して法律上の賠償責任を負う可能性があるのは、製造業者だけとは限りません。\n\n契約によって、\n\n### 製造\n\n### 販売\n\n### 提供\n\nなどに関係する事業者の賠償リスクに備えます。\n\nさらにPL保険では、商品によって、\n\n> **仕事を完了した後、その仕事の結果が原因となって生じた事故**\n\nを対象とする補償もあります。\n\n「だから“工場だけの保険”と狭く覚えないでください。」\n\n---\n\n# ⑦ 「PL法」と「PL保険」は別物\n\n「ここ、名前が似ているので整理します。」\n\n### 製造物責任法\n\n→ **法律**\n\n### PL保険\n\n→ **保険**\n\nです。\n\n製造物責任法では、製造物の欠陥によって他人の生命・身体・財産に損害が生じた場合について、一定の要件のもと製造業者等の損害賠償責任を定めています。\n\nそして、\n\n### その賠償責任による経済的負担に備える\n\nのが、\n\n### **PL保険**\n\nです。\n\n「法律そのものが保険金を払ってくれるわけじゃありませんからね。」\n\n---\n\n# ⑧ 個人賠償との決定的な違い\n\n「では二つを並べます。」\n\n||個人賠償責任保険|生産物賠償責任保険|\n|-|-|-|\n|主な対象|**個人**|**事業者**|\n|場面|日常生活|事業活動|\n|原因|日常生活の偶然な事故|製造・販売した製品など|\n|相手の身体|⭕|⭕|\n|相手の財物|⭕|⭕|\n|法律上の賠償責任|必要|必要|\n|通称|個人賠償|**PL保険**|\n\n「共通しているのは、**他人に損害＋法律上の賠償責任**です。」\n\n違うのは、\n\n### 何が原因なのか\n\nなんですね。\n\n---\n\n# C【イメージ理解｜家の玄関と工場の出荷口】\n\n「二つのドアを想像してください。」\n\n## 👤 個人賠償\n\n🏠自宅  \n↓  \n🚪日常生活  \n↓  \n🚲💥🚶  \n↓  \n他人に損害  \n↓\n\n### 個人賠償責任保険\n\n---\n\n## 🏭 PL保険\n\n🏭工場  \n↓  \n🚪製品を出荷  \n↓  \n📦→消費者  \n↓  \n🔥製品事故  \n↓  \n他人に損害  \n↓\n\n### PL保険\n\n「日常生活から出た事故なら個人賠償、**製品などから出た事故ならPL**。この絵で分けましょう。」\n\n---\n\n# D【具体例｜ケーキ店で考える】\n\n「先輩がケーキ店を経営しているとしましょう。」\n\n店でケーキを製造。\n\n🎂\n\nお客さんに販売。\n\n↓\n\nお客さんが自宅で食べる。\n\n↓\n\n食品に問題があり、\n\n🤢食中毒\n\n↓\n\n治療費など100万円\n\n↓\n\n店に法律上の損害賠償責任が発生。\n\n---\n\n「これ、先輩個人の個人賠償責任保険？」\n\n……\n\n### ❌基本的に違います。\n\n事業として販売した食品による事故です。\n\nそこで、\n\n### **生産物賠償責任保険（PL保険）**\n\nが問題になります。\n\n---\n\n## じゃあ休日に……\n\n先輩がプライベートで、\n\n🚲💥🚶\n\n自転車で歩行者に衝突。\n\nこれは事業とは関係ありません。\n\n### 日常生活上の事故\n\nです。\n\nしたがって、\n\n### **個人賠償責任保険**\n\nが対象になり得ます。\n\n「同じ人が事故を起こしても、**日常生活なのか事業なのか**で変わるんです。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n休日に自転車で歩行者に衝突し、賠償責任を負った。\n\n……\n\n### **個人賠償責任保険。**\n\n---\n\n### Q2\n\nメーカーが販売した製品の欠陥によって消費者がケガし、メーカーが賠償責任を負った。\n\n……\n\n### **生産物賠償責任保険（PL保険）。**\n\n---\n\n### Q3\n\n欠陥製品が壊れたが、製品そのもの以外には損害がなかった。\n\nPL保険は製品自体を新品に交換するための保険？\n\n……\n\n### **❌違います。**\n\nPL保険は基本的に、\n\n### 製品そのものの品質保証\n\nではなく、\n\n### **製品などによって第三者に生じた身体・財物損害についての賠償責任**\n\nに備える保険です。\n\n---\n\n# 【30秒復習】\n\n① **個人賠償**  \n→ 日常生活\n\n② **PL保険**  \n→ 製品などによる事故\n\n③ **個人賠償の例**  \n→ 自転車で歩行者に衝突\n\n④ **PLの例**  \n→ 販売食品で食中毒\n\n⑤ **PL法**  \n→ 法律\n\n⑥ **PL保険**  \n→ 賠償リスクに備える保険\n\n# 【一文で覚える】\n\n> **「個人賠償責任保険は個人の日常生活上の事故による賠償責任に備え、生産物賠償責任保険（PL保険）は製造・販売した製品などによって第三者に身体・財物損害を与えた場合の事業者の賠償責任に備える。」**\n\n「はい、先輩。最後は原因だけ見ますよ。」\n\n### 👤 日常生活でやってしまった\n\n→ **個人賠償**\n\n### 🏭 売った製品などがやってしまった\n\n→ **PL保険**\n\nどちらも最後は、\n\n**他人に損害 → 法律上の賠償責任**\n\nここにつながります。\n\n---", "chapter": 2}, {"n": 79, "title": "施設所有者賠償責任保険と受託者賠償責任保険", "raw": "# 第2章 リスク管理 79\n\n## 施設所有者賠償責任保険と受
