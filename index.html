は**自動振替貸付制度**が働いて、すぐ失効しない場合があります。」\n\n「はい。次回やるところですね。ちゃんとつながっています。」\n\n---\n\n# B【詳しい解説｜そもそも「払込期月」って？】\n\n「先輩、“猶予期間”の前に**払込期月**を理解しましょう。」\n\nたとえば月払いで、\n\n**10月分の保険料を10月中に払う**\n\nという契約だったとします。\n\nこの10月が、\n\n> **払込期月**\n\nです。\n\nところが口座残高が足りなくて、引き落としできなかった。\n\n「はい、先輩。ここで契約終了？」\n\n……\n\n「違います。」\n\n一定の**猶予期間**があります。\n\nその間に保険料を支払えば、契約を継続できます。\n\n---\n\n## 月払いの場合\n\n「FPではここも押さえておきましょう。」\n\n一般的な月払い契約では、\n\n> **払込期月の翌月1日から末日まで**\n\nが猶予期間となるタイプがあります。\n\nたとえば、\n\n**10月が払込期月**\n\nなら、\n\n10月中に払えなかった\n↓\n**11月1日～11月30日**\n↓\n猶予期間\n\nというイメージです。\n\nただし、実際の猶予期間は契約・保険会社等によって異なることがあります。\n\n「なので、“必ずすべての保険がこの日程”とは思わないでくださいね。」\n\n---\n\n# 猶予期間中に事故が起きたら？\n\n「先輩、たぶんここ気になりましたよね。」\n\n10月分の保険料を払えていない。\n\n11月は猶予期間。\n\nその11月中に被保険者が死亡した。\n\n「保険料を払ってないから、死亡保険金ゼロ？」\n\n……\n\n「そうとは限りません。」\n\n猶予期間中は契約が有効なので、保険事故が発生した場合には、一般に**未払保険料を差し引くなどして保険金が支払われる**取扱いがあります。\n\nつまり、\n\n> **払込期月を過ぎた＝即座に保障がなくなる**\n\nではないんです。\n\nこれが「猶予」の意味です。\n\n---\n\n# じゃあ猶予期間まで過ぎたら？\n\n「ここからが重要です。」\n\n払込期月に払わない。\n\n↓\n\n猶予期間にも払わない。\n\n↓\n\n猶予期間終了。\n\n「さすがに、いつまでも待ってはくれません。」\n\n原則として、\n\n## **契約は失効**\n\nします。\n\n**失効＝保険契約の効力がなくなること**\n\nです。\n\n---\n\n「ただし。」\n\n解約返戻金がある契約などでは、\n\n**自動振替貸付制度**\n\nによって保険会社が保険料を自動的に立て替え、契約が継続する場合があります。\n\n「ここ、次回詳しくやります。」\n\nだから正確には、\n\n**猶予期間終了**\n↓\n未払い\n↓\n自動振替貸付などが適用される？\n↓\nされなければ\n↓\n**失効**\n\nというイメージです。\n\n---\n\n# 「失効したら、もう二度と戻せない？」\n\n「先輩、それもまだ早いです。」\n\n一定の条件を満たせば、\n\n## **復活**\n\nできる場合があります。\n\nこれも後で出てきます。\n\nですから流れとしては、\n\n**保険料を払う**\n↓\n払込期月に払えない\n↓\n**猶予期間**\n↓\nそれでも払わない\n↓\n**失効**\n↓\n一定条件を満たす\n↓\n**復活**\n\nとなります。\n\n「今後の単語が全部つながってきますよ。」\n\n---\n\n# C【イメージ理解｜スマホ料金で考えましょう】\n\n「先輩、スマホ料金の支払いを忘れたと想像してください。」\n\n支払日を1日過ぎた瞬間、\n\n📱「はい、契約永久終了です」\n\n……だったら困りますよね。\n\nそこで、\n\n「まだこの期間なら払ってくださいね」\n\nという時間がある。\n\nこれが保険でいう、\n\n### **猶予期間**\n\nのイメージです。\n\nでも、\n\n「猶予期間も無視します」\n\n「まだ払いません」\n\n「さらに払いません」\n\nとなれば、\n\n「もう……先輩？」\n\nとなります。\n\n最終的には契約の効力が失われる。\n\nそれが、\n\n### **失効**\n\nです。\n\n---\n\n# D【具体例｜時系列で理解しましょう】\n\n「先輩、月払いの生命保険を例にします。」\n\n### 10月\n\n10月分の保険料を支払う月。\n\nつまり、\n\n**払込期月＝10月**\n\nです。\n\nでも口座残高不足で払えなかった。\n\n---\n\n### 11月\n\n一般的な例として、\n\n**11月1日～11月30日**\n\nが猶予期間だったとします。\n\n11月20日に、\n\n「忘れてた！」\n\nと保険料を払った。\n\nどうなる？\n\n……\n\n**契約は継続。**\n\n「そうです。まだ猶予期間内ですからね。」\n\n---\n\n## では11月30日まで払わなかったら？\n\n猶予期間終了。\n\nさらに自動振替貸付なども適用されない。\n\nすると、\n\n### **原則、契約は失効**\n\nします。\n\n「だから、」\n\n10月に払えなかった\n↓\n即失効\n\nではありません。\n\n10月に払えなかった\n↓\n11月の猶予期間\n↓\nそれでも払わない\n↓\n失効\n\nです。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n### Q1\n\n払込猶予期間とは？\n\n……\n\n**払込期月までに保険料を払えなくても、一定期間支払いを待ってもらえる期間。**\n\n「はい。」\n\n### Q2\n\n払込期月を過ぎた瞬間に契約は失効する？\n\n……\n\n**原則として、すぐには失効しません。**\n\n払込猶予期間があります。\n\n### Q3\n\n猶予期間を過ぎても保険料を払わなかったら？\n\n……\n\n原則、\n\n**失効**\n\nします。\n\nただし、自動振替貸付制度などが適用される場合があります。\n\n「そうです。この“ただし”まで覚えておくと強いですよ。」\n\n---\n\n# 【30秒復習】\n\n① **払込期月とは？**  \n→ 保険料を払い込むべき月\n\n② **その月に払えなかったら即失効？**  \n→ **しない**\n\n③ **その後は？**  \n→ **払込猶予期間**\n\n④ **猶予期間中に払えば？**  \n→ 契約継続\n\n⑤ **猶予期間も過ぎたら？**  \n→ 原則、**失効**\n\n⑥ **失効を防ぐ仕組みの一つは？**  \n→ **自動振替貸付制度**\n\n# 【一文で覚える】\n\n> **「保険料を払込期月に払えなくても即失効ではない。猶予期間があり、それでも払わなければ原則失効。」**\n\n「はい。ここからの3項目は連続で覚えるとかなり楽です。」\n\n**⑰ 払込猶予**\n↓\n**⑱ 自動振替貸付・契約者貸付**\n↓\n**⑲ 失効・復活**\n\n「なので次は、その“失効を防ぐ仕組み”と“保険からお金を借りる仕組み”の違いを整理します。」\n\n次は **⑱「自動振替貸付制度と契約者貸付制度」** です。\n\n---", "chapter": 2}, {"n": 18, "title": "自動振替貸付制度と契約者貸付制度", "raw": "# 第2章 リスク管理⑱\n\n## 自動振替貸付制度と契約者貸付制度\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。ここは名前が似ていますけど、**目的が全然違います。**」\n\nまず一言で分けます。\n\n> **自動振替貸付＝保険料を払えないとき、保険会社が自動的に立て替える。**\n\n> **契約者貸付＝契約者がお金を必要とするとき、保険会社から借りる。**\n\n「はい。ここを混ぜないでください。」\n\n覚え方は、\n\n**自動振替**\n→ 💰「保険料を立て替えて！」\n\n**契約者貸付**\n→ 💴「現金を貸して！」\n\nです。\n\nそして、どちらも基本的に**解約返戻金をもとにした仕組み**です。\n\n---\n\n# B【詳しい解説｜まず自動振替貸付から】\n\n## ① 自動振替貸付制度\n\n「先輩、前回の続きをそのまま使います。」\n\n保険料を払えなかった。\n\n↓\n\n払込猶予期間に入った。\n\n↓\n\nそれでも払わなかった。\n\n「このままだと？」\n\n……\n\nそうです。\n\n**原則、失効**でした。\n\nでも解約返戻金がある契約などでは、一定の範囲内で保険会社が保険料を自動的に立て替えて、契約を継続させる仕組みがあります。\n\nそれが、\n\n## **自動振替貸付制度**\n\nです。\n\n---\n\n「先輩、“振替”っていうから、自分の銀行口座から勝手に引き落とす制度だと思ってません？」\n\n……違いますよ。\n\n保険会社が、\n\n**解約返戻金をもとに、保険料を貸し付ける**\n\nイメージです。\n\nだから、\n\n> **自分のお金を単純に取り崩しているわけではなく、貸付なので利息がつきます。**\n\nここ重要です。\n\n---\n\n## 自動振替貸付の流れ\n\n保険料を払えない\n↓\n猶予期間終了\n↓\nそのままなら失効\n↓\n解約返戻金が一定以上ある\n↓\nその範囲内で保険会社が保険料を自動的に立て替える\n↓\n**契約継続**\n\n「つまり目的は？」\n\n……\n\n### **保険契約を失効させないこと**\n\nです。\n\n---\n\n# ② 契約者貸付制度\n\n「では、こっちです。」\n\n契約者貸付制度は、\n\n> **契約者が、解約返戻金の一定範囲内で保険会社からお金を借りられる制度。**\n\nです。\n\nたとえば、\n\n「急に30万円必要になった」\n\nでも、\n\n「保険を解約するのは嫌だな……」\n\nというとき。\n\n解約返戻金が十分にある契約なら、その一定範囲内で、\n\n**保険契約を継続したまま**\n\nお金を借りられる場合があります。\n\n「ここが便利なんですね。」\n\n---\n\n## 「じゃあ自分の解約返戻金を引き出してるだけ？」\n\n「ちょっと待ってください。ここも違います。」\n\n契約者貸付は、\n\n### **貸付**\n\nです。\n\nですから、\n\n> **利息がかかります。**\n\n「“自分の積立なんだから無料で引き出せる”ではないですよ。」\n\n解約返戻金を担保のような基準として、その一定範囲で**保険会社から借りる**と考えてください。\n\n---\n\n# 2つを比較しましょう\n\n「はい、先輩。ここが今回の中心です。」\n\n||自動振替貸付|契約者貸付|\n|-|-|-|\n|目的|保険料の立替え|契約者が資金を借りる|\n|誰のためのお金？|保険料に充当|契約者が利用|\n|自動？|原則、自動的|契約者が申し込む|\n|基礎|解約返戻金|解約返戻金|\n|利息|あり|あり|\n|契約|継続|継続したまま借入可能|\n\n「つまり――」\n\n> **自動振替＝保険を守る貸付**  \n> **契約者貸付＝生活などに使える貸付**\n\nくらいのイメージで分けましょう。\n\n---\n\n# 「借りっぱなしでも大丈夫？」\n\n「先輩？」\n\n「返さなくても保険会社から借りられるなら、そのままでいいじゃん」\n\n……って思いました？\n\n貸付金には利息がつきます。\n\nそして貸付金と利息が積み上がると、契約に影響する可能性があります。\n\nまた、貸付金が残っている状態で保険金・解約返戻金などが支払われる場合には、一般に**貸付元利金が差し引かれます。**\n\nだから、\n\n「借りたけど忘れていいお金」\n\nではありません。\n\n---\n\n# C【イメージ理解｜2人の先輩で考えましょう】\n\n「同じ終身保険に入っているA先輩とB先輩がいるとします。」\n\n### A先輩\n\n「あっ……保険料払うの忘れた。」\n\n猶予期間も終了。\n\nでも解約返戻金がある。\n\n保険会社：\n\n「このままだと失効するので、一定の条件のもとで保険料を立て替えますね。」\n\n→ **自動振替貸付**\n\n---\n\n### B先輩\n\n「急に20万円必要になった。でも終身保険は解約したくない。」\n\nそこで、\n\n「解約返戻金の範囲内で貸してください」\n\nと申し込む。\n\n→ **契約者貸付**\n\n---\n\n「違い、見えました？」\n\nA先輩は、\n\n**保険料を払えない**\n→ 自動振替\n\nB先輩は、\n\n**現金が必要**\n→ 契約者貸付\n\nです。\n\n---\n\n# D【具体例｜100万円の解約返戻金があるとします】\n\n「先輩の保険に、仮に解約返戻金が100万円あるとしましょう。」\n\n※貸付可能額は契約によって異なるので、以下は仕組みを理解するための単純化した例です。\n\n---\n\n### ケース①\n\n保険料3万円を払えず、猶予期間も終了。\n\n一定の条件を満たして自動振替貸付が適用された。\n\n↓\n\n保険会社が、\n\n**3万円を保険料として立て替える**\n\n↓\n\n契約継続。\n\n「これが？」\n\n……\n\n### **自動振替貸付**\n\nです。\n\n---\n\n### ケース②\n\n先輩が、\n\n「家電が壊れて30万円必要。でも保険は解約したくない」\n\nとなった。\n\n解約返戻金をもとに、貸付可能範囲内で30万円を借りる。\n\n↓\n\n契約はそのまま。\n\n↓\n\n30万円には利息がつく。\n\n「これは？」\n\n……\n\n### **契約者貸付**\n\nです。\n\n---\n\n# 【理解確認】\n\n「はい、3問いきますよ。」\n\n### Q1\n\n保険料を払えず、失効を防ぐため保険会社が保険料を立て替える制度は？\n\n……\n\n**自動振替貸付制度。**\n\n「はい。」\n\n### Q2\n\n契約者がお金を必要として、解約返戻金の一定範囲内で借りる制度は？\n\n……\n\n**契約者貸付制度。**\n\n「そうです。」\n\n### Q3\n\nどちらも解約返戻金から単純に自分のお金を引き出しているだけなので、利息はない？\n\n……\n\n「違います。」\n\n### **どちらも貸付なので、利息がかかります。**\n\n「ここ、かなり大事ですよ。」\n\n---\n\n# 【30秒復習】\n\n① **自動振替貸付は？**  \n→ 保険料を自動的に立て替える\n\n② **目的は？**  \n→ **失効を防いで契約を継続**\n\n③ **契約者貸付は？**  \n→ 契約者がお金を借りる\n\n④ **何をもとにする？**  \n→ **解約返戻金**\n\n⑤ **利息は？**  \n→ **どちらもあり**\n\n⑥ **最大の違いは？**  \n→ **自動振替＝保険料、契約者貸付＝契約者が使う資金**\n\n# 【一文で覚える】\n\n> **「自動振替貸付は“保険料を貸す”、契約者貸付は“契約者にお金を貸す”。どちらも解約返戻金をもとにした貸付なので利息あり。」**\n\n「はい。これで前回からつながりましたね。」\n\n**払込期月に払えない**\n↓\n**払込猶予**\n↓\nそれでも払えない\n↓\n**自動振替貸付が使えれば契約継続**\n↓\n使えなければ原則……\n↓\n**失効**\n\n「ということで次は、その失効した契約をどう戻すのかまでセットでやります。」\n\n次は **⑲「契約の失効と復活」** です。\n\n---", "chapter": 2}, {"n": 19, "title": "契約の失効と復活", "raw": "# 第2章 リスク管理⑲\n\n## 契約の失効と復活\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回はここまでの**払込猶予→自動振替貸付**の続きです。」\n\nまず2つを一言で分けます。\n\n> **失効＝保険契約の効力がなくなること。**  \n> **復活＝失効した契約を、所定の手続きをして元の状態に戻すこと。**\n\n「ただし先輩。」\n\n**失効したら『あとでお金払えば自動的に元通り』ではありません。**\n\n復活するには一般に、\n\n**① 復活の申込み**  \n**② 告知・診査**  \n**③ 未払保険料などの払込み**\n\nといった手続きが必要です。\n\nそして保険会社による**承諾**も必要になります。\n\n「つまり復活は、単なる滞納料金の支払いではないんです。」\n\n---\n\n# B【詳しい解説｜まず「失効」はどう起こる？】\n\n「前回までの流れをそのままつなげますよ。」\n\n保険料を払う\n↓\n払込期月に払えなかった\n↓\n**払込猶予期間**\n↓\nそれでも払わなかった\n↓\n自動振替貸付なども利用できない\n↓\n\n### **失効**\n\nです。\n\n「失効するとどうなると思います？」\n\n……\n\nそうです。\n\n> **保険契約の効力がなくなり、保障を受けられない状態になります。**\n\nだから失効中に保険事故が起きても、原則としてその契約から保険金を受け取ることはできません。\n\n---\n\n## 「失効＝解約？」\n\n「あ、先輩。ここ混ぜないでください。」\n\n### 失効\n\n→ 保険料を払わなかったことなどによって、**契約の効力がなくなる**\n\n### 解約\n\n→ 契約者の意思によって、**契約を終了させる**\n\nです。\n\n「結果として保障がなくなる点は似ていますが、原因が違います。」\n\n> **失効＝払えずに効力を失う**  \n> **解約＝自分からやめる**\n\nまずはこう分けてください。\n\n---\n\n# では「復活」とは？\n\n「先輩、保険料を払い忘れて失効してしまった。」\n\nでも、\n\n「やっぱりこの保険を続けたい！」\n\nとなった。\n\nそこで利用できる場合があるのが、\n\n## **復活**\n\nです。\n\nただし、\n\n「すみません、戻してください」\n\nだけではダメです。\n\n一般的には、\n\n**復活を申し込む**\n↓\n**健康状態などを告知・診査**\n↓\n**未払保険料などを払い込む**\n↓\n**保険会社が承諾**\n↓\n\n### 契約が復活\n\nという流れになります。\n\n---\n\n## 「なんでまた告知するの？」\n\n「先輩、そこが今回かなり重要です。」\n\n最初に保険へ加入したときも、\n\n**告知義務**\n\nがありましたよね。\n\nなぜ告知したんでした？\n\n……\n\n「そうです。」\n\n保険会社が**引き受けるリスクを判断するため**でした。\n\n失効してから時間が経てば、健康状態が変わっている可能性があります。\n\nたとえば、\n\n加入時\n→ 健康\n\n失効\n\n↓\n\nその後\n→ 大きな病気にかかった\n\n↓\n\n「病気になったから保険を復活させよう」\n\nとなったら？\n\n「保険会社としては、何も確認せずに戻すわけにはいきませんよね。」\n\nだから復活するときにも、一般に**告知や診査**が必要になるわけです。\n\n---\n\n# 「復活なら保険料は今の年齢で再計算？」\n\n「ここ、復活の大きな特徴です。」\n\n新しく保険に入り直すのとは違って、\n\n> **復活すれば、原則として失効前の契約内容が引き継がれます。**\n\nつまり一般に、保険料も**元の契約の保険料**が引き継がれます。\n\n「先輩が40歳で失効して、41歳で復活したからといって、41歳で新規加入した保険として全部作り直す、ということではありません。」\n\nこれが**新規契約と復活の違い**です。\n\n---\n\n# ただし「いつでも復活できる」ではありません\n\n「先輩、ここも注意です。」\n\n失効した契約は永遠に復活できるわけではありません。\n\n> **保険会社が定める一定期間内**\n\nに復活の手続きをする必要があります。\n\nさらに、\n\n健康状態などによっては、\n\n### **復活できない場合もあります。**\n\n「だから、“失効しても復活すればいいや”は危険ですよ。」\n\n---\n\n# C【イメージ理解｜ゲームのコンティニューで考えましょう】\n\n「先輩、ゲームを想像してください。」\n\n保険契約をプレイ中。\n\n毎月保険料を払って、\n\n▶️ **契約継続中**\n\nです。\n\nところが保険料を払わず、\n\n猶予期間も終了。\n\nすると、\n\n💀 **GAME OVER＝失効**\n\nみたいな状態になります。\n\n「じゃあNEW GAME？」\n\n……ではなくて、\n\n一定の条件を満たせば、\n\n### CONTINUE＝復活\n\nできるイメージです。\n\nただし、\n\n「コンティニューします！」\n\nだけではダメ。\n\n復活申込み  \n＋  \n告知・診査  \n＋  \n未払保険料等の払込み  \n＋  \n保険会社の承諾\n\nなどが必要です。\n\nそして復活すれば、\n\n**以前の契約を引き継いで再開**\n\nする。\n\n「NEW GAMEではなくCONTINUE。これが復活のイメージです。」\n\n---\n\n# D【具体例｜時系列で見ましょう】\n\n「では先輩。」\n\nAさんが毎月1万円の生命保険に加入していたとします。\n\n### 10月\n\n保険料を払えなかった。\n\n↓\n\n### 11月\n\n払込猶予期間。\n\nそれでも払わなかった。\n\n自動振替貸付も利用できなかった。\n\n↓\n\n### 猶予期間終了\n\n### **契約失効**\n\n「この時点では保障は？」\n\n……\n\n**なくなっています。**\n\n---\n\nその後Aさんが、\n\n「やっぱりこの保険を戻したい」\n\nと考えました。\n\nそこで、\n\n復活を申し込む\n↓\n健康状態などを告知\n↓\n必要な未払保険料などを払い込む\n↓\n保険会社が審査・承諾\n↓\n\n### **復活**\n\nとなります。\n\n---\n\n## もし健康状態が大きく悪化していたら？\n\n「先輩、復活申込みさえすれば絶対戻れる？」\n\n……\n\n**いいえ。**\n\n告知・診査の結果などによって、\n\n### 復活できないことがあります。\n\n「だから失効させないことが一番なんですよ。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n「失効」とは？\n\n……\n\n**保険料を払わないなどの理由で、保険契約の効力がなくなること。**\n\n「はい。」\n\n### Q2\n\n失効した契約は、お金を払えば自動的に復活する？\n\n……\n\n**しません。**\n\n一般に、\n\n**復活申込み・告知や診査・未払保険料等の払込み・保険会社の承諾**\n\nなどが必要です。\n\n### Q3\n\n復活するとき健康状態が悪化していた場合でも、必ず復活できる？\n\n……\n\n**できるとは限りません。**\n\n保険会社の審査があります。\n\n「はい。ここ重要です。」\n\n---\n\n# 【30秒復習】\n\n① **失効とは？**  \n→ 契約の効力がなくなること\n\n② **典型的な原因は？**  \n→ 猶予期間までに保険料を払わない\n\n③ **復活とは？**  \n→ 失効した契約を元に戻すこと\n\n④ **復活時に必要なのは？**  \n→ 申込み・告知/診査・未払保険料等の払込みなど\n\n⑤ **必ず復活できる？**  \n→ **できない**\n\n⑥ **解約との違いは？**  \n→ **失効＝保険料未払いなどで効力を失う／解約＝契約者が自分の意思で契約を終了**\n\n# 【ここまでを一本につなげる】\n\n「先輩、⑰〜⑲は一つの物語として覚えますよ。」\n\n**保険料を払えない**\n↓\n**⑰ 払込猶予**\n↓\nそれでも払えない\n↓\n**⑱ 自動振替貸付**\n↓\n利用できれば契約継続\n↓\n利用できず、保険料も払わない\n↓\n**⑲ 失効**\n↓\n所定の手続き＋保険会社の承諾\n↓\n**復活**\n\n「はい。この流れが頭に入っていれば、単語を一個ずつ丸暗記する必要はありません。」\n\n# 【一文で覚える】\n\n> **「払わずに効力を失うのが失効。申込み・告知・未払保険料等の払込みなどを行い、承諾されて元の契約に戻るのが復活。」**\n\n「これで保険契約の維持に関する一連の流れがつながりました。」\n\n次は **⑳「必要保障額」** です。\n\n---", "chapter": 2}, {"n": 20, "title": "必要保障額（ひつようほしょうがく）", "raw": "# 第2章 リスク管理⑳\n\n## 必要保障額（ひつようほしょうがく）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**必要保障額**です。」\n\n「死亡保険って、とりあえず大きい金額にしておけば安心……とか思ってません？」\n\n……もう。保険料も高くなるんですから、ちゃんと計算しましょう。\n\n一言でいうと、\n\n> **必要保障額＝家族に必要なお金－死亡後に入ってくるお金**\n\nです。\n\nFPでは、もう少し正確に、\n\n> **必要保障額 ＝ 遺族の支出見込額 － 遺族の収入見込額**\n\nと考えます。\n\nたとえば一家の働き手が亡くなった場合、\n\n「これから家族に3,000万円必要」\n\nでも、\n\n「遺族年金や預貯金などで2,000万円準備できる」\n\nなら、\n\n**3,000万円 − 2,000万円＝1,000万円**\n\nこの不足する**1,000万円**を生命保険などで補おう、という考え方です。\n\n「つまり――」\n\n> **必要保障額＝死亡したらもらえる金額、ではなく、“死亡後に不足する金額”です。**\n\nここ、最重要ですよ。\n\n---\n\n# B【詳しい解説｜なぜ「必要額－入ってくるお金」なの？】\n\n「先輩、夫婦と子ども2人の家庭を想像してください。」\n\n一家の主な働き手が亡くなりました。\n\nすると、残された家族にはこれからもお金が必要です。\n\nたとえば、\n\n**生活費\n子どもの教育費\n住居費\n葬儀費用**\nなど。\n\nこうしたものをまとめて、\n\n### **遺族の支出見込額**\n\nと考えます。\n\n---\n\n「じゃあ、その全部を生命保険で用意しないといけない？」\n\n……\n\n「いいえ。そこが今回のポイントです。」\n\n亡くなった後にも、家族には入ってくるお金があります。\n\nたとえば、\n\n**遺族年金\n死亡退職金\n預貯金\n配偶者の収入**\n\nなどですね。\n\nこれが、\n\n### **遺族の収入見込額**\n\nです。\n\nだから、\n\n**必要になるお金**\nから\n**すでに用意できるお金**\nを引けばいい。\n\n---\n\n## 式にすると\n\n**遺族の支出見込額**\n－\n**遺族の収入見込額**\n＝\n\n### **必要保障額**\n\n「先輩、“不足額を埋める”って考えればいいんです。」\n\n---\n\n# 支出には何が入る？\n\n「もう少し具体的に見ますよ。」\n\n一家の働き手が死亡した場合の支出として考えられるのは、\n\n**① 遺族の生活費**\n\n当然、残された家族も生活します。\n\n食費、光熱費、衣服費などですね。\n\n---\n\n**② 子どもの教育費**\n\n「これ、かなり重要です。」\n\n子どもが小さければ、\n\n小学校\n↓\n中学校\n↓\n高校\n↓\n大学\n\nと教育費が続きます。\n\n---\n\n**③ 住居費**\n\n家賃などが必要になる場合があります。\n\nただし住宅ローンについては、**団体信用生命保険（団信）**によって死亡時に残債が弁済されるケースがあります。\n\n「だから住宅ローンが3,000万円残っているから、その3,000万円を必ず必要保障額に丸ごと追加、とは限らないんです。」\n\n---\n\n**④ 葬儀費用など**\n\n死亡直後に必要になる一時的な費用も考えます。\n\n---\n\n# 収入には何が入る？\n\n「今度は引く側です。」\n\n代表的なのが、\n\n### 遺族年金\n\n公的年金から受け取れる可能性があります。\n\n「先輩、第1章でやりましたよね。」\n\nさらに、\n\n**死亡退職金**\n\n**現在の預貯金**\n\n**配偶者の今後の収入**\n\nなども考えます。\n\nつまり、\n\n支出だけ見て、\n\n「5,000万円必要だ！」\n\nと判断するのではなく、\n\n**すでに入ってくるお金も考慮する**\n\nということです。\n\n---\n\n# 必要保障額はずっと同じ？\n\n「先輩、ここも重要です。」\n\n30歳で子どもが生まれたばかりの家庭。\n\n↓\n\n教育費も生活費もこれから長期間必要。\n\nだから、\n\n**必要保障額は大きくなりやすい。**\n\nでも20年後。\n\n子どもが独立した。\n\n預貯金も増えた。\n\n「さて、必要保障額は？」\n\n……\n\n一般には**小さくなっていきます。**\n\nつまり、\n\n> **必要保障額はライフステージによって変化する。**\n\nということです。\n\n---\n\n## 時間とともにどうなる？\n\n典型的には、\n\n子ども誕生\n↓\n必要保障額が大きい\n↓\n子ども成長\n↓\n必要な教育費・生活費の残りが減る\n↓\n貯蓄が増える\n↓\n子ども独立\n↓\n\n### 必要保障額が小さくなる\n\nという流れです。\n\n「あれ？ 先輩、何か思い出しません？」\n\n後で出てくる、\n\n### **逓減定期保険**\n\n### **収入保障保険**\n\nです。\n\n保障額が時間とともに減っていくタイプですね。\n\n「必要保障額が年齢とともに減っていく家庭では、この考え方と相性がいいわけです。」\n\n---\n\n# C【イメージ理解｜穴を埋めると思ってください】\n\n「先輩、必要保障額は**穴埋め問題**だと思ってください。」\n\n家族がこれから必要なお金が、\n\n🪣 **5,000万円**\n\nだったとします。\n\nでも、\n\n遺族年金\n＋\n預貯金\n＋\n死亡退職金\n＋\n配偶者の収入\n\nなどで、\n\n🪣 **3,500万円**\n\n用意できる。\n\nすると、\n\n5,000万円\n−\n3,500万円\n＝\n\n……\n\n### **1,500万円不足**\n\nこの**穴**を生命保険などで埋める。\n\nだから、\n\n> 必要保障額＝「家族に必要な全額」ではなく「足りない部分」\n\nなんです。\n\n「このイメージ、かなり大事ですよ。」\n\n---\n\n# D【具体例｜実際に計算します】\n\n「先輩、FPらしく数字でやりましょう。」\n\n夫が死亡した場合の、\n\n### 遺族の支出見込額\n\n生活費  \n→ 3,000万円\n\n教育費  \n→ 1,500万円\n\n住居費など  \n→ 500万円\n\n葬儀等  \n→ 200万円\n\n合計、\n\n### **5,200万円**\n\n---\n\n一方、\n\n### 遺族の収入見込額\n\n遺族年金  \n→ 1,500万円\n\n死亡退職金  \n→ 500万円\n\n預貯金  \n→ 700万円\n\n配偶者の収入など  \n→ 1,000万円\n\n合計、\n\n### **3,700万円**\n\n---\n\n「さて先輩。必要保障額はいくら？」\n\n……\n\n5,200万円\n−\n3,700万円\n＝\n\n# **1,500万円**\n\nです。\n\nつまり、この例では、\n\n**1,500万円の不足**\n\nを生命保険などで補うことを検討します。\n\n---\n\n## じゃあ預貯金が増えたら？\n\n預貯金が700万円ではなく、\n\n**1,200万円**\n\nあったとしましょう。\n\n収入見込額は、\n\n3,700万円\n＋\n500万円\n＝ **4,200万円**\n\nになります。\n\nすると、\n\n5,200万円\n−\n4,200万円\n＝\n\n### **1,000万円**\n\n「あ、必要保障額が500万円減りましたね。」\n\nつまり、\n\n> **貯蓄などが増えるほど、他の条件が同じなら必要保障額は小さくなる。**\n\nということです。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n### Q1\n\n必要保障額の基本式は？\n\n……\n\n> **遺族の支出見込額 − 遺族の収入見込額**\n\nです。\n\n---\n\n### Q2\n\n家族に今後5,000万円必要で、遺族年金・預貯金などで3,000万円用意できる。\n\n必要保障額は？\n\n……\n\n**2,000万円。**\n\n「はい。5,000万円ではありませんよ。」\n\n---\n\n### Q3\n\n子どもが独立し、預貯金も増えていったら、一般的に必要保障額はどうなる？\n\n……\n\n### **小さくなっていく。**\n\n「そうです。ここから逓減定期保険や収入保障保険にもつながります。」\n\n---\n\n# 【30秒復習】\n\n① **必要保障額とは？**  \n→ 死亡後に家族に不足するお金\n\n② **基本式は？**  \n→ **支出見込額 − 収入見込額**\n\n③ **支出には？**  \n→ 生活費・教育費・住居費・葬儀費用など\n\n④ **収入には？**  \n→ 遺族年金・死亡退職金・預貯金・配偶者収入など\n\n⑤ **子どもの独立・貯蓄増加で？**  \n→ 一般に必要保障額は減る\n\n⑥ **最大の勘違いは？**  \n→ **必要な生活費の総額＝必要保障額ではない**\n\n# 【一文で覚える】\n\n> **「必要保障額は、遺族に必要なお金から遺族年金・貯蓄などを引いた“不足分”。」**\n\n「はい。ここは式を丸暗記するより、**“家族のお金の穴を保険で埋める”**と覚えてください。」\n\nそして次から、いよいよ具体的な保険商品の分類に入ります。\n\n次は **㉑「生命保険」** です。\n\n---", "chapter": 2}, {"n": 21, "title": "生命保険（せいめいほけん）", "raw": "# 第2章 リスク管理㉑\n\n## 生命保険（せいめいほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。ここから具体的な生命保険の商品に入っていきます。」\n\n「生命保険って何？」と聞かれて、\n\n**『死んだらお金がもらえる保険』**\n\nだけで終わらせないでくださいね。\n\n大きく整理すると、生命保険は**人の生死を対象とする保険**で、基本分類として次の3つを押さえます。\n\n> **① 死亡保険**  \n> **② 生存保険**  \n> **③ 生死混合保険**\n\n「はい。実は③はもうやりました。」\n\n**生死混合保険の代表＝養老保険**\n\nでしたね。\n\nまずは、\n\n**死亡したら → 死亡保険**  \n**生存していたら → 生存保険**  \n**両方を組み合わせる → 生死混合保険**\n\nという全体地図を作りましょう。\n\n---\n\n# B【詳しい解説｜3つは何が違うの？】\n\n## ① 死亡保険\n\n「まず一番イメージしやすいものです。」\n\n被保険者が死亡した場合などに、保険金が支払われるタイプです。\n\n代表的なのが、\n\n### **定期保険**\n\n### **終身保険**\n\nです。\n\n「この2つ、これから詳しくやります。」\n\nざっくり言えば、\n\n**定期保険**\n→ 一定期間を保障\n\n**終身保険**\n→ 一生涯を保障\n\nです。\n\n---\n\n## ② 生存保険\n\n「今度は逆です。」\n\n> **一定期間生存していることを条件として、保険金などが支払われる保険**\n\nです。\n\n「死亡したら払う、ではなく、**生きていること**が支払いの条件になるんですね。」\n\nただし、実際の商品では死亡保障などを組み合わせて設計されることもあります。\n\n---\n\n## ③ 生死混合保険\n\n「はい、先輩。これは覚えてますよね？」\n\n死亡保険\n＋\n生存保険\n＝\n\n……\n\n### **生死混合保険**\n\nです。\n\n代表例は？\n\n……\n\n「そうです。」\n\n# **養老保険**\n\nですね。\n\n保険期間中に死亡\n→ **死亡保険金**\n\n満期まで生存\n→ **満期保険金**\n\nという仕組みでした。\n\n---\n\n# じゃあ「定期・終身・養老」はどう整理する？\n\n「先輩、ここから先、商品名が一気に増えます。」\n\nだから今のうちに3本柱を作りますよ。\n\n### 定期保険\n\n→ **一定期間の死亡保障**\n\n### 終身保険\n\n→ **一生涯の死亡保障**\n\n### 養老保険\n\n→ **死亡保障＋満期保険金**\n\n「この3つは生命保険の基本中の基本です。」\n\n---\n\n## 図にすると\n\n**生命保険**\n\n↓\n\n**死亡保険**  \n↳ 定期保険  \n↳ 終身保険\n\n**生存保険**  \n↳ 生存を条件に給付\n\n**生死混合保険**  \n↳ 養老保険\n\n「まずこの地図を頭に置いてください。」\n\n---\n\n# 「契約者・被保険者・保険金受取人」も分けましょう\n\n「先輩、生命保険ではこの3人もごちゃごちゃになりやすいです。」\n\n### 契約者\n\n→ **保険会社と契約を結び、保険料を負担する人**\n\n### 被保険者\n\n→ **その人の生死などが保険の対象になる人**\n\n### 保険金受取人\n\n→ **保険金を受け取る人**\n\n「全部同じ人とは限りません。」\n\n---\n\nたとえば、\n\n夫が自分に生命保険をかけて、死亡時に妻が保険金を受け取る。\n\nこの場合、\n\n**契約者＝夫**\n\n**被保険者＝夫**\n\n**死亡保険金受取人＝妻**\n\nという形が考えられます。\n\n「この3者の組み合わせは、後で**死亡保険金にかかる税金**をやるときにものすごく重要になります。」\n\n---\n\n# C【イメージ理解｜3つの扉で覚えましょう】\n\n「先輩、目の前に3つの扉があると思ってください。」\n\n### 🚪扉①「死亡」\n\n一定の条件で死亡したら開く。\n\n→ **死亡保険**\n\n代表：\n**定期・終身**\n\n---\n\n### 🚪扉②「生存」\n\n一定期間まで生存していたら開く。\n\n→ **生存保険**\n\n---\n\n### 🚪扉③「死亡でも生存でも」\n\n死亡した\n→ 死亡側の扉\n\n満期まで生存した\n→ 生存側の扉\n\nどちらにも対応する。\n\n→ **生死混合保険**\n\n代表：\n**養老保険**\n\n「生命保険の商品名を見たら、まず」\n\n> **この保険は、どの条件でお金が支払われるの？**\n\nと考えてください。\n\nそうすれば丸暗記がかなり減ります。\n\n---\n\n# D【具体例｜3人のケースで判断しましょう】\n\n「では先輩、仕分け問題です。」\n\n### ケース①\n\nAさんは30歳。\n\n60歳までの30年間について、死亡保障を確保したい。\n\n60歳まで生存した場合、死亡保険金は支払われないタイプ。\n\nこれは？\n\n……\n\n### **定期保険**\n\nですね。\n\n一定期間を保障する死亡保険です。\n\n---\n\n### ケース②\n\nBさんは、\n\n「死亡保障を一生涯持っておきたい」\n\nと考えています。\n\nこれは？\n\n……\n\n### **終身保険**\n\nです。\n\n---\n\n### ケース③\n\nCさんは、\n\n「期間中に死亡した場合には家族へ保険金を残したい。でも満期まで生存したら自分で満期保険金を受け取りたい。」\n\nこれは？\n\n……\n\n### **養老保険**\n\nですね。\n\n**生死混合保険**です。\n\n---\n\n# 【理解確認】\n\n「はい、3問です。」\n\n### Q1\n\n生命保険の基本的な3分類は？\n\n……\n\n**死亡保険・生存保険・生死混合保険。**\n\n---\n\n### Q2\n\n定期保険と終身保険は基本的にどの分類？\n\n……\n\n### **死亡保険**\n\nです。\n\n---\n\n### Q3\n\n養老保険は？\n\n……\n\n### **生死混合保険**\n\n「はい。⑩でやった内容、ちゃんと戻ってきましたね。」\n\n---\n\n# 【30秒復習】\n\n① **生命保険の基本3分類は？**  \n→ 死亡・生存・生死混合\n\n② **死亡保険の代表は？**  \n→ 定期保険・終身保険\n\n③ **生死混合保険の代表は？**  \n→ **養老保険**\n\n④ **契約者とは？**  \n→ 契約を結び、保険料を負担する人\n\n⑤ **被保険者とは？**  \n→ 生死などが保険の対象となる人\n\n⑥ **保険金受取人とは？**  \n→ 保険金を受け取る人\n\n# 【一文で覚える】\n\n> **「生命保険はまず“死亡・生存・両方”で分ける。定期と終身は死亡、養老は生死混合。」**\n\n「はい。ここはこれからの商品を入れるための**本棚**だと思ってください。」\n\nこのあと、\n\n**定期**\n↓\n**終身**\n↓\n**養老**\n\nなどを一つずつ本棚に入れていけば、商品名が増えても迷いにくくなります。\n\n次は **㉒「定期保険」** です。\n\n---", "chapter": 2}, {"n": 22, "title": "定期保険（ていきほけん）", "raw": "# 第2章 リスク管理㉒\n\n## 定期保険（ていきほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。ここから生命保険の代表選手を一つずつ見ます。」\n\n今回は**定期保険**です。\n\n一言でいうと、\n\n> **一定期間だけ死亡・高度障害などを保障する保険。**\n\nたとえば、\n\n**30歳～40歳の10年間**\n\nだけ保障する、といった形ですね。\n\nそして定期保険の重要な特徴は、\n\n> **少ない保険料で、大きな死亡保障を準備しやすい。**\n\n一方で、\n\n> **満期保険金は基本的になく、貯蓄性は低い。**\n\n「つまり定期保険は、**貯めるより保障を買う保険**だと思ってください。」\n\n---\n\n## 【まず4点】\n\n**① 保障期間**\n→ 一定期間\n\n**② 保険料**\n→ 終身保険などと比べて割安で、大きな保障を確保しやすい\n\n**③ 満期保険金**\n→ 基本的にない\n\n**④ 貯蓄性**\n→ 低い\n\n「はい。まずこれで骨組み完成です。」\n\n---\n\n# B【詳しい解説｜なぜ保険料が安いの？】\n\n「先輩、定期保険と終身保険を比べてみましょう。」\n\n### 定期保険\n\n30歳\n↓\n10年間\n↓\n40歳\n↓\n**保障終了**\n\n---\n\n### 終身保険\n\n30歳\n↓\n40歳\n↓\n60歳\n↓\n80歳\n↓\n……\n↓\n**一生涯保障**\n\n「さて、どちらのほうが保険会社が保険金を支払う可能性が高くなりやすいでしょう？」\n\n……\n\n「そうです。一般には終身保険ですね。」\n\n終身保険は保障が一生涯続くため、死亡保障についていえば最終的には死亡という保険事故が発生します。\n\n一方、定期保険は、\n\n**保険期間中に死亡しなければ、その死亡保障は終了**\n\nします。\n\nだから一般に、\n\n> **同じ死亡保険金額なら、定期保険は終身保険より保険料が安くなりやすい。**\n\nという特徴があります。\n\n---\n\n# 「満期になったら払った保険料が返ってくる？」\n\n「先輩、そこです。」\n\n10年間、\n\n毎月保険料を払った。\n\n↓\n\n10年間無事だった。\n\n↓\n\n満期。\n\n「じゃあ今まで払った保険料、返してください！」\n\n……\n\n基本的には、そういう保険ではありません。\n\n定期保険には通常、\n\n### **満期保険金がありません。**\n\nそのため、いわゆる**掛け捨て型**の保険として説明されることが多いです。\n\n---\n\n## 「じゃあ保険料を捨ててるの？」\n\n「それもちょっと違います。」\n\n先輩が10年間無事だったとしても、その10年間は、\n\n> **死亡した場合に保険金を受け取れる保障**\n\nを持っていたわけです。\n\n自動車保険で事故を起こさなかったから、\n\n「保険料全部無駄だった」\n\nとは必ずしも考えませんよね。\n\n定期保険も、\n\n**お金を貯めること**\n\nではなく、\n\n**一定期間、大きなリスクに備えること**\n\nが主目的です。\n\n---\n\n# どんな人に向いている？\n\n「ここ、必要保障額とつなげましょう。」\n\nたとえば30歳。\n\n子どもが生まれたばかり。\n\nもし今死亡したら、\n\n配偶者の生活費\n＋\n子どもの教育費\n＋\nその他\n\nで、\n\n**大きな必要保障額**\n\nが必要になる可能性があります。\n\nでも20～30年後には、\n\n子どもが独立\n↓\n教育費が不要\n↓\n貯蓄も増える\n↓\n必要保障額が減る\n\nかもしれません。\n\n「じゃあ、一生涯5,000万円の保障が必要？」\n\n……\n\n必ずしもそうではありません。\n\n**子どもが独立するまでの20年間だけ、大きな死亡保障が欲しい。**\n\nこういうニーズと定期保険は相性がいいんです。\n\n---\n\n# 定期保険の「更新型」\n\n「もう一つ大事です。」\n\n定期保険には、\n\n### **更新型**\n\nがあります。\n\nたとえば、\n\n30歳\n↓\n10年間\n↓\n40歳で更新\n↓\nさらに10年間\n\nというタイプです。\n\n「じゃあ更新しても保険料は同じ？」\n\n……\n\n「先輩、そこ注意です。」\n\n一般に更新時の年齢などを基準に保険料が再計算されるため、\n\n> **更新後の保険料は高くなるのが一般的です。**\n\n30歳より40歳。\n\n40歳より50歳。\n\n年齢が上がるほど死亡リスクも一般に高まりますからね。\n\n---\n\n# 「更新」と「全期型」の違い\n\nたとえば60歳まで保障が欲しいとします。\n\n### 更新型\n\n30歳\n→ 10年\n→ 40歳で更新\n→ 10年\n→ 50歳で更新\n→ 60歳\n\n最初の保険料は比較的低く抑えやすい一方、\n\n**更新のたびに保険料が上がるのが一般的。**\n\n---\n\n### 全期型\n\n30歳\n→――――――――→\n60歳\n\n最初から60歳までを保険期間として契約します。\n\n一般に、更新型より当初の保険料は高めでも、**契約時に定められた保険料で保険期間を通じて払うタイプ**があります。\n\n「短期の安さだけでなく、長期間でいくら払うのかを見る必要がありますね。」\n\n---\n\n# C【イメージ理解｜レンタルの傘です】\n\n「先輩、突然雨が強くなったとします。」\n\nでも、\n\n「一生傘を借りたい」\n\nわけじゃありませんよね。\n\n雨が降っている、\n\n**今の数時間だけ傘が必要。**\n\nだからレンタルする。\n\n定期保険も似ています。\n\n子どもが小さい\n↓\n必要保障額が大きい\n↓\nこの期間だけ大きな死亡保障が欲しい\n↓\n**定期保険**\n\n子どもが独立\n↓\n必要保障額が小さくなる\n↓\n大きな保障の必要性が低下\n\n「つまり、」\n\n> **必要な期間だけ大きな保障をレンタルする**\n\nようなイメージです。\n\n---\n\n# D【具体例｜終身保険と比較します】\n\n「先輩、Aさんには小学生の子どもが2人いるとします。」\n\n必要保障額を計算したら、\n\n### **3,000万円**\n\n必要でした。\n\nでも、\n\n「子どもが独立した後まで3,000万円必要なわけではない」\n\nと考えています。\n\nそこで、\n\n### 20年間の定期保険\n\n死亡保険金：3,000万円\n\nに加入したとします。\n\n---\n\n### 10年後に死亡\n\n保険期間中です。\n\n→ **死亡保険金3,000万円**\n\n---\n\n### 20年間生存\n\n満期。\n\n→ 基本的に**満期保険金なし**\n\nそして死亡保障終了。\n\n「これが定期保険です。」\n\n---\n\n## じゃあ終身保険なら？\n\n同じ死亡保障を一生涯確保する。\n\n↓\n\n保険会社が保障する期間が長い。\n\n↓\n\n一般に定期保険より、\n\n### **保険料が高くなる**\n\nという違いがあります。\n\n「なので、」\n\n**大きな保障を一定期間**\n→ 定期\n\n**一生涯の保障**\n→ 終身\n\nと目的で分けてください。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。3問いきます。」\n\n### Q1\n\n定期保険の保障期間は？\n\n……\n\n**一定期間。**\n\n「はい。」\n\n### Q2\n\n定期保険には満期保険金がある？\n\n……\n\n**基本的にありません。**\n\nそのため貯蓄性は低く、掛け捨て型として説明されることが多いです。\n\n### Q3\n\n更新型の定期保険を更新すると、一般に保険料は？\n\n……\n\n### **上がります。**\n\n更新時の年齢などをもとに保険料が再計算されるからですね。\n\n---\n\n# 【30秒復習】\n\n① **何の保険？**  \n→ 一定期間の死亡保障\n\n② **最大の強みは？**  \n→ **割安な保険料で大きな保障を確保しやすい**\n\n③ **満期保険金は？**  \n→ 基本的になし\n\n④ **貯蓄性は？**  \n→ 低い\n\n⑤ **更新すると保険料は？**  \n→ 一般に上がる\n\n⑥ **どんなニーズと相性がいい？**  \n→ **子育て期間など、一定期間だけ大きな保障が必要な場合**\n\n# 【一文で覚える】\n\n> **「定期保険は、必要な期間だけ大きな死亡保障を割安に確保する、基本的に掛け捨て型の保険。」**\n\n「はい。ここを土台にしてください。」\n\n次は定期保険を変形させたタイプをまとめて比べます。\n\n**保障額が一定なのか、減るのか、増えるのか、毎月受け取るのか。**\n\nここがポイントになります。\n\n次は **㉓「平準定期保険・逓減定期保険・逓増定期保険・収入保障保険」** です。\n\n---", "chapter": 2}, {"n": 23, "title": "平準定期保険・逓減定期保険・逓増定期保険・収入保障保険", "raw": "# 第2章 リスク管理㉓\n\n## 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。4つもありますけど、名前を丸暗記しないでください。」\n\n見るのは、\n\n> **時間が経つと死亡保障がどう変化するか**\n\nだけです。\n\n|種類|保障の動き|\n|-|-|\n|**平準定期保険**|→ 一定|\n|**逓減定期保険**|↘ 徐々に減る|\n|**逓増定期保険**|↗ 徐々に増える|\n|**収入保障保険**|死亡後、満期まで年金形式などで受け取る|\n\n「**平ら・減る・増える**。最初の3つは名前そのままです。」\n\nそして収入保障保険は少し特殊ですが、死亡時点が遅くなるほど残りの受取期間が短くなるので、\n\n> **受取総額は一般に徐々に減少します。**\n\n「だから逓減定期保険に似た形になります。」\n\n---\n\n# B【詳しい解説｜4つを一つずつ整理します】\n\n## ① 平準定期保険\n\n「“平準”って難しそうですけど、要するに**平ら**です。」\n\nたとえば、\n\n30歳\n→ 40歳\n→ 50歳\n→ 60歳\n\nまで、\n\n死亡保険金がずっと、\n\n### **3,000万円**\n\nなら平準定期保険です。\n\nグラフなら、\n\n**3,000万円 ─────────**\n\n「横一直線ですね。」\n\n一定期間、大きさの変わらない死亡保障が必要な場合に使いやすいタイプです。\n\n---\n\n# ② 逓減定期保険\n\n「次、“逓減”です。」\n\n**逓（てい）＝だんだん**\n\nくらいに考えてください。\n\nつまり、\n\n> **死亡保険金が時間の経過とともに減っていく定期保険。**\n\nたとえば、\n\n30歳 → 3,000万円  \n40歳 → 2,000万円  \n50歳 → 1,000万円\n\nというイメージ。\n\n「先輩、これ何かと似てません？」\n\n……\n\nそうです。\n\n前にやった、\n\n## **必要保障額**\n\nです。\n\n子どもが小さい\n↓\n今後の生活費・教育費がたくさん必要\n↓\n必要保障額が大きい\n\nでも、\n\n子どもが成長\n↓\n残りの教育費などが減る\n↓\n貯蓄も増える\n↓\n必要保障額が小さくなる\n\nだから、\n\n> **必要保障額の減少に合わせて保障額も減らす**\n\nという考え方と相性がいいんです。\n\n---\n\n# ③ 逓増定期保険\n\n「今度は逆です。」\n\n> **時間の経過とともに死亡保険金が増えていく定期保険。**\n\nたとえば、\n\n加入時 → 1,000万円  \n↓  \n数年後 → 2,000万円  \n↓  \nさらに後 → 3,000万円\n\nというイメージです。\n\n「逓減の真逆ですね。」\n\n### 逓減\n\n↘\n\n### 逓増\n\n↗\n\n「漢字の“減・増”を見れば迷わないでしょう？」\n\n---\n\n# ④ 収入保障保険\n\n「先輩、ここだけ少し丁寧にいきます。」\n\n収入保障保険は、被保険者が死亡した場合などに、\n\n> **契約時に定めた満期まで、年金形式で保険金を受け取る**\n\nタイプの定期保険です。\n\nたとえば、\n\n30歳で加入\n↓\n60歳満期\n\n死亡した場合、\n\n**毎月10万円**\n\nを満期まで受け取る契約だったとします。\n\n---\n\n## 35歳で死亡したら？\n\n60歳まで、\n\n約25年間あります。\n\nだから受取期間が長い。\n\n---\n\n## 55歳で死亡したら？\n\n60歳まで、\n\n約5年間。\n\n受取期間が短い。\n\n「ということは？」\n\n……\n\nそうです。\n\n> **死亡時期が遅くなるほど、受取総額が小さくなります。**\n\n---\n\n# 「逓減定期保険と何が違うの？」\n\n「先輩、そこですよ。ここが一番混ざります。」\n\nどちらも、\n\n### 時間とともに保障総額が減る\n\nという点は似ています。\n\nでも基本的な見え方が違います。\n\n### 逓減定期保険\n\n**死亡保険金そのものが段階的に減っていく。**\n\nたとえば、\n\n3,000万円\n↓\n2,500万円\n↓\n2,000万円\n↓\n1,500万円\n\n---\n\n### 収入保障保険\n\n死亡した後、\n\n**毎月○万円**\n\nなどを残りの保険期間に応じて受け取る。\n\nだから、\n\n早く死亡\n→ 受取期間が長い\n→ 総額が大きい\n\n遅く死亡\n→ 受取期間が短い\n→ 総額が小さい\n\n「結果として、必要保障額の減少に合わせやすいんですね。」\n\n---\n\n# C【イメージ理解｜子育て資金で考えましょう】\n\n「先輩、子どもが0歳だとします。」\n\n大学卒業まで22年くらい。\n\nもし今、親が死亡したら？\n\nこれから、\n\n食費  \n教育費  \n生活費\n\nなどが長期間必要ですよね。\n\nだから、\n\n### 必要なお金は大きい。\n\nでも子どもが20歳になってから親が死亡したら？\n\n大学卒業まで残りわずか。\n\n### 必要なお金は小さい。\n\n「つまり、家族に必要なお金って――」\n\n**現在**\n████████████\n\n**10年後**\n████████\n\n**20年後**\n██\n\nみたいに減っていくことがあります。\n\nそこに、\n\n### 逓減定期保険\n\nや\n\n### 収入保障保険\n\nを合わせるわけです。\n\n「必要保障額が減るのに、ずっと同じ3,000万円を持つ必要があるのか？という発想ですね。」\n\n---\n\n# D【具体例｜4人の先輩で比較します】\n\n「先輩が4人いることにしましょう。」\n\n……ちょっと嫌ですね。\n\n---\n\n### A先輩：平準定期保険\n\n30～60歳まで、\n\n**死亡保険金3,000万円**\n\n30歳でも、\n\n3,000万円。\n\n45歳でも、\n\n3,000万円。\n\n59歳でも、\n\n3,000万円。\n\n→ **一定**\n\n---\n\n### B先輩：逓減定期保険\n\n30歳  \n→ 3,000万円\n\n40歳  \n→ 2,000万円\n\n50歳  \n→ 1,000万円\n\n→ **徐々に減る**\n\n---\n\n### C先輩：逓増定期保険\n\n30歳  \n→ 1,000万円\n\n40歳  \n→ 2,000万円\n\n50歳  \n→ 3,000万円\n\n→ **徐々に増える**\n\n---\n\n### D先輩：収入保障保険\n\n60歳満期で、\n\n死亡後に毎月10万円を受け取るとします。\n\n40歳で死亡したら、単純化すると残り20年。\n\n10万円 × 12か月 × 20年\n\n＝ **2,400万円**\n\n一方、\n\n55歳で死亡したら残り5年。\n\n10万円 × 12か月 × 5年\n\n＝ **600万円**\n\n「死亡が遅くなると？」\n\n……\n\n### **受取総額が減っています。**\n\nだから収入保障保険も、保障総額の形としては**逓減型に近い**わけです。\n\n※実際の商品には最低保証期間などが設定されることもあるため、この数字は仕組みを理解するための単純化した例です。\n\n---\n\n# 【理解確認】\n\n「はい、先輩。今回は4つあるので、ちゃんと仕分けますよ。」\n\n### Q1\n\n死亡保険金が一定なのは？\n\n……\n\n### **平準定期保険**\n\n---\n\n### Q2\n\n死亡保険金が時間とともに減る・増えるのは？\n\n……\n\n減る\n→ **逓減定期保険**\n\n増える\n→ **逓増定期保険**\n\n「名前そのままですね。」\n\n---\n\n### Q3\n\n死亡後、満期まで毎月一定額などを年金形式で受け取るタイプは？\n\n……\n\n### **収入保障保険**\n\nそして死亡時期が遅いほど、\n\n**残りの受取期間が短くなり、受取総額も一般に減少する。**\n\n「はい。ここまで言えれば十分です。」\n\n---\n\n# 【30秒復習】\n\n① **平準定期**  \n→ **→ 一定**\n\n② **逓減定期**  \n→ **↘ 減る**\n\n③ **逓増定期**  \n→ **↗ 増える**\n\n④ **収入保障**  \n→ 死亡後、満期まで年金形式などで受け取る\n\n⑤ **収入保障で死亡時期が遅くなると？**  \n→ 受取期間が短くなり、総額は一般に減る\n\n⑥ **必要保障額の減少と相性がいいのは？**  \n→ **逓減定期保険・収入保障保険**\n\n# 【一文で覚える】\n\n> **「平準は横ばい、逓減は下がる、逓増は上がる。収入保障は死亡後から満期まで受け取るので、死亡が遅いほど総額が減る。」**\n\n「はい、先輩。4つを別々に暗記するより、頭の中にグラフを置いてください。」\n\n**平準 →**  \n**逓減 ↘**  \n**逓増 ↗**  \n**収入保障 ↘＋毎月受取**\n\n「これならかなり忘れにくいです。」\n\n次は **㉔「終身保険」** です。\n\n---", "chapter": 2}, {"n": 24, "title": "終身保険（しゅうしんほけん）", "raw": "# 第2章 リスク管理㉔\n\n## 終身保険（しゅうしんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。前回の定期保険とセットで覚える**終身保険**です。」\n\n一言でいうと、\n\n> **死亡保障が一生涯続く保険。**\n\n定期保険は、\n\n**30歳 → 60歳まで → 保障終了**\n\nでしたよね。\n\n終身保険は、\n\n**30歳 → 60歳 → 80歳 → 90歳 → ……**\n\nと、\n\n### **死亡保障が一生涯続きます。**\n\nそしてもう一つ重要なのが、\n\n> **一般に解約返戻金があり、定期保険より貯蓄性が高い。**\n\nという点です。\n\nつまり、\n\n**定期保険＝一定期間・安く大きな保障**\n\n**終身保険＝一生涯・貯蓄性もある**\n\n「まずこの対比を頭に入れてください。」\n\n---\n\n# B【詳しい解説｜なぜ「終身」なの？】\n\n「“終身”という漢字を見てください。」\n\n**終わるまで身を保障する。**\n\nつまり、\n\n> **一生涯の死亡保障**\n\nということです。\n\nたとえば30歳で加入したとします。\n\n40歳で死亡\n→ 死亡保険金\n\n70歳で死亡\n→ 死亡保険金\n\n90歳で死亡\n→ 死亡保険金\n\n「保険期間が終わって保障ゼロ、という定期保険とは違うんですね。」\n\n---\n\n## 「じゃあ満期保険金がある？」\n\n「あ、先輩。そこは違います。」\n\n終身保険は一生涯保障なので、基本的に、\n\n### **満期という考え方がありません。**\n\nしたがって、\n\n> **満期保険金も基本的にありません。**\n\n「ここ、養老保険と混ざりやすいですよ。」\n\n### 終身保険\n\n死亡\n→ **死亡保険金**\n\n生存している\n→ 保障が続く\n\n### 養老保険\n\n期間中に死亡\n→ **死亡保険金**\n\n満期まで生存\n→ **満期保険金**\n\nです。\n\n---\n\n# 「でも終身保険には貯蓄性があるんですよね？」\n\n「はい。そこが定期保険との大きな違いです。」\n\n終身保険では一般に、\n\n### **解約返戻金**\n\nが積み上がっていきます。\n\n「⑨でやりましたね。」\n\n途中で契約を解約すると、\n\n> **契約内容や経過期間などに応じた解約返戻金**\n\nを受け取れる場合があります。\n\nだから、\n\n### 定期保険\n\n→ 基本的に掛け捨て型・貯蓄性は低い\n\n### 終身保険\n\n→ 解約返戻金があり、比較的貯蓄性がある\n\nという違いになります。\n\n---\n\n## 「じゃあ終身保険は絶対に得？」\n\n「先輩、ちょっと待ってください。」\n\n**貯蓄性がある＝必ず儲かる**\n\nではありません。\n\n特に契約して早い時期に解約すると、\n\n> **解約返戻金が払込保険料総額を大きく下回る**\n\nことがあります。\n\n「前に解約返戻金でやりましたよね。」\n\n保険料はそのまま自分専用の貯金箱に入っているわけではありません。\n\nですから、\n\n**払った保険料＝いつでも全部戻ってくる**\n\nではありません。\n\n---\n\n# 保険料はどうなの？\n\n「じゃあ先輩。」\n\n死亡保障3,000万円について、\n\n### A：10年間だけ保障\n\n### B：一生涯保障\n\nどちらが一般に保険料が高いと思います？\n\n……\n\n「そうです。」\n\n### **Bの終身保険**\n\nです。\n\n終身保険は死亡保障が一生涯続き、解約返戻金もあるため、\n\n> **同じ死亡保険金額なら、一般に定期保険より保険料が高くなります。**\n\n---\n\n# 「終身払い」と「有期払い」は別の話です\n\n「先輩、ここはかなり大事ですよ。」\n\n### 終身保険\n\nと\n\n### 終身払い\n\nは同じ意味ではありません。\n\n「え？」\n\nとなりますよね。\n\n---\n\n## 終身保険\n\nこれは、\n\n### **保障期間**\n\nの話です。\n\n→ 一生涯保障する。\n\n---\n\n## 終身払い\n\nこれは、\n\n### **保険料を払う期間**\n\nの話です。\n\n→ 一生涯、保険料を払い続ける。\n\n---\n\n終身保険でも、\n\n### 60歳払済\n\nという契約があります。\n\nたとえば、\n\n30歳\n↓\n60歳まで保険料を払う\n↓\n60歳で保険料の支払い終了\n↓\nでも死亡保障は……\n↓\n\n### **一生涯続く**\n\nということができます。\n\n「つまり、」\n\n> **保障が終身なのか、保険料の支払いが終身なのかは別問題。**\n\nです。\n\n---\n\n# C【イメージ理解｜家を借りるか、長く持つか】\n\n「先輩、定期保険と終身保険をイメージで分けます。」\n\n### 定期保険\n\n必要な期間だけ、\n\n🏠「20年間だけ使います」\n\nというイメージ。\n\n一定期間が終了すると、\n\n### 保障終了。\n\n---\n\n### 終身保険\n\n🏠「これは一生涯持っておきます」\n\nというイメージ。\n\n60歳になっても、\n\n80歳になっても、\n\n保障が続く。\n\nさらに終身保険では一般に、\n\n**解約返戻金が積み上がる**\n\nという特徴があります。\n\nだから、\n\n> **一生涯の死亡保障＋貯蓄性**\n\nというのが終身保険の基本イメージです。\n\n---\n\n# D【具体例｜定期・終身・養老を比べましょう】\n\n「先輩、ここで3つを一気につなげます。」\n\nAさんが30歳で加入したとします。\n\n---\n\n### ① 定期保険\n\n30歳\n↓\n60歳\n↓\n保障終了\n\n50歳で死亡\n→ **死亡保険金**\n\n70歳で死亡\n→ すでに保険期間終了\n\n満期保険金\n→ **基本なし**\n\n---\n\n### ② 終身保険\n\n30歳\n↓\n60歳\n↓\n80歳\n↓\n100歳……\n\n50歳で死亡\n→ **死亡保険金**\n\n70歳で死亡\n→ **死亡保険金**\n\n90歳で死亡\n→ **死亡保険金**\n\n保障\n→ **一生涯**\n\n途中で解約\n→ **解約返戻金があるのが一般的**\n\n---\n\n### ③ 養老保険\n\n30歳\n↓\n60歳満期\n\n50歳で死亡\n→ **死亡保険金**\n\n60歳まで生存\n→ **満期保険金**\n\n「はい。違いが見えてきましたね。」\n\n---\n\n# 【理解確認】\n\n「では3問です。」\n\n### Q1\n\n終身保険の死亡保障はいつまで？\n\n……\n\n### **一生涯。**\n\n「“終身”ですからね。」\n\n---\n\n### Q2\n\n終身保険には満期保険金がある？\n\n……\n\n### **基本的にありません。**\n\n一生涯保障なので、基本的に満期という考え方がありません。\n\n---\n\n### Q3\n\n「終身保険」と「終身払い」は同じ意味？\n\n……\n\n### **違います。**\n\n終身保険\n→ **保障期間**\n\n終身払い\n→ **保険料払込期間**\n\n「ここまで言えれば完璧です。」\n\n---\n\n# 【30秒復習】\n\n① **終身保険とは？**  \n→ 一生涯の死亡保障\n\n② **満期は？**  \n→ 基本的になし\n\n③ **満期保険金は？**  \n→ 基本的になし\n\n④ **解約返戻金は？**  \n→ 一般にあり\n\n⑤ **定期保険と比べた保険料は？**  \n→ 同じ死亡保障なら一般に高い\n\n⑥ **終身保険＝終身払い？**  \n→ **違う。保障期間と払込期間は別**\n\n# 【一文で覚える】\n\n> **「終身保険は、一生涯の死亡保障を持ち、一般に解約返戻金による貯蓄性もある保険。」**\n\n「そして先輩、ここからちょっと名前がややこしくなります。」\n\n次は普通の終身保険に、\n\n**『積立金に適用する利率が変わる』**\n\nという仕組みが加わります。\n\n次は **㉕「積立利率変動型終身保険」** です。\n\n---", "chapter": 2}, {"n": 25, "title": "積立利率変動型終身保険（つみたてりりつへんどうがた・しゅうしんほけん）", "raw": "# 第2章 リスク管理㉕\n\n## 積立利率変動型終身保険（つみたてりりつへんどうがた・しゅうしんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。名前が長いですけど、分解すれば大丈夫です。」\n\n**積立｜利率｜変動型｜終身保険**\n\nですよ。\n\n一言でいうと、\n\n> **積立金に適用される利率が、市場金利などに応じて見直される終身保険。**\n\n普通の終身保険と同じように**死亡保障は一生涯**あります。\n\nでも大きな特徴は、\n\n> **積立利率が一定ではなく、一定期間ごとに見直される**\n\nことです。\n\nそのため金利が上昇すると、積立金が増え、結果として**解約返戻金や死亡保険金などが増える可能性**があります。\n\n「まずは、**金利が上がると積立部分にも反映されやすい終身保険**、というイメージを持ってください。」\n\n---\n\n# B【詳しい解説｜そもそも「積立利率」って何？】\n\n「先輩、銀行預金を思い出してください。」\n\nお金を預けると、\n\n元本\n＋\n利息\n\nとなりますよね。\n\n生命保険でも、保険会社が将来の保険金などの支払いに備えて積み立てる部分があります。\n\nその積立部分に適用する利率が、\n\n### **積立利率**\n\nです。\n\n「つまり、積み立てているお金をどのくらいの利率で増やしていくか、という数字ですね。」\n\n---\n\n## 普通の終身保険と何が違うの？\n\n「ここが本題です。」\n\n一般的な終身保険では、契約時の予定利率などを前提に保険料や保障内容が設計されます。\n\n一方、\n\n### 積立利率変動型終身保険\n\nでは、\n\n市場金利などの状況\n↓\n一定期間ごとに積立利率を見直す\n↓\n積立金に反映\n↓\n解約返戻金などに影響\n\nという仕組みを持っています。\n\n---\n\n## 金利が上がったら？\n\n「では先輩。」\n\n市場金利が上昇した。\n\n↓\n\n積立利率も上昇。\n\n↓\n\n積立金がより増える。\n\n↓\n\n### **解約返戻金などが増える可能性**\n\nがあります。\n\n商品によっては、積立金の増加によって**死亡保険金が増加する仕組み**を持つものもあります。\n\n---\n\n# 「じゃあ金利が下がったら死亡保険金もどんどん減る？」\n\n「先輩、そこが大事です。」\n\n商品には一般に、\n\n### **最低保証される積立利率**\n\nが設定されています。\n\nそのため、\n\n> **金利が下がったからといって、積立利率が無制限に下がるわけではない**\n\nという仕組みになっています。\n\n「変動型って聞くと、“全部が上がったり下がったりして危険なの？”と思いますよね。」\n\nでも、最低保証がある点を押さえてください。\n\n※最低保証の具体的な利率や保障の仕組みは商品によって異なります。\n\n---\n\n# 「変額保険」と同じ？」\n\n「……先輩、ここ、名前が似ているから危ないですよ。」\n\n### 積立利率変動型終身保険\n\n変わるのは、\n\n> **積立金に適用する利率**\n\nです。\n\n一方、後で出てくる、\n\n### 変額保険\n\nは、\n\n株式・債券などを中心とした**特別勘定の運用実績**によって、\n\n> **保険金や解約返戻金などが変動する**\n\n保険です。\n\nつまり、\n\n**積立利率変動型**\n→ 「利率」が変わる\n\n**変額保険**\n→ 「運用実績」によって金額が変わる\n\n「同じ“変わる保険”でも、何が変動の原因なのかが違います。」\n\n---\n\n# C【イメージ理解｜蛇口を想像してください】\n\n「先輩、積立金をバケツだと思ってください。」\n\n🪣 **積立金**\n\nそこに水を入れる蛇口があります。\n\n蛇口の勢いが、\n\n### **積立利率**\n\nです。\n\n金利が低い\n↓\n🚰 チョロチョロ\n\n金利が高くなる\n↓\n🚰🚰🚰 勢いが強くなる\n\nすると、\n\n**積立金が増えるペースも変わる**\n\nというイメージです。\n\nただし、\n\n「完全に蛇口を閉めます！」\n\nとならないよう、\n\n### 最低保証\n\nという下限が設定されている商品が一般的です。\n\n---\n\n# D【具体例｜金利が上昇したらどうなる？】\n\n「数字は仕組みを理解するために単純化しますね。」\n\nAさんが積立利率変動型終身保険に加入しました。\n\n契約時の積立利率を仮に、\n\n### 1％\n\nとします。\n\nその後、市場金利が上昇。\n\n見直し時に、\n\n### 1.5％\n\nになったとしましょう。\n\nすると、\n\n積立利率上昇\n↓\n積立金がより増える\n↓\n解約返戻金などが増える可能性\n\nがあります。\n\n---\n\n反対に市場金利が下がった。\n\n積立利率も下がる可能性があります。\n\nただし商品に、\n\n### 最低保証利率\n\nが設定されていれば、\n\nその水準を下回らない。\n\n「だから先輩、」\n\n> **市場金利の変化を積立部分に反映させつつ、一定の下限を設ける**\n\nというのが基本イメージです。\n\n---\n\n# 【普通の終身保険との関係】\n\n「一度整理しますよ。」\n\n### 普通の終身保険\n\n**一生涯保障**\n＋\n**解約返戻金**\n\n---\n\n### 積立利率変動型終身保険\n\n**一生涯保障**\n＋\n**解約返戻金**\n＋\n\n### **積立利率を一定期間ごとに見直す**\n\n「終身保険という土台は同じなんです。」\n\nそこに、\n\n**金利変動への対応機能**\n\nを加えたものだと考えると理解しやすいですよ。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n積立利率変動型終身保険で変動するものは何？\n\n……\n\n### **積立金に適用される利率。**\n\n「“保険そのものが毎回別物になる”ではありませんよ。」\n\n---\n\n### Q2\n\n市場金利が上昇して積立利率も上がった場合、どうなる？\n\n……\n\n積立金が増えやすくなり、\n\n### **解約返戻金などが増える可能性があります。**\n\n---\n\n### Q3\n\n「積立利率変動型終身保険」と「変額保険」は同じ？\n\n……\n\n### **違います。**\n\n積立利率変動型\n→ **適用する利率が変動**\n\n変額保険\n→ **特別勘定の運用実績によって保険金などが変動**\n\n「はい。ここを分けられればかなり強いです。」\n\n---\n\n# 【30秒復習】\n\n① **何の保険？**  \n→ 終身保険の一種\n\n② **保障期間は？**  \n→ 一生涯\n\n③ **何が変動する？**  \n→ 積立利率\n\n④ **何に応じて見直される？**  \n→ 市場金利など\n\n⑤ **金利上昇時は？**  \n→ 解約返戻金などが増える可能性\n\n⑥ **変額保険との違いは？**  \n→ **積立利率の変動 vs 運用実績による変動**\n\n# 【一文で覚える】\n\n> **「積立利率変動型終身保険は、一生涯の死亡保障を持ちながら、市場金利などに応じて積立利率が見直される終身保険。」**\n\n「はい、先輩。名前が長いときは分解です。」\n\n**積立**\n→ お金を積み立てる\n\n**利率**\n→ 増え方\n\n**変動型**\n→ 見直される\n\n**終身**\n→ 一生涯保障\n\n「……ほら、名前そのままでしょう？」\n\n次は名前がものすごく似ていますが、仕組みは別です。\n\n**㉖「利率変動型積立終身保険」**です。\n\n---", "chapter": 2}, {"n": 26, "title": "利率変動型積立終身保険（りりつへんどうがた・つみたて・しゅうしんほけん）", "raw": "# 第2章 リスク管理㉖\n\n## 利率変動型積立終身保険（りりつへんどうがた・つみたて・しゅうしんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。……今回、名前だけ見ると前回とほぼ同じですよね。」\n\n前回は、\n\n**積立利率変動型終身保険**\n\n今回が、\n\n**利率変動型積立終身保険**\n\n「“積立”の位置がちょっと違うだけじゃないか、って？」\n\n……そこ、油断しないでください。**仕組みが違います。**\n\n今回の保険は、一言でいうと、\n\n> **積立部分（アカウント）と保障部分を分け、積立金から必要な保障の保険料などを充当するタイプの保険。**\n\n一般に**アカウント型保険**とも呼ばれます。\n\nそして重要なのが、\n\n> **払込期間中は積立部分を持ち、払込満了後は積立金をもとに終身保険などへ移行できる。**\n\nという仕組みです。\n\n「今回はまず、**“積立用のお財布＋保障”**と覚えてください。」\n\n---\n\n# B【詳しい解説｜なぜ「アカウント型」なの？】\n\n「先輩、銀行口座を一つ持っていると思ってください。」\n\nそこに保険料を入れる。\n\nそのお金について、\n\n**積立に回す部分**\nと\n**保障に使う部分**\n\nを分けて考える仕組みになっています。\n\nイメージとしては、\n\n**支払った保険料**\n↓\n📦 **積立部分（アカウント）**\n＋\n🛡️ **保障部分**\n\nです。\n\n保障部分には、定期保険や医療保障などの特約を組み合わせることがあります。\n\n「つまり、一枚の終身保険をずっと固定して持つ、というより、**積立部分を土台にして保障を設計する**イメージなんです。」\n\n---\n\n## 何が便利なの？\n\n「先輩、30歳と50歳で必要な保障って同じでしょうか？」\n\n……\n\n「違いますよね。」\n\n30歳\n↓\n子どもが小さい\n↓\n必要保障額が大きい\n↓\n死亡保障を厚くしたい\n\nでも50歳。\n\n子どもが独立\n↓\n必要保障額が減る\n↓\n死亡保障を減らしたい\n\nこのようにライフステージによって必要な保障は変わります。\n\nそこで、\n\n> **積立部分を持ちながら、保障内容を見直していく**\n\nという発想が使われます。\n\n---\n\n# 「利率変動型」って何？\n\n「もちろん名前の最初にある**利率変動型**にも意味があります。」\n\n積立部分に適用される利率が、\n\n> **市場金利などに応じて一定期間ごとに見直される**\n\n仕組みです。\n\nそのため、金利環境によって積立金の増え方が変化します。\n\n---\n\n# じゃあ前回と何が違うの？\n\n「はい。今回最大のポイントです。」\n\n## ㉕ 積立利率変動型終身保険\n\n基本的には、\n\n> **最初から終身保険**\n\nです。\n\n終身死亡保障が土台にあり、その積立金に適用される**積立利率が変動する**。\n\n---\n\n## ㉖ 利率変動型積立終身保険\n\nこちらは、\n\n> **積立部分（アカウント）を中心に、保障部分を組み合わせる**\n\nという構造。\n\nそして保険料払込満了後などに、\n\n> **積立金をもとに終身保険等へ移行する**\n\n仕組みを持ちます。\n\n「つまり――」\n\n### ㉕\n\n**終身保険が主役**\n＋\n利率が変動\n\n### ㉖\n\n**積立アカウントが主役**\n＋\n保障を組み合わせる\n＋\n後で終身保障などへ\n\n「名前は似ていますが、構造が違うんです。」\n\n---\n\n# 「払った保険料が全部積み立てられる？」\n\n「先輩、それは違います。」\n\n保険料には、\n\n**保障のための費用**\n\nなどもあります。\n\nですから、\n\n> **払込保険料の全額が、そのまま自分の積立金になるわけではありません。**\n\n「アカウントって言われると銀行預金みたいに感じますけど、あくまで**保険商品**ですからね。」\n\n---\n\n# C【イメージ理解｜一つの財布から振り分ける】\n\n「大きなお財布を一つ想像してください。」\n\n👛 **積立アカウント**\n\nそこを土台に、\n\n🛡️ 死亡保障  \n🏥 医療保障など\n\nを組み合わせる。\n\n若いうちは、\n\n「子どもがいるから死亡保障を厚くしたい」\n\n↓\n\n🛡️🛡️🛡️\n\n子どもが独立したら、\n\n「死亡保障は減らしてもいい」\n\n↓\n\n🛡️\n\nそして保険料払込満了後、\n\n積み上がった積立金を利用して、\n\n### **終身保障などへ移行**\n\nする。\n\n「だから**アカウント型**という名前がイメージしやすいんですね。」\n\n---\n\n# D【具体例｜30歳から60歳までで考えます】\n\n「先輩、Aさん30歳。」\n\n子どもが生まれたばかりです。\n\nAさんは利率変動型積立終身保険に加入しました。\n\n### 30～40代\n\n子育て中。\n\nもし死亡すると家族が困る。\n\nそこで、\n\n**定期死亡保障を厚めに設定。**\n\n同時に、\n\n**積立部分も持つ。**\n\n---\n\n### 50代\n\n子どもが独立。\n\n必要保障額が減ってきた。\n\nそこで保障内容を見直す。\n\n---\n\n### 60歳\n\n保険料払込期間終了。\n\n積立部分には一定の積立金があります。\n\nその積立金をもとに、\n\n### **終身保険などへ移行**\n\nする。\n\n「つまり、若いころから最初から固定された終身保険一本、というより――」\n\n> **現役時代は積立＋必要な保障、払込満了後は積立金を使って終身保障へ**\n\nという流れで理解すると分かりやすいです。\n\n---\n\n# 【最大の混同ポイント】\n\n「先輩、ここだけは名前を見比べてください。」\n\n### 積立利率変動型終身保険\n\n**積立利率｜変動型｜終身保険**\n\n→ **終身保険そのものの積立利率が変わる**\n\n---\n\n### 利率変動型積立終身保険\n\n**利率変動型｜積立｜終身保険**\n\n→ **積立部分（アカウント）を持ち、保障を組み合わせ、将来終身保障などへ移行**\n\n「試験で並べられたら、名前の雰囲気だけで答えないでくださいね。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n利率変動型積立終身保険は別名何と呼ばれる？\n\n……\n\n### **アカウント型保険**\n\nです。\n\n---\n\n### Q2\n\n払込期間中はどんな構造？\n\n……\n\n### **積立部分と保障部分を分けて考える構造。**\n\n積立部分を持ちながら、必要な保障を組み合わせます。\n\n---\n\n### Q3\n\n「積立利率変動型終身保険」と最大の違いは？\n\n……\n\n前者は、\n\n**終身保険を土台として積立利率が変動。**\n\n今回の利率変動型積立終身保険は、\n\n**積立部分を土台として保障を組み合わせ、将来その積立金をもとに終身保障などへ移行する。**\n\n「はい。ここまで区別できれば十分です。」\n\n---\n\n# 【30秒復習】\n\n① **別名は？**  \n→ アカウント型保険\n\n② **何を持つ？**  \n→ 積立部分（アカウント）\n\n③ **そこに何を組み合わせる？**  \n→ 死亡保障・医療保障など\n\n④ **利率は？**  \n→ 市場金利などに応じて見直される\n\n⑤ **払込満了後は？**  \n→ 積立金をもとに終身保険などへ移行できる\n\n⑥ **㉕との違いは？**  \n→ **㉕は終身保険が土台、㉖は積立アカウントが土台**\n\n# 【一文で覚える】\n\n> **「利率変動型積立終身保険は、積立アカウントを土台に必要な保障を組み合わせ、将来は積立金をもとに終身保障などへ移行する保険。」**\n\n「先輩、㉕と㉖は名前だけで覚えようとすると本当に混ざります。」\n\n**㉕ 終身が主役 → 利率が変わる**  \n**㉖ 積立が主役 → 保障を組み合わせる**\n\n「この対比で押さえてください。」\n\n次は **㉗「低解約返戻金終身保険」** です。\n\n---", "chapter": 2}, {"n": 27, "title": "低解約返戻金型終身保険（ていかいやくへんれいきんがた・しゅうしんほけん）", "raw": "# 第2章 リスク管理㉗\n\n## 低解約返戻金型終身保険（ていかいやくへんれいきんがた・しゅうしんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は名前を分解したら、ほぼ答えが出ます。」\n\n**低｜解約返戻金｜型｜終身保険**\n\nつまり、\n\n> **保険料払込期間中などの解約返戻金を通常の終身保険より低く抑える代わりに、保険料を割安にした終身保険**\n\nです。\n\n「ここで一番大事なのは、**死亡保険金を低くする保険ではない**ということですよ。」\n\n低くするのは、\n\n### **解約返戻金**\n\nです。\n\nその代わり、\n\n### **保険料を安くしやすい。**\n\nそして、低解約返戻金期間が終わった後は、解約返戻金が通常型の水準に近づく設計が一般的です。\n\n---\n\n# B【詳しい解説｜なぜ解約返戻金を低くすると保険料が安くなる？】\n\n「先輩、普通の終身保険を思い出してください。」\n\n終身保険には、\n\n**① 一生涯の死亡保障**\n\nに加えて、\n\n**② 解約した場合の解約返戻金**\n\nがありますよね。\n\nつまり保険会社は、死亡保障だけでなく、途中で解約された場合の返戻金についても考えて商品を設計します。\n\nそこで、\n\n「払込期間中などに解約した人へ返すお金を少なくする設計にしたら？」\n\n……\n\n保険会社側の負担を抑えられます。\n\nその分、\n\n> **通常の終身保険より保険料を割安に設定できる**\n\nわけです。\n\n---\n\n# 「じゃあ何がデメリットなの？」\n\n「はい。ここですよ。」\n\n途中で解約すると、\n\n### **受け取れる解約返戻金が少ない。**\n\nこれが最大の注意点です。\n\nたとえば、\n\n「保険料が安いから入ろう！」\n\n↓\n\n数年後\n\n「やっぱりお金が必要だから解約しよう」\n\n↓\n\n「えっ、思ったより戻ってこない……」\n\nとなる可能性があります。\n\n「つまり、**途中解約に弱い終身保険**なんです。」\n\n---\n\n# 「低解約返戻金」はずっと続くの？\n\n「ここも大切です。」\n\n商品設計によりますが、典型的には、\n\n> **保険料払込期間中の解約返戻金を低く抑える**\n\nという形です。\n\nたとえば、\n\n30歳で加入\n↓\n60歳まで保険料を払う\n\nなら、\n\n### 30～60歳\n\n→ 解約返戻金を低く抑える\n\nそして、\n\n### 60歳で払込満了\n\n→ 低解約返戻金期間終了\n\nその後は、解約返戻金が通常型の水準に近づく設計があります。\n\n---\n\n# 「払込満了した瞬間に、払った保険料が全部戻る？」\n\n「先輩？ そこまで都合よく考えないでください。」\n\n払込満了後に返戻率が上昇する商品があっても、\n\n> **払込保険料総額以上の金額が必ず受け取れるという意味ではありません。**\n\n契約内容や解約時期によって違います。\n\n「**解約返戻金が上がる＝必ず儲かる**ではありません。」\n\nここは分けましょう。\n\n---\n\n# 低解約返戻金期間中に死亡したら？\n\n「さて先輩。ここ、ひっかけられそうですよね。」\n\n解約返戻金が低い。\n\n↓\n\n「じゃあ死亡保険金も低い？」\n\n……\n\n### **違います。**\n\n低く抑えているのは、\n\n> **解約した場合の返戻金**\n\nです。\n\n死亡した場合は、契約で定められた**死亡保険金**が支払われます。\n\nだから、\n\n**解約返戻金**\nと\n**死亡保険金**\n\nを混同しないでください。\n\n---\n\n# C【イメージ理解｜途中下車すると損をする切符】\n\n「先輩、長距離列車の特別な切符を想像してください。」\n\n30歳駅\n↓\n40歳駅\n↓\n50歳駅\n↓\n\n### 60歳駅\n\n60歳駅まで乗り続ける前提だから、\n\n### 🎫 運賃が安い。\n\nでも途中の40歳駅で、\n\n「やっぱり降ります！」\n\nと言ったら、\n\n### 💰 払い戻しが少ない。\n\n「これが低解約返戻金型終身保険のイメージです。」\n\n> **長く続ける代わりに保険料を抑える。途中でやめると返戻金が少ない。**\n\nという交換条件なんですね。\n\n---\n\n# D【具体例｜通常の終身保険と比べましょう】\n\n「数字は仕組みを理解するための単純な例ですよ。」\n\n同じ死亡保障、\n\n### **1,000万円**\n\nの終身保険が2つあるとします。\n\n---\n\n### A：通常の終身保険\n\n月々の保険料  \n→ 20,000円\n\n払込期間中の解約返戻金  \n→ 通常の水準\n\n---\n\n### B：低解約返戻金型終身保険\n\n月々の保険料  \n→ 17,000円\n\n「お、Bのほうが安い。」\n\nでも払込期間中に解約すると、\n\n通常型より、\n\n### **解約返戻金が少ない。**\n\n---\n\nでは、そのまま払込満了まで続けたら？\n\n低解約返戻金期間が終了。\n\n↓\n\n解約返戻金が、\n\n### **通常型の水準に近づく**\n\n設計が一般的です。\n\n「つまり、安さにはちゃんと理由があるんです。」\n\n---\n\n# 【普通の終身保険との比較】\n\n||通常の終身保険|低解約返戻金型|\n|-|-|-|\n|死亡保障|一生涯|一生涯|\n|保険料|基準|**比較的安い**|\n|払込期間中の解約返戻金|通常|**低い**|\n|途中解約|―|**不利になりやすい**|\n\n「試験では、この交換関係を覚えてください。」\n\n### 解約返戻金を低くする\n\n↓\n\n### 保険料を抑える\n\nです。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n低解約返戻金型終身保険で低く抑えられているものは？\n\n……\n\n### **解約返戻金。**\n\n「死亡保険金じゃありませんよ。」\n\n---\n\n### Q2\n\nなぜ通常の終身保険より保険料を安くできる？\n\n……\n\n**払込期間中などの解約返戻金を低く抑えているから。**\n\nはい、その交換条件です。\n\n---\n\n### Q3\n\n払込期間中に解約するとどうなる？\n\n……\n\n### **通常の終身保険より解約返戻金が少なくなります。**\n\nだから短期間で解約する可能性が高い人には注意が必要です。\n\n---\n\n# 【30秒復習】\n\n① **何の保険？**  \n→ 終身保険の一種\n\n② **何が低い？**  \n→ **解約返戻金**\n\n③ **いつ低い？**  \n→ 主に保険料払込期間中など\n\n④ **その代わり？**  \n→ **保険料が割安**\n\n⑤ **死亡保障は？**  \n→ 一生涯\n\n⑥ **最大の弱点は？**  \n→ **途中解約すると返戻金が少ない**\n\n# 【一文で覚える】\n\n> **「低解約返戻金型終身保険は、途中の解約返戻金を低く抑える代わりに、保険料を割安にした終身保険。」**\n\n「はい、先輩。“低い”だけ覚えると、**何が低いのか**を忘れます。」\n\n**死亡保険金が低い → ❌**  \n**保障期間が短い → ❌**  \n**解約返戻金が低い → ⭕**\n\n「ここまでセットで覚えてください。」\n\n次は **㉘「養老保険」** です。\n\n---", "chapter": 2}, {"n": 28, "title": "養老保険（ようろうほけん）", "raw": "# 第2章 リスク管理㉘\n\n## 養老保険（ようろうほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。養老保険は前にも少し出てきましたね。今回はちゃんと一本にまとめます。」\n\n養老保険を一言でいうと、\n\n> **保険期間中に死亡したら死亡保険金、満期まで生存したら満期保険金を受け取れる保険。**\n\nそして重要なのが、\n\n> **死亡保険金と満期保険金が同額**\n\nという基本構造です。\n\nたとえば保険金額1,000万円なら、\n\n**途中で死亡**\n→ 1,000万円\n\n**満期まで生存**\n→ 1,000万円\n\n「つまり先輩、**死んでも、生きて満期を迎えても**保険金が支払われる。」\n\nだから分類としては、\n\n### **生死混合保険**\n\nです。\n\n---\n\n# B【詳しい解説｜なぜ「生死混合」なの？】\n\n「ここは㉑の生命保険の分類に戻りますよ。」\n\n生命保険には基本的に、\n\n**死亡保険**\n→ 死亡した場合に備える\n\n**生存保険**\n→ 一定期間生存した場合に備える\n\nがありました。\n\nでは養老保険は？\n\n死亡した場合\n→ **死亡保険金**\n\n満期まで生存\n→ **満期保険金**\n\nつまり、\n\n**死亡保障**\n＋\n**生存保障**\n＝\n\n### **生死混合保険**\n\nです。\n\n「名前より、この構造で覚えてください。」\n\n---\n\n# 「定期保険と何が違う？」\n\n「先輩、30歳から60歳までの30年間で比べます。」\n\n## 定期保険\n\n30歳\n↓\n60歳\n\n途中で死亡\n→ **死亡保険金**\n\n60歳まで生存\n→ **基本的に満期保険金なし**\n\n---\n\n## 養老保険\n\n30歳\n↓\n60歳\n\n途中で死亡\n→ **死亡保険金**\n\n60歳まで生存\n→ **満期保険金**\n\n「つまり定期保険と違って、満期まで生きていた場合にもお金を受け取れるんですね。」\n\nそのため、\n\n> **養老保険は貯蓄性が高い**\n\nという特徴があります。\n\n---\n\n# 「じゃあ終身保険とは？」\n\n「ここも整理します。」\n\n### 終身保険\n\n死亡保障\n→ **一生涯**\n\n満期\n→ **基本的になし**\n\n---\n\n### 養老保険\n\n死亡保障\n→ **一定期間**\n\n満期\n→ **あり**\n\n「つまり――」\n\n> **終身保険は“いつ死亡しても保障”**\n>\n> **養老保険は“期間中に死亡しても、満期まで生きても保障”**\n\nです。\n\n---\n\n# じゃあ保険料は？\n\n「先輩、定期保険と同じ1,000万円の保障なら、どちらが一般に高いと思います？」\n\n**定期保険**\n→ 死亡しなければ満期保険金なし\n\n**養老保険**\n→ 死亡したら死亡保険金、満期まで生存したら満期保険金\n\n……\n\n「そうです。」\n\n### **養老保険のほうが一般に保険料は高くなります。**\n\n養老保険には保障だけでなく、満期保険金を準備するための貯蓄性もあるからですね。\n\n---\n\n# 「満期保険金があるなら必ず得？」\n\n「……先輩、またそこです。」\n\n満期保険金がある\n＝\n払った保険料より必ず多く返ってくる\n\nではありません。\n\n> **払込保険料総額と満期保険金の大小は、契約条件によります。**\n\nですから、\n\n「満期保険金があるから絶対儲かる」\n\nとは考えないでください。\n\n---\n\n# C【イメージ理解｜ゴールまで行っても賞金】\n\n「先輩、一本道のゲームを想像してください。」\n\nスタート\n↓\n↓\n↓\n↓\n🏁 満期\n\n途中で保険事故が起きた。\n\n→ **死亡保険金**\n\n何も起こらず最後まで到達した。\n\n→ **満期保険金**\n\n「どちらのルートでも給付があるんですね。」\n\nこれが養老保険です。\n\n一方、定期保険なら、\n\n無事ゴール\n↓\n🏁\n↓\n**満期保険金なし**\n\nが基本。\n\nだから、\n\n### 定期保険＝保障重視\n\n### 養老保険＝保障＋貯蓄\n\nという違いが出てきます。\n\n---\n\n# D【具体例｜1,000万円の養老保険】\n\n「では先輩、Aさんが40歳で、20年間の養老保険に加入したとします。」\n\n保険金額は、\n\n### **1,000万円**\n\nです。\n\n---\n\n## ケース① 50歳で死亡\n\nまだ保険期間中ですね。\n\n↓\n\n### **死亡保険金1,000万円**\n\nが支払われます。\n\n---\n\n## ケース② 60歳まで生存\n\n20年間の保険期間が終了。\n\n↓\n\n### **満期保険金1,000万円**\n\nを受け取ります。\n\n---\n\n「ここで重要なのは――」\n\n### 死亡保険金1,000万円\n\n### 満期保険金1,000万円\n\n基本的に**同額**ということです。\n\n---\n\n# 【3つの基本保険を一気に比較】\n\n「先輩、ここで定期・終身・養老を完成させましょう。」\n\n||定期保険|終身保険|養老保険|\n|-|-|-|-|\n|保障期間|一定期間|**一生涯**|一定期間|\n|死亡保障|○|○|○|\n|満期保険金|基本なし|基本なし|**あり**|\n|貯蓄性|低い|あり|**高い**|\n|特徴|安く大きな保障|一生涯保障|**保障＋貯蓄**|\n\n「ここ、生命保険の土台です。」\n\n### 定期\n\n→ **期間**\n\n### 終身\n\n→ **一生**\n\n### 養老\n\n→ **死亡でも満期でも**\n\nです。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n養老保険は生命保険の分類では何保険？\n\n……\n\n### **生死混合保険**\n\n死亡と生存の両方を組み合わせているからです。\n\n---\n\n### Q2\n\n保険金額1,000万円の養老保険。\n\n保険期間中に死亡した場合の死亡保険金と、満期まで生存した場合の満期保険金は基本的に？\n\n……\n\n### **同額の1,000万円。**\n\n「はい。ここ重要です。」\n\n---\n\n### Q3\n\n定期保険と養老保険の大きな違いは？\n\n……\n\n### **養老保険には満期保険金がある。**\n\nそのため、定期保険より貯蓄性が高く、一般に保険料も高くなります。\n\n---\n\n# 【30秒復習】\n\n① **養老保険の分類は？**  \n→ 生死混合保険\n\n② **期間中に死亡したら？**  \n→ 死亡保険金\n\n③ **満期まで生存したら？**  \n→ 満期保険金\n\n④ **死亡保険金と満期保険金は？**  \n→ **基本的に同額**\n\n⑤ **貯蓄性は？**  \n→ 高い\n\n⑥ **定期・終身・養老を一言で？**  \n→ **定期＝期間、終身＝一生、養老＝死亡でも満期でも**\n\n# 【一文で覚える】\n\n> **「養老保険は、期間中に死亡すれば死亡保険金、満期まで生存すれば同額の満期保険金を受け取る生死混合保険。」**\n\n「はい、先輩。これで生命保険の基本3商品がきれいにつながりました。」\n\n**定期＝安く一定期間を保障**  \n**終身＝一生涯を保障**  \n**養老＝一定期間の保障＋満期の貯蓄**\n\n次は、この終身保険に定期保険を上乗せするタイプです。\n\n**㉙「定期保険特約付終身保険」**です。\n\n---", "chapter": 2}, {"n": 29, "title": "定期保険特約付終身保険（ていきほけんとくやくつき・しゅうしんほけん）", "raw": "# 第2章 リスク管理㉙\n\n## 定期保険特約付終身保険（ていきほけんとくやくつき・しゅうしんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は名前をそのまま分解してください。」\n\n**定期保険特約 ＋ 終身保険**\n\nです。\n\n一言でいうと、\n\n> **終身保険を主契約として、その上に定期保険特約を付けて、一定期間の死亡保障を大きくする保険。**\n\nたとえば、\n\n**終身保険：500万円**\n＋\n**定期保険特約：2,500万円**\n\nなら、特約期間中の死亡保障は、\n\n### **合計3,000万円**\n\nです。\n\nでも定期保険特約が終了すると、\n\n### **終身部分500万円だけ**\n\nが残ります。\n\n「つまり、**一生涯の土台は小さく、必要な時期だけ保障を大きくする**仕組みですね。」\n\n---\n\n# B【詳しい解説｜なぜ2つを組み合わせるの？】\n\n「先輩、子育て中の家庭を思い出してください。」\n\n35歳。\n\n子どもがまだ小さい。\n\nもし今死亡したら、\n\n生活費  \n＋  \n教育費  \n＋  \nその他\n\nで、大きな必要保障額が必要です。\n\nたとえば、\n\n### 3,000万円\n\n必要だとします。\n\n「じゃあ3,000万円全部を終身保険にする？」\n\n……\n\nできますが、一般に保険料が高くなります。\n\nそこで、\n\n**一生涯必要な保障**\n→ 終身保険500万円\n\n**子育て期間だけ必要な大きな保障**\n→ 定期保険特約2,500万円\n\nと分けるんです。\n\nすると、\n\n> **必要な期間だけ、大きな保障を比較的少ない保険料で上乗せできます。**\n\n---\n\n# 「主契約」と「特約」って何？\n\n「ここ、用語も整理しますよ。」\n\n### 主契約\n\n保険の**本体**です。\n\n今回なら、\n\n### **終身保険**\n\n---\n\n### 特約\n\n主契約に追加する**オプション**です。\n\n今回なら、\n\n### **定期保険特約**\n\nです。\n\nつまり、\n\n🏠 **終身保険＝家本体**\n\nそこに、\n\n🏠＋🚗\n\nみたいにオプションを追加するのが特約。\n\n「定期保険特約だけが本体ではない、という点を押さえてください。」\n\n---\n\n# 特約期間中に死亡したら？\n\n「数字で見ましょう。」\n\n終身保険\n→ 500万円\n\n定期保険特約\n→ 2,500万円\n\n特約期間中に死亡した。\n\nすると、\n\n500万円\n＋\n2,500万円\n＝\n\n### **3,000万円**\n\nの死亡保障になります。\n\n---\n\n# 定期保険特約が終了したら？\n\n「では、無事に特約期間を終えました。」\n\n定期保険特約2,500万円\n→ **終了**\n\nでも主契約の終身保険は？\n\n……\n\n### **残ります。**\n\nだから、\n\n3,000万円\n↓\n特約終了\n↓\n\n### **500万円**\n\nになります。\n\n「保障が全部ゼロになるわけではないんですね。」\n\n---\n\n# 「全期型」と「更新型」\n\n「そして定期保険特約には、ここもあります。」\n\n## 全期型\n\nたとえば、\n\n30歳\n↓\n60歳\n\n最初から必要な期間全体を定期保険特約で保障します。\n\n→ **途中で更新しない**\n\n---\n\n## 更新型\n\nたとえば、\n\n30歳\n↓\n10年間\n↓\n40歳で更新\n↓\n10年間\n↓\n50歳で更新\n↓\n60歳\n\nというタイプ。\n\n「定期保険でやりましたね。」\n\n更新すると一般に、\n\n> **更新時の年齢などをもとに保険料が再計算されるため、保険料は上がります。**\n\n---\n\n# 「更新したら保障額も必ず増える？」\n\n「先輩、それは違います。」\n\n更新によって年齢が上がる。\n\n↓\n\n保険料が上がる。\n\nだからといって、\n\n**保障額まで自動的に増える**\n\nわけではありません。\n\nたとえば同じ2,500万円の定期保険特約を更新しても、\n\n30歳より40歳、\n40歳より50歳のほうが、\n\n一般に保険料が高くなる。\n\n「**保障が増えたから高くなるのではなく、年齢が上がったことで高くなる**んですね。」\n\n---\n\n# C【イメージ理解｜ケーキで考えましょう】\n\n「先輩、終身保険をケーキの土台だと思ってください。」\n\n### 土台\n\n🍰 **終身保険500万円**\n\nこれは一生涯残ります。\n\nそこに子育て期間だけ、\n\n🎂🎂🎂  \n**定期保険特約2,500万円**\n\nをドンと上乗せする。\n\nすると、\n\n### 子育て中\n\n**終身500万円**\n＋\n**定期2,500万円**\n＝\n\n### 3,000万円\n\n---\n\n子どもが独立。\n\n大きな保障が不要になった。\n\n↓\n\n定期特約終了。\n\n↓\n\n残るのは、\n\n### 終身500万円\n\n「土台はずっと残って、上に乗せた部分だけ外れる。」\n\nこれが一番わかりやすいイメージです。\n\n---\n\n# D【具体例｜必要保障額とつなげます】\n\n「Aさん35歳。子どもが2人います。」\n\n現在の必要保障額を計算すると、\n\n### 3,000万円\n\nでした。\n\nでもAさんは、\n\n「3,000万円が一生必要なわけじゃない。子どもが独立したら、大きな保障はいらない。」\n\nと考えました。\n\nそこで、\n\n### 主契約\n\n終身保険\n→ 500万円\n\n### 特約\n\n定期保険特約\n→ 2,500万円\n\nにします。\n\n---\n\n### 45歳で死亡\n\nまだ定期特約期間中。\n\n500万円\n＋\n2,500万円\n＝\n\n### **3,000万円**\n\n---\n\n### 子ども独立後\n\n定期保険特約終了。\n\n↓\n\n終身保険500万円は残る。\n\n↓\n\n80歳で死亡した場合も、\n\n### **終身部分500万円**\n\nの死亡保障があります。\n\n「つまり――」\n\n> **若い時＝大きな保障**\n>\n> **老後＝必要最低限の終身保障**\n\nという形を作れるわけです。\n\n---\n\n# 【定期保険との違い】\n\n「先輩、普通の定期保険だけなら？」\n\n定期保険\n↓\n保険期間終了\n↓\n\n### 死亡保障終了\n\n一方、\n\n定期保険特約付終身保険なら、\n\n定期特約終了\n↓\n\n### **終身保険部分は残る**\n\nここが大きな違いです。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n定期保険特約付終身保険の主契約は？\n\n……\n\n### **終身保険。**\n\n定期保険は**特約**として上乗せします。\n\n---\n\n### Q2\n\n終身保険500万円＋定期保険特約2,500万円。\n\n特約期間中に死亡したら死亡保障はいくら？\n\n……\n\n### **3,000万円**\n\nです。\n\n---\n\n### Q3\n\n定期保険特約が終了すると、すべての死亡保障がなくなる？\n\n……\n\n### **なくなりません。**\n\n定期保険特約は終了しても、\n\n**主契約である終身保険の死亡保障は一生涯残ります。**\n\n「はい。ここが一番大事です。」\n\n---\n\n# 【30秒復習】\n\n① **主契約は？**  \n→ 終身保険\n\n② **上乗せするのは？**  \n→ 定期保険特約\n\n③ **何のため？**  \n→ 一定期間だけ死亡保障を大きくする\n\n④ **特約期間中の死亡保障は？**  \n→ 終身部分＋定期部分\n\n⑤ **定期特約終了後は？**  \n→ 終身部分だけ残る\n\n⑥ **更新型を更新すると？**  \n→ 一般に保険料が上がる\n\n# 【一文で覚える】\n\n> **「定期保険特約付終身保険は、終身保障を土台に、必要な期間だけ定期保険で大きな死亡保障を上乗せする保険。」**\n\n「はい、先輩。これは図で覚えれば簡単です。」\n\n**若い時**\n→ ██████████ 大きな保障\n\n**特約終了後**\n→ ██ 終身保障だけ残る\n\n「必要保障額が大きい子育て期間だけ上乗せする、とつなげてください。」\n\n次は個人ではなく、**会社や団体単位で加入する生命保険**に移ります。\n\n**㉚「団体定期保険」**です。\n\n---", "chapter": 2}, {"n": 30, "title": "団体定期保険（だんたいていきほけん）", "raw": "# 第2章 リスク管理㉚\n\n## 団体定期保険（だんたいていきほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**団体定期保険**です。」\n\n名前を分解すると、\n\n**団体 ＋ 定期保険**\n\nですね。\n\nつまり、\n\n> **会社などの団体を単位として、その所属員を対象に加入する定期保険。**\n\n個人が一人ずつ保険会社と契約するのではなく、**会社などを通じて集団で加入する**のがポイントです。\n\nそして一般に、\n\n> **個人で同程度の定期保険に加入する場合より、保険料が割安になりやすい**\n\nというメリットがあります。\n\n「まずは、**会社のみんなで入る定期保険**というイメージで大丈夫です。」\n\n---\n\n# B【詳しい解説｜なぜ団体で入るの？】\n\n「先輩、会社に従業員が1,000人いるとしましょう。」\n\n一人ひとりが、\n\nA生命  \nB生命  \nC生命……\n\nとバラバラに契約するより、\n\n### 会社という団体\n\nを通じてまとめて契約したほうが、保険会社としても事務を効率化できます。\n\nさらに、多数の人をまとめて扱えます。\n\nそのため一般に、\n\n### **保険料を割安に設定しやすい**\n\nという特徴があります。\n\n---\n\n# 「団体定期保険には種類がある？」\n\n「はい。FPではここを押さえます。」\n\n代表的なのが、\n\n### **① 総合福祉団体定期保険**\n\nそして、\n\n### **② 団体定期保険（Bグループ保険）**\n\nなどです。\n\n「次の㉛で**総合福祉団体定期保険**を詳しくやるので、今回はまずBグループ保険の特徴を中心に見ましょう。」\n\n---\n\n# Bグループ保険とは？\n\n「会社員の先輩が、会社からこんな案内をもらったとします。」\n\n> 「希望者は団体生命保険に加入できます」\n\nこれは、\n\n### **任意加入**\n\nです。\n\nつまり、\n\n「会社に入社したら全員強制加入！」\n\nというわけではなく、\n\n> **加入を希望する従業員などが加入する**\n\nタイプがあります。\n\nそして保険料は、\n\n### **加入者本人が負担する**\n\nのが基本です。\n\n---\n\n# 「会社が保険料を払ってくれるんじゃないの？」\n\n「先輩、そこが次の総合福祉団体定期保険との大きな違いになります。」\n\nBグループ保険では基本的に、\n\n### **従業員などが任意で加入**\n\n＋\n\n### **保険料も本人負担**\n\nです。\n\n一方、次にやる、\n\n### **総合福祉団体定期保険**\n\nでは、企業の福利厚生制度として会社側が契約・保険料を負担する形が基本になります。\n\n「ここ、試験で比較されやすいですよ。」\n\n---\n\n# 「会社を辞めたらどうなる？」\n\n「さて先輩。」\n\n団体定期保険は何を土台に加入しています？\n\n……\n\n### **その団体に所属していること**\n\nですよね。\n\nだから退職などによって団体を離れると、\n\n> **原則としてその団体保険の対象から外れます。**\n\n「個人の終身保険みたいに、会社を辞めても同じ条件でずっと持ち続ける、という発想ではないんです。」\n\n※継続・移行制度などの取扱いは契約によって異なります。\n\n---\n\n# ここで「個人の定期保険」と比較\n\n「先輩、整理しますよ。」\n\n### 個人の定期保険\n\n自分\n↕\n保険会社\n\n**個人単位で契約**\n\n---\n\n### 団体定期保険\n\n従業員\n↓\n🏢 会社・団体\n↓\n保険会社\n\n**団体を通じて加入**\n\nだから、\n\n> **団体割引などによって保険料が割安になりやすい**\n\nわけですね。\n\n---\n\n# C【イメージ理解｜会社の団体旅行です】\n\n「先輩、個人旅行と団体旅行をイメージしてください。」\n\n一人で旅行会社に申し込む。\n\n👤  \n↓  \n✈️\n\nこれが、\n\n### 個人保険\n\nのイメージ。\n\n---\n\nでも会社の500人で、\n\n👥👥👥👥👥\n↓\n🏢会社\n↓\n✈️\n\nまとめて申し込む。\n\nすると、\n\n「団体料金があります」\n\nとなることがありますよね。\n\n団体定期保険も、\n\n> **個人ではなく団体単位で保険に加入することで、割安な保険料で保障を準備しやすい**\n\nと考えると分かりやすいです。\n\n---\n\n# D【具体例｜会社員Aさんの場合】\n\n「AさんはX株式会社に勤務しています。」\n\n会社から、\n\n> 「従業員向け団体定期保険に加入しませんか？」\n\nという案内が届きました。\n\nAさんは、\n\n「保険料も比較的安いし、死亡保障を追加したい」\n\nと考えて申し込みました。\n\nこの場合、\n\n### Aさん\n\n→ 任意で加入\n\n### 保険料\n\n→ Aさん本人が負担\n\n### 死亡した場合\n\n→ 契約で定められた受取人へ死亡保険金\n\nという形になります。\n\n---\n\n## では退職したら？\n\n「Aさん、転職しました。」\n\n↓\n\nX株式会社を退職。\n\n↓\n\n団体から離脱。\n\n↓\n\n原則、\n\n### **X社の団体定期保険からも脱退**\n\nとなります。\n\n「だから団体定期保険だけに死亡保障を全部頼っている場合、転職・退職時には保障の見直しも必要になるわけですね。」\n\n---\n\n# 【ここが重要｜次との比較】\n\n「先輩、次のために今ここだけ覚えてください。」\n\n### 団体定期保険（Bグループ保険）\n\n**加入**\n→ 従業員などが任意\n\n**保険料**\n→ 従業員など本人が負担\n\n---\n\n### 総合福祉団体定期保険\n\n**目的**\n→ 企業の福利厚生\n\n**保険料**\n→ 原則として企業側が負担\n\n「次で詳しくやりますが、まずこの対比を作っておけば混乱しません。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n団体定期保険とは、どんな保険？\n\n……\n\n### **会社などの団体を通じて、その所属員が加入する定期保険。**\n\n---\n\n### Q2\n\nBグループ保険では、加入は基本的に強制？\n\n……\n\n### **いいえ。任意加入です。**\n\n希望する従業員などが加入します。\n\n---\n\n### Q3\n\nBグループ保険の保険料は基本的に誰が負担する？\n\n……\n\n### **加入した従業員など本人。**\n\n「ここ、次の総合福祉団体定期保険と比較してください。」\n\n---\n\n# 【30秒復習】\n\n① **団体定期保険とは？**  \n→ 団体を通じて加入する定期保険\n\n② **メリットは？**  \n→ 保険料が割安になりやすい\n\n③ **Bグループ保険の加入は？**  \n→ 任意\n\n④ **Bグループ保険の保険料負担は？**  \n→ 加入者本人\n\n⑤ **退職すると？**  \n→ 原則として団体保険から外れる\n\n⑥ **次に比較するのは？**  \n→ 総合福祉団体定期保険\n\n# 【一文で覚える】\n\n> **「団体定期保険は、会社などの団体を通じて加入する定期保険で、Bグループ保険では従業員が任意加入し、保険料も本人が負担するのが基本。」**\n\n「はい、先輩。今回は**“団体だから安くなりやすい、Bグループは本人が入り本人が払う”**で押さえてください。」\n\n次は名前が似ていますが、**会社側の福利厚生**という視点が強くなります。\n\n**㉛「総合福祉団体定期保険」**です。\n\n---", "chapter": 2}, {"n": 31, "title": "総合福祉団体定期保険（そうごうふくしだんたい・ていきほけん）", "raw": "# 第2章 リスク管理㉛\n\n## 総合福祉団体定期保険（そうごうふくしだんたい・ていきほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。前回の**団体定期保険（Bグループ保険）**とセットで覚えますよ。」\n\n総合福祉団体定期保険とは、\n\n> **企業などが、役員・従業員の死亡・高度障害などに備えて加入する、原則1年更新の団体定期保険。**\n\n大きなポイントは、\n\n**企業が契約者**\n→ **企業が保険料を負担**\n→ **従業員などを被保険者にする**\n\nということです。\n\n「前回は**従業員が自分のために入る**イメージでした。」\n\n今回は、\n\n> **会社が福利厚生のために用意する保険**\n\nと考えると分かりやすいですよ。\n\n---\n\n# B【詳しい解説｜なぜ会社が従業員に保険をかけるの？】\n\n「たとえば先輩が会社員だとします。」\n\nもし在職中に亡くなったら、会社から遺族へ、\n\n**死亡退職金**\nや\n**弔慰金**\n\nなどを支払う制度があるかもしれません。\n\nでも会社からすると、\n\n「突然、従業員が亡くなって数百万円・数千万円を支払う」\n\nとなれば大きな負担です。\n\nそこで、\n\n会社\n↓\n保険料を払う\n↓\n従業員を被保険者として保険をかける\n↓\n死亡・高度障害\n↓\n保険金\n↓\n死亡退職金などの財源にする\n\nという仕組みを利用できます。\n\n「つまり、**従業員・遺族の福利厚生と、企業の資金準備**を組み合わせているんですね。」\n\n---\n\n# 誰が契約者なの？\n\n「ここは試験で狙いやすいです。」\n\n### 契約者\n\n→ **企業・団体**\n\n### 被保険者\n\n→ **役員・従業員など**\n\n### 保険料負担\n\n→ **企業・団体**\n\nです。\n\n「前回のBグループ保険と違いますよ。」\n\n---\n\n# 前回との違いを一本にします\n\n### Bグループ保険\n\n従業員\n→「入りたいです」\n\n**任意加入**\n\n保険料\n→ **従業員本人が負担**\n\n目的\n→ 従業員自身の保障\n\n---\n\n### 総合福祉団体定期保険\n\n会社\n→ 福利厚生制度として契約\n\n保険料\n→ **会社が負担**\n\n目的\n→ **従業員の遺族保障・福利厚生など**\n\n「なので覚え方は――」\n\n> **Bグループ＝本人が入って本人が払う**\n>\n> **総合福祉＝会社が用意して会社が払う**\n\nです。\n\n---\n\n# 「保険期間は一生涯？」\n\n「“定期保険”って書いてありますからね。」\n\n終身ではありません。\n\n総合福祉団体定期保険は、\n\n> **原則として1年更新**\n\nです。\n\nつまり、\n\n1年間\n↓\n更新\n↓\n1年間\n↓\n更新……\n\nという仕組みです。\n\n「会社の福利厚生制度として毎年更新していくイメージですね。」\n\n---\n\n# 「会社が保険金を全部もらって自由に使っていい？」\n\n「先輩、そこは注意してください。」\n\n総合福祉団体定期保険は、従業員の福利厚生を目的とした制度です。\n\n保険金の受取人は契約内容に応じて**遺族または企業**などとなります。\n\n企業が受取人となる場合には、死亡退職金・弔慰金などの支給財源として活用することが想定されています。\n\n「つまり、単純に“従業員が亡くなったら会社が儲かる保険”と理解するのは違います。」\n\n---\n\n# ここで次の「ヒューマン・ヴァリュー特約」につながります\n\n「先輩、実は次が面白いところです。」\n\n従業員が亡くなると困るのは、\n\n**遺族だけでしょうか？**\n\n……\n\n「会社も困りますよね。」\n\nたとえば重要な社員が亡くなった。\n\nすると、\n\n採用費\n研修費\n代替人材の確保\n業務の遅れ\n\nなど、\n\n### **企業にも経済的損失**\n\nが発生する可能性があります。\n\nそこで、\n\n> **企業自身が被る経済的損失を補う**\n\nために付加できるのが、\n\n### **ヒューマン・ヴァリュー特約**\n\nです。\n\n「これは次で詳しくやります。」\n\n---\n\n# C【イメージ理解｜会社が用意する“社員用の安全網”】\n\n「先輩、会社の下に大きなネットが張ってあると思ってください。」\n\n🏢会社  \n↓  \n👨‍💼 👩‍💼 👨‍💼 👩‍💼  \n↓  \n🕸️ **福利厚生の安全網**\n\n従業員に万一のことがあった。\n\n↓\n\n遺族に死亡退職金などが必要。\n\n↓\n\nその財源を、\n\n### **総合福祉団体定期保険**\n\nで準備する。\n\nだから、\n\n> **個人が自分で買う保険というより、会社が従業員のために用意する福利厚生制度**\n\nというイメージなんです。\n\n---\n\n# D【具体例｜A社の従業員が死亡したら】\n\n「A株式会社には100人の従業員がいます。」\n\nA社には、\n\n> 従業員が在職中に死亡した場合、遺族に死亡退職金などを支給する\n\nという制度があります。\n\nそこで会社が、\n\n### 総合福祉団体定期保険\n\nに加入しました。\n\n---\n\nAさんが被保険者。\n\n↓\n\nAさんが在職中に死亡。\n\n↓\n\n保険契約に基づき死亡保険金。\n\n↓\n\n会社が受取人となっている場合、その保険金を死亡退職金などの財源として利用。\n\n「こういう流れですね。」\n\n---\n\n# 【Bグループ保険との比較】\n\n「先輩、ここは表ごと頭に入れましょう。」\n\n||Bグループ保険|総合福祉団体定期保険|\n|-|-|-|\n|主な目的|個人の保障|**企業の福利厚生**|\n|加入|従業員が任意加入|企業の制度として加入|\n|保険料負担|**従業員本人**|**企業**|\n|保険期間|定期|**原則1年更新**|\n|イメージ|自分で入る|**会社が用意する**|\n\n「試験ならまず**誰が保険料を払うか**を見てください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n総合福祉団体定期保険の保険料を負担するのは基本的に誰？\n\n……\n\n### **企業・団体です。**\n\n---\n\n### Q2\n\n主な目的は？\n\n……\n\n### **従業員の遺族保障など、企業の福利厚生。**\n\n死亡退職金・弔慰金などの財源準備にも利用されます。\n\n---\n\n### Q3\n\nBグループ保険との大きな違いは？\n\n……\n\n**Bグループ**\n→ 従業員が任意加入し、本人が保険料負担\n\n**総合福祉団体定期**\n→ 企業が福利厚生制度として契約し、企業が保険料負担\n\n「はい。ここが言えればかなり整理できています。」\n\n---\n\n# 【30秒復習】\n\n① **誰が契約する？**  \n→ 企業・団体\n\n② **誰が被保険者？**  \n→ 役員・従業員など\n\n③ **誰が保険料を負担？**  \n→ **企業・団体**\n\n④ **主な目的は？**  \n→ 福利厚生・遺族保障\n\n⑤ **保険期間は？**  \n→ **原則1年更新**\n\n⑥ **Bグループとの違いは？**  \n→ **本人が払うBグループ／会社が払う総合福祉**\n\n# 【一文で覚える】\n\n> **「総合福祉団体定期保険は、企業が保険料を負担し、役員・従業員の死亡などに備えて福利厚生を充実させる原則1年更新の団体保険。」**\n\n「そして先輩、最後に流れを一本だけ。」\n\n**従業員が死亡**\n↓\n**遺族も経済的に困る**\n→ 総合福祉団体定期保険\n\nでも、\n\n**会社も経済的に困る**\n↓\n「じゃあ会社側の損失にも備えられない？」\n\n……そこで次です。\n\n**㉜「ヒューマン・ヴァリュー特約」**です。\n\n---", "chapter": 2}, {"n": 32, "title": "ヒューマン・ヴァリュー特約", "raw": "# 第2章 リスク管理㉜\n\n## ヒューマン・ヴァリュー特約\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は前回の**総合福祉団体定期保険**からそのままつながります。」\n\n前回は、\n\n従業員が死亡\n↓\n遺族への死亡退職金・弔慰金などが必要\n↓\n**総合福祉団体定期保険**\n\nでした。\n\n「でも先輩。従業員が亡くなって経済的に困るのは、遺族だけでしょうか？」\n\n……\n\nそうです。\n\n### **会社も損失を受ける可能性があります。**\n\nそこで、\n\n> **従業員の死亡・高度障害によって企業が被る経済的損失を補うための特約**\n\nが、\n\n## **ヒューマン・ヴァリュー特約**\n\nです。\n\n「ヒューマン＝人、ヴァリュー＝価値。」\n\nつまり、\n\n> **“人材を失ったことによる会社側の損失”に備える**\n\nと覚えてください。\n\n---\n\n# B【詳しい解説｜会社は何を失うの？】\n\n「先輩、優秀な営業社員Aさんを想像してください。」\n\nAさんは、\n\n長年の経験がある  \n↓\n重要顧客を担当している  \n↓\n年間で大きな売上を作っている  \n↓\n後輩の教育もしている\n\nそんなAさんが突然亡くなったら？\n\n「会社は、明日から別の人を席に座らせれば全部元通り……とはなりませんよね。」\n\n---\n\n会社には、\n\n**代替人材の採用費**\n\n**新しい社員の教育・研修費**\n\n**引き継ぎに伴うコスト**\n\n**一時的な業務効率の低下**\n\nなどの経済的損失が発生する可能性があります。\n\nつまり、\n\n> **従業員そのものが企業にとって経済的価値を持っている**\n\nわけです。\n\nこれを、\n\n### **Human Value＝人的価値**\n\nとして考えるんですね。\n\n---\n\n# 「普通の総合福祉団体定期保険ではダメなの？」\n\n「ここを分けますよ。」\n\n### 総合福祉団体定期保険\n\n主として、\n\n**従業員・遺族側の保障**\n\nを目的とします。\n\n死亡退職金や弔慰金などですね。\n\n---\n\n一方、\n\n### ヒューマン・ヴァリュー特約\n\nこちらは、\n\n> **従業員を失ったことによる企業側の経済的損失**\n\nに備えます。\n\n「つまり――」\n\n### 本体\n\n→ **遺族などのため**\n\n### ヒューマン・ヴァリュー特約\n\n→ **会社のため**\n\nという方向で覚えると分かりやすいです。\n\n---\n\n# どんな損失を補う？\n\n「先輩、たとえば営業部長が亡くなったとします。」\n\n会社は、\n\n新しい部長を採用\n↓\n採用費100万円\n\n研修・教育\n↓\n50万円\n\n引き継ぎ期間の業務低下\n↓\n損失200万円\n\nなど、\n\n**会社独自の損失**\n\nを受ける可能性があります。\n\nそこでヒューマン・ヴァリュー特約から受け取る保険金を、\n\n> **企業が負担する代替雇用者の採用・育成費用などの財源**\n\nとして活用するわけです。\n\n---\n\n# 「死亡退職金に使うんじゃないの？」\n\n「あ、そこが区別ポイントです。」\n\n死亡退職金など、\n\n### **遺族に対する福利厚生**\n\nの財源を準備するのが本体。\n\n一方、\n\n### **企業自身の経済的損失**\n\nを補うのがヒューマン・ヴァリュー特約。\n\n「目的が違います。」\n\n---\n\n# C【イメージ理解｜会社から人材という歯車が抜ける】\n\n「先輩、会社を大きな機械だと思ってください。」\n\n⚙️⚙️⚙️⚙️⚙️\n\n社員一人ひとりが歯車として働いています。\n\nその中の重要な一人が突然、\n\n💥⚙️\n\n抜けた。\n\nすると、\n\n機械全体の動きが悪くなる。\n\n会社は、\n\n新しい人を採用する  \n↓\n教育する  \n↓\n仕事を引き継ぐ  \n↓\n元の状態まで育てる\n\n必要があります。\n\n「ここには当然、お金がかかりますよね。」\n\nその、\n\n### **人材を失った会社側のダメージ**\n\nを補う。\n\nこれが、\n\n### **ヒューマン・ヴァリュー特約**\n\nです。\n\n---\n\n# D【具体例｜Aさんが死亡した場合】\n\n「X社に営業部長Aさんがいます。」\n\nAさんは重要な取引先を多数担当しています。\n\nところがAさんが突然死亡しました。\n\n---\n\nまずAさんの遺族。\n\n会社の制度に基づいて、\n\n### 死亡退職金など\n\nを支給します。\n\nその財源として、\n\n### **総合福祉団体定期保険**\n\nを利用。\n\n---\n\n「でも話は終わりません。」\n\n会社では、\n\nAさんの代わりを採用\n↓\n採用費\n\n新しい人材を教育\n↓\n教育費\n\n顧客を引き継ぐ\n↓\n引継ぎコスト\n\n業務が一時的に低下\n↓\n経済的損失\n\nが発生。\n\nそこで、\n\n### **ヒューマン・ヴァリュー特約**\n\nによって、\n\n**会社側の経済的損失を補う**\n\nわけです。\n\n---\n\n# 【本体と特約を一本につなげる】\n\n「先輩、ここは図で覚えてください。」\n\n### 従業員が死亡\n\n↓ ↓\n\n**遺族が困る**  \n→ 総合福祉団体定期保険  \n→ 死亡退職金などの財源\n\n**会社が困る**  \n→ ヒューマン・ヴァリュー特約  \n→ 採用・育成費用などの企業損失を補う\n\n「“誰が困るのか？”を見るだけです。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\nヒューマン・ヴァリュー特約は、誰の経済的損失に備える？\n\n……\n\n### **企業です。**\n\n「遺族ではありませんよ。」\n\n---\n\n### Q2\n\nどんな損失を想定している？\n\n……\n\nたとえば、\n\n**代替人材の採用費・育成費など**\n\n従業員を失ったことによる企業側の経済的損失です。\n\n---\n\n### Q3\n\n総合福祉団体定期保険の本体との違いは？\n\n……\n\n**本体**\n→ 従業員・遺族の福利厚生\n\n**ヒューマン・ヴァリュー特約**\n→ 企業自身の経済的損失\n\n「はい。この対比ができれば大丈夫です。」\n\n---\n\n# 【30秒復習】\n\n① **Human Valueとは？**  \n→ 人的価値\n\n② **誰に備える？**  \n→ 従業員など\n\n③ **誰の損失を補う？**  \n→ **企業**\n\n④ **何が起きた場合？**  \n→ 従業員の死亡・高度障害など\n\n⑤ **何に使える？**  \n→ 代替人材の採用・育成費用など\n\n⑥ **本体との違いは？**  \n→ **本体＝遺族側／特約＝企業側**\n\n# 【一文で覚える】\n\n> **「ヒューマン・ヴァリュー特約は、従業員の死亡・高度障害などによって企業が被る人的価値の喪失による経済的損失を補う特約。」**\n\n「はい、先輩。」\n\n**従業員が亡くなる**\n↓\n**遺族への保障＝総合福祉団体定期**\n↓\n**会社側の損失＝ヒューマン・ヴァリュー特約**\n\nこの一本の流れで覚えてください。\n\n次は仕組みがガラッと変わって、**運用実績によって保険金などが変動する保険**に入ります。\n\n次は **㉝「変額保険」** です。\n\n---", "chapter": 2}, {"n": 33, "title": "変額保険（へんがくほけん）", "raw": "# 第2章 リスク管理㉝\n\n## 変額保険（へんがくほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**変額保険**です。名前の通り、“金額が変わる保険”ですね。」\n\n一言でいうと、\n\n> **株式や債券などで運用し、その運用実績によって保険金や解約返戻金などが変動する生命保険。**\n\nそして最重要ポイント。\n\n> **死亡保険金には基本保険金額という最低保証があります。**\n\n一方で、\n\n> **解約返戻金には最低保証がありません。**\n\n「ここ、試験でかなり大事です。」\n\n**死亡保険金 → 最低保証あり**  \n**解約返戻金 → 最低保証なし**\n\nまずこの対比を固定してください。\n\n---\n\n# B【詳しい解説｜普通の保険と何が違う？】\n\n「先輩、普通の生命保険では、保険会社が受け取った保険料を運用していますよね。」\n\n変額保険では、資産を、\n\n### **特別勘定**\n\nという別枠で運用します。\n\n「“特別な口座”くらいのイメージで大丈夫です。」\n\nその中で、\n\n**株式\n債券**\n\nなどを使って運用します。\n\n---\n\n## 運用がうまくいったら？\n\n株価上昇など\n↓\n運用実績が良い\n↓\n積立部分が増える\n↓\n\n### 保険金などが増える可能性\n\nがあります。\n\n---\n\n## 運用が悪かったら？\n\n株価下落など\n↓\n運用実績が悪い\n↓\n積立部分が減る\n↓\n\n### 保険金や解約返戻金などが減少\n\nする可能性があります。\n\n「つまり先輩、運用リスクがあります。」\n\nそして、その運用実績によるリスクは、\n\n> **契約者側が負担する**\n\nのが重要です。\n\n---\n\n# 「じゃあ株価暴落で死亡保険金もゼロ？」\n\n「はい、ここで最低保証の話です。」\n\n変額保険の死亡保険金には、\n\n### **基本保険金額**\n\nがあります。\n\nたとえば基本保険金額が、\n\n**1,000万円**\n\nだったとします。\n\n---\n\n運用が好調。\n\n変動部分が増えて、\n\n死亡保険金\n→ **1,300万円**\n\nになった。\n\nこれはあり得ます。\n\n---\n\n反対に運用が悪化。\n\n計算上800万円相当まで下がったとしても、\n\n死亡保険金については、\n\n### **基本保険金額1,000万円が最低保証**\n\nされます。\n\n「だから死亡保障には床がある、というイメージです。」\n\n---\n\n# では解約返戻金は？\n\n「先輩、ここで引っかからないでください。」\n\n途中で解約する場合の、\n\n### **解約返戻金**\n\nには、\n\n> **最低保証がありません。**\n\n運用が悪ければ、\n\n**払った保険料を大きく下回る**\n\n可能性があります。\n\n---\n\n## つまり\n\n### 死亡保険金\n\n→ **基本保険金額の最低保証あり**\n\n### 解約返戻金\n\n→ **最低保証なし**\n\n「変額保険を見た瞬間、この2つを思い出してください。」\n\n---\n\n# 「定額保険」と何が違う？\n\n「比較すると簡単ですよ。」\n\n### 定額保険\n\n契約時に、\n\n「死亡保険金1,000万円」\n\nなどと決める。\n\n基本的に契約で定められた金額を支払う。\n\n---\n\n### 変額保険\n\n運用実績によって、\n\n1,000万円\n↓\n1,200万円\n↓\n1,500万円\n\nなど、\n\n### **金額が変動する可能性がある。**\n\n「だから“変額”なんですね。」\n\n---\n\n# 変額保険には2種類ある\n\n「ここもFPでは押さえます。」\n\n### ① 有期型\n\n保険期間が、\n\n**一定期間**\n\nです。\n\nたとえば、\n\n30歳\n↓\n60歳満期\n\nというタイプ。\n\n---\n\n### ② 終身型\n\n死亡保障が、\n\n### **一生涯**\n\n続きます。\n\n「つまり、“変額＝全部期間限定”ではありません。」\n\n**有期型**\nと\n**終身型**\n\nがあります。\n\n---\n\n# 有期型の「満期保険金」は要注意\n\n「先輩、ここがもう一つの試験ポイントです。」\n\n有期型なら満期があります。\n\n「じゃあ満期保険金も基本保険金額が最低保証される？」\n\n……\n\n### **されません。**\n\n満期保険金は、\n\n> **運用実績に応じた金額**\n\nになります。\n\nしたがって、運用実績によっては、\n\n### **基本保険金額を下回る可能性があります。**\n\n---\n\n## ここまでまとめると\n\n|お金|最低保証|\n|-|-|\n|**死亡保険金**|**あり（基本保険金額）**|\n|**解約返戻金**|**なし**|\n|**満期保険金（有期型）**|**なし**|\n\n「先輩、ここはかなり重要です。」\n\n> **死亡には床がある。解約・満期には床がない。**\n\nと覚えてください。\n\n---\n\n# C【イメージ理解｜エレベーター＋死亡保障の床】\n\n「先輩、エレベーターを想像してください。」\n\n運用が好調。\n\n⬆️⬆️⬆️\n\n1,000万円\n→ 1,200万円\n→ 1,400万円\n\n運用が不調。\n\n⬇️⬇️⬇️\n\n1,400万円\n→ 1,100万円\n→ 900万円……\n\n金額が上下します。\n\nでも死亡保険金については、\n\n### ━━━━━\n\n### 基本保険金額1,000万円\n\n### ━━━━━\n\nという**床**があります。\n\n死亡保険金は、この床より下には落ちない。\n\nところが、\n\n### 解約返戻金\n\n### 満期保険金\n\nには、その床がありません。\n\n「だから――」\n\n**死亡＝床あり**\n\n**解約・満期＝床なし**\n\nです。\n\n---\n\n# D【具体例｜基本保険金額1,000万円】\n\n「Aさんが変額保険に加入しました。」\n\n基本保険金額は、\n\n### **1,000万円**\n\nです。\n\n---\n\n## ケース① 運用好調\n\n株式市場が好調。\n\n運用資産が増加。\n\n死亡保険金が、\n\n### **1,300万円**\n\nになった。\n\nその時点で死亡したら、\n\n→ **1,300万円**\n\nということがあります。\n\n---\n\n## ケース② 運用不調\n\n市場が下落。\n\n計算上の変動保険金が減った。\n\nそれでも死亡保険金は、\n\n### **基本保険金額1,000万円**\n\nが最低保証されます。\n\n---\n\n## ケース③ 運用不調時に途中解約\n\n「死亡ではなく、解約します。」\n\nすると？\n\n……\n\n解約返戻金には最低保証がありません。\n\nたとえば、\n\n### 700万円\n\nまで下がっている可能性もあります。\n\n「ここで、“死亡保険金が1,000万円保証だから、解約しても1,000万円”と考えたらダメですよ。」\n\n---\n\n# 【積立利率変動型との違い】\n\n「㉕も戻しておきましょう。」\n\n### 積立利率変動型終身保険\n\n変動するもの\n→ **積立利率**\n\n市場金利などに応じて利率を見直す。\n\n---\n\n### 変額保険\n\n変動するもの\n→ **運用実績による保険金・解約返戻金など**\n\n株式・債券などを特別勘定で運用します。\n\n「“利率が変わる”のか、“運用結果によって金額が変わる”のか。ここを分けます。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n変額保険の資産は何という勘定で運用される？\n\n……\n\n### **特別勘定**\n\nです。\n\n---\n\n### Q2\n\n死亡保険金には最低保証がある？\n\n……\n\n### **あります。**\n\n**基本保険金額**が最低保証されます。\n\n---\n\n### Q3\n\nでは、解約返戻金や有期型の満期保険金にも最低保証がある？\n\n……\n\n### **ありません。**\n\n「はい。ここが一番大事です。」\n\n---\n\n# 【30秒復習】\n\n① **変額保険とは？**  \n→ 運用実績で保険金などが変動\n\n② **何で運用する？**  \n→ 株式・債券など\n\n③ **どこで運用？**  \n→ **特別勘定**\n\n④ **死亡保険金は？**  \n→ **基本保険金額の最低保証あり**\n\n⑤ **解約返戻金・満期保険金は？**  \n→ **最低保証なし**\n\n⑥ **種類は？**  \n→ **有期型・終身型**\n\n# 【一文で覚える】\n\n> **「変額保険は、特別勘定の運用実績で保険金などが変動するが、死亡保険金には基本保険金額の最低保証があり、解約返戻金や満期保険金には最低保証がない。」**\n\n「先輩、試験直前ならこれだけでもいいです。」\n\n### **死亡＝最低保証あり**\n\n### **解約・満期＝最低保証なし**\n\n「ここは絶対に逆にしないでくださいね。」\n\n次は **㉞「個人年金保険」** です。\n\n---", "chapter": 2}, {"n": 34, "title": "個人年金保険（こじんねんきんほけん）", "raw": "# 第2章 リスク管理㉞\n\n## 個人年金保険（こじんねんきんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**個人年金保険**です。」\n\n名前の通り、\n\n> **自分で保険料を積み立てて、将来、年金として受け取るための私的保険。**\n\n公的年金とは別ですよ。\n\n現役時代\n→ 保険料を払う・積み立てる\n\n老後\n→ 年金を受け取る\n\nという仕組みです。\n\nそしてFPで特に重要なのが、**年金の受取期間による分類**です。\n\n> **① 確定年金**  \n> **② 有期年金**  \n> **③ 終身年金**  \n> **④ 保証期間付終身年金**  \n> **⑤ 夫婦年金**\n\n「名前が多いですけど、結局見るのは2つだけ。」\n\n### **何年間受け取る？**\n\n### **途中で死亡したらどうなる？**\n\nこれで整理できます。\n\n---\n\n# B【詳しい解説｜まず基本構造】\n\n「先輩、30歳から60歳まで積み立てるとしましょう。」\n\n30歳  \n↓  \n↓ 保険料を積み立てる  \n↓  \n60歳  \n↓\n\n### 年金受取開始\n\nここから毎年一定額などを受け取ります。\n\n「公的年金だけでは老後資金が心配だから、自分でも準備しておこう、という使い方ですね。」\n\n---\n\n# ① 確定年金\n\n「まず一番大事です。」\n\n> **生死に関係なく、契約時に決めた一定期間、年金を受け取れるタイプ。**\n\nたとえば、\n\n### 10年確定年金\n\nなら、\n\n60歳\n↓\n70歳\n\nまで10年間受け取ります。\n\n---\n\n## 「途中で死亡したら？」\n\n「ここですよ。」\n\n60歳から受け取り開始。\n\n↓\n\n65歳で死亡。\n\n↓\n\n「残り5年分は消える？」\n\n……\n\n### **消えません。**\n\n残りの期間に対応する年金などを**遺族等が受け取ります。**\n\nだから、\n\n> **“10年間は確定している”から確定年金**\n\nなんです。\n\n---\n\n# ② 有期年金\n\n「次は確定年金と比較してください。」\n\n> **一定期間、生存している限り年金を受け取れるタイプ。**\n\nたとえば、\n\n### 10年有期年金\n\n60歳\n↓\n70歳\n\nまでが年金期間。\n\nでも、\n\n65歳で死亡したら？\n\n↓\n\n### **そこで年金支払い終了**\n\nが基本です。\n\n「つまり――」\n\n**確定年金**\n→ 死亡しても期間分は受け取れる\n\n**有期年金**\n→ 生きている間だけ\n\nです。\n\n---\n\n# ③ 終身年金\n\n「“終身”はもう分かりますよね？」\n\n> **被保険者が生存している限り、一生涯年金を受け取れるタイプ。**\n\n60歳\n↓\n70歳\n↓\n80歳\n↓\n90歳\n↓\n100歳……\n\n### 生きている限り受け取れる。\n\n「長生きリスクに強いですね。」\n\nただし一般的な終身年金では、\n\n受取開始後すぐ死亡\n↓\n\n### 年金終了\n\nとなる可能性があります。\n\n「え、それだと早く亡くなったら受取額が少なくなりますよね？」\n\n……そうなんです。\n\nそこで次。\n\n---\n\n# ④ 保証期間付終身年金\n\n「はい。“確定年金”と“終身年金”を少し合体させたように考えてください。」\n\nたとえば、\n\n### **10年保証期間付終身年金**\n\nなら、\n\n最初の10年間\n→ **受取りを保証**\n\nその後\n→ **本人が生存している限り受取り**\n\nとなります。\n\n---\n\n## 65歳で死亡したら？\n\n60歳から受取り開始。\n\n10年間の保証期間があります。\n\n65歳で死亡。\n\n↓\n\n保証期間が5年残っている。\n\n↓\n\n### **残りの保証期間分は遺族等が受け取れる。**\n\n---\n\n## 90歳まで生きたら？\n\n10年保証が終わっても本人が生存しています。\n\n↓\n\n### **90歳まで年金を受け取れます。**\n\n「つまり――」\n\n> **早く亡くなるリスクには保証期間、長生きするリスクには終身年金**\n\nという二段構えですね。\n\n---\n\n# ⑤ 夫婦年金\n\n「最後は夫婦です。」\n\n> **夫婦のどちらかが生存している限り、年金を受け取れるタイプ。**\n\nたとえば夫婦で加入。\n\n夫が先に死亡。\n\n↓\n\n妻は生存。\n\n↓\n\n### 年金継続。\n\nその後、妻も死亡。\n\n↓\n\n### 年金終了。\n\n「一人が亡くなった瞬間に家計の年金収入が全部なくなるのを避けやすい仕組みですね。」\n\n---\n\n# C【イメージ理解｜5つの蛇口】\n\n「先輩、年金を水が出る蛇口だと思ってください。」\n\n### ① 確定年金\n\n🚰「10年間は絶対に水を出します」\n\n本人が途中で死亡しても、\n→ 残りを遺族等へ\n\n---\n\n### ② 有期年金\n\n🚰「10年間という上限はあります。でも本人が生きている間だけです」\n\n死亡\n→ **ストップ**\n\n---\n\n### ③ 終身年金\n\n🚰「本人が生きている限り出します」\n\n100歳まで生存\n→ 100歳まで\n\n死亡\n→ ストップ\n\n---\n\n### ④ 保証期間付終身年金\n\n🚰「最初の10年間は保証します。その後も生きていたら出し続けます」\n\n**保証＋終身**\n\nですね。\n\n---\n\n### ⑤ 夫婦年金\n\n🚰🚰\n\n夫または妻の、\n\n### **どちらかが生存している限り**\n\n年金を受け取る。\n\n「はい。名前より、この蛇口がいつ止まるかを考えてください。」\n\n---\n\n# D【具体例｜60歳から年120万円】\n\n「先輩、全部同じ条件で比べます。」\n\n60歳から、\n\n### 年120万円\n\nを受け取るとしましょう。\n\n---\n\n## 10年確定年金\n\n65歳で死亡。\n\n本来70歳まで。\n\n↓\n\n### 残りの期間分も遺族等が受け取る。\n\n---\n\n## 10年有期年金\n\n65歳で死亡。\n\n↓\n\n### 65歳で終了。\n\n---\n\n## 終身年金\n\n90歳まで生存。\n\n↓\n\n### 90歳まで受取り。\n\n---\n\n## 10年保証期間付終身年金\n\n65歳で死亡。\n\n↓\n\n残りの保証期間分\n→ **遺族等が受取り**\n\n90歳まで生存。\n\n↓\n\n### **90歳まで本人が受取り。**\n\n「早死ににも長生きにも対応しやすい形ですね。」\n\n---\n\n# 【ここが超重要｜確定と有期】\n\n「先輩、この2つは絶対に混ぜないでください。」\n\n### 確定年金\n\n10年間\n→ **受取りそのものが確定**\n\n本人死亡\n→ 遺族等が残りを受け取る\n\n### 有期年金\n\n10年間\n→ **受取可能な期間が決まっているだけ**\n\n本人死亡\n→ 年金終了\n\n「“10年”という数字が同じでも、中身は全然違います。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n10年確定年金で、受取開始5年後に死亡したら？\n\n……\n\n### **残りの期間分を遺族等が受け取ります。**\n\n---\n\n### Q2\n\n10年有期年金で、受取開始5年後に死亡したら？\n\n……\n\n### **原則としてそこで年金は終了します。**\n\n「確定との違いですね。」\n\n---\n\n### Q3\n\n保証期間付終身年金とは？\n\n……\n\n### **一定期間の受取りを保証し、その期間終了後も本人が生存している限り年金を受け取れるタイプ。**\n\n「はい。ここまで言えれば十分です。」\n\n---\n\n# 【30秒復習】\n\n① **確定年金**  \n→ 一定期間の受取りが確定\n\n② **有期年金**  \n→ 一定期間、生存中のみ\n\n③ **終身年金**  \n→ 生存している限り一生涯\n\n④ **保証期間付終身年金**  \n→ **一定期間保証＋その後も生存中は一生涯**\n\n⑤ **夫婦年金**  \n→ 夫婦のどちらかが生存している限り\n\n⑥ **確定と有期の最大の違い**  \n→ **死亡後も残りを受け取れるか**\n\n# 【一文で覚える】\n\n> **「個人年金保険は老後資金を自分で準備する保険で、確定は“期間を保証”、有期は“期間内の生存中”、終身は“生きている限り”。」**\n\n「先輩、種類が多くても見る場所は同じです。」\n\n**いつまで？**  \n＋  \n**途中で死んだら？**\n\nこの2問を当てれば整理できます。\n\nそして次は、これに**運用実績によって年金額が変わる仕組み**を加えます。\n\n次は **㉟「変額個人年金保険」** です。\n\n---", "chapter": 2}, {"n": 35, "title": "変額個人年金保険（へんがく・こじんねんきんほけん）", "raw": "# 第2章 リスク管理㉟\n\n## 変額個人年金保険（へんがく・こじんねんきんほけん）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は前回の**個人年金保険**と、㉝の**変額保険**を合体させると分かります。」\n\n> **変額保険 ＋ 個人年金保険  \n> ＝ 変額個人年金保険**\n\n一言でいうと、\n\n> **保険料を株式や債券などで運用し、その運用実績によって将来受け取る年金額などが変動する個人年金保険。**\n\nそして最重要ポイントです。\n\n> **運用リスクは契約者が負います。**\n\nつまり、\n\n運用好調\n→ 将来受け取れる金額が増える可能性\n\n運用不調\n→ 減る可能性\n\nがあります。\n\n「“保険会社が絶対に増やして返してくれる商品”ではありませんよ。」\n\n---\n\n# B【詳しい解説｜普通の個人年金保険と何が違う？】\n\n「まず前回の個人年金保険。」\n\n現役時代\n↓\n保険料を積み立てる\n↓\n60歳など\n↓\n\n### 年金を受け取る\n\nでした。\n\n変額個人年金保険も基本的な目的は、\n\n### **老後資金の準備**\n\nです。\n\nただし、大きく違うのが、\n\n### **運用**\n\nなんです。\n\n---\n\n## 特別勘定で運用する\n\n「㉝の変額保険で出ましたね。」\n\n変額個人年金保険でも、一般に資産を、\n\n### **特別勘定**\n\nで運用します。\n\nその中で、\n\n**国内株式\n外国株式\n国内債券\n外国債券**\n\nなどの商品・資産を組み合わせて運用します。\n\n---\n\n## 運用がうまくいったら？\n\n100万円\n↓\n運用\n↓\n120万円\n↓\n150万円……\n\n積立金が増えれば、\n\n> **将来受け取れる年金原資などが増える可能性**\n\nがあります。\n\n---\n\n## 運用が悪かったら？\n\n100万円\n↓\n80万円\n↓\n70万円……\n\nとなる可能性もあります。\n\n「その結果、将来の年金原資なども減る可能性があります。」\n\n---\n\n# 「損したら保険会社が補填してくれる？」\n\n「……先輩、それはダメです。」\n\n変額個人年金保険では、\n\n> **運用実績による損益は契約者に帰属します。**\n\nつまり、\n\n### 運用リスク＝契約者\n\nです。\n\n「ここは㉝の変額保険と同じ考え方ですね。」\n\n---\n\n# 「最低保証はある？」\n\n「はい。ここがちょっと厄介です。」\n\n変額個人年金保険は商品によって、\n\n**死亡給付金などに最低保証があるタイプ**\n\nがあります。\n\n一方で、\n\n> **年金原資や解約返戻金などについては、最低保証がない商品があります。**\n\nまた、最低保証を設けた商品も存在するため、具体的な保証内容は契約によって異なります。\n\n「だから試験では、何について最低保証があるのかを問題文で確認してください。」\n\n---\n\n# ㉝「変額保険」と何が違う？\n\n「先輩、ここで比較します。」\n\n### 変額保険\n\n主な目的\n→ **死亡保障**\n\n運用実績\n→ 保険金・解約返戻金などが変動\n\n死亡保険金\n→ **基本保険金額の最低保証あり**\n\n---\n\n### 変額個人年金保険\n\n主な目的\n→ **老後資金・年金準備**\n\n運用実績\n→ 年金原資などが変動\n\n「つまり――」\n\n> **変額保険＝死亡保障を軸に運用**\n>\n> **変額個人年金＝老後の年金を軸に運用**\n\nです。\n\n---\n\n# 「投資信託と同じなの？」\n\n「先輩、似ていますけど同じではありません。」\n\n株式・債券などを組み合わせて運用する点では、投資信託に近い面があります。\n\nでも変額個人年金保険は、\n\n### **生命保険商品**\n\nです。\n\nそのため、\n\n死亡給付金\nなどの**保険機能**を持っています。\n\n「投資だけではなく、保険の仕組みも組み合わされているわけですね。」\n\n---\n\n# C【イメージ理解｜老後に向かって育てる木】\n\n「先輩、30歳で木を一本植えると思ってください。」\n\n🌱 30歳\n\n毎月、水を与える。\n\n＝ **保険料**\n\nそのお金を、\n\n株式・債券などで運用する。\n\n---\n\n運用好調なら、\n\n🌱\n↓\n🌳\n↓\n🌳🌳\n\n大きく育つ。\n\n↓\n\n老後に受け取れる年金原資も大きくなる可能性。\n\n---\n\nでも運用不調なら、\n\n🌱\n↓\n🌿\n\n思ったほど育たない。\n\n「そして、“育たなかった分を必ず保険会社が埋めてくれる”とは限りません。」\n\nだから、\n\n> **大きく育つ可能性と、減ってしまうリスクを両方持つ**\n\nのが変額個人年金保険です。\n\n---\n\n# D【具体例｜500万円を運用】\n\n「仕組みを見るために単純化しますね。」\n\nAさんが老後資金として、\n\n### 500万円\n\nを変額個人年金保険で運用するとします。\n\n---\n\n## ケース① 運用好調\n\n株式市場などが好調。\n\n500万円\n↓\n600万円\n↓\n700万円\n\n年金受取開始時に、\n\n### 年金原資700万円\n\nとなった。\n\n↓\n\nその金額をもとに年金を受け取ります。\n\n---\n\n## ケース② 運用不調\n\n500万円\n↓\n450万円\n↓\n350万円\n\nとなった。\n\n最低保証のない契約なら、\n\n### 年金原資350万円\n\nとなる可能性があります。\n\n「払った500万円が必ず500万円以上になる、とは限らないんですね。」\n\n---\n\n# 「途中で解約したら？」\n\n「ここも重要です。」\n\n解約時には、\n\n### **解約返戻金**\n\nを受け取ります。\n\nしかし運用実績が悪ければ、\n\n> **払込保険料総額を下回る可能性があります。**\n\nさらに商品によっては、契約初期の解約控除などの費用が影響することもあります。\n\n「つまり、短期間で気軽に出し入れする普通預金みたいな商品ではありません。」\n\n---\n\n# 【個人年金との比較】\n\n||定額個人年金|変額個人年金|\n|-|-|-|\n|老後資金準備|○|○|\n|運用|保険会社|**特別勘定**|\n|年金原資|比較的安定|**運用実績で変動**|\n|運用リスク|保険会社側が中心|**契約者**|\n|大きく増える可能性|限定的|**あり**|\n|元本割れリスク|商品による|**あり**|\n\n「“変額”が付いた瞬間、**運用実績によって変わる**と反応してください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n変額個人年金保険の資産は主に何という勘定で運用する？\n\n……\n\n### **特別勘定。**\n\n「㉝と同じですね。」\n\n---\n\n### Q2\n\n運用が悪化した場合のリスクを負うのは？\n\n……\n\n### **契約者。**\n\nこれが重要です。\n\n---\n\n### Q3\n\n普通の個人年金保険との大きな違いは？\n\n……\n\n### **運用実績によって将来の年金原資などが変動すること。**\n\n「はい。ここまで分かれば十分です。」\n\n---\n\n# 【30秒復習】\n\n① **目的は？**  \n→ 老後資金の準備\n\n② **何で運用？**  \n→ 株式・債券など\n\n③ **どこで運用？**  \n→ **特別勘定**\n\n④ **何が変わる？**  \n→ 年金原資など\n\n⑤ **運用リスクは誰？**  \n→ **契約者**\n\n⑥ **元本割れは？**  \n→ **あり得る**\n\n# 【一文で覚える】\n\n> **「変額個人年金保険は、特別勘定で株式・債券などを運用し、その成果によって将来の年金原資などが変動する、契約者が運用リスクを負う個人年金保険。」**\n\n「先輩、㉝と㉟を最後に一本だけ。」\n\n**変額保険**\n→ 運用しながら**死亡保障**\n\n**変額個人年金保険**\n→ 運用しながら**老後の年金準備**\n\n「どちらも**特別勘定＋運用リスクは契約者**。目的が違う、と整理してください。」\n\n次は **㊱「かんぽ保険」** です。\n\n---", "chapter": 2}, {"n": 36, "title": "かんぽ保険", "raw": "# 第2章 リスク管理㊱\n\n## かんぽ保険\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**かんぽ保険**です。ここは“普通の民間生命保険との違い”を軸にすると覚えやすいですよ。」\n\nかんぽ保険とは、\n\n> **株式会社かんぽ生命保険が取り扱う生命保険。**\n\n「昔の郵便局の簡易保険とつながりがあるので、“国の保険なの？”と思いやすいんですが、現在は**かんぽ生命という生命保険会社の商品**です。」\n\nそしてFPで押さえたい特徴は、\n\n> **加入限度額が設けられている**\n\nことです。\n\n---\n\n# B【詳しい解説｜なぜ「かんぽ」って特別扱いされるの？】\n\n「まず歴史を少しだけ知っておきましょう。」\n\n昔は、\n\n### **簡易生命保険（簡易保険）**\n\nという国営の保険事業がありました。\n\n郵便局で扱われていたので、\n\n「郵便局の保険」\n\nというイメージが強いんですね。\n\nその後、郵政民営化によって、\n\n### **株式会社かんぽ生命保険**\n\nが誕生しました。\n\n「なので、現在の新しい契約については“国営の簡易保険”ではなく、**かんぽ生命の生命保険**として考えます。」\n\n---\n\n# 「じゃあ郵便局ではもう扱ってないの？」\n\n「いえ、そこは別です。」\n\nかんぽ生命の商品は、\n\n### 郵便局\n\nでも取り扱われています。\n\nつまり、\n\n**保険会社**\n→ かんぽ生命\n\n**身近な販売・手続きの窓口**\n→ 郵便局など\n\nというイメージです。\n\n「“郵便局で売っている＝郵便局そのものが保険会社”ではない、ということですね。」\n\n---\n\n# かんぽ保険の特徴①\n\n## 加入限度額がある\n\n「ここがFPで重要です。」\n\nかんぽ生命の保険には、\n\n> **法令上、被保険者1人について加入できる保険金額に限度があります。**\n\nつまり、\n\n「死亡保障を好きなだけ1億円、2億円……」\n\nとはできません。\n\n---\n\n「なぜ？」\n\n……\n\nかんぽ生命は、郵政民営化の経緯から、一般の生命保険会社とは異なるルールが設けられているからです。\n\n「試験では細かい金額だけを追いかけるより、まず**“加入限度額あり”**を固定しましょう。」\n\n---\n\n# 特徴②\n\n## 保険商品としては民間の生命保険\n\n「ここ、勘違いしやすいですよ。」\n\n### 昔の簡易保険\n\n→ 国営事業だった\n\n### 現在のかんぽ生命\n\n→ **株式会社**\n\nしたがって、\n\n> **現在のかんぽ生命の保険を、そのまま“国営保険”と覚えるのは誤り**\n\nです。\n\n---\n\n# 「昔の簡易保険はどうなったの？」\n\n「そこ気になりますよね。」\n\n郵政民営化より前に契約された旧簡易生命保険契約については、現在のかんぽ生命の新契約とは区別して扱われています。\n\n「なのでFPでは、」\n\n**旧簡易保険**\nと\n**現在のかんぽ生命の商品**\n\nを同じものとして雑にまとめない。\n\nこれが大事です。\n\n---\n\n# C【イメージ理解｜郵便局の看板の奥を見る】\n\n「先輩、郵便局に行ったとします。」\n\n🏣\n\n窓口で、\n\n「生命保険に入りませんか？」\n\nと言われる。\n\nそこで、\n\n「郵便局で契約するんだから、国がやっている保険だ！」\n\n……\n\n「ちょっと待ってください。そこは違います。」\n\n看板の奥を見ると、\n\n🏣 郵便局  \n↓  \n📄 保険商品  \n↓  \n🏢 **かんぽ生命保険**\n\nという関係です。\n\nそして、かんぽ生命には、\n\n🚧 **加入限度額**\n\nという柵がある。\n\n「この絵で覚えてください。」\n\n---\n\n# D【具体例｜田中さんが郵便局で保険を検討】\n\n「田中さんが近所の郵便局へ行ったとします。」\n\n郵便局で、\n\n> 「将来に備えて生命保険を検討したいです」\n\nと相談しました。\n\nそこで、かんぽ生命の商品を案内された。\n\nこのとき、\n\n「郵便局で申し込むから国営保険」\n\nではありません。\n\n現在の保険契約は、\n\n### **かんぽ生命保険の商品**\n\nです。\n\nそして加入にあたっては、\n\n### **法令上の加入限度額**\n\nも関係してきます。\n\n---\n\n# 【ここは区別｜昔と今】\n\n「試験問題で混ぜられたら、時間軸を見てください。」\n\n### 昔\n\n**簡易生命保険**\n\n→ 国営の保険事業\n\n↓\n\n郵政民営化\n\n↓\n\n### 現在\n\n**株式会社かんぽ生命保険**\n\n→ 生命保険会社\n\n「“かんぽ＝今も国営”ではありません。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n現在、かんぽ保険を提供している保険会社は？\n\n……\n\n### **株式会社かんぽ生命保険**\n\nです。\n\n---\n\n### Q2\n\nかんぽ生命の保険には、加入できる保険金額について制限がある？\n\n……\n\n### **あります。**\n\n被保険者1人について、法令上の**加入限度額**があります。\n\n---\n\n### Q3\n\n「現在のかんぽ生命は国営の生命保険事業である。」\n\n○か×か？\n\n……\n\n### **×です。**\n\n「昔の簡易保険と混同しないでくださいね。」\n\n---\n\n# 【30秒復習】\n\n① **現在の保険会社は？**  \n→ 株式会社かんぽ生命保険\n\n② **身近な窓口は？**  \n→ 郵便局など\n\n③ **昔は？**  \n→ 簡易生命保険という国営事業\n\n④ **現在は国営？**  \n→ **違う**\n\n⑤ **特徴的な制限は？**  \n→ **加入限度額**\n\n⑥ **旧簡易保険と現在の新契約は？**  \n→ **区別して考える**\n\n# 【一文で覚える】\n\n> **「かんぽ保険は、郵政民営化後の株式会社かんぽ生命保険が取り扱う生命保険で、法令上の加入限度額が設けられている。」**\n\n「はい、先輩。ここは細かい商品名よりも、まず――」\n\n**昔＝国営の簡易保険**  \n↓  \n**民営化**  \n↓  \n**現在＝かんぽ生命**  \n＋  \n**加入限度額あり**\n\nこの流れを残してください。\n\n次は **㊲「共済」** です。\n\n---", "chapter": 2}, {"n": 37, "title": "共済（きょうさい）", "raw": "# 第2章 リスク管理㊲\n\n## 共済（きょうさい）\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は**共済**です。生命保険とかなり似て見えるので、まず“誰が運営しているか”から分けますよ。」\n\n共済とは、一言でいうと、\n\n> **組合員などがお金を出し合い、死亡・病気・事故・火災などが起きた人をみんなで助ける保障制度。**\n\nイメージは、\n\n**みんなでお金を出す**\n↓\n💰💰💰【共通のお金】\n↓\n誰かに事故・病気などが発生\n↓\n**共済金を支払う**\n\nです。\n\n「“共に済ける（たすける）”と書いて共済。つまり**相互扶助**が核なんです。」\n\n---\n\n# B【詳しい解説｜保険と何が違うの？】\n\n「先輩、たぶん最初にこう思いますよね。」\n\n> 「病気や死亡のときにお金が出るなら、生命保険と同じじゃない？」\n\n「そう思いますよね。でも、制度上は区別されます。」\n\nたとえば生命保険会社なら、\n\n契約者\n↓\n保険料\n↓\n🏢生命保険会社\n↓\n死亡・病気など\n↓\n保険金・給付金\n\nという仕組み。\n\n一方、共済は、\n\n組合員など\n↓\n共済掛金\n↓\n🤝共済\n↓\n死亡・病気・事故など\n↓\n\n### **共済金**\n\nという仕組みです。\n\n---\n\n# 「保険会社が運営しているんじゃないの？」\n\n「そこ、重要です。」\n\n代表的な共済には、\n\n### JA共済\n\n### こくみん共済 coop\n\n### 都道府県民共済\n\nなどがあります。\n\nつまり、一般の生命保険会社が販売する生命保険とは、**運営主体や根拠となる法律・監督の仕組みが異なります。**\n\n「“保障商品＝全部保険会社”ではないんですね。」\n\n---\n\n# 共済の基本思想\n\n## 相互扶助\n\n「ここが一番大事です。」\n\n100人が、\n\n💰💰💰💰💰\n\n少しずつお金を出し合う。\n\nそのうち1人が事故に遭った。\n\n↓\n\nみんなで集めたお金から、\n\n### 共済金を支払う。\n\nこれが、\n\n> **相互扶助＝お互いに助け合う**\n\nという考え方です。\n\n「保険にも同じような助け合いの仕組みがありますが、共済では特にこの相互扶助の性格が前面に出ています。」\n\n---\n\n# 「誰でも入れるの？」\n\n「ここも生命保険との違いとして押さえてください。」\n\n共済は基本的に、\n\n> **一定の地域・職業・団体などの構成員を対象**\n\nとする制度です。\n\nそのため、利用するには組合員になるなど、一定の資格・手続きが必要な場合があります。\n\n「ただし、実際には出資金を払って組合員になれば利用できる共済もあるので、“ものすごく閉鎖的”と覚える必要はありません。」\n\n---\n\n# 共済で何に備えられる？\n\n「共済＝死亡だけ、ではありませんよ。」\n\nたとえば、\n\n**死亡**\n→ 生命系の共済\n\n**病気・入院**\n→ 医療系\n\n**交通事故・ケガ**\n→ 傷害系\n\n**住宅の火災・自然災害**\n→ 建物系\n\nなどがあります。\n\n「つまり生命保険・医療保険・損害保険に似た保障を、共済という仕組みでも準備できるわけです。」\n\n---\n\n# 「共済の掛金は安いの？」\n\n「一般的に、比較的手頃な掛金の商品が多いのは特徴の一つです。」\n\nただし、\n\n> **共済なら必ず民間保険より安い**\n\nとは限りません。\n\n保障内容や年齢、商品によって違います。\n\n「“共済＝絶対安い”と丸暗記するのはやめましょう。」\n\n見るべきなのは、\n\n**掛金**\nだけではなく、\n\n**保障額\n保障期間\n保障範囲**\n\nです。\n\n---\n\n# 「余ったお金はどうなる？」\n\n「先輩、ここも共済でよく出てくる言葉があります。」\n\n### **割戻金（わりもどしきん）**\n\nです。\n\n共済の収支で剰余が生じた場合などに、\n\n> **掛金の一部が組合員へ戻されることがある**\n\nという仕組みです。\n\nただし、\n\n「必ず毎年いくら戻る」\n\nというものではありません。\n\n「生命保険で勉強した**配当金**と少し似たイメージですね。」\n\n---\n\n# C【イメージ理解｜町のみんなの大きな貯金箱】\n\n「先輩、100人が住んでいる村を想像してください。」\n\n村の真ん中に、\n\n## 🐷💰巨大な貯金箱\n\nがあります。\n\n毎月、\n\nAさん → 💰  \nBさん → 💰  \nCさん → 💰  \nDさん → 💰\n\nみんなで少しずつ入れます。\n\nある日、\n\n🔥「Aさんの家が火事になった！」\n\nすると、\n\n🐷💰\n↓\n💴💴💴\n↓\nAさん\n\nみんなで集めたお金から助ける。\n\n別の日には、\n\n🏥「Bさんが入院した！」\n\n↓\n\nまた共通のお金から助ける。\n\n「これが共済の**相互扶助**です。」\n\n---\n\n# D【具体例｜県民共済に加入】\n\n「Aさんが、地域の共済に加入したとします。」\n\nAさん\n↓\n組合員になる\n↓\n毎月掛金を支払う\n↓\n病気で入院\n↓\n契約内容に応じて\n\n### **共済金を受け取る**\n\n「仕組みだけ見ると医療保険に似ていますよね。」\n\nでも、\n\n### 生命保険会社の医療保険\n\nではなく、\n\n### **共済制度**\n\nを利用している。\n\nここを区別します。\n\n---\n\n# 【生命保険と共済を比較】\n\n||民間保険|共済|\n|-|-|-|\n|お金|保険料|**共済掛金**|\n|受け取るお金|保険金・給付金|**共済金**|\n|基本的な考え|リスクへの保障|**相互扶助**|\n|運営|保険会社|**各共済団体など**|\n|加入|商品条件を満たす人|**組合員等が基本**|\n|剰余|配当がある商品も|**割戻金が出る場合も**|\n\n「名称までセットで覚えると強いですよ。」\n\n**保険 → 保険料 → 保険金**\n\n**共済 → 共済掛金 → 共済金**\n\nです。\n\n---\n\n# 【理解確認】\n\n### Q1\n\n共済の基本となる考え方は何？\n\n……\n\n### **相互扶助です。**\n\nみんなでお金を出し合って、困った人を助ける仕組みですね。\n\n---\n\n### Q2\n\n共済に支払うお金を何という？\n\n……\n\n### **共済掛金。**\n\nそして事故などが起きたときに受け取るのが、\n\n### **共済金**\n\nです。\n\n---\n\n### Q3\n\n「共済はすべて生命保険会社が保険業法に基づいて運営している。」\n\n○か×か？\n\n……\n\n### **×です。**\n\n「ここ、注意ですよ。」\n\n共済にはそれぞれの運営主体・根拠法などがあり、一般の保険会社の商品と同じ制度ではありません。\n\n---\n\n# 【30秒復習】\n\n① **共済とは？**  \n→ みんなで掛金を出し合って助け合う制度\n\n② **基本思想は？**  \n→ **相互扶助**\n\n③ **払うお金は？**  \n→ **共済掛金**\n\n④ **受け取るお金は？**  \n→ **共済金**\n\n⑤ **剰余が生じた場合などに戻るお金は？**  \n→ **割戻金**\n\n⑥ **生命保険会社の商品とまったく同じ？**  \n→ **違う**\n\n# 【一文で覚える】\n\n> **「共済は、組合員などが共済掛金を出し合い、死亡・病気・事故・災害などが起きたときに共済金を支払う“相互扶助”の制度。」**\n\n「はい、先輩。ここは難しく考えなくて大丈夫です。」\n\n### **共済＝みんなで出す → 困った人をみんなで助ける**\n\nまずこの芯を残してください。\n\nそして次から、また生命保険の**特約**に戻ります。\n\n次は **㊳「災害割増特約と傷害特約」** です。\n\n---", "chapter": 2}, {"n": 38, "title": "災害割増特約と傷害特約", "raw": "# 第2章 リスク管理㊳\n\n## 災害割増特約と傷害特約\n\n### A【要点｜まず全体を掴みましょう】\n\n「はい、先輩。今回は名前が似ていて混ざりやすい**災害割増特約**と**傷害特約**です。」\n\nまず共通点から。\n\n> **どちらも、不慮の事故などによる死亡・障害に備える特約です。**\n\n「じゃあ何が違うの？」\n\n……そこです。\n\n### 災害割増特約\n\n→ **不慮の事故などで死亡・高度障害になった場合**に、保険金を上乗せ。\n\n### 傷害特約\n\n→ **不慮の事故などによる死亡**に加えて、所定の**身体障害状態**になった場合にも、その程度に応じて給付。\n\n一番簡単に覚えるなら、\n\n> **災害割増＝死亡・高度障害を上乗せ**\n>\n> **傷害特約＝死亡＋もっと広い身体障害**\n\nです。\n\n---\n\n# B【詳しい解説｜まず「不慮の事故」って何？】\n\n「先輩、“災害”と聞いて地震や台風だけを想像していませんか？」\n\nちょっと待ってください。\n\nここでいう災害は、それだけではありません。\n\nたとえば、\n\n🚗 交通事故  \n🚲 転倒事故  \n🔥 火災による事故\n\nなどの、\n\n### **急激・偶発・外来の事故**\n\nが中心です。\n\n「突然、偶然、身体の外から起こった事故、というイメージですね。」\n\n---\n\n# ① 災害割増特約\n\n「まずはこっち。」\n\n主契約の生命保険が、\n\n### 死亡保険金1,000万円\n\nだったとします。\n\nそこに、\n\n### 災害割増特約500万円\n\nを付ける。\n\n---\n\n## 病気で死亡した場合\n\n主契約\n→ **1,000万円**\n\n災害割増特約\n→ 原則対象外\n\n合計\n→ **1,000万円**\n\n---\n\n## 不慮の事故で死亡した場合\n\n主契約\n→ 1,000万円\n\n＋\n\n災害割増特約\n→ 500万円\n\n＝\n\n### **1,500万円**\n\n「事故による死亡なので保障を“割り増す”。だから災害**割増**特約です。」\n\n---\n\n# 高度障害もポイント\n\n災害割増特約では、不慮の事故によって、\n\n### **所定の高度障害状態**\n\nになった場合も保障対象となります。\n\nたとえば非常に重い障害状態ですね。\n\n「ここで覚えてほしいのは、**高度障害という重いライン**です。」\n\n---\n\n# ② 傷害特約\n\n「次が傷害特約です。」\n\nこちらも、\n\n### 不慮の事故による死亡\n\nなどを保障します。\n\nでも、それだけではありません。\n\n事故によって、\n\n> **所定の身体障害状態**\n\nになった場合、\n\n障害の程度に応じて、\n\n### **障害給付金**\n\nが支払われます。\n\n「ここが災害割増特約との大きな違いです。」\n\n---\n\n# 「高度障害と身体障害って同じじゃないの？」\n\n「いいえ。ここを分けます。」\n\n### 高度障害\n\n非常に重い障害状態。\n\n↓\n\n災害割増特約でも対象になります。\n\n---\n\n### 所定の身体障害\n\n高度障害ほど重くなくても、契約上定められた障害状態なら、\n\n↓\n\n### **傷害特約の障害給付金**\n\nの対象になることがあります。\n\n「つまり、傷害特約のほうが、事故による障害について細かく拾ってくれるイメージですね。」\n\n---\n\n# 「病気で身体障害になったら？」\n\n「先輩、ここで“傷害”という名前を見てください。」\n\n基本的には、\n\n> **不慮の事故による傷害**\n\nが対象です。\n\nたとえば病気が原因で所定の身体障害状態になったとしても、\n\n「身体障害になったんだから傷害特約！」\n\nとは限りません。\n\n### **原因が事故なのか**\n\nを見る必要があります。\n\n---\n\n# C【イメージ理解｜2つの安全ネット】\n\n「先輩、階段から転落したAさんを想像してください。」\n\n💥\n\nその下に2種類のネットがあります。\n\n---\n\n### 🥅 災害割増特約\n\n大きな文字で、\n\n**「死亡・高度障害」**\n\nと書いてあります。\n\n非常に重大な結果になったとき、\n\n### ドンッと保障を上乗せ。\n\n---\n\n### 🥅 傷害特約\n\nこちらには、\n\n**「死亡＋所定の身体障害」**\n\nと書いてある。\n\n死亡だけでなく、\n\n事故によって所定の身体障害状態になった場合にも、\n\n### 障害の程度に応じた給付\n\nがあります。\n\n「だから――」\n\n> **災害割増＝重大な結果をドンと上乗せ**\n>\n> **傷害＝障害状態まで細かく見る**\n\nというイメージです。\n\n---\n\n# D【具体例｜交通事故に遭った場合】\n\n「先輩、Aさんが生命保険に加入しています。」\n\n主契約\n→ 死亡保険金1,000万円\n\nさらに、\n\n災害割増特約\n→ 500万円\n\nを付けています。\n\n---\n\n## ケース① 病気で死亡\n\n主契約\n→ **1,000万円**\n\n災害割増\n→ 対象外\n\n---\n\n## ケース② 交通事故で死亡\n\n主契約\n→ 1,000万円\n\n＋\n\n災害割増\n→ 500万円\n\n＝\n\n### **1,500万円**\n\n---\n\n今度は傷害特約。\n\nAさんが交通事故で、\n\n### 所定の身体障害状態\n\nになった。\n\n死亡していません。\n\nそれでも契約条件に該当すれば、\n\n### **障害給付金**\n\nを受け取ることができます。\n\n「これが両者を分ける重要ポイントです。」\n\n---\n\n# 【2つを比較】\n\n||災害割増特約|傷害特約|\n|-|-|-|\n|不慮の事故による死亡|○|○|\n|所定の高度障害|○|○|\n|所定の身体障害|基本的に対象外|**○**|\n|イメージ|**重大時に上乗せ**|**障害まで広くカバー**|\n\n「試験では特に**傷害特約＝障害給付金**を結びつけてください。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\n交通事故で死亡した場合、死亡保障を上乗せする特約は？\n\n……\n\n### **災害割増特約**\n\nです。\n\n---\n\n### Q2\n\n事故によって死亡はしなかったものの、所定の身体障害状態になった。このとき障害給付金が支払われ
